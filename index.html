/* ============================================================
   ЧОМУ КУПОЛ СТРИБАВ

   Абсолютна орієнтація — це магнітометр плюс акселерометр. Магнітометр
   шумний сам по собі, а коли телефон піднімають у небо (а це наш основний
   режим), азимут із нього стає ще й погано визначеним: кути Ейлера при
   beta → 90° вироджуються, і alpha починає гуляти на десятки градусів від
   найменшого руху зап'ястка. Раніше сітка йшла прямо за цим виміром, лише
   злегка згладженим, — звідси ривки на поворотах і на нахилах.

   Тепер два контури:
     швидкий  — гіроскоп, який інтегрується сам по собі: гладкий, чесно
                передає кожен поворот руки, але поволі спливає;
     повільний — абсолютний вимір, яким ця орієнтація підтягується до світу.
                Нахил виправляється швидко (гравітація надійна), азимут —
                повільно і тим повільніше, чим гірше він визначений.

   Виходить, що поворот телефона видно миттєво, а смикання магнітометра
   розмазується на секунди й на око не помітне.
   ============================================================ */

/** Кут повороту екрана, з фолбеком на старий window.orientation */
function screenAngle() {
  if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
  if (typeof window.orientation === 'number') return window.orientation;
  return 0;
}

function oriAccept(q, absolute, src) {
  const t = now();
  ORI.q = NBK.quatNorm(q);
  ORI.absolute = absolute;
  ORI.src = src;
  ORI.ok = true;
  // джитер: наскільки скаче сира орієнтація між подіями
  if (ORI.lastT) {
    const d = NBK.quatAngle(ORI.q, ORI.qPrev || ORI.q);
    ORI.jitBuf.push(d);
    if (ORI.jitBuf.length > 40) ORI.jitBuf.shift();
    ORI.jitter = ORI.jitBuf.reduce((a, b) => a + b, 0) / ORI.jitBuf.length;
  }
  ORI.qPrev = ORI.q;
  ORI.lastT = t; ORI.count++;
  ORI.hzN++;
  if (t - ORI.hzT > 1000) { ORI.hz = ORI.hzN * 1000 / (t - ORI.hzT); ORI.hzT = t; ORI.hzN = 0; }
}

/* ---------- швидкий контур: кутова швидкість ---------- */

/** Кутова швидкість, рад/с у системі пристрою. Два способи, обидва пробуємо. */
function startGyroRate() {
  if (ORI.gyro || ORI.gyroSrc) return;
  const G = window.Gyroscope;
  if (G) {
    try {
      const s = new G({ frequency: 60 });
      s.addEventListener('reading', () => gyroSample(s.x, s.y, s.z));
      s.addEventListener('error', () => { ORI.gyroSrc = ''; ORI.gyro = null; startMotionRate(); });
      s.start();
      ORI.gyro = s; ORI.gyroSrc = 'Gyroscope';
      // якщо за півтори секунди відліків нема — переходимо на devicemotion
      setTimeout(() => { if (!ORI.gyroT) { try { s.stop(); } catch (e) { } ORI.gyro = null; ORI.gyroSrc = ''; startMotionRate(); } }, 1500);
      return;
    } catch (e) { }
  }
  startMotionRate();
}

/** devicemotion.rotationRate — градуси за секунду, alpha навколо Z, beta навколо X, gamma навколо Y */
function startMotionRate() {
  if (ORI.gyroSrc) return;
  const h = ev => {
    /* Заразом міряємо ТРЯСІННЯ. Кути нахилу телефон виводить із
       акселерометра, а той під час ходьби міряє не лише гравітацію, а й
       ривки кроків — і нахил починає танцювати в такт. Величина відхилення
       |a| від g каже, наскільки зараз можна вірити нахилу. */
    const g = ev.accelerationIncludingGravity;
    if (g && g.x != null) {
      const mag = Math.hypot(g.x || 0, g.y || 0, g.z || 0);
      const dev = Math.abs(mag - 9.81);
      ORI.shake = (ORI.shake || 0) * 0.9 + dev * 0.1;
    }
    const r = ev.rotationRate;
    if (!r || (r.alpha == null && r.beta == null && r.gamma == null)) return;
    gyroSample((r.beta || 0) * NBK.D2R, (r.gamma || 0) * NBK.D2R, (r.alpha || 0) * NBK.D2R);
  };
  window.addEventListener('devicemotion', h, true);
  ORI.motionHandler = h; ORI.gyroSrc = 'devicemotion.rotationRate';
  setTimeout(() => {
    if (!ORI.gyroT) {
      window.removeEventListener('devicemotion', h, true);
      ORI.motionHandler = null; ORI.gyroSrc = '';
    }
  }, 2000);
}

function stopGyroRate() {
  if (ORI.gyro) { try { ORI.gyro.stop(); } catch (e) { } ORI.gyro = null; }
  if (ORI.motionHandler) { window.removeEventListener('devicemotion', ORI.motionHandler, true); ORI.motionHandler = null; }
  ORI.gyroSrc = ''; ORI.gyroT = 0; ORI.qg = null;
  ORI.gvQ = null; ORI.gvQ0 = null; ORI.gvT = 0;
}

/* ---------- зсув нуля гіроскопа ----------
   Будь-який MEMS-гіроскоп навіть у повній нерухомості віддає не нуль, а
   кілька десятих градуса за секунду. За хвилину це вже градуси, і купол
   поволі відпливає — рівно те відчуття «як у морі». Зсув оцінюємо в ті
   миті, коли телефон справді стоїть, і далі просто вираховуємо. */
const STILL_RATE = 0.035;        // рад/с ≈ 2 °/с — нижче цього вважаємо спокоєм
const BIAS_TAU_S = 4;            // за скільки секунд оцінка зсуву доходить до правди

function gyroSample(wx, wy, wz) {
  const t = now();
  ORI.gyroN++;
  if (t - ORI.gyroHzT > 1000) { ORI.gyroHz = ORI.gyroN * 1000 / (t - ORI.gyroHzT); ORI.gyroHzT = t; ORI.gyroN = 0; }

  const dt = ORI.gyroT ? clamp((t - ORI.gyroT) / 1000, 0.001, 0.12) : 0;

  // спокій визначаємо по СИРІЙ швидкості: вона майже нуль тільки коли рук немає
  const mag = Math.sqrt(wx * wx + wy * wy + wz * wz);
  if (mag < STILL_RATE) {
    if (!ORI.stillT) ORI.stillT = t;
    // перші пів секунди не рахуємо — рука ще може дотягувати
    if (dt && t - ORI.stillT > 500) {
      const k = 1 - Math.exp(-dt / BIAS_TAU_S);
      ORI.bias[0] += (wx - ORI.bias[0]) * k;
      ORI.bias[1] += (wy - ORI.bias[1]) * k;
      ORI.bias[2] += (wz - ORI.bias[2]) * k;
      ORI.biasN++;
    }
  } else ORI.stillT = 0;

  const cx = wx - ORI.bias[0], cy = wy - ORI.bias[1], cz = wz - ORI.bias[2];
  ORI.w = [cx, cy, cz];

  /* Швидкість для ПРОГНОЗУ беремо не з останнього відліку, а як медіану
     трьох. Один дикий відлік трапляється і на справжніх телефонах: давач
     збився, або браузер після затримки вивалив накопичені події одна за
     одною з майже нульовим кроком часу. Помножений на сто мілісекунд
     прогнозу, такий відлік давав стрибок сітки градусів на тридцять —
     один кадр, але помітний. Медіана трьох його просто викидає. */
  ORI.wBuf.push([cx, cy, cz]);
  if (ORI.wBuf.length > 3) ORI.wBuf.shift();
  if (ORI.wBuf.length === 3) {
    const med = i => {
      const a = ORI.wBuf[0][i], b = ORI.wBuf[1][i], c = ORI.wBuf[2][i];
      return Math.max(Math.min(a, b), Math.min(Math.max(a, b), c));
    };
    ORI.wPred = [med(0), med(1), med(2)];
  } else ORI.wPred = [cx, cy, cz];

  /* Свідчення гіроскопа зважуємо довірою до нього. Якщо давач бреше —
     а буває і перевернутий знак, і чужий масштаб, і суцільні нулі, —
     вага падає до нуля, і купол переходить на компас. Множник плавний,
     тому переходу на око не видно. */
  /* Довіра має дві швидкості. Перевірка нижче — це зважений висновок за
     кілька секунд спостережень. Але поки вона думає, давач із перевернутим
     знаком уже тягне купол у протилежний бік. Тому є ще швидкий запобіжник:
     щойно розходження стає грубим, вага гіроскопа падає негайно, не чекаючи
     висновку. Помилитись тут не страшно — гірше за компас усе одно не буде. */
  const k = ORI.gyroTrust * (1 - ORI.panic);
  if (dt && ORI.qg) ORI.qg = NBK.quatIntegrate(ORI.qg, cx * k, cy * k, cz * k, dt);

  // швидка перевірка знаку: накопичуємо поворот по вертикалі за 300 мс
  if (dt && ORI.qg) {
    const M = NBK.quatToMatrix(ORI.qg);
    ORI.fgGyro += (M[2][0] * wx + M[2][1] * wy + M[2][2] * wz) * dt * NBK.R2D;
  }

  /* Окрема, нічим не виправлена інтеграція СИРОЇ швидкості. Саме з нею
     потім порівнюється те, що показав компас: якщо виправляти її дорогою,
     перевірка перевіряла б сама себе. */
  if (dt && ORI.gvQ) ORI.gvQ = NBK.quatIntegrate(ORI.gvQ, wx, wy, wz, dt);
  // найбільша пауза у вікні: по ній видно, чи взагалі можна робити висновок
  if (dt * 1000 > ORI.gvGap) ORI.gvGap = dt * 1000;
  ORI.gyroT = t;
}

/**
 * Швидка перевірка знаку — за третину секунди замість кількох.
 *
 * Повільна перевірка нижче зважує все як слід, але їй потрібні секунди
 * спостережень. А гіроскоп із перевернутим знаком за ці секунди встигає
 * потягнути купол градусів на двадцять. Тут же питання простіше й
 * відповідь швидша: компас каже, що телефон повернули праворуч, а давач —
 * що ліворуч. Двох різних знаків достатньо, щоб негайно перестати вірити
 * давачеві; величина при цьому не важлива.
 */
function gyroFastCheck(absQ, tNow) {
  if (ORI.fgPrev) ORI.fgAbs += NBK.yawErrorDeg(absQ, ORI.fgPrev);
  ORI.fgPrev = absQ;
  if (!ORI.fgT) { ORI.fgT = tNow; return; }
  if (tNow - ORI.fgT < 200) return;
  const a = ORI.fgAbs, g = ORI.fgGyro;
  ORI.fgT = tNow; ORI.fgAbs = 0; ORI.fgGyro = 0;

  /* Поріг низький навмисно. Тривога тут — це м'яка й зворотна річ: вага
     гіроскопа падає, купол веде компас. Помилитись на частку секунди
     дешевше, ніж півсекунди дивитись, як сітка їде не туди. */
  if (Math.abs(a) < 5) return;                  // руху замало, щоб судити
  if (Math.abs(g) > 1.5 && (g > 0) !== (a > 0)) {
    ORI.panic = 1;
    ORI.gyroWhy = 'знак навпаки';
    return;
  }
  /* Тут навмисно НЕ перевіряється «давач мовчить». Одиничний дикий відлік
     компаса виглядає точно так само: рух є, а гіроскоп його не бачить.
     Через це викиди починали проходити в кадр. Мовчазний давач нічого й не
     тягне — його спокійно ловить повільна перевірка за пару секунд. */
}

/**
 * Перевірка гіроскопа компасом.
 *
 * За вікно порівняння обидва давачі мусять зафіксувати ОДНАКОВИЙ поворот
 * навколо вертикалі. Компас шумний, але в середньому правдивий; гіроскоп
 * гладкий, але може брехати систематично. Тому: якщо за вікно компас
 * побачив помітний поворот, а гіроскоп — протилежний, утричі більший або
 * ніякий, довіра до гіроскопа падає, і купол починає вести компас.
 *
 * Це саме той випадок, коли «сітка живе своїм життям»: давач тягне картинку
 * не туди, а виправлення приходить надто повільно, щоб це виправити.
 */
function gyroVerify(absQ, tNow) {
  const ID = [0, 0, 0, 1];
  if (!ORI.gvT || !ORI.gvQ) {
    ORI.gvT = tNow; ORI.gvQ = absQ.slice(); ORI.gvQ0 = absQ.slice();
    return;
  }
  if (tNow - ORI.gvT < 1200) return;

  /* Порівнюємо ПОВНІ обертання, а не окремі кути.
     Перша версія цієї перевірки міряла поворот навколо вертикалі й через це
     давала хибну тривогу на будь-якому складному русі: коли телефон
     одночасно ведуть по азимуту й піднімають, накопичена вертикальна
     складова швидкості просто не дорівнює зміні азимута — обертання не
     переставні. Тому беремо обертання «від початку вікна до кінця» за
     кожним із давачів і питаємо, наскільки вони розходяться як обертання. */
  const dObs = NBK.quatMul(NBK.quatConj(ORI.gvQ0), absQ);
  const dGyro = NBK.quatMul(NBK.quatConj(ORI.gvQ0), ORI.gvQ);
  const obsAng = NBK.quatAngle(dObs, ID);
  const gyroAng = NBK.quatAngle(dGyro, ID);
  const mis = NBK.quatAngle(dGyro, dObs);
  const misInv = NBK.quatAngle(NBK.quatConj(dGyro), dObs);
  ORI.gvMis = mis; ORI.gvObs = obsAng; ORI.gvGyroAng = gyroAng; ORI.gvInv = misInv;

  const gap = ORI.gvGap;
  // нове вікно починаємо від поточної правди, щоб дрейф не накопичувався
  ORI.gvT = tNow; ORI.gvQ = absQ.slice(); ORI.gvQ0 = absQ.slice(); ORI.gvGap = 0;

  /* Коли вікно взагалі не дає права на висновок:
     мало руху — порівнювати нічого; велика пауза між відліками — сторінку
     приспали або кадр застряг, і розбіжність тут нічого не каже про давач. */
  if (obsAng < 15 || gap > 150) { ORI.gvVerdict = 'вікно не показове'; return; }

  const tol = Math.max(6, obsAng * 0.35);
  const ratio = gyroAng / Math.max(obsAng, 1);
  let want = 1, why = '';
  if (mis <= tol) want = 1;
  else if (gyroAng < obsAng * 0.2) { want = 0; why = 'давач мовчить під час повороту'; }
  else if (misInv <= tol) { want = 0; why = 'знак навпаки'; }
  else if (ratio > 1.8) { want = 0.15; why = 'масштаб завеликий (×' + ratio.toFixed(2) + ')'; }
  else if (ratio < 0.55) { want = 0.25; why = 'масштаб замалий (×' + ratio.toFixed(2) + ')'; }
  else { want = 0.5; why = 'осі не збігаються (' + mis.toFixed(0) + '°)'; }

  /* ДВА вікна підряд, а не одне.
     Одиничне погане вікно буває від затриманої події давача, пропущеного
     кадру або переходу сторінки у фон — це не брехня давача. Тому перше
     погане вікно лише береться на замітку, і тільки друге підряд знижує
     довіру. Помилково відібрати довіру у здорового гіроскопа — це втратити
     плавність там, де все було добре. */
  if (want < 0.85) {
    ORI.gvBad++;
    ORI.gvVerdict = 'підозра: ' + why;
    if (ORI.gvBad < 2) return;
  } else {
    ORI.gvBad = 0;
    ORI.gvVerdict = 'узгоджується (' + mis.toFixed(1) + '° розходження)';
  }

  const k = want < ORI.gyroTrust ? 0.6 : 0.35;
  ORI.gyroTrust = clamp(ORI.gyroTrust + (want - ORI.gyroTrust) * k, 0, 1);
  ORI.gyroWhy = ORI.gyroTrust < 0.85 ? (why || 'розходиться з компасом') : '';
}

/* ---------- джерела, за спаданням якості ---------- */

/** 1. Generic Sensor API: готовий кватерніон від фузії акселерометра, гіро і магнітометра */
function tryOrientationSensor() {
  return new Promise(resolve => {
    const Abs = window.AbsoluteOrientationSensor;
    if (!Abs) return resolve(false);
    let done = false;
    try {
      const s = new Abs({ frequency: 60, referenceFrame: 'device' });
      s.addEventListener('reading', () => {
        if (!s.quaternion) return;
        oriAccept(s.quaternion, true, 'AbsoluteOrientationSensor');
        if (!done) { done = true; resolve(true); }
      });
      s.addEventListener('error', ev => {
        try { s.stop(); } catch (e) { }
        if (!done) { done = true; resolve(false); }
      });
      s.start();
      ORI.sensor = s;
      setTimeout(() => { if (!done) { done = true; try { s.stop(); } catch (e) { } ORI.sensor = null; resolve(false); } }, 1500);
    } catch (e) { resolve(false); }
  });
}

/** 2. Абсолютна подія орієнтації — окремим обробником, без домішки відносної */
function tryAbsoluteEvent() {
  return new Promise(resolve => {
    let done = false;
    const h = ev => {
      if (ev.alpha == null) return;
      oriAccept(NBK.quatFromEuler(ev.alpha, ev.beta, ev.gamma), true, 'deviceorientationabsolute');
      if (!done) { done = true; resolve(true); }
    };
    window.addEventListener('deviceorientationabsolute', h, true);
    ORI.handler = { name: 'deviceorientationabsolute', fn: h };
    setTimeout(() => {
      if (!done) {
        done = true;
        window.removeEventListener('deviceorientationabsolute', h, true);
        ORI.handler = null; resolve(false);
      }
    }, 1500);
  });
}

/** 3. Звичайна подія. На iOS у ній є webkitCompassHeading — це справжня північ. */
function tryPlainEvent() {
  return new Promise(resolve => {
    let done = false;
    const h = ev => {
      if (ev.alpha == null && ev.webkitCompassHeading == null) return;
      /* ОСЬ ДЕ ЛАМАЛОСЬ, І ЦЕ БУЛА ГРУБА ПОМИЛКА.
         Раніше курс компаса підставлявся замість alpha прямо в кути Ейлера:
         alpha = 360 − heading. Виглядає природно, але heading в iOS — це
         азимут ОДНІЄЇ конкретної осі телефона, спроєктованої на горизонт.
         Щойно телефон нахиляють, проєкція тієї осі повзе, heading міняється
         разом із нахилом — і разом з ним обертався весь купол. Саме це й
         видно як «веду камеру вгору, а сторони світу крутяться».

         Тепер курс живе окремо: орієнтація будується з кутів, які дає
         гравітація і гіроскоп, а компас лишається ОДНИМ ЧИСЛОМ — поправкою
         азимута, і застосовується лише тоді, коли їй можна вірити. */
      const absolute = !!ev.absolute;
      if (ev.webkitCompassHeading != null && isFinite(ev.webkitCompassHeading)) {
        ORI.headDeg = norm360(+ev.webkitCompassHeading);
        ORI.headT = now();
        ORI.headAcc = ev.webkitCompassAccuracy;
        ORI.compassAcc = ev.webkitCompassAccuracy;
      }
      oriAccept(NBK.quatFromEuler(ev.alpha, ev.beta, ev.gamma), absolute,
        ORI.headDeg != null ? 'deviceorientation + компас iOS' : 'deviceorientation');
      // потребу в ручній привʼязці вирішує фузія: тут її чіпати не можна,
      // інакше кожна подія затирала б висновок, зроблений мить тому
      if (!done) { done = true; resolve(true); }
    };
    window.addEventListener('deviceorientation', h, true);
    ORI.handler = { name: 'deviceorientation', fn: h };
    /* Це ОСНОВНЕ джерело на iPhone, і саме тут не можна поспішати: після
       щойно наданого дозволу перша подія іноді йде довше за півтори
       секунди. Коротке вікно давало «жодне джерело не відповіло» на
       телефоні, де все насправді працює. */
    setTimeout(() => {
      if (!done) {
        done = true;
        window.removeEventListener('deviceorientation', h, true);
        ORI.handler = null; resolve(false);
      }
    }, 4000);
  });
}

/** 4. Останній рубіж: інтегруємо гіроскоп самі. Азимут відносний — північ задає оператор. */
function tryGyroIntegration() {
  return new Promise(resolve => {
    const G = window.Gyroscope;
    if (!G) return resolve(false);
    try {
      const s = new G({ frequency: 60 });
      let last = 0, q = [0, 0, 0, 1], started = false;
      s.addEventListener('reading', () => {
        const t = now();
        if (last) {
          const dt = clamp((t - last) / 1000, 0.001, 0.2);
          // мала кутова швидкість → приріст кватерніона
          const wx = s.x * dt / 2, wy = s.y * dt / 2, wz = s.z * dt / 2;
          q = NBK.quatNorm(NBK.quatMul(q, [wx, wy, wz, 1]));
          oriAccept(q, false, 'Gyroscope (інтегрування)');
          ORI.needNorth = true;
        }
        last = t;
        if (!started) { started = true; resolve(true); }
      });
      s.addEventListener('error', () => resolve(false));
      s.start();
      ORI.sensor = s;
      setTimeout(() => { if (!started) resolve(false); }, 1500);
    } catch (e) { resolve(false); }
  });
}

/* ============================================================
   ПІВНІЧ — ПРЯМО З КОМПАСА ТЕЛЕФОНА
   ───────────────────────────────────────────────────────────
   Дві скарги з поля поспіль — «постійно втрачає Пн» і «Пн з похибкою» —
   уже ПІСЛЯ «розумного» вибору між чотирма гіпотезами про те, яку вісь
   міряє курс. Розумне виявилось крихким, і ось чому саме:
     · курс із заявленою точністю гіршою за 35° не брався ВЗАГАЛІ. А в
       укритті, біля арматури й металевих дверей iOS майже завжди каже
       40–60°, хоч сам курс при цьому в межах десятка градусів. Північ не
       набиралась ніколи — це і є «втрачає Пн» при запуску;
     · кошики поз жили вічно, а відносний alpha в iOS поволі спливає:
       старі кошики розходились із новими, «жодна гіпотеза не тримається»,
       і за чотири секунди привʼязку ЗНІМАЛИ — «втрачає Пн» посеред роботи;
     · перемикання між гіпотезами міняло поправку стрибком на десятки
       градусів — «Пн з похибкою».

   Тепер так, як і просить людина: компас телефона — правда про сторони
   світу, і нічого не вгадуємо. Курс у iOS — це нахило-компенсований азимут
   напрямку «вперед»: плоско — верхній край екрана, стоячи — камера, між
   ними плавно. Саме так поводиться Компас у самому iPhone, і саме цю вісь
   ми беремо як опорну. Поправка півночі = курс − азимут цієї осі з
   орієнтації ОС; вона одна на всі пози.
     · перший же вимір дає північ — за пів секунди після старту, з будь-якої
       пози, і плоскої теж;
     · далі поправка йде за компасом усередненням по колу: стала 1.5 с при
       добрій точності і до ~8 с при поганій. Грубий вимір важить менше, але
       НЕ ВИКИДАЄТЬСЯ: краще північ ±40°, ніж ніякої, — і ці ±40° написані;
     · при повороті чи нахилі швидше за 25°/с виміри не беруться (курс іде
       рідше за орієнтацію і відстає від неї на пів-оберту), але північ
       ТРИМАЄТЬСЯ гіроскопом; якщо ж рух не вщухає понад 6 с — беремо й так,
       з малою вагою, бо людина, що йде, теж має право знати, де північ;
     · розходження понад 30°, що тримається довше за 1.2 с, — це не шум, а
       нова правда (iOS перевстановив опорну точку alpha або перекалібрував
       компас): поправка перестрибує одразу, без хвилинного доїжджання;
     · північ знімається ТІЛЬКИ разом із самим курсом: подій немає понад
       3 с — тримаємо останню поправку і пишемо «компас мовчить».
   Розкид поправки за останні 10 секунд — чесна оцінка похибки півночі;
   вона показується як ±N° і вирішує, ПН це чи ПН~.
   ============================================================ */

const HEAD_FRESH_MS = 500;       // курс старший — подій з курсом немає, тримаємо останню поправку
const HEAD_FROZEN_MS = 700;      // число курсу не міняється стільки …
const HEAD_FROZEN_TURN = 6;      // … а телефон за гіроскопом повернувся на стільки — курс завмер, не вимір
const HEAD_TILT_QUIET = 18;      // °/с — нахил швидше — курс відстає, вимір у поправку не йде
const HEAD_TURN_QUIET = 25;      // °/с — те саме для повороту навколо вертикалі
const HEAD_WIN_MS = 10000;       // вікно, по якому рахуємо розкид поправки
const HEAD_AXIS_MIN = 0.3;       // горизонтальна довжина опорної осі: менше — телефон лежить на боці, азимуту немає
const HEAD_TAU_S = 1.5;          // стала усереднення поправки при добрій точності
const HEAD_SNAP_DEG = 30;        // розходження понад це …
const HEAD_SNAP_MS = 1200;       // … що тримається стільки, — нова правда, а не викид
const HEAD_FORCE_MS = 6000;      // без жодного прийнятого виміру довше — беремо й у русі
const HEAD_CONFIRM_N = 10;       // від скількох вимірів у вікні північ вважаємо підтвердженою
const HEAD_CONFIRM_SPREAD = 15;  // і з яким розкидом
const HEAD_ACC_GOOD = 35;        // заявлена точність гірша — північ лише приблизна
const HEAD_NOISY_SPREAD = 45;    // розкид понад це — компас поруч із металом: попереджаємо, північ не знімаємо

/** Крен телефона навколо осі погляду: це ж і нахил горизонту на екрані */
function rollDeg(q) {
  const R = NBK.quatToMatrix(q);
  return Math.asin(clamp(R[2][0], -1, 1)) * NBK.R2D;
}

/* ============================================================
   ДВІ ОСІ, ЩО ЗБІГАЮТЬСЯ МАЙЖЕ ЗАВЖДИ

   Опорна вісь компаса — «вперед»: горизонтальна лінія площини «верх–камера»
   телефона (перпендикуляр до осі X у горизонті); плоско це верхній край,
   стоячи — камера, між ними плавно, без розриву на вертикалі. Так рахує
   нахило-компенсований компас, і саме цю вісь беремо за умовчанням (fwd).

   Єдине, чого документація Apple не каже: як курс поводиться при КРЕНІ,
   коли камера піднята. «Вперед» від крену повертається (при 30° вгору і
   25° крену — на 13°), азимут самої камери (cam) — ні. При нульовому крені
   обидві осі дають те саме число, тому вгадувати нема потреби: телефон сам
   покаже, яка з двох тримає сталу поправку в позах із креном, і та стане
   опорною. Вибір робиться раз, з великим запасом, і запамʼятовується.
   ============================================================ */
const HEAD_AXES = { fwd: 'вперед (нахило-компенсований курс)', cam: 'напрямок камери' };
const HEAD_AXIS_WIN_MS = 40000;   // вікно порівняння осей
const HEAD_AXIS_DIFF = 8;         // пози, де осі розходяться менше, нічого не кажуть
const HEAD_AXIS_MIN_N = 30;       // менше показових вимірів — рано судити
const HEAD_AXIS_RATIO = 0.6;      // переможець має бути стабільнішим щонайменше настільки
const HEAD_AXIS_SAVE_N = 60;      // від скількох показових вимірів вибір запамʼятовуємо

/** Азимути обох опорних осей у світі та їхні горизонтальні довжини (0…1) */
function headRefAz(M) {
  const col = k => [M[0][k], M[1][k], M[2][k]];
  const x = col(0), y = col(1), z = col(2);
  const az = v => norm360(Math.atan2(v[0], v[1]) * NBK.R2D);
  const cam = [-z[0], -z[1]], camM = Math.hypot(cam[0], cam[1]);
  let h = [x[1], -x[0]];                       // X_w × ẑ
  const fwdM = Math.hypot(h[0], h[1]);
  const camUp = -z[2] >= 0;                    // камера (−Z) на горизонті чи вище
  const ref = camUp ? cam : [y[0], y[1]];
  if (h[0] * ref[0] + h[1] * ref[1] < 0) h = [-h[0], -h[1]];
  return { fwd: az(h), fwdM, cam: az(cam), camM };
}

/** Розкид кільцевих величин: 90-й процентиль відхилень від медіани — стійкий до поодиноких викидів */
function angSpread90(vals) {
  if (vals.length < 3) return null;
  const med = NBK.medianAngle(vals);
  const dev = vals.map(v => Math.abs(norm180(v - med))).sort((a, b) => a - b);
  return dev[Math.min(dev.length - 1, Math.floor(dev.length * 0.9))];
}

/** Яка з двох осей тримає сталу поправку в позах із креном */
function headAxisEval(tNow) {
  const A = ORI.headAxisBuf;
  while (A.length && tNow - A[0].t > HEAD_AXIS_WIN_MS) A.shift();
  const tell = A.filter(x => x.diff >= HEAD_AXIS_DIFF);
  ORI.headAxisN = tell.length;
  if (tell.length < HEAD_AXIS_MIN_N) return;
  const sF = angSpread90(tell.map(x => x.f)), sC = angSpread90(tell.map(x => x.c));
  ORI.headAxisSpread = { fwd: sF, cam: sC };
  let winner = null;
  if (sC < sF * HEAD_AXIS_RATIO && sC <= 12) winner = 'cam';
  else if (sF < sC * HEAD_AXIS_RATIO && sF <= 12) winner = 'fwd';
  if (!winner) { ORI.headAxisVotes = 0; return; }
  if (winner === ORI.headAxis) {
    if (tell.length >= HEAD_AXIS_SAVE_N && S.set.headAxis !== winner) { S.set.headAxis = winner; saveSet(); }
    return;
  }
  // перемикаємось лише з двох оцінок поспіль — одна може бути збігом
  ORI.headAxisVotes = (ORI.headAxisVotes || 0) + 1;
  if (ORI.headAxisVotes < 2) return;
  ORI.headAxis = winner; ORI.headAxisVotes = 0;
  const vals = tell.map(x => winner === 'cam' ? x.c : x.f);
  ORI.northAuto = NBK.medianAngle(vals.slice(-40));
  ORI.headBuf = []; ORI.headSpreadDeg = null; ORI.headJumpT = 0;
  ORI.headAxisSwitched = (ORI.headAxisSwitched || 0) + 1;
  if (tell.length >= HEAD_AXIS_SAVE_N) { S.set.headAxis = winner; saveSet(); }
}

function compassStep(tNow) {
  if (ORI.headDeg == null) return;

  /* Схилення приходить із координатами, вже після перших вимірів. Поправка
     містить його доданком, тож нове схилення просто зсуває її — нічого не
     скидаємо і північ не втрачаємо. */
  const decl = declOffset();
  if (ORI.headDecl == null) ORI.headDecl = decl;
  else if (Math.abs(decl - ORI.headDecl) > 0.01) {
    const dd = decl - ORI.headDecl;
    if (ORI.northAutoOk) ORI.northAuto = norm180(ORI.northAuto + dd);
    for (const x of ORI.headBuf) x.v = norm180(x.v + dd);
    for (const x of ORI.headAxisBuf) { x.f = norm180(x.f + dd); x.c = norm180(x.c + dd); }
    ORI.headDecl = decl;
  }

  /* Курс без свіжих подій або із завмерлим числом — не вимір. Північ при
     цьому НЕ знімається: орієнтація ОС і гіроскоп ведуть її далі з останньою
     поправкою, а людина бачить у Давачах, що компас мовчить. */
  ORI.headStale = tNow - ORI.headT > HEAD_FRESH_MS;
  if (ORI.headStale) { ORI.headBand = false; ORI.headWhy = 'компас мовчить — тримаю останню північ'; return; }

  const M = NBK.quatToMatrix(ORI.q);
  const w = ORI.w || [0, 0, 0];
  const wx = M[0][0] * w[0] + M[0][1] * w[1] + M[0][2] * w[2];
  const wy = M[1][0] * w[0] + M[1][1] * w[1] + M[1][2] * w[2];
  const tiltRate = Math.hypot(wx, wy) * NBK.R2D;
  const wMag = Math.hypot(w[0], w[1], w[2]) * NBK.R2D;
  const aim = NBK.quatPixelToAzEl(ORI.q, 0, 0, 1000, S.head.screenAngle || 0);
  ORI.headEl = aim.el;

  const ref = headRefAz(M);
  /* Завмерлий курс: число не міняється, а телефон ФІЗИЧНО повернувся (це каже
     гіроскоп, не орієнтація ОС — бо коли стрибає опорна точка alpha, орієнтація
     «повертається» без жодного руху, і саме тоді курс правий, а не завмер). */
  const dtAll = clamp((tNow - (ORI.headStepAllT || tNow)) / 1000, 0, 0.25);
  ORI.headStepAllT = tNow;
  if (ORI.headLastVal == null || Math.abs(norm180(ORI.headDeg - ORI.headLastVal)) > 0.25) {
    ORI.headLastVal = ORI.headDeg; ORI.headValT = tNow; ORI.headValTurn = 0;
  } else {
    ORI.headValTurn = (ORI.headValTurn || 0) + wMag * dtAll;
    if (tNow - ORI.headValT > HEAD_FROZEN_MS && ORI.headValTurn > HEAD_FROZEN_TURN) {
      ORI.headBand = false; ORI.headStale = true; ORI.headWhy = 'курс завмер — тримаю останню північ'; return;
    }
  }
  const H = norm360(ORI.headDeg + decl);
  const offF = norm180(H - ref.fwd), offC = norm180(H - ref.cam);
  const useCam = ORI.headAxis === 'cam';
  const m = useCam ? ref.camM : ref.fwdM;
  if (m < HEAD_AXIS_MIN) {
    ORI.headBand = false;
    ORI.headWhy = useCam ? 'камера дивиться вертикально — азимуту немає' : 'телефон на боці — азимуту осі немає';
    return;
  }
  const off = useCam ? offC : offF;

  /* Вага виміру — від заявленої точності. −1 означає «просить калібрування»:
     курс при цьому зазвичай цілком притомний, просто без гарантії. */
  const acc = (ORI.headAcc != null && isFinite(ORI.headAcc)) ? ORI.headAcc : null;
  let weight = acc == null ? 0.6 : acc < 0 ? 0.35 : clamp(20 / Math.max(acc, 10), 0.2, 1);
  const moving = (!!ORI.gyroSrc && (tiltRate > HEAD_TILT_QUIET || wMag > HEAD_TURN_QUIET)) || (ORI.shake || 0) > 3;
  if (moving) {
    if (ORI.northAutoOk && tNow - ORI.headHoldT < HEAD_FORCE_MS) {
      ORI.headBand = false; ORI.headWhy = 'рух — курс відстає, північ тримає гіроскоп'; return;
    }
    weight *= 0.3;
  }
  ORI.headBand = true; ORI.headWhy = '';
  ORI.headHoldT = tNow;

  // порівняння осей — лише коли обидві визначені; різниця між ними каже, чи поза показова
  if (ref.fwdM >= HEAD_AXIS_MIN && ref.camM >= HEAD_AXIS_MIN) {
    ORI.headAxisBuf.push({ t: tNow, f: offF, c: offC, diff: Math.abs(norm180(ref.fwd - ref.cam)) });
    if (ORI.headAxisBuf.length > 2400) ORI.headAxisBuf.shift();
    if (tNow - (ORI.headAxisEvalT || 0) > 2000) { ORI.headAxisEvalT = tNow; headAxisEval(tNow); }
  }

  // перший вимір — північ одразу, з будь-якої пози
  if (!ORI.northAutoOk) {
    ORI.northAuto = off; ORI.northAutoOk = true;
    ORI.headBuf = [{ t: tNow, v: off }];
    ORI.headJumpT = 0; ORI.headStepT = tNow;
    ORI.northConfirmed = false; ORI.headSpreadDeg = null;
    ORI.headWant = 'перший вимір — уточнюю';
    return;
  }

  const d = norm180(off - ORI.northAuto);
  if (Math.abs(d) > HEAD_SNAP_DEG) {
    /* Великий стрибок: одна-дві події — викид, який не рухає нічого;
       понад секунду поспіль — нова правда, беремо одразу. */
    if (!ORI.headJumpT) ORI.headJumpT = tNow;
    if (tNow - ORI.headJumpT >= HEAD_SNAP_MS) {
      ORI.northAuto = off; ORI.headBuf = [];
      ORI.headJumpT = 0; ORI.headSnapN = (ORI.headSnapN || 0) + 1; ORI.headSnapT = tNow;
      ORI.headSnaps.push(tNow);
    }
  } else {
    ORI.headJumpT = 0;
    const dt = clamp((tNow - (ORI.headStepT || tNow)) / 1000, 0.004, 0.25);
    const k = 1 - Math.exp(-dt / (HEAD_TAU_S / weight));
    ORI.northAuto = norm180(ORI.northAuto + d * k);
  }
  ORI.headStepT = tNow;

  ORI.headBuf.push({ t: tNow, v: off });
  while (ORI.headBuf.length && tNow - ORI.headBuf[0].t > HEAD_WIN_MS) ORI.headBuf.shift();
  if (ORI.headBuf.length > 600) ORI.headBuf.shift();

  const sp0 = angSpread90(ORI.headBuf.map(x => x.v));
  if (sp0 != null) ORI.headSpreadDeg = sp0;
  const sp = ORI.headSpreadDeg == null ? 99 : ORI.headSpreadDeg;
  // чесне ± півночі: більше з заявленої точності і розкиду; без заявленої — сам розкид
  ORI.northAcc = acc == null || acc < 0 ? (sp >= 99 ? null : sp) : Math.max(acc, sp);
  ORI.headN = ORI.headBuf.length;
  ORI.northConfirmed = ORI.headBuf.length >= HEAD_CONFIRM_N && sp <= HEAD_CONFIRM_SPREAD &&
    !(acc != null && (acc < 0 || acc > HEAD_ACC_GOOD));
  /* Нестабільний компас — це або великий розкид у вікні, або поправка, що
     раз за разом перестрибує (кожен стрибок чистить вікно, тож сам розкид
     цього не покаже). Три стрибки за хвилину — метал поруч. */
  while (ORI.headSnaps.length && tNow - ORI.headSnaps[0] > 60000) ORI.headSnaps.shift();
  const jumpy = ORI.headSnaps.length >= 3;
  ORI.compassNoisy = (ORI.headBuf.length >= 20 && sp > HEAD_NOISY_SPREAD) || jumpy;
  if (jumpy) ORI.northConfirmed = false;
  ORI.headWant = ORI.northConfirmed ? ''
    : jumpy ? 'компас нестабільний: поправка стрибала ' + ORI.headSnaps.length + '× за хвилину — відійди від металу'
    : ORI.compassNoisy ? 'компас нестабільний ±' + Math.round(sp) + '° — відійди від металу'
      : acc != null && acc < 0 ? 'компас просить калібрування — поводь телефоном вісімкою'
        : acc != null && acc > HEAD_ACC_GOOD ? 'компас грубий ±' + Math.round(acc) + '°'
          : 'уточнюю північ';
}

/* ---------- дозвіл на давачі руху ----------
   ОСЬ ДЕ ЛАМАЛОСЬ НА iPHONE. Safari дає DeviceOrientationEvent.requestPermission()
   тільки поки «свіжий» жест користувача. Раніше застосунок спершу піднімав
   камеру (а це діалог і кілька секунд очікування) і аж потім просив давачі —
   до того моменту жест уже згорав, дозволу не було, і подій орієнтації не
   приходило ВЗАГАЛІ. Тому тепер це найперша дія в обробнику тапу, до всього
   іншого, і без жодного await перед нею. */
const PERM = { state: 'невідомо', why: '' };

function needsMotionPermission() {
  const D = window.DeviceOrientationEvent;
  return !!(D && typeof D.requestPermission === 'function');
}

/** Викликати ПЕРШИМ рядком обробника тапу, інакше на iOS не спрацює */
function requestMotionPermission() {
  if (!window.isSecureContext) {
    PERM.state = 'заблоковано';
    PERM.why = 'сторінка не по https — браузер не дає давачі руху';
    return Promise.resolve(PERM);
  }
  const D = window.DeviceOrientationEvent;
  if (!D) {
    PERM.state = 'немає';
    PERM.why = 'браузер не має DeviceOrientationEvent';
    return Promise.resolve(PERM);
  }
  if (typeof D.requestPermission !== 'function') {
    PERM.state = 'не потрібен';
    return Promise.resolve(PERM);
  }
  // виклик іде синхронно, поки активація від тапу ще жива
  let p;
  try { p = D.requestPermission(); }
  catch (e) {
    PERM.state = 'помилка'; PERM.why = e.message;
    return Promise.resolve(PERM);
  }
  return p.then(r => {
    PERM.state = r === 'granted' ? 'надано' : 'відмовлено';
    if (r !== 'granted') {
      PERM.why = 'Safari → Налаштування → Safari → Рух і орієнтація: увімкнути, ' +
        'потім оновити сторінку і натиснути ще раз';
    }
    // датчик руху просимо теж, але вже без драми
    const M = window.DeviceMotionEvent;
    if (M && typeof M.requestPermission === 'function') {
      try { M.requestPermission().catch(() => { }); } catch (e) { }
    }
    return PERM;
  }).catch(e => {
    PERM.state = 'помилка'; PERM.why = e.message + ' — спробуй ще раз одразу після тапу';
    return PERM;
  });
}

/** Підняти орієнтацію: пробуємо джерела по черзі й лишаємо перше робоче */
async function startOrientation() {
  if (!window.isSecureContext)
    throw new Error('сторінка не по https — давачі руху заблоковані браузером');
  if (PERM.state === 'відмовлено' || PERM.state === 'заблоковано')
    throw new Error(PERM.why || 'немає дозволу на давачі руху');

  /* Порожні спроби коштують часу, а час тут на вагу золота: кожна проба
     чекає першої події 1.5 с, і на iPhone дві з чотирьох приречені. Тому
     пробуємо лише те, що в цьому браузері взагалі існує: absolute-подія
     без 'ondeviceorientationabsolute' не прийде НІКОЛИ, і півтори секунди
     очікування на неї — це півтори секунди, за які людина вирішує, що
     купол не працює. */
  const chain = [
    ['sensor', tryOrientationSensor, () => !!window.AbsoluteOrientationSensor],
    ['absolute', tryAbsoluteEvent, () => 'ondeviceorientationabsolute' in window],
    ['plain', tryPlainEvent, () => !!window.DeviceOrientationEvent],
    ['gyro', tryGyroIntegration, () => !!window.Gyroscope]
  ];
  startGyroRate();          // швидкий контур піднімаємо незалежно від джерела
  for (const [mode, fn, has] of chain) {
    if (has && !has()) continue;
    let okNow = false;
    try { okNow = await fn(); } catch (e) { okNow = false; }
    if (okNow) { ORI.mode = mode; return ORI.src; }
  }
  throw new Error(needsMotionPermission()
    ? 'дозвіл є, але подій немає — перевір «Рух і орієнтація» в налаштуваннях Safari'
    : 'жодне джерело орієнтації не відповіло');
}

/* ═══════════════════════════════════════════════════════════════════
   ФОНОВЕ ДОТЯГУВАННЯ ОРІЄНТАЦІЇ

   Дозвіл на давачі потребує дотику, а ПІДПИСКА на події — ні. Тож коли
   дозвіл уже надано, а перша подія на старті не встигла прийти, немає
   жодної причини гнати людину в налаштування: пробуємо самі, поки не
   поїде. Саме цього бракувало — і тому купол «не працював при старті», а
   кнопка в Давачах його «лагодила»: вона просто пробувала ще раз.
   ═══════════════════════════════════════════════════════════════════ */
const ORI_RETRY = { on: false, tries: 0, t: 0 };
function oriKeepTrying(maxTries) {
  if (ORI_RETRY.on) return;
  if (PERM.state === 'відмовлено' || PERM.state === 'заблоковано') return;
  ORI_RETRY.on = true; ORI_RETRY.tries = 0;
  const step = async () => {
    if (ORI.ok) { ORI_RETRY.on = false; return; }
    if (ORI_RETRY.tries >= (maxTries || 8)) {
      ORI_RETRY.on = false;
      if (typeof toast === 'function')
        toast('орієнтація не піднялась — тапни ПН у рядку стану', 'warn', 6000);
      return;
    }
    ORI_RETRY.tries++; ORI_RETRY.t = Date.now();
    try {
      const src = await startOrientation();
      ORI_RETRY.on = false;
      if (typeof toast === 'function') toast('орієнтація піднялась: ' + src, 'good', 3000);
      if (typeof updateHint === 'function') updateHint();
      return;
    } catch (e) { }
    setTimeout(step, 1500 + ORI_RETRY.tries * 700);
  };
  setTimeout(step, 600);
}

/** Повторна спроба з нового жесту — для кнопки в службовій панелі */
async function retryOrientation() {
  stopOrientation();
  const perm = await requestMotionPermission();
  if (perm.state === 'відмовлено' || perm.state === 'заблоковано') {
    toast(perm.why, 'bad', 6000);
    return false;
  }
  try {
    const src = await startOrientation();
    toast('орієнтація працює: ' + src, 'good');
    return true;
  } catch (e) { toast(e.message, 'bad', 6000); return false; }
}

function stopOrientation() {
  stopGyroRate();
  if (ORI.sensor) { try { ORI.sensor.stop(); } catch (e) { } ORI.sensor = null; }
  if (ORI.handler) { window.removeEventListener(ORI.handler.name, ORI.handler.fn, true); ORI.handler = null; }
  ORI.ok = false; ORI.src = 'нема';
}

/* ---------- згладжування і похідні ---------- */

/**
 * Слерп до нової орієнтації: невеликий шум гаситься, реальний поворот
 * наздоганяється майже миттєво. Робиться в кватерніонах, тож біля зеніту
 * нічого не вироджується.
 */
function fusedOrientation() {
  const sa = screenAngle();
  S.head.screenAngle = sa;
  if (!ORI.ok) { S.head.quality = 0; return S.head; }

  const tNow0 = now();
  ORI.fuseT = tNow0;

  /* ════════════════════════════════════════════════════════════
     ГОЛОВНЕ РІШЕННЯ ЦЬОГО ФАЙЛУ, і воно далося не одразу.

     Подія deviceorientation — це НЕ сирий давач. І на Android
     (вектор повороту), і на iOS (CoreMotion attitude) це вже готова
     фузія гіроскопа, акселерометра й магнітометра, зроблена самою
     операційною системою фільтром Калмана. Вона гладка, точна і
     майже без затримки. Краще за неї телефон орієнтацію не вміє.

     А я тримав поверх неї ВЛАСНИЙ комплементарний фільтр: зливав цю
     готову орієнтацію зі своїм інтегруванням гіроскопа зі сталими
     0.35 с по нахилу і 0.6 с по азимуту. Такий фільтр не може
     випередити свій вхід — він може тільки за ним відставати. Тобто
     на екран ішла загальмована копія вже ідеального сигналу, і це й
     було те саме «плавання при поворотах»: рука зупинилась, а сітка
     ще пів секунди доїжджає.

     Фільтр колись мав сенс — він рятував від стрибків курсу iOS. Але
     ту біду я вже вилікував інакше: курс став окремим скаляром
     (compassStep). Після того фільтр лишився зайвим і став шкідливим.

     Тепер чесно й просто:
       орієнтація ОС — це правда, беремо як є;
       гіроскоп — лише заповнює проміжки МІЖ подіями і компенсує їхній вік;
       кожна нова подія жорстко пересинхронізовує стан, без жодного змішування.
     Дрейфу немає (синхронізація щоподії), відставання немає (немає фільтра).
     ════════════════════════════════════════════════════════════ */

  compassStep(tNow0);
  ORI.needNorth = !oriHasNorth();
  ORI.yawFix = ORI.northOffset + (ORI.headDeg != null && ORI.northAutoOk
    ? ORI.northAuto + ORI.headFlip
    : (ORI.absolute ? declOffset() : 0));

  // правда на момент останньої події давача
  const absQ = NBK.quatMul(NBK.quatYawAz(ORI.yawFix), ORI.q);

  const gyroLive = !!ORI.gyroSrc && ORI.gyroT && (tNow0 - ORI.gyroT) < 400;
  const eventAge = tNow0 - (ORI.lastT || tNow0);
  S.head.stale = eventAge > 1200;

  // перевірки давача лишаються: вони вирішують, чи можна взагалі
  // довіряти гіроскопу для заповнення проміжків
  if (gyroLive) {
    if (ORI.gvQ) ORI.yawErr = NBK.yawErrorDeg(absQ, ORI.gvQ);
    gyroFastCheck(absQ, tNow0);
    gyroVerify(absQ, tNow0);
  }

  /* Пересинхронізація. Прийшла нова подія — стан стає нею, крапка.
     Ніякого злиття: змішувати правду з власною здогадкою означає
     отримати щось гірше за правду. Між подіями цей же стан веде
     вперед гіроскоп у gyroSample.

     Єдиний виняток — ВОРОТА ПРАВДОПОДІБНОСТІ. Зрідка давач видає одну
     дику подію: телефон фізично не міг за тридцять мілісекунд повернутись
     на двадцять градусів, а гіроскоп це підтверджує. Таку подію
     пропускаємо і продовжуємо вести гіроскопом. Це НЕ медіана: медіана
     затримує кожен кадр заради рідкісного викиду, а ворота не коштують
     нічого, поки викиду немає. Якщо ж розходження тримається кілька подій
     поспіль — значить правда таки в давача, і ми його приймаємо. */
  const fresh = ORI.syncT !== ORI.lastT;
  let resync = !gyroLive || !ORI.qg || ORI.gyroTrust < 0.5 || fresh;
  if (fresh && gyroLive && ORI.qg && ORI.gyroTrust >= 0.5) {
    const gap = clamp((ORI.lastT - (ORI.syncT || ORI.lastT)) / 1000, 0, 0.5);
    const wMag = Math.hypot(ORI.w[0], ORI.w[1], ORI.w[2]) * NBK.R2D;
    const plausible = wMag * gap + 12;          // скільки телефон МІГ повернутись
    const jump = NBK.quatAngle(absQ, ORI.qg);
    if (jump > plausible && ORI.rejectN < 3) {
      ORI.rejectN++;
      ORI.rejectDeg = jump;
      resync = false;
      ORI.syncT = ORI.lastT;                    // подію бачили, але не взяли
    } else ORI.rejectN = 0;
  }
  if (resync) {
    ORI.qg = absQ.slice();
    ORI.syncT = ORI.lastT;
  }
  const base = ORI.qg;

  /* Лишається компенсувати те, чого вже ніяк не уникнути: сама подія
     приходить із затримкою, і кадр з'явиться на екрані ще пізніше.
     Екстраполюємо перевіреною кутовою швидкістю — і не більше ніж на
     кадр-два, бо далі прогноз сам стає джерелом стрибків. */
  const DISPLAY_MS = 16;
  let lead = 0;
  if (gyroLive && ORI.gyroTrust > 0.5 && !S.head.stale) {
    const shakeK = clamp((ORI.shake - 0.5) / 2.5, 0, 1);
    lead = DISPLAY_MS * ORI.gyroTrust * (1 - ORI.panic) * (1 - 0.6 * shakeK);
  }
  ORI.predMs = lead;

  let qOut = base;
  if (lead > 1) {
    const w = ORI.wPred;
    const mag = Math.hypot(w[0], w[1], w[2]) * NBK.R2D;
    // понад дванадцять градусів прогноз не рухає нічого й ніколи
    const capMs = mag > 1 ? Math.min(lead, 12 / mag * 1000) : lead;
    if (capMs > 1) qOut = NBK.quatIntegrate(base, w[0], w[1], w[2], capMs / 1000);
  }

  /* Згладжування — ТІЛЬКИ проти квантування, і тільки якщо давач справді
     шумить. Стала не більша за третину кадру: помітити її неможливо, а
     сходинки на дешевому давачі вона прибирає. Здоровий давач не
     згладжується взагалі — будь-яка стала тут це відставання. */
  const tau = ORI.jitter > 0.35 ? clamp((ORI.jitter - 0.35) * 0.03, 0, 0.03) : 0;
  ORI.tauDispDbg = tau;
  if (tau > 0.001) {
    const dtS = clamp((tNow0 - (ORI.dispT || tNow0)) / 1000, 0.004, 0.2);
    ORI.qs = ORI.qs ? NBK.quatSlerp(ORI.qs, qOut, 1 - Math.exp(-dtS / tau)) : qOut;
    qOut = ORI.qs;
  } else ORI.qs = qOut;
  ORI.dispT = tNow0;

  S.q = qOut;
  /* Три різні кватерніони, і плутати їх не можна:
       S.q     — для ПОКАЗУ: згладжений і екстраполюваний на затримку кадру;
       S.qMeas — для ВИМІРУ: те саме без екстраполяції, але вже з північчю
                 і схиленням. Саме в цій системі живуть азимути цілей;
       S.qRaw  — сира орієнтація давача без жодних поправок. Потрібна лише
                 детектору, який працює з РІЗНИЦЯМИ між кадрами, де стала
                 поправка все одно скорочується. */
  /* Для ВИМІРУ — стан без екстраполяції на затримку показу. Тепер це просто
     той самий стан, що й база показу: орієнтація ОС, доведена гіроскопом до
     цієї миті. Раніше тут стояла змінна фільтра, якої більше немає. */
  S.qMeas = base;
  S.qRaw = ORI.q;

  // азимут і кут місця беремо з ТОГО САМОГО кватерніона, яким малюємо, —
  // інакше цифри на екрані і сітка живуть у різні моменти часу
  const c = NBK.quatPixelToAzEl(qOut, 0, 0, S.fpx || 1000, sa);
  S.head.az = c.az; S.head.el = c.el;
  S.head.jitter = ORI.jitter;
  S.head.absolute = ORI.absolute;
  S.head.quality = !ORI.ok || S.head.stale ? 0
    : !ORI.absolute ? 1
      : ORI.jitter > 1.2 ? 2 : 3;
  return S.head;
}
const declOffset = () => (S.decl == null ? 0 : S.decl);
/** Чи є взагалі звідки взяти справжню північ */
function oriHasNorth() {
  return !!(ORI.absolute || (ORI.headDeg != null && ORI.northAutoOk));
}

/** Азимут і кут місця для точки кадру (пікселі відео від центра) */
function aimAt(dxVideo, dyVideo) {
  return NBK.quatPixelToAzEl(S.q || [0, 0, 0, 1], dxVideo, dyVideo, S.fpx || 1000, S.head.screenAngle || 0);
}
/**
 * Напрямок для ВИМІРУ: без екстраполяції, але з поправкою на північ.
 * Саме цим міряються азимути цілей — інакше під час повороту камери
 * екстраполяція дописує цілі кутову швидкість, якої в неї немає.
 */
function measAimAt(dxVideo, dyVideo) {
  return NBK.quatPixelToAzEl(S.qMeas || S.q || [0, 0, 0, 1], dxVideo, dyVideo,
    S.fpx || 1000, S.head.screenAngle || 0);
}
/** Те саме по сирій орієнтації — детектору потрібен миттєвий рух камери */
function rawAimAt(dxVideo, dyVideo) {
  return NBK.quatPixelToAzEl(S.qRaw || [0, 0, 0, 1], dxVideo, dyVideo, S.fpx || 1000, S.head.screenAngle || 0);
}
/** Куди в кадрі впаде напрямок */
function azElToPixel(az, el) {
  return NBK.quatAzElToPixel(S.q || [0, 0, 0, 1], az, el, S.fpx || 1000, S.head.screenAngle || 0);
}

/**
 * Розвернути прив'язку на 180°.
 *
 * Браузер віддає курс одним числом і не каже, азимут якої осі телефона це
 * число. При звичайному хваті камера і верхній край екрана дивляться рівно
 * в протилежні боки, тому дві можливі відповіді відрізняються точно на
 * півкола і РОЗРІЗНИТИ ЇХ ІЗ САМОГО КУРСУ НЕМОЖЛИВО. На переважній
 * більшості пристроїв правильна перша, але якщо на екрані північ там, де
 * має бути південь, — це саме той випадок, і виправляється він одним
 * дотиком. Вибір запам'ятовується.
 */
function toggleNorthFlip() {
  ORI.headFlip = ORI.headFlip ? 0 : 180;
  S.set.headFlip = ORI.headFlip;
  saveSet();
  return ORI.headFlip;
}

/** Прив'язати поточний напрямок камери до відомого азимута */
function setNorthByAim(knownAz) {
  const base = NBK.quatMul(NBK.quatYawAz(ORI.yawFix - ORI.northOffset), ORI.q);
  const cur = NBK.quatPixelToAzEl(base, 0, 0, S.fpx || 1000, S.head.screenAngle || 0);
  ORI.northOffset = norm180(knownAz - cur.az);
  ORI.needNorth = false;
  S.set.northOffset = ORI.northOffset;
  saveSet();
  return ORI.northOffset;
}

/** Рядок стану давачів для службової панелі */
function orientReport() {
  return {
    src: ORI.src,
    absolute: ORI.absolute,
    hasNorth: oriHasNorth(),
    hz: ORI.hz,
    age: ORI.lastT ? Math.round(now() - ORI.lastT) : null,
    jitter: ORI.jitter,
    needNorth: ORI.needNorth,
    offset: ORI.northOffset,
    yawFix: ORI.yawFix || 0,
    headDeg: ORI.headDeg,
    headAcc: ORI.headAcc,
    headStale: !!ORI.headStale,
    headWhy: ORI.headWhy || '',
    northAcc: ORI.northAcc,
    snaps: ORI.headSnapN || 0,
    headAxis: ORI.headAxis, headAxisName: HEAD_AXES[ORI.headAxis] || ORI.headAxis,
    headAxisN: ORI.headAxisN || 0, headAxisSpread: ORI.headAxisSpread, headAxisSaved: !!S.set.headAxis,
    headSpread: ORI.headSpreadDeg,
    headBand: ORI.headBand,
    headEl: ORI.headEl || 0,
    headN: ORI.headBuf.length,
    headWant: ORI.headWant || '',
    headFlip: ORI.headFlip,
    northAuto: ORI.northAuto || 0,
    northAutoOk: ORI.northAutoOk,
    northConfirmed: ORI.northConfirmed,
    shake: ORI.shake || 0,
    compassNoisy: !!ORI.compassNoisy,
    headAgeSec: ORI.headT ? (now() - ORI.headT) / 1000 : null,
    screen: S.head.screenAngle,
    rate: ORI.rate || 0,
    gyroSrc: ORI.gyroSrc || '—',
    gyroHz: ORI.gyroHz || 0,
    yawErr: ORI.yawErr || 0,
    yawMed: ORI.yawMed || 0,
    bias: ORI.bias.map(v => +(v * NBK.R2D).toFixed(2)),
    biasN: ORI.biasN,
    predMs: Math.round(ORI.predMs || 0),
    gyroTrust: ORI.gyroTrust,
    gyroWhy: ORI.gyroWhy || '',
    gyroMis: ORI.gvMis || 0,
    gyroVerdict: ORI.gvVerdict || '',
    panic: ORI.panic || 0,
    secure: window.isSecureContext,
    perm: PERM.state, permWhy: PERM.why,
    needsPerm: needsMotionPermission(),
    hasSensor: !!window.AbsoluteOrientationSensor,
    hasAbsEvent: 'ondeviceorientationabsolute' in window,
    q: (S.q || []).map(v => +v.toFixed(3))
  };
}

/* ── 30_sensors.js ── */
/* ============================================================
   Сенсори: камера, орієнтація, геолокація, wake lock
   ============================================================ */

/* ---------- камера ---------- */
/** Повністю відпустити камеру: жодного споживання, індикатор камери гасне */
function stopCamera() {
  try {
    if (S.cam.stream) for (const t of S.cam.stream.getTracks()) t.stop();
  } catch (e) { }
  S.cam.stream = null; S.cam.track = null; S.cam.ready = false;
  const v = $('#vid'); if (v) v.srcObject = null;
}

async function startCamera() {
  const tries = [
    { video: { facingMode: { exact: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
    { video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false },
    { video: true, audio: false }
  ];
  let err = null;
  for (const c of tries) {
    try {
      const st = await navigator.mediaDevices.getUserMedia(c);
      S.cam.stream = st;
      S.cam.track = st.getVideoTracks()[0];
      const v = $('#vid');
      v.srcObject = st;
      await v.play().catch(() => { });
      await new Promise(r => {
        if (v.videoWidth) return r();
        v.onloadedmetadata = () => r();
        setTimeout(r, 2500);
      });
      S.cam.w = v.videoWidth || 1280;
      S.cam.h = v.videoHeight || 720;
      S.cam.ready = true;
      readCameraCaps();
      return true;
    } catch (e) { err = e; }
  }
  throw err || new Error('camera');
}

function readCameraCaps() {
  const tr = S.cam.track;
  S.cam.zoomCaps = null;
  try {
    const caps = tr.getCapabilities ? tr.getCapabilities() : null;
    if (caps && caps.zoom) S.cam.zoomCaps = { min: caps.zoom.min, max: caps.zoom.max, step: caps.zoom.step || 0.1 };
    // деякі рушії віддають кут поля зору напряму
    const st = tr.getSettings ? tr.getSettings() : {};
    if (st.zoom) S.cam.zoom = st.zoom;
    if (caps && caps.fieldOfView && caps.fieldOfView.max) {
      const fov = (caps.fieldOfView.max + caps.fieldOfView.min) / 2;
      if (fov > 20 && fov < 120 && !S.set.fovMap[zoomKey()]) setFov(fov, 'API камери');
    }
  } catch (e) { }
}
async function setZoom(z) {
  if (!S.cam.zoomCaps || !S.cam.track) return;
  const v = clamp(z, S.cam.zoomCaps.min, S.cam.zoomCaps.max);
  try { await S.cam.track.applyConstraints({ advanced: [{ zoom: v }] }); S.cam.zoom = v; applyFovForZoom(); }
  catch (e) { toast('зум не приймається', 'warn'); }
}
const zoomKey = () => (Math.round(S.cam.zoom * 10) / 10).toFixed(1);

/** Встановити фокусну для поточного зуму */
function setFov(fovDeg, src) {
  S.set.fovMap[zoomKey()] = { fov: fovDeg, src: src };
  saveSet(); applyFovForZoom();
}
/** Підібрати f_px під поточний зум: точна калібровка або масштабована з іншої */
function applyFovForZoom() {
  const key = zoomKey();
  const w = S.cam.w || 1280;
  const exact = S.set.fovMap[key];
  if (exact) { S.fpx = NBK.fFromFov(w, exact.fov); S.fovSrc = exact.src; return; }
  // масштабуємо з найближчої відомої калібровки: f ∝ zoom
  const keys = Object.keys(S.set.fovMap);
  if (keys.length) {
    let best = keys[0];
    for (const k of keys) if (Math.abs(+k - S.cam.zoom) < Math.abs(+best - S.cam.zoom)) best = k;
    const f0 = NBK.fFromFov(w, S.set.fovMap[best].fov);
    S.fpx = f0 * (S.cam.zoom / (+best || 1));
    S.fovSrc = 'scaled';
    return;
  }
  // нічого нема — типове поле зору смартфонної основної камери,
  // далі його уточнить пасивна автокалібровка за рухом камери
  S.fpx = NBK.fFromFov(w, 66) * S.cam.zoom;
  S.fovSrc = 'типове';
}

/* ---------- геолокація ---------- */
let geoWatch = null;
function startGeo() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('no-geo'));
    let done = false;
    geoWatch = navigator.geolocation.watchPosition(p => {
      S.me.lat = p.coords.latitude; S.me.lon = p.coords.longitude;
      S.me.acc = p.coords.accuracy;
      if (p.coords.altitude != null) S.me.alt = p.coords.altitude;
      S.me.ts = Date.now();
      const d = NBK.magDeclination(S.me.lat, S.me.lon, new Date().getFullYear());
      if (d != null) S.decl = d;
      // знати свою область треба, щоб відрізнити «тривога десь» від «тривога тут»
      try { alertsSetHome(S.me.lat, S.me.lon); } catch (e) { }
      if (!done) { done = true; resolve(true); }
    }, e => { if (!done) { done = true; reject(e); } },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
  });
}

/* ---------- мікрофон ---------- */
const MIC_C = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };

/** Аудіодоріжку — в аналізатор. Спільний хвіст для обох шляхів отримання. */
function wireMic(track) {
  if (!track) return false;
  const st = new MediaStream([track]);
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const src = ctx.createMediaStreamSource(st);
  const an = ctx.createAnalyser();
  an.fftSize = 4096; an.smoothingTimeConstant = 0.75;
  src.connect(an);
  S.audio.ctx = ctx; S.audio.an = an;
  S.audio.data = new Uint8Array(an.frequencyBinCount);
  S.audio.stream = st; S.audio.ok = true;
  S.media = Object.assign({}, S.media, { asked: true, mic: true });
  return true;
}

async function startMic() {
  const st = await navigator.mediaDevices.getUserMedia({ audio: MIC_C });
  return wireMic(st.getAudioTracks()[0]);
}

/**
 * Камера і мікрофон — ОДНИМ запитом.
 *
 * Браузер питає дозвіл на кожен виклик getUserMedia окремо: два виклики —
 * два системні вікна, і людина під тривогою тицяє «дозволити» двічі,
 * причому друге вікно приходить уже після запуску, коли увага на небі.
 * Один виклик із {video, audio} — це ОДНЕ вікно на обидва пристрої.
 *
 * Відеодоріжку одразу відпускаємо: головний режим — купол, а ввімкнена
 * камера гріє батарею і світить індикатором. Дозвіл при цьому лишається за
 * сторінкою, тож кнопка КАМЕРА піднімає її вже без жодних запитань.
 *
 * Якщо спільний запит відхилено (буває, коли заблоковано лише один із
 * пристроїв), пробуємо їх нарізно — краще два вікна, ніж жодного давача.
 */
/* ═══ ЩО ОС УЖЕ ДОЗВОЛИЛА ══════════════════════════════════════════
   Головна незручність не в тому, що вікон три, а в тому, що вони приходять
   ЩОРАЗУ. Permissions API вміє сказати, чи дозвіл уже стоїть, — і тоді
   getUserMedia/geolocation не малюють жодного вікна взагалі: другий і
   наступні запуски проходять начисто.

   Safari відповідає не на всі назви (для camera/microphone часто кидає
   TypeError), тому кожен запит окремо і в try: «не знаю» — це 'prompt', а
   не помилка запуску. */
async function permState(name) {
  try {
    if (!navigator.permissions || !navigator.permissions.query) return 'unknown';
    const st = await navigator.permissions.query({ name });
    return st.state;                      // granted | denied | prompt
  } catch (e) { return 'unknown'; }
}
async function permSnapshot() {
  const [cam, mic, geo] = await Promise.all([
    permState('camera'), permState('microphone'), permState('geolocation')
  ]);
  return { cam, mic, geo };
}

/**
 * Дозвіл на камеру — окремим запитом, і саму камеру одразу відпускаємо.
 *
 * Головний режим — купол; камера це інструмент, який піднімається кнопкою.
 * Але дозвіл треба взяти на старті, поки людина ще дивиться на екран, а не
 * в мить, коли вона побачила ціль і тицяє «камера».
 */
async function startCamPerm() {
  const tries = [
    { video: { facingMode: 'environment', width: { ideal: 1280 } } },
    { video: true }
  ];
  let err = null;
  for (const c of tries) {
    try {
      const st = await navigator.mediaDevices.getUserMedia(c);
      for (const tr of st.getVideoTracks()) tr.stop();
      S.media = Object.assign({}, S.media, { asked: true, cam: true });
      return true;
    } catch (e) { err = e; }
  }
  S.media = Object.assign({}, S.media, { asked: true, cam: false });
  throw err || new Error('камера недоступна');
}

async function startMedia(known) {
  /* Дозвіл уже стоїть — беремо доріжки без запиту; вікна не буде. Якщо ОС
     каже 'denied', не смикаємо її знову: відповідь та сама, а людина
     побачить блимання ще одного вікна ні за що. */
  if (known && known.cam === 'denied' && known.mic === 'denied') {
    S.media = { asked: true, cam: false, mic: false, one: false, skipped: 'denied' };
    throw new Error('камеру й мікрофон заблоковано в налаштуваннях');
  }
  return startMediaAsk();
}

async function startMediaAsk() {
  const out = { cam: false, mic: false, one: false };
  const take = st => {
    const a = st.getAudioTracks()[0];
    if (a && !S.audio.ok) out.mic = wireMic(a);
    const v = st.getVideoTracks();
    if (v.length) { out.cam = true; for (const tr of v) tr.stop(); }
  };
  try {
    take(await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: MIC_C
    }));
    out.one = true;
  } catch (e) {
    try { take(await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })); } catch (e2) { }
    try { take(await navigator.mediaDevices.getUserMedia({ audio: MIC_C })); } catch (e2) { }
  }
  S.media = { asked: true, cam: out.cam, mic: out.mic, one: out.one };
  if (!out.cam && !out.mic) throw new Error('ні камери, ні мікрофона');
  return out;
}
function pollAudio() {
  const a = S.audio;
  if (!a.ok || !a.an) return;
  a.an.getByteFrequencyData(a.data);
  const sr = a.ctx.sampleRate, bins = a.data.length;
  const hzPerBin = sr / 2 / bins;
  a.hzPerBin = hzPerBin;
  let best = 0, bestI = 0, sum = 0;
  const lo = Math.max(1, Math.floor(40 / hzPerBin)), hi = Math.min(bins, Math.floor(2000 / hzPerBin));
  for (let i = lo; i < hi; i++) {
    sum += a.data[i];
    if (a.data[i] > best) { best = a.data[i]; bestI = i; }
  }
  a.peak = bestI * hzPerBin;
  a.peakLvl = best;
  a.level = sum / Math.max(1, hi - lo);
  // гребінка гармонік поршневого двигуна: у відкритому дослідженні
  // для Shahed-136 крок близько 107 Гц при енергії в смузі 200–2000 Гц
  a.harm = NBK.harmonicSpacing(a.data, hzPerBin, 200, 2000, 60, 200);
  if (typeof earSample === 'function') earSample(a);   // слух: гул і вибухи (65_alert.js)
}

/* ---------- wake lock ---------- */
let wl = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) { wl = await navigator.wakeLock.request('screen'); }
    else if (wl) { await wl.release(); wl = null; }
  } catch (e) { }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.running) keepAwake(true);
});

/* ── 66_sky.js ── */
/* ═══════════════════════════════════════════════════════════════════
   НЕБО: СВІТИЛА, СУТІНКИ, МЕЖА ПІДСВІТКИ, ПОЛЯРНА

   Найдешевший шар у застосунку: ані байта з мережі, ані міліампера з
   давачів. Широта, довгота і годинник — усе, що треба. А віддача пряма:

   · СОНЦЕ — куди не можна дивитись очима. Людина в укритті не знає, з
     якого боку сонце, поки не вийде; конус ±15° навколо нього — сектор,
     у якому нічого не побачиш, скільки не вдивляйся.
   · МЕЖА ПІДСВІТКИ — головне тут. Після заходу земля вже темна, а ціль
     на висоті ще освітлена сонцем і горить яскравою цяткою на темному
     небі. Висота цієї межі рахується точно: h = R·(sec δ − 1), де δ —
     заглиблення сонця під горизонт. При δ=1° це 0.97 км, при 2° — 3.9 км,
     при 3° — 8.7 км. Тобто перші хвилин десять після заходу «шахед» на
     двох кілометрах видно, а нижче — вже ні. Це вікно і показуємо.
   · МІСЯЦЬ — фаза й освітленість: чи буде вночі видно бодай силует.
   · ПОЛЯРНА — еталон півночі, який не бреше. Компас у телефоні гнеться
     від металу, від корпусу, від чого завгодно; зоря стоїть де стояла.
     Уночі людина звіряє купол очима і, якщо треба, підкручує північ по
     зорі одним дотиком.

   Точність: сонце ±0.01°, Місяць ±0.3°, Полярна ±0.02°. Для ока на
   куполі цього з запасом; для наведення це не прилад і ним не буде.

   Ціна кадру — нуль: перерахунок не частіше ніж раз на 10 секунд, решту
   часу шар малюється з готових чисел. Плавність купола недоторканна.
   ═══════════════════════════════════════════════════════════════════ */

const SKY = {
  ok: false,          // чи є координати — без них шару немає
  t: 0,               // коли рахували востаннє
  lat: 0, lon: 0,
  sun: { az: 0, el: 0, dec: 0 },
  moon: { az: 0, el: 0, dec: 0, illum: 0, waxing: true, phase: '', distKm: 0 },
  polaris: { az: 0, el: 0 },
  depr: 0,            // на скільки градусів сонце нижче горизонту (0, якщо вище)
  litKm: 0,           // вище цієї висоти ціль ще освітлена сонцем (0 — освітлено все)
  litLo: 0, litHi: 0, // те саме для нижнього і верхнього краю коридору висот
  phase: '',          // день / сутінки громадянські / навігаційні / астрономічні / ніч
  nextName: '', nextT: 0   // наступний рубіж і коли він настане (мс)
};
try { window.SKY = SKY; } catch (e) { }

const SKY_R_KM = 6371;
const SKY_STEP_MS = 10000;      // частіше рахувати нема сенсу: сонце йде 0.25°/хв
const SKY_GLARE_DEG = 15;       // конус засліплення навколо сонця
/* Вище цієї межі підсвітка вже нікого не стосується: на 20 км не літає
   нічого з того, що ми ведемо, тож «підсвічено вище 107 км» — це не
   інформація, а шум у рядку. Такі моменти рівносильні «все в тіні». */
const SKY_LIT_MAX_KM = 20;

/** Юліанські дні від J2000.0 */
function skyDays(ms) { return ms / 86400000 - 10957.5; }

/**
 * Годинний кут і схилення → азимут і висота. Азимут від півночі за
 * годинниковою стрілкою — та сама система, що й у всього купола.
 */
function skyHorizon(haDeg, decDeg, latDeg) {
  const D = Math.PI / 180, R = 180 / Math.PI;
  const H = haDeg * D, dec = decDeg * D, lat = latDeg * D;
  const sinEl = Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(H);
  const el = Math.asin(Math.max(-1, Math.min(1, sinEl)));
  const cosEl = Math.cos(el);
  let az = 0;
  if (Math.abs(cosEl) > 1e-9) {
    const sinA = -Math.sin(H) * Math.cos(dec) / cosEl;
    const cosA = (Math.sin(dec) - Math.sin(el) * Math.sin(lat)) / (cosEl * Math.cos(lat));
    az = Math.atan2(sinA, cosA) * R;
  }
  return { az: ((az % 360) + 360) % 360, el: el * R };
}

/** Гринвіцький середній зоряний час у градусах */
function skyGmstDeg(d) { return ((280.46061837 + 360.98564736629 * d) % 360 + 360) % 360; }

/** Екліптичні λ, β → пряме сходження і схилення */
function skyEclToEq(lamDeg, betaDeg, d) {
  const D = Math.PI / 180, R = 180 / Math.PI;
  const eps = (23.439291 - 0.0000004 * d) * D;
  const lam = lamDeg * D, beta = betaDeg * D;
  const sinDec = Math.sin(beta) * Math.cos(eps) + Math.cos(beta) * Math.sin(eps) * Math.sin(lam);
  const dec = Math.asin(Math.max(-1, Math.min(1, sinDec)));
  const ra = Math.atan2(
    Math.sin(lam) * Math.cos(eps) - Math.tan(beta) * Math.sin(eps),
    Math.cos(lam)) * R;
  return { ra: ((ra % 360) + 360) % 360, dec: dec * R };
}

/** Сонце: класична низькоточна схема (±0.01°) */
function skySun(ms) {
  const d = skyDays(ms);
  const g = (357.52911 + 0.98560028 * d) * Math.PI / 180;
  const L = 280.46646 + 0.98564736 * d;
  const lam = L + 1.914602 * Math.sin(g) + 0.019993 * Math.sin(2 * g) + 0.000289 * Math.sin(3 * g);
  const eq = skyEclToEq(((lam % 360) + 360) % 360, 0, d);
  return { d, lam: ((lam % 360) + 360) % 360, ra: eq.ra, dec: eq.dec };
}

/** Місяць: скорочена схема Меуса (±0.3° по довготі) */
function skyMoon(ms) {
  const D = Math.PI / 180;
  const d = skyDays(ms);
  const L = 218.316 + 13.176396 * d;          // середня довгота
  const M = (134.963 + 13.064993 * d) * D;    // середня аномалія
  const F = (93.272 + 13.229350 * d) * D;     // аргумент широти
  const Ms = (357.529 + 0.98560028 * d) * D;  // аномалія Сонця
  const Dl = (297.850 + 12.190749 * d) * D;   // елонгація
  const lam = L + 6.289 * Math.sin(M) + 1.274 * Math.sin(2 * Dl - M)
    + 0.658 * Math.sin(2 * Dl) + 0.214 * Math.sin(2 * M) - 0.186 * Math.sin(Ms)
    - 0.114 * Math.sin(2 * F);
  const beta = 5.128 * Math.sin(F) + 0.281 * Math.sin(M + F) - 0.278 * Math.sin(F - M)
    - 0.173 * Math.sin(2 * Dl - F);
  const dist = 385001 - 20905 * Math.cos(M) - 3699 * Math.cos(2 * Dl - M) - 2956 * Math.cos(2 * Dl);
  const eq = skyEclToEq(((lam % 360) + 360) % 360, beta, d);
  return { d, lam: ((lam % 360) + 360) % 360, beta, ra: eq.ra, dec: eq.dec, distKm: dist };
}

/** Назва фази за освітленістю і напрямком */
function skyPhaseName(illum, waxing) {
  if (illum < 0.04) return 'молодик';
  if (illum > 0.96) return 'повня';
  if (illum < 0.46) return waxing ? 'молодий серп' : 'старий серп';
  if (illum < 0.54) return waxing ? 'перша чверть' : 'остання чверть';
  return waxing ? 'зростає' : 'спадає';
}

/**
 * Висота, вище якої ціль ще освітлена сонцем, коли воно вже зайшло.
 * Ціль на висоті h бачить свій горизонт опущеним на acos(R/(R+h)); поки
 * заглиблення сонця менше за цей кут — ціль у світлі. Звідси h = R(sec δ − 1).
 */
function skyLitKm(deprDeg) {
  if (!(deprDeg > 0)) return 0;
  if (deprDeg >= 12) return Infinity;   // глибше — освітлених висот у межах атмосфери немає
  return SKY_R_KM * (1 / Math.cos(deprDeg * Math.PI / 180) - 1);
}

/** Висота сонця в заданий момент — окремо, щоб шукати рубежі сутінок */
function skySunEl(ms, lat, lon) {
  const s = skySun(ms);
  return skyHorizon(skyGmstDeg(s.d) + lon - s.ra, s.dec, lat).el;
}

/* Назва — це те, що НАСТАЄ, коли сонце проходить рубіж вниз, а не те,
   що вже було: інакше рядок казав «навігаційні сутінки за 33 хв» тоді,
   коли вони вже тривали. */
const SKY_MARKS = [
  [-0.833, 'захід'], [-6, 'навігаційні сутінки'], [-12, 'астрономічні сутінки'], [-18, 'повна темрява']
];

/** Як зветься те, що зараз надворі */
function skyPhaseOf(el) {
  if (el > -0.833) return 'день';
  if (el > -6) return 'громадянські сутінки';
  if (el > -12) return 'навігаційні сутінки';
  if (el > -18) return 'астрономічні сутінки';
  return 'ніч';
}

/**
 * Найближчий перетин будь-якого рубежу: крок по хвилині вперед до 8 годин,
 * потім уточнення поділом навпіл. Сонце рахується десятками наносекунд, тож
 * 480 кроків — це дрібниця, і робимо ми це раз на 10 секунд, не в кадрі.
 */
function skyNextMark(ms, lat, lon) {
  let prev = skySunEl(ms, lat, lon), prevT = ms;
  for (let i = 1; i <= 480; i++) {
    const t = ms + i * 60000, el = skySunEl(t, lat, lon);
    for (const [lvl, name] of SKY_MARKS) {
      if ((prev - lvl) * (el - lvl) < 0) {
        let a = prevT, b = t;
        for (let k = 0; k < 18; k++) {
          const m = (a + b) / 2;
          if ((skySunEl(a, lat, lon) - lvl) * (skySunEl(m, lat, lon) - lvl) < 0) b = m; else a = m;
        }
        const up = el > prev;
        return { name: up ? (lvl === -0.833 ? 'схід' : 'світає') : name, t: (a + b) / 2 };
      }
    }
    prev = el; prevT = t;
  }
  return { name: '', t: 0 };
}

/**
 * Перерахунок стану неба. Викликається з головного циклу як завгодно
 * часто — усередині стоїть власний крок у 10 секунд.
 */
function skyStep(nowMs, force) {
  const me = (typeof myPos === 'function') ? myPos() : null;
  if (!me || !isFinite(me.lat) || !isFinite(me.lon)) { SKY.ok = false; return; }
  const moved = Math.abs(me.lat - SKY.lat) > 0.05 || Math.abs(me.lon - SKY.lon) > 0.05;
  if (!force && !moved && SKY.ok && nowMs - SKY.t < SKY_STEP_MS) return;
  SKY.t = nowMs; SKY.lat = me.lat; SKY.lon = me.lon;

  const s = skySun(nowMs);
  const gmst = skyGmstDeg(s.d) + me.lon;
  const sh = skyHorizon(gmst - s.ra, s.dec, me.lat);
  SKY.sun.az = sh.az; SKY.sun.el = sh.el; SKY.sun.dec = s.dec;

  const m = skyMoon(nowMs);
  const mh = skyHorizon(gmst - m.ra, m.dec, me.lat);
  SKY.moon.az = mh.az; SKY.moon.el = mh.el; SKY.moon.dec = m.dec; SKY.moon.distKm = m.distKm;
  // фаза: кутова відстань Місяця від Сонця на небесній сфері
  const D = Math.PI / 180;
  const elong = Math.acos(Math.max(-1, Math.min(1,
    Math.cos(m.beta * D) * Math.cos((m.lam - s.lam) * D))));
  SKY.moon.illum = (1 - Math.cos(elong)) / 2;
  let dl = ((m.lam - s.lam) % 360 + 360) % 360;
  SKY.moon.waxing = dl < 180;
  SKY.moon.phase = skyPhaseName(SKY.moon.illum, SKY.moon.waxing);

  // Полярна: α 2h31m49s, δ +89°15'51" — не точно на полюсі, тож рахуємо як зорю
  SKY.polaris = skyHorizon(gmst - 37.954, 89.264, me.lat);

  SKY.depr = Math.max(0, -SKY.sun.el);
  SKY.litKm = skyLitKm(SKY.depr);
  SKY.phase = skyPhaseOf(SKY.sun.el);
  const nx = skyNextMark(nowMs, me.lat, me.lon);
  SKY.nextName = nx.name; SKY.nextT = nx.t;
  SKY.ok = true;
}

/**
 * Чи освітлена сонцем ціль на такій висоті. Повертає:
 *  'day'  — сонце над горизонтом, освітлено все;
 *  'lit'  — земля темна, а ціль у світлі: найкращі умови побачити;
 *  'dark' — і ціль у тіні.
 */
function skyLitState(altKm) {
  if (!SKY.ok) return 'day';
  if (SKY.depr <= 0) return 'day';
  if (!isFinite(SKY.litKm) || SKY.litKm > SKY_LIT_MAX_KM) return 'dark';
  return (altKm != null && altKm >= SKY.litKm) ? 'lit' : 'dark';
}


function feedTypeId(o) {
  const txt = [o.kind, o.subkind, o.title, o.type].filter(Boolean).join(' ');
  for (const [re, id] of FEED_TYPES) if (re.test(txt)) return id;
  return 'unknown';
}
function assumedAlt(typeId) {
  const c = NBK.catalogById(typeId);
  return Math.round(Math.sqrt(Math.max(c.alt[0], 10) * c.alt[1]));
}
function feedStep(dtMs) {
  const t = now();
  for (const it of FEED.items) {
    /* Добігання до щойно отриманої позиції — з уповільненням наприкінці
       (ease-out), а не лінійно: лінійний рух з різкою зупинкою око читає як
       стрибок. Ціль сама при цьому не стоїть: її ведемо числом за курсом, і
       добігання накладається на цей рух як згасаюча поправка. */
    if (!it.areaOnly && it.hdg != null && it.speedKmh > 0) {
      const step = (it.speedKmh / 3.6) * (dtMs / 1000);
      const p0 = NBK.destPoint(it.lat0, it.lon0, it.hdg, step);
      it.lat0 = p0.lat; it.lon0 = p0.lon;
    }
    if (it.animFrom && t - it.animT < 900) {
      const u = (t - it.animT) / 900, k = 1 - Math.pow(1 - u, 3);
      it.lat = it.animFrom.lat + (it.lat0 - it.animFrom.lat) * k;
      it.lon = it.animFrom.lon + (it.lon0 - it.animFrom.lon) * k;
    } else {
      it.animFrom = null;
      it.lat = it.lat0; it.lon = it.lon0;
    }
    const me = myPos();
    if (me) {

      it.az = bd.az; it.ground = bd.dist;
      it.slant = Math.hypot(bd.dist, it.alt - (me.alt || 0));

         помилка 22 %, на 100 км — 61 %, а на 150 км ціль малювалась би над
         горизонтом, хоча фізично вона вже за ним. */

      it.elHi = NBK.elevationTo(bd.dist, it.altHi, me.alt || 0);

    it.ageSec = Math.max(0, (Date.now() - it.lastSeen) / 1000);

    /* Геометрія зближення з НАМИ. Для людини в укритті це головне питання:

    if (me && it.hdg != null && it.speedKmh) {

        ? { level: 0, label: it.advisory ? 'спостереження' : 'у районі', reason: '' }
        : NBK.threatLevel({ closing: it.closing || 0, tcpa, dcpa },
        { nearM: 1500, soonS: 180 });
    } else {
      it.tcpa = it.dcpa = null;
      // без швидкості зближення не порахувати, але «лише район» — це все ж стан, а не порожнеча
      it.threat = (it.advisory || it.areaOnly)
        ? { level: 0, label: it.advisory ? 'спостереження' : 'у районі', reason: '' } : null;

  let worst = null;
  const looseAlarm = feedLooseMode() === 'all';
  for (const it of FEED.items) {
    if (!it.threat || it.threat.level < 2) continue;
    /* Непевний трек тривоги не піднімає: домальована на всі боки група
       двогодинної давнини інакше кричала б «на нас» щовечора. */
    if (it.loose && !looseAlarm) continue;
    if (!worst || it.threat.level > worst.threat.level ||
      (it.threat.level === worst.threat.level && (it.tcpa || 1e9) < (worst.tcpa || 1e9))) worst = it;
  }

  /* Головна ціль палуби — найближча, але ТРЕК завжди важливіший за
     «лише район»: позначка з тексту стоїть у центрі громади, і її 21 км —
     це не відстань до цілі, а відстань до села. Район беремо в герої лише

    c.count = c.clusterN;
    c.threat = gr.reduce((w, x) => (x.threat && (!w || x.threat.level > w.level) ? x.threat : w), head.threat);

const amBin = (az, n) => ((Math.round(az / (360 / n)) % n) + n) % n;

/* ---------- слід сканування ---------- */
/**
 * Позначає сектори, які зараз у полі зору. Ширину беремо зі справжнього
 * поля зору камери, а в укритті — типові 60°: людина все одно бачить не
 * точку, а сектор.

function scanMark(nowMs) {
  const az = S.head.az;
  if (!isFinite(az) || !S.head.absolute) return;
  const fov = (S.set.noCam || !S.fpx) ? 60 : Math.max(20, Math.min(90, NBK.fovFromF(S.cam.w || 1280, S.fpx)));

function acouAdd(nowMs) {

  ACOU.lastT = nowMs;

    const k = Math.exp(-dt / ACOU_TAU);
    for (let i = 0; i < ACOU_BINS; i++) ACOU.bins[i] *= k;
  }
  if (hum > 0.05 && S.head.absolute) {
    const i = amBin(S.head.az, ACOU_BINS);
    // сусіднім секторам дістається менше: мікрофон не гострий, і вдавати гостроту нечесно

    const k = Math.exp(-dt / HEAT_TAU);
    for (let i = 0; i < HEAT.cells.length; i++) HEAT.cells[i] *= k;

  const cands = S.cands || [];
  for (const c of cands) {
    if (!(c.el > 0) || c.el > HEAT_EL_TOP) continue;
    const ai = amBin(c.az, HEAT_AZ);
    const ei = Math.min(HEAT_EL - 1, Math.floor(c.el / (HEAT_EL_TOP / HEAT_EL)));
    HEAT.cells[ei * HEAT_AZ + ai] += (c.score || 0.3) * dt * 4;

 * З яких азимутів заходили цілі. Це не архів чужих даних, а власне
 * спостереження: кожна ціль, побачена вперше, додає одиницю у свій сектор.

    if (o && Array.isArray(o.b) && o.b.length === ACOU_BINS) {

      const k = Math.pow(0.5, days / CORR_HALFLIFE_D);

    if (!isFinite(it.az)) continue;

/**
 * Викликається щокадру з головного циклу. Усе важке має власний крок:
 * спектрограма 120 мс, яскравість 130 мс, решта — арифметика на сотні
 * операцій. Кадр від цього не важчає.

  scanMark(nowMs);

/* ============================================================

   Чому саме тут бібліотека дає щось справжнє, а не просто «красивіше».

   Купол — це нерухома у СВІТІ геометрія: меридіани, висотні кільця,
   лінія горизонту, земля. Раніше вона щокадру перелічувалась у пікселі
   на процесорі: сотні точок, тригонометрія, обрізання. У WebGL вона
   будується РАЗ і живе у сцені як звичайний об'єкт; рухається лише
   камера. А камера — це і є наш кватерніон орієнтації: у three.js
   локальні осі камери збігаються з осями телефона (дивиться вздовж −Z,
   верх — +Y), тому кватерніон кладеться в камеру без жодного перерахунку.
   Саме тому сітка перестає «плавати»: між давачем і картинкою більше
   немає жодної власної математики, яка могла б відставати.

   Плюс те, чого 2D не давав задарма: справжня глибина, додавальне
   змішування для світіння, товсті лінії траєкторій, тисячі позначок
   без просідання кадру.

   Шар необов'язковий. Немає WebGL, старий телефон, контекст загублено —
   вмикається старий 2D-купол, і застосунок працює як раніше.
   ============================================================ */

const GL = {
  on: false,
  ok: false,
  fail: '',
  r: null,          // renderer
  scene: null,
  cam: null,
  dome: null,       // нерухома геометрія купола
  tg: null,         // група позначок цілей
  marks: new Map(), // id → { group, ... }
  fovV: 60,         // вертикальне поле зору, градуси
  R: 500,           // радіус сфери сцени, умовні одиниці
  frames: 0
};
try { window.GL = GL; } catch (e) { }

const GL_COL = {
  grid: 0x2a4635, gridHot: 0x3ddc84, ground: 0x0a1410,
  horizon: 0x3ddc84, feed: 0x5cc8ff, warn: 0xf5b83d, bad: 0xff5a4e, dim: 0x5e7568, rocket: 0xff8a2a
};
/** Колір позначки — той самий, що на 2D-куполі й мапі: ракети помаранчеві, решта за дальністю */
function glItemColor(it) {
  return (typeof feedColorHex === 'function') ? feedColorHex(it) : (it.civil ? GL_COL.dim : GL_COL.feed);
}

/** Напрямок (азимут, кут місця) у координати сцени: X=Схід, Y=Північ, Z=Верх */
function glDir(azDeg, elDeg, r) {
  const a = azDeg * NBK.D2R, e = elDeg * NBK.D2R, R = r == null ? GL.R : r;
  const ce = Math.cos(e);
  return [Math.sin(a) * ce * R, Math.cos(a) * ce * R, Math.sin(e) * R];
}

/* ---------- підняття ---------- */

function glInit() {
  if (GL.ok || GL.fail) return GL.ok;
  if (typeof THREE === 'undefined') { GL.fail = 'three.js не завантажився'; return false; }
  const c = $('#gl');
  if (!c) { GL.fail = 'немає полотна'; return false; }
  try {
    const r = new THREE.WebGLRenderer({
      canvas: c, alpha: true, antialias: !S.set.eco,
      powerPreference: 'high-performance', premultipliedAlpha: true
    });
    r.setClearColor(0x000000, 0);
    GL.r = r;
  } catch (e) { GL.fail = 'WebGL недоступний: ' + e.message; return false; }

  c.addEventListener('webglcontextlost', ev => {
    ev.preventDefault();
    GL.ok = false; GL.fail = 'контекст WebGL загублено';
    glSetOn(false);
    toast('WebGL відпав — купол малюється як раніше', 'warn', 4000);
  });

  GL.scene = new THREE.Scene();
  GL.cam = new THREE.PerspectiveCamera(GL.fovV, 1, 1, GL.R * 4);
  GL.scene.add(GL.cam);
  GL.dome = buildDome();
  GL.scene.add(GL.dome);
  GL.tg = new THREE.Group();
  GL.scene.add(GL.tg);
  GL.ok = true;
  glResize();
  return true;
}

/**
 * Геометрія купола. Будується один раз: меридіани через 30°, висотні
 * кільця через 15°, яскрава лінія горизонту, темна земля під нею і
 * позначки сторін світу. Усе це нерухоме у світі — тому й стоїть.
 */
function buildDome() {
  const g = new THREE.Group();
  const seg = [];      // пари точок для LineSegments
  const push = (a, b) => { seg.push(a[0], a[1], a[2], b[0], b[1], b[2]); };

  // меридіани: від горизонту до зеніту
  for (let az = 0; az < 360; az += 30) {
    for (let el = 0; el < 88; el += 3) push(glDir(az, el), glDir(az, el + 3));
  }
  // висотні кільця
  for (let el = 15; el <= 75; el += 15) {
    for (let az = 0; az < 360; az += 3) push(glDir(az, el), glDir(az + 3, el));
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(seg, 3));
  g.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    color: GL_COL.grid, transparent: true, opacity: 0.7
  })));

  // лінія горизонту — найважливіша лінія на екрані, тому окремо і яскраво
  const hz = [];
  for (let az = 0; az <= 360; az += 2) {
    const p = glDir(az, 0); hz.push(p[0], p[1], p[2]);
  }
  const hgeo = new THREE.BufferGeometry();
  hgeo.setAttribute('position', new THREE.Float32BufferAttribute(hz, 3));
  g.add(new THREE.Line(hgeo, new THREE.LineBasicMaterial({
    color: GL_COL.horizon, transparent: true, opacity: 1
  })));

  // земля: диск нижче горизонту, щоб низ екрана не виглядав як небо
  const gm = new THREE.Mesh(
    new THREE.CircleGeometry(GL.R * 1.6, 64),
    new THREE.MeshBasicMaterial({
      color: GL_COL.ground, transparent: true, opacity: 0.72, side: THREE.DoubleSide
    })
  );
  gm.position.set(0, 0, -GL.R * 0.012);
  g.add(gm);

  // зеніт
  const z = [];
  for (const d of [[0, 88], [180, 88], [90, 88], [270, 88]]) {
    const p = glDir(d[0], d[1]), q = glDir(d[0], 90);
    z.push(p[0], p[1], p[2], q[0], q[1], q[2]);
  }
  const zg = new THREE.BufferGeometry();
  zg.setAttribute('position', new THREE.Float32BufferAttribute(z, 3));
  g.add(new THREE.LineSegments(zg, new THREE.LineBasicMaterial({
