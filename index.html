<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LAND BASE 2026</title>

<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root {
    --ios-bg: #000000;
    --ios-glass: rgba(28, 28, 30, 0.7);
    --accent: #30d158; /* iOS Green */
    --accent-blue: #0a84ff;
    --danger: #ff453a;
    --text: #ffffff;
  }

  * { box-sizing: border-box; -webkit-user-select: none; touch-action: pan-x pan-y; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--ios-bg);
    font-family: 'SF Pro Display', -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  #map { position: absolute; inset: 0; z-index: 0; }
  
  /* Кастомный стиль карты под iOS Dark Mode */
  .dark-filter { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }

  /* ── DYNAMIC ISLAND STATUS ── */
  #status-container {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    z-index: 1000; width: auto; min-width: 180px; height: 36px;
    background: #000; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 15px; border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    pointer-events: none;
  }

  #status-text { font-size: 13px; font-weight: 500; letter-spacing: -0.2px; }

  /* ── BOTTOM TAB BAR (iOS 26 Style) ── */
  #tab-bar {
    position: absolute; bottom: 30px; left: 20px; right: 20px;
    height: 84px; background: var(--ios-glass);
    backdrop-filter: blur(25px) saturate(180%);
    border-radius: 35px; z-index: 100;
    display: flex; justify-content: space-around; align-items: center;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
  }

  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    color: rgba(255,255,255,0.5); transition: 0.3s; cursor: pointer;
  }
  .nav-item.active { color: var(--accent); }
  .nav-item.draw-active { color: var(--accent-blue); }
  .nav-item svg { width: 26px; height: 26px; }
  .nav-item span { font-size: 10px; font-weight: 500; }

  /* ── DRAWER (HISTORY) ── */
  #drawer {
    position: absolute; bottom: -80%; left: 0; width: 100%; height: 70%;
    background: var(--ios-glass); backdrop-filter: blur(30px);
    border-radius: 40px 40px 0 0; z-index: 150;
    transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
    padding: 20px; border-top: 1px solid rgba(255,255,255,0.1);
  }
  #drawer.open { transform: translateY(-100%); }
  .handle-area { width: 100%; height: 40px; margin-top: -20px; display: flex; align-items: center; justify-content: center; }
  .handle {
    width: 40px; height: 5px; background: rgba(255,255,255,0.2);
    border-radius: 10px;
  }

  #land-list { overflow-y: auto; height: calc(100% - 60px); padding-bottom: 40px; }

  .land-card {
    background: rgba(255,255,255,0.05); border-radius: 20px;
    padding: 15px; margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .land-info h4 { margin: 0; font-size: 17px; color: #fff; }
  .land-info p { margin: 3px 0 0; font-size: 12px; color: rgba(255,255,255,0.4); }
  
  .land-actions { display: flex; gap: 10px; }
  .action-btn {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer;
  }
  .btn-edit { background: rgba(10, 132, 255, 0.2); color: var(--accent-blue); }
  .btn-delete { background: rgba(255, 69, 58, 0.2); color: var(--danger); }

  /* ── MARKERS ── */
  .dot-marker {
    width: 14px; height: 14px; background: var(--accent-blue);
    border: 3px solid white; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.3);
  }

  .leaflet-interactive { cursor: crosshair; }
</style>
</head>
<body>

<div id="status-container"><span id="status-text">Система готова</span></div>
<div id="map"></div>

<div id="drawer">
  <div class="handle-area" id="drawer-handle">
    <div class="handle"></div>
  </div>
  <h2 style="font-weight: 600; margin-bottom: 20px; margin-top: 10px;">Мои участки</h2>
  <div id="land-list">
    </div>
</div>

<div id="tab-bar">
  <div class="nav-item" id="nav-locate">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
    <span>Локация</span>
  </div>
  <div class="nav-item" id="nav-layers">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
    <span>Слои</span>
  </div>
  <div class="nav-item" id="nav-draw">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
    <span>Чертить</span>
  </div>
  <div class="nav-item" id="nav-history">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
    <span>База</span>
  </div>
</div>

<script>
  /* ── INIT MAP & LAYERS ── */
  const map = L.map('map', { center: [50.45, 30.52], zoom: 13, zoomControl: false, attributionControl: false });
  
  const layers = {
    dark: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { className: 'dark-filter' }),
    satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'),
    topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png')
  };

  layers.dark.addTo(map);
  let currentLayerIdx = 0;
  const layerKeys = ['dark', 'satellite', 'topo'];
  const layerNames = ['Темная карта', 'Спутник', 'Карта высот'];

  let drawMode = false;
  let tempPoints = [];
  let tempMarkers = [];
  let tempLine = L.polyline([], {color: '#0a84ff', weight: 3, dashArray: '5, 10'}).addTo(map);
  let lands = [];

  /* ── NAVIGATION ── */
  document.getElementById('nav-locate').onclick = () => {
    map.locate({setView: true, maxZoom: 16});
    updateStatus("Поиск GPS...");
  };

  document.getElementById('nav-layers').onclick = () => {
    layerKeys.forEach(k => map.removeLayer(layers[k]));
    currentLayerIdx = (currentLayerIdx + 1) % layerKeys.length;
    layers[layerKeys[currentLayerIdx]].addTo(map);
    updateStatus(layerNames[currentLayerIdx]);
  };

  document.getElementById('nav-draw').onclick = function() {
    drawMode = !drawMode;
    this.classList.toggle('draw-active');
    updateStatus(drawMode ? "Режим черчения" : "Обзор карты");
    if(!drawMode) clearTemp();
  };

  document.getElementById('nav-history').onclick = () => {
    document.getElementById('drawer').classList.add('open');
  };

  /* ── DRAWER SWIPE TO CLOSE ── */
  const drawer = document.getElementById('drawer');
  let startY = 0;
  
  drawer.addEventListener('touchstart', e => startY = e.touches[0].clientY);
  drawer.addEventListener('touchmove', e => {
    const deltaY = e.touches[0].clientY - startY;
    if (deltaY > 100) drawer.classList.remove('open');
  });
  document.getElementById('drawer-handle').onclick = () => drawer.classList.remove('open');

  /* ── DRAWING LOGIC ── */
  map.on('click', (e) => {
    if(!drawMode) return;

    // Замыкание контура
    if(tempPoints.length > 2) {
      const p1 = map.latLngToLayerPoint(tempPoints[0]);
      const p2 = map.latLngToLayerPoint(e.latlng);
      if(p1.distanceTo(p2) < 30) {
        savePolygon();
        return;
      }
    }

    const marker = L.marker(e.latlng, {
      draggable: true,
      icon: L.divIcon({className: 'dot-marker', iconSize: [14,14], iconAnchor: [7,7]})
    }).addTo(map);

    marker.on('drag', () => {
      const idx = tempMarkers.indexOf(marker);
      tempPoints[idx] = marker.getLatLng();
      tempLine.setLatLngs(tempPoints);
    });

    tempMarkers.push(marker);
    tempPoints.push(e.latlng);
    tempLine.setLatLngs(tempPoints);
  });

  function savePolygon() {
    const name = prompt("Название участка:", `Участок ${lands.length + 1}`);
    if(!name) return;

    const poly = L.polygon(tempPoints, {color: '#30d158', weight: 3, fillOpacity: 0.3}).addTo(map);
    const id = Date.now();
    const center = poly.getBounds().getCenter();

    lands.push({ id, name, poly, center });
    updateLandList();
    clearTemp();
    updateStatus("Объект сохранен");
  }

  function clearTemp() {
    tempMarkers.forEach(m => map.removeLayer(m));
    tempMarkers = []; tempPoints = [];
    tempLine.setLatLngs([]);
  }

  /* ── DATA MANAGEMENT ── */
  function updateLandList() {
    const container = document.getElementById('land-list');
    container.innerHTML = '';
    
    lands.forEach(land => {
      const card = document.createElement('div');
      card.className = 'land-card';
      card.innerHTML = `
        <div class="land-info" onclick="focusLand(${land.id})">
          <h4>${land.name}</h4>
          <p>${land.center.lat.toFixed(5)}, ${land.center.lng.toFixed(5)}</p>
        </div>
        <div class="land-actions">
          <button class="action-btn btn-edit" onclick="renameLand(${land.id})">✎</button>
          <button class="action-btn btn-delete" onclick="deleteLand(${land.id})">✕</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  window.focusLand = (id) => {
    const land = lands.find(l => l.id === id);
    map.flyTo(land.center, 16);
    drawer.classList.remove('open');
  };

  window.renameLand = (id) => {
    const land = lands.find(l => l.id === id);
    const newName = prompt("Новое имя:", land.name);
    if(newName) {
      land.name = newName;
      updateLandList();
    }
  };

  window.deleteLand = (id) => {
    if(!confirm("Удалить запись?")) return;
    const idx = lands.findIndex(l => l.id === id);
    map.removeLayer(lands[idx].poly);
    lands.splice(idx, 1);
    updateLandList();
  };

  function updateStatus(text) {
    const el = document.getElementById('status-text');
    const container = document.getElementById('status-container');
    el.textContent = text;
    container.style.transform = 'translateX(-50%) scale(1.1)';
    setTimeout(() => container.style.transform = 'translateX(-50%) scale(1)', 250);
  }

  map.on('locationfound', (e) => {
    updateStatus("Геопозиция активна");
    L.circle(e.latlng, {radius: 10, color: '#0a84ff'}).addTo(map);
  });
</script>

</body>
</html>
