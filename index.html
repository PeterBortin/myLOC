      r.forEach(function(p){
        if(p[0] < b[0]) b[0] = p[0]; if(p[1] < b[1]) b[1] = p[1];
        if(p[0] > b[2]) b[2] = p[0]; if(p[1] > b[3]) b[3] = p[1];
      });
    });
  });
  return b;
}

/* ═══════════════════════ КОНТРОЛЕР ═══════════════════════ */

function Alerts(map, opts){
  opts = opts || {};
  this.map = map;
  this.o = opts;
  this.srcId = opts.srcId || 'ua-oblasts';
  this.url = opts.url || GEO_URL;
  this.geo = null;
  this.feats = [];                 // [{name, shape, geom, bbox}]
  this.byName = {};                // укр назва → shapeName
  this.state = {};                 // укр назва → {lvl, since, by, kinds}
  this.part = {};                  // укр назва → {lvl, raions[]} — накрито лише районами
  this.clearing = {};              // укр назва → час початку зеленого спалаху
  this.raf = null;
  this.ready = false;
  this.visible = opts.visible !== false;
  this.forecastMin = opts.forecastMin == null ? 10 : opts.forecastMin;
  this.onChange = opts.onChange || null;
  this.log = [];                   // журнал: {t, name, lvl, kind:'on'|'off'|'up'}
}

Alerts.prototype.load = function(){
  var self = this;
  if(this._loading) return this._loading;
  this._loading = fetch(this.url, {cache:'force-cache'})
    .then(function(r){ if(!r.ok) throw new Error('geoBoundaries ' + r.status); return r.json(); })
    .then(function(gj){ self.apply(gj); return self; })
    /* Відхилений проміс лишався в кеші назавжди: одна невдача з мережею —
       і тривоги мертві до перезавантаження сторінки. */
    .catch(function(e){ self._loading = null; throw e; });
  return this._loading;
};

/* прийняти геометрію, звести назви, поставити шари */
Alerts.prototype.apply = function(gj){
  var self = this;
  this.geo = gj;
  this.feats = (gj.features || []).map(function(f){
    return {shape:(f.properties && f.properties.shapeName) || '', geom:f.geometry,
      bbox:bboxOf(f.geometry), name:null};
  });

  /* мапінг укр ↔ shapeName по центроїдах, не по рядку */
  var miss = [];
  OBLASTS.forEach(function(o){
    var hit = null;
    for(var i = 0; i < self.feats.length; i++){
      var f = self.feats[i], b = f.bbox;
      if(o.ll[0] < b[0] || o.ll[0] > b[2] || o.ll[1] < b[1] || o.ll[1] > b[3]) continue;
      if(geomHas(o.ll, f.geom)){ hit = f; break; }
    }
    if(hit){ hit.name = o.n; self.byName[o.n] = hit.shape; }
    else miss.push(o.n);
  });
  this.unmapped = miss;

  this.addLayers();
  this.ready = true;
  return miss;
};

Alerts.prototype.addLayers = function(){
  var map = this.map, id = this.srcId;
  if(map.getSource(id)) return;
  map.addSource(id, {type:'geojson', data:this.geo, promoteId:'shapeName'});

  var vis = this.visible ? 'visible' : 'none';
  var before = this.o.before;

  /* прогноз: куди ціль тільки входить. Окремий шар і слабша заливка —
     щоб на око не плутати з оголошеною тривогою. */
  map.addLayer({id:id + '-fc-fill', type:'fill', source:id, layout:{visibility:vis},
    paint:{
      'fill-color':['case',
        ['==', ['feature-state','fc'], 2], LVL_COL[2],
        ['==', ['feature-state','fc'], 1], LVL_COL[1], 'rgba(0,0,0,0)'],
      'fill-opacity':['case', ['>', ['coalesce',['feature-state','fc'],0], 0], 0.07, 0]
    }}, before);

  /* Три ступені насиченості, і це не косметика: залита на повну область
     означає «тривога в усій області», приглушена — «накрито лише окремі
     райони». Малювати їх однаково = брехати про масштаб. */
  map.addLayer({id:id + '-fill', type:'fill', source:id, layout:{visibility:vis},
    paint:{
      'fill-color':['case',
        ['==', ['feature-state','lvl'], 2], LVL_COL[2],
        ['==', ['feature-state','lvl'], 1], LVL_COL[1],
        ['==', ['feature-state','part'], 2], LVL_COL[2],
        ['==', ['feature-state','part'], 1], LVL_COL[1], 'rgba(0,0,0,0)'],
      'fill-opacity':['case',
        ['==', ['feature-state','lvl'], 2], 0.22,
        ['==', ['feature-state','lvl'], 1], 0.17,
        ['>', ['coalesce',['feature-state','part'],0], 0], 0.07, 0]
    }}, before);

  /* відбій: зелений спалах, що згасає */
  map.addLayer({id:id + '-clear', type:'fill', source:id, layout:{visibility:vis},
    paint:{'fill-color':'#3fe08a',
      'fill-opacity':['coalesce', ['feature-state','clr'], 0]}}, before);

  map.addLayer({id:id + '-line', type:'line', source:id, layout:{visibility:vis},
    paint:{
      'line-color':['case',
        ['==', ['feature-state','lvl'], 2], LVL_COL[2],
        ['==', ['feature-state','lvl'], 1], LVL_COL[1],
        ['==', ['feature-state','part'], 2], LVL_COL[2],
        ['==', ['feature-state','part'], 1], LVL_COL[1],
        ['>', ['coalesce',['feature-state','fc'],0], 0], '#6d7f76', '#44554d'],
      'line-width':['case',
        ['>', ['coalesce',['feature-state','lvl'],0], 0], 1.8,
        ['>', ['coalesce',['feature-state','part'],0], 0], 0.9, 0.5],
      /* line-dasharray не приймає feature-state — вираз тут мовчки відкидає
         ВЕСЬ шар, і контуру просто немає. Тому пунктир не чіпаємо, а
         прогноз від оголошеної тривоги відрізняємо товщиною й прозорістю. */
      'line-opacity':['case',
        ['>', ['coalesce',['feature-state','lvl'],0], 0], 0.9,
        ['>', ['coalesce',['feature-state','part'],0], 0], 0.5,
        ['>', ['coalesce',['feature-state','fc'],0], 0], 0.45, 0.16]
    }}, before);
};

/* ─────────────── яка це область ─────────────── */
Alerts.prototype.oblastOf = function(ll){
  for(var i = 0; i < this.feats.length; i++){
    var f = this.feats[i], b = f.bbox;
    if(ll[0] < b[0] || ll[0] > b[2] || ll[1] < b[1] || ll[1] > b[3]) continue;
    if(geomHas(ll, f.geom)) return f.name || f.shape;
  }
  return null;
};

/* ─────────────── головне: звести стан ───────────────
   alertNames  офіційний перелік областей із NEPTUN /alerts
   targets     активні цілі (нормалізовані записи фіду)                    */
Alerts.prototype.update = function(alertNames, targets, raionsBy, since){
  if(!this.ready) return;
  var self = this, N = window.TerenNeptun;
  var now = Date.now();
  var next = {}, part = {}, sinceBy = since || {};

  /* 1. тривога в УСІЙ області — рівень поки невідомий */
  (alertNames || []).forEach(function(n){
    if(!self.byName[n]) return;
    /* Час початку дає сам NEPTUN (oblastSince). Без нього «скільки триває»
       рахувалося від миті, коли МИ вперше побачили тривогу, тобто після
       кожного перезавантаження сторінки — з нуля. */
    next[n] = {lvl:1, by:'alert', kinds:{}, est:true, t0:sinceBy[n] || 0};
  });

  /* 1б. накрито лише окремі райони. Геометрія в нас по областях, тож
     показуємо це приглушеною заливкою й підписом «частково», а не
     повноцінною тривогою: інакше одна Одещина світилась би так само,
     як накрита цілком Харківщина. */
  var rb = raionsBy || {};
  Object.keys(rb).forEach(function(n){
    if(!self.byName[n] || next[n]) return;
    part[n] = {lvl:1, raions:rb[n] || []};
  });

  /* 2. цілі: піднімають рівень там, де вони зараз */
  var fc = {};
  (targets || []).forEach(function(t){
    if(!t || t.status !== 'active') return;
    var ll;
    try { ll = N && N.posAt ? N.posAt(t, now) : [t.lon, t.lat]; } catch(e){ ll = [t.lon, t.lat]; }
    if(!isFinite(ll[0]) || !isFinite(ll[1])) ll = [t.lon, t.lat];

    var sub = t.subkind || 'unknown';
    var lvl = RED[sub] ? 2 : AMBER[sub] ? 1 : 1;

    var nm = self.oblastOf(ll);
    if(nm && self.byName[nm]){
      /* ціль фізично над областю — це вже не «частково десь у районах» */
      if(part[nm]) delete part[nm];
      var e = next[nm] || (next[nm] = {lvl:0, by:'target', kinds:{}, est:true});
      if(lvl > e.lvl){ e.lvl = lvl; }
      e.by = 'target'; e.est = false;          // ціль видно — рівень уже не здогад
      e.kinds[sub] = (e.kinds[sub] || 0) + (t.amount || 1);
    }

    /* 3. коридор прогнозу: куди ціль увійде за forecastMin хвилин.
       Без курсу прогнозу немає: `t.hdg || 0` означало б азимут 0, і коридор
       лягав би строго на північ — області підсвічувались без підстав. */
    if(!self.forecastMin || !N || !N.dest || t.hdg == null) return;
    var km = Math.max(20, (t.speed || 300) * (self.forecastMin / 60));
    for(var f = 0.34; f <= 1.001; f += 0.33){
      var p;
      try { p = N.dest(ll[0], ll[1], t.hdg, km * f); } catch(e2){ continue; }
      var n2 = self.oblastOf(p);
      if(!n2 || !self.byName[n2]) continue;
      var e2 = next[n2];
      if(!e2){ fc[n2] = Math.max(fc[n2] || 0, lvl); continue; }
      /* Область уже під тривогою, але рівень ніхто не оголошував, а сюди
         за 10 хв заходить щось важче — піднімаємо. Саме так Київ стає
         червоним, коли КР ще над Київською: чекати, поки вона долетить
         до межі міста, і показувати доти жовтий — гірше за помилку. */
      if(e2.est && lvl > e2.lvl){ e2.lvl = lvl; e2.by = 'forecast'; }
    }
  });

  this.commit(next, fc, part, now);
};

/* застосувати різницю до мапи й журналу */
/* silent — переставити стан шарів, не пишучи в журнал і не пускаючи зелений
   спалах. Потрібне, коли стиль перезібрався і джерело треба відновити:
   інакше перемикання підкладки вночі дало б 12 брехливих «відбоїв». */
Alerts.prototype.commit = function(next, fc, part, now, silent){
  var self = this, map = this.map, id = this.srcId;
  var prev = this.state;
  var changed = false;

  function fs(nm, st){
    var sid = self.byName[nm];
    if(!sid) return;
    try { map.setFeatureState({source:id, id:sid}, st); } catch(e){}
  }

  /* нові й змінені */
  Object.keys(next).forEach(function(nm){
    var n = next[nm], p = prev[nm];
    n.since = n.t0 || (p ? p.since : now);
    if(!p){
      fs(nm, {lvl:n.lvl, clr:0, fc:0, part:0});
      if(!silent) self.push('on', nm, n.lvl);
      changed = true;
    } else if(p.lvl !== n.lvl){
      fs(nm, {lvl:n.lvl});
      if(!silent) self.push(n.lvl > p.lvl ? 'up' : 'down', nm, n.lvl);
      changed = true;
    }
  });

  /* відбій: зникло зі списку */
  Object.keys(prev).forEach(function(nm){
    if(next[nm]) return;
    fs(nm, {lvl:0});
    if(!silent){ self.startClear(nm); self.push('off', nm, 0); }
    changed = true;
  });

  /* часткові: тихо, без журналу — район під тривогою це не подія масштабу
     області, і засмічувати нею стрічку подій означало б її знецінити */
  var pp = this.part || {};
  Object.keys(part).forEach(function(nm){
    if(!pp[nm] || pp[nm].lvl !== part[nm].lvl){ fs(nm, {part:part[nm].lvl}); changed = true; }
    else if((pp[nm].raions || []).length !== (part[nm].raions || []).length) changed = true;
    part[nm].since = pp[nm] ? pp[nm].since : now;
  });
  Object.keys(pp).forEach(function(nm){ if(!part[nm]){ fs(nm, {part:0}); changed = true; } });
  this.part = part;

  /* прогнозний коридор */
  var pf = this._fc || {};
  Object.keys(fc).forEach(function(nm){ if(pf[nm] !== fc[nm]) fs(nm, {fc:fc[nm]}); });
  Object.keys(pf).forEach(function(nm){ if(!fc[nm]) fs(nm, {fc:0}); });
  this._fc = fc;

  this.state = next;
  if(changed && this.onChange) this.onChange(this.list(), this.log);
};

/* журнал подій — у ТЕРЕНі його видно в ЖУРНАЛІ */
Alerts.prototype.push = function(kind, name, lvl){
  this.log.unshift({t:Date.now(), name:name, lvl:lvl, kind:kind});
  if(this.log.length > 200) this.log.length = 200;
};

/* ─────────────── зелений спалах відбою ───────────────
   Окремої сирени відбою більше немає, тож спалах по полігону плюс рядок
   у журналі — це і є весь сигнал. Півтори секунди, далі згасає. */
Alerts.prototype.startClear = function(nm){
  this.clearing[nm] = performance.now();
  /* ставимо пік одразу, не чекаючи першого rAF — інакше між зняттям
     тривоги й початком згасання проскакує темний кадр */
  try { this.map.setFeatureState({source:this.srcId, id:this.byName[nm]}, {clr:0.32}); } catch(e){}
  if(!this.raf) this.tickClear();
};

Alerts.prototype.tickClear = function(){
  var self = this, map = this.map, id = this.srcId;
  var names = Object.keys(this.clearing);
  if(!names.length){ this.raf = null; return; }
  var now = performance.now();
  names.forEach(function(nm){
    var a = 0.32 * (1 - (now - self.clearing[nm]) / 1500);
    var sid = self.byName[nm];
    try {
      if(a <= 0){ map.setFeatureState({source:id, id:sid}, {clr:0}); delete self.clearing[nm]; }
      else map.setFeatureState({source:id, id:sid}, {clr:a});
    } catch(e){ delete self.clearing[nm]; }
  });
  this.raf = requestAnimationFrame(function(){ self.tickClear(); });
};

/* ─────────────── для панелі ─────────────── */

/* активні тривоги, найсвіжіші зверху */
Alerts.prototype.list = function(){
  var s = this.state, p = this.part || {}, out = [];
  for(var nm in s){
    var e = s[nm];
    out.push({
      name:nm, lvl:e.lvl, level:LVL_UK[e.lvl] || '—', col:LVL_COL[e.lvl] || '#7d8f87',
      since:e.since, mins:Math.round((Date.now() - e.since) / 60000),
      by:e.by, est:e.est, partial:false,
      kinds:Object.keys(e.kinds || {}).map(function(k){
        return {type:k, n:e.kinds[k],
          uk:(window.TERRAIN_SPECS && window.TERRAIN_SPECS.NEPTUN_TITLE[k]) || k};
      })
    });
  }
  for(var nm2 in p){
    var q = p[nm2], n = (q.raions || []).length;
    out.push({
      name:nm2, lvl:q.lvl, level:'частково · ' + n + (n === 1 ? ' район' : ' р-нів'),
      col:LVL_COL[q.lvl] || '#7d8f87',
      since:q.since || Date.now(), mins:Math.round((Date.now() - (q.since || Date.now())) / 60000),
      by:'raion', est:true, partial:true, raions:q.raions || [], kinds:[]
    });
  }
  /* повні тривоги завжди вище часткових: вони про більшу територію */
  out.sort(function(a, b){
    return (a.partial - b.partial) || (b.lvl - a.lvl) || (b.since - a.since); });
  return out;
};

/* картка області для панелі — з чесним підписом, звідки взявся рівень */
Alerts.prototype.card = function(nm){
  var e = this.state[nm];
  if(!e){
    var q = (this.part || {})[nm];
    if(q){
      var names = (q.raions || []).map(function(r){ return r.name; }).filter(Boolean);
      return {title:nm, lvl:q.lvl, col:LVL_COL[q.lvl], rows:[
        ['Стан', 'тривога не в усій області'],
        ['Райони', names.length ? names.join(', ') : (q.raions || []).length + ' р-нів'],
        ['Джерело', 'NEPTUN дає перелік районів; рівень по них не оголошено']
      ]};
    }
    return {title:nm, lvl:0, rows:[['Стан', 'тривоги немає']]};
  }
  var rows = [
    ['Рівень', LVL_UK[e.lvl]],
    ['Триває', e.mins != null ? e.mins + ' хв' : Math.round((Date.now() - e.since) / 60000) + ' хв']
  ];
  var ks = Object.keys(e.kinds || {});
  if(ks.length){
    rows.push(['Над областю', ks.map(function(k){
      var uk = (window.TERRAIN_SPECS && window.TERRAIN_SPECS.NEPTUN_TITLE[k]) || k;
      return uk + ' ×' + e.kinds[k];
    }).join(', ')]);
  }
  rows.push(['Джерело',
    e.by === 'forecast' ? 'офіційна тривога NEPTUN; рівень підвищено за прогнозом підходу цілі (оцінка)'
    : e.est ? 'офіційна тривога NEPTUN; рівень не оголошено — показано мінімальний'
    : 'рівень визначено за типами цілей над областю (оцінка, не офіційний статус)']);
  return {title:nm, lvl:e.lvl, col:LVL_COL[e.lvl], rows:rows};
};

Alerts.prototype.setVisible = function(v){
  this.visible = !!v;
  var map = this.map, id = this.srcId;
  /* Шарів може ще не бути: межі областей тягнуться з мережі, і тумблер
     легко натиснути раніше. try/catch ковтав це мовчки, але MapLibre
     встигав написати «Cannot style non-existing layer» — а головне, вибір
     користувача пропадав: addLayers ставив видимість із this.visible.
     Тепер прапорець лишається, і addLayers його підхопить. */
  [id + '-fc-fill', id + '-fill', id + '-clear', id + '-line'].forEach(function(l){
    if(!map.getLayer(l)) return;
    try { map.setLayoutProperty(l, 'visibility', v ? 'visible' : 'none'); } catch(e){}
  });
};

/* усе погасити (наприклад, коли фід вимкнули) */
/* Тумблер «фід вимкнув» — не відбій: писати в журнал «тривога скасована» по
   кожній області означало б збрехати про обстановку. Гасимо тихо. */
Alerts.prototype.reset = function(){
  this.commit({}, {}, {}, Date.now(), true);
};

/* ═══════════════════════ ПІДКЛЮЧЕННЯ ═══════════════════════ */
function attach(map, opts){
  var a = new Alerts(map, opts);
  var started = false;
  /* Та сама пастка, що й у 3d-шарі: `load` одноразовий, і якщо він уже
     минув, геометрія не завантажиться ніколи. Слухаємо styledata, який
     приходить і після перезбирання стилю. */
  function go(){
    if(started || !map.style) return;
    started = true;
    a.load().catch(function(e){ if(opts && opts.onError) opts.onError(e); });
  }
  go();
  if(!started){
    var n = 0, t = setInterval(function(){ go(); if(started || ++n > 80) clearInterval(t); }, 120);
  }
  map.on('styledata', function(){
    go();
    /* стиль перезібрався — шари зникли разом із ним */
    if(a.ready && !map.getSource(a.srcId)){
      /* джерело пішло разом зі стилем: відновлюємо шари й ТИХО перемальовуємо
         наявний стан назад у feature-state, не оголошуючи відбій */
      var keep = a.state, keepP = a.part;
      a.state = {}; a.part = {};
      a.addLayers();
      a.commit(keep, a._fc || {}, keepP, Date.now(), true);
    }
  });
  return a;
}

window.TerenAlerts = {
  attach:attach, Alerts:Alerts, OBLASTS:OBLASTS,
  GEO_URL:GEO_URL, LVL_UK:LVL_UK, LVL_COL:LVL_COL, RED:RED, AMBER:AMBER,
  oblastOf:function(a, ll){ return a.oblastOf(ll); }
};
})();
</script>
<script>
/* ТЕРЕН · ВОДА — де кораблю можна плавати
   ────────────────────────────────────────────────────────────────────────────
   Берегова лінія Чорного й Азовського морів із Natural Earth 1:10m (суспільне

/* ═══════════════════════ ГЕОМЕТРІЯ ═══════════════════════ */
function hav(a, b){
  var dLat = (b[1]-a[1])*R2, dLon = (b[0]-a[0])*R2;
  var s = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(a[1]*R2)*Math.cos(b[1]*R2)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 6371 * 2 * Math.asin(Math.min(1, Math.sqrt(s)));
}
function bearing(a, b){
  var y = Math.sin((b[0]-a[0])*R2)*Math.cos(b[1]*R2);
  var x = Math.cos(a[1]*R2)*Math.sin(b[1]*R2) -
          Math.sin(a[1]*R2)*Math.cos(b[1]*R2)*Math.cos((b[0]-a[0])*R2);
  return (Math.atan2(y, x)/R2 + 360) % 360;
}
function pathLen(p){ var d = 0; for(var i = 1; i < p.length; i++) d += hav(p[i-1], p[i]); return d; }
function lerp(a, b, f){ return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f]; }

function posOnPath(p, total, fr){
  fr = Math.max(0, Math.min(0.999, fr));
  var d = fr * total;
  for(var i = 1; i < p.length; i++){
    var seg = hav(p[i-1], p[i]);
    if(d <= seg || i === p.length - 1){
      var f = seg ? d/seg : 0;
      return {pos:[p[i-1][0]+(p[i][0]-p[i-1][0])*f, p[i-1][1]+(p[i][1]-p[i-1][1])*f],
        hdg:bearing(p[i-1], p[i])};
    }
    d -= seg;
  }
  return {pos:p[p.length-1].slice(), hdg:bearing(p[0], p[p.length-1])};
}

/* детермінований генератор: той самий сід — той самий наліт */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* Висота на частці шляху. Профіль той самий, що в живому шарі (specs), але
   тут відомі і довжина маршруту, і висота пуску — тож фази рахуються в
   кілометрах. total/a0 беремо з цілі, якщо вона передана. */
function altAt(spec, p, total, a0){
  var S = window.TERRAIN_SPECS;
  if(S && S.altProfile){
    if(total == null) return S.altAt(spec, p);
    return S.altProfile(spec, p * total, total, a0);
  }
  return spec.profile === 'arc' ? spec.apo * 4 * p * (1-p) : spec.altMin;
}
function thAlt(th, p){ return altAt(th.spec, p, th.total, th.a0); }

/* Швидкість по фазах. Балістична не летить рівно: розгін, інерційна ділянка
   з апогеєм, потім спуск — і саме на спуску вона найшвидша, через що
   термінальна ділянка й найважча для перехоплення. Решта розганяється
   після пуску (катапульта, прискорювач, відділення від носія). */
function speedAt(spec, p, total){
  if(spec.profile === 'arc'){
    if(p < 0.12) return spec.speed * (0.26 + (0.60-0.26) * (p/0.12));
    if(p < 0.60) return spec.speed * (0.60 + (0.78-0.60) * ((p-0.12)/0.48));
    return spec.speed * (0.78 + (1.22-0.78) * ((p-0.60)/0.40));
  }
  var S = window.TERRAIN_SPECS;
  if(S && S.speedProfile && total) return S.speedProfile(spec, p * total, total);
  return spec.speed * (0.85 + 0.30 * p);
}
function phaseAt(spec, p, total, a0){
  if(spec.profile === 'arc') return p < 0.12 ? 'boost' : p < 0.60 ? 'midcourse' : 'terminal';
  if(spec.glide) return 'glide';
  var S = window.TERRAIN_SPECS;
  if(total && S && S.phaseKm){
    var k = S.phaseKm(spec, total, a0), d = p * total;
    if(d < k.climbKm) return k.descent ? 'descent' : 'climb';
    if(total - d < k.termKm) return 'dive';
  }
  return 'cruise';
}
var PHASE_UK = {boost:'розгін', midcourse:'інерційна', terminal:'спуск', cruise:'маршова',
  climb:'набір висоти', dive:'пікірування', glide:'планування', descent:'зниження з носія'};

/* Скільки хвилин летіти маршрут довжиною km — тим самим інтегруванням, що
   й у нальоті. Картка рахувала по сталій швидкості й розходилась із рушієм
   у півтора раза на балістиці. */
function flightMin(spec, km){
  if(!spec || !km) return 0;
  var tt = buildTT(spec, km);
  return tt[tt.length - 1].t / 60;
}

/* таблиця «частка шляху → час»: інтегруємо змінну швидкість */
function buildTT(spec, total){
  var N = 64, tt = [{p:0, t:0}], t = 0;
  for(var i = 1; i <= N; i++){
    var p0 = (i-1)/N, p1 = i/N, pm = (p0+p1)/2;
    var v = speedAt(spec, pm, total) / 3600;
    t += v > 0 ? (p1-p0) * total / v : 0;
    tt.push({p:p1, t:t});
  }
  return tt;
}
function pAtTime(tt, el){
  if(el <= 0) return 0;
  if(el >= tt[tt.length-1].t) return 0.999;
  for(var i = 1; i < tt.length; i++){
    if(el <= tt[i].t){
      var f = (el - tt[i-1].t) / ((tt[i].t - tt[i-1].t) || 1);
      return Math.min(0.999, tt[i-1].p + (tt[i].p - tt[i-1].p) * f);
    }
  }
  return 0.999;
}
function threatPosAt(th, el){
  var p = pAtTime(th.tt, el), c = posOnPath(th.path, th.total, p);
  return {pos:c.pos, hdg:c.hdg, p:p, alt:thAlt(th, p)};
}

/* ═══════════════════════ ОРІЄНТАЦІЯ ═══════════════════════
   Ніс дивиться вздовж вектора швидкості, а не лише по курсу: на наборі
   висоти — вгору, на пікіруванні — вниз. Курс береться по хорді ±1 км,
   тому на вершинах маршруту борт повертає плавно, а не стрибком, і з
   кутової швидкості цього повороту виходить крен (координований віраж:
   tg φ = v·ω / g). Тангаж — справжній кут траєкторії; як його показати з
   підсиленням вертикалі, вирішує шар мапи.                               */
var G = 9.81;
function wrap180(a){ return ((a + 540) % 360) - 180; }
function attitude(th, el){
  var total = th.total, p = pAtTime(th.tt, el);
  var dK = Math.max(0.05, Math.min(1.0, total * 0.02)), dp = dK / total;
  var P = function(q){ return posOnPath(th.path, total, Math.max(0, Math.min(0.999, q))).pos; };
  var a = P(p - dp), c = P(p + dp);
  var hdg = bearing(a, c);
  /* тангаж: різниця висот на ±200 м шляху */
  var e = Math.min(0.02, 0.2 / total);
  var h1 = thAlt(th, Math.max(0, p - e)), h2 = thAlt(th, Math.min(0.999, p + e));
  var run = Math.max(1, (Math.min(0.999, p + e) - Math.max(0, p - e)) * total * 1000);
  var pitch = Math.atan2(h2 - h1, run) / R2;
  /* крен: наскільки курс повертає між двома сусідніми хордами */
  var roll = 0;
  /* Наприкінці шляху pAtTime упирається в 0.999, і обидві хорди схлопуються
     в точку: bearing(a,a) = 0, а різниця курсів «повертає» борт на весь
     азимут — модель різко лягала на бік за секунду до влучання. */
  var q0 = Math.max(0, p - 2 * dp), q1 = Math.min(0.999, p + 2 * dp);
  if(th.spec.profile !== 'arc' && p - q0 > 1e-6 && q1 - p > 1e-6){
    var hA = bearing(P(q0), P(p)), hB = bearing(P(p), P(q1));
    var v = speedAt(th.spec, p, total) / 3.6;
    var dt = Math.max(0.5, dK * 2000 / Math.max(1, v));
    var w = wrap180(hB - hA) * R2 / dt;
    var lim = th.spec.cat === 'drone' ? 55 : 65;
    roll = Math.max(-lim, Math.min(lim, Math.atan(v * w / G) / R2));
  }
  return {hdg:hdg, pitch:pitch, roll:roll};
}

/* ═══════════════════════ РУХ НОСІЇВ ═══════════════════════
   Детермінована функція часу: той самий t — та сама точка. Тільки так
   перемотка й ×30 показують літак там, де він справді був у момент пуску.

   Літак і вертоліт патрулюють навколо точки: кут росте рівномірно з
   невеликою модуляцією (прискорення й гальмування), радіус «дихає»,
   орбіта трохи еліптична й повільно повертається, висота плавно ходить
   між altLo і altHi. Сума синусів із непорівнянними періодами — ривків
   немає за визначенням, бо всі похідні неперервні.

   Корабель ходить маршрутом туди-назад: на кінцях гальмує до нуля
   (косинусна ділянка), розвертається на 180° плавно, а не стрибком, а на
   проміжних точках курс згладжується хордою.                              */
function seedOf(id){
  var h = 2166136261, str = String(id || '');
  for(var i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function phases(id, n){
  var R = mulberry32(seedOf(id) || 7), out = [];
  for(var i = 0; i < n; i++) out.push(R() * 6.2832);
  return out;
}
function kmTo(home, x, y){
  return [home[0] + x / (111.32 * Math.cos(home[1] * R2)), home[1] + y / 110.57];
}
function orbitXY(m, t){
  var R = Math.max(0.5, m.orbR), w0 = (m.spd / 3600) / R, ph = m.ph;
  /* амплітуди підібрані так, щоб крейсерська гуляла в межах ~±20 %:
     більші давали F-16 на патрулі 1260 км/год на виході з повороту.
     Вертоліт полює жвавіше: зміїться петлями всередині кола, тож крени
     й розвороти в нього видно, а не лише рівне коло. */
  var heli = m.spd < 400, k = heli ? 1 : 0;
  var th = ph[0] + w0 * t + (0.25 + 0.35 * k) * Math.sin((0.21 + 0.9 * k) * w0 * t + ph[1]);
  var r = R * (1 + 0.07 * Math.sin(0.33 * w0 * t + ph[2]) +
               (0.03 + 0.22 * k) * Math.sin((1.7 + 1.3 * k) * w0 * t + ph[3]));
  var e = 0.08, psi = 0.05 * w0 * t + ph[4];
  var x = r * Math.cos(th) * (1 + e), y = r * Math.sin(th) * (1 - e);
  return [x * Math.cos(psi) - y * Math.sin(psi), x * Math.sin(psi) + y * Math.cos(psi)];
}
function orbitAlt(m, t){
  var w0 = (m.spd / 3600) / Math.max(0.5, m.orbR), ph = m.ph;
  return m.altLo + (m.altHi - m.altLo) *
    (0.5 + 0.32 * Math.sin(0.17 * w0 * t + ph[5]) + 0.18 * Math.sin(0.61 * w0 * t + ph[6]));
}
function orbitAt(m, t, lite){
  var xy = orbitXY(m, t), pos = kmTo(m.home, xy[0], xy[1]);
  var alt = orbitAlt(m, t);
  if(lite) return {pos:pos, alt:alt};
  var a = orbitXY(m, t - 1), b = orbitXY(m, t + 1);
  var hdg = (Math.atan2(b[0] - a[0], b[1] - a[1]) / R2 + 360) % 360;
  var spd = Math.hypot(b[0] - a[0], b[1] - a[1]) / 2 * 3600;
  var v = spd / 3.6;
  /* тангаж — кут набору; крен — з кутової швидкості на віражі */
  var climb = (orbitAlt(m, t + 1) - orbitAlt(m, t - 1)) / 2;
  var pitch = Math.atan2(climb, Math.max(1, v)) / R2;
  var p0 = orbitXY(m, t - 3), p1 = orbitXY(m, t + 3);
  var hA = Math.atan2(xy[0] - p0[0], xy[1] - p0[1]) / R2, hB = Math.atan2(p1[0] - xy[0], p1[1] - xy[1]) / R2;
  var w = wrap180(hB - hA) * R2 / 3;
  var heli = m.spd < 400;
  var roll = Math.max(-60, Math.min(60, Math.atan(v * w / G) / R2 * (heli ? 1.6 : 1)));
  /* вертоліт летить із нахиленим уперед носом — що швидше, то нижче */
  var tilt = heli ? -(3 + 9 * Math.max(0, Math.min(1.4, spd / m.spd))) : 2;
  return {pos:pos, alt:alt, hdg:hdg, spd:spd, pitch:pitch, roll:roll, tilt:tilt};
}

/* точка на маршруті за пройденою відстанню */
function along(route, segs, d){
  for(var i = 0; i < segs.length; i++){
    if(d <= segs[i] || i === segs.length - 1){
      var f = segs[i] ? Math.max(0, Math.min(1, d / segs[i])) : 0;
      return lerp(route[i], route[i+1], f);
    }
    d -= segs[i];
  }
  return route[route.length - 1].slice();
}
/* Хід маршрутом туди-назад. Швидкість — трапеція: стала spd на плечі й
   косинусні розгін/гальмування лише на ~1 км біля кінців. Попередній
   косинус на все плече давав пікову швидкість spd·π/2 — «30 км/год» у
   картці ставали 47 на воді. */
function legPlan(m){
  if(m._leg) return m._leg;
  var V = m.spd / 3600, L = m.len;
  var Lr = Math.min(L / 4, 1.2);                   // довжина рампи, км
  var Tr = 2 * Lr / V, Tc = (L - 2 * Lr) / V;       // рампа й стала ділянка, с
  return (m._leg = {V:V, Lr:Lr, Tr:Tr, Tc:Tc, T:2 * Tr + Tc});
}
function legDist(g, L, t){
  if(t < g.Tr) return g.V / 2 * (t - g.Tr / Math.PI * Math.sin(Math.PI * t / g.Tr));
  if(t < g.Tr + g.Tc) return g.Lr + g.V * (t - g.Tr);
  var r = g.T - t;
  return L - g.V / 2 * (r - g.Tr / Math.PI * Math.sin(Math.PI * r / g.Tr));
}
function patrolAt(m, t, lite){
  var route = m.route, segs = m.segs, L = m.len, g = legPlan(m);
  var cyc = ((t + m.ph[0] / 6.2832 * 2 * g.T) % (2 * g.T) + 2 * g.T) % (2 * g.T);
  var fwd = cyc < g.T, lt = fwd ? cyc : cyc - g.T;
  var d = legDist(g, L, lt);
  if(!fwd) d = L - d;
  var pos = along(route, segs, d);
  if(lite) return {pos:pos, alt:0};
  /* курс: хорда ±400 м згладжує повороти на проміжних точках */
  var dd = Math.min(0.4, L / 4);
  var a = along(route, segs, Math.max(0, d - dd)), b = along(route, segs, Math.min(L, d + dd));
  var h = bearing(a, b);
  if(!fwd) h = (h + 180) % 360;
  /* Розворот на кінцях: за половину рампи до зупинки й половину після.
     Курс до й після береться ТІЄЮ САМОЮ хордою, що й поза вікном, —
     з курсом цілого крайнього відрізка короткий відрізок давав стрибок. */
  var W = g.Tr / 2;
  var hEnd = bearing(along(route, segs, Math.max(0, L - dd)), route[route.length - 1]);
  var hStart = bearing(along(route, segs, Math.min(L, dd)), route[0]);
  if(Math.abs(cyc - g.T) < W) h = hEnd + 180 * smooth((cyc - (g.T - W)) / (2 * W));
  else if(cyc > 2 * g.T - W || cyc < W){
    var q = cyc > g.T ? cyc - (2 * g.T - W) : cyc + W;
    h = hStart + 180 * smooth(q / (2 * W));
  }
  var v = lt < g.Tr ? g.V * (1 - Math.cos(Math.PI * lt / g.Tr)) / 2
        : lt < g.Tr + g.Tc ? g.V
        : g.V * (1 - Math.cos(Math.PI * (g.T - lt) / g.Tr)) / 2;
  return {pos:pos, alt:0, hdg:(h + 360) % 360, spd:v * 3600};
}
function smooth(x){ x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

/* параметри руху з позиції: тип, точка, маршрут, налаштування з картки */
function mover(p, s){
  s = s || sys(p.key) || {};
  if(s.air) return {kind:'air', home:p.pos, ph:phases(p.id, 7),
    orbR:+p.orbR || s.orbR, altLo:+p.altLo || s.altLo, altHi:Math.max(+p.altHi || s.altHi, (+p.altLo || s.altLo) + 50),
    spd:s.spd};
  if(s.sea && p.route && p.route.length > 1){
    var segs = [], L = 0;
    for(var i = 1; i < p.route.length; i++){ var d = hav(p.route[i-1], p.route[i]); segs.push(d); L += d; }
    if(L > 0.3) return {kind:'sea', home:p.route[0], route:p.route, segs:segs, len:L, ph:phases(p.id, 1), spd:s.spd};
  }
  return null;
}
function motionAt(m, t, lite){
  if(!m) return null;
  return m.kind === 'air' ? orbitAt(m, t, lite) : patrolAt(m, t, lite);
}

/* Носій авіаційного пуску (Ту-95/Су-34/МіГ-31К) кружляє біля точки пуску
   на своїй висоті. Ракета стартує саме з того місця, де він був у момент
   пуску, — тож вибух виходу й модель носія збігаються. */
function carrierOf(L){
  var S = window.TERRAIN_SPECS, spec = S && S.SPEC[L.wpn];
  if(!spec || (spec.plat !== 'air' && spec.plat !== 'mig')) return null;
  var a = S.startAlt(spec);
  return {kind:'air', home:L.path[0], ph:phases('c' + L.id, 7), orbR:6,
    altLo:a * 0.97, altHi:a * 1.03, spd:spec.plat === 'mig' ? 900 : 750,
    mdl:spec.plat === 'mig' ? 'mig31' : 'su34'};
}

/* ═══════════════════════ ПЕРЕХОПЛЕННЯ ═══════════════════════ */

/* Розв'язок упередження: за скільки секунд ЗУР зустріне ціль, якщо та
   тримає курс і швидкість. Квадратне рівняння на час зустрічі; null —
   не наздожене. */
function leadSolve(sPos, tPos, tSpdKmh, hdg, mSpdKmh){
  var kx = 111.32 * Math.cos(sPos[1] * R2), ky = 110.57;
  var rx = (tPos[0]-sPos[0]) * kx, ry = (tPos[1]-sPos[1]) * ky;
  var v = tSpdKmh/3600, vx = Math.sin(hdg*R2)*v, vy = Math.cos(hdg*R2)*v, vi = mSpdKmh/3600;
  var a = vx*vx + vy*vy - vi*vi, b = 2*(rx*vx + ry*vy), c = rx*rx + ry*ry, tau = null;
  if(Math.abs(a) < 1e-6){
    if(Math.abs(b) > 1e-9){ var t0 = -c/b; if(t0 > 0.4) tau = t0; }
  } else {
    var disc = b*b - 4*a*c;
    if(disc >= 0){
      var sq = Math.sqrt(disc), t1 = (-b-sq)/(2*a), t2 = (-b+sq)/(2*a);
      var arr = [t1, t2].filter(function(x){ return x > 0.4; }).sort(function(p, q){ return p-q; });
      if(arr.length) tau = arr[0];
    }
  }
  if(tau == null || tau > 900) return null;
  return tau;
}

/* чи засіб узагалі бере таку ціль */
function canHit(w, spec){
  return !!w && (w.pk[spec.cat] || 0) > 0 && (w.cheap || !spec.cheap);
}

/* Бойова одиниця з позиції на мапі. Нею користуються і наліт, і бойовий
   режим по живих цілях: правила стрільби в обох мають бути ОДНІ.
   p = {id, key, pos, route?, orbR?, altLo?, altHi?, load?:{засіб: кількість}} */
function battery(p){
  var s = sys(p.key) || {};
  var ov = p.load || {};
  var load = (s.load || []).map(function(l){
    var n = ov[l[0]] != null && isFinite(+ov[l[0]]) ? Math.max(0, Math.round(+ov[l[0]])) : l[1];
    return {k:l[0], w:WPN[l[0]], n:n, left:n};
  }).filter(function(x){ return x.w; });
  var ammo = load.reduce(function(a, x){ return a + x.n; }, 0);
  return {
    id:p.id, key:p.key, name:s.name || p.key, pos:p.pos, home:p.pos,
    load:load, ammo:ammo, ammoLeft:ammo,
    r:s.r || 10, ceil:s.ceil || CEIL[s.grp] || 1e9, mSpeed:s.mSpeed || 3000,
    cr:s.cr, bal:s.bal, dr:s.dr, grp:s.grp || null, mdl:s.mdl || 'sam',
    mob:s.mob || null, mv:mover(p, s),
    /* Вікно дії: ППО, поставлене посеред нальоту, стріляє лише з моменту
       появи; прибране — лише до моменту зникнення. Так перерахунок нальоту
       після зміни розстановки не переписує вже програне минуле. */
    from:+p.from || 0, until:p.until == null ? Infinity : +p.until, oid:p.oid || p.id,
    engaged:{}, fired:0
  };
}
/* де батарея в момент t: рухома — за траєкторією, наземна — на місці */
function batAt(s, t, lite){
  if(!s.mv) return {pos:s.home, alt:0, hdg:0, spd:0};
  return motionAt(s.mv, t, lite);
}

/* Вибір засобу й розв'язок зустрічі.
   cur    де батарея зараз {pos, alt}
   tgt    {pos, alt, hdg, speed, spec, key}
   ahead(tau) → {pos, alt}: де буде ціль через tau секунд
   los    затінення рельєфом (лише для наземних; літак дивиться згори,
          корабель — з води, для них рельєф не питаємо)
   Засоби перебираються в порядку боєкомплекту; перший, що може взяти
   ціль, дістає її, має ракети й встигає — стріляє.                      */
function engage(s, cur, tgt, ahead, los){
  var dh = hav(cur.pos, tgt.pos), dz = ((tgt.alt || 0) - (cur.alt || 0)) / 1000;
  var d3 = Math.sqrt(dh * dh + dz * dz);
  for(var i = 0; i < s.load.length; i++){
    var sl = s.load[i], w = sl.w;
    if(sl.left <= 0 || !canHit(w, tgt.spec)) continue;
    if(d3 > w.r) continue;
    var tau = leadSolve(cur.pos, tgt.pos, tgt.speed, tgt.hdg, w.speed);
    if(tau == null) continue;
    if(w.speed / 3600 * tau > w.r * 1.3) continue;
    var a = ahead(tau);
    if(!a) continue;
    /* стеля — у точці ЗУСТРІЧІ, а не там, де ціль помітили */
    if(a.alt > w.ceil) continue;
    var expo = 1;
    if(los && !s.mv){
      var lk = los(cur.pos, a.pos, a.alt, s.grp);
      if(lk && lk.blocked) continue;
      if(lk && lk.exposure != null) expo = lk.exposure;
    }
    var pk = Math.max(0.03, w.pk[tgt.spec.cat] * (1 - 0.55 * (AGILE[tgt.key] || 0)) * expo);
    return {slot:sl, w:w, tau:tau, atk:a.pos, kAlt:a.alt, pk:pk};
  }
  return null;
}

/* Сумісність: «чи бере комплекс цю категорію» і «найкраща ймовірність». */
function roleOK(s, cat, cheap){
  var spec = {cat:cat, cheap:cheap};
  var L = s.load || (sys(s.key) || {}).load || [];
  return L.some(function(l){ return canHit(l.w || WPN[l[0]], spec); });
}
function pkOf(s, spec, key){
  var L = s.load || (sys(s.key) || {}).load || [], best = 0;
  L.forEach(function(l){ var w = l.w || WPN[l[0]];
    if(canHit(w, spec)) best = Math.max(best, w.pk[spec.cat]); });
  return Math.max(0.03, best * (1 - 0.55 * (AGILE[key] || 0)));
}

/* ═══════════════════════ ЗАТІНЕННЯ РЕЛЬЄФОМ ═══════════════════════
   makeLOS(sample) віддає функцію видимості для buildRun. sample(ll) має
   повертати висоту рельєфу в метрах або null, якщо DEM ще не доїхав.

   Чому так, а не «рахуємо самі»: рельєф у ТЕРЕНа вже є, тягнути другий
   його примірник у рушій означало б тримати дві правди про ту саму гору.
   Модуль лишається без мапи, а хто має DEM — той і дає зразки.

   Три речі, без яких це не працювало б:
   · Вище 8 км затінення не питаємо взагалі. Балістику на апогеї не ховає
     жодна гора, а кожен зайвий запит — це промах по кешу тайлів.
   · Результат кешується по огрубленій сітці. Перевірка живе всередині
     циклу «час × цілі × засоби», і без кешу це мільйони запитів до DEM.
   · Коли DEM мовчить, повертаємо null — «не знаю», і рушій стріляє так,
     ніби рельєфу немає. Глушити ППО через недовантажений тайл гірше,
     ніж не врахувати пагорб.                                              */
function makeLOS(sample, opts){
  opts = opts || {};
  var mast = opts.mast == null ? 12 : opts.mast;   // антена над землею, м
  var maxAlt = opts.maxAlt == null ? 8000 : opts.maxAlt;
  var N = opts.samples || 11;
  var cache = {}, hits = 0, miss = 0;

  return function(samPos, tgtPos, alt, grp){
    if(alt > maxAlt) return null;
    var k = (samPos[0].toFixed(2) + ',' + samPos[1].toFixed(2) + '|' +
             tgtPos[0].toFixed(2) + ',' + tgtPos[1].toFixed(2) + '|' +
             Math.round(alt / 250));
    if(cache[k] !== undefined){ hits++; return cache[k]; }
    miss++;

    var g0 = sample(samPos);
    if(g0 == null){ cache[k] = null; return null; }
    /* alt — висота НАД ЗЕМЛЕЮ (так її рахує профіль і так малює шар), а
       відмітки рельєфу вздовж траси — абсолютні. Без приведення до однієї
       системи ППО «сліпло» над будь-яким підвищенням: ціль, намальована
       над хребтом, для перевірки опинялась усередині хребта. */
    var gT = sample(tgtPos);
    var h0 = g0 + mast, h1 = alt + (gT == null ? g0 : gT);
    var worst = 0, blocked = false;

    for(var i = 1; i < N; i++){
      var f = i / N;
      var p = [samPos[0] + (tgtPos[0]-samPos[0]) * f,
               samPos[1] + (tgtPos[1]-samPos[1]) * f];
      var g = sample(p);
      if(g == null) continue;
      var ray = h0 + (h1 - h0) * f;          // пряма від антени до цілі
      var over = g - ray;                    // наскільки рельєф вище променя
      if(over > 0){ blocked = true; break; }
      var clear = -over;
      /* близько до гребеня — ціль видно гірше: скидаємо ймовірність */
      if(clear < 300) worst = Math.max(worst, 1 - clear / 300);
    }
    var res = blocked ? {blocked:true, exposure:0}
                      : {blocked:false, exposure:Math.max(0.35, 1 - worst * 0.5)};
    cache[k] = res;
    return res;
  };
}

/* ═══════════════════════ ПРОРАХУНОК НАЛЬОТУ ═══════════════════════
   SETUP = {
     pvo:       [{id, key, pos, route?, orbR?, altLo?, altHi?, load?}],
     launchers: [{id, wpn, path:[[lon,lat],…], salvo, gap, delay}]
   }
   opts.los(samPos, tgtPos, altM, grp) → {blocked, exposure} | null
*/
function buildRun(SETUP, seed, opts){
  opts = opts || {};
  var S = window.TERRAIN_SPECS;
  if(!S) return null;
  var LOS = opts.los || null;
  var RND = mulberry32((seed >>> 0) || 1);

  /* ── пускові → окремі цілі: залп це N бортів із кроком gap ── */
  var threats = [], asked = 0, carriers = [];
  (SETUP.launchers || []).forEach(function(L){
    var spec = S.SPEC[L.wpn];
    if(!spec || !L.path || L.path.length < 2) return;
    /* розвідник вертається додому — шлях складається навпіл */
    var base = (!spec.strike && L.path.length >= 2)
      ? L.path.concat(L.path.slice(0, -1).reverse()) : L.path;
    if(pathLen(base) < 1) return;
    var car = carrierOf(L);
    if(car) carriers.push({id:L.id, mv:car});
    var n = Math.max(1, Math.min(60, L.salvo || 1));
    asked += n;
    var gap = Math.max(0, L.gap == null ? 20 : L.gap);
    for(var i = 0; i < n && threats.length < CAP; i++){
      var launchT = (L.delay || 0) + i * gap;
      var pth = base, a0 = S.startAlt(spec);
      /* повітряний пуск: ракета виходить з носія там, де він є зараз */
      if(car){
        var cp = motionAt(car, launchT, true);
        a0 = cp.alt;
        if(hav(cp.pos, base[0]) > 0.3) pth = [cp.pos].concat(base);
      }
      var total = pathLen(pth), tt = buildTT(spec, total);
      threats.push({
        id:L.id + ':' + i, lid:L.id, wpn:L.wpn, spec:spec, cat:spec.cat,
        path:pth, total:total, tt:tt, dur:tt[tt.length-1].t, a0:a0,
        air:!!car, launchT:launchT, idx:i, outcome:null
      });
    }
  });

  /* ── позиції ППО ── */
  var sams = (SETUP.pvo || []).map(battery);

  /* ── головний прохід по часу ── */
  var inters = [], events = [], horizon = 0;
  threats.forEach(function(th){ horizon = Math.max(horizon, th.launchT + th.dur); });

  for(var t = 0; t <= horizon + 4; t += DT){
    /* де кожна батарея зараз — раз на крок, а не на кожну пару з ціллю */
    var here = sams.map(function(sm){ return batAt(sm, t, true); });
    for(var i = 0; i < threats.length; i++){
      var th = threats[i];
      if(th.outcome || t < th.launchT) continue;
      var el = t - th.launchT;
      if(el >= th.dur){
        var ip = threatPosAt(th, th.dur);
        th.outcome = {kind:'impact', t:th.launchT + th.dur, pos:ip.pos};
        continue;
      }
      var at = threatPosAt(th, el);
      var tgt = {pos:at.pos, alt:at.alt, hdg:at.hdg, spec:th.spec, key:th.wpn,
        speed:speedAt(th.spec, at.p, th.total)};
      /* null — ціль долетить раніше, ніж ЗУР її наздожене: такий постріл
         не рахується, інакше рушій «збивав» би вже після прильоту */
      var ahead = (function(th0, el0){ return function(tau){
        if(el0 + tau >= th0.dur - DT) return null;
        var q = threatPosAt(th0, el0 + tau); return {pos:q.pos, alt:q.alt}; }; })(th, el);

      for(var j = 0; j < sams.length; j++){
        var sm = sams[j];
        if(t < sm.from || t >= sm.until) continue;
        if(sm.engaged[th.id] || sm.ammoLeft <= 0) continue;
        var cur = here[j];
        if(hav(cur.pos, at.pos) > sm.r + 2) continue;          // грубий відсів
        var E = engage(sm, cur, tgt, ahead, LOS);
        if(!E) continue;
        sm.engaged[th.id] = 1; E.slot.left--; sm.ammoLeft--; sm.fired++;
        var arriveT = t + E.tau, hit = RND() < E.pk;
        inters.push({samId:sm.oid, from:cur.pos, fromAlt:cur.alt || 0, to:E.atk, toAlt:E.kAlt,
          launchT:t, arriveT:arriveT, hit:hit, gun:!!E.w.gun, w:E.slot.k, thId:th.id});
        events.push({kind:'samfire', t:t, pos:cur.pos, alt:cur.alt || 0, to:E.atk, toAlt:E.kAlt,
          gun:!!E.w.gun, samId:sm.oid, sid:sm.id, name:sm.name, by:E.w.uk, w:E.slot.k, thId:th.id});
        if(hit){
          th.outcome = {kind:'kill', t:arriveT, pos:E.atk, alt:E.kAlt, samId:sm.id, by:E.w.uk};
          events.push({kind:'kill', t:arriveT, pos:E.atk, alt:E.kAlt,
            samId:sm.id, name:sm.name, by:E.w.uk, wpn:th.wpn, thId:th.id});
        }
        break;
      }
    }
  }

  /* ── розв'язка й події ── */
  threats.forEach(function(th){
    if(!th.outcome){
      var fp = threatPosAt(th, th.dur);
      th.outcome = {kind:'impact', t:th.launchT + th.dur, pos:fp.pos};
    }
    events.push({kind:'launch', t:th.launchT, pos:th.path[0], alt:th.a0, air:th.air,
      wpn:th.wpn, thId:th.id});
    if(th.outcome.kind === 'impact' && th.spec.strike)
      events.push({kind:'impact', t:th.outcome.t, pos:th.outcome.pos, wpn:th.wpn, thId:th.id});
  });
  events.sort(function(a, b){ return a.t - b.t; });

  var total = threats.length;
  var killed = threats.filter(function(x){ return x.outcome.kind === 'kill'; }).length;
  var impacted = threats.filter(function(x){
    return x.outcome.kind === 'impact' && x.spec.strike; }).length;
  var endT = 6;
  threats.forEach(function(th){ endT = Math.max(endT, th.outcome.t + 6); });

  return {seed:seed, threats:threats, sams:sams, carriers:carriers, inters:inters, events:events,
    endT:endT, masked:!!LOS,
    stat:{total:total, killed:killed, impacted:impacted,
      /* скільки бортів замовили й скільки насправді влізло: мовчазне
         обрізання по CAP робило б знаменник ефективності неправильним */
      asked:asked, dropped:Math.max(0, asked - total),
      eff:total ? Math.round(killed/total*100) : 0,
      fired:sams.reduce(function(a, s){ return a + s.fired; }, 0),
      /* витрата по засобах — щоб розбір показував, чим саме відбивались */
      spent:sams.reduce(function(acc, s){
        s.load.forEach(function(l){ var u = l.n - l.left; if(u) acc[l.w.uk] = (acc[l.w.uk] || 0) + u; });
        return acc; }, {})}};
}

/* ═══════════════════════ КАДР ═══════════════════════
   Дістає стан на момент t: хто в повітрі, які ЗУР у польоті, де зараз
   літаки й кораблі ППО та носії. Нічого не рахує наново — усе в RUN.      */
function stateAt(RUN, t){
  var air = [], fly = [], fx = [];
  var counts = {drone:0, cruise:0, ballistic:0, hyper:0, artillery:0};
  var nK = 0, nI = 0;

  RUN.threats.forEach(function(th){
    var o = th.outcome;
    if(t >= o.t){
      if(o.kind === 'kill') nK++;
      else if(o.kind === 'impact' && th.spec.strike) nI++;
      return;
    }
    if(t < th.launchT) return;
    var el = t - th.launchT;
    if(el >= th.dur) return;
    var a = threatPosAt(th, el), at = attitude(th, el);
    counts[th.cat] = (counts[th.cat] || 0) + 1;
    air.push({id:th.id, wpn:th.wpn, spec:th.spec, pos:a.pos, hdg:at.hdg, p:a.p,
      pitch:at.pitch, roll:at.roll,
      alt:a.alt, phase:phaseAt(th.spec, a.p, th.total, th.a0)});
  });

  /* ракети-перехоплювачі; ствольні черги малюються трасерами на пострілі */
  RUN.inters.forEach(function(it){
    if(it.gun || t < it.launchT || t >= it.arriveT) return;
    var f = (it.arriveT - it.launchT) ? (t - it.launchT) / (it.arriveT - it.launchT) : 1;
    var cur = lerp(it.from, it.to, f);
    /* із землі ракета спершу лізе вгору, з літака — іде майже прямо */
    var E = function(q){ q = Math.max(0, Math.min(1, q));
      return it.fromAlt > 200 ? q : Math.pow(Math.sin(Math.PI / 2 * q), 0.7); };
    var D = Math.max(1, hav(it.from, it.to) * 1000);
    var slope = (it.toAlt - it.fromAlt) * (E(f + 0.02) - E(f - 0.02)) / (0.04 * D);
    fly.push({id:it.samId + '>' + it.thId, from:it.from, to:it.to, cur:cur, f:f,
      alt:it.fromAlt + (it.toAlt - it.fromAlt) * E(f),
      pitch:Math.atan(slope) / R2, hdg:bearing(it.from, it.to), hit:it.hit, w:it.w});
  });

  RUN.events.forEach(function(ev){
    if(ev.kind !== 'kill' && ev.kind !== 'impact' && ev.kind !== 'launch') return;
    var dt = t - ev.t;
    if(dt < 0 || dt > 2.2) return;
    fx.push({kind:ev.kind, pos:ev.pos, alt:ev.alt || 0, wpn:ev.wpn, age:dt});
  });

  /* рухомі батареї — лише ті, що діють у цю мить (див. вікна from/until) */
  var pvo = (RUN.sams || []).filter(function(s){ return s.mv && t >= s.from && t < s.until; }).map(function(s){
    var m = batAt(s, t); return {id:s.oid || s.id, pos:m.pos, alt:m.alt, hdg:m.hdg, spd:m.spd,
      pitch:m.pitch || 0, roll:m.roll || 0, tilt:m.tilt || 0}; });
  var car = (RUN.carriers || []).map(function(c){
    var m = motionAt(c.mv, t); return {id:c.id, pos:m.pos, alt:m.alt, hdg:m.hdg,
      pitch:m.pitch || 0, roll:m.roll || 0, tilt:m.tilt || 0}; });

  return {t:t, air:air, fly:fly, fx:fx, pvo:pvo, carriers:car, counts:counts,
    nK:nK, nI:nI, nAir:air.length};
}

/* події до моменту t — для хронології в журналі */
function eventsTo(RUN, t){
  return RUN.events.filter(function(e){ return e.t <= t; });
}

/* ═══════════════════════ ДЕМО ═══════════════════════
   Наліт на Київ із півночі: шахеди двома хвилями, крилаті з Ту-95 слідом,
   балістика під кінець. Три наземні позиції ППО на підходах, F-16 у
   патрулі на півночі й мобільна група на Мі-8 над Десною.               */
function demo(){

    ]

}

function collectBld(polys){
  if(!ofmOn||map.getZoom()<13){if(map.getZoom()<13)dlog('будівлі зʼявляться з зуму 13 — наблизь мапу');return}
  let feats=[];try{feats=map.querySourceFeatures('ofm',{sourceLayer:'building'})||[]}catch(e){return}
  const live={};polys.forEach(o=>{const k=o.coords.map(c=>c[0].toFixed(5)+c[1].toFixed(5)).join(';');
    live[o.id]=1;if(bldKeys[o.id]!==k){bldKeys[o.id]=k;bldCache[o.id]={}}});
  Object.keys(bldCache).forEach(id=>{if(!live[id]){delete bldCache[id];delete bldKeys[id]}});

/* Сазерленд–Ходжман: ріже футпринт по опуклій/увігнутій масці */
function clipPoly(subject,clipRaw){
  if(!subject||subject.length<3||!clipRaw||clipRaw.length<3)return null;
  let subj=subject.slice();
  if(subj.length>1){const a=subj[0],b=subj[subj.length-1];if(a[0]===b[0]&&a[1]===b[1])subj=subj.slice(0,-1)}
  let clip=clipRaw.slice();{const a=clip[0],b=clip[clip.length-1];if(a[0]===b[0]&&a[1]===b[1])clip=clip.slice(0,-1)}
  if(signedArea(clip)<0)clip=clip.slice().reverse();
  const inside=(p,a,b)=>(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0])>=-1e-12;
  const inter=(s,e,a,b)=>{const dcx=b[0]-a[0],dcy=b[1]-a[1],dsx=e[0]-s[0],dsy=e[1]-s[1];
    const den=dcx*dsy-dcy*dsx;if(Math.abs(den)<1e-15)return [e[0],e[1]];
    const t=(dcy*(s[0]-a[0])-dcx*(s[1]-a[1]))/den;return [s[0]+t*dsx,s[1]+t*dsy]};
  let out=subj;
  for(let c=0;c<clip.length;c++){
    const a=clip[c],b=clip[(c+1)%clip.length],input=out;out=[];const m=input.length;if(!m)break;
    for(let i=0;i<m;i++){const cur=input[i],prev=input[(i+m-1)%m];
      const ci=inside(cur,a,b),pi=inside(prev,a,b);
      if(ci){if(!pi)out.push(inter(prev,cur,a,b));out.push(cur)}else if(pi)out.push(inter(prev,cur,a,b))}}
  return out.length>=3?out:null}

let rulerCoords=null;
function spark(vals,w){const ok=vals.filter(v=>v!=null);if(!ok.length)return '└─ DEM ще не декодований — відкрий панель ще раз';
  const mn=Math.min(...ok),mx=Math.max(...ok),bars='▁▂▃▄▅▆▇█';let s='';
  const step=Math.max(1,Math.ceil(vals.length/w));for(let i=0;i<vals.length;i+=step){const v=vals[i];s+=v==null?' ':bars[Math.round((v-mn)/((mx-mn)||1)*7)]}
  return '┌─ '+Math.round(mx)+' м\n'+s+'\n└─ '+Math.round(mn)+' м · перепад '+Math.round(mx-mn)+' м'}
function openRuler(c){rulerCoords=c;const L=plen(c);
  const lines=['довжина ..... '+fLen(L),'азимут ...... '+fAz(bearing(c[0],c[c.length-1]))+' (прямий)','сегментів ... '+(c.length-1)];
  if(c.length>2)lines.push('площа ....... '+fAr(parea(c))+' (якби замкнути)');
  $('ru-metrics').textContent=lines.map((l,i,a)=>(i===a.length-1?'└─ ':'├─ ')+l).join('\n');
  $('ru-segs').textContent=c.slice(1).map((p,i)=>(i===c.length-2?'└─ ':'├─ ')+String(i+1).padStart(2,'0')+' '+fLen(dist(c[i],p)).padEnd(9)+' '+fAz(bearing(c[i],p))).join('\n');
  $('ru-profile').textContent='└─ декодую DEM…';openPanel('p-ruler');
  const pr0=profile(c,60);ensureDem(pr0.map(x=>pointAlong(c,x.d/(L||1)).p)).then(()=>{const pr=profile(c,60);
    let up=0,dn=0;for(let i=1;i<pr.length;i++){if(pr[i].h==null||pr[i-1].h==null)continue;const d=pr[i].h-pr[i-1].h;if(d>0)up+=d;else dn-=d}
    $('ru-profile').textContent=spark(pr.map(x=>x.h),60)+'\n   підйом +'+Math.round(up)+' м · спуск −'+Math.round(dn)+' м';
    const h0=pr[0].h,h1=pr[pr.length-1].h;if(h0!=null&&h1!=null)$('ru-metrics').textContent+='\n   висоти: '+Math.round(h0)+' → '+Math.round(h1)+' м'})}

$('file-in').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const fc=JSON.parse(r.result);let n=0;
    mutate(()=>{if(fc.teren&&Array.isArray(fc.teren.groups))fc.teren.groups.forEach(g=>{if(!grp(g.id))S.groups.push(g)});
      /* Multi-геометрії розкладаємо на частини: раніше вони мовчки зникали,
         а в терміналі писалось бадьоре «затягнув N обʼєктів» без згадки про
         пропущені. */
      let skip=0;
      const parts=gg=>{
        if(!gg)return [];
        if(gg.type==='Point')return [['marker',[gg.coordinates]]];
        if(gg.type==='MultiPoint')return gg.coordinates.map(q=>['marker',[q]]);
        if(gg.type==='LineString')return [['line',gg.coordinates]];
        if(gg.type==='MultiLineString')return gg.coordinates.map(q=>['line',q]);
        if(gg.type==='Polygon')return [['polygon',gg.coordinates[0].slice(0,-1)]];
        if(gg.type==='MultiPolygon')return gg.coordinates.map(q=>['polygon',q[0].slice(0,-1)]);
        if(gg.type==='GeometryCollection')return (gg.geometries||[]).reduce((a,x)=>a.concat(parts(x)),[]);
        return [];
      };
      (fc.features||[]).forEach(ft=>{const gg=ft.geometry,p=ft.properties||{};if(!gg)return;
        const seq=p.taps?[[p.teren,p.taps]]:parts(gg);
        if(!seq.length){skip++;return}
        seq.forEach(([tt,c])=>{
          const o={id:p.tid&&!byId(p.tid)?p.tid:uid(),n:S.seq++,type:p.teren||tt,
            name:p.name||'імпорт '+(n+1),note:p.note||'',
            groupId:grp(p.groupId)?p.groupId:null,coords:c||[],visible:p.visible!==false,
            created:p.created||Date.now(),st:Object.assign({},DEF_ST,p.style||{})};
          /* Міграція ТА САМА, що й для localStorage: без неї файл попередньої
             версії тихо псувався — полігон ставав лінією, стрілка втрачала
             наконечник, а танкова рота перетворювалась на піхоту. */
          migrate(o);
          if(!TYPE[o.type])o.type='line';
          if(o.type==='unit')o.st.sym=symNorm(o.st.sym);
          if(o.type==='link'){o.aId=p.aId;o.bId=p.bId}
          S.objs.unshift(o);n++});});
      /* звʼязки без обох кінців нічого не малюють — прибираємо одразу */
      S.objs=S.objs.filter(o=>o.type!=='link'||(byId(o.aId)&&byId(o.bId)))});
    st('затягнув '+n+' '+plural(n,'обʼєкт','обʼєкти','обʼєктів')+
      (skip?' · '+skip+' не зрозумів':''))}catch(err){st('файл битий, не зайшло: '+err.message,0,'err')}e.target.value=''};
  r.readAsText(f)};

let myPos=null,meSrc=false;
/* Позицію беремо самі лише тоді, коли дозвіл уже стоїть «granted»: вікна не
   буде, а ⌖ зʼявиться на мапі одразу. Permissions API є не скрізь — де його
   нема, просто чекаємо на тап. */
function geoIfGranted(){
  if(!navigator.geolocation||!navigator.permissions||!navigator.permissions.query)return;
  try{navigator.permissions.query({name:'geolocation'}).then(p=>{
    if(p&&p.state==='granted')askGeo(true);
  }).catch(()=>{})}catch(e){}
}
function askGeo(auto){
  if(!navigator.geolocation){if(!auto)st('геолокації тут нема');return}
  if(!auto&&myPos){dropFit();map.flyTo({center:myPos,zoom:Math.max(map.getZoom(),14.5),duration:900});st('ти тут, я бачу');return}
  if(!auto)st('ловлю супутники…',1,'busy');
  navigator.geolocation.getCurrentPosition(pos=>{myPos=[pos.coords.longitude,pos.coords.latitude];
    if(!meSrc){map.addSource('me',{type:'geojson',data:EMPTY});map.addLayer({id:'l-me',type:'symbol',source:'me',layout:{'icon-image':glyphImg('⌖',themeCols().affirm),'icon-allow-overlap':true,'icon-size':1.1}});meSrc=true}
    map.getSource('me').setData({type:'FeatureCollection',features:[{type:'Feature',properties:{},geometry:{type:'Point',coordinates:myPos}}]});
    $('c-geo').classList.add('live');
    if(!auto){dropFit();map.flyTo({center:myPos,zoom:Math.max(map.getZoom(),14.5),duration:1200})}
    st(auto?'позицію взяв, ⌖ на мапі':'ти тут, я бачу')},
    ()=>{if(!auto)st('gps кобенится — дай дозвіл або став вручну',0,'err')},{enableHighAccuracy:true,timeout:10000,maximumAge:30000})}
$('c-geo').onclick=()=>askGeo(false);

  if(k==='g'||k==='п'){$('c-layers').click();return}

/* ═══════════ ПОВІТРЯНА ОБСТАНОВКА ═══════════
   Живі цілі NEPTUN 3d-моделями + тривоги по областях.
   Шар самодостатній: власна сцена THREE поверх мапи й окреме джерело
   для полігонів областей. Ані `objects`/`points`, ані feature-state
   малювання він не чіпає — тумблер гасить його цілком.

   Заливка областей лягає ПІД обʼєкти користувача (before:'o-fill'):
   накрити нею власне креслення було б гірше, ніж не показати тривогу. */
let airAL=null,airL=null,airFeed=null,airLast=null,airMiss=0;

function airBefore(){try{return map.getLayer('o-fill')?'o-fill':undefined}catch(e){return undefined}}

function airBoot(){
  if(!map||!window.TerenAlerts||!window.TerenLayer)return;
  if(!airAL){
    airAL=TerenAlerts.attach(map,{before:airBefore(),visible:S.cfg.airAl!==false,
      onChange:airRender,
      onError:e=>{airLog('межі областей не доїхали · '+(e&&e.message||''));airSum()}});
  }
  if(!airL&&window.THREE){
    airL=TerenLayer.attach(map,{minZoom:3,iconPx:34,
      visible:S.cfg.air3d!==false, trails:S.cfg.airTr!==false, before:airBefore()});
  }
}

function airStart(){
  airBoot();
  if(airFeed)return;
  /* Тривоги по областях THREE не потрібен — вони живуть на звичайних шарах
     мапи. Раніше відсутність 3d-шару тихо глушила ВЕСЬ фід разом із ними,
     і панель нескінченно писала «тягну стрічку…». */
  if(!airL&&!airAL){airLog('ані 3d-шар, ані шар тривог не піднялись');airSum();return}
  /* межі областей могли не доїхати — тоді тривог не буде взагалі, і про це
     треба сказати, а не показувати «тривог немає», як тихої ночі */
  if(airAL&&!airAL.ready&&airAL.load)airAL.load().catch(()=>{});
  if(!airL)airLog('THREE не доїхав — цілі без 3d-моделей, тривоги працюють');
  if(!airL){
    /* без 3d-шару ведемо самі лише тривоги: цілей не буде, але країна
       під тривогою — інформація, яку не можна втрачати через CDN */
    airFeed=TerenNeptun.start({everyS:30,alerts:true,
      onData:p=>{airLast=p;airMiss=0;
        if(airAL&&airAL.ready)airAL.update((p.alerts&&p.alerts.oblasts)||[],[],
          (p.alerts&&p.alerts.raions)||{},(p.alerts&&p.alerts.oblastSince)||{});
        airSum()},
      onAppError:e=>airLog('фід прийшов, але показ спіткнувся · '+(e&&e.message||'')),
      onError:(e,n)=>{airMiss=n;if(n===1)airLog('NEPTUN не відповів · '+(e&&e.message||''));airSum()}});
    airSum();return;
  }
  airFeed=airL.bindNeptun(null,{
    everyS:30,trails:S.cfg.airTr!==false,alertsLayer:airAL,
    onData:p=>{airLast=p;airMiss=0;airSum();
      /* Раніше кожне опитування перезаписувало журнал на «└─ тихо», і
         повідомлення «межі областей не доїхали» зникало за секунди — збій
         виглядав як спокійна ніч. */
      if(!airAL||!airAL.ready)airRender([],airAL?airAL.log:[])},
    onAppError:e=>airLog('фід прийшов, але показ спіткнувся · '+(e&&e.message||'')),
    onError:(e,n)=>{airMiss=n;if(n===1)airLog('NEPTUN не відповів · '+(e&&e.message||''));airSum()}
  });
  airSum();
}
function airStop(){
  if(airFeed){airFeed.stop();airFeed=null}
  airLast=null;airMiss=0;airSum();airRender([],airAL?airAL.log:[]);
  /* stop() всередині чистить увесь шар — разом із моделями ППО й пускових,
     які до фіду не мають жодного стосунку. Повертаємо їх одразу. */
  if(window.TerenSim)simModels();
}

/* зведення одним рядком: скільки цілей, скільки тривог, коли оновлено */
function airSum(){
  const e=$('air-sum');if(!e)return;
  if(S.cfg.air===false){e.textContent='фід вимкнув';e.classList.remove('live');return}
  /* «тягну стрічку» доречне рівно до першої відповіді. Якщо джерело
     мовчить, так і кажемо: мовчазний спінер гірший за чесний збій. */
  if(!airLast){
    e.textContent=airMiss?('NEPTUN мовчить · спроба '+airMiss):'тягну стрічку…';
    e.classList.remove('live');return}
  const objs=(airLast.threats&&airLast.threats.objs)||[];
  const al=airAL&&airAL.ready?airAL.list().length:0;
  const t=new Date(airLast.ts||Date.now());
  const p=n=>String(n).padStart(2,'0');
  /* Джерело могло замовкнути, а картинка лишалась «живою»: цілі тим часом
     числяться вперед і показуються як факт. Показ мусить старіти разом із
     даними — інакше він бреше саме тоді, коли це найдорожче. */
  const ageS=Math.max(0,(Date.now()-(airLast.ts||0))/1000);
  const stale=airMiss>0||ageS>75;
  e.textContent=objs.length+' цілей · '+al+' тривог · '+p(t.getHours())+':'+p(t.getMinutes())+
    (stale?' · дані '+(ageS<90?Math.round(ageS)+' с':Math.round(ageS/60)+' хв')+' тому':'');
  e.classList.toggle('live',!stale);
  e.classList.toggle('stale',stale);
  /* хвилини в списку тривог мають цокати між оновленнями фіду */
  if(airAL&&airAL.ready&&airRenderLast&&Date.now()-airRenderLast>25000)
    airRender(airAL.list(),airAL.log);
}
let airRenderLast=0;

/* звідки взявся рівень — підпис під областю. Джерела різні, і зливати їх
   в одне «не оголошено» не можна: «червоний · рівень не оголошено»
   суперечить сам собі. */
const AIR_BY={alert:'рівень не оголошено',forecast:'за прогнозом підходу',target:''};
const AIR_EV={on:'тривога',up:'рівень підвищено',down:'рівень знижено',off:'відбій'};

function airRender(list,log){
  const el=$('air-list');if(!el)return;
  airRenderLast=Date.now();
  list=list||[];
  el.innerHTML=list.length?list.map(a=>{
    const why=AIR_BY[a.by]||'';
    return '<div class="airrow" data-obl="'+esc(a.name)+'"><i style="background:'+a.col+'"></i>'+
      '<b>'+esc(a.name)+'<em>'+esc(a.level)+(why?' · '+esc(why):'')+'</em></b>'+
      '<s>'+a.mins+' хв</s></div>'}).join('')
    :'<div class="airsum">тривог немає</div>';
  el.querySelectorAll('[data-obl]').forEach(n=>n.onclick=()=>airCard(n.dataset.obl));
  const L=$('air-log');
  if(L){const rows=(log||[]).slice(0,8).map(e=>{
      const d=new Date(e.t),p=n=>String(n).padStart(2,'0');
      return p(d.getHours())+':'+p(d.getMinutes())+' '+(AIR_EV[e.kind]||e.kind)+' · '+e.name});
    L.textContent=rows.length?rows.map((r,i)=>(i===rows.length-1?'└─ ':'├─ ')+r).join('\n'):'└─ тихо'}
  airSum();
}

/* картка області — у термінал, бо вона про стан, а не про обʼєкт креслення */
function airCard(nm){
  if(!airAL||!airAL.ready)return;
  const c=airAL.card(nm);
  const src=c.rows.filter(r=>r[0]==='Джерело')[0];
  st(nm+' · '+(c.lvl?TerenAlerts.LVL_UK[c.lvl]:'тривоги немає')+(src?' · '+src[1]:''),1);
}
function airLog(msg){
  const L=$('air-log');if(!L)return;
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  L.textContent='├─ '+p(d.getHours())+':'+p(d.getMinutes())+' '+msg+'\n'+L.textContent;
}

/* ═══════════ ВОДА ДЛЯ КОРАБЛІВ ═══════════
   Основа — вшита берегова лінія (TerenWater, ~400 м). Коли кораблем
   працюють, підтягуємо ще невидимий векторний шар води OpenFreeMap: він
   точний до порту, річки й водосховища, але знає лише те, що на екрані.
   Тож правило просте: точка на екрані й шар довантажився — віримо шару,
   інакше — береговій лінії. */
function waterProbe(){
  if(!map)return;
  try{
    if(!map.getSource('ofm'))map.addSource('ofm',{type:'vector',url:OFM});
    if(!map.getLayer('water-probe'))map.addLayer({id:'water-probe',type:'fill',source:'ofm',
      'source-layer':'water',paint:{'fill-color':'#000','fill-opacity':0}});
  }catch(e){}
}
function waterAt(p){
  if(map&&map.getLayer('water-probe')){
    try{
      const b=map.getBounds();
      if(b.contains(p)&&map.isSourceLoaded('ofm')){
        const px=map.project(p);
        /* Порожню відповідь шару не можна читати як «суша»: тайл без даних
           не відрізнити від тайла, що каже «тут берег». Тому шар може лише
           ДОДАТИ води (порт, річка, водосховище), а заборону лишаємо за
           вшитою береговою лінією. */
        if(map.queryRenderedFeatures([[px.x-1,px.y-1],[px.x+1,px.y+1]],{layers:['water-probe']}).length)return true;
      }
    }catch(e){}
  }
  return !!(window.TerenWater&&TerenWater.isSea(p));
}

/* ═══════════ ВИБІР ЗАСОБУ Й РАДІУСИ ПІД ЧАС РОЗСТАНОВКИ ═══════════ */
let pickKind=null;

function pickList(q){
  q=(q||'').trim().toLowerCase();
  const el=$('pk-list');
  const groups={};
  if(pickKind==='pvo'){
    const all=TerenSim.allSys();
    Object.keys(all).forEach(k=>{const v=all[k];
      (groups[v.grp]=groups[v.grp]||[]).push({k,name:v.name,
        right:v.r+' км',sub:v.mName+' · боєкомплект '+v.ammo,col:'#64FF8F'})});
  } else {
    const SP=TERRAIN_SPECS.SPEC, UK=TERRAIN_SPECS.CATUK;
    Object.keys(SP).forEach(k=>{const v=SP[k];
      if(v.cat==='artillery')return;
      (groups[UK[v.cat]||v.cat]=groups[UK[v.cat]||v.cat]||[]).push({k,name:v.uk,
        right:v.range+' км',sub:v.speed+' км/год · '+v.wh,col:v.col})});
  }
  let html='';
  Object.keys(groups).forEach(g=>{
    const rows=groups[g].filter(r=>!q||(r.name+' '+r.sub).toLowerCase().includes(q));
    if(!rows.length)return;
    html+='<div class="pkgrp">'+esc(g)+'</div>';
    rows.forEach(r=>{html+='<div class="pkrow" data-k="'+r.k+'"><i style="background:'+r.col+'"></i>'+
      '<b>'+esc(r.name)+'<em>'+esc(r.sub)+'</em></b><s>'+esc(r.right)+'</s></div>'});
  });
  el.innerHTML=html||'<div class="airsum">нічого не знайшлось</div>';
  $$('#pk-list [data-k]').forEach(n=>n.onclick=()=>pickGo(n.dataset.k));
}

function pickGo(key){
  const kind=pickKind;
  if(kind==='pvo')lastStyle.sys=key; else lastStyle.wpn=key;
  if(kind==='pvo'&&(TerenSim.sys(key)||{}).sea)waterProbe();
  /* ППО посеред нальоту: пауза, поки ставиш, — наліт рушить сам, щойно
     позицію збережено */
  if(kind==='pvo'&&RUN&&simPlay){simPlay=false;simResume=true;simBarUI()}
  closePanel($('p-pick'));
  startDraw(kind);
  const nm=kind==='pvo'?(TerenSim.sys(key)||{}).name:(TERRAIN_SPECS.SPEC[key]||{}).uk;
  const rr=kind==='pvo'?(TerenSim.sys(key)||{}).r:(TERRAIN_SPECS.SPEC[key]||{}).range;
  const sp=kind==='pvo'?TerenSim.sys(key)||{}:{};
  st(nm+' · радіус '+rr+' км — '+(kind!=='pvo'?'тап — точка пуску':
    sp.sea?'тап по воді, далі точки маршруту':sp.air?'тап — центр патрулювання':'тап по мапі'),1);
}

/* ── кола під час креслення ──
   ППО: коло ураження навколо точки.
   Пускова: залишок дальності від ОСТАННЬОЇ поставленої точки — він тане в міру
   того, як маршрут довшає. Так одразу видно, чи дотягне борт туди, куди ведеш,
   і не треба рахувати кілометри в голові. */
function draftRings(d,cc){
  const out=[];
  if(!cc.length)return out;
  const ring=(c,km,n)=>{const N=n||72,p=[];
    for(let i=0;i<=N;i++)p.push(TerenNeptun.dest(c[0],c[1],i/N*360,km));
    return {type:'Feature',properties:{rub:true},geometry:{type:'LineString',coordinates:p}}};
  if(d.type==='pvo'){
    const sp=TerenSim.sys(d.sys); if(!sp)return out;
    if(sp.air&&sp.orbR)out.push(ring(cc[0],sp.orbR,48));   // де літатиме
    if(sp.r)out.push(ring(cc[0],sp.r));
  } else if(d.type==='strike'){
    const sc=TERRAIN_SPECS.SPEC[d.wpn];
    if(sc&&sc.range){
      const placed=d.coords;
      const used=placed.length>1?TerenSim.pathLen(placed):0;
      const left=sc.range-used;
      if(left>0.5)out.push(ring(placed[placed.length-1],left));
    }
  }
  return out;
}

/* ═══════════════ СИМУЛЯЦІЯ: ППО, ПУСКОВІ, НАЛІТ ═══════════════
   ППО і пускові — звичайні обʼєкти S.objs, тож журнал, групи, відкат і
   збереження дістаються їм задарма. Рендер у них власний: колу досяжності
   й траєкторії нема чим бути у форматі `objects`.

   Наліт рахується детерміновано наперед (TerenSim.buildRun), а відтворення
   просто дістає кадр за часом. Тому пауза, перемотка в обидва боки й ×300
   не потребують нічого, крім зміни числа simT. */

const SIM_SRC='sim-setup', SIM_MOB='sim-mob';
let RUN=null, simT=0, simPlay=false, simSpd=1, simRaf=null, simLastMs=0;
let simFeedWasOn=false, simLog=[], simEvIdx=0;
/* Мітка перемотки: усе, що сталося РАНІШЕ за неї, програвати вибухами не
   можна. Без неї протяжка повзунка крізь масований наліт вивалювала на мапу
   всі вибухи нальоту за кілька кадрів. */
let simSince=0, simMdlT=null, simMdlTry=0;
/* бойовий режим тримається тут же: simUI() читає його вже на першому рендері */

/* ── власний шар розстановки ── */
function simEnsure(){
  if(!map||map.getSource(SIM_SRC))return;
  const before=airBefore();
  map.addSource(SIM_SRC,{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'sim-zone-fill',type:'fill',source:SIM_SRC,
    filter:['==',['get','k'],'zone'],
    paint:{'fill-color':['get','color'],'fill-opacity':0.06}},before);
  map.addLayer({id:'sim-zone-line',type:'line',source:SIM_SRC,
    filter:['==',['get','k'],'zone'],
    paint:{'line-color':['get','color'],'line-width':1.2,'line-opacity':0.55,
      'line-dasharray':[3,2]}},before);
  map.addLayer({id:'sim-path',type:'line',source:SIM_SRC,
    filter:['==',['get','k'],'path'],layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':['get','color'],'line-width':1.6,'line-opacity':0.6,
      'line-dasharray':[2.5,2]}},before);
  /* патруль літака — тонке коло навколо точки; маршрут корабля — лінія */

    filter:['==',['get','k'],'orbit'],
    paint:{'line-color':['get','color'],'line-width':1,'line-opacity':0.4,
      'line-dasharray':[1,3]}},before);
  map.addLayer({id:'sim-route',type:'line',source:SIM_SRC,
    filter:['==',['get','k'],'route'],layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':['get','color'],'line-width':2,'line-opacity':0.55,
      'line-dasharray':[4,2]}},before);
  /* Зона ураження рухомого носія їде разом із ним: окреме джерело, яке
     оновлюється кілька разів на секунду, а не весь шар розстановки. */

  map.addLayer({id:'sim-mob-fill',type:'fill',source:SIM_MOB,
    paint:{'fill-color':['get','color'],'fill-opacity':0.05}},before);
  map.addLayer({id:'sim-mob-line',type:'line',source:SIM_MOB,
    paint:{'line-color':['get','color'],'line-width':1.1,'line-opacity':0.5,
      'line-dasharray':[3,2]}},before);
  map.addLayer({id:'sim-pt',type:'circle',source:SIM_SRC,
    filter:['==',['get','k'],'pt'],
    paint:{'circle-radius':['case',['==',['get','sel'],true],8,6],
      'circle-color':['get','color'],'circle-opacity':0.9,
      'circle-stroke-width':1.5,'circle-stroke-color':'#07090b'}});

    filter:['==',['get','k'],'kill'],
    layout:{'text-field':'✕','text-size':15,'text-allow-overlap':true,
      'text-font':['Noto Sans Regular']},
    paint:{'text-color':'#64FF8F','text-halo-color':'#07090b','text-halo-width':1.6,
      'text-opacity':0.85}});
  map.addLayer({id:'sim-lbl',type:'symbol',source:SIM_SRC,
    filter:['==',['get','k'],'pt'],
    layout:{'text-field':['get','name'],'text-size':10,'text-offset':[0,1.3],
      'text-anchor':'top','text-allow-overlap':false,
