/* --- SICH v2 · colors.css --- */
/* SICH v2 — colour. Measured from Boid Predator (QuadNode 2026) frames, ±3/channel; contrast fixed per brief C3. */
:root {
  /* ---- тло ---- */
  --void:   #000000;  /* canvas / field / map */
  --raised: #0E0B04;  /* modal body — warm black under a bright frame */
  --slot:   #1A1708;  /* card slot fill */
  --grid:   #3C3C3C;  /* field grid, 200px step (raised from #292929) */
  --hover:  #0D0D0D;  /* designed, not observed: row hover */
  --active: #161616;  /* designed, not observed: row press */

  /* ---- текстова драбина ---- contrast on #000 */
  --ink-1: #FFFFFF;   /* 21.0:1 heading, active tab, selected row */
  --ink-2: #B7B7B7;   /* 10.5:1 value, body */
  --ink-3: #747474;   /*  4.5:1 label, section header, inactive tab (was #575757) */
  --ink-4: #595959;   /*  3.0:1 locked */
  --ink-5: #3F3F3F;   /*  2.0:1 ghost — present but unreachable (was #2E2E2E) */

  /* ---- семантика ---- */
  --cost:   #FD464B;  /*  6.2:1 danger · critical · destructive · RED readiness */
  --affirm: #64FF8F;  /* 16.2:1 available · selected · primary action · GREEN readiness */
  --warn:   #FDC828;  /* 13.5:1 caution · historical mode · AMBER readiness */
  --info:   #92DDFD;  /* 14.0:1 informational · ASSIGNED · attached (OPCON/TACON in) */

  /* ---- сутності SICH (наскрізний колір: заголовок секції = ціна = рядок HUD) ---- */
  --ent-unit:   #B7B7B7;  /* підрозділ / ОШС — the base currency, deliberately = ink-2 */
  --ent-cap:    #92DDFD;  /* спроможність */
  --ent-asset:  #CEDDFE;  /* засіб / ресурс / ОС */
  --ent-target: #B283FD;  /* ціль */
  --ent-task:   #FDCB54;  /* задача / контроль */

  /* ---- драбина ступенів (reads in greyscale: 1 darkest → 5 lightest) ---- */
  --tier-1: #B46328;  /* 4.8:1 */
  --tier-2: #B6BED3;  /* 11.3:1 */
  --tier-3: #FDC828;  /* 13.5:1 */
  --tier-4: #B283FD;  /* 7.6:1 */
  --tier-5: #B6F1D5;  /* 16.5:1 */

  /* ---- доменні аліаси ---- */
  --ready-green: var(--affirm); --ready-amber: var(--warn); --ready-red: var(--cost); --ready-grey: var(--ink-3);
  --avail-available: var(--affirm); --avail-reserved: var(--warn); --avail-assigned: var(--info); --avail-unavailable: var(--cost); --avail-unknown: var(--ink-3);
  --prio-critical: var(--cost); --prio-high: var(--tier-3); --prio-medium: var(--info); --prio-low: var(--ink-3);
  --rel-detached: var(--warn);  /* → у чужому OPCON/TACON */
  --rel-attached: var(--info);  /* ← під моїм OPCON/TACON */

  /* ---- тінт середовища (стан фарбує світ, ~8% поверх --void) ---- */
  --tint-danger: rgba(255,196,217,0.08);
  --tint-info:   rgba(196,222,255,0.08);
  --tint-affirm: rgba(209,255,192,0.08);
  --tint-warn:   rgba(255,224,160,0.08);
  --tint: transparent;            /* current mode tint — set by [data-mode] */
  --grid-live: #3C3C3C; --grid-warn: #48412B; --grid-danger: #4A3236; --grid-info: #333B48; --grid-affirm: #33452F;

  --scrim: rgba(0,0,0,0.6);       /* modal backdrop — required unless the frame is bright and thick */
  --frame: var(--tier-3);         /* default modal frame: 1px gold */

  /* ---- категорійні кольори груп (ФОСФОР-7 --cat-*, переведені на чорне полотно) ----
     Єдине місце, де дозволений інший відтінок — і лише щоб розрізнити групи (шари, типи засобів, райони).
     Усі приглушені до одного рівня світлоти (≥11:1 на #000), щоб жодна не кричала. Це не шкала —
     grayscale-тест до них не застосовний; група завжди дублюється підписом. */
  --cat-rose: #E68AA0;  --cat-terracotta: #E08A62;  --cat-sand: #D9C07E;  --cat-olive: #AEBE72;  --cat-pine: #7FC79A;
  --cat-jade: #6FC7B8;  --cat-sea: #79B8D6;  --cat-azure: #8FB2E8;  --cat-lavender: #AFA2E8;  --cat-plum: #C795D4;

  /* ---- полотно малювання ---- */
  --draw-ink: var(--affirm);     /* готова геометрія */
  --draw-rubber: var(--warn);    /* гумова лінія до курсора — точка ще не поставлена */
  --draw-close: var(--info);     /* замикаюча лінія полігона */
  --draw-snap: var(--ink-1);     /* підсвічена точка прилипання */
  --draw-fill: rgba(100,255,143,0.08);
}
/* Mode paints the whole background layer, not just a badge. */
:root[data-mode="historical"] { --tint: var(--tint-warn);   --grid: var(--grid-warn); }
:root[data-mode="offline"]    { --tint: var(--tint-danger); --grid: var(--grid-danger); }
:root[data-mode="alert"]      { --tint: var(--tint-danger); --grid: var(--grid-danger); }
:root[data-mode="sync"]       { --tint: var(--tint-info);   --grid: var(--grid-info); }

/* --- SICH v2 · typography.css --- */
/* SICH v2 — typography. One monospaced face; register carries structure. */
:root {
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --font-body: var(--font-mono);   /* there is no second face */

  /* sizes — body 15 / section 20 / title 28 measured; 12–13 designed for dense data & meta */
  --fs-1: 12px;   /* meta, card footer, status bar */
  --fs-2: 13px;   /* dense table cells, HUD taxonomy */
  --fs-3: 15px;   /* body — desktop minimum for reading text */
  --fs-4: 20px;   /* section header (≈1.33× body) */
  --fs-5: 28px;   /* page title, bold, centred */
  --fs-mobile-min: 16px; /* never 15px as the mobile minimum (brief C4) */

  /* baselines — 24px body rhythm */
  --lh-1: 16px; --lh-2: 20px; --lh-3: 24px; --lh-4: 28px; --lh-5: 36px;

  --fw-regular: 400;  /* @kind font */
  --fw-bold: 700;     /* @kind font */
  --ls-0: 0;          /* @kind font */ /* mono is never tracked */

  --adv: 9px;         /* glyph advance at 15px (0.6em); column math in ch */
}

/* --- SICH v2 · spacing.css --- */
/* SICH v2 — space, radius, borders, hit targets, shell dimensions. */
:root {
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 40px; --sp-7: 64px;
  --edge: 16px;        /* HUD inset from screen edge (8–16 measured) */
  --gap-row: 24px;     /* one text row */
  --gap-sec: 40px;     /* before a section header (34–44 measured) */
  --inset-modal: 40px; /* modal inset from all four edges */
  --grid-step: 200px;  /* field grid; verticals from x=160, horizontals from y=140 */

  --r-0: 0;            /* @kind radius */ /* outer modal frame, tabs, rules */
  --r-1: 4px;          /* cards, banners, inputs, buttons */
  --bw: 1px;           /* the only border width */
  --bw-focus: 1px;

  --hit-sm: 24px;      /* inline row action (mouse) */
  --hit-md: 32px;      /* default desktop control */
  --hit-lg: 44px;      /* touch */

  /* шкала контролів (з ФОСФОР-7): одна висота на розмір, без винятків.
     Висота задається висотою, не падінгом — інакше кнопка, поле й сегмент у ряду не сходяться. */
  --h-xs: 24px; --h-sm: 28px; --h-md: 32px; --h-lg: 44px;
  --px-xs: 8px; --px-sm: 10px; --px-md: 14px; --px-lg: 20px;
  --gap-ctl: 8px;   /* між контролами в ряду */
  --gap-grp: 16px;  /* між групами контролів */

  /* shell regions (desktop 1440+) */
  --h-topbar: 40px; --h-statusbar: 28px; --h-hintbar: 32px;
  --w-nav: 240px; --w-nav-rail: 56px; --w-tree: 268px; --w-tree-rail: 38px; --w-context: 320px;
  --card-w: 210px; --card-h: 190px;  /* slot card */
  --banner-w: 460px; --banner-h: 38px;
  --w-tools: 40px;     /* вертикальна панель інструментів */
  --w-layers: 300px;   /* менеджер шарів */
  --h-timeline: 56px;  /* шкала часу */
}

/* --- SICH v2 · motion.css --- */
/* SICH v2 — motion & focus. Not observed in source; designed: instant state flips, short functional eases. */
:root {
  --dur-0: 0ms;    /* @kind other */ /* status flips, selection: instant */
  --dur-1: 80ms;   /* @kind other */ /* hover */
  --dur-2: 120ms;  /* @kind other */ /* panel, menu, tooltip */
  --dur-3: 180ms;  /* @kind other */ /* modal, drawer, mode tint */
  --ease: cubic-bezier(0.2, 0, 0, 1);   /* @kind other */
  --ease-linear: linear;                /* @kind other */
  --blink: 1s;     /* @kind other */ /* cursor ▌ blink in loaders */
  --spin: 800ms;   /* @kind other */ /* text spinner ⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏ */
  --pulse: 2.4s;   /* @kind other */ /* «живе» — об'єкт на звʼязку, супровід іде */

  --focus-ring: 0 0 0 2px var(--void), 0 0 0 3px var(--affirm);  /* @kind shadow */
}

/* --- SICH v2 · base.css --- */
/* SICH v2 — base document rules + the few text utilities the system is built from. */
html, body { margin: 0; background: var(--void); color: var(--ink-2); font-family: var(--font-mono); font-size: var(--fs-3); line-height: var(--lh-3); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0; background: var(--tint); pointer-events: none; z-index: 0; transition: background var(--dur-3) var(--ease); }
body > * { position: relative; z-index: 1; }
* { box-sizing: border-box; }
a { color: var(--affirm); text-decoration: none; border-bottom: 1px solid var(--ink-5); }
a:hover { color: var(--ink-1); border-bottom-color: var(--affirm); }
::selection { background: var(--affirm); color: var(--void); }
:focus-visible { outline: none; box-shadow: var(--focus-ring); }
h1, h2, h3, p { margin: 0; font-weight: var(--fw-regular); }

/* [key] — the square bracket means "this can be pressed" */
.key { color: var(--ink-3); white-space: nowrap; }
.key::before { content: "["; } .key::after { content: "]"; }
.key.is-on, .is-selected > .key { color: var(--affirm); }
.key.is-off { color: var(--ink-4); }

.title { font-size: var(--fs-5); line-height: var(--lh-5); font-weight: var(--fw-bold); color: var(--ink-1); text-transform: uppercase; text-align: center; }
.sec   { font-size: var(--fs-4); line-height: var(--lh-4); color: var(--ink-3); text-transform: uppercase; }
.sec .ent { color: inherit; }
.label { font-size: var(--fs-2); line-height: var(--lh-2); color: var(--ink-3); text-transform: uppercase; }
.meta  { font-size: var(--fs-1); line-height: var(--lh-1); color: var(--ink-3); }
.ink-1{color:var(--ink-1)} .ink-2{color:var(--ink-2)} .ink-3{color:var(--ink-3)} .ink-4{color:var(--ink-4)} .ink-5{color:var(--ink-5)}
.cost{color:var(--cost)} .affirm{color:var(--affirm)} .warn{color:var(--warn)} .info{color:var(--info)}
.num { text-align: right; font-variant-numeric: tabular-nums; }
.rule { border: 0; border-top: var(--bw) solid var(--ink-5); margin: 0; }

/* three degrees of dimming instead of hiding */
.is-locked, .is-locked * { color: var(--ink-4) !important; }
.is-ghost,  .is-ghost *  { color: var(--ink-5) !important; }


/* --- КОСТИЛ --- */
/* КОСТИЛ · шкіра SICH Design System v2.
   Значення беруться лише з токенів системи. Тіней, світіння, градієнтів і блюру нема.
   Рамка 1px — єдиний носій «висоти». Радіус 0 на оболонці, 4 на контролах.
   Десктоп ≥1024 — оболонка ОШС: top bar · nav · журнал · мапа · контекст · status bar.
   Нижче 1024 — польова модель: мапа на весь екран, нижня панель, шухляди знизу. */

:root{
  --f-1:12px; --f-2:13px; --f-3:16px;      /* мобільний мінімум — 16 (C4) */
  --lh-b:24px;
  --tools-h:68px;                           /* нижня панель, моб */
  --h-vptools:58px;                         /* тулбар угорі вьюпорта */
  --panel-w:380px;                          /* шухляда, моб/планшет */
  --simbar-h:0px;
  --safe-t:env(safe-area-inset-top,0px);  --safe-b:env(safe-area-inset-bottom,0px);
  /* скільки віддаємо системній смузі під панеллю: не більше 14 px */
  --bar-b:max(var(--sp-2),min(var(--safe-b),14px));
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
@media(min-width:900px){ :root{ --f-3:15px; --tools-h:0px } }

/* Висоту беремо з JS (--vh), а не з 100%: у встановленому застосунку
   висота html буває коротшою за справжнє вікно, і під нижньою панеллю
   лишається чорна смуга — панель стоїть на дні СВОЄЇ коробки, а коробка
   не дістає до дна екрана. 100% лишається запасним значенням на випадок,
   якщо скрипт іще не відпрацював. */
html,body{height:var(--vh,100%);margin:0;padding:0;overflow:hidden;background:var(--void);
  color:var(--ink-2);font-family:var(--font-mono);font-size:var(--f-3);line-height:var(--lh-b);
  letter-spacing:var(--ls-0);font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;touch-action:manipulation}
kostyl-app{display:block;position:fixed;inset:0;overflow:hidden;background:var(--void)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.hid{display:none!important}
.dim{color:var(--ink-3)}
.grow{flex:1;min-width:0}

/* ═══ гліфи стану: колір + гліф + підпис, ніколи колір сам ═══ */
@keyframes braille{
  0%{content:"⠋"}10%{content:"⠙"}20%{content:"⠹"}30%{content:"⠸"}40%{content:"⠼"}
  50%{content:"⠴"}60%{content:"⠦"}70%{content:"⠧"}80%{content:"⠇"}90%{content:"⠏"}}
.led{flex:none;min-width:2ch;text-align:center;color:var(--affirm)}
.led::before{content:"●"}
.led.busy{color:var(--warn)}
.led.busy::before{content:"⠋";animation:braille var(--spin) steps(1) infinite}
.led.err{color:var(--cost)}
.led.err::before{content:"✕"}

/* ═══ контроли ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  height:var(--h-lg);padding:0 var(--px-md);line-height:1;white-space:nowrap;
  font-size:var(--f-2);background:transparent;color:var(--ink-2);
  border:var(--bw) solid var(--ink-4);border-radius:var(--r-1);
  transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
@media(hover:hover){.btn:hover{background:var(--hover);color:var(--ink-1);border-color:var(--ink-3)}}
.btn:active{background:var(--active)}
.btn.on{background:var(--active);color:var(--ink-1);border-color:var(--affirm)}
.btn.warn{color:var(--cost)}
.btn.ok{color:var(--affirm)}
@media(hover:hover){
  .btn.warn:hover{background:var(--hover);color:var(--cost);border-color:var(--ink-3)}

.btn[disabled]{color:var(--ink-4);border-color:var(--ink-5);background:transparent;cursor:not-allowed}
.btn--sm{height:var(--h-sm);padding:0 var(--px-sm);font-size:var(--f-1)}

.inp{display:block;width:100%;height:var(--h-lg);padding:0 var(--sp-3);

  border:var(--bw) solid var(--ink-4);border-radius:var(--r-1);
  -webkit-user-select:text;user-select:text;
  transition:border-color var(--dur-1) var(--ease)}

@media(hover:hover){.inp:hover{border-color:var(--ink-3)}}
.inp:focus{border-color:var(--affirm);box-shadow:none}

/* свіч — текстовий гліф системи, не пілюля */
.chk{flex:none;display:inline-flex;align-items:center;justify-content:flex-end;
  min-width:52px;min-height:var(--h-md);cursor:pointer;color:var(--ink-3);

@media(hover:hover){.chk:hover{color:var(--ink-1)}}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:var(--h-lg);
  background:transparent;cursor:pointer;margin:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink-5);border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:20px;margin-top:-9px;
  background:var(--affirm);border:0;border-radius:0}
input[type=range]::-moz-range-track{height:2px;background:var(--ink-5);border:0}
input[type=range]::-moz-range-thumb{width:10px;height:20px;border:0;border-radius:0;background:var(--affirm)}
@media(hover:hover){
  input[type=range]:hover::-webkit-slider-runnable-track{background:var(--ink-4)}
  input[type=range]:hover::-moz-range-track{background:var(--ink-4)}}

/* ═══ каркас ═══ */
#shell{position:absolute;inset:0}
#mid{position:absolute;inset:0}
#topbar,#vptools{display:none}
#tree-col,#ctx-col{display:contents}

#work{position:absolute;inset:0}
#map{position:absolute;inset:0;touch-action:none;z-index:0;background:var(--void)}
.maplibregl-control-container{display:none}
#map.crosshair .maplibregl-canvas-container{cursor:crosshair!important}
#map.grab .maplibregl-canvas-container{cursor:grabbing!important}

/* ═══ рядок стану ═══ */
#statusbar{position:absolute;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;gap:var(--sp-2);
  background:var(--void);border-bottom:var(--bw) solid var(--ink-5);
  padding:calc(var(--sp-2) + var(--safe-t)) calc(var(--sp-4) + var(--safe-r)) var(--sp-2) calc(var(--sp-4) + var(--safe-l));
  font-size:var(--f-1);line-height:var(--lh-1);color:var(--ink-3);white-space:nowrap;overflow:hidden;
  min-height:calc(36px + var(--safe-t))}
#statusbar .pfx{color:var(--ink-3);flex:none}
#st-txt{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;color:var(--ink-2)}
#z-ro{flex:none;color:var(--ink-3)}

/* біжучий рядок для довгого повідомлення: один прохід, потім еліпсис */
#st-txt>span{display:inline-block;white-space:nowrap}
#st-txt.run{text-overflow:clip}
#st-txt.run>span{animation:stmarq 7s linear 1 forwards}
@keyframes stmarq{0%,18%{transform:translateX(0)}82%,100%{transform:translateX(var(--dx,0))}}
/* моб: зум і мережа в куті мапи, статус отримує весь рядок */
#hud{position:absolute;right:calc(var(--sp-2) + var(--safe-r));
  top:calc(44px + var(--safe-t) + var(--simbar-h, 0px));z-index:450;
  display:flex;gap:var(--sp-2);align-items:center;padding:2px var(--sp-2);font-size:var(--f-1);line-height:var(--lh-1);
  color:var(--ink-3);background:var(--void);border:var(--bw) solid var(--ink-5);border-radius:var(--r-1);pointer-events:none}
#hud-net{color:var(--affirm)}#hud-net.off{color:var(--cost)}
#statusbar #z-ro,#statusbar #sb-net{display:none}

/* ═══ верхня смуга (десктоп) ═══ */
#topbar{height:var(--h-topbar);align-items:center;gap:var(--sp-5);padding:0 var(--edge);
  border-bottom:var(--bw) solid var(--ink-5);background:var(--void);
  font-size:var(--f-2);white-space:nowrap;overflow:hidden}
#topbar .brand{color:var(--ink-1);font-weight:var(--fw-bold);font-size:var(--f-3);flex:none}
#topbar .crumbs{display:flex;gap:var(--sp-2);color:var(--ink-3);flex:none}
#topbar .crumbs .sep{color:var(--ink-5)}
#topbar .crumbs .cur{color:var(--ink-2)}
.tbtn{display:inline-flex;align-items:center;gap:var(--sp-2);flex:none;height:var(--h-md);padding:0 var(--sp-2);
  color:var(--ink-3);border-radius:var(--r-1);transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
@media(hover:hover){.tbtn:hover{background:var(--hover);color:var(--ink-1)}}

#tb-clock{flex:none;color:var(--ink-2)}

/* ═══ тулбар угорі вьюпорта (десктоп) ═══ */
#vptools{flex:none;height:var(--h-vptools);align-items:center;gap:var(--sp-1);padding:0 var(--sp-2);overflow:hidden;
  border-bottom:var(--bw) solid var(--ink-5);background:var(--void);overflow-x:auto;scrollbar-width:none}
.vsep{flex:none;width:1px;align-self:stretch;margin:var(--sp-2) var(--sp-1);background:var(--ink-5)}
#tools{flex:1;min-width:0;display:flex;gap:var(--sp-1);overflow-x:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.vpright{flex:none;display:flex;gap:var(--sp-1)}
.hbtn{flex:none;min-width:64px;padding:0 var(--sp-2);height:var(--h-lg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;color:var(--ink-2);
  border:var(--bw) solid transparent;border-radius:var(--r-1);
  transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}

.hbtn .l{font-size:var(--f-1);line-height:1;color:var(--ink-3);text-transform:uppercase;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(hover:hover){.hbtn:hover{background:var(--hover);border-color:var(--ink-4)}

/* ═══ ПАЛУБА ЦІЛЕЙ ═══ */
/* Палуба стоїть рівно під індикатором зуму й вирівняна з ним: той самий
   правий край, той самий кегль, ті самі відступи. Смуга на всю ширину
   екрана накривала мапу заради шести рядків — ширина до середини вистачає. */
#deck{display:none;position:absolute;z-index:465;
  left:calc(var(--sp-2) + var(--safe-l));
  top:calc(44px + var(--safe-t) + var(--simbar-h, 0px));
  width:min(230px,calc(50vw - var(--sp-2)));max-height:46vh;
  background:var(--raised);border:var(--bw) solid var(--ink-5);
  border-radius:var(--r-1);overflow:hidden;display:none;flex-direction:column}
#deck.on{display:flex}

.dk-h{display:flex;align-items:center;gap:var(--sp-2);flex:none;min-height:22px;
  padding:2px var(--sp-2);border-bottom:var(--bw) solid var(--ink-5);
  font-size:var(--f-1);line-height:var(--lh-1);letter-spacing:.12em;color:var(--ink-3)}
.dk-h .grow{flex:1}
#dk-n{color:var(--ink-1);font-variant-numeric:tabular-nums}
#deck .sb{flex:none;width:18px;height:16px;display:grid;place-items:center;
  background:transparent;color:var(--ink-3);border:var(--bw) solid var(--ink-5);
  border-radius:var(--r-1);cursor:pointer;font-size:9px}
#deck.min #dk-list{display:none}
#deck.min .sb{transform:rotate(180deg)}
#dk-list{overflow-y:auto;-webkit-overflow-scrolling:touch}
.dk-r{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;
  gap:var(--sp-1);padding:3px var(--sp-2);cursor:pointer;
  border-bottom:var(--bw) solid var(--ink-6);font-size:var(--f-1);line-height:var(--lh-1)}
.dk-r:hover{background:var(--hover)}
.dk-r i{font-style:normal;flex:none}
.dk-r b{font-weight:400;color:var(--ink-1);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.dk-r s{text-decoration:none;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.dk-r em{grid-column:2/4;font-style:normal;color:var(--ink-4)}
@media(max-width:600px){
  #deck{max-height:36vh}
}

/* ═══ КУПОЛ ═══
   Сторінка накриває все: мапа під нею лишається живою (фід іде далі), але
   не малюється — два важкі рушії на одному екрані нікому не потрібні.
   Полотна стоять стосом: відео знизу, WebGL над ним, 2D-оверлей зверху. */
#dome{position:absolute;inset:0;z-index:600;background:var(--void);
  display:flex;flex-direction:column}
#dome[hidden]{display:none!important}
/* Мапу під куполом ховаємо зовсім: вона накрита, і малювати її — це просто
   гріти телефон. Фід при цьому живий, тривоги й цілі оновлюються далі. */
body.domeon #map{display:none}
#vid,#gl,#ov,#ruler{position:absolute;inset:0;width:100%;height:100%;display:block}
#vid{object-fit:cover;opacity:0;transition:opacity var(--dur-2) var(--ease)}
#dome.cam #vid{opacity:1}
#gl{pointer-events:none}
#ov{touch-action:none}
#ruler{pointer-events:none}

/* Купол малює власними кольорами ЖУЙКИ — зводимо їх на токени SICH, щоб
   небо не жило в іншій палітрі, ніж решта застосунку. */
#dome{--acc:var(--affirm);--bad:var(--cost);--dim:var(--ink-3);
  --txt:var(--ink-1);--txt2:var(--ink-2);--bg:var(--void);--feed:var(--info);
  --rocket:var(--warn)}

#dome-top{position:absolute;left:0;right:0;top:0;z-index:5;
  display:flex;align-items:center;gap:var(--sp-2);height:36px;
  padding:0 calc(var(--sp-3) + var(--safe-r)) 0 calc(var(--sp-3) + var(--safe-l));
  padding-top:var(--safe-t);box-sizing:content-box;
  background:linear-gradient(var(--void),rgba(0,0,0,.55) 70%,transparent)}
#dome-top .dt-t{font-size:var(--f-2);letter-spacing:.16em;color:var(--ink-1);font-weight:var(--fw-bold)}
#dome-top .dt-s{font-size:var(--f-0);letter-spacing:.06em;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dome-top .grow{flex:1}
#dome .sb{flex:none;width:30px;height:24px;display:grid;place-items:center;
  background:var(--ink-6);color:var(--ink-1);border:var(--bw) solid var(--ink-5);
  border-radius:var(--r-1);cursor:pointer;font-size:12px;line-height:1}
#dome .sb.on{border-color:var(--affirm);color:var(--affirm)}

#dome-foot{position:absolute;left:0;right:0;bottom:0;z-index:5;
  display:flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-2) calc(var(--sp-3) + var(--safe-r)) calc(var(--sp-2) + var(--bar-b)) calc(var(--sp-3) + var(--safe-l));
  font-size:var(--f-0);letter-spacing:.06em;color:var(--ink-3);
  background:linear-gradient(transparent,rgba(0,0,0,.6) 40%)}
#dome-foot .grow{flex:1}
#dome-n{color:var(--ink-1);font-variant-numeric:tabular-nums}
#dome-warn{color:var(--warn);text-align:right}
@media(max-width:600px){#dome-warn{display:none}}

/* ── шари купола ── */
#dome-set{position:absolute;z-index:18;right:calc(var(--sp-3) + var(--safe-r));
  top:calc(44px + var(--safe-t));width:min(320px,calc(100vw - 2*var(--sp-3)));
  max-height:66vh;display:flex;flex-direction:column;
  background:var(--raised);border:var(--bw) solid var(--ink-5);border-radius:var(--r-1)}
#dome-set[hidden]{display:none!important}
.ds-h{display:flex;align-items:center;gap:var(--sp-2);flex:none;
  padding:var(--sp-2) var(--sp-3);border-bottom:var(--bw) solid var(--ink-5);
  font-size:var(--f-0);letter-spacing:.14em;color:var(--ink-3)}
.ds-h b{color:var(--ink-1)}
.ds-h .grow{flex:1}
.ds-l{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--sp-2) var(--sp-3)}
.ds-r{display:grid;grid-template-columns:1fr auto;align-items:center;
  gap:2px var(--sp-2);padding:var(--sp-2) 0;cursor:pointer;
  border-bottom:var(--bw) solid var(--ink-6)}
.ds-r:last-child{border-bottom:0}

.ds-r .chk{grid-row:1/3}

/* ── картка цілі ──
   Те саме, що приціл каже вголос, тільки текстом і з підписами джерел.
   Стоїть унизу, щоб не закривати небо над прицілом. */
#dome-card{position:absolute;z-index:19;left:calc(var(--sp-3) + var(--safe-l));
  right:calc(var(--sp-3) + var(--safe-r));bottom:calc(58px + var(--bar-b));
  max-width:420px;margin:0 auto;max-height:52vh;display:flex;flex-direction:column;
  background:var(--raised);border:var(--bw) solid var(--ink-5);border-radius:var(--r-1)}
#dome-card[hidden]{display:none!important}
#dome-card .ds-h b{letter-spacing:.1em}
.dc-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--sp-2) var(--sp-3)}
.dc-r{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-2);
  padding:3px 0;border-bottom:var(--bw) solid var(--ink-6);font-size:var(--f-1);line-height:var(--lh-1)}
.dc-r:last-child{border-bottom:0}
.dc-r u{text-decoration:none;color:var(--ink-4);letter-spacing:.08em;min-width:92px}
.dc-r b{font-weight:var(--fw-regular);color:var(--ink-1);text-align:right}
.dc-r.warn b{color:var(--warn)}
.dc-r.bad b{color:var(--cost)}
.dc-note{padding:var(--sp-2) var(--sp-3);border-top:var(--bw) solid var(--ink-5);
  font-size:var(--f-0);color:var(--ink-4);text-wrap:pretty}

/* ── екран дозволів ──
   Чотири рядки замість чотирьох карток: людина під куполом має побачити
   стан усіх дозволів одним поглядом, а не гортати пів екрана. Пояснення
   показуємо ЛИШЕ для поточного кроку — решта зараз не потрібна. */
#dome-ask{position:absolute;inset:0;z-index:20;display:grid;place-items:center;
  padding:var(--sp-4);background:rgba(0,0,0,.82)}
#dome-ask[hidden]{display:none!important}
.da-box{width:min(320px,100%);background:var(--raised);
  border:var(--bw) solid var(--ink-5);border-radius:var(--r-1);
  padding:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-2)}
.da-h{display:flex;align-items:baseline;gap:var(--sp-2);
  font-size:var(--f-0);letter-spacing:.16em;color:var(--ink-3)}
.da-h b{color:var(--ink-1);font-weight:var(--fw-bold)}
.da-h .grow{flex:1}

.da-it{display:flex;align-items:center;gap:var(--sp-2);
  padding:5px var(--sp-1);border-bottom:var(--bw) solid var(--ink-6);
  font-size:var(--f-1)}
.da-it:last-child{border-bottom:0}
.da-it u{flex:none;width:16px;text-align:center;text-decoration:none;
  color:var(--ink-4);font-size:13px;line-height:1}
.da-it b{flex:1;min-width:0;font-weight:var(--fw-regular);color:var(--ink-3)}
.da-it i{flex:none;font-style:normal;font-size:var(--f-0);color:var(--ink-4);
  white-space:nowrap;max-width:11ch;overflow:hidden;text-overflow:ellipsis}
.da-it[data-s="next"] u,.da-it[data-s="next"] b{color:var(--ink-1)}
.da-it[data-s="next"]{background:var(--active)}
.da-it[data-s="wait"] i{color:var(--warn)}
.da-it[data-s="ok"] u,.da-it[data-s="ok"] i{color:var(--affirm)}
.da-it[data-s="err"] i{color:var(--cost)}
.da-note{font-size:var(--f-0);color:var(--ink-3);text-wrap:pretty;min-height:2.4em}
.da-acts{display:flex;gap:var(--sp-2)}
#da-go{flex:1}
#da-skip{flex:none;color:var(--ink-3)}

/* ═══ нижня панель (моб) ═══ */
#bar{position:absolute;left:0;right:0;bottom:0;z-index:500;background:var(--void);
  border-top:var(--bw) solid var(--ink-5);display:grid;grid-template-columns:repeat(6,1fr);gap:var(--sp-1);
  padding:var(--sp-2) calc(var(--sp-1) + var(--safe-r)) var(--bar-b) calc(var(--sp-1) + var(--safe-l))}
/* встановлений застосунок: під панеллю зʼявлялась чорна смуга — це безпечна
   зона під смужку «додому». Спершу ми додавали її ПОВЕРХ власного відступу;
   потім вона його поглинала — і все одно на Android із жестовою навігацією
   лишалося сорок порожніх пікселів, бо система повідомляє повну висоту
   своєї смуги, а малює прозору риску. Тож беремо з безпечної зони рівно
   стільки, скільки треба, щоб кнопка не лягла під риску, і ні пікселя
   більше: --bar-b. */
@media(display-mode:standalone),(display-mode:fullscreen){
  #bar{padding-top:var(--sp-1)}
  #bar .bbtn{height:calc(var(--h-lg) - 2px)}}
.bbtn{height:var(--h-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-1);
  border:var(--bw) solid transparent;border-radius:var(--r-1);color:var(--ink-2);min-width:0;
  transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
.bbtn .g{font-size:18px;line-height:1;color:var(--ink-2)}
.bbtn .l{font-size:var(--f-1);line-height:1;color:var(--ink-3);text-transform:uppercase;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bbtn:active{background:var(--active)}
.bbtn.on{background:var(--active);border-color:var(--affirm)}
.bbtn.on .g{color:var(--ink-1)}
.bbtn.on .l{color:var(--affirm)}
.bbtn.arm{border-color:var(--affirm)}
.bbtn.arm .g,.bbtn.arm .l{color:var(--affirm)}
.bbtn[disabled]{cursor:not-allowed}
.bbtn[disabled] .g,.bbtn[disabled] .l{color:var(--ink-4)}

/* ═══ селект інструментів (моб) ═══ */
#tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--sp-2)}
.tpick{height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-1);
  border:var(--bw) solid var(--ink-4);border-radius:var(--r-1);background:transparent;color:var(--ink-2);
  transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease)}
.tpick .g{font-size:22px;line-height:1;color:var(--ink-1)}
.tpick .l{font-size:var(--f-1);line-height:1;text-transform:uppercase;color:var(--ink-2)}
@media(hover:hover){.tpick:hover{background:var(--hover);border-color:var(--ink-3)}}
.tpick:active{background:var(--active)}
.tpick.on{background:var(--active);border-color:var(--affirm)}
.tpick.on .l{color:var(--affirm)}

/* ═══ панель креслення / звʼязку — активний інструмент у руках ═══ */
#draft,#linkbar{position:absolute;left:calc(var(--edge) + var(--safe-l));right:calc(var(--edge) + var(--safe-r));
  bottom:calc(var(--tools-h) + var(--bar-b) + var(--sp-3));z-index:480;display:none;
  background:var(--raised);border:var(--bw) solid var(--affirm);border-radius:var(--r-1);padding:var(--sp-3)}
#draft.on,#linkbar.on{display:block}
#draft-head,#lb-head{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3)}
#draft-head .t,#lb-head .t{flex:none;font-size:var(--f-2);line-height:var(--lh-2);text-transform:uppercase;
  color:var(--ink-1);font-weight:var(--fw-bold)}
#draft-head .n,#lb-head .n{margin-left:auto;flex:0 1 auto;min-width:0;font-size:var(--f-1);color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#draft-mode{display:none;grid-template-columns:1fr 1fr;gap:var(--sp-2);margin-bottom:var(--sp-2)}
#draft-mode.on{display:grid}
#draft-btns,#lb-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--sp-2)}
#lb-btns{margin-top:var(--sp-2)}
#lb-types{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
#lb-types .btn{justify-content:flex-start;gap:var(--sp-2);padding:0 var(--sp-2);min-width:0}
#lb-types .btn i{width:18px;height:0;border-top-width:2px;border-top-style:solid;flex:none;display:block}
#lb-types .btn b{font-weight:var(--fw-regular);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ═══ панелі ═══ */
#scrim{position:fixed;inset:0;z-index:600;background:var(--scrim);opacity:0;pointer-events:none;
  transition:opacity var(--dur-3) var(--ease)}
#scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:700;height:60vh;
  max-height:calc(100vh - var(--safe-t) - 44px);
  background:var(--raised);border-top:var(--bw) solid var(--ink-4);border-radius:0;
  transform:translateY(102%);transition:transform var(--dur-3) var(--ease),height var(--dur-3) var(--ease);
  display:flex;flex-direction:column;padding-bottom:var(--bar-b)}
.panel.open{transform:none}
.panel.full{height:calc(100vh - var(--safe-t) - var(--sp-5))}
.grip{height:24px;display:flex;align-items:center;justify-content:center;flex:none;cursor:grab;touch-action:none}
.grip::after{content:"";width:44px;height:2px;background:var(--ink-4)}
.p-head{display:flex;align-items:center;gap:var(--sp-3);height:var(--h-lg);padding:0 var(--sp-4);flex:none;
  border-bottom:var(--bw) solid var(--ink-5);overflow:hidden;white-space:nowrap;
  font-size:var(--f-2);line-height:var(--lh-2);text-transform:uppercase;color:var(--ink-1);font-weight:var(--fw-bold)}
.p-head > span:first-child{flex:0 0 auto;max-width:72%;overflow:hidden;text-overflow:ellipsis}
.p-head .rule{flex:1 1 var(--sp-4);min-width:var(--sp-2);height:1px;background:var(--ink-5)}
.p-head .count{flex:none;color:var(--ink-3);font-weight:var(--fw-regular);font-size:var(--f-1)}
.p-head .x{flex:none;display:inline-flex;align-items:center;justify-content:center;width:var(--h-md);height:var(--h-md);
  border:var(--bw) solid var(--ink-4);border-radius:var(--r-1);color:var(--cost);font-size:var(--f-2);font-weight:var(--fw-regular);
  transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease)}
@media(hover:hover){.p-head .x:hover{background:var(--hover);border-color:var(--ink-3)}}
.p-search{padding:var(--sp-3) var(--sp-4) 0;flex:none}
.p-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--sp-4) var(--sp-4) var(--sp-6);flex:1;min-height:0}
.p-body--tree{padding-top:var(--sp-3)}
.p-foot{display:flex;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);border-top:var(--bw) solid var(--ink-5);flex:none}
.p-foot .btn{flex:1}

/* ── вибір засобу ППО / борта ── */
.pkrow{display:flex;align-items:baseline;gap:var(--sp-3);padding:var(--sp-2) var(--sp-1);
  min-height:var(--h-lg);cursor:pointer;border-radius:var(--r-1)}
.pkrow:hover{background:var(--ink-6)}
.pkrow i{flex:none;width:7px;height:7px;border-radius:50%;transform:translateY(-1px)}
.pkrow b{flex:1;min-width:0;font-weight:500;font-size:var(--f-2);color:var(--ink-1)}
.pkrow b em{display:block;font-style:normal;font-size:var(--f-0);color:var(--ink-3);text-wrap:pretty}
.pkrow s{flex:none;text-decoration:none;font-size:var(--f-0);color:var(--ink-3);text-align:right}
.pkgrp{font-size:var(--f-0);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:var(--sp-4) 0 var(--sp-1)}
.pkgrp:first-child{margin-top:0}
/* ── смуга симуляції ──
   Живе вгорі, одразу під рядком стану: це орган керування, а не підвал, і
   на телефоні великий палець дістає її без перекриття мапи знизу. Видима
   щойно на мапі зʼявився бодай один обʼєкт сценарію — інакше користувач
   просто не знаходив, звідки запускається наліт. */
#simbar{display:none;position:absolute;left:0;right:0;top:calc(36px + var(--safe-t));
  z-index:460;align-items:center;gap:var(--sp-2);height:38px;
  padding:0 calc(var(--sp-2) + var(--safe-r)) 0 calc(var(--sp-2) + var(--safe-l));
  background:var(--bg-2);border-bottom:var(--bw) solid var(--ink-5)}
#simbar.on{display:flex}
body.simon{--simbar-h:38px}
#simbar .sb{flex:none;width:30px;height:24px;display:grid;place-items:center;
  background:var(--ink-6);color:var(--ink-1);border:var(--bw) solid var(--ink-5);
  border-radius:var(--r-1);cursor:pointer;font-size:12px;line-height:1}
#simbar .sb:hover{border-color:var(--acc);color:var(--acc)}
#simbar .sb.on{border-color:var(--acc);color:var(--acc);background:var(--ink-5)}
#simbar .sb.wide{width:auto;padding:0 var(--sp-3);font-size:var(--f-0);
  letter-spacing:.1em;text-transform:uppercase}
#simbar .grow{flex:1}
/* перемикач режимів */
#sim-mode{flex:none;display:flex;gap:2px;font-size:var(--f-0);letter-spacing:.06em}
#sim-mode b{font-weight:400;padding:3px 7px;border-radius:var(--r-1);cursor:pointer;
  color:var(--ink-3);border:var(--bw) solid transparent;white-space:nowrap}
#sim-mode b.on{color:var(--acc);border-color:var(--ink-5);background:var(--ink-6)}
#sim-mode b i{font-style:normal}
/* напис про сховані справжні цілі — щоб ніхто не переплутав гру з обстановкою */
#live-hid{display:none;flex:none;font-size:var(--f-0);letter-spacing:.06em;
  color:var(--warn);border:var(--bw) solid var(--warn);border-radius:var(--r-1);
  padding:2px 6px;white-space:nowrap}
#live-hid.on{display:inline-block}
#live-hid i{font-style:normal}
#live-hid u{display:none;text-decoration:none}
@media(max-width:600px){#live-hid i{display:none}#live-hid u{display:inline}}
#sim-mode b u{display:none;text-decoration:none}
/* три взаємовиключні панелі за станом */
.sim-pane{display:none;flex:1;min-width:0;align-items:center;gap:var(--sp-2);overflow:hidden}
#simbar[data-st="idle"] #sim-idle,
#simbar[data-st="run"]  #sim-ctl,
#simbar[data-st="live"] #sim-live{display:flex}
#simbar[data-st="idle"] #sim-stop,
#simbar[data-st="idle"] #sim-chr{display:none}
#sim-hint{font-size:var(--f-0);color:var(--ink-3);letter-spacing:.06em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Таймлайн: смужка подій ОКРЕМО над повзунком, а не поверх нього. Накривати
   нативний range власними елементами — вірний спосіб зламати перетягування
   на тачі; так само лишається і тонка розмітка нальоту, і робочий повзунок. */
#sim-tl{position:relative;flex:1 1 220px;min-width:70px;display:flex;flex-direction:column;
  justify-content:center;gap:1px}
#sim-ticks{position:relative;height:6px;margin:0 8px}
#sim-ticks i{position:absolute;top:0;width:2px;height:6px;border-radius:1px;
  transform:translateX(-1px);opacity:.85}
#sim-scrub{width:100%;height:16px;margin:0;accent-color:var(--acc);cursor:pointer}
#sim-time,#sim-cnt,#live-time,#live-cnt,#live-warn{flex:none;
  font-size:var(--f-0);color:var(--ink-3);letter-spacing:.06em;white-space:nowrap}
#sim-time,#live-time{color:var(--ink-1);font-variant-numeric:tabular-nums;min-width:52px}
#sim-time{min-width:88px}
#sim-time em{font-style:normal;color:var(--ink-3)}
/* прискорювач — одна кнопка, що ходить по колу ×1 → ×5 → ×10 → ×30 */
#simbar #sim-spd{min-width:46px;justify-content:center;color:var(--ink-1);
  font-variant-numeric:tabular-nums;letter-spacing:.04em;text-transform:none}
#simbar #sim-spd.fast{color:var(--acc);border-color:var(--acc)}
#sim-cnt em,#live-cnt em{font-style:normal;color:var(--ink-1)}
/* Лічильники стискаються, але не забирають місце в таймлайна: flex:1 в обох
   різав повзунок навпіл і все одно лишав лічильник із трикрапкою. */
#sim-cnt,#live-cnt{flex:0 1 auto;min-width:0;max-width:30%;
  overflow:hidden;text-overflow:ellipsis}
#live-warn{color:var(--warn,#ffb347);text-transform:uppercase;letter-spacing:.1em}
.sim-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--cost,#ff3b30);
  animation:simpulse 1.6s ease-in-out infinite}
@keyframes simpulse{0%,100%{opacity:1}50%{opacity:.25}}
/* Хронологія: випадає з-під смуги, мапа лишається чистою */
#sim-chron{display:none;position:absolute;right:var(--sp-2);top:calc(100% + 4px);
  width:min(380px,calc(100vw - 2*var(--sp-2)));max-height:52vh;overflow:auto;
  background:var(--bg-2);border:var(--bw) solid var(--ink-5);
  border-radius:var(--r-1);z-index:40;box-shadow:0 10px 28px rgba(0,0,0,.5)}
#sim-chron.on{display:block}
#sim-chron .ch-h{position:sticky;top:0;display:flex;align-items:center;
  gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);background:var(--bg-2);
  border-bottom:var(--bw) solid var(--ink-5);font-size:var(--f-0);
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
#sim-chron .ch-h .grow{flex:1}
.chr{display:flex;gap:var(--sp-2);align-items:baseline;cursor:pointer;
  padding:3px var(--sp-3);font-size:var(--f-0);
  border-bottom:var(--bw) solid var(--ink-6)}
.chr:hover{background:var(--ink-6)}
.chr u{text-decoration:none;flex:none;min-width:40px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.chr s{text-decoration:none;flex:none;width:12px;text-align:center}
.chr b{flex:1;min-width:0;font-weight:400;color:var(--ink-1)}
/* Вузький екран: лічильники нальоту поступаються таймлайну. Вони довідкові,
   а повзунок — орган керування; у бойовому режимі таймлайна немає, тож
   тамтешні лічильники лишаються завжди. */
@media(max-width:1279px){ #sim-cnt{display:none} }
@media(max-width:600px){
  #live-warn{display:none}
  /* Таймлайн окремим рядком на всю ширину: у спільному рядку з кнопками
     йому лишалось 60–70 px, і влучити пальцем у потрібну хвилину було
     неможливо. Панель керування розкладається (display:contents), тож її
     кнопки й таймлайн стають прямими елементами смуги й переносяться. */
  #simbar[data-st="run"]{height:auto;flex-wrap:wrap;row-gap:2px;
    padding-top:5px;padding-bottom:4px}
  #simbar[data-st="run"] #sim-ctl{display:contents}
  #simbar[data-st="run"] #sim-tl{order:10;flex:1 1 100%;min-width:0;padding:0 2px}
  #simbar[data-st="run"] #sim-ticks{height:7px}
  #simbar[data-st="run"] #sim-scrub{height:24px}
  #simbar[data-st="run"] #sim-time{margin-left:auto;min-width:0}
  /* загальна тривалість на телефоні не влазить у рядок кнопок — її видно
     з таймлайна, а поточний час лишається */
  #simbar[data-st="run"] #sim-time em{display:none}
  /* прибирання розміщень — дія режиму спокою; під час нальоту вона лише
     забирає місце в кнопок, якими справді користуються */
  #simbar[data-st="run"] #sim-wipe,#simbar[data-st="live"] #sim-wipe{display:none}
  #sim-mode b{padding:3px 5px}
  #sim-mode b i{display:none}
  #sim-mode b u{display:inline}
  #live-time,#sim-time{min-width:44px}
  #sim-time{min-width:74px}
  #simbar{gap:var(--sp-1)}
}
/* ── картка ППО: боєкомплект по засобах ── */
.ld-row{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) 0;
  border-bottom:var(--bw) solid var(--ink-6)}
.ld-row b{flex:1;min-width:0;font-weight:500;font-size:var(--f-1);color:var(--ink-1)}
.ld-row b em{display:block;font-style:normal;font-size:var(--f-0);color:var(--ink-3);text-wrap:pretty}
.ld-row .inp{width:64px;flex:none}
.ld-hint{font-size:var(--f-0);color:var(--ink-3);margin:var(--sp-1) 0 var(--sp-2)}
/* ── повітряна обстановка ── */
.r .k small{display:block;font-size:var(--f-0);color:var(--ink-4);
  text-transform:none;letter-spacing:0;margin-top:1px;text-wrap:pretty}
.airsum{font-size:var(--f-1);color:var(--ink-3);letter-spacing:.04em;margin-bottom:var(--sp-2)}
.airsum.live{color:var(--ink-1)}
.airsum.stale{color:var(--warn,#ffb347)}
.airrow{display:flex;align-items:baseline;gap:var(--sp-2);padding:var(--sp-1) 0;cursor:pointer;min-height:var(--h-md)}
.airrow:hover{background:var(--ink-6)}
.airrow i{flex:none;width:6px;height:6px;border-radius:50%;transform:translateY(-1px)}
.airrow b{flex:1;min-width:0;font-weight:500;font-size:var(--f-2);color:var(--ink-1)}
.airrow b em{display:block;font-style:normal;font-size:var(--f-0);color:var(--ink-3);text-wrap:pretty}
.airrow s{flex:none;text-decoration:none;font-size:var(--f-0);color:var(--ink-3)}
.airsrc{display:block;text-align:right;font-size:var(--f-0);color:var(--ink-3);text-decoration:none;margin-top:var(--sp-2)}
.airsrc:hover{color:var(--acc)}
.sec{display:flex;align-items:center;gap:var(--sp-3);margin:var(--sp-6) 0 var(--sp-3);
  font-size:var(--f-2);line-height:var(--lh-2);text-transform:uppercase;color:var(--ink-3)}
.sec::after{content:"";flex:1;height:1px;background:var(--ink-5)}
.sec:first-child{margin-top:0}
.r{display:flex;align-items:center;gap:var(--sp-3);min-height:var(--h-lg)}
.r .k{flex:1;min-width:0;font-size:var(--f-2);color:var(--ink-2)}
.r .v{font-size:var(--f-2);color:var(--ink-1);white-space:nowrap;text-align:right}
.rg{padding:0 0 var(--sp-2)}
.opts{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.opts .btn{flex:1 1 96px;min-width:0;height:var(--h-md);padding:0 var(--sp-2);font-size:var(--f-2);
  display:block;line-height:calc(var(--h-md) - 2px);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swatches{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.col{width:40px;height:var(--h-md);border:var(--bw) solid var(--ink-5);border-radius:var(--r-1);cursor:pointer;
  transition:border-color var(--dur-1) var(--ease)}
@media(hover:hover){.col:hover{border-color:var(--ink-1)}}
.col.on{border-color:var(--ink-1);outline:var(--bw) solid var(--affirm);outline-offset:2px}
.glyphs{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--sp-2)}
.gl{height:var(--h-lg);border:var(--bw) solid var(--ink-4);border-radius:var(--r-1);background:transparent;
  color:var(--ink-2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color var(--dur-1) var(--ease),background var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
@media(hover:hover){.gl:hover{border-color:var(--ink-3);background:var(--hover);color:var(--ink-1)}}
.gl.on{background:var(--active);border-color:var(--affirm);color:var(--ink-1)}
pre{font-family:var(--font-mono);font-size:var(--f-1);line-height:var(--lh-1);color:var(--ink-3);
  white-space:pre-wrap;margin:0}
pre.hi{color:var(--ink-2)}
.gap{height:var(--sp-2)}

/* ═══ вкладки картки ═══ */
.tabs{display:flex;flex:none;border-bottom:var(--bw) solid var(--ink-5);padding:0 var(--sp-4)}
.tabs button{flex:1;height:var(--h-lg);font-size:var(--f-2);text-transform:uppercase;color:var(--ink-3);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease)}
@media(hover:hover){.tabs button:hover{color:var(--ink-1)}}
.tabs button.on{color:var(--ink-1);border-bottom-color:var(--affirm)}
.tabhid{display:none!important}
.inp.num{width:120px;flex:none;text-align:right;height:var(--h-md);font-size:var(--f-2);padding:0 var(--sp-2)}

/* ═══ візард підрозділу ═══ */
#u-prevbar{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-3) var(--sp-4);flex:none;
  border-bottom:var(--bw) solid var(--ink-5)}
#u-prev{width:76px;height:76px;flex:none}
#u-prevtxt{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
#u-prevtxt .nm{font-size:var(--f-2);line-height:var(--lh-2);font-weight:var(--fw-bold);color:var(--ink-1);
  text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#u-prevtxt .sub{font-size:var(--f-1);line-height:var(--lh-1);color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#u-prevtxt .mono{font-size:var(--f-1);color:var(--ink-4)}
#u-hint{color:var(--affirm)!important}
#u-icons{display:flex;flex-direction:column;margin-top:var(--sp-2);
  max-height:360px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.icn{min-height:48px;border:var(--bw) solid transparent;border-radius:var(--r-1);background:transparent;
  display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:var(--sp-3);
  padding:var(--sp-1) var(--sp-2);text-align:left;
  transition:border-color var(--dur-1) var(--ease),background var(--dur-1) var(--ease)}
.icn canvas{width:40px;height:40px;flex:none}

<body>
<kostyl-app></kostyl-app>

<!-- ═══ ПАКЕТ ПОВІТРЯНОЇ ОБСТАНОВКИ ═══
     3d-моделі й ТТХ витягнуті з myFPV, фід NEPTUN і механіка тривог — з delta9.
     Вшито як є: кожен модуль лишається самостійним і кладе свій глобал,
     тож оновити його потім можна заміною одного блоку. -->
<script>
/* КОСТИЛ · МОДЕЛІ — 3d-бібліотека, витягнута з myFPV (github.com/PeterBortin/myFPV)
   ────────────────────────────────────────────────────────────────────────────
   Геометрія будується один раз і шариться між усіма інстансами.
   Кожна модель = 1 LineSegments (злиті EdgesGeometry) + опційно 1 тіньовий Mesh.
   EdgesGeometry замість wireframe:true — немає діагоналей по квадах, чистий силует.
   Анімовані частини (пропи, башта, кінцівки, крила) — окремі об'єкти в parts.

   Залежність одна: THREE (r128). Нічого з гри myFPV сюди не тягнеться.
   Експорт: window.MODELS — каталог фабрик, кожна повертає {group, parts}.
   1 одиниця = 1 метр, ніс моделі дивиться у +Z.
*/
(function(){
'use strict';

const GEO={}, MAT={};

function cache(k,fn){ if(!GEO[k])GEO[k]=fn(); return GEO[k]; }

function lineMat(color,opacity){
  const k='L'+color+'|'+(opacity==null?1:opacity);
  if(!MAT[k])MAT[k]=new THREE.LineBasicMaterial({color:color,transparent:opacity!=null&&opacity<1,opacity:opacity==null?1:opacity});
  return MAT[k];
}
function fillMat(color,opacity){
  const k='F'+color+'|'+(opacity==null?.9:opacity);
  if(!MAT[k]){
    const m=new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:opacity==null?.9:opacity,side:THREE.DoubleSide,depthWrite:true});
    m.polygonOffset=true;m.polygonOffsetFactor=1.6;m.polygonOffsetUnits=1.6;
    MAT[k]=m;
  }
  return MAT[k];
}

function mergePos(geos){
  let n=0;const arrs=[];
  for(const g of geos){
    const gg=g.index?g.toNonIndexed():g;
    const a=gg.attributes.position.array;arrs.push(a);n+=a.length;
  }
  const out=new Float32Array(n);let o=0;
  for(const a of arrs){out.set(a,o);o+=a.length;}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(out,3));
  return g;
}

function T(x,y,z,rx,ry,rz){
  const m=new THREE.Matrix4();
  m.makeRotationFromEuler(new THREE.Euler(rx||0,ry||0,rz||0));
  m.setPosition(x||0,y||0,z||0);
  return m;
}

/* пласка деталь: контур у площині XZ, товщина по Y */
function plate(pts,thick){
  const s=new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],p[1])));
  const g=new THREE.ExtrudeGeometry(s,{depth:thick,bevelEnabled:false,curveSegments:4});
  g.rotateX(-Math.PI/2);g.translate(0,-thick/2,0);
  return g;
}
/* профіль збоку: pts=[вперед,вгору], екструзія на ширину. Ніс у +Z */
function sideProfile(pts,width){
  const s=new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],p[1])));
  const g=new THREE.ExtrudeGeometry(s,{depth:width,bevelEnabled:false,curveSegments:4});
  g.translate(0,0,-width/2);g.rotateY(-Math.PI/2);
  return g;
}

function Rig(){this.e=[];this.f=[];}
Rig.prototype.add=function(geo,m,thresh,noFill){
  const g=m?geo.clone().applyMatrix4(m):geo;
  this.e.push(new THREE.EdgesGeometry(g,thresh==null?1:thresh));
  if(!noFill)this.f.push(g.index?g.toNonIndexed():g);
  return this;
};
Rig.prototype.bake=function(){
  return {e:this.e.length?mergePos(this.e):null,f:this.f.length?mergePos(this.f):null};
};

function build(baked,edgeColor,edgeOpacity,fillColor,fillOpacity){
  const g=new THREE.Group();
  if(baked.f&&fillColor!=null)g.add(new THREE.Mesh(baked.f,fillMat(fillColor,fillOpacity)));
  if(baked.e)g.add(new THREE.LineSegments(baked.e,lineMat(edgeColor,edgeOpacity)));
  return g;
}

const CYL=30, SPH=44; // порогові кути: приховують поздовжні лінії на тілах обертання

/* ───────────────────────── КВАДРОКОПТЕР 5" ───────────────────────── */
const MOT=0.58, PROP_R=0.36;

function propBaked(blades){
  return cache('prop'+blades,function(){
    const r=new Rig();
    r.add(new THREE.CylinderGeometry(.034,.028,.036,10),T(0,0,0),CYL);
    const blade=[[.045,-.020],[.13,-.058],[.26,-.050],[.34,-.016],[.345,.010],[.25,.048],[.12,.058],[.045,.026]];
    for(let i=0;i<blades;i++){
      const g=plate(blade,.007);
      g.rotateX(.24);                       // крок лопаті
      g.applyMatrix4(T(0,0,0,0,i*Math.PI*2/blades,0));
      r.add(g,null,1);
    }
    return r.bake();
  });
}

function quadBaked(){
  return cache('quad',function(){
    const r=new Rig();
    // нижня плита рами
    r.add(new THREE.BoxGeometry(.40,.028,.46),T(0,0,0));
    // 4 плеча зі звуженням
    const arm=[[.12,-.060],[.665,-.034],[.665,.034],[.12,.060]];
    for(let i=0;i<4;i++)r.add(plate(arm,.028),T(0,0,0,0,Math.PI/4+i*Math.PI/2,0));
    // стійки стека
    [[-.14,.20],[.14,.20],[-.14,-.20],[.14,-.20]].forEach(p=>
      r.add(new THREE.CylinderGeometry(.018,.018,.20,8),T(p[0],.10,p[1]),CYL));
    // плати: ESC + FC
    r.add(new THREE.BoxGeometry(.28,.022,.30),T(0,.062,0));
    r.add(new THREE.BoxGeometry(.25,.020,.26),T(0,.135,0));
    // верхня плита
    r.add(new THREE.BoxGeometry(.36,.026,.44),T(0,.205,0));
    // акумулятор + стяжка
    r.add(new THREE.BoxGeometry(.26,.100,.42),T(0,.268,-.02));
    r.add(new THREE.BoxGeometry(.29,.012,.05),T(0,.268,.10));
    r.add(new THREE.BoxGeometry(.29,.012,.05),T(0,.268,-.15));
    // мотори: колокол + статор + вал
    for(let i=0;i<4;i++){
      const sx=(i&1)?MOT:-MOT, sz=(i&2)?MOT:-MOT;
      r.add(new THREE.CylinderGeometry(.086,.086,.088,16),T(sx,.075,sz),CYL);
      r.add(new THREE.CylinderGeometry(.060,.060,.055,12),T(sx,.012,sz),CYL);
      r.add(new THREE.CylinderGeometry(.014,.014,.05,8),T(sx,.14,sz),CYL);
      // лапа
      r.add(new THREE.CylinderGeometry(.012,.012,.13,6),T(sx*.92,-.065,sz*.92),CYL);
    }
    // камера у рамці, нахил 22°
    r.add(new THREE.BoxGeometry(.15,.15,.10),T(0,.16,.235,-.38,0,0));
    r.add(new THREE.CylinderGeometry(.048,.052,.075,14),T(0,.185,.30,Math.PI/2-.38,0,0),CYL);
    r.add(new THREE.BoxGeometry(.035,.11,.035),T(-.095,.145,.235));
    r.add(new THREE.BoxGeometry(.035,.11,.035),T(.095,.145,.235));
    // антена VTX
    r.add(new THREE.CylinderGeometry(.012,.009,.42,6),T(0,.39,-.30,-.62,0,0),CYL);
    r.add(new THREE.CylinderGeometry(.023,.023,.06,8),T(0,.561,-.422,-.62,0,0),CYL);
    return r.bake();
  });
}

function payloadBaked(){
  return cache('payload',function(){
    const r=new Rig();
    r.add(new THREE.CylinderGeometry(.105,.105,.34,14),T(0,0,.02,Math.PI/2,0,0),CYL);
    r.add(new THREE.CylinderGeometry(.105,.045,.16,14),T(0,0,.27,Math.PI/2,0,0),CYL);
    r.add(new THREE.CylinderGeometry(.022,.022,.10,8),T(0,0,.40,Math.PI/2,0,0),CYL);
    for(let i=0;i<4;i++)
      r.add(new THREE.BoxGeometry(.010,.13,.16),T(0,0,-.16,0,i*Math.PI/2,0).multiply(T(0,.09,0)));
    return r.bake();
  });
}

function makeQuad(o){
  o=o||{};
  const col=o.color==null?0x00ff55:o.color;
  const fill=o.fill==null?0x00220f:o.fill;
  const g=new THREE.Group(), parts={props:[]};
  const body=build(quadBaked(),col,o.opacity==null?1:o.opacity,fill,.88);
  body.name='frame';g.add(body);
  const pb=propBaked(o.blades||3);
  for(let i=0;i<4;i++){
    const sx=(i&1)?MOT:-MOT, sz=(i&2)?MOT:-MOT;
    const p=build(pb,col,.85,null);
    p.name='prop'+i;p.position.set(sx,.155,sz);
    g.add(p);parts.props.push(p);
  }
  if(o.payload){
    const pay=build(payloadBaked(),col,1,fill,.9);
    pay.name='payload';pay.position.set(0,-.20,0);
    g.add(pay);parts.payload=pay;
  }
  if(o.scale)g.scale.setScalar(o.scale);
  return {group:g,parts:parts};
}

/* ───────────────────────── ПІХОТИНЕЦЬ ───────────────────────── */
function soldierBaked(){
  return cache('sol',function(){
    const r=new Rig();
    // корпус одним об'ємом: вузька талія -> широка броня на грудях
    r.add(sideProfile([[-.12,-.20],[.10,-.20],[.125,.16],[.125,.31],[-.135,.31],[-.125,.06]],.36),T(0,.06,0));
    r.add(new THREE.BoxGeometry(.44,.14,.24),T(0,.325,0));                    // плечі / розвантаження
    r.add(new THREE.BoxGeometry(.175,.165,.185),T(0,.465,.015));              // голова
    r.add(new THREE.SphereGeometry(.132,14,8,0,Math.PI*2,0,Math.PI*.52),T(0,.505,0),SPH); // шолом
    r.add(new THREE.BoxGeometry(.28,.32,.145),T(0,.16,-.20));                 // рюкзак
    // автомат навскіс по груді
    const RIF=T(.15,.12,.10,0,-.30,.16);
    r.add(new THREE.BoxGeometry(.05,.095,.32),RIF.clone());
    r.add(new THREE.CylinderGeometry(.013,.013,.22,6),RIF.clone().multiply(T(0,.03,.27,Math.PI/2,0,0)),CYL);
    r.add(new THREE.BoxGeometry(.045,.135,.065),RIF.clone().multiply(T(0,-.085,.02)));
    return r.bake();
  });
}
function thighBaked(){
  return cache('thigh',function(){
    const r=new Rig();
    r.add(new THREE.BoxGeometry(.132,.42,.148),T(0,-.21,0));
    r.add(new THREE.BoxGeometry(.116,.09,.132),T(0,-.425,.004));   // коліно
    return r.bake();
  });
}
function shinBaked(){
  return cache('shin',function(){
    const r=new Rig();
    r.add(new THREE.BoxGeometry(.108,.38,.128),T(0,-.19,.004));
    r.add(new THREE.BoxGeometry(.128,.085,.215),T(0,-.422,.042));   // ступня
    return r.bake();
  });
}
function upArmBaked(){
  return cache('uparm',function(){
    const r=new Rig();
    r.add(new THREE.BoxGeometry(.115,.33,.125),T(0,-.165,0));
    r.add(new THREE.BoxGeometry(.102,.08,.112),T(0,-.335,.006));    // лікоть
    return r.bake();
  });
}
function foreArmBaked(){
  return cache('forearm',function(){
    const r=new Rig();
    r.add(new THREE.BoxGeometry(.10,.30,.11),T(0,-.15,.006));
    r.add(new THREE.BoxGeometry(.085,.09,.115),T(0,-.335,.016));    // кисть
    return r.bake();
  });
}
/* кінцівка з суглобом: root обертається в стегні/плечі, joint — у коліні/лікті */
function limb(colBaked,jointBaked,col,jointY){
  const root=build(colBaked,col,.95,null);
  const joint=build(jointBaked,col,.95,null);
  joint.position.y=jointY;
  root.add(joint);
  root.joint=joint;
  return root;
}
function soldierFarBaked(){
  return cache('solFar',function(){
    const r=new Rig();
    r.add(new THREE.BoxGeometry(.40,.60,.26),T(0,.14,0));
    r.add(new THREE.BoxGeometry(.17,.30,.19),T(0,.56,0));
    r.add(new THREE.BoxGeometry(.145,.86,.17),T(-.10,-.50,.04));
    r.add(new THREE.BoxGeometry(.145,.86,.17),T(.10,-.50,-.04));
    r.add(new THREE.CylinderGeometry(.02,.02,.55,4),T(.16,.16,.20,Math.PI/2,0,0),CYL);
    return r.bake();
  });
}

function manpadsBaked(){
  return cache('manpads',function(){
    const r=new Rig();
    r.add(new THREE.CylinderGeometry(.105,.105,1.62,10,1,true),T(0,0,.34,Math.PI/2,0,0),CYL);
    r.add(new THREE.TorusGeometry(.105,.022,4,10),T(0,0,1.15),CYL,true);
    r.add(new THREE.CylinderGeometry(.125,.105,.30,10),T(0,0,-.62,Math.PI/2,0,0),CYL);
    r.add(new THREE.BoxGeometry(.10,.20,.22),T(0,-.16,.10));        // рукоятка
    r.add(new THREE.BoxGeometry(.09,.14,.26),T(.10,.09,.30));       // приціл
    return r.bake();
  });
}
function makeSoldier(color,kind){
  const col=color==null?0xff2a00:color;
  const g=new THREE.Group(), parts={};
  const near=new THREE.Group();near.name='near';
  const torso=build(soldierBaked(),col,.95,0x220400,.82);
  near.add(torso);
  parts.torso=torso;
  const th=thighBaked(), sh=shinBaked(), ua=upArmBaked(), fa=foreArmBaked();
  parts.legL=limb(th,sh,col,-.425);parts.legL.position.set(-.092,-.115,0);

/* ═════════════════════════ АВІАЦІЯ ═════════════════════════
   Ніс у +Z, y=0 — вісь фюзеляжу, 1 одиниця = 1 м (реальні габарити).
   Силует важливіший за дрібні деталі: ніс, пілони, кілі, гондоли, ротор.
   parts: rotors[] (обертання по Y, dir у userData), tail (хвостовий),
          exhaust[] — локальні точки сопел (тепловізор/факели),
          rope — точка виходу десанту, stores[] — те, що відчіпляється. */
function nozzle(r,x,y,z,rIn,rOut,len){
  r.add(new THREE.CylinderGeometry(rIn,rOut,len,12),T(x,y,z,Math.PI/2,0,0),CYL);

/* підвіска: пілон + виріб під крилом */
function store(r,x,y,z,rad,len,fins){
  r.add(new THREE.BoxGeometry(.16,.52,len*.34),T(x,y+.42,z));
  r.add(new THREE.CylinderGeometry(rad,rad,len*.82,10),T(x,y,z,Math.PI/2,0,0),CYL);
  r.add(new THREE.ConeGeometry(rad,len*.22,10),T(x,y,z+len*.52,Math.PI/2,0,0),CYL);

/* спільне: радіопрозорий ніс, гондола, кіль, підвіс */
/* носовий обтікач: тіло обертання з огівальним профілем + ПВД на кінчику.
   droop — нахил осі вниз (у Су й МіГ ніс помітно опущений відносно фюзеляжу). */
function radome(r,zBase,len,rad,y,droop){
  const n=10,pts=[];
  for(let i=0;i<=n;i++){
    const t=i/n;
    pts.push(new THREE.Vector2(Math.max(.018,rad*Math.pow(1-t*t,.58)),len*t));
  }
  const g=new THREE.LatheGeometry(pts,16);
  g.rotateX(Math.PI/2);
  const m=T(0,y||0,zBase,droop||0,0,0);
  r.add(g,m,CYL);
  const pit=new THREE.CylinderGeometry(.05,.03,1.20,6);
  pit.rotateX(Math.PI/2);pit.translate(0,0,len+.54);
  r.add(pit,m,CYL);
}
function pod(r,x,y,z,rad,len){
  r.add(new THREE.CylinderGeometry(rad,rad,len,10),T(x,y,z,Math.PI/2,0,0),CYL);
  r.add(new THREE.ConeGeometry(rad,len*.30,10),T(x,y,z+len*.63,Math.PI/2,0,0),CYL);
}

/* ───────────────── ротори ───────────────── */
function rotorBaked(blades,R,chord){
  return cache('rot'+blades+'_'+R+'_'+chord,function(){
    const r=new Rig();
    r.add(new THREE.CylinderGeometry(.34,.42,.52,10),T(0,0,0),CYL);
    const c=chord;
    for(let i=0;i<blades;i++){
      const bl=plate([[.40,-c*.5],[R*.5,-c*.56],[R*.94,-c*.46],[R,-c*.16],[R*.94,c*.40],[R*.5,c*.52],[.40,c*.5]],.07);
      bl.applyMatrix4(T(0,0,0,0,i*Math.PI*2/blades,0));
      r.add(bl,null,1);
    }
    return r.bake();
  });
}
function rotorGrp(col,blades,R,chord,dir){
  const g=build(rotorBaked(blades,R,chord),col,.80,null);
  g.userData.dir=dir||1;
  return g;
}
function tailRotorGrp(col,blades,R){
  const g=new THREE.Group();
  const d=rotorGrp(col,blades,R,R*.22,1);
  d.rotation.z=Math.PI/2;
  g.add(d);g.userData.disc=d;
  return g;
}
function wheelStrut(r,x,y,z,h,wr){
  r.add(new THREE.CylinderGeometry(.09,.09,h,8),T(x,y+h/2,z),CYL);
  r.add(new THREE.CylinderGeometry(wr,wr,.26,10),T(x,y,z,0,0,Math.PI/2),CYL);
}
/* верхня палуба двигунів вертольота: два заборники + гондоли */
function heliDeck(r,x,zIn,zEng,y,rad,len){
  [-x,x].forEach(sx=>{
    r.add(new THREE.CylinderGeometry(rad,rad,len,10),T(sx,y,zEng,Math.PI/2,0,0),CYL);
    r.add(new THREE.CylinderGeometry(rad*.86,rad*.86,1.5,10),T(sx,y+.10,zIn,Math.PI/2,0,0),CYL);
  });
}

function makeJet(kind,o){
  o=o||{};
  const col=o.color==null?0xff2a00:o.color, fill=o.fill==null?0x200500:o.fill;
  const g=new THREE.Group(), parts={rotors:[],stores:[]};
  const baked=kind==='su34'?su34Baked():kind==='su35'?su35Baked():mig31Baked();
  g.add(build(baked,col,.95,fill,.82));
  if(kind==='mig31'){                                    // «Кинжал» на центральному вузлі
    const k=makeAGM('kinzhal',col).group;
    k.scale.setScalar(1.05);k.rotation.y=Math.PI;
    k.position.set(0,-2.55,.8);
    g.add(k);parts.stores.push(k);
  }else{                                                 // ударні підвіски під крилом
    const id=kind==='su34'?'x59':'x101';
    for(let sd=-1;sd<=1;sd+=2){
      const p=new THREE.Group();
      p.position.set(sd*(kind==='su34'?3.4:3.9),-1.42,kind==='su34'?-.6:-1.2);
      const py=new THREE.Mesh(new THREE.BoxGeometry(.20,.62,1.5),fillMat(fill,.9));
      py.position.y=.42;p.add(py);
      py.add(new THREE.LineSegments(new THREE.EdgesGeometry(py.geometry),lineMat(col,.9)));
      const m=makeAGM(id,col);
      m.group.rotation.y=Math.PI;
      if(m.parts.wings&&m.parts.wings.length)agmDeploy(m.parts,0);   // на підвісці крило складене
      p.add(m.group);
      g.add(p);parts.stores.push(p);
    }
  }
  parts.exhaust=kind==='mig31'
    ?[new THREE.Vector3(-1.42,-.35,-11.85),new THREE.Vector3(1.42,-.35,-11.85)]
    :kind==='su35'
    ?[new THREE.Vector3(-1.34,-.44,-12.40),new THREE.Vector3(1.34,-.44,-12.40)]
    :[new THREE.Vector3(-1.32,-.44,-11.85),new THREE.Vector3(1.32,-.44,-11.85)];
  parts.span=kind==='mig31'?13.5:15.0;
  if(o.scale)g.scale.setScalar(o.scale);
  return {group:g,parts:parts};
}
/* блок НАР Б-8: 20 трубок у пакеті на пілоні */
function narPodBaked(){
  return cache('narpod',function(){
    const r=new Rig();
    r.add(new THREE.CylinderGeometry(.42,.42,2.60,12),T(0,0,0,Math.PI/2,0,0),CYL);
    r.add(new THREE.CylinderGeometry(.42,.30,.34,12),T(0,0,1.47,Math.PI/2,0,0),CYL);
    for(let ring=0;ring<2;ring++){
      const n=ring?12:6, rad=ring?.28:.15;
      for(let i=0;i<n;i++){
        const a=i/n*6.283+ring*.26;
        r.add(new THREE.CylinderGeometry(.055,.055,.10,6),
          T(Math.cos(a)*rad,Math.sin(a)*rad,1.34,Math.PI/2,0,0),CYL,true);
      }
    }
    r.add(new THREE.BoxGeometry(.10,.44,.90),T(0,.52,-.1));
    return r.bake();
  });
}
function makeHeli(kind,o){
  o=o||{};
  const col=o.color==null?0xff2a00:o.color, fill=o.fill==null?0x200500:o.fill;
  const g=new THREE.Group(), parts={rotors:[]};
  if(kind==='mi8'){
    g.add(build(mi8Baked(),col,.95,fill,.82));
    const m=rotorGrp(col,5,10.60,.62,1);m.position.set(0,4.62,.25);g.add(m);parts.rotors.push(m);
    const t=tailRotorGrp(col,3,2.40);t.position.set(-.42,2.75,-12.55);g.add(t);parts.tail=t;
    parts.exhaust=[new THREE.Vector3(-.98,3.00,-.70),new THREE.Vector3(.98,3.00,-.70)];
    parts.rope=new THREE.Vector3(1.36,-.55,1.55);
    parts.rotorR=10.6;
  }else if(kind==='mi24'){
    g.add(build(mi24Baked(),col,.95,fill,.82));
    const m=rotorGrp(col,5,8.65,.56,1);m.position.set(0,4.18,.45);g.add(m);parts.rotors.push(m);
    const t=tailRotorGrp(col,3,1.70);t.position.set(-.52,2.55,-11.90);g.add(t);parts.tail=t;
    parts.exhaust=[new THREE.Vector3(-.82,2.62,-.25),new THREE.Vector3(.82,2.62,-.25)];
    parts.rope=new THREE.Vector3(1.05,-.65,1.10);
    parts.rotorR=8.65;
    parts.pods=[];
    for(let sd=-1;sd<=1;sd+=2)for(const dx of [2.05,3.35]){        // два блоки НАР на кожній консолі
      const p=build(narPodBaked(),col,.95,fill,.85);
      p.position.set(sd*dx,.30-dx*.10,-.35);
      g.add(p);parts.pods.push(p);
    }
  }else{
    g.add(build(ka52Baked(),col,.95,fill,.82));
    const up=rotorGrp(col,3,7.25,.58,1);up.position.set(0,5.45,.10);g.add(up);parts.rotors.push(up);
    const lo=rotorGrp(col,3,7.25,.58,-1);lo.position.set(0,4.45,.10);lo.rotation.y=.52;g.add(lo);parts.rotors.push(lo);
    parts.exhaust=[new THREE.Vector3(-1.28,1.35,-1.40),new THREE.Vector3(1.28,1.35,-1.40)];
    parts.rotorR=7.25;
    parts.pods=[];
    for(let sd=-1;sd<=1;sd+=2){
      const p=build(narPodBaked(),col,.95,fill,.85);
      p.position.set(sd*2.55,1.10,-1.05);
      g.add(p);parts.pods.push(p);
    }
  }
  if(o.scale)g.scale.setScalar(o.scale);
  return {group:g,parts:parts};
}

function tracks(r,sx,halfLen,top,botR,n){
  for(let s=0;s<2;s++){
    const x=s?sx:-sx;
    r.add(sideProfile([[-halfLen+.40,botR*.30],[-halfLen,top*.55],[-halfLen,top],[halfLen,top],[halfLen,top*.55],[halfLen-.40,botR*.30]],.52),T(x,0,0));
    const step=(halfLen*2-1.3)/(n-1);
    for(let i=0;i<n;i++)
      r.add(new THREE.CylinderGeometry(botR,botR,.30,12),T(x,botR,-halfLen+.65+i*step,0,0,Math.PI/2),CYL);
  }
}
function addTruckBase(r,halfLen,wid,axles,wr){
  const hw=wid/2, R=wr||.56;
  r.add(sideProfile([[-halfLen,R+.06],[-halfLen,R+.46],[halfLen,R+.46],[halfLen,R+.06]],wid*.90),T(0,0,0));
  r.add(sideProfile([[halfLen-2.05,R+.46],[halfLen-2.00,R+2.16],[halfLen-.55,R+2.24],[halfLen-.10,R+1.54],[halfLen,R+1.04],[halfLen,R+.46]],wid*.98),T(0,0,0));
  r.add(new THREE.BoxGeometry(wid*.80,.58,.09),T(0,R+1.80,halfLen-.58));
  for(let i=0;i<axles.length;i++){

function pylonBaked(h,armW){
  return cache('pyl'+h+'_'+armW,function(){
    const r=new Rig();
    const base=1.55, topW=.52;
    for(let i=0;i<4;i++){
      const sx=(i&1)?1:-1, sz=(i&2)?1:-1;
      const g=new THREE.BufferGeometry();
      const bx=sx*base, bz=sz*base, tx=sx*topW, tz=sz*topW;
      const seg=new THREE.CylinderGeometry(.075,.075,h,4);
      const mid=new THREE.Matrix4().makeTranslation((bx+tx)/2,h/2,(bz+tz)/2);
      const tilt=new THREE.Matrix4().makeRotationZ(-(tx-bx)/h);
      const tilt2=new THREE.Matrix4().makeRotationX((tz-bz)/h);
      r.add(seg,mid.multiply(tilt).multiply(tilt2),CYL);
    }
    const lv=Math.max(3,Math.round(h/3.4));
    for(let k=0;k<lv;k++){
      const y0=h*k/lv, y1=h*(k+1)/lv;
      const w0=base+(topW-base)*(k/lv), w1=base+(topW-base)*((k+1)/lv);
      for(let s=0;s<4;s++){
        const a=s*Math.PI/2;
        const p0x=Math.cos(a)*w0*1.41, p0z=Math.sin(a)*w0*1.41;
        const p1x=Math.cos(a+Math.PI/2)*w1*1.41, p1z=Math.sin(a+Math.PI/2)*w1*1.41;
        const dx=p1x-p0x, dy=y1-y0, dz=p1z-p0z;
        const len=Math.hypot(dx,dy,dz);
        const br=new THREE.CylinderGeometry(.038,.038,len,4);
        const m=new THREE.Matrix4().makeTranslation((p0x+p1x)/2,(y0+y1)/2,(p0z+p1z)/2);
        const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3(dx/len,dy/len,dz/len));
        m.multiply(new THREE.Matrix4().makeRotationFromQuaternion(q));
        r.add(br,m,CYL,true);
        r.add(new THREE.CylinderGeometry(.034,.034,w0*2.6,4),T(0,y0,Math.cos(a)*w0,0,0,Math.PI/2),CYL,true);
      }
    }
    for(let a=0;a<2;a++){
      const y=h-.6-a*2.5;
      r.add(new THREE.BoxGeometry(armW*2,.16,.30),T(0,y,0));
      r.add(new THREE.BoxGeometry(armW*1.4,.12,.22),T(0,y+.55,0));
      for(let s=-1;s<=1;s+=1){
        if(!s&&a)continue;
        const x=s*armW*.92;
        r.add(new THREE.CylinderGeometry(.055,.055,.42,6),T(x,y-.32,0),CYL);
        r.add(new THREE.BoxGeometry(.20,.10,.20),T(x,y-.56,0));
      }
    }
    return r.bake();
  });
}

/* ── обладнання покрівель: усе злите в один меш на чанк ──
   Жодна деталь не виходить за периметр будівлі: точки перевіряються
   входженням у полігон із запасом. Дахи тільки пласкі:
   парапет (три типи), вихід на дах, надбудова сходів, витяжки, вентиляція,
   дефлектори, кондиціонери, баки, антени, мачта з розтяжками. */
function makeRoofClutter(items,color){
  const r=new Rig();
  const pip=(x,z,p)=>{
    let inside=false;
    for(let a=0,b=p.length-1;a<p.length;b=a++){
      const xi=p[a].x,zi=p[a].z,xj=p[b].x,zj=p[b].z;
      if(((zi>z)!==(zj>z))&&(x<(xj-xi)*(z-zi)/(zj-zi)+xi))inside=!inside;
    }
    return inside;
  };
  for(let n=0;n<items.length;n++){
    const it=items[n], y=it.y;
    let p=it.pts||null;
    if(p&&p.length>2){
      const l=p[p.length-1];
      if(Math.abs(l.x-p[0].x)<1e-6&&Math.abs(l.z-p[0].z)<1e-6)p=p.slice(0,-1);
    }
    if(!p||p.length<3)continue;
    const rnd=(s)=>{const x=Math.sin(it.seed*12.9898+s*78.233)*43758.5453;return x-Math.floor(x);};
    let cx=0,cz=0;
    for(const q of p){cx+=q.x;cz+=q.z;}
    cx/=p.length;cz/=p.length;
    const small=!!it.small, span=Math.min(it.hw,it.hd);

    /* ── парапет: три типи, завжди зсунутий усередину ── */
    const pType=rnd(0);
    const t=small?.13:.17, IN=small?.22:.35;
    const ph=small?.26+rnd(1)*.10:(pType<.34?.50:pType<.67?.34:.62);
    for(let k=0;k<p.length;k++){
      const a=p[k],b2=p[(k+1)%p.length];
      const dx=b2.x-a.x,dz=b2.z-a.z,len=Math.hypot(dx,dz);
      if(len<1.0)continue;
      let nx=-dz/len,nz=dx/len;
      const mx=a.x+dx/2,mz=a.z+dz/2;
      if((mx-cx)*nx+(mz-cz)*nz>0){nx=-nx;nz=-nz;}
      const ang=Math.atan2(dx,dz);
      r.add(new THREE.BoxGeometry(t,ph,len),T(mx+nx*IN,y+ph/2,mz+nz*IN,0,ang,0));
      if(!small&&pType>=.67)                                   // карниз по верху
        r.add(new THREE.BoxGeometry(t*2.1,.09,len),T(mx+nx*IN,y+ph+.045,mz+nz*IN,0,ang,0));
      if(!small&&pType>=.34&&pType<.67){                       // стовпчики
        const np=Math.max(1,Math.floor(len/3.2));
        for(let q=0;q<=np;q++){
          const f=q/np-.5;
          r.add(new THREE.BoxGeometry(t*1.5,.28,.20),
            T(mx+dx*f+nx*IN,y+ph+.14,mz+dz*f+nz*IN,0,ang,0));
        }
      }
    }

    /* ── точка на покрівлі з гарантованим запасом від краю ── */
    const spot=(s,clear)=>{
      const c=clear||1.0;
      for(let k=0;k<16;k++){
        const px=cx+(rnd(s+k*3)-.5)*it.hw*1.55, pz=cz+(rnd(s+k*3+1)-.5)*it.hd*1.55;
        if(pip(px,pz,p)&&pip(px+c,pz,p)&&pip(px-c,pz,p)&&pip(px,pz+c,p)&&pip(px,pz-c,p)
          &&pip(px+c*.7,pz+c*.7,p)&&pip(px-c*.7,pz-c*.7,p))
          return {x:px,z:pz};
      }
      return null;
    };

    /* ── деталі ── */
    const vent=(v,sc)=>{                                       // грибок
      r.add(new THREE.CylinderGeometry(.30*sc,.30*sc,.85*sc,8),T(v.x,y+.42*sc,v.z),CYL);
      r.add(new THREE.CylinderGeometry(.44*sc,.40*sc,.10*sc,8),T(v.x,y+.90*sc,v.z),CYL);
    };
    const louvre=(v,sc)=>{                                     // короб із жалюзі
      r.add(new THREE.BoxGeometry(.95*sc,.70*sc,.95*sc),T(v.x,y+.35*sc,v.z));
      r.add(new THREE.BoxGeometry(1.10*sc,.09*sc,1.10*sc),T(v.x,y+.74*sc,v.z));
    };
    const defl=(v,sc)=>{                                       // дефлектор
      r.add(new THREE.CylinderGeometry(.20*sc,.20*sc,1.15*sc,7),T(v.x,y+.57*sc,v.z),CYL);
      r.add(new THREE.ConeGeometry(.34*sc,.34*sc,8),T(v.x,y+1.30*sc,v.z,Math.PI,0,0),CYL);
    };
    const pipes=(v,sc)=>{                                      // пара труб
      r.add(new THREE.CylinderGeometry(.15*sc,.15*sc,1.35*sc,6),T(v.x-.22*sc,y+.67*sc,v.z),CYL);
      r.add(new THREE.CylinderGeometry(.13*sc,.13*sc,1.05*sc,6),T(v.x+.24*sc,y+.52*sc,v.z),CYL);
      r.add(new THREE.BoxGeometry(.70*sc,.08*sc,.16*sc),T(v.x,y+.95*sc,v.z));
    };
    const cond=(v,sc)=>{                                       // кондиціонер
      r.add(new THREE.BoxGeometry(1.30*sc,.78*sc,.95*sc),T(v.x,y+.39*sc,v.z));
      r.add(new THREE.CylinderGeometry(.30*sc,.30*sc,.06*sc,10),T(v.x,y+.79*sc,v.z),CYL);
    };
    const hatch=(v,sc)=>{                                      // вихід на дах: люк
      r.add(new THREE.BoxGeometry(1.05*sc,.24*sc,1.05*sc),T(v.x,y+.12*sc,v.z));
      r.add(new THREE.BoxGeometry(1.15*sc,.07*sc,1.15*sc),T(v.x+.10*sc,y+.34*sc,v.z,0,0,-.30));
    };
    const stair=(v,sc)=>{                                      // надбудова сходів
      const w=Math.min(2.3,it.hw*.55)*sc, d=Math.min(2.0,it.hd*.55)*sc, h=2.30*sc;
      r.add(new THREE.BoxGeometry(w,h,d),T(v.x,y+h/2,v.z));
      r.add(new THREE.BoxGeometry(w+.18,.10,d+.18),T(v.x,y+h+.05,v.z));
      r.add(new THREE.BoxGeometry(.06,h*.62,d*.42),T(v.x+w/2,y+h*.31,v.z));
    };
    const tank=(v,sc)=>{
      r.add(new THREE.CylinderGeometry(.60*sc,.60*sc,1.30*sc,10),T(v.x,y+.65*sc,v.z),CYL);
      r.add(new THREE.TorusGeometry(.60*sc,.05,4,10),T(v.x,y+1.29*sc,v.z,Math.PI/2,0,0),CYL,true);
    };
    const whip=(v,sc)=>{
      r.add(new THREE.CylinderGeometry(.035,.020,(2.1+rnd(51)*1.7)*sc,5),T(v.x,y+1.3*sc,v.z),CYL);
      r.add(new THREE.BoxGeometry(.26*sc,.10*sc,.26*sc),T(v.x,y+.05*sc,v.z));
    };
    const dipole=(v,sc)=>{
      const h=(2.0+rnd(52)*1.2)*sc;
      r.add(new THREE.CylinderGeometry(.045,.030,h,5),T(v.x,y+h/2,v.z),CYL);
      for(let q=0;q<2;q++)
        r.add(new THREE.BoxGeometry(.90*sc,.04,.04),T(v.x,y+h*(.66+q*.22),v.z,0,q?1.05:0,0));
    };
    const dish=(v,sc)=>{
      r.add(new THREE.CylinderGeometry(.07,.07,.95*sc,6),T(v.x,y+.47*sc,v.z),CYL);
      r.add(new THREE.CylinderGeometry(.52*sc,.52*sc,.07,12),T(v.x,y+1.05*sc,v.z,-.75,rnd(53)*6.28,0),CYL);
    };
    const mast=(v,sc)=>{
      const h=(3.2+rnd(54)*1.8)*sc;
      r.add(new THREE.CylinderGeometry(.075,.055,h,6),T(v.x,y+h/2,v.z),CYL);
      r.add(new THREE.BoxGeometry(.34,.10,.34),T(v.x,y+.05,v.z));
      r.add(new THREE.BoxGeometry(.62*sc,.05,.05),T(v.x,y+h*.78,v.z,0,rnd(55)*3,0));
    };

    const kit=[vent,louvre,defl,pipes,cond,hatch,tank,whip,dipole,dish];
    if(small){
      if(span<1.6)continue;
      const nb=1+((rnd(2)*1.9)|0);                             // 1-2 дрібниці
      const sc=Math.max(.55,Math.min(1,span/4.2));
      for(let k=0;k<nb;k++){
        const v=spot(9+k*13,.55*sc+.2);
        if(!v)continue;
        const pick=rnd(70+k*5);
        if(pick<.30)vent(v,sc);
        else if(pick<.50)pipes(v,sc);
        else if(pick<.66)hatch(v,sc);
        else if(pick<.80)louvre(v,sc);
        else if(pick<.92)whip(v,sc);
        else defl(v,sc);
      }
      continue;
    }
    if(span<3.0)continue;
    // вихід на дах: надбудова на великих, люк на середніх
    const ex=spot(1,span>7?1.6:1.0);
    if(ex){ if(span>7&&rnd(80)<.72)stair(ex,1); else hatch(ex,1); }
    // основний набір
    const nv=2+((rnd(3)*3.4)|0);
    for(let k=0;k<nv;k++){
      const v=spot(40+k*7,1.0);
      if(!v)continue;
      kit[(rnd(90+k*3)*7)|0](v,1);
    }
    if(rnd(4)<.55){const b3=spot(120,1.1);if(b3)tank(b3,1);}
    if(rnd(5)<.42){const m2=spot(150,1.4);if(m2)mast(m2,1);}
    const na=1+((rnd(7)*1.9)|0);
    for(let k=0;k<na;k++){
      const a2=spot(200+k*11,.6);
      if(!a2)continue;
      if(rnd(210+k)<.62)whip(a2,1); else dipole(a2,1);
    }
  }
  const bk=r.bake();
  const g=new THREE.Group();
  /* власні матеріали (не з кешу): дах перефарбовується під денну/нічну оптику */
  const fm=new THREE.MeshBasicMaterial({color:0x02180c,transparent:true,opacity:.9,side:THREE.DoubleSide});
  fm.polygonOffset=true;fm.polygonOffsetFactor=1.6;fm.polygonOffsetUnits=1.6;
  const em=new THREE.LineBasicMaterial({color:color==null?0x1f8f4a:color,transparent:true,opacity:.85});
  if(bk.f)g.add(new THREE.Mesh(bk.f,fm));
  if(bk.e)g.add(new THREE.LineSegments(bk.e,em));
  return {group:g,parts:{fill:fm,edge:em}};
}

/* ───────────────────────── РАКЕТНИЙ ПАРК ─────────────────────────
   Реальні пропорції (метри), ніс у +Z. Кожен тип — власна конструкція:
   ТРД-КР із висувним повітрозабірником, гранений stealth-корпус, аеробалістика

/* оживальний ніс: стос конусів зі спадним радіусом — м'який обвід замість гострого конуса */
function ogive(r,R0,len,z0,seg){
  const n=seg||4;
  for(let i=0;i<n;i++){
    const t0=i/n,t1=(i+1)/n;
    const r0=R0*Math.sqrt(1-t0*t0*.92), r1=R0*Math.sqrt(1-t1*t1*.92);
    r.add(new THREE.CylinderGeometry(r1,r0,len/n,10),T(0,0,z0+len*(t0+t1)/2,Math.PI/2,0,0),CYL);
  }
}
/* пояс технологічних швів по корпусу */
function seams(r,R,z0,z1,n){
  for(let i=0;i<(n||3);i++){
    const z=z0+(z1-z0)*(i+.5)/(n||3);
    r.add(new THREE.TorusGeometry(R*1.005,R*.028,4,12),T(0,0,z),CYL,true);
  }
}
