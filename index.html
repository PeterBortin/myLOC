/* ── ІСТОРІЯ ТРЕКІВ (55_history.js) ──────────────────────────────────
   Слід цілі на куполі бере точки САМЕ звідси: drawTrack питає
   histPts('m'+id). Без цього модуля траєкторій немає взагалі —
   лишаються голі позначки. Пишемо в системі спостерігача: азимут,
   дальність, висота відносно точки, де стоїть людина. */
/* ── 55_history.js ── */
/* ============================================================
   Історія прольотів за добу
   ───────────────────────────────────────────────────────────
   Все зберігається В МІСЦЕВІЙ СИСТЕМІ СПОСТЕРІГАЧА, а не в сирих
   координатах: азимут, дальність і висота відносно точки, де стоїть
   людина. Саме це вона й хоче знати — «що і звідки летіло на мене»,
   а не абстрактні широти.

   Точки прорідені: нова пишеться, коли ціль пройшла помітну відстань
   або минуло достатньо часу. Інакше за добу набіжать сотні тисяч
   записів і localStorage помре.
   ============================================================ */

const HIST = {
  tracks: new Map(),      // id → { id, type, title, first, last, pts[], closest }
  loaded: false,
  dirty: false,
  lastSave: 0
};
try { window.HIST = HIST; } catch (e) { }

const HIST_HOURS = 24;
const HIST_MAX_TRACKS = 400;
const HIST_MIN_MOVE_M = 400;      // менший зсув не пишемо
const HIST_MIN_DT_MS = 20000;     // і не частіше ніж раз на 20 с
const HIST_KEY = 'nbk.hist.v1';

/** Точка історії: час, азимут, дальність, висота, швидкість */
function histPush(id, meta, pt) {
  let tr = HIST.tracks.get(id);
  if (!tr) {
    tr = {
      id, type: meta.typeId || 'unknown', title: meta.title || '',
      src: meta.src || 'мапа',
      first: pt.t, last: pt.t, pts: [], closest: null
    };
    HIST.tracks.set(id, tr);
  }
  const prev = tr.pts[tr.pts.length - 1];
  if (prev) {
    const dt = pt.t - prev.t;
    // прорідження: або відчутно зрушила, або давно не писали
    const moved = Math.abs(pt.d - prev.d) +
      Math.abs(norm180(pt.a - prev.a)) * Math.PI / 180 * Math.max(pt.d, 1);
    if (dt < HIST_MIN_DT_MS && moved < HIST_MIN_MOVE_M) return;
  }
  tr.pts.push(pt);
  tr.last = pt.t;
  if (tr.pts.length > 240) tr.pts.splice(0, tr.pts.length - 240);
  if (!tr.closest || pt.d < tr.closest.d) tr.closest = { d: pt.d, a: pt.a, t: pt.t };
  HIST.dirty = true;
}

/** Записуємо і мережеві треки, і власні оптичні цілі */
function histStep() {
  const nowMs = Date.now();
  if (FEED.on) {
    for (const it of FEED.items) {
      if (it.az == null || it.ground == null) continue;
      if (it.civil) continue;                      // цивільні борти в історію загроз не пишемо
      /* Непевний трек — здогад, а не подія. У добовій історії він виглядав би
         як факт «тут літало», і назавтра ми б самі собі брехали. */
      if (it.loose) continue;
      histPush('m' + it.id, {
        typeId: it.typeId, title: it.title,
        src: (it.sources && it.sources.length ? it.sources.join('+') : it.src || 'мережа')
      }, {
        t: nowMs, a: +it.az.toFixed(1), d: Math.round(it.ground),
        h: it.alt, v: it.speedKmh ? Math.round(it.speedKmh) : null,
        e: +it.el.toFixed(1)
      });
    }
  }
  for (const t of S.targets) {
    if (!t.est || !t.der) continue;
    histPush('c' + t.id, { typeId: t.typeId, title: t.typeName, src: 'камера' }, {
      t: nowMs, a: +t.az.toFixed(1), d: Math.round(t.est.r),
      h: Math.round(t.der.alt), v: Math.round(t.der.speedKmh), e: +t.el.toFixed(1)
    });
  }
  histPrune();
  if (HIST.dirty && now() - HIST.lastSave > 15000) histSave();
}

function histPrune() {
  const cut = Date.now() - HIST_HOURS * 3600e3;
  for (const [id, tr] of HIST.tracks) {
    if (tr.last < cut) { HIST.tracks.delete(id); HIST.dirty = true; continue; }
    if (tr.pts[0] && tr.pts[0].t < cut) {
      tr.pts = tr.pts.filter(p => p.t >= cut);
      if (!tr.pts.length) HIST.tracks.delete(id);
      HIST.dirty = true;
    }
  }
  if (HIST.tracks.size > HIST_MAX_TRACKS) {
    const old = [...HIST.tracks.values()].sort((a, b) => a.last - b.last);
    for (let i = 0; i < old.length - HIST_MAX_TRACKS; i++) HIST.tracks.delete(old[i].id);
  }
}

function histSave() {
  try {
    const out = [...HIST.tracks.values()].map(tr => ({
      i: tr.id, y: tr.type, n: tr.title, s: tr.src,
      p: tr.pts.map(p => [p.t, p.a, p.d, p.h, p.v, p.e])
    }));
    localStorage.setItem(HIST_KEY, JSON.stringify(out));
    HIST.dirty = false; HIST.lastSave = now();
  } catch (e) {
    // сховище переповнене — ріжемо найстаріше і пробуємо ще раз
    const old = [...HIST.tracks.values()].sort((a, b) => a.last - b.last);
    for (let i = 0; i < Math.ceil(old.length / 3); i++) HIST.tracks.delete(old[i].id);
    try { histSave(); } catch (e2) { HIST.dirty = false; }
  }
}

function histLoad() {
  HIST.loaded = true;
  try {
    const raw = localStorage.getItem(HIST_KEY);
    if (!raw) return;
    const cut = Date.now() - HIST_HOURS * 3600e3;
    for (const tr of JSON.parse(raw)) {
      const pts = (tr.p || []).filter(p => p[0] >= cut)
        .map(p => ({ t: p[0], a: p[1], d: p[2], h: p[3], v: p[4], e: p[5] }));
      if (!pts.length) continue;
      let closest = null;
      for (const p of pts) if (!closest || p.d < closest.d) closest = { d: p.d, a: p.a, t: p.t };
      HIST.tracks.set(tr.i, {
        id: tr.i, type: tr.y, title: tr.n, src: tr.s,
        first: pts[0].t, last: pts[pts.length - 1].t, pts, closest
      });
    }
  } catch (e) { }
}
function histClear() {
  HIST.tracks.clear();
  try { localStorage.removeItem(HIST_KEY); } catch (e) { }
  HIST.dirty = false;
}

/* ---------- вибірки ---------- */

/** Треки, які проходили ближче за radiusM, від найновіших */
function histList(radiusM, sinceMs) {
  const r = radiusM || 1e9, since = sinceMs || 0;
  return [...HIST.tracks.values()]
    .filter(tr => tr.last >= since && tr.closest && tr.closest.d <= r)
    .sort((a, b) => b.last - a.last);
}

/** Скільки треків було активно в кожному кошику часу — для смуги таймлайну */
function histDensity(bins, spanMs) {
  const end = Date.now(), span = spanMs || HIST_HOURS * 3600e3;
  const start = end - span, step = span / bins;
  const out = new Array(bins).fill(0);
  const near = new Array(bins).fill(1e9);
  for (const tr of HIST.tracks.values()) {
    for (const p of tr.pts) {
      if (p.t < start) continue;
      const i = Math.min(bins - 1, Math.floor((p.t - start) / step));
      out[i]++;
      if (p.d < near[i]) near[i] = p.d;
    }
  }
  return { counts: out, nearest: near, start, step };
}

/** Стан усіх треків на заданий момент — для відтворення */
function histAt(tMs, windowMs) {
  const w = windowMs || 120000;
  const out = [];
  for (const tr of HIST.tracks.values()) {
    if (tr.first > tMs || tr.last < tMs - w) continue;
    // найближча за часом точка
    let best = null, bd = Infinity;
    for (const p of tr.pts) {
      const d = Math.abs(p.t - tMs);
      if (d < bd) { bd = d; best = p; }
    }
    if (!best || bd > w) continue;
    const cat = NBK.catalogById(tr.type);
    out.push({
      id: tr.id, title: tr.title || cat.name, typeId: tr.type, src: tr.src,
      az: best.a, ground: best.d, alt: best.h, el: best.e,
      speedKmh: best.v, ageSec: bd / 1000,
      pts: tr.pts, replay: true
    });
  }
  return out;
}

/** Точки одного треку — для шлейфа на куполі */
function histPts(id) { const tr = HIST.tracks.get(id); return tr ? tr.pts : null; }

/** Коротке зведення по треку для списку */
function histSummary(tr) {
  const cat = NBK.catalogById(tr.type);
  const dur = Math.round((tr.last - tr.first) / 1000);
  let vmax = 0;
  for (const p of tr.pts) if (p.v && p.v > vmax) vmax = p.v;
  return {
    name: tr.title || cat.name,
    src: tr.src,
    closestM: tr.closest ? tr.closest.d : null,
    closestAz: tr.closest ? tr.closest.a : null,
    at: tr.closest ? tr.closest.t : tr.last,
    durSec: dur, points: tr.pts.length, speedKmh: vmax || null
  };
}

/* ═══ ЧОРНА СКРИНЬКА ══════════════════════════════════════════════════ */
const BB = { items: [], max: 1500, saveT: 0, dirty: false };
const BB_KEY = 'nbk.bb.v1';
function bbLog(kind, text, data) {
  const e = { t: Date.now(), k: kind, m: String(text || '') };
  if (data !== undefined) { try { e.d = JSON.parse(JSON.stringify(data)); } catch (err) { } }
  BB.items.push(e);
  if (BB.items.length > BB.max) BB.items.splice(0, BB.items.length - BB.max);
  BB.dirty = true;
  const nowMs = Date.now();
  if (nowMs - BB.saveT > 30000) bbSave();
  return e;
}
function bbSave() {
  try {
    BB.saveT = Date.now(); BB.dirty = false;
    localStorage.setItem(BB_KEY, JSON.stringify({ t: BB.saveT, items: BB.items.slice(-600) }));
  } catch (e) { }
}
function bbLoad() {
  try {
    const d = JSON.parse(localStorage.getItem(BB_KEY) || 'null');
    if (d && Array.isArray(d.items)) { BB.items = d.items.concat(BB.items); return d.items.length; }
  } catch (e) { }
  return 0;
}
function bbText() {
  const p = n => String(n).padStart(2, '0');
  const ts = t => { const x = new Date(t); return x.getFullYear() + '-' + p(x.getMonth() + 1) + '-' + p(x.getDate()) + ' ' + p(x.getHours()) + ':' + p(x.getMinutes()) + ':' + p(x.getSeconds()); };
  const head = ['ЖУЙКА · чорна скринька · ' + new Date().toISOString(),
    'записів ' + BB.items.length + ' · голос ' + (S.set.voice === false ? 'вимк' : 'увімк'),
    ''];
  return head.concat(BB.items.map(e => ts(e.t) + '  [' + e.k + ']  ' + e.m + (e.d !== undefined ? '  ' + JSON.stringify(e.d) : ''))).join('\n');
}
function bbExport() {

  bbSave();
  download('zhuika_blackbox_' + stamp() + '.txt', bbText(), 'text/plain;charset=utf-8');
  toast('чорна скринька збережена: ' + BB.items.length + ' записів', 'good', 3000);
}

/* ═══ ГОЛОС ═══════════════════════════════════════════════════════════
   speechSynthesis працює офлайн (голоси лежать у телефоні), але має дві
   пастки: на iOS перше мовлення мусить початись у дотику — тому ми
   «розбуджуємо» його порожньою фразою на стартовому екрані; і подія
   кінця мовлення часом не приходить — тому черга живе за власним
   таймером, а не чекає на браузер. */
const VOICE = { q: [], busy: false, last: new Map(), primed: false, voice: null, said: [], n: 0, tmr: 0 };
function voiceOn() { return S.set.voice !== false && typeof speechSynthesis !== 'undefined'; }
function voicePick() {
  try {
    const vs = speechSynthesis.getVoices() || [];
    VOICE.voice = vs.find(v => /^uk/i.test(v.lang)) || null;
  } catch (e) { VOICE.voice = null; }
}
function voicePrime() {
  if (VOICE.primed || typeof speechSynthesis === 'undefined') return;
  VOICE.primed = true;
  try {
    voicePick();
    if (typeof speechSynthesis.addEventListener === 'function') speechSynthesis.addEventListener('voiceschanged', voicePick);
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0.01; u.lang = 'uk-UA';
    speechSynthesis.speak(u);
  } catch (e) { }
}
/**
 * Сказати фразу. key + gapMs — антидубль: ту саму подію не повторюємо
 * частіше, ніж раз на gapMs. prio 1 — перебиває чергу (балістика,
 * НЕБЕЗПЕЧНО): коли часу немає, ввічливість — розкіш.
 * Кожна фраза лягає у VOICE.said і в чорну скриньку незалежно від того,
 * чи телефон справді її озвучив: так це видно і в тестах, і в розборі.
 */
function say(text, o) {
  o = o || {};
  const nowMs = Date.now();
  if (o.key) {
    const t0 = VOICE.last.get(o.key) || 0;
    if (nowMs - t0 < (o.gapMs == null ? 20000 : o.gapMs) && !o.force) return false;
    VOICE.last.set(o.key, nowMs);
  }
  VOICE.said.push({ t: nowMs, text, key: o.key || '', prio: o.prio || 0 });
  if (VOICE.said.length > 200) VOICE.said.splice(0, VOICE.said.length - 200);
  bbLog('голос', text);
  if (!voiceOn()) return false;
  if (o.prio >= 1) { VOICE.q = []; try { speechSynthesis.cancel(); } catch (e) { } VOICE.busy = false; clearTimeout(VOICE.tmr); }
  VOICE.q.push({ text, prio: o.prio || 0 });
  if (VOICE.q.length > 6) VOICE.q.splice(0, VOICE.q.length - 6);   // краще сказати свіже, ніж усе
  voicePump();
  return true;
}
/* iOS присипляє синтез разом зі сторінкою і не завжди будить сам —
   повернення на екран будить його явно. */
try {
  if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && typeof speechSynthesis !== 'undefined') { try { speechSynthesis.resume(); } catch (e) { } }
  });
} catch (e) { }
/** Чи є в телефоні український голос — для самоперевірки і підказки в налаштуваннях */
function voiceStatus() {
  if (typeof speechSynthesis === 'undefined') return { has: false, uk: false, note: 'синтезу мови немає' };
  if (!VOICE.voice) voicePick();
  return { has: true, uk: !!VOICE.voice, note: VOICE.voice ? VOICE.voice.name + ' (' + VOICE.voice.lang + ')' : 'українського голосу не знайдено — системний' };
}
function voicePump() {
  if (VOICE.busy || !VOICE.q.length) return;
  const it = VOICE.q.shift();
  VOICE.busy = true; VOICE.n++;
  const done = () => { clearTimeout(VOICE.tmr); VOICE.busy = false; setTimeout(voicePump, 250); };
  try {
    const u = new SpeechSynthesisUtterance(it.text);
    u.lang = 'uk-UA'; u.rate = 1.0; u.pitch = 1.0; u.volume = 1;
    if (VOICE.voice) u.voice = VOICE.voice;
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
    // страховка: подія кінця не прийшла — черга йде далі за таймером
    VOICE.tmr = setTimeout(done, Math.min(14000, 1500 + it.text.length * 90));
  } catch (e) { done(); }
}

  [/kalibr/i, 'калібр'], [/iskander/i, 'іскандер'], [/kinzhal/i, 'кинджал'],
  [/onyx|oniks/i, 'онікс'], [/tsirkon|zircon/i, 'циркон'],
  [/kh-?\s*101|x-?\s*101/i, 'крилата ракета'], [/kh-?\s*55/i, 'крилата ракета'],
  [/kh-?\s*59|kh-?\s*69/i, 'керована ракета'], [/kh-?\s*31|kh-?\s*22|kh-?\s*32/i, 'протикорабельна ракета'],
  [/kab|umpk|фаб/i, 'керована авіабомба'], [/grom/i, 'грім'],
  [/^x-?\s*\d/i, 'ракета'], [/^kh-?\s*\d/i, 'ракета']
];
/* Кириличні скорочення синтез читає як слова: «каб», «бпла». Розгортаємо. */
/* \b у JS рахує межу слова тільки по латиниці, тож для кирилиці межу
   пишемо явно: далі не має йти літера. */
const VOICE_ABBR = [
  [/^(каб|фаб)(?![а-яіїєґ])|умпк/i, 'керована авіабомба'],
  [/^бпла(?![а-яіїєґ])/i, 'безпілотник'],
  [/^кр(?![а-яіїєґ])/i, 'крилата ракета'],
  [/^бр(?![а-яіїєґ])/i, 'балістична ракета'],
  [/^зрк(?![а-яіїєґ])/i, 'зенітний комплекс'],
  [/^рбк(?![а-яіїєґ])/i, 'касетна бомба']
];
function voiceShort(name) {
  if (!name) return null;
  let t = String(name);
  const m = t.match(/«([^»]+)»/);
  if (m) t = m[1];
  t = t.split('(')[0].split('/')[0].replace(/[«»]/g, '').trim();
  if (!t) return null;
  /* Кирилицю читаємо як є, тире прибираємо — інакше синтез робить із нього
     паузу посеред назви. */
  if (/[а-яіїєґ]/i.test(t)) {
    for (const [re, say] of VOICE_ABBR) if (re.test(t)) return say;
    return t.replace(/[-–—]+/g, ' ').replace(/\s+/g, ' ').trim();
  }
  for (const [re, say] of VOICE_LAT) if (re.test(t)) return say;
  return null;
}
function voiceType(it) {
  return VOICE_TYPE[it.typeId] || voiceShort(it.typeName) || voiceShort(it.title)
    || (it.known ? 'ціль' : 'невідома ціль');
}
/** Висота з таблиці ТТХ — оцінка, і в голосі вона звучить як оцінка. */
function voiceAlt(m) {
  if (!m || !isFinite(m)) return '';
  const r = m < 1000 ? Math.round(m / 50) * 50 : Math.round(m / 100) * 100;
  return 'висота близько ' + r + ' метрів';
}
/** хвилина / хвилини / хвилин — синтез не відмінює сам */
function minWord(n) {
  const a = n % 100, b = n % 10;
  if (a >= 11 && a <= 14) return 'хвилин';
  if (b === 1) return 'хвилина';
  if (b >= 2 && b <= 4) return 'хвилини';
  return 'хвилин';
}
function voiceKm(m) {
  if (m == null || !isFinite(m)) return '';
  if (m < 1000) return Math.round(m / 100) * 100 + ' метрів';
  const km = m / 1000;
  return (km < 10 ? Math.round(km) : Math.round(km / 5) * 5) + ' кілометрів';
}
function voiceMin(s) {
  if (s == null || !isFinite(s)) return '';
  if (s < 45) return 'менше хвилини';
  const m = Math.round(s / 60);
  return 'приблизно ' + m + ' ' + minWord(m);
}

/** Скільки часу до підльоту, якщо ціль іде на нас за поточною швидкістю зближення */
function etaSec(it) {
  if (!it || it.ground == null) return null;
  if (it.closing != null && it.closing > 3) return clamp(it.ground / it.closing, 0, 3600);
  if (it.tcpa != null && it.dcpa != null && it.dcpa < 3000 && it.tcpa > 0) return clamp(it.tcpa, 0, 3600);
  return null;
}
/** Слово дії для цивільного: єдине, що йому справді треба знати */
function actionWord(it) {
  if (!it) return '';
  const lvl = it.threat ? it.threat.level : 0;
  const eta = etaSec(it);
  if (lvl >= 3) return 'В УКРИТТЯ';
  if (lvl === 2 || (eta != null && eta < 600)) return 'В УКРИТТЯ';
  if (eta != null) return 'ЗБИРАЙСЯ';
  if (it.closing != null && it.closing < -1) return 'ВІДХОДИТЬ';
  return 'МИМО';
}

/* Одна мова для всіх: тип, звідки, скільки кілометрів, і — якщо йде на нас —
   скільки часу. Азимут у градусах стоїть на екрані; у голосі він зайвий. */
function phraseNew(it) {
  const eta = etaSec(it);
  return voiceType(it) + ' з ' + voiceDir(it.az) + ', ' + voiceKm(it.ground) +
    (eta != null ? ', курс на вас, ' + voiceMin(eta) : ', проходить мимо') + '.';
}
function phraseMany(list) {
  const types = [...new Set(list.map(voiceType))].slice(0, 3);
  const dirs = [...new Set(list.map(it => voiceDir(it.az)))].slice(0, 3);
  const near = list.slice().sort((a, b) => a.ground - b.ground)[0];
  const etas = list.map(etaSec).filter(v => v != null);
  const eta = etas.length ? Math.min(...etas) : null;
  const n = list.length;
  const a = n % 100, b = n % 10;
  const noun = (a >= 11 && a <= 14) ? 'цілей' : b === 1 ? 'ціль' : (b >= 2 && b <= 4) ? 'цілі' : 'цілей';
  const word = n === 2 ? 'дві цілі' : n + ' ' + noun;
  return word + ': ' + types.join(', ') + ' з ' + dirs.join(' і ') + '. Найближча ' + voiceKm(near.ground) +
    (eta != null ? '. Курс на вас, ' + voiceMin(eta) : '. Поки мимо') + '.';
}
function phraseThreat(it, lvl) {
  const eta = etaSec(it);
  if (lvl >= 3) return 'Небезпечно! ' + voiceType(it) + ' іде на вас. В укриття негайно!';
  return 'Увага! ' + voiceType(it) + ', курс на вас, ' + (eta != null ? voiceMin(eta) : 'зближується') + '. Ідіть в укриття.';
}

/* ═══ ЩО КАЗАТИ І КОЛИ ═══════════════════════════════════════════════
   Нова підтверджена ціль → одна фраза. Кілька нових за кілька секунд →
   ОДНА зведена фраза, а не п'ять поспіль: під час нальоту голос, який не
   замовкає, перестають слухати. Ріст загрози → фраза негайно, з перебиванням.
   Усі зникли → «чисто», один раз. Непевні треки голос не озвучує взагалі. */
const ANN = { seen: new Map(), pending: [], pendingT: 0, lastNewT: 0, hadTargets: false, clearT: 0, bootT: 0 };
const ANN_GATHER_MS = 4000, ANN_GAP_MS = 20000;
function annTick(nowMs) {
  if (!ANN.bootT) ANN.bootT = nowMs;
  const list = FEED.on ? FEED.items.filter(i => !i.loose && !i.civil && !i.areaOnly && !i.fromText && !i.fromSnapshot && i.ground != null) : [];
  for (const it of list) {
    const rec = ANN.seen.get(it.id);
    const lvl = it.threat ? it.threat.level : 0;
    if (!rec) {
      ANN.seen.set(it.id, { lvl, t: nowMs });
      ANN.pending.push(it.id); if (!ANN.pendingT) ANN.pendingT = nowMs;
      bbLog('ціль', 'нова підтверджена: ' + (it.typeName || '?') + ' · ' + NBK.fmtDist(it.ground) + ' · ' + NBK.fmtAz(it.az), { id: it.id, why: it.trustWhy });
    } else {
      rec.t = nowMs;
      if (lvl > rec.lvl && lvl >= 2) {
        rec.lvl = lvl;
        say(phraseThreat(it, lvl), { key: 'lvl' + lvl + ':' + it.id, gapMs: 60000, prio: 1 });
        if (lvl >= 3) vibro([200, 80, 200, 80, 400]); else vibro([120, 60, 120]);
        bbLog('загроза', (lvl >= 3 ? 'НЕБЕЗПЕЧНО' : 'УВАГА') + ': ' + (it.typeName || '?') + ' · ' + NBK.fmtDist(it.ground) + ' · ETA ' + Math.round(etaSec(it) || 0) + ' с', { id: it.id });
      } else if (lvl < rec.lvl) rec.lvl = lvl;
    }
  }
  for (const [id, rec] of ANN.seen) if (nowMs - rec.t > 600000) ANN.seen.delete(id);

  /* Зведення нових — після короткої паузи збирання і не частіше, ніж раз на
     20 с. Перші секунди після старту картина ще складається: те, що вже
     летіло, озвучується одною зведеною фразою, а не по одній на позначку. */
  if (ANN.pending.length && nowMs - ANN.pendingT >= ANN_GATHER_MS && nowMs - ANN.lastNewT >= ANN_GAP_MS && nowMs - ANN.bootT > 3000) {
    const fresh = ANN.pending.map(id => list.find(i => i.id === id)).filter(Boolean);
    ANN.pending = []; ANN.pendingT = 0;
    if (fresh.length) {
      ANN.lastNewT = nowMs;
      const worst = Math.max(...fresh.map(i => i.threat ? i.threat.level : 0));
      say(fresh.length === 1 ? phraseNew(fresh[0]) : phraseMany(fresh), { key: 'new', gapMs: 0, prio: worst >= 2 ? 1 : 0 });
    }
  }
  // чисто
  if (list.length) { ANN.hadTargets = true; ANN.clearT = 0; }
  else if (ANN.hadTargets) {
    if (!ANN.clearT) ANN.clearT = nowMs;
    else if (nowMs - ANN.clearT > 20000) {
      ANN.hadTargets = false; ANN.clearT = 0;
      say('Цілей поблизу немає.', { key: 'clear', gapMs: 60000 });
      bbLog('ціль', 'цілей у радіусі немає');
    }
  }
}

/* ═══ БАЛІСТИКА ═══════════════════════════════════════════════════════
   Балістика летить хвилини, і жодна геометрія зближення тут не встигне —
   сигнал має бути негайним. Але негайний сигнал на порожньому небі коштує
   дорожче за мовчання: людину, яку двічі підняли даремно, за третім разом
   уже не підняти. Тому підстава — лише одна з двох:

     · ТРЕК балістичного сімейства в радіусі даних. Довіра тут не важить:
       хвилина в укритті дешевша за пропуск;
     · ПОВІДОМЛЕННЯ, яке проходить УСІ чотири умови нижче.

   Скарга з поля 7 вересня: «сигналізація балістики при запуску, а тривоги
   по балістиці на той момент немає». Розібрано чотири причини, і кожної
   вистачало окремо:
     1. мітка часу. «2026-09-07 21:35:00» Safari не парсить, і стара версія
        підставляла поточний час — уся історія (двісті повідомлень за
        кілька годин) ставала «щойно». Виправлено в msgTime (53_messages);
     2. історія при запуску. Перша пачка описує МИНУЛЕ, ми не бачили, як
        вона приходила. Тепер текст із неї сам тривоги не піднімає;
     3. згадка ≠ загроза. «Балістика» у звіті, підсумку чи спогаді
        («станом на», «наслідки», «нагадуємо») — не привід гнати в укриття;
     4. слово без світу. Балістику оголошують під час повітряної тривоги.
        Немає тривоги в нашій області і немає треку — значить це або чужий
        регіон, або вчорашнє. Виняток один: офіційний канал (ПС ЗСУ) у
        повідомленні, яке ми бачили ЖИВИМ.

   Сигнал тримається, поки є підстава, і ще 3 хвилини після. Скидається
   сам; голос повторює раз на 90 с. Свіжіший «відбій» знімає одразу. */
const BAL = { on: false, since: 0, lastBasis: 0, why: '', saidT: 0, n: 0 };
const BAL_WORDS = /баліст|іскандер|искандер|кинджал|кинжал|кн-?23|kn-?23|балл?истик|циркон|онікс|оникс|х-?47|3м22|швидкісн[а-яіїєґ]*\s+ціл|гіперзвук/i;
/* Текст про минуле: звіт, підсумок, наслідки, спогад, відбій */
const BAL_PAST = /відбій|минул|знято|скасов|нагадуємо|станом на|підсумк|за добу|за ніч|учора|вчора|позавчора|повідомлял|раніше|наслідк|влучанн|не фіксу|немає загроз|не зафіксован/i;
const BAL_OFF = /відбій|минула|знято|скасов|немає загроз|не фіксу/i;
const BAL_MSG_MS = 5 * 60000;

/** Чи стосується повідомлення нас; placed — чи взагалі названо місце */
function balMsgNear(m, me) {
  const t = m.text;
  const inBox = box => me && me.lat >= box[0] && me.lat <= box[1] && me.lon >= box[2] && me.lon <= box[3];
  const boxes = (typeof msgOblastBoxes === 'function') ? msgOblastBoxes(t)
    : ((typeof msgOblastBox === 'function' && msgOblastBox(t)) ? [msgOblastBox(t)] : []);
  const parts = (typeof msgPartBoxes === 'function') ? msgPartBoxes(t) : [];
  if (!m.parsed && typeof msgParse === 'function') m.parsed = msgParse(t, me);
  const pt = m.parsed && (m.parsed.to || m.parsed.at);
  const placed = !!(boxes.length || parts.length || pt);
  if (!me) return { near: true, why: 'позиція невідома', placed };
  if (boxes.some(inBox)) return { near: true, why: 'наша область', placed };
  if (parts.some(inBox)) return { near: true, why: 'наша частина країни', placed };
  if (pt) {
    const d = NBK.gcBearingDist(me.lat, me.lon, pt.lat, pt.lon).dist;
    return { near: d < 120000, why: pt.nm + (d < 120000 ? '' : ' — далеко'), placed };
  }
  if (placed) return { near: false, why: 'інша область', placed };
  return { near: true, why: 'без уточнення місця', placed };
}

/** Чи є ЗАРАЗ повітряна тривога там, де ми */
function balAlertHere() {
  if (typeof ALERTS === 'undefined') return false;
  if (ALERTS.oblast) return !!ALERTS.mine;
  // області не знаємо (немає геопозиції) — тоді підтвердженням є будь-яка активна тривога
  return !!(ALERTS.active && ALERTS.active.length);
}

function balBasis(nowMs) {
  if (FEED.on) {
    const trk = FEED.items.find(i => !i.ended && !i.fromText && (typeof typeFamily === 'function' ? typeFamily(i.typeId) : '') === 'ballistic');
    if (trk) return 'трек балістики за ' + NBK.fmtDist(trk.ground) + ' · ' + (trk.sources ? trk.sources.join('+') : trk.src) + (trk.loose ? ' · непевний' : '');
  }
  const me = myPos();
  const alertHere = balAlertHere();
  const msgs = (typeof MSGS !== 'undefined' && MSGS.items) || [];
  const age = m => (typeof msgAgeMs === 'function') ? msgAgeMs(m, nowMs) : (nowMs - m.t);
  for (const m of msgs) {                       // найновіші першими
    if (age(m) > BAL_MSG_MS) break;
    if (!BAL_WORDS.test(m.text)) continue;
    if (BAL_OFF.test(m.text)) return null;      // свіжіше за будь-яку підставу
    if (m.tSure === false) continue;            // час невідомий — не знаємо, чи це зараз
    if (BAL_PAST.test(m.text)) continue;        // звіт про минуле, а не загроза
    const n = balMsgNear(m, me);
    if (!n.near) continue;
    const live = m.history === false;           // ми бачили, як воно прийшло
    if (!alertHere && !(m.official && live)) continue;
    return 'повідомлення ' + (m.official ? 'ПС ЗСУ' : (m.channel || 'каналу')) + ' · ' + n.why +
      ' · ' + (alertHere ? 'тривога в області' : 'офіційно') + ' · «' + m.text.slice(0, 60) + '»';
  }
  return null;
}
function balTick(nowMs) {
  const basis = balBasis(nowMs);
  if (basis) { BAL.lastBasis = nowMs; BAL.why = basis; }
  const active = !!basis || (BAL.lastBasis && nowMs - BAL.lastBasis < 180000);
  if (active && !BAL.on) {
    BAL.on = true; BAL.since = nowMs; BAL.n++;
    vibro([400, 120, 400, 120, 400]);
    say('БАЛІСТИКА! В укриття негайно!', { key: 'bal', gapMs: 0, prio: 1, force: true });
    BAL.saidT = nowMs;
    bbLog('БАЛІСТИКА', 'сигнал увімкнено: ' + BAL.why);
  } else if (active && BAL.on && nowMs - BAL.saidT > 90000) {
    BAL.saidT = nowMs;
    say('Балістика. Лишайтесь в укритті.', { key: 'bal-again', gapMs: 60000, prio: 1 });
  } else if (!active && BAL.on) {
    BAL.on = false;
    say('Загрозу балістики знято.', { key: 'bal-off', gapMs: 30000 });
    bbLog('БАЛІСТИКА', 'сигнал знято');
  }
  balBand();
}
function balBand() {
  const el = $('#bal');
  if (!el) return;
  if (!BAL.on) { if (!el.hidden) el.hidden = true; return; }
  el.hidden = false;
  const s = Math.round((Date.now() - BAL.since) / 1000);
  const why = el.querySelector('.why');
  if (why) why.textContent = BAL.why + ' · ' + (s < 60 ? s + ' с' : Math.round(s / 60) + ' хв');
}

/* ═══ СТОРОЖ ══════════════════════════════════════════════════════════
   Живе в окремому setInterval: якщо завмер головний цикл, сторож, що
   сидів би в тому ж циклі, завмер би разом із ним. */
const WD = { loopT: 0, lastTs: -1, stalls: 0, silent: false, oriT: 0, tmr: 0, events: 0 };
function wdCheck() {
  if (!S.running) return;
  const nowMs = Date.now(), tNow = now();
  const hidden = typeof document !== 'undefined' && document.hidden;
  // 1) кадр: видима сторінка, а цикл не тикав 5 с — перезапускаємо ланцюжок
  if (!hidden && WD.loopT && tNow - WD.loopT > 5000) {
    WD.stalls++; WD.events++;
    bbLog('сторож', 'головний цикл завмер на ' + Math.round((tNow - WD.loopT) / 1000) + ' с — перезапуск');
    WD.loopT = tNow;
    try { requestAnimationFrame(loop); } catch (e) { }
    say('Застосунок завис і перезапущений.', { key: 'stall', gapMs: 120000 });
  }
  // 2) джерела мовчать, коли є з чого хвилюватись (тривога, або цілі були)
  if (FEED.on && (typeof navigator === 'undefined' || navigator.onLine !== false)) {
    const danger = (typeof ALERTS !== 'undefined' && ALERTS.mine) || ANN.hadTargets || BAL.on;
    const age = FEED.lastOkT ? tNow - FEED.lastOkT : (S.feedStartT ? tNow - S.feedStartT : 0);
    if (danger && age > 180000) {
      if (!WD.silent) { WD.silent = true; WD.events++; bbLog('сторож', 'джерела мовчать ' + Math.round(age / 60000) + ' хв під час тривоги'); }
      say('Дані мовчать ' + Math.max(3, Math.round(age / 60000)) + ' хвилин. Покладайтесь на сирену і слух.', { key: 'silent', gapMs: 120000 });
    } else if (WD.silent && age < 30000) {
      WD.silent = false;
      bbLog('сторож', 'джерела знову відповідають');
      say('Дані знову надходять.', { key: 'back', gapMs: 60000 });
    }
  }
  // 3) орієнтація: події були і зникли на 10 с
  if (!hidden && typeof ORI !== 'undefined' && ORI.ok && ORI.lastT && tNow - ORI.lastT > 10000) {
    if (nowMs - WD.oriT > 120000) {
      WD.oriT = nowMs; WD.events++;
      bbLog('сторож', 'орієнтація мовчить ' + Math.round((tNow - ORI.lastT) / 1000) + ' с — перезапит');
      try { oriKeepTrying(3); } catch (e) { }
      say('Орієнтація зникла, перезапускаю.', { key: 'ori', gapMs: 120000 });
    }
  }
}
function wdStart() {
  if (WD.tmr) return;
  WD.tmr = setInterval(() => { try { wdCheck(); } catch (e) { } }, 1000);
}

/* ═══ СЛУХ: ГУЛ ДВИГУНА І ВИБУХИ ═════════════════════════════════════
   Мікрофон — єдиний давач, який бачить ціль у РЕАЛЬНОМУ часі без жодного
   сервера. Ми не називаємо тип за звуком (це була б брехня з мікрофона
   телефона), ми кажемо дві чесні речі:
     · «гул» — у спектрі є гребінка рівновіддалених гармонік з кроком
       поршневого двигуна (60–200 Гц) і рівень росте — щось гуде і йде ближче;
     · «вибух» — різкий широкосмуговий сплеск над базовим рівнем.
   Обидва — індикатори з відсотком, не вироки. */
const EAR = { hum: 0, humRaw: 0, level: 0, base: 0, hist: [], trend: 0, up: false, bangT: 0, bangN: 0, humSaidT: 0, humOnT: 0 };
function earSample(a) {
  if (!a || !a.ok) return;
  const nowMs = Date.now();
  const lvl = a.level || 0;
  EAR.level = lvl;
  EAR.hist.push({ t: nowMs, lvl });
  while (EAR.hist.length && nowMs - EAR.hist[0].t > 30000) EAR.hist.shift();
  const olds = EAR.hist.filter(h => nowMs - h.t > 2000).map(h => h.lvl).sort((x, y) => x - y);
  EAR.base = olds.length ? olds[Math.floor(olds.length / 2)] : lvl;
  // вибух: стрибок ≥ 40 над базою, широкосмуговий (пік не домінує), не частіше ніж раз на 3 с
  if (olds.length >= 10 && lvl - EAR.base >= 40 && ((a.peakLvl || 0) - lvl) < 70 && nowMs - EAR.bangT > 3000) {
    EAR.bangT = nowMs; EAR.bangN++;
    bbLog('слух', 'різкий широкосмуговий сплеск: ' + Math.round(lvl) + ' над базою ' + Math.round(EAR.base));
    say('Вибух.', { key: 'bang', gapMs: 15000 });
    vibro([60]);
  }
  // гул: гребінка гармонік із кроком двигуна і достатній рівень
  const h = a.harm;
  const raw = (h && h.spacing >= 60 && h.spacing <= 200 && lvl > 22) ? clamp(h.score, 0, 1) : 0;
  EAR.humRaw = raw;
  EAR.hum += (raw - EAR.hum) * 0.15;
  // тренд рівня за 20 с — нахил прямої, одиниць за секунду
  const pts = EAR.hist.filter(p => nowMs - p.t <= 20000);
  if (pts.length >= 10) {
    const t0 = pts[0].t;
    let sx = 0, sy = 0, sxx = 0, sxy = 0;
    for (const p of pts) { const x = (p.t - t0) / 1000; sx += x; sy += p.lvl; sxx += x * x; sxy += x * p.lvl; }
    const n = pts.length, den = n * sxx - sx * sx;
    EAR.trend = den > 1e-6 ? (n * sxy - sx * sy) / den : 0;
  } else EAR.trend = 0;
  EAR.up = EAR.trend > 0.4;
  if (EAR.hum > 0.6) { if (!EAR.humOnT) { EAR.humOnT = nowMs; bbLog('слух', 'гул двигуна ' + Math.round(EAR.hum * 100) + '% · крок ' + (h ? Math.round(h.spacing) : 0) + ' Гц'); } }
  else if (EAR.hum < 0.4) EAR.humOnT = 0;
  if (EAR.hum > 0.6 && EAR.up && nowMs - EAR.humSaidT > 120000) {
    EAR.humSaidT = nowMs;
    say('Чую гул двигуна, наближається.', { key: 'hum', gapMs: 120000 });
  }
}
/** Рядок для чіпа СЛУХ: порожній — коли нема про що казати */
function earChip() {
  const nowMs = Date.now();
  if (nowMs - EAR.bangT < 10000 && EAR.bangT) return { s: 'bad', v: 'вибух ' + Math.round((nowMs - EAR.bangT) / 1000) + ' с' };
  if (EAR.hum >= 0.35) return { s: EAR.hum > 0.6 ? (EAR.up ? 'bad' : 'mid') : 'mid', v: 'гул ' + Math.round(EAR.hum * 100) + '%' + (EAR.up ? ' ↑' : EAR.trend < -0.4 ? ' ↓' : '') };
  return null;
}

/* ═══ ТАКТ ОПОВІЩЕНЬ ═════════════════════════════════════════════════ */
let tAlert = 0;
function alertTick(tNow) {
  if (tNow - tAlert < 1000) return;
  tAlert = tNow;
  const nowMs = Date.now();
  try { annTick(nowMs); } catch (e) { }
  try { balTick(nowMs); } catch (e) { }
  if (BB.dirty && nowMs - BB.saveT > 30000) bbSave();
}

/* ═══ ФОН: ПРАЦЮВАТИ З ПОГАШЕНИМ ЕКРАНОМ ═════════════════════════════
   iOS присипляє сторінку у фоні — але сторінку, яка ГРАЄ звук, лишає жити:
   так працюють плеєри. Тому за перемикачем крутимо петлю тиші. Це не пуш
   (пуш потребує сервера) і не безкоштовно для батареї — про це кажемо
   прямо в налаштуваннях. Голос і вібрація при цьому продовжують. */
const BG = { el: null, on: false };
// 0.25 с тиші, WAV 8 кГц моно 8 біт — найменше, що всі браузери грають у петлі
function bgSilenceUri() {
  const n = 2000, hdr = 44;
  const b = new Uint8Array(hdr + n);
  const w32 = (o, v) => { b[o] = v & 255; b[o + 1] = (v >> 8) & 255; b[o + 2] = (v >> 16) & 255; b[o + 3] = (v >> 24) & 255; };
  const w16 = (o, v) => { b[o] = v & 255; b[o + 1] = (v >> 8) & 255; };
  const s = (o, t) => { for (let i = 0; i < t.length; i++) b[o + i] = t.charCodeAt(i); };
  s(0, 'RIFF'); w32(4, 36 + n); s(8, 'WAVE'); s(12, 'fmt '); w32(16, 16); w16(20, 1); w16(22, 1);
  w32(24, 8000); w32(28, 8000); w16(32, 1); w16(34, 8); s(36, 'data'); w32(40, n);
  for (let i = 0; i < n; i++) b[hdr + i] = 128;
  let str = ''; for (let i = 0; i < b.length; i++) str += String.fromCharCode(b[i]);
  return 'data:audio/wav;base64,' + btoa(str);
}
function bgSet(on) {
  if (on) {
    if (!BG.el) {
      const a = document.createElement('audio');
      a.src = bgSilenceUri(); a.loop = true; a.setAttribute('playsinline', ''); a.volume = 0.01;
      a.id = 'bg-audio'; document.body.appendChild(a); BG.el = a;
    }
    BG.el.play().then(() => { BG.on = true; BG.pending = false; bbLog('фон', 'петля тиші увімкнена'); })
      .catch(() => {
        /* Автостарт без дотику браузер може заборонити — тоді чекаємо на
           перший дотик по екрану і пробуємо ще раз, мовчки. */
        BG.on = false;
        if (!BG.pending) {
          BG.pending = true;
          const retry = () => { removeEventListener('pointerdown', retry, true); if (S.set.bg && !BG.on) bgSet(true); };
          addEventListener('pointerdown', retry, true);
        }
      });
  } else if (BG.el) { BG.el.pause(); BG.on = false; BG.pending = false; bbLog('фон', 'петля тиші вимкнена'); }
}

/* ═══ ДОПОВІДЬ ОДНИМ ТАПОМ ═══════════════════════════════════════════ */
function reportText(it) {
  if (!it) return '';
  const me = myPos();
  const t = new Date(it.t || Date.now());
  const p = n => String(n).padStart(2, '0');
  const hh = p(t.getHours()) + ':' + p(t.getMinutes());
  const type = it.typeName || it.name || 'ціль';
  const az = it.az != null ? NBK.fmtAz(it.az) : '—';
  const el = it.el != null ? Math.round(it.el) + '°' : '—';
  const dist = it.ground != null ? NBK.fmtDist(it.ground) : (it.range != null ? NBK.fmtDist(it.range) + (it.sigma ? ' ±' + NBK.fmtDist(it.sigma) : '') : '—');
  const mg = it.pos ? NBK.toMGRS(it.pos.lat, it.pos.lon, 4) : (it.lat != null ? NBK.toMGRS(it.lat, it.lon, 4) : null);
  const mine = me ? NBK.toMGRS(me.lat, me.lon, 4) : null;
  return ['ЖУЙКА ' + hh, type, 'аз. ' + az + ' · кут ' + el, 'дальність ' + dist,
    mg ? 'ціль MGRS ' + mg : null, mine ? 'спостерігач MGRS ' + mine : null,
    it.speedKmh ? Math.round(it.speedKmh) + ' км/год' + (it.hdg != null ? ' · курс ' + Math.round(it.hdg) + '°' : '') : null,
    it.sources ? 'джерела: ' + it.sources.join('+') : (it.src ? 'джерело: ' + it.src : 'оптичний фікс')
  ].filter(Boolean).join(' · ');
}
async function reportShare(it) {
  const text = reportText(it);
  if (!text) { toast('нема чого доповідати', 'warn'); return false; }
  bbLog('доповідь', text);
  try {
    if (navigator.share) { await navigator.share({ text }); toast('доповідь надіслана', 'good'); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  copyText(text);
  return true;
}


/* ══════════════════ РУЧНИЙ ПОГЛЯД ══════════════════
   ЖУЙКА купол не крутила пальцем узагалі: телефон водять рукою, давачі
   кажуть куди він дивиться, і цього досить. Тут половина роботи йде з
   десктопа, де давачів немає ні одного, — без ручного погляду купол там
   був би нерухомою картинкою в один бік.

   Правило просте: поки орієнтація жива, веде вона; щойно людина потягла
   пальцем — веде палець, доки не поверне керування давачу. */
/* Куполом веде ТІЛЬКИ ТЕЛЕФОН: гіроскоп, компас, камера. Огляду пальцем
   тут немає взагалі — і це свідоме рішення, а не прогалина. Купол показує,
   де ціль ВІДНОСНО ВАС у справжньому світі; палець, який крутить небо
   окремо від телефона, робить із цього просто картинку, за якою вже не
   можна підняти голову й подивитись туди ж.

   Де давача немає (десктоп, ноутбук без гіроскопа), купол стоїть нерухомо
   на півночі й каже про це прямо. Нерухомий купол — чесний купол: він
   показує ту саму обстановку, просто без «куди я дивлюсь». */
var MAN = {on:true, az:0, el:25};

function manualQ(){
  /* Кути deviceorientation для «телефон дивиться в азимут A під кутом E,
     без крену»: alpha відлічується проти годинникової від півночі, beta —
     нахил уперед-назад, де 90° це горизонт. */
  var q = NBK.quatFromEuler(norm360(360 - MAN.az), 90 + MAN.el, 0);
  S.q = q; S.qMeas = q; S.qRaw = q;
  S.head.az = MAN.az; S.head.el = MAN.el;
  S.head.screenAngle = 0; S.head.stale = false; S.head.absolute = false;
  S.head.quality = 0; S.head.jitter = 0;
}
/* Лишається для одного: поставити нерухомий купол у відомий бік (північ за
   умовчанням) і для перевірок. Жест сюди не веде. */
function setLook(az, el){
  MAN.az = norm360(az);
  /* нижче горизонту дивитись нема на що, у зеніт — теж (там усе сходиться) */
  MAN.el = clamp(el, -15, 85);
}
function setFovDeg(d){ DOME_HALF.deg = clamp(d, 15, 85); }
function fovDeg(){ return DOME_HALF.deg; }
/* Повернути керування давачу — але тільки якщо він справді живий:
   мовчазне повернення до нерухомої картинки гірше за палець. */
function useSensor(){
  if(!ORI.ok) return false;
  MAN.on = false; return true;
}
/* Давач міг піднятись уже після відкриття купола — ланцюжок із чотирьох
   джерел і дотягування працюють кілька секунд. Щойно він ожив, керування
   переходить до нього само: людина не має здогадуватись, що тепер можна
   водити телефоном. Але якщо вона вже потягла пальцем — не перехоплюємо,
   бо картинка зірветься просто в руках. */
function sensorTakeover(){
  /* Давач ожив — веде він, без питань: перехоплювати нема в кого. */
  if(ORI.ok && MAN.on){ MAN.on = false; return true; }
  if(!ORI.ok && !MAN.on){ MAN.on = true; return true; }   // давач замовк
  return false;
}
function manual(){ return MAN.on; }
function sensorLive(){ return !!ORI.ok; }

/* ══════════════════════ ІНТЕРФЕЙС ДЛЯ ЗАСТОСУНКУ ══════════════════════ */

var DOME = {
  ready:false, raf:null, host:null,
  onStatus:null
};

/* Цілі подає мапа: той самий нормалізований запис NEPTUN, що й на ній.
   Купол дописує до кожної азимут, кут місця, дальність і час найближчого
   підходу — тією самою геометрією, що в ЖУЙЦІ (feedStep). */
function setTargets(list){
  var arr = Array.isArray(list) ? list : [];
  /* feedStep веде ціль числом від lat0/lon0 і добігає до них плавно. Запис
     із мапи цих полів не має — заводимо їх при першій подачі, а далі лише
     оновлюємо, щоб добігання не смикалось на кожному опитуванні. */
  var was = {};
  FEED.items.forEach(function(o){ was[o.id] = o; });
  arr.forEach(function(o){
    var old = was[o.id];
    if(old){
      o.animFrom = {lat:old.lat, lon:old.lon};
      o.animT = now();
    }
    o.lat0 = o.lat; o.lon0 = o.lon;
  });
  FEED.items = arr;
  FEED.on = true;
  /* Один прохід одразу, щоб азимути були вже на першому кадрі, а не через
     кадр після подачі. Далі веде цикл. */
  try { feedStep(0); } catch(e){}
}

/* Тривоги з мапи. Балістичний сигнал спирається САМЕ на це: без активної
   тривоги в області він мовчить, хоч би що прийшло в стрічці. Два польові
   випадки, коли він кричав на порожнє небо, були саме через відсутність
   цієї перевірки. */
function alertsFromApp(o){
  o = o || {};
  ALERTS.mine = !!o.mine;
  ALERTS.oblast = o.oblast || '';
  ALERTS.oblasts = +o.oblasts || 0;
  ALERTS.raions = +o.raions || 0;
  ALERTS.t = Date.now();
}

/* Кадр купола — той самий порядок, що й у ЖУЙЦІ: спершу орієнтація, потім
   геометрія цілей, потім оповіщення, потім небо й шари, і лише наприкінці
   малювання. Міняти порядок не можна: alertTick читає threat/tcpa, які
   дописує feedStep, а шари читають те, що накопичив ambientStep.

   Повільний такт (380 мс) окремо: мікрофон, історія азимутів і запис
   треків не мають сенсу частіше, а коштують помітно. */
var TICK = {hist:0, slow:0, feedT:0};
function frame(){
  DOME.raf = requestAnimationFrame(frame);
  if(!DOME.ready) return;
  var t = now();
  try{
    sensorTakeover();
    if(MAN.on) manualQ(); else fusedOrientation();

    /* Геометрія цілей щокадру: ціль ведеться числом за курсом між
       оновленнями, і без цього кроку вона стояла б на місці. */
    feedStep(Math.min(200, t - (TICK.feedT || t))); TICK.feedT = t;
    aimStep(t);
    alertTick(t);
    skyStep(Date.now());
    ambientStep(Date.now());
    if(t - TICK.hist > 3000){ TICK.hist = t; histStep(); }

    if(GL.on && GL.ok) glFrame(domeItems());
    drawOverlay();

    if(t - TICK.slow > 380){
      TICK.slow = t;
      pollAudio();                 // мікрофон → слух, спектрограма, гул
      corrAdd(FEED.items);         // історія азимутів заходу
    }
  }catch(e){
    if(DOME.onStatus) DOME.onStatus('кадр купола спіткнувся: ' + (e && e.message || e));
    stop();
  }
}

function start(){
  if(DOME.raf) return;
  DOME.ready = true;
  try { bbLoad(); bbLog('старт', 'купол відкрито · голос ' + (S.set.voice === false ? 'вимк' : 'увімк')); } catch(e){}
  try { wdStart(); } catch(e){}
  /* Голос мусить бути «розігрітий» жестом: перший speak() без дотику iOS
     мовчки відкидає, і потім не говорить уже нічого. */
  try { voicePrime(); } catch(e){}
  frame();
}
function stop(){
  if(DOME.raf) cancelAnimationFrame(DOME.raf);
  DOME.raf = null; DOME.ready = false;
  try { if(WD.tmr) { clearInterval(WD.tmr); WD.tmr = null; } } catch(e){}
  try { if(typeof speechSynthesis !== 'undefined') speechSynthesis.cancel(); VOICE.q.length = 0; } catch(e){}
}

/* ══════════ ПРИЦІЛ ══════════
   Купол наводять телефоном, тож «вибрати ціль» тут означає навести на неї
   центр кадру й потримати. Затримка в 700 мс — навмисна: без неї голос
   тріщав би на кожному дрижанні руки, перебираючи цілі, повз які приціл
   лише проїхав.

   Що сказано вголос — те саме показується й текстом за тапом: людина в
   укритті може не почути фразу, і мовчазний дубль на екрані для неї
   єдиний спосіб дізнатися те саме.

   Ціль шукаємо ТИМ САМИМ проєктором, яким купол її намалював. Інакше
   приціл брав би одну ціль, а палець — іншу, і це помітили б тільки в полі. */
const AIM = { id:null, t:0, saidId:null, saidT:0 };

function aimList(){
  return FEED.items.filter(function(i){
    return i.az != null && i.el != null && !i.areaOnly;
  });
}
/** Найближча до точки екрана ціль, або null. maxPx — радіус пошуку. */
function aimNearPixel(x, y, maxPx){
  let P; try{ P = makeProjector(); }catch(e){ return null; }
  let best = null, bd = maxPx * maxPx;
  for(const it of aimList()){
    let p; try{ p = P(it.az, it.el); }catch(e){ continue; }
    if(!p || p.behind) continue;
    const d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
    if(d < bd){ bd = d; best = it; }
  }
  return best;
}
function aimStep(nowMs){
  const w = S.view.cw || 0, h = S.view.ch || 0;
  if(!w || !h) return;
  const it = aimNearPixel(w / 2, h / 2, Math.min(w, h) * 0.13);
  const id = it ? it.id : null;
  if(id !== AIM.id){ AIM.id = id; AIM.t = nowMs; S.aimFeedId = id; S.aimT = nowMs; return; }
  if(!id) return;
  if(nowMs - AIM.t > 700 && (AIM.saidId !== id || nowMs - AIM.saidT > 25000)){
    AIM.saidId = id; AIM.saidT = nowMs;
    say(phraseAim(it), { key:'aim:' + id, gapMs:20000 });
    bbLog('приціл', (it.typeName || '?') + ' · ' + NBK.fmtAz(it.az) + ' · ' + NBK.fmtDist(it.ground));
  }
}
function aimed(){ return AIM.id ? (FEED.items.find(function(i){ return i.id === AIM.id; }) || null) : null; }

function phraseAim(it){
  const parts = [voiceType(it), 'з ' + voiceDir(it.az), voiceKm(it.ground)];
  if(it.alt) parts.push(voiceAlt(it.alt));
  if(it.closing != null && it.closing > 3){
    const eta = etaSec(it);
    parts.push(eta != null ? 'курс на вас, ' + voiceMin(eta) : 'зближується');
  } else if(it.closing != null) parts.push('проходить мимо');
  return parts.join(', ') + '.';
}

/* Картка цілі: САМЕ ті числа, що купол показує на екрані, з підписом,
   звідки кожне взялось. Висота й тип у фіді NEPTUN не приходять — вони з
   таблиці ТТХ, і картка це каже прямо, а не видає за виміряне. */
function aimInfo(it){
  if(!it) return null;
  const km = function(m){ return m == null ? null : Math.round(m / 100) / 10; };
  const eta = etaSec(it);
  return {
    id: it.id,
    title: it.typeName || 'ціль',
    raw: it.title || '',
    known: !!it.known,
    az: it.az == null ? null : Math.round(it.az),
    azText: it.az == null ? null : NBK.fmtAz(it.az),
    dir: it.az == null ? null : voiceDir(it.az),
    el: it.el == null ? null : Math.round(it.el * 10) / 10,
    groundKm: km(it.ground),

  while(i<c.length){const s=dist(c[i-1],c[i]);if(d<=s){const br=bearing(c[i-1],c[i]);return{p:dest(c[i-1],br,d),b:br}}d-=s;i++}
  return{p:c[c.length-1],b:bearing(c[c.length-2]||c[0],c[c.length-1])}}
/* Дуглас–Пекер у градусах (для пензля, крок 2) */
function simplify(pts,eps){if(pts.length<3)return pts;let dmax=0,idx=0;const a=pts[0],b=pts[pts.length-1];
  for(let i=1;i<pts.length-1;i++){const d=segDist(pts[i],a,b);if(d>dmax){dmax=d;idx=i}}
  if(dmax>eps){return simplify(pts.slice(0,idx+1),eps).slice(0,-1).concat(simplify(pts.slice(idx),eps))}return [a,b]}
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];const l2=dx*dx+dy*dy;if(!l2)return Math.hypot(p[0]-a[0],p[1]-a[1]);
  let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l2;t=clamp(t,0,1);return Math.hypot(p[0]-(a[0]+t*dx),p[1]-(a[1]+t*dy))}

let stT=null,holdUntil=0,inIdle=false;
function st(msg,keep,mode){
  if(keep&&!inIdle)holdUntil=Date.now()+5000;else if(!keep)holdUntil=0;
  const e=$('st-txt');e.innerHTML='<span>'+esc(msg)+'</span>';e.classList.toggle('k',!!keep);
  e.classList.remove('run');
  requestAnimationFrame(()=>{const sp=e.firstChild;if(!sp)return;const over=sp.scrollWidth-e.clientWidth;
    if(over>4){e.style.setProperty('--dx',(-over-12)+'px');e.classList.add('run');
      sp.addEventListener('animationend',()=>e.classList.remove('run'),{once:true})}});

function loadLS(){

  S.objs=rd(LS.obj,null);S.groups=rd(LS.grp,null);

    const oc=rd(OLD.cfg,{});cfg={base:oc.base==='dark'?'dark':'relief',terrain:oc.terrain!==false,exag:oc.exag||1.4,pitch:oc.pitch||62,hill:oc.hill||.5,grid:!!oc.grid,theme:oc.theme||''};
  }
  S.groups=S.groups||[];S.cfg=Object.assign({},DEF_CFG,cfg||{});
  /* ланцюжок інструмента був увімкнений типово і читався як залипання кнопки:
     намалював обʼєкт — інструмент знову в руках, підсвітка в меню не гасне.
     Одноразово гасимо його й тим, хто вже має збережений cfg; далі — воля
     користувача, прапорець cfgV це памʼятає. */
  if(S.cfg.cfgV!==2){S.cfg.chain=false;S.cfg.cfgV=2}
  if(!['relief','dark'].includes(S.cfg.base))S.cfg.base='relief';
  S.seq=rd(LS.seq,1);
  S.objs.forEach(o=>{o.st=Object.assign({},DEF_ST,o.st||{});if(!o.n)o.n=S.seq++;if(o.visible==null)o.visible=true;migrate(o)});
  /* Обʼєкт без жодної координати намалювати ніде: рендер бере coords[0][1] і
     падає, забираючи з собою всю мапу. Такий запис міг лишитись від битого
     сховища або від чужого GeoJSON — тихо відкидаємо його, але кажемо
     скільки, щоб зникнення не виглядало як загублена робота. */
  const n0=S.objs.length;
  S.objs=S.objs.filter(o=>Array.isArray(o.coords)&&o.coords.length&&
    o.coords.every(c=>Array.isArray(c)&&isFinite(c[0])&&isFinite(c[1])));
  lostOnLoad=n0-S.objs.length;

function migrate(o){
  if(o.type==='zone'){o.type='polygon';o.st.hatch=true}
  else if(o.type==='arrow'){o.type='line';if(!o.st.arrowType||o.st.arrowType==='none')o.st.arrowType='classic'}
  else if(o.type==='pencil'){o.type='line';if(!o.st.brush)o.st.brush='pencil'}
  if(o.type==='line'&&o.st.arrowType==='plain')o.st.arrowType='none';
  if(o.type==='unit')o.st.sym=symNorm(o.st.sym);
  return o}

/* ═══════════ РЕЛЬЄФ · dem:// з ланцюжком резервів (з delta⁹) ═══════════ */
const DEM_SRC=[
  {id:'reearth',url:'https://terrain.reearth.land/terrarium/elevation/{z}/{x}/{y}.png',max:15},
  {id:'aws',url:'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png',max:15},
  {id:'openzenith',url:'https://openzenith.cyopsys.com/api/dem-tile/{z}/{x}/{y}',max:12}];
const demRaw={},demGrid={};let demOk=0,demFail=0,demWho='';
/* Кеші тайлів рельєфу росли без витіснення: сирий ArrayBuffer на кожен
   колись завантажений тайл і Float32Array(65536) — це 256 КБ на тайл — на
   кожен декодований. За зміну роботи з протяжками це сотні мегабайтів, які
   ніколи не звільняються. Витісняємо найстаріші, як уже зроблено для висот
   під моделями в KostylLayer. */
const DEM_KEEP=420;
function demCap(store,cap){
  const ks=Object.keys(store);
  if(ks.length<=cap)return;
  for(let i=0;i<ks.length-cap;i++)delete store[ks[i]];
}
const tkey=(z,x,y)=>z+'/'+x+'/'+y;
function fetchTO(url,ms,sig){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);
  if(sig){try{sig.addEventListener('abort',()=>ctl.abort())}catch(e){}}
  return fetch(url,{signal:ctl.signal,mode:'cors'}).then(r=>{clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer()}).catch(e=>{clearTimeout(t);throw e})}
function fetchDem(z,x,y,sig){const k=tkey(z,x,y);if(demRaw[k])return demRaw[k];
  const chain=DEM_SRC.reduce((prev,s)=>prev.catch(()=>{if(z>s.max)throw new Error('zoom');
    return fetchTO(s.url.replace('{z}',z).replace('{x}',x).replace('{y}',y),7000,sig).then(b=>{if(!demOk){demOk=1;demWho=s.id;logSrc('рельєф пішов з '+s.id);onDemReady()}return b})}),Promise.reject(new Error('init')));
  demRaw[k]=chain;demCap(demRaw,DEM_KEEP);
  chain.catch(()=>{if(demRaw[k]===chain)delete demRaw[k];demFail++});return chain}
try{maplibregl.addProtocol('dem',(params,ac)=>{const m=/dem:\/\/(\d+)\/(\d+)\/(\d+)/.exec(params.url);
  if(!m)return Promise.reject(new Error('bad dem url'));return fetchDem(+m[1],+m[2],+m[3],ac&&ac.signal).then(b=>({data:b}))});}catch(e){}
const mxT=(l,z)=>(l+180)/360*Math.pow(2,z);
const myT=(l,z)=>{const s=Math.sin(rad(l));return (.5-Math.log((1+s)/(1-s))/(4*Math.PI))*Math.pow(2,z)};
function decodeDem(z,x,y){const k=tkey(z,x,y);if(demGrid[k]!==undefined)return Promise.resolve(demGrid[k]);
  return fetchDem(z,x,y).then(buf=>createImageBitmap(new Blob([buf]))).then(bmp=>{
    const cv=document.createElement('canvas');cv.width=cv.height=256;const ctx=cv.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(bmp,0,0,256,256);const d=ctx.getImageData(0,0,256,256).data,g=new Float32Array(65536);
    for(let i=0,j=0;i<65536;i++,j+=4){const e=d[j]*256+d[j+1]+d[j+2]/256-32768;g[i]=e<=-32000?NaN:e}
    try{bmp.close&&bmp.close()}catch(e){}demGrid[k]=g;demCap(demGrid,DEM_KEEP);return g})
    .catch(()=>{demGrid[k]=null;return null})}
const DEMZ=12;
function elevAt(p){const fx=mxT(p[0],DEMZ),fy=myT(p[1],DEMZ),tx=Math.floor(fx),ty=Math.floor(fy);
  const g=demGrid[tkey(DEMZ,tx,ty)];if(!g)return null;
  const px=(fx-tx)*256,py=(fy-ty)*256,x0=clamp(Math.floor(px),0,255),y0=clamp(Math.floor(py),0,255),x1=Math.min(255,x0+1),y1=Math.min(255,y0+1);
  const dx=px-x0,dy=py-y0,at=(ix,iy)=>{const v=g[iy*256+ix];return isNaN(v)?0:v};
  return (at(x0,y0)*(1-dx)+at(x1,y0)*dx)*(1-dy)+(at(x0,y1)*(1-dx)+at(x1,y1)*dx)*dy}
/* гарантуємо тайли DEM під набором точок, далі elevAt працює синхронно */
function ensureDem(pts){const keys={};pts.forEach(p=>{keys[tkey(DEMZ,Math.floor(mxT(p[0],DEMZ)),Math.floor(myT(p[1],DEMZ)))]=1});
  return Promise.all(Object.keys(keys).map(k=>{const a=k.split('/');return decodeDem(+a[0],+a[1],+a[2])}))}
function heightAt(p){let h=null;try{h=map.queryTerrainElevation({lng:p[0],lat:p[1]})}catch(e){}if(h==null||!isFinite(h))h=elevAt(p);return h}
function profile(c,n){n=n||48;const L=plen(c),out=[];for(let i=0;i<=n;i++){const pa=pointAlong(c,i/n);out.push({d:L*i/n,h:elevAt(pa.p)})}return out}

const IMG={};

/* Кеш спрайтів необмежений бути не може: картинки кешуються за ТЕКСТОМ, а
   preview() смикається на кожен символ у полі назви й на кожен крок повзунка
   розміру шрифту. Один напис 64 px — близько 6 МБ RGBA; протяжка повзунка

function addImg(name,cv,dpr){if(IMG[name])return name;try{

  IMG[name]=1;IMG_ORDER.push(name);
  while(IMG_ORDER.length>IMG_CAP){
    const old=IMG_ORDER.shift();
    if(old===name)continue;
    try{map.removeImage(old)}catch(e){}
    delete IMG[old];
  }
}catch(e){}return name}
const DPR=Math.min(2,window.devicePixelRatio||1);
/* знак мітки: гліф + світіння */

/* ЦІЛЬ БЕЗ КУРСУ — кільце з гліфом типу всередині, і жодного натяку на
   напрямок. Модель має ніс, тож будь-який її кут читається як курс; коли
   курсу немає, чесно показати можна тільки що і де, але не куди.
   Пунктирне кільце каже те саме, що й у NEPTUN: позиція є, напрямку нема. */

/* підпис у рамці — фірмовий caption ФОСФОР-7 */

/* символ підрозділу → спрайт. milsymbol віддає канву і якір; канву переносимо

/* ═══════════ ГЕОМЕТРІЯ СТРІЛОК ═══════════ */
/* метрів на екранний піксель — щоб наконечник тримав сталий розмір на будь-якому зумі */
/* MapLibre малює тайлами по 512 px, звідси +1 у степені */
function mPerPx(lat,z){return 156543.03392*Math.cos(rad(lat))/Math.pow(2,z+1)}
function headLen(c,s){
  const z=map?map.getZoom():12,tip=c[c.length-1],seg=dist(c[c.length-2],tip);
  const px=(11+(s.width||3)*2.3)*(s.head||1);
  /* лише верхня межа: інакше на довгій лінії голова роздувалась до кілометрів */
  return Math.min(mPerPx(tip[1],z)*px,seg*.9,plen(c)*.5)}
function arrowParts(c,s){
  const out=[],t=s.arrowType||'none';if(t==='none'||t==='plain'||c.length<2)return out;
  const tip=c[c.length-1],prev=c[c.length-2],brg=bearing(prev,tip),seg=dist(prev,tip);
  const L=headLen(c,s);
  const head=(tp,b,len)=>{const back=dest(tp,b+180,len);return [tp,dest(back,b-90,len*.45),dest(back,b+90,len*.45),tp]};
  if(t==='classic'||t==='double'||t==='wedge'||t==='thrust')out.push({g:{type:'Polygon',coordinates:[head(tip,brg,L*(t==='thrust'?1.25:1))]},fill:1});
  if(t==='double'){const b2=bearing(c[1],c[0]);out.push({g:{type:'Polygon',coordinates:[head(c[0],b2,L)]},fill:1})}
  if(t==='open'){out.push({g:{type:'LineString',coordinates:[dest(tip,brg+180+34,L),tip,dest(tip,brg+180-34,L)]},fill:0})}
  if(t==='bar')out.push({g:{type:'LineString',coordinates:[dest(tip,brg-90,L*.55),dest(tip,brg+90,L*.55)]},fill:0});
  if(t==='wedge'||t==='thrust'){const body=c.slice(0,-1).concat([dest(tip,brg+180,L*(t==='thrust'?1.25:1))]);

    body.forEach((p,i)=>{const b=i<n-1?bearing(p,body[i+1]):bearing(body[i-1],p);const w=W*(0.12+0.88*(i/(n-1||1)));l.push(dest(p,b-90,w));r.push(dest(p,b+90,w))});
    out.push({g:{type:'Polygon',coordinates:[l.concat(r.reverse()).concat([l[0]])]},fill:1})}

/* ═══════════ ОБʼЄКТ → ГЕОМЕТРІЯ ═══════════ */
function linkEnds(o){const a=byId(o.aId),b=byId(o.bId);return (a&&b)?[a,b]:null}
function shapeOf(o){/* контур для ліній/заливок; null для точкових */
  const c=o.coords;
  if(o.type==='link'){const e=linkEnds(o);return e?{type:'LineString',coordinates:[anchorOf(e[0]),anchorOf(e[1])]}:null}
  if(o.type==='polygon')return c.length>2?{type:'Polygon',coordinates:[ring(c)]}:null;
  if(o.type==='line')return c.length>1?{type:'LineString',coordinates:c}:null;
  if(o.type==='circle')return c.length>1?{type:'Polygon',coordinates:[circlePoly(c[0],dist(c[0],c[1]))]}:null;
  if(o.type==='sector'){if(c.length<2)return null;const p=sectorParams(c);return {type:'Polygon',coordinates:[sectorPoly(c[0],p.r,p.az,p.w)]}}
  return null}
function anchorOf(o){const c=o.coords;
  if(o.type==='link'){const e=linkEnds(o);if(!e)return [0,0];const a=anchorOf(e[0]),b=anchorOf(e[1]);return [(a[0]+b[0])/2,(a[1]+b[1])/2]}
  if(o.type==='marker'||o.type==='text'||o.type==='unit'||o.type==='circle'||o.type==='sector')return c[0];
  if(o.type==='polygon')return mid(c);return c[Math.floor(c.length/2)]}
function metricsOf(o){const c=o.coords,t=o.type,L=[];
  if(t==='unit'){const sy=symNorm(o.st.sym);
    L.push('символ ...... '+symLabel(sy));
    L.push('належність .. '+AFF_LBL[sy.aff]);
    if(sy.hq)L.push('роль ........ штаб / КП');
    if(sy.mob&&sy.mob!=='none')L.push('рухомість ... '+MOB_LBL[sy.mob]);
    if(sy.status==='planned')L.push('стан ........ очікуваний');
    if(sy.higher)L.push('вище ........ '+sy.higher);
    L.push('SIDC ........ '+sidcOf(sy))}
  if(t==='link'){const e=linkEnds(o);const lt=LINKT[o.st.linkType]||LINKT.subord;
    L.push('тип ......... '+lt[0]);
    L.push('від ......... '+(e?(e[0].name||TYPE[e[0].type]):'— загубився'));
    L.push('до .......... '+(e?(e[1].name||TYPE[e[1].type]):'— загубився'));
    if(e){const g=shapeOf(o);if(g)L.push('відстань .... '+fLen(plen(g.coordinates))+' · '+fAz(bearing(g.coordinates[0],g.coordinates[1])))}
    return L}
  if(t==='polygon'){L.push('площа ....... '+fAr(parea(c)));L.push('периметр .... '+fLen(plen(ring(c))))}
  if(t==='line'){L.push('довжина ..... '+fLen(plen(c)));L.push('азимут ...... '+fAz(bearing(c[0],c[c.length-1])))}
  if(t==='circle'&&c[1]){const r=dist(c[0],c[1]);L.push('радіус ...... '+fLen(r));L.push('площа ....... '+fAr(Math.PI*r*r))}
  if(t==='sector'&&c[1]){const p=sectorParams(c);L.push('радіус ...... '+fLen(p.r));L.push('азимут ...... '+fAz(p.az));L.push('ширина ...... '+Math.round(p.w)+'°')}
  if(t==='marker'||t==='text'||t==='unit'){const h=heightAt(c[0]);if(h!=null)L.push('висота ...... '+Math.round(h)+' м')}
  if(['line','polygon'].includes(t))L.push('вершин ...... '+c.length);
  L.push('центр ....... '+fLL(anchorOf(o)));return L}
function metaOf(o){const c=o.coords;
  if(o.type==='unit'){const sy=symNorm(o.st.sym);return symLabel(sy)+(sy.desig?' · '+sy.desig:'')}
  if(o.type==='link'){const e=linkEnds(o),lt=LINKT[o.st.linkType]||LINKT.subord;
    return lt[0]+(e?' · '+((e[0].name||'?')+' → '+(e[1].name||'?')):' · кінці загубились')}
  if(o.type==='marker'||o.type==='text')return fLL(c[0]);
  if(o.type==='polygon')return fAr(parea(c));
  if(o.type==='circle')return c[1]?'r '+fLen(dist(c[0],c[1])):'';
  if(o.type==='sector'){if(!c[1])return '';const p=sectorParams(c);return 'r '+fLen(p.r)+' · '+fAz(p.az)+' · '+Math.round(p.w)+'°'}
  return fLen(plen(c))+' · '+fAz(bearing(c[0],c[c.length-1]))}

const EMPTY={type:'FeatureCollection',features:[]};
function rzBucket(z){const b=Math.round(z*2)/2;ensureTextLayer(b);return b}
function buildFeatures(list){
  const f=[],pts=[];
  list.forEach(o=>{
    if(!visEff(o))return;
    /* ППО і пускові малює власний шар симуляції: їм потрібні кола досяжності
       й траєкторії, яких у форматі `objects` немає. У журналі, групах і
       відкаті вони лишаються звичайними обʼєктами. */
    if(o.type==='pvo'||o.type==='strike')return;
    const s=o.st,col=colorOf(o);
    const lt=o.type==='link'?(LINKT[s.linkType]||LINKT.subord):null;
    const lcol=lt?lt[1]:col;
    const base={id:o.id,n:o.n,color:lcol,width:s.width,opacity:s.opacity,
      dash:s.anim==='ants'?'ants':(lt&&lt[3]?'dash':s.dash),
      fill:!!(s.fill&&AREA_T[o.type]),fillOpacity:s.fillOpacity,anim:s.anim||'none',
      hatch:(o.type==='polygon'&&s.hatch)?hatchImg(col):''};
    if(o.type==='line'){const br=s.brush||'pencil';
      if(br==='pattern'||br==='grid'){base.pat=patImg(br,col);base.dash='pat'}
      else if(br==='spray')base.dash='spray';}
    if(base.pat==null)base.pat='';
    const g=shapeOf(o);
    if(g)f.push({type:'Feature',id:o.n,properties:base,geometry:g});
    if(o.type==='link'&&g&&lt[2])arrowParts(g.coordinates,{arrowType:'classic',head:.8}).forEach(part=>
      f.push({type:'Feature',id:o.n,properties:Object.assign({},base,{dash:'solid',fill:true,fillOpacity:.95}),geometry:part.g}));
    if(o.type==='line'&&(s.arrowType||'none')!=='none')arrowParts(o.coords,s).forEach(part=>f.push({type:'Feature',id:o.n,properties:Object.assign({},base,
      {dash:part.fill?'solid':base.dash,fill:!!part.fill,fillOpacity:Math.max(s.opacity,.85)}),geometry:part.g}));
    /* точкові символи */
    if(o.type==='unit'){const sy=symNorm(s.sym);sy.mono=!!s.sym&&!!s.sym.mono;sy.col=col;

function hitObj(pt,opt){
  opt=opt||{};const R=opt.r||14;

    {layers:HIT_LAYERS.filter(l=>map.getLayer(l))})}catch(err){}
  let best=null,score=1e9,seen={};
  for(const f of hit){
    const id=f.properties&&f.properties.id;if(!id||seen[id])continue;seen[id]=1;
    const o=byId(id);if(!o)continue;
    if(opt.pointsOnly&&HIT_RANK[o.type]!==0)continue;
    const r=HIT_RANK[o.type]==null?1:HIT_RANK[o.type];
    let sc=r*1000;
    if(r===0){const q=map.project(anchorOf(o));sc+=Math.min(999,Math.hypot(q.x-pt.x,q.y-pt.y))}
    else sc+=500;

/* Префікс приходить як '│  '/'   ' на рівень плюс '├─'/'└─'. Розбираємо його на
   колонки-напрямні: лінії малює CSS на всю висоту рядка, тож вони не рвуться,
   коли рядок стає вищим. */
function guides(pre){
  pre=pre||'';let s='',i=0;
  while(pre.substr(i,3)==='│  '||pre.substr(i,3)==='   '){s+='<i class="gd'+(pre[i]==='│'?' v':'')+'"></i>';i+=3}
  const tail=pre.slice(i);
  if(tail==='├─')s+='<i class="gd tee"></i>';
  else if(tail==='└─')s+='<i class="gd elb"></i>';
  return '<span class="pre">'+s+'</span>'}
/* Колір із файлу йде в атрибут style — приймаємо лише справжній hex */
const safeCol=c=>/^#[0-9a-fA-F]{3,8}$/.test(String(c||''))?c:'var(--ink-1)';
function rowObj(o,pre){const col=colorOf(o);
  return '<div class="node'+(visEff(o)?'':' off')+(o.id===S.sel?' sel':'')+'" data-o="'+esc(o.id)+'">'+guides(pre)+
    '<span class="ncol"><span class="nm" style="color:'+col+'">'+TYPE_G[o.type]+' '+esc(o.name||TYPE[o.type])+
    (o.st.anim&&o.st.anim!=='none'?' <span class="dim">~</span>':'')+(o.st.prio==='high'?' <span class="dim">!!</span>':'')+'</span>'+
    '<span class="mt2">'+esc(metaOf(o))+'</span></span>'+
    '<span class="acts"><b data-act="vis">'+(o.visible?'◉':'○')+'</b><b data-act="edit">✎</b><b data-act="del">✕</b></span></div>'}
function rowGrp(g,pre){return '<div class="node grp'+(gVis(g.id)?'':' off')+'" data-g="'+esc(g.id)+'">'+guides(pre)+'<i class="tri">'+(g.collapsed?'▶':'▼')+'</i>'+
  '<span class="nm" style="flex:1;color:'+safeCol(g.color)+'">['+esc(g.name)+']</span><span class="mt">'+subCount(g.id)+'</span>'+
  '<span class="acts"><b data-act="gadd">+</b><b data-act="gvis">'+(g.visible?'◉':'○')+'</b><b data-act="gedit">✎</b><b data-act="gdel">✕</b></span></div>'}
/* Група, на яку посилається обʼєкт, могла зникнути — після видалення при
   відкритій картці або після імпорту чужого файлу. Такий обʼєкт не належав
   жодному рівню й випадав із дерева зовсім, а журнал ставав порожнім без
   жодного напису. Повисле посилання рахуємо за корінь. */
const gidOf=o=>(o.groupId&&grp(o.groupId))?o.groupId:null;
function rows(parent,pre,out){
  const items=kids(parent).map(x=>({t:'g',x})).concat(S.objs.filter(o=>gidOf(o)===(parent||null)).map(x=>({t:'o',x})));
  items.forEach((it,i)=>{const last=i===items.length-1,br=pre+(last?'└─':'├─');
    if(it.t==='g'){out.push(rowGrp(it.x,br));if(!it.x.collapsed)rows(it.x.id,pre+(last?'   ':'│  '),out)}else out.push(rowObj(it.x,br))})}
/* ORBAT: підрозділи по приналежності → вищому формуванню */
function orbatTree(){
  const units=S.objs.filter(o=>o.type==='unit');
  if(!units.length)return '<div class="empty">┌─ підрозділів ще нема\n└─ інструмент ⬟ ПІДРОЗДІЛ ставить перший</div>';
  const out=[];
  const AFFC={friend:'#80E0FF',hostile:'#FF8080',neutral:'#AAFFAA',unknown:'#FFFF80',assumed:'#80E0FF',suspect:'#FF8080'};
  AFF_ORDER.forEach(aff=>{
    const mine=units.filter(u=>symNorm(u.st.sym).aff===aff);if(!mine.length)return;
    out.push('<div class="node grp"><span class="pre"></span><i class="tri">▼</i><span class="nm" style="flex:1;color:'+AFFC[aff]+'">['+esc(AFF_LBL[aff])+']</span><span class="mt">'+mine.length+'</span></div>');
    const byHigher={};mine.forEach(u=>{const h=((u.st.sym||{}).higher||'').trim()||'— без вищого';(byHigher[h]=byHigher[h]||[]).push(u)});
    const keys=Object.keys(byHigher).sort();

      byHigher[h].forEach((u,ui,arr)=>{

        out.push('<div class="node'+(visEff(u)?'':' off')+(u.id===S.sel?' sel':'')+'" data-o="'+u.id+'">'+
