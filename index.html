<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LAND BASE 2026</title>

<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
  :root {
    --ios-bg: #000000;
    --ios-glass: rgba(28, 28, 30, 0.85);
    --accent: #30d158;
    --accent-blue: #0a84ff;
    --danger: #ff453a;
    --text: #ffffff;
    
    --tag-green: #30d158;
    --tag-yellow: #ffd60a;
    --tag-red: #ff453a;
    --tag-orange: #ff9f0a;
    --tag-blue: #0a84ff;
  }

  * { box-sizing: border-box; -webkit-user-select: none; touch-action: pan-x pan-y; outline: none; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--ios-bg);
    font-family: 'SF Pro Display', -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
    position: fixed;
  }

  #map { position: absolute; inset: 0; z-index: 0; }
  .dark-filter { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }

  /* ── DYNAMIC ISLAND STATUS ── */
  #status-container {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    z-index: 1000; width: auto; min-width: 180px; height: 36px;
    background: #000; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 20px; border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    pointer-events: none;
    white-space: nowrap;
  }
  #status-text { font-size: 13px; font-weight: 500; letter-spacing: -0.2px; }

  /* ── MODAL ── */
  #modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px); z-index: 2000;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  #save-modal {
    background: #1c1c1e; width: 100%; max-width: 320px;
    border-radius: 24px; padding: 24px; border: 1px solid rgba(255,255,255,0.1);
    animation: modalPop 0.3s cubic-bezier(0.17, 0.89, 0.32, 1.28);
  }
  @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .modal-title { font-weight: 600; font-size: 20px; margin-bottom: 20px; text-align: center; }
  .input-group { margin-bottom: 15px; }
  .input-group label { display: block; font-size: 10px; color: rgba(255,255,255,0.5); margin-bottom: 6px; margin-left: 10px; text-transform: uppercase; }
  .modal-input {
    width: 100%; background: rgba(255,255,255,0.08); border: none;
    border-radius: 12px; padding: 12px 16px; color: #fff; font-size: 16px;
    -webkit-user-select: text;
  }
  .color-selector { display: flex; justify-content: space-between; margin: 20px 0; }
  .color-opt {
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    border: 3px solid transparent; transition: 0.2s;
  }
  .color-opt.selected { border-color: #fff; transform: scale(1.1); }

  .modal-btns { display: flex; gap: 10px; margin-top: 25px; }
  .modal-btn { flex: 1; padding: 14px; border-radius: 14px; border: none; font-weight: 600; font-size: 15px; }
  .btn-save { background: var(--accent-blue); color: white; }
  .btn-cancel { background: rgba(255,255,255,0.1); color: white; }

  /* ── TAB BAR ── */
  #tab-bar {
    position: absolute; bottom: 30px; left: 15px; right: 15px;
    height: 84px; background: var(--ios-glass);
    backdrop-filter: blur(25px) saturate(180%);
    border-radius: 35px; z-index: 100;
    display: flex; justify-content: space-around; align-items: center;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 0 10px;
  }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: rgba(255,255,255,0.5); cursor: pointer; flex: 1; }
  .nav-item.active { color: var(--accent); }
  .nav-item.draw-active { color: var(--accent-blue); }
  .nav-item svg { width: 24px; height: 24px; }
  .nav-item span { font-size: 9px; font-weight: 500; }

  /* ── DRAWER ── */
  #drawer {
    position: absolute; top: 100%; left: 0; width: 100%; height: 85%;
    background: var(--ios-glass); backdrop-filter: blur(30px);
    border-radius: 40px 40px 0 0; z-index: 1500;
    transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
    padding: 20px; border-top: 1px solid rgba(255,255,255,0.1);
    display: flex; flex-direction: column;
  }
  #drawer.open { transform: translateY(-100%); }
  .handle-area { width: 100%; height: 30px; margin-top: -10px; display: flex; align-items: center; justify-content: center; touch-action: none; flex-shrink: 0; }
  .handle { width: 40px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 10px; }

  .search-container { position: relative; margin-bottom: 15px; flex-shrink: 0; }
  #search-land {
    width: 100%; background: rgba(255,255,255,0.1); border: none;
    border-radius: 15px; padding: 12px 15px 12px 40px; color: #fff;
    font-size: 16px; -webkit-user-select: text;
  }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: 0.4; }

  #land-list { overflow-y: auto; flex-grow: 1; padding-bottom: 20px; -webkit-overflow-scrolling: touch; }
  .land-card {
    background: rgba(255,255,255,0.05); border-radius: 20px;
    padding: 15px; margin-bottom: 12px; display: flex; gap: 15px; align-items: center;
  }
  .land-preview {
    width: 65px; height: 65px; background: rgba(0,0,0,0.3);
    border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.1); overflow: hidden;
  }
  .land-preview svg { width: 100%; height: 100%; }
  .land-info { flex-grow: 1; overflow: hidden; }
  .land-info h4 { margin: 0; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .land-info p { margin: 3px 0 0; font-size: 11px; opacity: 0.6; text-transform: uppercase; }
  .land-comment { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 4px; font-style: italic; }
  .coords-text { font-size: 10px; color: var(--accent-blue); margin-top: 6px; font-family: monospace; }

  .export-area { padding: 10px 0 30px; flex-shrink: 0; }
  .btn-export {
    width: 100%; padding: 16px; border-radius: 16px; background: var(--accent-blue);
    color: #fff; border: none; font-weight: 600; font-size: 15px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }

  .dot-marker { width: 14px; height: 14px; background: var(--accent-blue); border: 3px solid white; border-radius: 50%; }
  .user-location-marker { width: 18px; height: 18px; background: var(--accent-blue); border: 3px solid white; border-radius: 50%; box-shadow: 0 0 15px var(--accent-blue); }

  /* PDF STYLES */
  .pdf-export-container { background: white; color: black; padding: 40px; }
  .pdf-item { display: flex; align-items: flex-start; gap: 25px; border-bottom: 1px solid #eee; padding: 20px 0; page-break-inside: avoid; }
  .pdf-thumb { width: 120px; height: 120px; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; background: #f9f9f9; }
  .pdf-info h2 { margin: 0 0 10px; font-size: 22px; color: #1a1a1a; }
  .pdf-info p { margin: 4px 0; font-size: 13px; color: #444; }
  .pdf-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 10px; margin-bottom: 8px; }
</style>
</head>
<body>

<div id="status-container"><span id="status-text">Система готова</span></div>
<div id="map"></div>

<div id="modal-overlay">
  <div id="save-modal">
    <div class="modal-title">Сохранить участок</div>
    <div class="input-group">
      <label>Название участка</label>
      <input type="text" id="inp-land-name" class="modal-input" placeholder="Введите название...">
    </div>
    <div class="input-group">
      <label>Группа</label>
      <input type="text" id="inp-group-name" class="modal-input" placeholder="Напр. Пашня">
    </div>
    <div class="input-group">
      <label>Комментарий</label>
      <input type="text" id="inp-land-note" class="modal-input" placeholder="Дополнительные детали...">
    </div>
    <div class="input-group">
      <label>Цвет</label>
      <div class="color-selector" id="color-picker">
        <div class="color-opt selected" data-color="green" style="background: var(--tag-green)"></div>
        <div class="color-opt" data-color="yellow" style="background: var(--tag-yellow)"></div>
        <div class="color-opt" data-color="orange" style="background: var(--tag-orange)"></div>
        <div class="color-opt" data-color="red" style="background: var(--tag-red)"></div>
        <div class="color-opt" data-color="blue" style="background: var(--tag-blue)"></div>
      </div>
    </div>
    <div class="modal-btns">
      <button class="modal-btn btn-cancel" id="btn-modal-cancel">Отмена</button>
      <button class="modal-btn btn-save" id="btn-modal-save">Готово</button>
    </div>
  </div>
</div>

<div id="drawer">
  <div class="handle-area" id="drawer-handle"><div class="handle"></div></div>
  <h2 style="margin: 10px 0 15px; font-weight: 600;">Журнал</h2>
  
  <div class="search-container">
    <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    <input type="text" id="search-land" placeholder="Поиск по названию или группе..." autocomplete="off">
  </div>

  <div id="land-list"></div>
  
  <div class="export-area">
    <button class="btn-export" onclick="exportToPDF()">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      Экспорт отчета в PDF
    </button>
  </div>
</div>

<div id="tab-bar">
  <div class="nav-item" id="nav-locate">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
    <span>Локация</span>
  </div>
  <div class="nav-item" id="nav-layers">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
    <span>Слои</span>
  </div>
  <div class="nav-item" id="nav-draw">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
    <span>Чертить</span>
  </div>
  <div class="nav-item" id="nav-clear" style="color: var(--danger);">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
    <span>Очистить</span>
  </div>
  <div class="nav-item" id="nav-history">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
    <span>Журнал</span>
  </div>
</div>

<script>
  const COLOR_PALETTE = { 'green': '#30d158', 'yellow': '#ffd60a', 'red': '#ff453a', 'orange': '#ff9f0a', 'blue': '#0a84ff' };
  const GROUP_NAMES = {};
  let lands = [];

  const map = L.map('map', { center: [50.45, 30.52], zoom: 13, zoomControl: false, attributionControl: false });
  
  const layers = {
    dark: { name: "Темная карта", layer: L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { className: 'dark-filter' }) },
    satellite: { name: "Спутник", layer: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}') },
    topo: { name: "Рельеф", layer: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png') }
  };
  layers.dark.layer.addTo(map);

  let drawMode = false, tempPoints = [], tempMarkers = [], curL = 0;
  let tempLine = L.polyline([], {color: '#0a84ff', weight: 3, dashArray: '5, 10'}).addTo(map);
  let selectedColor = 'green';
  let userMarker, userCircle;

  // Инициализация при загрузке
  window.onload = () => {
    loadLands();
    updateLandList();
  };

  /* ── PERSISTENCE (СОХРАНЕНИЕ) ── */
  function saveLands() {
    // Сохраняем только данные (без объектов Leaflet)
    const dataToSave = lands.map(l => ({
      id: l.id,
      name: l.name,
      gName: l.gName,
      note: l.note,
      coords: l.coords,
      color: l.color,
      center: l.center
    }));
    localStorage.setItem('land_base_data', JSON.stringify(dataToSave));
  }

  function loadLands() {
    const saved = localStorage.getItem('land_base_data');
    if (saved) {
      const parsed = JSON.parse(saved);
      parsed.forEach(data => {
        const poly = L.polygon(data.coords, {color: data.color, weight: 3, fillOpacity: 0.3}).addTo(map);
        lands.push({ ...data, poly });
      });
    }
  }

  /* ── NAVIGATION ── */
  document.getElementById('nav-locate').onclick = () => { map.locate({setView: true, maxZoom: 16}); updateStatus("Поиск GPS..."); };
  document.getElementById('nav-layers').onclick = () => {
    const keys = Object.keys(layers);
    map.removeLayer(layers[keys[curL]].layer);
    curL = (curL + 1) % keys.length;
    layers[keys[curL]].layer.addTo(map);
    updateStatus(layers[keys[curL]].name);
  };
  document.getElementById('nav-draw').onclick = () => toggleDrawMode();
  document.getElementById('nav-history').onclick = () => document.getElementById('drawer').classList.add('open');

  /* ── ADMIN CLEAR (ОЧИСТКА ПО ПАРОЛЮ) ── */
  document.getElementById('nav-clear').onclick = () => {
    const pass = prompt("Введите ПАРОЛЬ АДМИНИСТРАТОРА для ПОЛНОГО удаления всех данных:");
    if (pass === "1111") {
      lands.forEach(l => map.removeLayer(l.poly));
      lands = [];
      localStorage.removeItem('land_base_data'); // Стираем память
      updateLandList();
      updateStatus("БАЗА ОЧИЩЕНА АДМИНОМ");
    } else if (pass !== null) {
      alert("Доступ запрещен. Неверный пароль.");
    }
  };

  /* ── DRAWER ── */
  const drawer = document.getElementById('drawer');
  let startY = 0;
  document.getElementById('drawer-handle').onclick = () => drawer.classList.remove('open');
  drawer.addEventListener('touchstart', (e) => { if(e.target.closest('#land-list') || e.target.tagName === 'INPUT') return; startY = e.touches[0].clientY; }, {passive: true});
  drawer.addEventListener('touchmove', (e) => { if(e.target.closest('#land-list') || e.target.tagName === 'INPUT') return; let moveY = e.touches[0].clientY; if (moveY - startY > 50) drawer.classList.remove('open'); }, {passive: true});

  /* ── DRAWING ── */
  function toggleDrawMode(off = false) {
    drawMode = off ? false : !drawMode;
    document.getElementById('nav-draw').classList.toggle('draw-active', drawMode);
    if(!drawMode) clearTemp();
    updateStatus(drawMode ? "Режим черчения" : "Обзор");
  }

  map.on('click', (e) => {
    if(!drawMode) return;
    if(tempPoints.length > 2 && map.latLngToLayerPoint(tempPoints[0]).distanceTo(map.latLngToLayerPoint(e.latlng)) < 30) { showSaveModal(); return; }
    const m = L.marker(e.latlng, {draggable:true, icon:L.divIcon({className:'dot-marker', iconSize:[14,14]})}).addTo(map);
    m.on('drag', () => { tempPoints[tempMarkers.indexOf(m)] = m.getLatLng(); tempLine.setLatLngs(tempPoints); });
    tempMarkers.push(m); tempPoints.push(e.latlng); tempLine.setLatLngs(tempPoints);
  });

  /* ── MODAL ── */
  const overlay = document.getElementById('modal-overlay');
  const colorOpts = document.querySelectorAll('.color-opt');
  colorOpts.forEach(opt => opt.onclick = () => { colorOpts.forEach(o => o.classList.remove('selected')); opt.classList.add('selected'); selectedColor = opt.dataset.color; });

  function showSaveModal() {
    overlay.style.display = 'flex';
    document.getElementById('inp-land-name').value = "";
    document.getElementById('inp-group-name').value = GROUP_NAMES[selectedColor] || "";
    document.getElementById('inp-land-note').value = "";
  }
  document.getElementById('btn-modal-cancel').onclick = () => overlay.style.display = 'none';

  document.getElementById('btn-modal-save').onclick = () => {
    const name = document.getElementById('inp-land-name').value.trim() || `Участок ${lands.length + 1}`;
    const gName = document.getElementById('inp-group-name').value.trim() || "Общая";
    const note = document.getElementById('inp-land-note').value.trim() || "";
    GROUP_NAMES[selectedColor] = gName;
    const hex = COLOR_PALETTE[selectedColor];
    const poly = L.polygon(tempPoints, {color: hex, weight: 3, fillOpacity: 0.3}).addTo(map);
    const newLand = { id: Date.now(), name, gName, note, poly, center: poly.getBounds().getCenter(), coords: [...tempPoints], color: hex };
    lands.push(newLand);
    saveLands(); // Сохраняем в код (localStorage)
    updateLandList();
    overlay.style.display = 'none';
    toggleDrawMode(true);
    updateStatus("Сохранено локально");
  };

  /* ── UTILS & EXPORT ── */
  function getThumb(coords, color) {
    const lats = coords.map(c => c.lat), lngs = coords.map(c => c.lng);
    const minLat = Math.min(...lats), maxLat = Math.max(...lats), minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
    const rLat = maxLat - minLat || 0.0001, rLng = maxLng - minLng || 0.0001;
    const pts = coords.map(c => `${((c.lng-minLng)/rLng)*80+10},${90-((c.lat-minLat)/rLat)*80}`).join(' ');
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M0 0h100v100H0z" fill="#2c2c2e"/><polygon points="${pts}" fill="${color}" fill-opacity="0.4" stroke="${color}" stroke-width="3" stroke-linejoin="round"/></svg>`;
  }

  function updateLandList(query = '') {
    const container = document.getElementById('land-list');
    container.innerHTML = '';
    const filtered = lands.filter(l => l.name.toLowerCase().includes(query.toLowerCase()) || l.gName.toLowerCase().includes(query.toLowerCase()));
    filtered.forEach(l => {
      const card = document.createElement('div');
      card.className = 'land-card';
      card.innerHTML = `
        <div class="land-preview" onclick="focusLand(${l.id})">${getThumb(l.coords, l.color)}</div>
        <div class="land-info" onclick="focusLand(${l.id})">
          <h4>${l.name}</h4>
          <p style="color:${l.color}">${l.gName}</p>
          <div class="land-comment">${l.note}</div>
          <div class="coords-text">${l.center.lat.toFixed(6)}, ${l.center.lng.toFixed(6)}</div>
        </div>
        <button class="action-btn" style="background:rgba(255,69,58,0.15); color:var(--danger); border:none; width:36px; height:36px; border-radius:10px;" onclick="deleteLand(${l.id})">✕</button>`;
      container.appendChild(card);
    });
  }

  async function exportToPDF() {
    if (!lands.length) { updateStatus("Журнал пуст"); return; }
    updateStatus("Подготовка PDF...");
    const element = document.createElement('div');
    element.className = 'pdf-export-container';
    element.innerHTML = `<h1 style="border-bottom:2px solid #000; padding-bottom:10px;">Отчет LAND BASE 2026</h1><p>Создан: ${new Date().toLocaleString()}</p>`;
    lands.forEach(l => {
      const item = document.createElement('div');
      item.className = 'pdf-item';
      item.innerHTML = `
        <div class="pdf-thumb">${getThumb(l.coords, l.color).replace('#2c2c2e', '#f0f0f0')}</div>
        <div class="pdf-info">
          <span class="pdf-tag" style="background:${l.color}; color:${l.color === '#ffd60a' ? '#000' : '#fff'}">${l.gName}</span>
          <h2>${l.name}</h2>
          <p><b>Координаты центра:</b> ${l.center.lat.toFixed(6)}, ${l.center.lng.toFixed(6)}</p>
          <p><b>Заметка:</b> ${l.note || 'Нет'}</p>
        </div>`;
      element.appendChild(item);
    });
    const opt = { margin: 10, filename: `Land_Report_${Date.now()}.pdf`, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
    await html2pdf().set(opt).from(element).save();
    updateStatus("PDF скачан");
  }

  window.focusLand = (id) => { const l = lands.find(x => x.id === id); map.flyToBounds(l.poly.getBounds(), {padding:[50,50], duration:1.2}); drawer.classList.remove('open'); };
  window.deleteLand = (id) => { if(!confirm("Удалить этот участок?")) return; const idx = lands.findIndex(x => x.id === id); map.removeLayer(lands[idx].poly); lands.splice(idx, 1); saveLands(); updateLandList(); };
  function clearTemp() { tempMarkers.forEach(m => map.removeLayer(m)); tempMarkers = []; tempPoints = []; tempLine.setLatLngs([]); }
  function updateStatus(t) { const el = document.getElementById('status-text'); el.textContent = t; }
  document.getElementById('search-land').oninput = (e) => updateLandList(e.target.value);

  map.on('locationfound', (e) => {
    if (userMarker) { map.removeLayer(userMarker); map.removeLayer(userCircle); }
    userCircle = L.circle(e.latlng, e.accuracy, { color: 'var(--accent-blue)', fillOpacity: 0.1, weight: 1 }).addTo(map);
    userMarker = L.marker(e.latlng, { icon: L.divIcon({ className: 'user-location-marker', iconSize: [18, 18] }) }).addTo(map);
    updateStatus("Геопозиция активна");
  });
</script>

</body>
</html>
