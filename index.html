  }
  function quatNorm(q) {
    const n = Math.sqrt(q[0] * q[0] + q[1] * q[1] + q[2] * q[2] + q[3] * q[3]) || 1;
    return [q[0] / n, q[1] / n, q[2] / n, q[3] / n];
  }
  /** Кватерніон із кутів deviceorientation (порядок ZXY, як у специфікації W3C) */
  function quatFromEuler(alphaDeg, betaDeg, gammaDeg) {
    const a = (alphaDeg || 0) * D2R / 2, b = (betaDeg || 0) * D2R / 2, g = (gammaDeg || 0) * D2R / 2;
    const qz = [0, 0, Math.sin(a), Math.cos(a)];
    const qx = [Math.sin(b), 0, 0, Math.cos(b)];
    const qy = [0, Math.sin(g), 0, Math.cos(g)];
    return quatNorm(quatMul(quatMul(qz, qx), qy));
  }
  /**
   * Кватерніон → кути deviceorientation (ZXY, як у W3C).
   *
   * Потрібне для перевірок: позу телефона природно задавати обертаннями
   * («дивимось на схід, підняли на 30°, похилили на 20°»), а давач віддає
   * кути Ейлера. Без цього перетворення тест неминуче плутає крен з
   * азимутом — при beta близько 90° кути Ейлера вироджуються, і gamma там
   * працює як другий азимут, а не як крен.
   */
  function quatToEulerZXY(q) {
    const R = quatToMatrix(q);
    const beta = Math.asin(clamp(R[2][1], -1, 1));
    const cb = Math.cos(beta);
    let alpha, gamma;
    if (Math.abs(cb) > 1e-7) {
      alpha = Math.atan2(-R[0][1], R[1][1]);
      gamma = Math.atan2(-R[2][0], R[2][2]);
    } else {
      // виродження: alpha і gamma нерозрізненні, всю закрутку віддаємо alpha
      alpha = Math.atan2(R[0][2], R[0][0]);
      gamma = 0;
    }
    return { alpha: norm360(alpha * R2D), beta: beta * R2D, gamma: norm180(gamma * R2D) };
  }

  /** Обертання навколо власної осі пристрою: 0=X, 1=Y, 2=Z */
  function quatAxisDeg(axis, deg) {
    const h = deg * D2R / 2, s = Math.sin(h);
    const q = [0, 0, 0, Math.cos(h)];
    q[axis] = s;
    return q;
  }

  /** Матриця повороту «пристрій → світ (Схід, Північ, Верх)» */
  function quatToMatrix(q) {
    const [x, y, z, w] = quatNorm(q);
    return [
      [1 - 2 * (y * y + z * z), 2 * (x * y - z * w), 2 * (x * z + y * w)],
      [2 * (x * y + z * w), 1 - 2 * (x * x + z * z), 2 * (y * z - x * w)],
      [2 * (x * z - y * w), 2 * (y * z + x * w), 1 - 2 * (x * x + y * y)]
    ];
  }
  /** Кут між двома орієнтаціями, градуси */
  function quatAngle(a, b) {
    const d = Math.abs(a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3]);
    return 2 * Math.acos(clamp(d, -1, 1)) * R2D;
  }
  /** Плавний перехід між орієнтаціями — це і є фільтр, що не має виродження */
  function quatSlerp(a, b, t) {
    let d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3];
    let bb = b;
    if (d < 0) { bb = [-b[0], -b[1], -b[2], -b[3]]; d = -d; }
    if (d > 0.9995) {
      return quatNorm([
        a[0] + (bb[0] - a[0]) * t, a[1] + (bb[1] - a[1]) * t,
        a[2] + (bb[2] - a[2]) * t, a[3] + (bb[3] - a[3]) * t
      ]);
    }
    const th0 = Math.acos(clamp(d, -1, 1)), th = th0 * t;
    const s0 = Math.cos(th) - d * Math.sin(th) / Math.sin(th0);
    const s1 = Math.sin(th) / Math.sin(th0);
    return quatNorm([
      a[0] * s0 + bb[0] * s1, a[1] * s0 + bb[1] * s1,
      a[2] * s0 + bb[2] * s1, a[3] * s0 + bb[3] * s1
    ]);
  }
  function quatConj(q) { return [-q[0], -q[1], -q[2], q[3]]; }
  /** Той самий поворот може бути записаний як q і як −q; зводимо до одного знака */
  function quatAlign(q, ref) {
    const d = q[0] * ref[0] + q[1] * ref[1] + q[2] * ref[2] + q[3] * ref[3];
    return d < 0 ? [-q[0], -q[1], -q[2], -q[3]] : q;
  }
  /** Частка повороту: q^k, тобто «зроби k від цього обертання» */
  function quatPow(q, k) { return quatSlerp([0, 0, 0, 1], q, k); }

  /**
   * Інтегрування кутової швидкості (рад/с у системі пристрою) за час dt.
   * Точна експонента, а не наближення малого кута: при різкому повороті
   * телефона наближення дає помітну помилку саме тоді, коли вона найгірша.
   */
  function quatIntegrate(q, wx, wy, wz, dt) {
    const n = Math.sqrt(wx * wx + wy * wy + wz * wz);
    if (n < 1e-9 || !isFinite(n)) return q.slice();
    const half = n * dt / 2, s = Math.sin(half) / n;
    const dq = [wx * s, wy * s, wz * s, Math.cos(half)];
    return quatNorm(quatMul(q, dq));   // швидкість у системі тіла — множимо справа
  }

  /**
   * Розклад повороту на «закрутку» навколо заданої осі і «мах» упоперек неї.
   *
   * Навіщо: похибка орієнтації має два різні джерела. Нахил дає акселерометр
   * (гравітація — надійна, майже без шуму), азимут дає магнітометр (шумний,
   * а коли телефон піднято в небо — ще й погано визначений). Розклавши
   * похибку, нахил можна виправляти швидко, а азимут — повільно.
   */
  function quatTwistSwing(q, axis) {
    const a = axis || [0, 0, 1];
    const proj = q[0] * a[0] + q[1] * a[1] + q[2] * a[2];
    let tw = [a[0] * proj, a[1] * proj, a[2] * proj, q[3]];
    const n = Math.sqrt(tw[0] * tw[0] + tw[1] * tw[1] + tw[2] * tw[2] + tw[3] * tw[3]);
    if (n < 1e-8) tw = [0, 0, 0, 1]; else tw = [tw[0] / n, tw[1] / n, tw[2] / n, tw[3] / n];
    const sw = quatNorm(quatMul(q, quatConj(tw)));
    return { twist: tw, swing: sw };
  }

  /**
   * Комплементарний фільтр: швидкий гіроскоп + повільна прив'язка до світу.
   *
   * qGyro — те, що напророкував гіроскоп (гладке, але спливає);
   * qAbs  — абсолютний вимір (правильний у середньому, але смикається);
   * kTilt — яку частку похибки нахилу виправити цього кроку;
   * kYaw  — те саме для азимута, звичайно набагато менше.
   *
   * Саме через це купол перестає стрибати: ривок магнітометра розмазується
   * на секунди, а справжній поворот телефона проходить миттєво, бо його
   * веде гіроскоп, а не вимір.
   */
  function complementaryStep(qGyro, qAbs, kTilt, kYaw) {
    const g = quatNorm(qGyro);
    const a = quatAlign(quatNorm(qAbs), g);
    const err = quatMul(a, quatConj(g));            // похибка у світовій системі
    const { twist, swing } = quatTwistSwing(quatAlign(err, [0, 0, 0, 1]), [0, 0, 1]);
    // порядок важливий: розклад дає err = swing ⊗ twist, і частки треба
    // складати так само, інакше при k=1 вийде не абсолютний вимір
    const corr = quatMul(quatPow(swing, clamp(kTilt, 0, 1)), quatPow(twist, clamp(kYaw, 0, 1)));
    return quatNorm(quatMul(corr, g));
  }

  /**
   * Медіана набору кутів (градуси, зі знаком, ±180).
   *
   * Навіщо медіана, а не середнє: магнітометр раз у раз віддає одиничний
   * дикий відлік. Середнє такий відлік розмазує по всьому вікну, медіана
   * викидає його повністю, а на справжню зміну реагує за пів вікна.
   */
  function medianAngle(arr) {
    const n = arr.length;
    if (!n) return 0;
    if (n === 1) return arr[0];
    // кути кільцеві, тому крутимо все відносно першого і беремо звичайну медіану
    const base = arr[0];
    const rel = arr.map(a => norm180(a - base)).sort((a, b) => a - b);
    const m = n % 2 ? rel[(n - 1) >> 1] : (rel[n / 2 - 1] + rel[n / 2]) / 2;
    return norm180(base + m);
  }

  /** Кут закрутки навколо вертикалі, градуси зі знаком — для діагностики */
  function yawErrorDeg(qA, qB) {
    const err = quatAlign(quatMul(quatNorm(qA), quatConj(quatNorm(qB))), [0, 0, 0, 1]);
    const tw = quatTwistSwing(err, [0, 0, 1]).twist;
    return norm180(2 * Math.atan2(tw[2], tw[3]) * R2D);
  }

  /**
   * Поворот навколо світової вертикалі, який ДОДАЄ deg до азимута.
   * (Обертання проти годинникової стрілки навколо Z зменшує компасний азимут,
   * тому знак тут перевернутий — щоб на місці виклику не було плутанини.)
   * Застосовується зліва: quatMul(quatYawAz(d), q).
   */
  function quatYawAz(deg) {
    const h = -deg * D2R / 2;
    return [0, 0, Math.sin(h), Math.cos(h)];
  }

  /**
   * Азимут і кут місця для пікселя кадру за орієнтацією-кватерніоном.
   * dx, dy — зсув від центра кадру в пікселях (dy вниз додатний).
   */
  function quatPixelToAzEl(q, dx, dy, fpx, screenAngle) {
    const s = (screenAngle || 0) * D2R;
    const cs = Math.cos(s), sn = Math.sin(s);
    const rx = dx * cs + dy * sn;
    const ry = -dx * sn + dy * cs;
    const R = quatToMatrix(q);
    return vecToAzEl(matVec(R, [rx, -ry, -fpx]));
  }
  /** Зворотне: куди в кадрі впаде напрямок. behind — позаду камери. */
  function quatAzElToPixel(q, azDeg, elDeg, fpx, screenAngle) {
    return matAzElToPixel(quatToMatrix(q), azDeg, elDeg, fpx, screenAngle);
  }
  /**
   * Те саме, але з уже готовою матрицею. Для сітки й горизонту доводиться
   * проєктувати сотні точок за кадр — будувати матрицю щоразу було б марно.
   */
  function matAzElToPixel(R, azDeg, elDeg, fpx, screenAngle) {
    const a = azDeg * D2R, e = elDeg * D2R;
    const w = [Math.sin(a) * Math.cos(e), Math.cos(a) * Math.cos(e), Math.sin(e)];
    const d = [
      R[0][0] * w[0] + R[1][0] * w[1] + R[2][0] * w[2],
      R[0][1] * w[0] + R[1][1] * w[1] + R[2][1] * w[2],
      R[0][2] * w[0] + R[1][2] * w[1] + R[2][2] * w[2]
    ];
    const theta = Math.acos(clamp(-d[2], -1, 1));
    const behind = d[2] > -0.06;
    const lam = fpx / Math.max(0.06, -d[2]);
    const rx = d[0] * lam, ry = -d[1] * lam;
    const s = (screenAngle || 0) * D2R;
    const cs = Math.cos(s), sn = Math.sin(s);
    return { x: rx * cs - ry * sn, y: rx * sn + ry * cs, behind, theta: theta * R2D };
  }

  /* ---------- 2. Геодезія ----------------------------------- */
  const EARTH_R = 6378137.0;
  const metersPerDegLat = lat =>
    111132.92 - 559.82 * Math.cos(2 * lat * D2R) + 1.175 * Math.cos(4 * lat * D2R);
  const metersPerDegLon = lat =>
    111412.84 * Math.cos(lat * D2R) - 93.5 * Math.cos(3 * lat * D2R);

  /** Локальні ENU-метри -> WGS84 (плоска апроксимація, коректна до ~60 км) */
  function enuToLatLon(lat0, lon0, e, n) {
    return {
      lat: lat0 + n / metersPerDegLat(lat0),
      lon: lon0 + e / metersPerDegLon(lat0)
    };
  }
  function latLonToEnu(lat0, lon0, lat, lon) {
    return {
      e: (lon - lon0) * metersPerDegLon(lat0),
      n: (lat - lat0) * metersPerDegLat(lat0)
    };
  }
  /** Точка за азимутом і дальністю */
  function destPoint(lat0, lon0, azDeg, distM) {
    const a = azDeg * D2R;
    return enuToLatLon(lat0, lon0, distM * Math.sin(a), distM * Math.cos(a));
  }
  function bearingDist(lat1, lon1, lat2, lon2) {
    const { e, n } = latLonToEnu(lat1, lon1, lat2, lon2);
    return { az: norm360(Math.atan2(e, n) * R2D), dist: hyp(e, n) };
  }

  /* ---------- 2b. Велике коло, кривизна і рефракція ----------
     Плоска апроксимація вище чудова до десятків кілометрів, але на 150 км
     по довготі вона дає 471 м похибки (0.31 %). Для зовнішніх треків, які
     приходять за сотню кілометрів, рахуємо чесно по сфері. */
  function gcBearingDist(lat1, lon1, lat2, lon2) {
    const p1 = lat1 * D2R, p2 = lat2 * D2R;
    const dp = (lat2 - lat1) * D2R, dl = (lon2 - lon1) * D2R;
    const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
    const dist = 2 * Math.asin(Math.min(1, Math.sqrt(a))) * EARTH_MEAN;
    const y = Math.sin(dl) * Math.cos(p2);
    const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
    return { az: norm360(Math.atan2(y, x) * R2D), dist };
  }
  const EARTH_MEAN = 6371008.8;
  const REFRACTION_K = 0.13;                 // стандартна атмосферна рефракція
  const EARTH_EFF = EARTH_MEAN / (1 - REFRACTION_K);

  /**
   * Кут місця з урахуванням кривизни Землі й рефракції.
   * Це не дрібниця: на 60 км поправка зʼїдає 22 % кута, на 100 км — 61 %,
   * а на 150 км ціль на висоті 1118 м узагалі ЗА горизонтом, хоча гола
   * геометрія малювала б її на +0.43°.
   */
  function elevationTo(distM, hTarget, hObs) {
    const dh = hTarget - (hObs || 0);
    const geo = Math.atan2(dh, Math.max(distM, 1)) * R2D;
    const drop = (distM / (2 * EARTH_EFF)) * R2D;
    return geo - drop;
  }
  /** Наскільки далеко видно ціль такої висоти, перш ніж вона сховається за обрій */
  function horizonDistance(hM) {
    return Math.sqrt(2 * EARTH_EFF * Math.max(hM, 0));
  }

  /* ---------- 2c. Азимутальна рівновіддалена проєкція ----------
     Гномонічна (те, що робить об'єктив) на краю широкого поля розтягує
     картинку в рази: на 55° від осі радіальний масштаб уже ×3.0, на 70° — ×8.6.
     Для купола без камери це неприйнятно: однакові 10° біля центра і біля краю
     мали б займати різну кількість пікселів, і сітка бреше. Тому там, де
     камери немає і підлаштовуватись під об'єктив не треба, беремо проєкцію,
     у якій кутова відстань від осі лінійно дає радіус на екрані. */
  function matAzElToPixelEq(R, azDeg, elDeg, fpx, screenAngle) {
    const a = azDeg * D2R, e = elDeg * D2R;
    const w = [Math.sin(a) * Math.cos(e), Math.cos(a) * Math.cos(e), Math.sin(e)];
    const d = [
      R[0][0] * w[0] + R[1][0] * w[1] + R[2][0] * w[2],
      R[0][1] * w[0] + R[1][1] * w[1] + R[2][1] * w[2],
      R[0][2] * w[0] + R[1][2] * w[1] + R[2][2] * w[2]
    ];
    const theta = Math.acos(clamp(-d[2], -1, 1));      // кут від осі погляду
    const r = fpx * theta;
    const hx = d[0], hy = -d[1];
    const n = Math.hypot(hx, hy);
    let rx, ry;
    if (n < 1e-9) { rx = 0; ry = 0; }
    else { rx = hx / n * r; ry = hy / n * r; }
    const s = (screenAngle || 0) * D2R;
    const cs = Math.cos(s), sn = Math.sin(s);
    return {
      x: rx * cs - ry * sn, y: rx * sn + ry * cs,
      behind: theta > 100 * D2R, theta: theta * R2D
    };
  }

  /* ---------- 3. Магнітне схилення (спрощено, регіон UA) ----- */
  /* Лінійна апроксимація WMM для 44–53°N / 22–41°E, епоха 2025.0,
     віковий хід ~ +0.09°/рік. Похибка порядку ±0.5°.
     Поза цим прямокутником повертає null — тоді потрібне ручне введення. */
  function magDeclination(lat, lon, year) {
    if (lat < 42 || lat > 55 || lon < 20 || lon > 43) return null;
    const base = 8.60 + 0.205 * (lon - 30.5) + 0.060 * (lat - 50.45);
    const dt = (year == null ? 2025 : year) - 2025.0;
    return +(base + 0.09 * dt).toFixed(2);
  }

  /* ---------- 4. UTM / MGRS --------------------------------- */
  function latLonToUtm(lat, lon) {
    const a = 6378137.0, f = 1 / 298.257223563;
    const k0 = 0.9996, e2 = f * (2 - f), ep2 = e2 / (1 - e2);
    let zone = Math.floor((lon + 180) / 6) + 1;
    if (lat >= 56 && lat < 64 && lon >= 3 && lon < 12) zone = 32;
    if (lat >= 72 && lat < 84) {
      if (lon >= 0 && lon < 9) zone = 31; else if (lon < 21) zone = 33;
      else if (lon < 33) zone = 35; else if (lon < 42) zone = 37;
    }
    const lon0 = (zone - 1) * 6 - 180 + 3;
    const p = lat * D2R, l = (lon - lon0) * D2R;
    const N = a / Math.sqrt(1 - e2 * Math.sin(p) ** 2);
    const T = Math.tan(p) ** 2, C = ep2 * Math.cos(p) ** 2, A = Math.cos(p) * l;
    const M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 ** 3 / 256) * p
      - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * p)
      + (15 * e2 * e2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * p)
      - (35 * e2 ** 3 / 3072) * Math.sin(6 * p));
    const easting = k0 * N * (A + (1 - T + C) * A ** 3 / 6
      + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * A ** 5 / 120) + 500000;
    let northing = k0 * (M + N * Math.tan(p) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * A ** 4 / 24
      + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * A ** 6 / 720));
    if (lat < 0) northing += 10000000;
    return { zone, easting, northing, hemisphere: lat >= 0 ? 'N' : 'S' };
  }
  const LAT_BANDS = 'CDEFGHJKLMNPQRSTUVWXX';
  const latBand = lat => lat >= -80 && lat <= 84 ? LAT_BANDS[Math.floor((lat + 80) / 8)] : '';
  const E_SET = ['ABCDEFGH', 'JKLMNPQR', 'STUVWXYZ'];
  const N_SET = ['ABCDEFGHJKLMNPQRSTUV', 'FGHJKLMNPQRSTUVABCDE'];

  /** MGRS з точністю 1 м (5+5 цифр) */
  function toMGRS(lat, lon, digits) {
    const d = digits == null ? 5 : digits;
    const u = latLonToUtm(lat, lon);
    const band = latBand(lat);
    if (!band) return null;
    const col = Math.floor(u.easting / 100000);
    const row = Math.floor(u.northing / 100000) % 20;
    const colLetter = E_SET[(u.zone - 1) % 3][clamp(col - 1, 0, 7)];
    const rowLetter = N_SET[(u.zone - 1) % 2][row];
    const p = Math.pow(10, 5 - d);
    const e = String(Math.floor((u.easting % 100000) / p)).padStart(d, '0');
    const n = String(Math.floor((u.northing % 100000) / p)).padStart(d, '0');
    return `${u.zone}${band} ${colLetter}${rowLetter} ${e} ${n}`;
  }

  function toDMS(v, isLat) {
    const hemi = isLat ? (v >= 0 ? 'Пн' : 'Пд') : (v >= 0 ? 'Сх' : 'Зх');
    const a = Math.abs(v), deg = Math.floor(a);
    const minF = (a - deg) * 60, min = Math.floor(minF);
    const sec = (minF - min) * 60;
    return `${deg}°${String(min).padStart(2, '0')}'${sec.toFixed(1).padStart(4, '0')}" ${hemi}`;
  }
  /** Формат «градуси-хвилини», як у більшості наших карток цілей */
  function toDM(v, isLat) {
    const hemi = isLat ? (v >= 0 ? 'N' : 'S') : (v >= 0 ? 'E' : 'W');
    const a = Math.abs(v), deg = Math.floor(a);
    return `${hemi}${String(deg).padStart(2, '0')}°${((a - deg) * 60).toFixed(3).padStart(6, '0')}'`;
  }

  /* ---------- 5. Методи оцінки дальності --------------------- */
  /* Кожен повертає { r, sigma, method } у метрах або null. */

  /** За відомим лінійним розміром цілі та її кутовим розміром у кадрі */
  function rangeBySize(sizeM, sizePx, fpx, opts) {
    const o = opts || {};
    if (!(sizeM > 0) || !(sizePx > 0.5) || !(fpx > 0)) return null;
    const theta = 2 * Math.atan2(sizePx / 2, fpx);
    const r = sizeM / (2 * Math.tan(theta / 2));
    // похибки: ±1.5 px на вимірі рамки та ±20 % на табличному розмірі
    const dPx = o.pxErr == null ? 1.5 : o.pxErr;
    const relSize = o.sizeRel == null ? 0.20 : o.sizeRel;
    const rel = Math.sqrt((dPx / sizePx) ** 2 + relSize ** 2);
    return { r, sigma: r * rel, method: 'size' };
  }

  /** За висотою польоту та кутом місця: похила дальність = Δh / sin(el) */
  function rangeByAltitude(targetAltM, observerAltM, elDeg, opts) {
    const o = opts || {};
    const dh = targetAltM - observerAltM;
    if (!(dh > 0)) return null;
    if (elDeg < 1.0) return null;           // біля горизонту метод вироджується
    const s = Math.sin(elDeg * D2R);
    const r = dh / s;
    const dAlt = o.altErr == null ? Math.max(150, dh * 0.35) : o.altErr;
    const dEl = o.elErr == null ? 1.5 : o.elErr;            // градуси
    const dr_dh = 1 / s;
    const dr_del = -dh * Math.cos(elDeg * D2R) / (s * s) * D2R;
    const sigma = Math.sqrt((dr_dh * dAlt) ** 2 + (dr_del * dEl) ** 2);
    return { r, sigma, method: 'alt' };
  }

  /** Швидкість звуку з поправкою на температуру повітря */
  const soundSpeed = tempC => 331.3 * Math.sqrt(1 + (tempC == null ? 15 : tempC) / 273.15);

  /** Акустична затримка: різниця «побачив» / «почув» */
  function rangeByAcoustic(dtSec, tempC, opts) {
    const o = opts || {};
    if (!(dtSec > 0.2)) return null;
    const c = soundSpeed(tempC);
    const r = c * dtSec;
    const dT = o.tapErr == null ? 0.4 : o.tapErr;   // реакція оператора
    return { r, sigma: c * dT, method: 'acoustic' };
  }

  /**
   * Тріангуляція: перетин двох пеленгів.
   * A — власна точка, B — точка другого спостерігача (або власна попередня).
   * Повертає точку цілі, дальність від A та оцінку похибки.
   */
  function triangulate(A, B, azA, azB, bearErrDeg) {
    const err = bearErrDeg == null ? 2.0 : bearErrDeg;
    const { e: be, n: bn } = latLonToEnu(A.lat, A.lon, B.lat, B.lon);
    const baseline = hyp(be, bn);
    if (baseline < 20) return null;                       // база замала
    const ua = [Math.sin(azA * D2R), Math.cos(azA * D2R)];
    const ub = [Math.sin(azB * D2R), Math.cos(azB * D2R)];
    const den = ua[0] * ub[1] - ua[1] * ub[0];            // векторний добуток
    if (Math.abs(den) < 1e-6) return null;                // пеленги паралельні
    const t = (be * ub[1] - bn * ub[0]) / den;
    if (t <= 0) return null;                              // перетин позаду
    const e = ua[0] * t, n = ua[1] * t;
    const r = hyp(e, n);
    // похибка ~ r·Δθ / sin(кут перетину)
    const cross = Math.abs(Math.asin(clamp(den, -1, 1)));
    const sigma = r * (err * D2R) / Math.max(Math.sin(cross), 0.05);
    const pt = enuToLatLon(A.lat, A.lon, e, n);
    return { r, sigma, method: 'triang', e, n, lat: pt.lat, lon: pt.lon, baseline, crossDeg: cross * R2D };
  }

  /** Зважена фузія оцінок за оберненою дисперсією */
  function fuseRanges(list) {
    const good = (list || []).filter(x => x && isFinite(x.r) && x.r > 0 && isFinite(x.sigma) && x.sigma > 0);
    if (!good.length) return null;
    let wsum = 0, acc = 0;
    for (const g of good) { const w = 1 / (g.sigma * g.sigma); wsum += w; acc += w * g.r; }
    const r = acc / wsum;
    const sigma = Math.sqrt(1 / wsum);
    // якщо оцінки суперечать одна одній — розширюємо коридор
    let chi = 0;
    for (const g of good) chi += ((g.r - r) / g.sigma) ** 2;
    const dof = Math.max(good.length - 1, 1);
    const infl = Math.sqrt(Math.max(1, chi / dof));
    return { r, sigma: sigma * infl, method: 'fused', used: good.map(g => g.method), consistency: chi / dof };
  }

  /* ---------- 6. Фільтр стану цілі (α-β) --------------------- */
  function makeTrack(alpha, beta) {
    return {
      alpha: alpha == null ? 0.55 : alpha,
      beta: beta == null ? 0.12 : beta,
      init: false, t: 0,
      p: [0, 0, 0],   // ENU-позиція, м
      v: [0, 0, 0],   // швидкість, м/с
      hist: []
    };
  }
  function trackUpdate(tr, t, meas) {
    if (!tr.init) {
      tr.init = true; tr.t = t; tr.p = meas.slice(); tr.v = [0, 0, 0];
      tr.hist = [{ t, p: meas.slice() }];
      return tr;
    }
    const dt = clamp((t - tr.t) / 1000, 0.001, 5);
    tr.t = t;
    const pred = [tr.p[0] + tr.v[0] * dt, tr.p[1] + tr.v[1] * dt, tr.p[2] + tr.v[2] * dt];
    const res = [meas[0] - pred[0], meas[1] - pred[1], meas[2] - pred[2]];
    for (let i = 0; i < 3; i++) {
      tr.p[i] = pred[i] + tr.alpha * res[i];
      tr.v[i] = tr.v[i] + (tr.beta / dt) * res[i];
    }
    tr.hist.push({ t, p: tr.p.slice() });
    if (tr.hist.length > 600) tr.hist.shift();
    return tr;
  }
  /** Похідні параметри руху цілі */
  function trackDerived(tr) {
    const [pe, pn, pu] = tr.p, [ve, vn, vu] = tr.v;
    const ground = hyp(pe, pn);
    const slant = hyp(pe, pn, pu);
    const speed = hyp(ve, vn);                 // шляхова, м/с
    const heading = norm360(Math.atan2(ve, vn) * R2D);
    const closing = slant > 1 ? -(pe * ve + pn * vn + pu * vu) / slant : 0;
    const v2 = ve * ve + vn * vn + vu * vu;
    let tcpa = null, dcpa = null;
    if (v2 > 0.25) {
      tcpa = -(pe * ve + pn * vn + pu * vu) / v2;
      if (tcpa > 0) {
        dcpa = hyp(pe + ve * tcpa, pn + vn * tcpa, pu + vu * tcpa);
      } else { tcpa = null; }
    }
    return {
      ground, slant, alt: pu, speed, speedKmh: speed * 3.6,
      vertical: vu, heading, closing,
      az: norm360(Math.atan2(pe, pn) * R2D),
      el: slant > 1 ? Math.asin(clamp(pu / slant, -1, 1)) * R2D : 0,
      tcpa, dcpa
    };
  }

  /* ---------- 7. Обмін даними спостерігачів ------------------ */
  /* Компактний рядок: NBK1|lat|lon|az|el|hhmmss  (диктується голосом) */
  function encodeFix(fix) {
    const p = [
      'NBK1',
      fix.lat.toFixed(5), fix.lon.toFixed(5),
      norm360(fix.az).toFixed(1), fix.el.toFixed(1),
      fix.alt == null ? '' : Math.round(fix.alt),
      fix.ts == null ? '' : String(fix.ts).slice(-6)
    ];
    return p.join('|');
  }
  function decodeFix(str) {
    if (!str) return null;
    const p = String(str).trim().split('|');
    if (p[0] !== 'NBK1' || p.length < 5) return null;
    const lat = parseFloat(p[1]), lon = parseFloat(p[2]);
    const az = parseFloat(p[3]), el = parseFloat(p[4]);
    if (![lat, lon, az, el].every(isFinite)) return null;
    if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
    return { lat, lon, az: norm360(az), el, alt: p[5] ? parseFloat(p[5]) : null, ts: p[6] || null };
  }

      src: 'Wikipedia — розмах 14.36 м, довжина 15.53 м.',

      span: 35.8, len: 37.6, alt: [8000, 12000], spd: [780, 900],
      note: 'інверсійний слід, ешелон — не ціль',
      src: 'Wikipedia — розмах 35.8 м, довжина 37.57 м.',
      url: 'https://en.wikipedia.org/wiki/Airbus_A320_family'
    },
    {
      id: 'balloon', name: 'Аеростат / метеозонд', dim: 'діаметр',
      span: 2.0, len: 2.0, alt: [1000, 20000], spd: [0, 60],
      note: 'рухається строго за вітром',
      src: 'Типовий діаметр метеозонда при наборі висоти.',

    },
    {
      id: 'bird', name: 'Птах', dim: 'розмах',
      span: 1.2, len: 0.7, alt: [10, 1500], spd: [20, 80],
      note: 'найчастіша хибна ціль — махає крилами, пляма пульсує',
      src: 'Розмах великого хижака або лелеки, орієнтовно.',
      url: ''
    },
    {
      id: 'unknown', name: 'Невідома ціль', dim: 'розмах',
      span: 2.5, len: 2.5, alt: [500, 3000], spd: [0, 1000],
      note: 'розмір задається вручну',
      src: 'Задається оператором.',
      url: ''
    }
  ];
  const catalogById = id => CATALOG.find(c => c.id === id) || CATALOG[CATALOG.length - 1];

  /**
   * Видимий габарит цілі залежить від ракурсу.
   * aspect: 'front' — бачимо розмах, 'profile' — довжину, 'auto' — не знаємо.
   * Повертає розмір у метрах і відносну похибку цього припущення.
   */
  function apparentSize(cat, aspect) {
    const span = cat.span, len = cat.len;
    if (aspect === 'front') return { m: span, rel: 0.15, label: 'розмах' };
    if (aspect === 'profile') return { m: len, rel: 0.15, label: 'довжина' };
    // ракурс невідомий: беремо середнє геометричне і платимо за це похибкою
    const m = Math.sqrt(span * len);
    const spread = Math.max(span, len) / Math.min(span, len);
    return { m, rel: clamp(0.15 + 0.25 * Math.log(spread), 0.15, 0.55), label: 'ракурс невідомий' };
  }

  /** Підказка типу цілі за виміряними швидкістю/висотою */
  function classify(speedKmh, altM) {
    const out = [];
    for (const c of CATALOG) {
      if (c.id === 'unknown') continue;
      let score = 0;
      if (speedKmh != null && isFinite(speedKmh)) {
        const [a, b] = c.spd;
        score += speedKmh >= a * 0.7 && speedKmh <= b * 1.4 ? 1 : 0;
      }
      if (altM != null && isFinite(altM)) {
        const [a, b] = c.alt;
        score += altM >= a * 0.5 && altM <= b * 1.6 ? 1 : 0;
      }
      if (score > 0) out.push({ id: c.id, name: c.name, score });
    }
    return out.sort((x, y) => y.score - x.score).slice(0, 3);
  }

  /* ---------- 8a2. Автовизначення типу і дальності ------------ */
  /**
   * Єдиний вимір, який дає одна камера — КУТОВИЙ розмір цілі. Абсолютного
   * масштабу в моноскопії немає в принципі: та сама цятка може бути Mavic'ом
   * за 500 м і Shahed'ом за 3 км. Тому масштаб замикається через фізику —
   * для кожного типу з каталогу беремо його габарит, отримуємо дальність,
   * з неї висоту (через кут місця) і поперечну швидкість (через кутову),
   * і питаємо, наскільки це схоже на ТТХ того ж типу.
   *
   * Оцінка логнормальна: 1σ припадає на край діапазону з каталогу, тож
   * гіпотези не просто «проходять/не проходять», а ранжуються.
   *
   * m = { thetaDeg, el, omega (°/с), obsAlt, pxErrRel, harmonic }
   */
  function autoIdentify(m, opts) {
    if (!m || !(m.thetaDeg > 0)) return null;
    const o = opts || {};
    const theta = m.thetaDeg * D2R;
    const obsAlt = m.obsAlt || 0;
    const relPx = m.pxErrRel == null ? 0.15 : m.pxErrRel;
    // логнормальний штраф: 0 у центрі діапазону, 1 на його краю
    const band = (v, lo, hi, lenient) => {
      const l = Math.max(lo, 1e-3), h = Math.max(hi, l * 1.05);
      const mid = Math.sqrt(l * h), half = Math.log(Math.sqrt(h / l));
      if (!(v > 0)) return lenient ? 0.5 : 4;
      const z = Math.log(v / mid) / Math.max(half, 0.15);
      return (lenient && z < 0) ? 0.25 * z * z : z * z;
    };
    const list = [];
    for (const c of CATALOG) {
      if (c.id === 'unknown') continue;
      for (const aspect of ['front', 'profile']) {
        const L = aspect === 'front' ? c.span : c.len;
        if (!(L > 0)) continue;
        if (aspect === 'profile' && Math.abs(c.len - c.span) < 0.05) continue;
        const r = L / theta;
        if (r < 25 || r > 60000) continue;
        // ТТХ у каталозі — висота НАД ЗЕМЛЕЮ, тож і рівняти треба з нею,
        // інакше висота спостерігача над рівнем моря зсуває всю оцінку
        const agl = r * Math.sin(m.el * D2R);
        const alt = obsAlt + agl;
        const vKmh = (m.omega == null ? 0 : m.omega) * D2R * r * 3.6;

        // висота — суворо, швидкість — м'яко знизу: радіальну складову камера не бачить
        let pen = band(agl, c.alt[0], c.alt[1], false) + band(vKmh, c.spd[0], c.spd[1], true);
        if (agl < 0) pen += 8;
        let score = Math.exp(-pen);
        /* Родові класи («крило») не мають перебивати конкретні моделі:
           їхня апріорна вага менша, і вони виходять уперед лише там, де
           жодна модель не тримає ні висоти, ні швидкості. */
        if (c.generic) score *= c.generic;
        // акустика: рівновіддалені гармоніки — підпис поршневого двигуна
        if (m.harmonic && m.harmonic.score > 0.3) score *= c.piston ? 4 : 0.3;
        const sigma = r * Math.sqrt(relPx * relPx + 0.12 * 0.12);
        list.push({
          id: c.id, name: c.name, aspect, L, r, sigma, alt, agl, vKmh,
          score, pen, dim: aspect === 'front' ? 'розмах' : 'довжина'
        });
      }
    }
    if (!list.length) return null;
    const tot = list.reduce((s2, x) => s2 + x.score, 0) || 1;
    for (const x of list) x.p = x.score / tot;
    list.sort((a2, b2) => b2.p - a2.p);
    const best = list[0];
    // чи є конкурент з СУТТЄВО іншою дальністю — саме це треба показати оператору
    const rival = list.find(x => x.p > best.p * 0.45 && Math.abs(Math.log(x.r / best.r)) > 0.4);
    // Коридор дальності будуємо по 80% довірчій множині: беремо гіпотези за
    // спаданням правдоподібності, поки не набереться 80% маси, і дивимось
    // розкид їхніх дальностей. Довгий хвіст малоймовірних варіантів коридор
    // не роздуває, а справжня неоднозначність масштабу — роздуває.
    let acc2 = 0, lo = Infinity, hi = 0;
    for (const x of list) {
      lo = Math.min(lo, x.r); hi = Math.max(hi, x.r);
      acc2 += x.p;
      if (acc2 >= 0.8) break;
    }
    return {
      band: { lo, hi },
      best, rival: rival || null, list: list.slice(0, 6),
      // дальність умовна щодо обраного типу — інакше змішувати несумісні
      // гіпотези в одне число нечесно
      range: { r: best.r, sigma: best.sigma, method: 'auto', used: [best.name] },
      ambiguous: !!rival
    };
  }

  /* ---------- 8b. Компенсація повороту камери ---------------- */
  /**
   * Наскільки зсунеться картинка в кадрі, якщо камера повернулась
   * на dAz по азимуту і dEl по куту місця (обидва в градусах).
   * Саме цей зсув треба відняти з фонової моделі, інакше при панорамуванні
   * «рухомим» стає все — і дерева, і кущі, і паркан.
   */
  function pixelShiftForRotation(dAzDeg, dElDeg, elDeg, fpx) {
    const dx = -fpx * Math.tan(clamp(dAzDeg * Math.cos(elDeg * D2R), -40, 40) * D2R);
    const dy = fpx * Math.tan(clamp(dElDeg, -40, 40) * D2R);
    return { dx, dy };
  }

  /** Кутова відстань між двома напрямками (азимут/кут місця), градуси */
  function angSep(az1, el1, az2, el2) {
    const a1 = az1 * D2R, e1 = el1 * D2R, a2 = az2 * D2R, e2 = el2 * D2R;
    const c = Math.sin(e1) * Math.sin(e2) + Math.cos(e1) * Math.cos(e2) * Math.cos(a1 - a2);
    return Math.acos(clamp(c, -1, 1)) * R2D;
  }

  /* ---------- 8b2. Апроксимація кутового треку ---------------- */
  /**
   * Метод найменших квадратів по азимуту й куту місця.
   * Просте відношення «пряма відстань / довжина шляху» тут не працює:
   * центроїд плями дрижить на пів-пікселя, і навіть рівний політ отримує
   * низьку оцінку. Лінійна апроксимація дивиться на форму треку, а не на
   * покроковий шум: у рівного руху залишок малий відносно пройденого шляху,
   * у нерухомого об'єкта — навпаки, весь трек і є шум.
   * Повертає { omega (°/с), straight (0..1), res, span, dAz, dEl }.
   */
  function fitAngularTrack(hist) {
    const n = hist ? hist.length : 0;
    if (n < 4) return null;
    const t0 = hist[0].t;
    // розгортаємо азимут, щоб перехід через 360° не рвав апроксимацію
    const unw = new Array(n);
    let acc = hist[0].az, prev = hist[0].az;
    unw[0] = acc;
    for (let i = 1; i < n; i++) { acc += norm180(hist[i].az - prev); prev = hist[i].az; unw[i] = acc; }
    const cosEl = Math.cos(hist[(n / 2) | 0].el * D2R);
    let st = 0, stt = 0, sa = 0, sat = 0, se = 0, set = 0;
    for (let i = 0; i < n; i++) {
      const tt = (hist[i].t - t0) / 1000;
      st += tt; stt += tt * tt;
      sa += unw[i]; sat += unw[i] * tt;
      se += hist[i].el; set += hist[i].el * tt;
    }
    const den = n * stt - st * st;
    if (!(den > 1e-9)) return null;
    const bAz = (n * sat - st * sa) / den, aAz = (sa - bAz * st) / n;
    const bEl = (n * set - st * se) / den, aEl = (se - bEl * st) / n;
    let res = 0;
    for (let i = 0; i < n; i++) {
      const tt = (hist[i].t - t0) / 1000;
      const dA = (unw[i] - (aAz + bAz * tt)) * cosEl;
      const dE = hist[i].el - (aEl + bEl * tt);
      res += dA * dA + dE * dE;
    }
    res = Math.sqrt(res / n);
    const span = (hist[n - 1].t - t0) / 1000;
    const omega = hyp(bAz * cosEl, bEl);
    const net = omega * span;
    // 0.15° — «підлога» шуму: нижче неї немає сенсу вимагати ідеальної прямої
    const straight = clamp(1 - res / (0.25 * net + 0.15), 0, 1);
    return { omega, straight, res, span, net, dAz: bAz, dEl: bEl };
  }

  /* ---------- 8c. Гармонічний крок у спектрі ----------------- */
  /**
   * Автокореляція амплітудного спектра: поршневий двигун дає гребінку
   * рівновіддалених гармонік, і крок цієї гребінки — стійка ознака.
   * Для Shahed-136 у відкритому дослідженні крок ~107 Гц.
   * Повертає { spacing, score } або null.
   */
  function harmonicSpacing(mag, hzPerBin, loHz, hiHz, minSpacingHz, maxSpacingHz) {
    if (!mag || !hzPerBin) return null;
    const lo = Math.max(1, Math.floor((loHz == null ? 150 : loHz) / hzPerBin));
    const hi = Math.min(mag.length - 1, Math.floor((hiHz == null ? 2000 : hiHz) / hzPerBin));
    const n = hi - lo;
    const minSp = minSpacingHz == null ? 50 : minSpacingHz;
    // вікно мусить вміщати щонайменше три гармоніки, інакше гребінку не видно
    if (n < 48 || n * hzPerBin < 3 * minSp) return null;
    // прибираємо середнє, щоб автокореляція ловила періодичність, а не рівень
    let mean = 0;
    for (let i = lo; i < hi; i++) mean += mag[i];
    mean /= n;
    let energy = 0;
    const x = new Float32Array(n);
    for (let i = 0; i < n; i++) { x[i] = mag[lo + i] - mean; energy += x[i] * x[i]; }
    if (energy < 1e-6) return null;
    const minLag = Math.max(2, Math.floor(minSp / hzPerBin));
    const maxLag = Math.min(n - 4, Math.floor((maxSpacingHz == null ? 250 : maxSpacingHz) / hzPerBin));
    if (maxLag <= minLag) return null;
    let bestLag = 0, best = 0;
    for (let lag = minLag; lag <= maxLag; lag++) {
      let s = 0;
      for (let i = 0; i + lag < n; i++) s += x[i] * x[i + lag];
      const norm = s / energy;
      if (norm > best) { best = norm; bestLag = lag; }
    }
    if (!bestLag) return null;
    return { spacing: bestLag * hzPerBin, score: clamp(best, 0, 1) };
  }

  /* ---------- 8d. Оцінка загрози ---------------------------- */
  /**
   * 0 — фон, 1 — спостереження, 2 — увага, 3 — небезпечно.
   * Рахуємо тільки за геометрією зближення, без жодних припущень про намір.
   */
  function threatLevel(d, opts) {
    if (!d) return { level: 0, label: 'нема даних', reason: '' };
    const o = opts || {};
    const nearM = o.nearM == null ? 700 : o.nearM;
    const soonS = o.soonS == null ? 90 : o.soonS;
    const closing = d.closing || 0;
    const has = d.tcpa != null && d.dcpa != null;
    if (has && d.dcpa < nearM && d.tcpa < soonS && closing > 10)
      return { level: 3, label: 'НЕБЕЗПЕЧНО', reason: 'пройде за ' + Math.round(d.dcpa) + ' м через ' + Math.round(d.tcpa) + ' с' };
    if ((has && d.dcpa < nearM * 3 && d.tcpa < soonS * 3 && closing > 3) || closing > 45)
      return { level: 2, label: 'УВАГА', reason: has ? 'зближення, CPA ' + Math.round(d.dcpa) + ' м' : 'швидке зближення' };
    if (closing > 2) return { level: 1, label: 'СПОСТЕРЕЖЕННЯ', reason: 'повільно наближається' };
    if (closing < -2) return { level: 0, label: 'ВІДХОДИТЬ', reason: '' };
    return { level: 0, label: 'ФОН', reason: '' };
  }

  /* ---------- 9. Форматери ---------------------------------- */
  function fmtDist(m) {
    if (m == null || !isFinite(m)) return '—';
    if (m < 1000) return Math.round(m) + ' м';
    if (m < 10000) return (m / 1000).toFixed(2) + ' км';
    return (m / 1000).toFixed(1) + ' км';
  }
  function fmtPM(m, s) {
    if (m == null || !isFinite(m)) return '—';
    const rel = s / m;
    const pm = s < 1000 ? Math.round(s / 10) * 10 + ' м' : (s / 1000).toFixed(1) + ' км';
    return { value: fmtDist(m), pm, rel, grade: rel < 0.15 ? 'good' : rel < 0.35 ? 'mid' : 'bad' };
  }
  const fmtAz = a => (a == null || !isFinite(a)) ? '—' : norm360(a).toFixed(1).padStart(5, '0') + '°';
  const AZ_NAMES = ['Пн', 'ПнСх', 'Сх', 'ПдСх', 'Пд', 'ПдЗх', 'Зх', 'ПнЗх'];
  const azName = a => AZ_NAMES[Math.round(norm360(a) / 45) % 8];

  return {
    D2R, R2D, clamp, norm360, norm180, hyp,
    rotMatrix, matVec, vecToAzEl, pixelToAzEl, pxToDeg, fovFromF, fFromFov,
    quatMul, quatNorm, quatFromEuler, quatToMatrix, quatAngle, quatSlerp, quatYawAz,
    quatPixelToAzEl, quatAzElToPixel, matAzElToPixel, matAzElToPixelEq,
    gcBearingDist, elevationTo, horizonDistance, EARTH_MEAN, EARTH_EFF,
    quatToEulerZXY, quatAxisDeg, medianAngle, quatConj, quatAlign, quatPow, quatIntegrate, quatTwistSwing, complementaryStep, yawErrorDeg,
    EARTH_R, metersPerDegLat, metersPerDegLon, enuToLatLon, latLonToEnu, destPoint, bearingDist,
    magDeclination, latLonToUtm, toMGRS, toDMS, toDM, latBand,
    rangeBySize, rangeByAltitude, rangeByAcoustic, soundSpeed, triangulate, fuseRanges,
    makeTrack, trackUpdate, trackDerived,
    encodeFix, decodeFix,
    CATALOG, catalogById, classify, apparentSize,
    pixelShiftForRotation, angSep, fitAngularTrack, harmonicSpacing, threatLevel, autoIdentify,
    fmtDist, fmtPM, fmtAz, azName
  };
})();

const clamp = NBK.clamp, norm360 = NBK.norm360, norm180 = NBK.norm180;

/* Налаштувань свідомо майже нема: усе, що можна визначити з фізики,
   система визначає сама. Тут лишилось тільки те, чого вона знати не може. */
const DEFAULTS = {

  headAxis: '',        // опорна вісь компаса, яку телефон показав у позах із креном: '' (вперед) або 'cam' (25_orient.js)
  night: false,
  eco: false,          // економна роздільність детектора

  grid: true,          // купольна сітка

  bg: false,          // працювати з погашеним екраном (петля тиші тримає сторінку живою)

/* Три повідомлення одночасно закривають половину неба — а небо тут і є
   робоче поле. Тому одночасно живуть максимум ДВА, найстаріше йде першим,
   а те саме повідомлення поспіль не дублюється: воно лише продовжує
   висіти. */
function toast(msg, kind, ms) {
  const box = $('#toast');
  if (!box) return;
  const last = box.lastElementChild;
  if (last && last.dataset.msg === msg) {
    clearTimeout(+last.dataset.tid || 0);
    last.dataset.tid = setTimeout(() => {
      last.style.transition = 'opacity .25s'; last.style.opacity = '0';
      setTimeout(() => last.remove(), 260);
    }, ms || 2400);
    return;
  }
  const t = document.createElement('div');
  t.className = 'tst' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  t.dataset.msg = msg;
  box.appendChild(t);
  t.dataset.tid = setTimeout(() => {
    t.style.transition = 'opacity .25s'; t.style.opacity = '0';
    setTimeout(() => t.remove(), 260);
  }, ms || 2400);
  while (box.children.length > 2) box.firstChild.remove();
}
function vibro(pattern) {
  if (!navigator.vibrate) return;
  try { navigator.vibrate(pattern); } catch (e) { }
}
let actx = null;
function beep(freq, ms, vol) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.value = 0; o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime;
    g.gain.linearRampToValueAtTime(vol == null ? 0.09 : vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (ms || 120) / 1000);
    o.start(t); o.stop(t + (ms || 120) / 1000 + 0.02);
  } catch (e) { }
}

function download(name, blobOrText, mime) {
  const blob = blobOrText instanceof Blob ? blobOrText : new Blob([blobOrText], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);

}
function stamp(d) {

}
