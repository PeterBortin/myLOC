/* коло досяжності як багатокутник: MapLibre не вміє кола в метрах */
/* Перейменовано з ringOf: у тій самій області вже була ringOf(обʼєкт) для
   контуру знімка й будівель. Оголошення функцій піднімаються, і ця перемагала
   ту — знімок у контурі заливав мапу чорним, а будівель «не було» ніде. */
function kmRing(c,km,n){
  const N=n||64,out=[];
  for(let i=0;i<=N;i++){
    const a=i/N*360;
    out.push(KostylNeptun.dest(c[0],c[1],a,km));
  }
  return out;
}

/* ── параметри позиції для рушія: однакові для нальоту й бою ── */
function pvoSpec(o){
  const sp=KostylSim.sys(o.st.sys)||{};
  const p={id:o.id,key:o.st.sys,pos:o.coords[0]};
  if(sp.sea&&o.coords.length>1)p.route=o.coords.map(c=>c.slice());
  if(sp.air){if(o.st.orbR)p.orbR=+o.st.orbR;if(o.st.altLo)p.altLo=+o.st.altLo;if(o.st.altHi)p.altHi=+o.st.altHi}
  if(o.st.load)p.load=o.st.load;
  return p;
}
/* рухомий носій — кешуємо траєкторію, поки не змінились параметри */
const MV={};
function mvOf(o){
  if(o.type==='pvo'){
    const p=pvoSpec(o),sig=JSON.stringify([p.key,p.pos,p.route,p.orbR,p.altLo,p.altHi]);
    const c=MV[o.id];if(c&&c.sig===sig)return c.mv;
    const mv=KostylSim.mover(p);MV[o.id]={sig,mv};return mv;
  }
  if(o.type==='strike'){
    const sig=JSON.stringify([o.st.wpn,o.coords[0]]),c=MV[o.id];
    if(c&&c.sig===sig)return c.mv;
    const mv=KostylSim.carrierOf({id:o.id,wpn:o.st.wpn,path:o.coords});MV[o.id]={sig,mv};return mv;
  }
  return null;
}
function isMob(o){return !!mvOf(o)}
/* годинник руху поза нальотом: той самий і для спокою, і для бою */
function wallT(){return performance.now()/1000}

function simRender(){
  if(RUN)simRosterSync();
  simEnsure();
  /* кеш траєкторій не має тримати обʼєкти, яких уже немає на мапі */
  if(Object.keys(MV).length>40)Object.keys(MV).forEach(id=>{if(!byId(id))delete MV[id]});
  const src=map.getSource(SIM_SRC); if(!src)return;
  const f=[];
  const list=S.cur&&(S.cur.type==='pvo'||S.cur.type==='strike')
    ? simList().map(o=>o.id===S.cur.id?S.cur:o).concat(S.curNew?[S.cur]:[])
    : simList();
  list.forEach(o=>{
    const sel=o.id===S.sel;
    if(o.type==='pvo'){
      const sp=KostylSim.sys(o.st.sys)||{};
      const col=o.st.color||'#64FF8F';
      const mv=mvOf(o);
      if(!mv){
        if(sp.r)f.push({type:'Feature',properties:{k:'zone',color:col},
          geometry:{type:'Polygon',coordinates:[kmRing(o.coords[0],sp.r)]}});
      } else if(mv.kind==='air'){
        f.push({type:'Feature',properties:{k:'orbit',color:col},
          geometry:{type:'LineString',coordinates:kmRing(o.coords[0],mv.orbR,48)}});
      } else if(mv.kind==='sea'){
        f.push({type:'Feature',properties:{k:'route',color:col},
          geometry:{type:'LineString',coordinates:o.coords}});
      }
      f.push({type:'Feature',properties:{k:'pt',color:col,sel:sel,id:o.id,
        name:o.name||sp.name||'ППО'},
        geometry:{type:'Point',coordinates:o.coords[0]}});
    } else {
      const sc=TERRAIN_SPECS.SPEC[o.st.wpn]||{};
      const col=o.st.color||sc.col||'#ff3b30';
      f.push({type:'Feature',properties:{k:'path',color:col},
        geometry:{type:'LineString',coordinates:o.coords}});
      const n=(o.st.salvo||1);
      f.push({type:'Feature',properties:{k:'pt',color:col,sel:sel,id:o.id,
        name:(o.name||sc.uk||'пускова')+(n>1?' ×'+n:'')},
        geometry:{type:'Point',coordinates:o.coords[0]}});
    }
  });
  /* Позначок уражень у реальному режимі більше немає: він не стріляє.
     Раніше тут малювались точки змодельованих збиттів по живих цілях —
     разом зі стрільбою ця логіка пішла. */
  src.setData({type:'FeatureCollection',features:f});
  simModels(list);
  mobKick();
}

/* ── 3d-моделі: пускова в центрі кола ППО, носій у точці пуску ──
   Ставимо їх звичайними обʼєктами шару KostylLayer, тож масштаб «до iconPx
   при зумі» і меркаторна корекція за широтою дістаються так само, як цілям
   NEPTUN, — без жодного окремого коду. Рухомі (літаки, кораблі, носії
   авіаційного пуску) стають у точку своєї траєкторії на поточний момент. */
function lncMdl(sc){
  if(!sc||!sc.cat)return 'truck';
  if(sc.plat==='mig')return 'mig31';
  if(sc.plat==='air')return 'su34';
  if(sc.plat==='sea'||sc.plat==='coast')return 'samTruck';
  if(sc.cat==='ballistic'||sc.cat==='hyper')return 'sam';   // ТЗМ/ПУ типу «Іскандера»
  if(sc.cat==='drone')return 'truck';                        // катапульта на шасі
  return 'samTruck';
}
function hexNum(c){const v=parseInt(String(c||'').replace('#',''),16);
  return isFinite(v)?v:null}

function simModels(list){
  if(!window.KostylSim||!window.TERRAIN_SPECS)return;
  /* Шар міг ще не піднятись (THREE тягнеться з CDN) — чекаємо, але не вічно */
  if(!airL||!airL.root){
    if(simMdlTry<40){simMdlTry++;clearTimeout(simMdlT);simMdlT=setTimeout(()=>simModels(list),300)}
    return;
  }
  simMdlTry=0;
  const want={}, t=RUN?simT:wallT();
  /* той самий список, що й у simRender: інакше нова, ще не збережена позиція
     ППО малювала б коло без моделі, а зміна засобу в картці не доходила б */
  (list||simList()).forEach(o=>{
    const c=o.coords&&o.coords[0]; if(!c)return;
    const mv=mvOf(o), m=mv?KostylSim.motionAt(mv,t):null;
    if(o.type==='pvo'){
      const sp=KostylSim.sys(o.st.sys)||{};
      want['mdl:'+o.id]={key:sp.mdl||'sam',lon:m?m.pos[0]:c[0],lat:m?m.pos[1]:c[1],
        alt:m?m.alt:0,hdg:m?m.hdg:(o.st.hdg||0),color:hexNum(o.st.color||'#64FF8F'),
        pitch:m?m.pitch||0:0,roll:m?m.roll||0:0,tilt:m?m.tilt||0:0};
    }else{
      const sc=TERRAIN_SPECS.SPEC[o.st.wpn]||{};
      /* наземний носій дивиться туди, куди піде перший відрізок маршруту;
         авіаційний — у повітрі на своїй висоті й кружляє */
      const h=o.coords.length>1?bearing(c,o.coords[1]):0;
      want['mdl:'+o.id]={key:mv?mv.mdl:lncMdl(sc),lon:m?m.pos[0]:c[0],lat:m?m.pos[1]:c[1],
        alt:m?m.alt:0,hdg:m?m.hdg:h,color:hexNum(o.st.color||sc.col||'#ff3b30'),
        pitch:m?m.pitch||0:0,roll:m?m.roll||0:0,tilt:m?m.tilt||0:0};
    }
  });
  /* читаємо саме airL.items, а не власний реєстр: після airL.clear() у
     запуску/зупинці нальоту моделі відновляться самі, без окремих викликів */
  Object.keys(airL.items).forEach(id=>{
    if(id.indexOf('mdl:')===0&&!want[id])airL.remove(id);
  });
  Object.keys(want).forEach(id=>{
    const w=want[id],it=airL.items[id];
    /* колір move не чіпає, тож при зміні кольору модель треба перескласти */
    if(it&&it.key===w.key&&it.__col===w.color)
      airL.move(id,{lon:w.lon,lat:w.lat,alt:w.alt,hdg:w.hdg,pitch:w.pitch,roll:w.roll,tilt:w.tilt});
    else{
      if(it)airL.remove(id);
      const n=airL.add({id,key:w.key,lon:w.lon,lat:w.lat,alt:w.alt,hdg:w.hdg,color:w.color,
        pitch:w.pitch,roll:w.roll,tilt:w.tilt});
      if(n)n.__col=w.color;
    }
  });
}

/* ── рух поза нальотом ──
   Літаки, кораблі й носії не стоять, поки ти розставляєш сценарій чи
   стежиш за живою стрічкою. Кадр раз на ~100 мс: F-16 за цей час
   проходить 20 м — на мапі це менше пікселя, а батарея телефона вдячна. */
let mobRaf=null, mobLast=0, mobRingT=0;
/* той самий список, що й у simRender: картка, яку зараз правлять, підміняє
   збережений обʼєкт, інакше модель їхала б старою орбітою, а намальована
   орбіта була б уже нова */
function mobList(){
  const cur=S.cur&&(S.cur.type==='pvo'||S.cur.type==='strike')?S.cur:null;
  return simList().map(o=>cur&&o.id===cur.id?cur:o)
    .concat(cur&&S.curNew?[cur]:[]).filter(isMob);
}
function mobKick(){if(!mobRaf&&!RUN)mobRaf=requestAnimationFrame(mobTick)}
function mobTick(now){
  mobRaf=null;
  if(RUN)return;                        // у нальоті рухом керує час сценарію
  const list=mobList();
  if(!list.length){mobRings([]);return}
  mobRaf=requestAnimationFrame(mobTick);
  if(document.hidden||now-mobLast<100)return;
  mobLast=now;
  const t=wallT(), rings=[];
  list.forEach(o=>{
    const m=KostylSim.motionAt(mvOf(o),t), id='mdl:'+o.id;
    if(airL&&airL.items[id])airL.move(id,{lon:m.pos[0],lat:m.pos[1],alt:m.alt,hdg:m.hdg,
      pitch:m.pitch||0,roll:m.roll||0,tilt:m.tilt||0});
    if(o.type==='pvo'){const sp=KostylSim.sys(o.st.sys)||{};
      rings.push({pos:m.pos,r:sp.r,color:o.st.color||'#64FF8F'})}
  });
  if(now-mobRingT>250){mobRingT=now;mobRings(rings)}
}
/* зони рухомих носіїв — навколо того місця, де вони є зараз */
function mobRings(rs){
  const src=map&&map.getSource(SIM_MOB); if(!src)return;
  src.setData({type:'FeatureCollection',features:rs.filter(r=>r.r).map(r=>({type:'Feature',
    properties:{color:r.color},geometry:{type:'Polygon',coordinates:[kmRing(r.pos,r.r,56)]}}))});
}

/* ── картка ── */
function simCardUI(){
  const c=S.cur; if(!c)return;
  if(c.type==='pvo'){
    const all=KostylSim.allSys();
    $('f-sys').innerHTML=Object.keys(all).map(k=>
      '<button class="btn'+(k===c.st.sys?' on':'')+'" data-sys="'+k+'">'+esc(all[k].name)+'</button>').join('');
    $$('#f-sys [data-sys]').forEach(b=>b.onclick=()=>{
      const was=KostylSim.sys(S.cur.st.sys)||{}, now=all[b.dataset.sys]||{};
      /* інший комплекс — інші засоби: старі кількості до нього не пасують */
      S.cur.st.sys=b.dataset.sys;S.cur.st.load=null;
      if(!now.air){delete S.cur.st.orbR;delete S.cur.st.altLo;delete S.cur.st.altHi}
      /* наземний комплекс не має маршруту, а корабель на суші — нонсенс */
      if(!now.sea&&S.cur.coords.length>1)S.cur.coords=[S.cur.coords[0]];
      if(now.sea&&!was.sea&&!waterAt(S.cur.coords[0]))st('⚠ корабель стоїть на суші — перекресли точку на воді');
      simCardUI();simRender();preview()});
    const sp=all[c.st.sys]||{load:[]};
    const cats=['drone','cruise','ballistic','hyper'].filter(k=>
      (sp.load||[]).some(l=>((KostylSim.WPN[l[0]]||{}).pk||{})[k]>0)).map(k=>KostylSim.CAT_UK[k]);
    $('pvo-spec').textContent=['досяжність '+sp.r+' км · стеля '+(sp.ceil/1000)+' км',
      'по кому: '+cats.join(', '),
      sp.air?'літає: патруль навколо точки':sp.sea?'ходить маршрутом по воді':'стоїть на позиції'
      ].map((l,i,a)=>(i===a.length-1?'└─ ':'├─ ')+l).join('\n');

    /* ── патруль ── */
    const mob=$('pvo-mob'),mh=$('pvo-mob-h');
    const showMob=!!(sp.air||sp.sea);
    mob.classList.toggle('hid',!showMob);mh.classList.toggle('hid',!showMob);
    if(sp.air){
      const R=c.st.orbR||sp.orbR,lo=c.st.altLo||sp.altLo,hi=c.st.altHi||sp.altHi;
      mob.innerHTML=
        '<div class="r"><span class="k">радіус патрулю, км</span><input class="inp num" id="n-orb" type="number" inputmode="numeric" min="1" max="200" value="'+R+'"></div>'+
        '<div class="r"><span class="k">висота від, м</span><input class="inp num" id="n-alo" type="number" inputmode="numeric" min="30" max="15000" step="50" value="'+lo+'"></div>'+
        '<div class="r"><span class="k">висота до, м</span><input class="inp num" id="n-ahi" type="number" inputmode="numeric" min="50" max="15000" step="50" value="'+hi+'"></div>'+
        '<div class="ld-hint">крейсерська ~'+sp.spd+' км/год · курс, висота й швидкість змінюються плавно</div>';
      const put=(id,k,mn,mx)=>{const e=$(id);e.oninput=()=>{
        const v=clamp(+e.value||0,mn,mx);S.cur.st[k]=v;
        if(k==='altLo'&&(S.cur.st.altHi||sp.altHi)<v+50)S.cur.st.altHi=v+50;
        simRender();preview()}};
      put('n-orb','orbR',1,200);put('n-alo','altLo',30,15000);put('n-ahi','altHi',50,15000);
    } else if(sp.sea){
      const km=c.coords.length>1?KostylSim.pathLen(c.coords):0;
      const mv=km?KostylSim.mover({id:c.id,key:c.st.sys,pos:c.coords[0],route:c.coords}):null;
      const lg=mv?KostylSim.legPlan(mv):null;
      mob.innerHTML=lg
        ? '<div class="ld-hint">маршрут '+km.toFixed(1)+' км · '+sp.spd+' км/год · туди-назад за ~'+
          (lg.T*2/3600).toFixed(1)+' год, на кінцях гальмує й розвертається</div>'
        : '<div class="ld-hint">маршруту немає — корабель стоїть. «Перекреслити» й додай точки по воді.</div>';
    } else mob.innerHTML='';

    /* ── боєкомплект по засобах ── */
    const ov=c.st.load||{};
    $('pvo-load').innerHTML=(sp.load||[]).map(l=>{
      const w=KostylSim.WPN[l[0]]||{},n=ov[l[0]]!=null?ov[l[0]]:l[1];
      const by=Object.keys(w.pk||{}).filter(k=>w.pk[k]>0).map(k=>KostylSim.CAT_UK[k]).join(', ');
      return '<div class="ld-row"><b>'+esc(w.uk)+'<em>'+esc(by)+' · '+w.r+' км · стеля '+(w.ceil/1000)+' км'+
        (w.cheap?'':' · на дешеві дрони не витрачається')+'</em></b>'+
        '<input class="inp num" data-ld="'+l[0]+'" type="number" inputmode="numeric" min="0" max="999" value="'+n+'"></div>'}).join('')+
      '<div class="ld-hint">порядок = пріоритет: першим іде верхній засіб, що може взяти ціль</div>';
    $$('#pvo-load [data-ld]').forEach(e=>e.oninput=()=>{
      S.cur.st.load=Object.assign({},S.cur.st.load||{});
      S.cur.st.load[e.dataset.ld]=clamp(Math.round(+e.value||0),0,999);
      simRender()});
  } else if(c.type==='strike'){
    const S2=TERRAIN_SPECS.SPEC;
    const keys=Object.keys(S2).filter(k=>S2[k].cat!=='artillery');
    $('f-wpn').innerHTML=keys.map(k=>
      '<button class="btn'+(k===c.st.wpn?' on':'')+'" data-wpn="'+k+'">'+esc(S2[k].uk)+'</button>').join('');
    $$('#f-wpn [data-wpn]').forEach(b=>b.onclick=()=>{
      S.cur.st.wpn=b.dataset.wpn;simCardUI();simRender();preview()});
    $('n-salvo').value=c.st.salvo||1;$('n-gap').value=c.st.gap==null?25:c.st.gap;
    $('n-delay').value=c.st.delay||0;
    const sc=S2[c.st.wpn]||{};
    /* Рахуємо РІВНО те саме, що потім полетить: розвідник і приманка
       вертаються додому, тож рушій складає їхній шлях навпіл — картка з
       одностороннім маршрутом показувала вдвічі менше й не попереджала
       про перевищення дальності. Висоту й час теж беремо з профілю рушія,
       а не з типової дальності для живого фіду. */
    const back=!sc.strike&&c.coords.length>=2;
    const path=back?c.coords.concat(c.coords.slice(0,-1).reverse()):c.coords;
    const km=KostylSim.pathLen(path);
    const a0=TERRAIN_SPECS.startAlt?TERRAIN_SPECS.startAlt(sc):0;
    const hMid=TERRAIN_SPECS.altProfile?TERRAIN_SPECS.altProfile(sc,km*0.5,km,a0)
      :TERRAIN_SPECS.altAt(sc,.5);
    const hMax=TERRAIN_SPECS.altProfile
      ?Math.max.apply(null,[0.15,0.3,0.5,0.7].map(f=>TERRAIN_SPECS.altProfile(sc,km*f,km,a0))):hMid;
    const dur=KostylSim.flightMin?KostylSim.flightMin(sc,km):(sc.speed?km/sc.speed*60:0);
    $('wpn-spec').textContent=[sc.speed+' км/год · '+sc.wh,
      'маршрут '+km.toFixed(0)+' км'+(back?' (туди й назад)':'')+
        (km>sc.range?'  ⚠ більше за дальність '+sc.range+' км':''),
      'підліт ~'+dur.toFixed(0)+' хв',
      'висота '+Math.round(hMid)+' м'+(hMax>hMid*1.2?' · до '+Math.round(hMax)+' м':'')
      ].map((l,i,a)=>(i===a.length-1?'└─ ':'├─ ')+l).join('\n');
  }
}
['n-salvo','n-gap','n-delay'].forEach(id=>{const e=$(id);if(!e)return;
  e.oninput=()=>{if(!S.cur)return;
    const k=id==='n-salvo'?'salvo':id==='n-gap'?'gap':'delay';
    S.cur.st[k]=clamp(+e.value||0,0,id==='n-salvo'?60:3600);
    if(k==='salvo')S.cur.st.salvo=Math.max(1,S.cur.st.salvo);
    simCardUI();simRender()}});

/* ── прорахунок ── */
function simSetup(){
  const pvo=[],launchers=[];
  simList().forEach(o=>{
    if(o.type==='pvo')pvo.push(pvoSpec(o));
    else launchers.push({id:o.id,wpn:o.st.wpn,path:o.coords.map(c=>c.slice()),
      salvo:o.st.salvo||1,gap:o.st.gap==null?25:o.st.gap,delay:o.st.delay||0});
  });
  return {pvo,launchers};
}

/* Затінення питаємо в мапи, але тільки коли рельєф справді живий: на пласкій
   мапі queryTerrainElevation віддає нулі, і ППО «сліпло» б на рівному місці. */
function simLOS(){
  if(!terrainLive||!map.queryTerrainElevation)return null;
  return KostylSim.makeLOS(ll=>{
    /* queryTerrainElevation віддає висоту вже помножену на перебільшення
       рельєфу — для показу це правильно, для прямої видимості ні: «роздуті»
       гори ховали б цілі, яких справжні не ховають */
    try{const v=map.queryTerrainElevation({lng:ll[0],lat:ll[1]});
      return v==null?null:v/((map.getTerrain()||{}).exaggeration||1)}
    catch(e){return null}});
}

/* ═══ РЕЄСТР ППО НАЛЬОТУ ═══
   Наліт порахований наперед, тож «поставити ППО посеред нальоту» означає
   перерахувати його. Щоб минуле не переписувалось, кожна позиція живе
   відрізками з вікном дії [from, until): нова стріляє з моменту появи,
   прибрана — до моменту зникнення, змінена (перенесли, змінили патруль
   чи засіб) — старий відрізок закривається, новий відкривається зараз і
   продовжує з тим боєкомплектом, що лишився. Рушій до моменту зміни бачить
   ту саму розстановку й тягне ті самі кидки кубика — отже, програне
   лишається програним, а змінюється лише майбутнє. */
let simRoster=null, simLaunch=null, simResume=false;
function rosterInit(){
  simRoster=simList().filter(o=>o.type==='pvo').map(o=>{const p=pvoSpec(o);
    return {sid:o.id,oid:o.id,p,from:0,until:null,sig:JSON.stringify(p)}});
}
function rosterSetup(){
  return simRoster.map(r=>Object.assign({},r.p,{id:r.sid,oid:r.oid,from:r.from,until:r.until}));
}
/* скільки кожного засобу відрізок уже витратив до моменту t */
function rosterUsed(sid,t){
  const u={};
  if(RUN)RUN.events.forEach(e=>{if(e.kind==='samfire'&&e.sid===sid&&e.t<t&&e.w)u[e.w]=(u[e.w]||0)+1});
  return u;
}
function simRosterSync(){
  if(!RUN||!simRoster)return false;
  const t=simT, cur={};
  simList().filter(o=>o.type==='pvo').forEach(o=>{cur[o.id]=pvoSpec(o)});
  let changed=false, added=0;
  const carry={};
  simRoster.forEach(r=>{
    if(r.until!=null)return;
    const p=cur[r.oid];
    if(p&&JSON.stringify(p)===r.sig)return;
    r.until=t;changed=true;
    /* той самий комплекс лишився — переносимо недострелений боєкомплект */
    if(p&&p.key===r.p.key){
      const sp=KostylSim.sys(p.key)||{},used=rosterUsed(r.sid,t),base=r.p.load||{},ld={};
      (sp.load||[]).forEach(l=>{const n=base[l[0]]!=null?base[l[0]]:l[1];ld[l[0]]=Math.max(0,n-(used[l[0]]||0))});
      carry[r.oid]=ld;
    }
  });
  Object.keys(cur).forEach(oid=>{
    if(simRoster.some(r=>r.oid===oid&&r.until==null))return;
    const n=simRoster.filter(r=>r.oid===oid).length, p=cur[oid];
    const pp=carry[oid]?Object.assign({},p,{load:carry[oid]}):p;
    simRoster.push({sid:n?oid+'#'+n:oid,oid,p:pp,from:t,until:null,sig:JSON.stringify(p)});
    changed=true;if(!carry[oid])added++;
  });
  if(!changed)return false;
  const run=KostylSim.buildRun({pvo:rosterSetup(),launchers:simLaunch},RUN.seed,{los:simLOS()});
  if(!run)return false;
  RUN=run;
  /* журнал до цієї миті той самий — перебираємо його без вибухів */
  simSince=simT;simEvIdx=0;simLog=[];logSeq++;
  while(simEvIdx<RUN.events.length&&RUN.events[simEvIdx].t<=simT){
    const e=RUN.events[simEvIdx++];if(e.kind!=='samfire')simPush(e)}
  chrN=-1;simTicks();
  if(simResume&&added){simResume=false;simPlay=true;simLastMs=performance.now()}
  st(added?'ППО стало до бою з '+fmtT(simT)+' · наліт перераховано далі':
    'розстановку змінено з '+fmtT(simT)+' · наліт перераховано далі',1);
  simBarUI();
  return true;
}

function simBuild(){
  const set=simSetup();
  if(!set.launchers.length){st('нема пускових — постав ціль інструментом ⇈');return null}
  rosterInit();simLaunch=set.launchers;
  set.pvo=rosterSetup();
  const t0=performance.now();
  const run=KostylSim.buildRun(set,(Date.now()/1000|0),{los:simLOS()});
  if(!run){st('рушій не зібрався');return null}
  logSrc('наліт: '+run.stat.total+' цілей, '+run.threats.length+' бортів, '+
    Math.round(performance.now()-t0)+' мс'+(run.masked?', з рельєфом':''));
  return run;
}

/* ── запуск і зупинка ── */
function simGo(){
  if(!window.KostylSim||!window.TERRAIN_SPECS){st('рушій не підвантажився');return}
  if(RUN)simEnd();               // другий запуск не має лишати два цикли rAF
  /* Бій і наліт живуть в одному циклі кадрів і в одному 3d-шарі. Лишити бій
     працювати «під» нальотом означало б списувати боєкомплект і малювати
     спалахи поверх сценарію, а потім заморозити бій, коли наліт зупинять. */
  if(LIVE)liveEnd();
  airBoot();                       // шар міг ще не піднятись, якщо фід вимкнений
  if(!airL){st('3d-шар не піднявся — THREE не доїхав?');return}
  const run=simBuild(); if(!run)return;
  RUN=run;simT=0;simEvIdx=0;simLog=[];
  /* ДЕМО грає на чистій мапі: справжні борти ховаємо, щоб учбове й реальне
     не стояли поруч — ціна такої плутанини не косметична.
     Але сам фід НЕ зупиняємо: тривоги по областях і зведення лишаються
     живими. Людина в укритті не має втратити обстановку через те, що
     запустила симуляцію. */
  simFeedWasOn=!!airFeed;
  if(airL){clearOurs();simModels()}
  demoMask(true);
  if(airFeed)st('демо: справжні цілі сховано, тривоги лишились',1);
  simSpd=1;simPlay=true;simLastMs=performance.now();
  simSince=0;chrN=-1;logSeq++;simTicks();
  simUI();simBarUI();if(!simRaf)simTick();
  st('наліт пішов · '+RUN.stat.total+' цілей',1);
}
function simEnd(){
  simPlay=false;
  /* цикл кадрів спільний із бойовим режимом — гасимо його тільки якщо там
     теж нікого немає */
  if(simRaf&&!LIVE){cancelAnimationFrame(simRaf);simRaf=null}
  RUN=null;simSince=0;simLog=[];simEvIdx=0;simRoster=null;simLaunch=null;simResume=false;
  if(airL){clearOurs();simModels()}
  demoMask(false);
  chrOpen=false;$('sim-chron').classList.remove('on');
  $('sim-chr').classList.remove('on');
  simTicks();simUI();mobKick();
  if(simFeedWasOn&&!airFeed&&S.cfg.air!==false){airStart();st('демо зупинено, фід повернувся')}
  else st(simFeedWasOn?'демо зупинено · справжні цілі знову на мапі':'демо зупинено');
  simFeedWasOn=false;
}

/* ── кадр ── */
function simTick(){
  if(!RUN&&!LIVE){simRaf=null;return}     // ніхто не йде — цикл гасне сам
  simRaf=requestAnimationFrame(simTick);
  const now=performance.now(),dt=(now-simLastMs)/1000;simLastMs=now;
  if(LIVE)liveFrame();
  if(!RUN)return;
  if(simPlay){
    simT+=dt*simSpd;
    if(simT>=RUN.endT){simT=RUN.endT;simPlay=false;simBarUI();
      st('наліт завершено · збито '+RUN.stat.killed+' з '+RUN.stat.total+
         ' ('+RUN.stat.eff+'%), прорвалось '+RUN.stat.impacted,1)}
  }
  simFrame();
}

function simFrame(){
  if(!RUN||!airL)return;
  const F=KostylSim.stateAt(RUN,simT);
  const live={};

  /* цілі в повітрі */
  F.air.forEach(a=>{
    const id='sim:'+a.id;live[id]=1;
    const ori={pitch:a.pitch,roll:a.roll};
    if(airL.items[id])airL.move(id,Object.assign({lon:a.pos[0],lat:a.pos[1],alt:a.alt,hdg:a.hdg},ori));
    else airL.add(Object.assign({id,key:a.wpn,lon:a.pos[0],lat:a.pos[1],alt:a.alt,hdg:a.hdg,trail:S.cfg.airTr!==false},ori));
  });
  /* ЗУР у польоті */
  F.fly.forEach(v=>{
    const id='zur:'+v.id;live[id]=1;
    if(airL.items[id])airL.move(id,{lon:v.cur[0],lat:v.cur[1],alt:v.alt,hdg:v.hdg,pitch:v.pitch});
    else airL.add({id,key:'zur',lon:v.cur[0],lat:v.cur[1],alt:v.alt,hdg:v.hdg,pitch:v.pitch,
      color:0x9dff57,trail:S.cfg.airTr!==false});
  });
  Object.keys(airL.items).forEach(id=>{
    if((id.indexOf('sim:')===0||id.indexOf('zur:')===0)&&!live[id])airL.remove(id);
  });
  /* літаки й кораблі ППО та носії авіаційного пуску — там, де вони були
     саме в цей момент сценарію: перемотка показує їх у правильному місці */
  const rings=[];
  F.pvo.forEach(m=>{const id='mdl:'+m.id;
    if(airL.items[id])airL.move(id,{lon:m.pos[0],lat:m.pos[1],alt:m.alt,hdg:m.hdg,
      pitch:m.pitch,roll:m.roll,tilt:m.tilt});
    const o=byId(m.id),sp=o?KostylSim.sys(o.st.sys)||{}:{};
    rings.push({pos:m.pos,r:sp.r,color:(o&&o.st.color)||'#64FF8F'})});
  F.carriers.forEach(m=>{const id='mdl:'+m.id;
    if(airL.items[id])airL.move(id,{lon:m.pos[0],lat:m.pos[1],alt:m.alt,hdg:m.hdg,
      pitch:m.pitch,roll:m.roll,tilt:m.tilt})});
  const nowMs=performance.now();
  if(nowMs-mobRingT>250){mobRingT=nowMs;mobRings(rings)}

  /* Вибухи й журнал ведемо З ОДНОГО джерела — списку подій. Раніше вибухи
     бралися з вікна F.fx (подія «жива» 2.2 с), і на ×300 кадр перестрибував
     ~5 с модельного часу: більш ніж половина пусків і збиттів не потрапляла
     в жоден кадр і мовчала. Індекс подій нічого не губить за будь-якої
     швидкості, а simEvIdx монотонний, тож і двічі нічого не програється. */
  let shown=0;
  while(simEvIdx<RUN.events.length&&RUN.events[simEvIdx].t<=simT){
    const e=RUN.events[simEvIdx++];
    const fresh=e.t>=simSince-0.001;
    /* постріл ППО: у хронологію не пишемо (там результат), але на мапі він
       є — спалах на пусковій чи черга трасерів зі ствола */
    if(e.kind==='samfire'){if(fresh&&shown<16){shown++;simShot(e)}continue}
    /* через simPush, а не напряму: тільки він рухає logSeq, а без цього
       chrUI вважає, що нічого не змінилось, і панель стоїть увесь наліт */
    simPush(e);
    /* те, крізь що перемотали, не переграємо; і не більше десятка вибухів
       на кадр — на ×30 інакше вийде суцільна стіна частинок */
    if(fresh&&shown<16){shown++;simBoom(e)}
  }
  simBarUI(F);
}

/* Вибухи подій. Пуск — завжди з вибухом у точці виходу: у балістики це
   велика куля з димом, у КР з наземної пускової — середня, у дрона —
   хлопок катапульти. Авіаційний пуск — спалах просто в повітрі на висоті
   носія, без кільця по землі й без сліду. */
function simBoom(e){
  if(!airL)return;
  const sc=TERRAIN_SPECS.SPEC[e.wpn]||{};
  if(e.kind==='launch'){
    if(e.air)airL.boom(e.pos[0],e.pos[1],45,{alt:e.alt,col:0xffc070,smoke:2,shards:10,
      ring:false,scar:false,life:0.8});
    else{
      const big=sc.cat==='ballistic'||sc.cat==='hyper';
      airL.boom(e.pos[0],e.pos[1],big?140:sc.cat==='cruise'?85:45,
        {col:0xffb347,smoke:big?14:sc.cat==='cruise'?9:4,shards:big?30:14,scar:big});
    }
  }
  else if(e.kind==='kill')airL.intercept(e.pos[0],e.pos[1],e.alt||0,60);
  else if(e.kind==='impact')
    airL.boom(e.pos[0],e.pos[1],sc.cat==='ballistic'||sc.cat==='hyper'?160:sc.cat==='cruise'?115:75);
}
/* постріл ППО: ствольний — черга трасерів до точки зустрічі, ракетний —
   спалах виходу на пусковій (з літака — у повітрі, без кільця) */
function simShot(e){
  if(!airL)return;
  if(e.gun){airL.tracer([e.pos[0],e.pos[1],e.alt||0],[e.to[0],e.to[1],e.toAlt||0],0xffe08a);return}
  const inAir=(e.alt||0)>150;
  airL.boom(e.pos[0],e.pos[1],inAir?22:30,{alt:e.alt||0,col:0xffd28a,smoke:inAir?1:4,
    shards:6,ring:false,scar:false,life:0.6});
}

/* ── смуга керування і таймлайн ── */
const SIM_SPD=[1,5,10,30];
const CHR_K={launch:['▲','#ffb347','пуск'],kill:['✕','#64FF8F','збито'],
             impact:['✸','#ff3b30','приліт'],miss:['○','#8e8e93','промах'],
             enter:['⊙','#ffb347','увійшла в зону'],
             zone:['⊙','#ffb347','у зоні']};
let chrOpen=false, chrN=-1, scDrag=false, logSeq=0;
let simMode='scn';

function fmtT(s){const m=Math.floor(s/60),x=Math.floor(s%60);
  return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}

/* журнал подій спільний для обох режимів */
function simPush(e){simLog.unshift(e);if(simLog.length>160)simLog.length=160;logSeq++}

/* ── стан смуги ──
   idle — на мапі є що запускати, але нічого не йде
   run  — відтворюється порахований наліт
   live — бойовий режим по живих цілях NEPTUN */
function simState(){return RUN?'run':LIVE?'live':'idle'}
function simUI(){
  const bar=$('simbar'); if(!bar)return;
  const l=simList(),pv=l.filter(o=>o.type==='pvo').length,st_=l.filter(o=>o.type==='strike').length;
  const on=!!(pv||st_)||!!RUN||!!LIVE;
  const was=bar.classList.contains('on');
  bar.classList.toggle('on',on);
  document.body.classList.toggle('simon',on);
  /* мапі перерахунок розміру потрібен лише коли смуга зʼявилась чи зникла;
     scnUI смикається часто, а resize щоразу — це смикана мапа */
  if(on!==was&&map)setTimeout(()=>{try{map.resize()}catch(e){}},0);
  const state=simState();
  bar.dataset.st=state;
  document.body.classList.toggle('simrun',state==='run');
  /* HUD у куті мапи мусить стояти під смугою, а її висота на телефоні
     залежить від стану (у нальоті — два рядки) — міряємо, а не вгадуємо */
  requestAnimationFrame(()=>{
    if(on&&innerWidth<900)document.body.style.setProperty('--simbar-h',bar.offsetHeight+'px');
    else document.body.style.removeProperty('--simbar-h');
  });
  $$('#sim-mode b').forEach(b=>b.classList.toggle('on',b.dataset.mode===simMode));
  if(state==='idle'){
    const run=$('sim-run');
    if(simMode==='scn'){
      $('sim-hint').textContent=st_
        ? pv+' ППО · '+st_+' пускових'
        : (pv?'є ППО, але нема жодної пускової — інструмент ⇈':'постав ППО ⊕ і ціль ⇈');
      run.disabled=!st_;run.textContent='запустити наліт';
    }else{
      $('sim-hint').textContent=pv
        ? pv+' позицій ППО на живій стрічці'
        : 'реальний режим без ППО нічого не покаже — постав ⊕';
      run.disabled=!pv;run.textContent='показати зони';
    }
  }
  if($('sim-wipe'))$('sim-wipe').disabled=!(pv||st_);
}

/* Розмітка подій під повзунком. Подій у масованому нальоті бувають тисячі,
   тож не малюємо по мітці на кожну: ділимо шкалу на 200 колонок і фарбуємо
   колонку найважчою подією в ній (приліт > збиття > пуск). */
function simTicks(){
  const box=$('sim-ticks'); if(!box)return;
  if(!RUN||!RUN.endT){box.innerHTML='';return}
  const N=200, RANK={launch:1,kill:2,impact:3}, buck=new Array(N).fill(0);
  RUN.events.forEach(e=>{
    const r=RANK[e.kind]; if(!r)return;
    const i=clamp(Math.round(e.t/RUN.endT*(N-1)),0,N-1);
    if(r>buck[i])buck[i]=r;
  });
  const COL=['','#ffb347','#64FF8F','#ff3b30'];
  let h='';
  for(let i=0;i<N;i++)if(buck[i])
    h+='<i style="left:'+(i/(N-1)*100).toFixed(2)+'%;background:'+COL[buck[i]]+'"></i>';
  box.innerHTML=h;
}

/* Єдина точка стрибка в часі: і повзунок, і кнопки подій, і скидання, і
   клік у хронології. Перезбирає журнал з нуля, тож стрибок назад більше не
   лишає хронологію з майбутнього. */
function simSeek(t){
  if(!RUN)return;
  simT=clamp(t,0,RUN.endT);
  simSince=simT;simEvIdx=0;simLog=[];logSeq++;
  /* сліди — накопичувальні: без очистки ціль, жива по обидва боки стрибка,
     дописала б у свій слід відрізок на пів країни */
  if(airL&&airL.track&&airL.track.clear)airL.track.clear();
  while(simEvIdx<RUN.events.length&&RUN.events[simEvIdx].t<=simT){
    const e=RUN.events[simEvIdx++];
    if(e.kind==='samfire')continue;
    simPush(e);
  }
  chrN=-1;simFrame();
}
function simEvGo(dir){
  if(!RUN)return;
  const es=RUN.events;
  if(dir>0){for(let i=0;i<es.length;i++)
      if(es[i].kind!=='samfire'&&es[i].t>simT+0.05){simSeek(es[i].t);return}
    simSeek(RUN.endT);}
  else{for(let i=es.length-1;i>=0;i--)
      if(es[i].kind!=='samfire'&&es[i].t<simT-0.05){simSeek(es[i].t);return}
    simSeek(0);}
}

/* хронологія */
function chrUI(force){
  if(!chrOpen)return;
  if(!force&&chrN===logSeq)return; chrN=logSeq;
  const L=$('chr-list'); if(!L)return;
  if(!simLog.length){L.innerHTML='<div class="chr"><b>поки нічого не сталося</b></div>';return}
  L.innerHTML=simLog.map(e=>{
    const c=CHR_K[e.kind]||['·','#8e8e93',e.kind];
    const w=e.uk||(TERRAIN_SPECS.SPEC[e.wpn]||{}).uk||'';
    const ex=(e.kind==='kill'||e.kind==='miss')
      ? (e.name?' ← '+e.name:'')+(e.by?' · '+e.by:'')+(e.alt?' · '+Math.round(e.alt)+' м':'')
      : e.kind==='zone'
      ? (e.name?' · '+e.name:'')+(e.alt?' · '+Math.round(e.alt)+' м':'') : '';
    return '<div class="chr" data-t="'+e.t+'" data-ll="'+e.pos[0]+','+e.pos[1]+'">'+
      '<u>'+fmtT(e.t)+'</u><s style="color:'+c[1]+'">'+c[0]+'</s>'+
      '<b>'+esc(c[2]+(w?' · '+w:'')+ex)+'</b></div>';
  }).join('');
  $$('#chr-list .chr').forEach(r=>r.onclick=()=>{
    const ll=r.dataset.ll.split(',').map(Number);
    if(map&&isFinite(ll[0]))try{map.easeTo({center:ll,duration:500})}catch(e){}
    if(RUN&&r.dataset.t){simPlay=false;simSeek(+r.dataset.t);simBarUI()}
  });
}

/* Прискорювач — одна кнопка по колу ×1 → ×5 → ×10 → ×30 → ×1, як у delta⁹
   за значеннями, але компактно: на телефоні чотири кнопки з'їдали таймлайн. */
$('sim-spd').onclick=()=>{
  const i=SIM_SPD.indexOf(simSpd);
  simSpd=SIM_SPD[(i+1)%SIM_SPD.length];
  simLastMs=performance.now();simBarUI();
  st('прискорення ×'+simSpd);
};

function simBarUI(F){
  if(!RUN)return;
  $('sim-play').classList.toggle('on',simPlay);
  $('sim-pause').classList.toggle('on',!simPlay);
  $('sim-time').innerHTML=fmtT(simT)+' <em>/ '+fmtT(RUN.endT)+'</em>';
  const sc=$('sim-scrub');
  /* тільки поки його справді тягнуть: після протяжки range лишається
     document.activeElement, і бігунок застигав до кліку деінде */
  if(!scDrag)sc.value=Math.round(simT/RUN.endT*1000);
  const sb=$('sim-spd');sb.textContent='×'+simSpd;sb.classList.toggle('fast',simSpd>1);
  /* коротко й гліфами: повні слова з'їдали таймлайн і все одно обрізались */
  if(F){const c=$('sim-cnt');
    c.title='у повітрі · збито · прорвалось';
    c.innerHTML='<em>'+F.nAir+'</em> в повітрі · <em>'+F.nK+'</em>✕ · <em>'+F.nI+'</em>✸'}
  chrUI();
}
$('sim-play').onclick=()=>{if(!RUN)return;simResume=false;
  if(simT>=RUN.endT)simSeek(0);     // з кінця запуск починає спочатку
  simPlay=true;simLastMs=performance.now();simBarUI()};
$('sim-pause').onclick=()=>{if(!RUN)return;simPlay=false;simBarUI()};
$('sim-reset').onclick=()=>{if(!RUN)return;
  simPlay=false;simResume=false;
  /* «на початок» — це новий старт із тим, що зараз на мапі: ППО, додане
     посеред нальоту, тепер стоїть із першої секунди. Сід той самий, тож
     без змін розстановки наліт повториться до кидка. */
  const cur=simList().filter(o=>o.type==='pvo').map(pvoSpec);
  const dirty=!simRoster||simRoster.length!==cur.length||simRoster.some(r=>r.from>0||r.until!=null);
  if(dirty){rosterInit();
    const run=KostylSim.buildRun({pvo:rosterSetup(),launchers:simLaunch},RUN.seed,{los:simLOS()});
    if(run){RUN=run;simTicks()}}
  if(airL){clearOurs();simModels()}simSeek(0);
  st(dirty?'наліт з початку — з теперішньою розстановкою ППО':'наліт скинуто на початок')};
$('sim-stop').onclick=()=>{if(RUN)simEnd();else if(LIVE)liveEnd()};
$('sim-chr').onclick=()=>{chrOpen=!chrOpen;chrN=-1;
  $('sim-chron').classList.toggle('on',chrOpen);
  $('sim-chr').classList.toggle('on',chrOpen);chrUI(true)};
$('chr-x').onclick=()=>{chrOpen=false;$('sim-chron').classList.remove('on');
  $('sim-chr').classList.remove('on')};
$('sim-scrub').oninput=e=>{if(!RUN)return;simSeek(+e.target.value/1000*RUN.endT)};
$('sim-scrub').onpointerdown=()=>{scDrag=true};
['pointerup','pointercancel','blur','change'].forEach(ev=>
  $('sim-scrub').addEventListener(ev,()=>{scDrag=false}));

/* ── перемикач режимів ── */
$$('#sim-mode b').forEach(b=>b.onclick=()=>{
  const m=b.dataset.mode; if(m===simMode)return;
  if(RUN)simEnd(); if(LIVE)liveEnd();
  simMode=m;simUI();
  if(m==='live')demoMask(false);
  st(m==='live'
    ? 'реальний режим: живі цілі NEPTUN, ваше ППО — зони і час підльоту'
    : 'демо: чиста мапа, свої цілі й ППО · реальні цілі сховано');
});

/* ДЕМО має бути чистим: справжні борти зі стрічки на час гри ховаємо, інакше
   своя ракета й чужа ціль стоять поруч і не зрозуміло, що з цього правда.
   Ховаємо ЛИШЕ моделі — тривоги по областях і зведення лишаються живими,
   бо людина в укритті не має втратити обстановку через те, що гралася. */
/* «своє» — усе, що поставили ми: ППО, борти нальоту, зенітні ракети.
   Решта в шарі — справжні борти зі стрічки. */
const OURS=id=>id.indexOf('mdl:')===0||id.indexOf('sim:')===0||
                id.indexOf('zur:')===0||id.indexOf('lz:')===0;
/* Прибираємо ЛИШЕ своє. Раніше тут був airL.clear(), який зносив і справжні
   борти теж — а реєстр фіду про це не знав і далі рухав неіснуючі обʼєкти:
   після демо жива стрічка більше не малювалась узагалі. */
function clearOurs(){
  if(!airL)return;
  Object.keys(airL.items).forEach(id=>{if(OURS(id))airL.remove(id)});
  if(airL.fx&&airL.fx.clear)airL.fx.clear();
}
function demoMask(on){
  if(!airL)return;
  airL.setFeedHidden(!!on,id=>!OURS(id));
  const w=$('live-hid');if(w)w.classList.toggle('on',!!on&&!!airFeed);
}
$('sim-run').onclick=()=>{simMode==='live'?liveGo():simGo()};

/* ── скидання розміщень ── */
$('sim-wipe').onclick=()=>{
  const n=S.objs.filter(o=>o.type==='pvo'||o.type==='strike').length;
  if(!n)return;
  if(RUN)simEnd(); if(LIVE)liveEnd();
  S.cur=null;S.curNew=false;S.sel=null;closePanels();
  /* через mutate — отже Ctrl+Z повертає весь комплект назад */
  mutate(()=>{S.objs=S.objs.filter(o=>o.type!=='pvo'&&o.type!=='strike')});
  if(airL){Object.keys(airL.items).forEach(id=>{
    if(id.indexOf('mdl:')===0)airL.remove(id)})}
  render();scnUI();
  st('прибрав '+n+' розміщень · Ctrl+Z поверне');
};

/* ═══════════════ РЕАЛЬНИЙ РЕЖИМ ═══════════════
   Ваше ППО поверх ЖИВОЇ стрічки NEPTUN — і ніякої стрільби.

   Тут не буває ні пусків, ні «збито», ні «промах». Раніше було: модель
   стріляла по справжніх цілях над справжніми містами й писала в хронологію
   ураження, яких ніхто не підтверджував. Малювати влучання по живій
   обстановці — це видавати вигадку за факт, і жодне попередження дрібним
   шрифтом цього не виправляє.

   Тому реальний режим показує лише те, що можна порахувати чесно:
   геометрію — яка ціль у зоні якого засобу — і час підльоту: скільки
   лишилось до входу в зону і, якщо відома ваша позиція, скільки до вас.
   Стрільба, ураження й боєкомплект живуть у ДЕМО, де і цілі, і ППО ваші. */
function liveGo(){
  if(!window.KostylSim||!window.TERRAIN_SPECS){st('рушій не підвантажився');return}
  if(RUN)simEnd();
  if(LIVE)liveEnd();
  const pv=simList().filter(o=>o.type==='pvo');
  if(!pv.length){st('спершу постав ППО — інструмент ⊕');return}
  airBoot();
  if(!airFeed){S.cfg.air=true;saveCfg();airStart();layersUI()}
  LIVE={bat:pv.map(o=>{const b=KostylSim.battery(pvoSpec(o));b.__sig=JSON.stringify(pvoSpec(o));return b}),
        inZone:{},t0:Date.now(),
        n:{seen:0,zone:0,eta:null,etaMe:null}};
  simLog=[];logSeq++;chrN=-1;
  liveInt=setInterval(liveTick,1000);
  simUI();if(!simRaf)simTick();
  logSrc('реальний режим: '+LIVE.bat.length+' позицій ППО на живій стрічці');
  st('реальний режим · зони і час підльоту, без стрільби',1);
}
function liveEnd(){
  if(liveInt){clearInterval(liveInt);liveInt=null}
  LIVE=null;
  if(simRaf&&!RUN){cancelAnimationFrame(simRaf);simRaf=null}
  chrOpen=false;$('sim-chron').classList.remove('on');$('sim-chr').classList.remove('on');
  simRender();simUI();
  st('реальний режим вимкнув');
}

/* живі цілі беремо просто з шару: там уже і числення шляху між опитуваннями,
   і висота з опису, і курс — не треба другої правди про ту саму ціль */
function liveTargets(){
  if(!airL)return [];
  const out=[];
  Object.keys(airL.items).forEach(id=>{
    if(id.indexOf('mdl:')===0||id.indexOf('sim:')===0||
       id.indexOf('zur:')===0||id.indexOf('lz:')===0)return;
    const it=airL.items[id];
    if(it&&it.spec&&it.spec.cat)out.push(it);
  });
  return out;
}

/* Бойовий режим теж приймає ППО на ходу: нова позиція стає до бою, прибрана
   виходить, змінена продовжує з тим, що лишилось у боєкомплекті. */
function liveRoster(){
  const cur={};
  simList().filter(o=>o.type==='pvo').forEach(o=>{cur[o.id]=pvoSpec(o)});
  let n=0;
  LIVE.bat=LIVE.bat.filter(b=>{if(cur[b.id])return true;n++;return false});
  Object.keys(cur).forEach(id=>{
    const sig=JSON.stringify(cur[id]), old=LIVE.bat.find(b=>b.id===id);
    if(old&&old.__sig===sig)return;
    const nb=KostylSim.battery(cur[id]);nb.__sig=sig;
    if(old&&old.key===nb.key){         // той самий комплекс — ракети не з'являються з повітря
      nb.load.forEach(l=>{const o=old.load.find(x=>x.k===l.k);if(o)l.left=Math.min(l.n,o.left)});
      nb.ammoLeft=nb.load.reduce((a,l)=>a+l.left,0);nb.engaged=old.engaged;
    }
    if(old)LIVE.bat[LIVE.bat.indexOf(old)]=nb;else{LIVE.bat.push(nb);n++}
  });
  if(n)logSrc('бойовий режим: позицій ППО тепер '+LIVE.bat.length);
}
/* Геометрія й час — усе, що рахує реальний режим.

   Вхід у зону рахуємо не «коли долетить до засобу», а коли перетне межу
   кола ураження ПО СВОЄМУ ПОТОЧНОМУ КУРСУ. Курс цілі може межу й не
   зачепити: тоді входу не буде взагалі, і писати ETA було б брехнею.
   Розкладаємо відстань на складові вздовж курсу й поперек нього:
   поперечна більша за радіус — повз, не входить. */
function zoneETA(pos, hdg, v, cpos, r){
  if(!(v>0))return null;
  const d=KostylSim.hav(pos,cpos);              // км до центру зони
  if(d<=r)return 0;                            // вже всередині
  const a=(KostylSim.bearing(pos,cpos)-hdg)*Math.PI/180;
  const along=d*Math.cos(a), cross=Math.abs(d*Math.sin(a));
  if(along<=0||cross>=r)return null;           // летить повз або від зони
  const enter=along-Math.sqrt(r*r-cross*cross);
  if(enter<=0)return 0;
  return enter/v*3600;                         // секунд
}
/* Час підльоту до точки (вашої позиції) тим самим курсом. Якщо ціль іде не
   на вас, числа немає — і вигадувати його не будемо. */
function pointETA(pos, hdg, v, to){
  if(!(v>0))return null;
  const d=KostylSim.hav(pos,to);
  const a=(KostylSim.bearing(pos,to)-hdg)*Math.PI/180;
  const along=d*Math.cos(a);
  if(along<=0)return null;
  /* далі як 20 км убік — це вже не «на вас» */
  if(Math.abs(d*Math.sin(a))>20)return null;
  return along/v*3600;
}
function liveTick(){
  if(!LIVE)return;
  liveRoster();
  const list=liveTargets(), t=wallT(), now=Date.now();
  const here=LIVE.bat.map(s=>KostylSim.batAt(s,t,true));
  LIVE.n.seen=list.length;
  let zone=0, eta=null, etaMe=null;
  const stillIn={};
  list.forEach(it=>{
    const sp=it.spec||{}, pos=[it.lon,it.lat];
    const hdg=it.hdg==null?null:it.hdg, v=sp.speed||0;
    let covered=false;
    LIVE.bat.forEach((s,j)=>{
      /* зона, яка цей клас цілі взяти не може, зоною для неї не є */
      if(!KostylSim.roleOK(s,sp.cat,sp.cheap))return;
      const cur=here[j];
      const inside=KostylSim.hav(cur.pos,pos)<=s.r;
      if(inside){
        covered=true;
        const k=it.id+'|'+s.id; stillIn[k]=1;
        if(!LIVE.inZone[k]){
          LIVE.inZone[k]=now;
          simPush({kind:'zone',t:(now-LIVE.t0)/1000,pos:pos.slice(),
            alt:it.altShown==null?it.alt:it.altShown,
            name:s.name,uk:(sp.uk||'ціль')});
        }
      }
      if(hdg==null)return;
      const e=zoneETA(pos,hdg,v,cur.pos,s.r);
      if(e!=null&&e>0&&(eta==null||e<eta))eta=e;
    });
    if(covered)zone++;
    if(myPos&&hdg!=null){
      const e=pointETA(pos,hdg,v,myPos);
      if(e!=null&&(etaMe==null||e<etaMe))etaMe=e;
    }
  });
  /* вийшла із зони — знімаємо позначку, щоб повторний вхід був новою подією */
  Object.keys(LIVE.inZone).forEach(k=>{if(!stillIn[k])delete LIVE.inZone[k]});
  LIVE.n.zone=zone;LIVE.n.eta=eta;LIVE.n.etaMe=etaMe;
  /* Смугу малюємо тут-таки. Раніше числа чекали на кадр rAF, а кадрів у
     реальному режимі може не бути зовсім: він нічого не рухає, і мапа
     законно стоїть на idle. */
  liveFrame();
}

/* Смуга реального режиму. Кадр тут нічого не рухає — лише показує числа,
   бо самі цілі рухає шар за даними стрічки. */
function liveFrame(){
  if(!LIVE)return;
  const now=Date.now(), n=LIVE.n, wide=innerWidth>600;
  $('live-time').textContent=fmtT((now-LIVE.t0)/1000);
  const mins=s=>s==null?null:(s<60?'<1 хв':Math.round(s/60)+' хв');
  const e=mins(n.eta), me=mins(n.etaMe);
  $('live-cnt').innerHTML=wide
    ? '<em>'+n.seen+'</em> '+plural(n.seen,'ціль','цілі','цілей')+' · <em>'+n.zone+'</em> в зонах'+
      (e?' · у зону через <em>'+e+'</em>':'')+(me?' · до вас <em>'+me+'</em>':'')
    : '<em>'+n.seen+'</em>ц · <em>'+n.zone+'</em>з'+
      (e?' · <em>'+e+'</em>':'')+(me?' · ⌖<em>'+me+'</em>':'');
  chrUI();
}

/* ── кнопки в ШАРАХ ── */
function scnUI(){
  simUI();
  const e=$('scn-sum');if(!e)return;
  const l=simList(),p=l.filter(o=>o.type==='pvo').length,t=l.filter(o=>o.type==='strike').length;
  const n=l.filter(o=>o.type==='strike').reduce((a,o)=>a+(o.st.salvo||1),0);
  e.textContent=(p||t)?(p+' позицій ППО · '+t+' пускових · '+n+' бортів у нальоті')
    :'ППО й пускові ставляться інструментами ⊕ і ⇈';
  const b=$('btn-scn');if(b)b.disabled=!t;
}
$('btn-scn').onclick=()=>{simGo();closePanels()};
$('btn-scn-demo').onclick=()=>{
  /* демо кладемо справжніми обʼєктами — так його можна крутити,
     пересувати й зберігати, як усе інше в КОСТИЛІ */
  const d=KostylSim.demo();
  /* відкрита картка демо-обʼєкта воскресила б його «збереженням» поверх
     нового комплекту — закриваємо до того, як старий комплект зникне */
  S.cur=null;S.curNew=false;S.sel=null;closePanels();
  mutate(()=>{
    /* друге натискання клало другий комплект точно на перший — візуально
       не відрізнити, а наліт ішов із подвоєним боєкомплектом */
    S.objs=S.objs.filter(o=>!(o.st&&o.st.demo&&(o.type==='pvo'||o.type==='strike')));
    d.pvo.forEach(p=>S.objs.push({id:uid(),n:S.seq++,type:'pvo',name:'',note:'',groupId:null,
      coords:[p.pos],visible:true,created:Date.now(),
      st:Object.assign({},DEF_ST,{sys:p.key,color:'#64FF8F',demo:1})}));
    d.launchers.forEach(L=>S.objs.push({id:uid(),n:S.seq++,type:'strike',name:'',note:'',groupId:null,
      coords:L.path.map(c=>c.slice()),visible:true,created:Date.now(),
      st:Object.assign({},DEF_ST,{wpn:L.wpn,salvo:L.salvo,gap:L.gap,delay:L.delay,
        color:(TERRAIN_SPECS.SPEC[L.wpn]||{}).col||'#ff3b30',demo:1})}));
  });
  render();scnUI();
  try{map.fitBounds([[30.0,50.1],[34.8,52.3]],{padding:60,duration:700})}catch(e){}
  st('демо-наліт розставлено — тисни «запустити наліт»',1);
};


/* тести чистої логіки (headless) */
window.__kostyl={applyTreeW,map:()=>map,air:()=>({AL:airAL,L:airL,feed:airFeed}),airStart,airStop,airRender,
  sim:()=>({RUN,simT,simPlay,simSpd,list:simList(),log:simLog}),simGo,simEnd,scnUI,
  live:()=>LIVE,liveGo,liveEnd,simUI,setMode:m=>{simMode=m;simUI()},boot:()=>boot(),render:renderNow,clipPoly,dropWithLinks,symNorm,sidcOf,get lastStyle(){return lastStyle},startDraw,addPoint,doneDraw,openObj,openUnit,setTool,onUp:()=>onUp(),dist,bearing,dest,plen,parea,circlePoly,sectorPoly,sectorParams,pip,simplify,arrowParts,ring,mid,S:()=>S,barReport,domeRingDraw};

}
})();

</script>
