<style>
/* --- SICH v2 · colors.css --- */
/* SICH v2 — colour. Measured from Boid Predator (QuadNode 2026) frames, ±3/channel; contrast fixed per brief C3. */
:root {
  /* ---- тло ---- */
  --void:   #000000;  /* canvas / field / map */
  --raised: #0E0B04;  /* modal body — warm black under a bright frame */
  --slot:   #1A1708;  /* card slot fill */
  --grid:   #3C3C3C;  /* field grid, 200px step (raised from #292929) */
  --hover:  #0D0D0D;  /* designed, not observed: row hover */
  --active: #161616;  /* designed, not observed: row press */

  /* ---- текстова драбина ---- contrast on #000 */
  --ink-1: #FFFFFF;   /* 21.0:1 heading, active tab, selected row */
  --ink-2: #B7B7B7;   /* 10.5:1 value, body */
  --ink-3: #747474;   /*  4.5:1 label, section header, inactive tab (was #575757) */
  --ink-4: #595959;   /*  3.0:1 locked */
  --ink-5: #3F3F3F;   /*  2.0:1 ghost — present but unreachable (was #2E2E2E) */

  /* ---- семантика ---- */
  --cost:   #FD464B;  /*  6.2:1 danger · critical · destructive · RED readiness */
  --affirm: #64FF8F;  /* 16.2:1 available · selected · primary action · GREEN readiness */
  --warn:   #FDC828;  /* 13.5:1 caution · historical mode · AMBER readiness */
  --info:   #92DDFD;  /* 14.0:1 informational · ASSIGNED · attached (OPCON/TACON in) */

  /* ---- сутності SICH (наскрізний колір: заголовок секції = ціна = рядок HUD) ---- */
  --ent-unit:   #B7B7B7;  /* підрозділ / ОШС — the base currency, deliberately = ink-2 */
  --ent-cap:    #92DDFD;  /* спроможність */
  --ent-asset:  #CEDDFE;  /* засіб / ресурс / ОС */
  --ent-target: #B283FD;  /* ціль */
  --ent-task:   #FDCB54;  /* задача / контроль */

  /* ---- драбина ступенів (reads in greyscale: 1 darkest → 5 lightest) ---- */
  --tier-1: #B46328;  /* 4.8:1 */
  --tier-2: #B6BED3;  /* 11.3:1 */
  --tier-3: #FDC828;  /* 13.5:1 */
  --tier-4: #B283FD;  /* 7.6:1 */
  --tier-5: #B6F1D5;  /* 16.5:1 */

  /* ---- доменні аліаси ---- */
  --ready-green: var(--affirm); --ready-amber: var(--warn); --ready-red: var(--cost); --ready-grey: var(--ink-3);
  --avail-available: var(--affirm); --avail-reserved: var(--warn); --avail-assigned: var(--info); --avail-unavailable: var(--cost); --avail-unknown: var(--ink-3);
  --prio-critical: var(--cost); --prio-high: var(--tier-3); --prio-medium: var(--info); --prio-low: var(--ink-3);
  --rel-detached: var(--warn);  /* → у чужому OPCON/TACON */
  --rel-attached: var(--info);  /* ← під моїм OPCON/TACON */

  /* ---- тінт середовища (стан фарбує світ, ~8% поверх --void) ---- */
  --tint-danger: rgba(255,196,217,0.08);
  --tint-info:   rgba(196,222,255,0.08);
  --tint-affirm: rgba(209,255,192,0.08);
  --tint-warn:   rgba(255,224,160,0.08);
  --tint: transparent;            /* current mode tint — set by [data-mode] */
  --grid-live: #3C3C3C; --grid-warn: #48412B; --grid-danger: #4A3236; --grid-info: #333B48; --grid-affirm: #33452F;

  --scrim: rgba(0,0,0,0.6);       /* modal backdrop — required unless the frame is bright and thick */
  --frame: var(--tier-3);         /* default modal frame: 1px gold */

  /* ---- категорійні кольори груп (ФОСФОР-7 --cat-*, переведені на чорне полотно) ----
     Єдине місце, де дозволений інший відтінок — і лише щоб розрізнити групи (шари, типи засобів, райони).
     Усі приглушені до одного рівня світлоти (≥11:1 на #000), щоб жодна не кричала. Це не шкала —
     grayscale-тест до них не застосовний; група завжди дублюється підписом. */
  --cat-rose: #E68AA0;  --cat-terracotta: #E08A62;  --cat-sand: #D9C07E;  --cat-olive: #AEBE72;  --cat-pine: #7FC79A;
  --cat-jade: #6FC7B8;  --cat-sea: #79B8D6;  --cat-azure: #8FB2E8;  --cat-lavender: #AFA2E8;  --cat-plum: #C795D4;

  /* ---- полотно малювання ---- */
  --draw-ink: var(--affirm);     /* готова геометрія */
  --draw-rubber: var(--warn);    /* гумова лінія до курсора — точка ще не поставлена */
  --draw-close: var(--info);     /* замикаюча лінія полігона */
  --draw-snap: var(--ink-1);     /* підсвічена точка прилипання */
  --draw-fill: rgba(100,255,143,0.08);
}
/* Mode paints the whole background layer, not just a badge. */
:root[data-mode="historical"] { --tint: var(--tint-warn);   --grid: var(--grid-warn); }
:root[data-mode="offline"]    { --tint: var(--tint-danger); --grid: var(--grid-danger); }
:root[data-mode="alert"]      { --tint: var(--tint-danger); --grid: var(--grid-danger); }
:root[data-mode="sync"]       { --tint: var(--tint-info);   --grid: var(--grid-info); }

/* --- SICH v2 · typography.css --- */
/* SICH v2 — typography. One monospaced face; register carries structure. */
:root {
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --font-body: var(--font-mono);   /* there is no second face */

  /* sizes — body 15 / section 20 / title 28 measured; 12–13 designed for dense data & meta */
  --fs-1: 12px;   /* meta, card footer, status bar */
  --fs-2: 13px;   /* dense table cells, HUD taxonomy */
  --fs-3: 15px;   /* body — desktop minimum for reading text */
  --fs-4: 20px;   /* section header (≈1.33× body) */
  --fs-5: 28px;   /* page title, bold, centred */
  --fs-mobile-min: 16px; /* never 15px as the mobile minimum (brief C4) */

  /* baselines — 24px body rhythm */
  --lh-1: 16px; --lh-2: 20px; --lh-3: 24px; --lh-4: 28px; --lh-5: 36px;

  --fw-regular: 400;  /* @kind font */
  --fw-bold: 700;     /* @kind font */
  --ls-0: 0;          /* @kind font */ /* mono is never tracked */

  --adv: 9px;         /* glyph advance at 15px (0.6em); column math in ch */
}

/* --- SICH v2 · spacing.css --- */
/* SICH v2 — space, radius, borders, hit targets, shell dimensions. */
:root {
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 40px; --sp-7: 64px;
  --edge: 16px;        /* HUD inset from screen edge (8–16 measured) */
  --gap-row: 24px;     /* one text row */
  --gap-sec: 40px;     /* before a section header (34–44 measured) */
  --inset-modal: 40px; /* modal inset from all four edges */
  --grid-step: 200px;  /* field grid; verticals from x=160, horizontals from y=140 */

  --r-0: 0;            /* @kind radius */ /* outer modal frame, tabs, rules */
  --r-1: 4px;          /* cards, banners, inputs, buttons */
  --bw: 1px;           /* the only border width */
  --bw-focus: 1px;

  --hit-sm: 24px;      /* inline row action (mouse) */
  --hit-md: 32px;      /* default desktop control */
  --hit-lg: 44px;      /* touch */

  /* шкала контролів (з ФОСФОР-7): одна висота на розмір, без винятків.
     Висота задається висотою, не падінгом — інакше кнопка, поле й сегмент у ряду не сходяться. */
  --h-xs: 24px; --h-sm: 28px; --h-md: 32px; --h-lg: 44px;
  --px-xs: 8px; --px-sm: 10px; --px-md: 14px; --px-lg: 20px;
  --gap-ctl: 8px;   /* між контролами в ряду */
  --gap-grp: 16px;  /* між групами контролів */

  /* shell regions (desktop 1440+) */
  --h-topbar: 40px; --h-statusbar: 28px; --h-hintbar: 32px;
  --w-nav: 240px; --w-nav-rail: 56px; --w-tree: 268px; --w-tree-rail: 38px; --w-context: 320px;
  --card-w: 210px; --card-h: 190px;  /* slot card */
  --banner-w: 460px; --banner-h: 38px;
  --w-tools: 40px;     /* вертикальна панель інструментів */
  --w-layers: 300px;   /* менеджер шарів */
  --h-timeline: 56px;  /* шкала часу */
}

/* --- SICH v2 · motion.css --- */
/* SICH v2 — motion & focus. Not observed in source; designed: instant state flips, short functional eases. */
:root {
  --dur-0: 0ms;    /* @kind other */ /* status flips, selection: instant */
  --dur-1: 80ms;   /* @kind other */ /* hover */
  --dur-2: 120ms;  /* @kind other */ /* panel, menu, tooltip */
  --dur-3: 180ms;  /* @kind other */ /* modal, drawer, mode tint */
  --ease: cubic-bezier(0.2, 0, 0, 1);   /* @kind other */
  --ease-linear: linear;                /* @kind other */
  --blink: 1s;     /* @kind other */ /* cursor ▌ blink in loaders */
  --spin: 800ms;   /* @kind other */ /* text spinner ⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏ */
  --pulse: 2.4s;   /* @kind other */ /* «живе» — об'єкт на звʼязку, супровід іде */

  --focus-ring: 0 0 0 2px var(--void), 0 0 0 3px var(--affirm);  /* @kind shadow */
}

/* --- SICH v2 · base.css --- */
/* SICH v2 — base document rules + the few text utilities the system is built from. */
html, body { margin: 0; background: var(--void); color: var(--ink-2); font-family: var(--font-mono); font-size: var(--fs-3); line-height: var(--lh-3); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0; background: var(--tint); pointer-events: none; z-index: 0; transition: background var(--dur-3) var(--ease); }
body > * { position: relative; z-index: 1; }
* { box-sizing: border-box; }
a { color: var(--affirm); text-decoration: none; border-bottom: 1px solid var(--ink-5); }
a:hover { color: var(--ink-1); border-bottom-color: var(--affirm); }
::selection { background: var(--affirm); color: var(--void); }
:focus-visible { outline: none; box-shadow: var(--focus-ring); }
h1, h2, h3, p { margin: 0; font-weight: var(--fw-regular); }

/* [key] — the square bracket means "this can be pressed" */
.key { color: var(--ink-3); white-space: nowrap; }
.key::before { content: "["; } .key::after { content: "]"; }
.key.is-on, .is-selected > .key { color: var(--affirm); }
.key.is-off { color: var(--ink-4); }

.title { font-size: var(--fs-5); line-height: var(--lh-5); font-weight: var(--fw-bold); color: var(--ink-1); text-transform: uppercase; text-align: center; }
.sec   { font-size: var(--fs-4); line-height: var(--lh-4); color: var(--ink-3); text-transform: uppercase; }
.sec .ent { color: inherit; }
.label { font-size: var(--fs-2); line-height: var(--lh-2); color: var(--ink-3); text-transform: uppercase; }
.meta  { font-size: var(--fs-1); line-height: var(--lh-1); color: var(--ink-3); }
.ink-1{color:var(--ink-1)} .ink-2{color:var(--ink-2)} .ink-3{color:var(--ink-3)} .ink-4{color:var(--ink-4)} .ink-5{color:var(--ink-5)}
.cost{color:var(--cost)} .affirm{color:var(--affirm)} .warn{color:var(--warn)} .info{color:var(--info)}
.num { text-align: right; font-variant-numeric: tabular-nums; }
.rule { border: 0; border-top: var(--bw) solid var(--ink-5); margin: 0; }

/* three degrees of dimming instead of hiding */
.is-locked, .is-locked * { color: var(--ink-4) !important; }
.is-ghost,  .is-ghost *  { color: var(--ink-5) !important; }


/* --- ТЕРЕН --- */
/* ТЕРЕН · шкіра SICH Design System v2.
   Значення беруться лише з токенів системи. Тіней, світіння, градієнтів і блюру нема.
   Рамка 1px — єдиний носій «висоти». Радіус 0 на оболонці, 4 на контролах.
   Десктоп ≥1024 — оболонка ОШС: top bar · nav · журнал · мапа · контекст · status bar.
   Нижче 1024 — польова модель: мапа на весь екран, нижня панель, шухляди знизу. */

:root{
  --f-1:12px; --f-2:13px; --f-3:16px;      /* мобільний мінімум — 16 (C4) */
  --lh-b:24px;
  --tools-h:68px;                           /* нижня панель, моб */
  --h-vptools:58px;                         /* тулбар угорі вьюпорта */
  --panel-w:380px;                          /* шухляда, моб/планшет */
  --safe-t:env(safe-area-inset-top,0px);  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
@media(min-width:900px){ :root{ --f-3:15px; --tools-h:0px } }

html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--void);
  color:var(--ink-2);font-family:var(--font-mono);font-size:var(--f-3);line-height:var(--lh-b);
  letter-spacing:var(--ls-0);font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;touch-action:manipulation}
teren-app{display:block;position:fixed;inset:0;overflow:hidden;background:var(--void)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.hid{display:none!important}
.dim{color:var(--ink-3)}
.grow{flex:1;min-width:0}

/* ═══ гліфи стану: колір + гліф + підпис, ніколи колір сам ═══ */
@keyframes braille{
  0%{content:"⠋"}10%{content:"⠙"}20%{content:"⠹"}30%{content:"⠸"}40%{content:"⠼"}
  50%{content:"⠴"}60%{content:"⠦"}70%{content:"⠧"}80%{content:"⠇"}90%{content:"⠏"}}
.led{flex:none;min-width:2ch;text-align:center;color:var(--affirm)}
.led::before{content:"●"}
.led.busy{color:var(--warn)}
.led.busy::before{content:"⠋";animation:braille var(--spin) steps(1) infinite}
.led.err{color:var(--cost)}
.led.err::before{content:"✕"}

/* ═══ контроли ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  height:var(--h-lg);padding:0 var(--px-md);line-height:1;white-space:nowrap;
  font-size:var(--f-2);background:transparent;color:var(--ink-2);
  border:var(--bw) solid var(--ink-4);border-radius:var(--r-1);
  transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
@media(hover:hover){.btn:hover{background:var(--hover);color:var(--ink-1);border-color:var(--ink-3)}}
.btn:active{background:var(--active)}
.btn.on{background:var(--active);color:var(--ink-1);border-color:var(--affirm)}
.btn.warn{color:var(--cost)}
.btn.ok{color:var(--affirm)}
@media(hover:hover){
  .btn.warn:hover{background:var(--hover);color:var(--cost);border-color:var(--ink-3)}
  .btn.ok:hover{background:var(--hover);color:var(--affirm);border-color:var(--ink-3)}}
.btn[disabled]{color:var(--ink-4);border-color:var(--ink-5);background:transparent;cursor:not-allowed}
.btn--sm{height:var(--h-sm);padding:0 var(--px-sm);font-size:var(--f-1)}
.btn--lg{height:var(--h-lg)}

.inp{display:block;width:100%;height:var(--h-lg);padding:0 var(--sp-3);
  font-size:var(--f-3);color:var(--ink-1);background:var(--void);
  border:var(--bw) solid var(--ink-4);border-radius:var(--r-1);
  -webkit-user-select:text;user-select:text;
  transition:border-color var(--dur-1) var(--ease)}
.inp::placeholder{color:var(--ink-4)}
@media(hover:hover){.inp:hover{border-color:var(--ink-3)}}
.inp:focus{border-color:var(--affirm);box-shadow:none}

/* свіч — текстовий гліф системи, не пілюля */
.chk{flex:none;display:inline-flex;align-items:center;justify-content:flex-end;
  min-width:52px;min-height:var(--h-md);cursor:pointer;color:var(--ink-3);
  font-size:var(--f-3);transition:color var(--dur-1) var(--ease)}
.chk::after{content:"[▪  ]";white-space:pre}
.chk.on{color:var(--affirm)}
.chk.on::after{content:"[  ▪]"}
@media(hover:hover){.chk:hover{color:var(--ink-1)}}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:var(--h-lg);
  background:transparent;cursor:pointer;margin:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink-5);border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:20px;margin-top:-9px;
  background:var(--affirm);border:0;border-radius:0}
input[type=range]::-moz-range-track{height:2px;background:var(--ink-5);border:0}
input[type=range]::-moz-range-thumb{width:10px;height:20px;border:0;border-radius:0;background:var(--affirm)}
@media(hover:hover){
  input[type=range]:hover::-webkit-slider-runnable-track{background:var(--ink-4)}
  input[type=range]:hover::-moz-range-track{background:var(--ink-4)}}

/* ═══ каркас ═══ */
#shell{position:absolute;inset:0}
#mid{position:absolute;inset:0}
#topbar,#vptools{display:none}
#tree-col,#ctx-col{display:contents}

#work{position:absolute;inset:0}
#map{position:absolute;inset:0;touch-action:none;z-index:0;background:var(--void)}
.maplibregl-control-container{display:none}
#map.crosshair .maplibregl-canvas-container{cursor:crosshair!important}
#map.grab .maplibregl-canvas-container{cursor:grabbing!important}

/* ═══ рядок стану ═══ */
#statusbar{position:absolute;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;gap:var(--sp-2);
  background:var(--void);border-bottom:var(--bw) solid var(--ink-5);
  padding:calc(var(--sp-2) + var(--safe-t)) calc(var(--sp-4) + var(--safe-r)) var(--sp-2) calc(var(--sp-4) + var(--safe-l));
  font-size:var(--f-1);line-height:var(--lh-1);color:var(--ink-3);white-space:nowrap;overflow:hidden;
  min-height:calc(36px + var(--safe-t))}
#statusbar .pfx{color:var(--ink-3);flex:none}
#st-txt{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;color:var(--ink-2)}
#z-ro{flex:none;color:var(--ink-3)}
#sb-net{flex:none;color:var(--affirm)}
#sb-net.off{color:var(--cost)}

/* ═══ верхня смуга (десктоп) ═══ */
#topbar{height:var(--h-topbar);align-items:center;gap:var(--sp-5);padding:0 var(--edge);
  border-bottom:var(--bw) solid var(--ink-5);background:var(--void);
  font-size:var(--f-2);white-space:nowrap;overflow:hidden}
#topbar .brand{color:var(--ink-1);font-weight:var(--fw-bold);font-size:var(--f-3);flex:none}
#topbar .crumbs{display:flex;gap:var(--sp-2);color:var(--ink-3);flex:none}
#topbar .crumbs .sep{color:var(--ink-5)}
#topbar .crumbs .cur{color:var(--ink-2)}
.tbtn{display:inline-flex;align-items:center;gap:var(--sp-2);flex:none;height:var(--h-md);padding:0 var(--sp-2);
  color:var(--ink-3);border-radius:var(--r-1);transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
@media(hover:hover){.tbtn:hover{background:var(--hover);color:var(--ink-1)}}
.tbtn .key{color:inherit}
#tb-clock{flex:none;color:var(--ink-2)}
#tb-net{flex:none;color:var(--affirm)}
#tb-net.off{color:var(--cost)}

  while(i<c.length){const s=dist(c[i-1],c[i]);if(d<=s){const br=bearing(c[i-1],c[i]);return{p:dest(c[i-1],br,d),b:br}}d-=s;i++}

const DEM_SRC=[

  {id:'aws',url:'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png',max:15},
  {id:'openzenith',url:'https://openzenith.cyopsys.com/api/dem-tile/{z}/{x}/{y}',max:12}];

function fetchTO(url,ms,sig){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);
  if(sig){try{sig.addEventListener('abort',()=>ctl.abort())}catch(e){}}
  return fetch(url,{signal:ctl.signal,mode:'cors'}).then(r=>{clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer()}).catch(e=>{clearTimeout(t);throw e})}
function fetchDem(z,x,y,sig){const k=tkey(z,x,y);if(demRaw[k])return demRaw[k];
  const chain=DEM_SRC.reduce((prev,s)=>prev.catch(()=>{if(z>s.max)throw new Error('zoom');
    return fetchTO(s.url.replace('{z}',z).replace('{x}',x).replace('{y}',y),7000,sig).then(b=>{if(!demOk){demOk=1;demWho=s.id;logSrc('рельєф пішов з '+s.id);onDemReady()}return b})}),Promise.reject(new Error('init')));
  demRaw[k]=chain;chain.catch(()=>{if(demRaw[k]===chain)delete demRaw[k];demFail++});return chain}
try{maplibregl.addProtocol('dem',(params,ac)=>{const m=/dem:\/\/(\d+)\/(\d+)\/(\d+)/.exec(params.url);
  if(!m)return Promise.reject(new Error('bad dem url'));return fetchDem(+m[1],+m[2],+m[3],ac&&ac.signal).then(b=>({data:b}))});}catch(e){}
const mxT=(l,z)=>(l+180)/360*Math.pow(2,z);
const myT=(l,z)=>{const s=Math.sin(rad(l));return (.5-Math.log((1+s)/(1-s))/(4*Math.PI))*Math.pow(2,z)};
function decodeDem(z,x,y){const k=tkey(z,x,y);if(demGrid[k]!==undefined)return Promise.resolve(demGrid[k]);
  return fetchDem(z,x,y).then(buf=>createImageBitmap(new Blob([buf]))).then(bmp=>{
    const cv=document.createElement('canvas');cv.width=cv.height=256;const ctx=cv.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(bmp,0,0,256,256);const d=ctx.getImageData(0,0,256,256).data,g=new Float32Array(65536);
    for(let i=0,j=0;i<65536;i++,j+=4){const e=d[j]*256+d[j+1]+d[j+2]/256-32768;g[i]=e<=-32000?NaN:e}
    try{bmp.close&&bmp.close()}catch(e){}demGrid[k]=g;return g}).catch(()=>{demGrid[k]=null;return null})}
const DEMZ=12;
function elevAt(p){const fx=mxT(p[0],DEMZ),fy=myT(p[1],DEMZ),tx=Math.floor(fx),ty=Math.floor(fy);
  const g=demGrid[tkey(DEMZ,tx,ty)];if(!g)return null;
  const px=(fx-tx)*256,py=(fy-ty)*256,x0=clamp(Math.floor(px),0,255),y0=clamp(Math.floor(py),0,255),x1=Math.min(255,x0+1),y1=Math.min(255,y0+1);
  const dx=px-x0,dy=py-y0,at=(ix,iy)=>{const v=g[iy*256+ix];return isNaN(v)?0:v};
  return (at(x0,y0)*(1-dx)+at(x1,y0)*dx)*(1-dy)+(at(x0,y1)*(1-dx)+at(x1,y1)*dx)*dy}
/* гарантуємо тайли DEM під набором точок, далі elevAt працює синхронно */
function ensureDem(pts){const keys={};pts.forEach(p=>{keys[tkey(DEMZ,Math.floor(mxT(p[0],DEMZ)),Math.floor(myT(p[1],DEMZ)))]=1});
  return Promise.all(Object.keys(keys).map(k=>{const a=k.split('/');return decodeDem(+a[0],+a[1],+a[2])}))}
function heightAt(p){let h=null;try{h=map.queryTerrainElevation({lng:p[0],lat:p[1]})}catch(e){}if(h==null||!isFinite(h))h=elevAt(p);return h}

/* пензлі: паттерн і сітка — це line-pattern, колір запікається в картинку */

/* метрів на екранний піксель — щоб наконечник тримав сталий розмір на будь-якому зумі */
/* MapLibre малює тайлами по 512 px, звідси +1 у степені */
function mPerPx(lat,z){return 156543.03392*Math.cos(rad(lat))/Math.pow(2,z+1)}
function headLen(c,s){
  const z=map?map.getZoom():12,tip=c[c.length-1],seg=dist(c[c.length-2],tip);
  const px=(11+(s.width||3)*2.3)*(s.head||1);
  /* лише верхня межа: інакше на довгій лінії голова роздувалась до кілометрів */

  const L=headLen(c,s);
  const head=(tp,b,len)=>{const back=dest(tp,b+180,len);return [tp,dest(back,b-90,len*.45),dest(back,b+90,len*.45),tp]};
  if(t==='classic'||t==='double'||t==='wedge'||t==='thrust')out.push({g:{type:'Polygon',coordinates:[head(tip,brg,L*(t==='thrust'?1.25:1))]},fill:1});
  if(t==='double'){const b2=bearing(c[1],c[0]);out.push({g:{type:'Polygon',coordinates:[head(c[0],b2,L)]},fill:1})}
  if(t==='open'){out.push({g:{type:'LineString',coordinates:[dest(tip,brg+180+34,L),tip,dest(tip,brg+180-34,L)]},fill:0})}
  if(t==='bar')out.push({g:{type:'LineString',coordinates:[dest(tip,brg-90,L*.55),dest(tip,brg+90,L*.55)]},fill:0});

/* ═══════════ ОБʼЄКТ → ГЕОМЕТРІЯ ═══════════ */
function linkEnds(o){const a=byId(o.aId),b=byId(o.bId);return (a&&b)?[a,b]:null}

  if(o.type==='polygon')return c.length>2?{type:'Polygon',coordinates:[ring(c)]}:null;
  if(o.type==='line')return c.length>1?{type:'LineString',coordinates:c}:null;
  if(o.type==='circle')return c.length>1?{type:'Polygon',coordinates:[circlePoly(c[0],dist(c[0],c[1]))]}:null;
  if(o.type==='sector'){if(c.length<2)return null;const p=sectorParams(c);return {type:'Polygon',coordinates:[sectorPoly(c[0],p.r,p.az,p.w)]}}
  return null}

  if(o.type==='link'){const e=linkEnds(o);if(!e)return [0,0];const a=anchorOf(e[0]),b=anchorOf(e[1]);return [(a[0]+b[0])/2,(a[1]+b[1])/2]}
  if(o.type==='marker'||o.type==='text'||o.type==='unit'||o.type==='circle'||o.type==='sector')return c[0];
  if(o.type==='polygon')return mid(c);return c[Math.floor(c.length/2)]}
function metricsOf(o){const c=o.coords,t=o.type,L=[];
  if(t==='unit'){const sy=symNorm(o.st.sym);
    L.push('символ ...... '+symLabel(sy));
    L.push('належність .. '+AFF_LBL[sy.aff]);
    if(sy.hq)L.push('роль ........ штаб / КП');
    if(sy.mob&&sy.mob!=='none')L.push('рухомість ... '+MOB_LBL[sy.mob]);
    if(sy.status==='planned')L.push('стан ........ очікуваний');
    if(sy.higher)L.push('вище ........ '+sy.higher);
    L.push('SIDC ........ '+sidcOf(sy))}
  if(t==='link'){const e=linkEnds(o);const lt=LINKT[o.st.linkType]||LINKT.subord;
    L.push('тип ......... '+lt[0]);
    L.push('від ......... '+(e?(e[0].name||TYPE[e[0].type]):'— загубився'));
    L.push('до .......... '+(e?(e[1].name||TYPE[e[1].type]):'— загубився'));
    if(e){const g=shapeOf(o);if(g)L.push('відстань .... '+fLen(plen(g.coordinates))+' · '+fAz(bearing(g.coordinates[0],g.coordinates[1])))}
    return L}
  if(t==='polygon'){L.push('площа ....... '+fAr(parea(c)));L.push('периметр .... '+fLen(plen(ring(c))))}
  if(t==='line'){L.push('довжина ..... '+fLen(plen(c)));L.push('азимут ...... '+fAz(bearing(c[0],c[c.length-1])))}
  if(t==='circle'&&c[1]){const r=dist(c[0],c[1]);L.push('радіус ...... '+fLen(r));L.push('площа ....... '+fAr(Math.PI*r*r))}
  if(t==='sector'&&c[1]){const p=sectorParams(c);L.push('радіус ...... '+fLen(p.r));L.push('азимут ...... '+fAz(p.az));L.push('ширина ...... '+Math.round(p.w)+'°')}
  if(t==='marker'||t==='text'||t==='unit'){const h=heightAt(c[0]);if(h!=null)L.push('висота ...... '+Math.round(h)+' м')}
  if(['line','polygon'].includes(t))L.push('вершин ...... '+c.length);

  if(o.type==='link'){const e=linkEnds(o),lt=LINKT[o.st.linkType]||LINKT.subord;
    return lt[0]+(e?' · '+((e[0].name||'?')+' → '+(e[1].name||'?')):' · кінці загубились')}

    const lt=o.type==='link'?(LINKT[s.linkType]||LINKT.subord):null;
    const lcol=lt?lt[1]:col;
    const base={id:o.id,n:o.n,color:lcol,width:s.width,opacity:s.opacity,
      dash:s.anim==='ants'?'ants':(lt&&lt[3]?'dash':s.dash),
      fill:!!(s.fill&&AREA_T[o.type]),fillOpacity:s.fillOpacity,anim:s.anim||'none',

      if(br==='pattern'||br==='grid'){base.pat=patImg(br,col);base.dash='pat'}

    else if(o.type==='marker'){pts.push({type:'Feature',id:o.n,properties:{id:o.id,kind:'marker',icon:glyphImg(s.glyph||'◆',col),size:s.size||1,
      cap:(s.label&&o.name)?capImg(o.name,col):'',prio:s.prio||'low'},geometry:{type:'Point',coordinates:o.coords[0]}})}

      rzb:rzBucket(s.refZoom==null?map.getZoom():s.refZoom)},geometry:{type:'Point',coordinates:o.coords[0]}})}

  });

function addPoint(p){const d=S.draft;if(!d)return;
  if(d.type==='marker'||d.type==='text'||d.type==='unit'){d.coords=[p];doneDraw();return}

function draftGeo(){const d=S.draft,c=d.coords.slice(),f=[];if(!d)return EMPTY;
  const hv=S.hover;const cc=(hv&&c.length&&d.type!=='marker'&&d.type!=='text')?c.concat([hv]):c;
  const fake={type:d.type==='ruler'?'line':d.type,coords:cc,st:DEF_ST};
  const g=shapeOf(fake);if(g)f.push({type:'Feature',properties:{},geometry:g});
  /* у полігона заливка сама по собі контуру не дає — ведемо пунктир по вже
     поставлених точках, щоб форма читалась на кожному кроці */
  if(d.type==='polygon'&&c.length>1)f.push({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:c}});
  if(d.type==='circle'&&cc.length>1)f.push({type:'Feature',properties:{rub:true},geometry:{type:'LineString',coordinates:[cc[0],cc[1]]}});
  if(d.type==='sector'&&cc.length>1){const p=sectorParams(cc);f.push({type:'Feature',properties:{rub:true},geometry:{type:'LineString',coordinates:[dest(cc[0],p.az-p.w/2,p.r),cc[0],dest(cc[0],p.az+p.w/2,p.r)]}})}
  if((d.type==='line'||d.type==='ruler'||d.type==='polygon')&&hv&&c.length){
    f.push({type:'Feature',properties:{rub:true},geometry:{type:'LineString',coordinates:[c[c.length-1],hv]}});
    /* у полігона видно й замикальну сторону — контур читається ще до останнього тапу */
    if(d.type==='polygon'&&c.length>1)f.push({type:'Feature',properties:{rub:true},geometry:{type:'LineString',coordinates:[hv,c[0]]}});}
  return {type:'FeatureCollection',features:f}}

/* ─── події мапи: тап, перетягування вершин, гумова нитка ─── */
let drag=null,downPt=null;
const VX_LAYERS=['d-vx'],HIT_LAYERS=['o-unit','o-unitcap','o-mk','o-mkcap','o-cap','o-fill','o-hatch','o-solid','o-dash','o-dot','o-ants','o-spray','o-brush'];
function vxAt(pt){/* екранна перевірка вершин: не залежить від того, чи встиг GPU розкласти символи */
  const d=S.draft;if(!d)return null;let best=null,bd=20;
  d.coords.forEach((p,i)=>{const q=map.project(p);const dd=Math.hypot(q.x-pt.x,q.y-pt.y);if(dd<bd){bd=dd;best=i}});return best}
function onDown(e){
  if(S.tool==='line'&&drawMode==='free'&&(!S.draft||!S.draft.coords.length)){
    S.draft={type:'line',coords:[[e.lngLat.lng,e.lngLat.lat]],editId:null,free:true};
    pencilOn=true;map.dragPan.disable();map.touchZoomRotate.disable();$('map').classList.add('grab');
    st('олівець веде…',1);
    if(e.originalEvent&&e.originalEvent.cancelable)e.originalEvent.preventDefault();return}
  if(!S.draft)return;
  const pt=e.point;const i=vxAt(pt);
  if(i==null)return;
  drag={i,moved:false};downPt=pt;map.dragPan.disable();$('map').classList.add('grab');
  if(e.originalEvent&&e.originalEvent.cancelable)e.originalEvent.preventDefault()}
let pencilOn=false;
function onDrag(e){
  if(pencilOn&&S.draft){
    const p=[e.lngLat.lng,e.lngLat.lat],c=S.draft.coords,last=c[c.length-1];
    if(!last||dist(last,p)>2)c.push(p);
    drawDraft();
    if(e.originalEvent&&e.originalEvent.cancelable)e.originalEvent.preventDefault();return}
  if(!drag||!S.draft)return;
  const pt=e.point;if(!drag.moved&&Math.hypot(pt.x-downPt.x,pt.y-downPt.y)<4)return;
  drag.moved=true;const ll=e.lngLat;S.draft.coords[drag.i]=[ll.lng,ll.lat];S.hover=null;drawDraft();st(draftHint(),1);
  if(e.originalEvent&&e.originalEvent.cancelable)e.originalEvent.preventDefault()}
function onUp(){
  if(pencilOn){pencilOn=false;map.dragPan.enable();map.touchZoomRotate.enable();$('map').classList.remove('grab');
    suppressClick=Date.now();
    const d=S.draft;
    if(!d||d.coords.length<2){cancelDraw();st('надто коротко — веди довше');return}
    /* спрощення в градусах під поточний зум: ~2.5 px */
    const tol=2.5*360/(512*Math.pow(2,map.getZoom()));
    d.coords=simplify(d.coords,tol);doneDraw();return}
  if(!drag)return;const was=drag;drag=null;map.dragPan.enable();$('map').classList.remove('grab');
  if(was.moved)suppressClick=Date.now()}
let suppressClick=0;
function onHover(e){
  if(S.tool==='link'){if(linkFirst)linkGhost([e.lngLat.lng,e.lngLat.lat]);return}
  if(!S.draft||(e.originalEvent&&e.originalEvent.pointerType==='touch'))return;
  const c=S.draft.coords;if(!c.length||S.draft.type==='marker'||S.draft.type==='text')return;
  S.hover=[e.lngLat.lng,e.lngLat.lat];map.getSource('draft').setData(draftGeo())}
/* Попадання по обʼєкту. Точкові (підрозділ, мітка, напис) завжди виграють
   у ліній, а лінії — у заливок: інакше підрозділ усередині полігона неможливо
   ні вибрати, ні вʼязати — саме на це чіплявся інструмент звʼязків. */
const HIT_RANK={unit:0,marker:0,text:0,link:1,line:1,polygon:2,circle:2,sector:2};
function hitObj(pt,opt){
  opt=opt||{};const R=opt.r||14;
  let hit=[];try{hit=map.queryRenderedFeatures([[pt.x-R,pt.y-R],[pt.x+R,pt.y+R]],
    {layers:HIT_LAYERS.filter(l=>map.getLayer(l))})}catch(err){}
  let best=null,score=1e9,seen={};
  for(const f of hit){
    const id=f.properties&&f.properties.id;if(!id||seen[id])continue;seen[id]=1;
    const o=byId(id);if(!o)continue;
    if(opt.pointsOnly&&HIT_RANK[o.type]!==0)continue;
    const r=HIT_RANK[o.type]==null?1:HIT_RANK[o.type];
    let sc=r*1000;
    if(r===0){const q=map.project(anchorOf(o));sc+=Math.min(999,Math.hypot(q.x-pt.x,q.y-pt.y))}
    else sc+=500;
    if(sc<score){score=sc;best=o}}
  return best}
function onClick(e){
  if(Date.now()-suppressClick<300)return;
  const pt=e.point,p=[e.lngLat.lng,e.lngLat.lat];
  if(S.tool==='link'){
    /* спершу шукаємо лише точкові — підрозділ у полігоні мусить перемагати заливку */
    const o=hitObj(pt,{r:26,pointsOnly:true})||hitObj(pt,{r:14});
    if(!o||o.type==='link'){st(linkFirst?'мимо — тапни по другому обʼєкту':'тапни по обʼєкту, не повз');return}
    if(!linkFirst){linkFirst=o.id;S.sel=o.id;render();lbInfo();
      st('від «'+(o.name||TYPE[o.type])+'» · тепер тапни другий',1);return}
    if(linkFirst===o.id){st('це той самий обʼєкт — тапни інший');return}
    const a=byId(linkFirst),b=o;
    const made=makeLink(a,b);
    /* інструмент лишається в руках: КП тягнеться до пʼяти підрозділів без перезаходу */
    linkFirst=null;S.sel=null;linkGhost(null);lbInfo();render();
    if(made)st(LINKT[lastStyle.linkType||'subord'][0]+' · '+(a.name||TYPE[a.type])+' → '+(b.name||TYPE[b.type])+' · тягни далі',1);
    return}
  if(S.draft){const d=S.draft;const i=vxAt(pt);
    if(i!=null){const c=d.coords;
      if(i===0&&d.type==='polygon'&&c.length>2){doneDraw();return}
      if(i===c.length-1&&(d.type==='line'||d.type==='arrow'||d.type==='ruler')&&c.length>1){doneDraw();return}
      if(i===0&&c.length===1){/* повторний тап по єдиній точці — нічого */return}
    }
    addPoint(p);return}
  /* точкові символи важливіші за заливки під ними */
  const o=hitObj(pt);
  if(o){if(S.sel===o.id){o.type==='unit'?openUnit(o):openObj(o)}else{S.sel=o.id;render();st(TYPE[o.type]+' «'+(o.name||'без назви')+'» · ще тап — картка',1)}return}
  if(S.sel){S.sel=null;render()}
}

function clipPoly(subject,clipRaw){

  if(subj.length>1){const a=subj[0],b=subj[subj.length-1];if(a[0]===b[0]&&a[1]===b[1])subj=subj.slice(0,-1)}

  if(signedArea(clip)<0)clip=clip.slice().reverse();
  const inside=(p,a,b)=>(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0])>=-1e-12;
  const inter=(s,e,a,b)=>{const dcx=b[0]-a[0],dcy=b[1]-a[1],dsx=e[0]-s[0],dsy=e[1]-s[1];

/* Префікс приходить як '│  '/'   ' на рівень плюс '├─'/'└─'. Розбираємо його на
   колонки-напрямні: лінії малює CSS на всю висоту рядка, тож вони не рвуться,
   коли рядок стає вищим. */
function guides(pre){
  pre=pre||'';let s='',i=0;
  while(pre.substr(i,3)==='│  '||pre.substr(i,3)==='   '){s+='<i class="gd'+(pre[i]==='│'?' v':'')+'"></i>';i+=3}
  const tail=pre.slice(i);
  if(tail==='├─')s+='<i class="gd tee"></i>';
  else if(tail==='└─')s+='<i class="gd elb"></i>';
  return '<span class="pre">'+s+'</span>'}
function rowObj(o,pre){const col=colorOf(o);
  return '<div class="node'+(visEff(o)?'':' off')+(o.id===S.sel?' sel':'')+'" data-o="'+o.id+'">'+guides(pre)+
    '<span class="ncol"><span class="nm" style="color:'+col+'">'+TYPE_G[o.type]+' '+esc(o.name||TYPE[o.type])+
    (o.st.anim&&o.st.anim!=='none'?' <span class="dim">~</span>':'')+(o.st.prio==='high'?' <span class="dim">!!</span>':'')+'</span>'+
    '<span class="mt2">'+esc(metaOf(o))+'</span></span>'+
    '<span class="acts"><b data-act="vis">'+(o.visible?'◉':'○')+'</b><b data-act="edit">✎</b><b data-act="del">✕</b></span></div>'}
function rowGrp(g,pre){return '<div class="node grp'+(gVis(g.id)?'':' off')+'" data-g="'+g.id+'">'+guides(pre)+'<i class="tri">'+(g.collapsed?'▶':'▼')+'</i>'+
  '<span class="nm" style="flex:1;color:'+(g.color||'var(--ink-1)')+'">['+esc(g.name)+']</span><span class="mt">'+subCount(g.id)+'</span>'+
  '<span class="acts"><b data-act="gadd">+</b><b data-act="gvis">'+(g.visible?'◉':'○')+'</b><b data-act="gedit">✎</b><b data-act="gdel">✕</b></span></div>'}
function rows(parent,pre,out){
  const items=kids(parent).map(x=>({t:'g',x})).concat(S.objs.filter(o=>(o.groupId||null)===(parent||null)).map(x=>({t:'o',x})));
  items.forEach((it,i)=>{const last=i===items.length-1,br=pre+(last?'└─':'├─');
    if(it.t==='g'){out.push(rowGrp(it.x,br));if(!it.x.collapsed)rows(it.x.id,pre+(last?'   ':'│  '),out)}else out.push(rowObj(it.x,br))})}
/* ORBAT: підрозділи по приналежності → вищому формуванню */
function orbatTree(){
  const units=S.objs.filter(o=>o.type==='unit');
  if(!units.length)return '<div class="empty">┌─ підрозділів ще нема\n└─ інструмент ⬟ ПІДРОЗДІЛ ставить перший</div>';
  const out=[];
  const AFFC={friend:'#80E0FF',hostile:'#FF8080',neutral:'#AAFFAA',unknown:'#FFFF80',assumed:'#80E0FF',suspect:'#FF8080'};
  AFF_ORDER.forEach(aff=>{
    const mine=units.filter(u=>symNorm(u.st.sym).aff===aff);if(!mine.length)return;
    out.push('<div class="node grp"><span class="pre"></span><i class="tri">▼</i><span class="nm" style="flex:1;color:'+AFFC[aff]+'">['+esc(AFF_LBL[aff])+']</span><span class="mt">'+mine.length+'</span></div>');
    const byHigher={};mine.forEach(u=>{const h=((u.st.sym||{}).higher||'').trim()||'— без вищого';(byHigher[h]=byHigher[h]||[]).push(u)});
    const keys=Object.keys(byHigher).sort();
    keys.forEach((h,hi)=>{
      const last=hi===keys.length-1;
      out.push('<div class="node grp">'+guides(last?'└─':'├─')+'<span class="nm" style="flex:1;color:var(--ink-3)">'+esc(h)+'</span><span class="mt">'+byHigher[h].length+'</span></div>');
      byHigher[h].forEach((u,ui,arr)=>{
        const pre=(last?'   ':'│  ')+(ui===arr.length-1?'└─':'├─');
        const links=S.objs.filter(x=>x.type==='link'&&(x.aId===u.id||x.bId===u.id)).length;
        out.push('<div class="node'+(visEff(u)?'':' off')+(u.id===S.sel?' sel':'')+'" data-o="'+u.id+'">'+
          guides(pre)+'<span class="ncol">'+
          '<span class="nm" style="color:'+colorOf(u)+'">⬟ '+esc(u.name||'підрозділ')+((u.st.sym||{}).desig?' <span class="dim">'+esc(u.st.sym.desig)+'</span>':'')+'</span>'+
          '<span class="mt2">'+esc(symLabel(u.st.sym))+(links?' · звʼязків '+links:'')+'</span></span>'+
          '<span class="acts"><b data-act="vis">'+(u.visible?'◉':'○')+'</b><b data-act="edit">✎</b><b data-act="del">✕</b></span></div>')})})});
  return out.join('')}
function renderTree(){
  const box=$('tree'),q=S.query.toLowerCase().trim();if(!box||!$('p-log').classList.contains('open'))return;
  if(S.filter==='orbat'&&!q){box.innerHTML=orbatTree();return}
  if(q||S.filter!=='all'){
    const list=S.objs.filter(o=>{if(S.filter==='hidden'){if(visEff(o))return false}else if(S.filter!=='all'&&S.filter!=='orbat'&&o.type!==S.filter)return false;

    box.innerHTML=list.length?list.map(o=>rowObj(o,'├─')).join(''):'<div class="empty">└─ нічого не знайшов за фільтром</div>';return}

function spark(vals,w){const ok=vals.filter(v=>v!=null);if(!ok.length)return '└─ DEM ще не декодований — відкрий панель ще раз';
  const mn=Math.min(...ok),mx=Math.max(...ok),bars='▁▂▃▄▅▆▇█';let s='';
  const step=Math.max(1,Math.ceil(vals.length/w));for(let i=0;i<vals.length;i+=step){const v=vals[i];s+=v==null?' ':bars[Math.round((v-mn)/((mx-mn)||1)*7)]}
  return '┌─ '+Math.round(mx)+' м\n'+s+'\n└─ '+Math.round(mn)+' м · перепад '+Math.round(mx-mn)+' м'}
function openRuler(c){rulerCoords=c;const L=plen(c);
  const lines=['довжина ..... '+fLen(L),'азимут ...... '+fAz(bearing(c[0],c[c.length-1]))+' (прямий)','сегментів ... '+(c.length-1)];
  if(c.length>2)lines.push('площа ....... '+fAr(parea(c))+' (якби замкнути)');
  $('ru-metrics').textContent=lines.map((l,i,a)=>(i===a.length-1?'└─ ':'├─ ')+l).join('\n');
  $('ru-segs').textContent=c.slice(1).map((p,i)=>(i===c.length-2?'└─ ':'├─ ')+String(i+1).padStart(2,'0')+' '+fLen(dist(c[i],p)).padEnd(9)+' '+fAz(bearing(c[i],p))).join('\n');
  $('ru-profile').textContent='└─ декодую DEM…';openPanel('p-ruler');
  const pr0=profile(c,60);ensureDem(pr0.map(x=>pointAlong(c,x.d/(L||1)).p)).then(()=>{const pr=profile(c,60);
    let up=0,dn=0;for(let i=1;i<pr.length;i++){if(pr[i].h==null||pr[i-1].h==null)continue;const d=pr[i].h-pr[i-1].h;if(d>0)up+=d;else dn-=d}
    $('ru-profile').textContent=spark(pr.map(x=>x.h),60)+'\n   підйом +'+Math.round(up)+' м · спуск −'+Math.round(dn)+' м';
    const h0=pr[0].h,h1=pr[pr.length-1].h;if(h0!=null&&h1!=null)$('ru-metrics').textContent+='\n   висоти: '+Math.round(h0)+' → '+Math.round(h1)+' м'})}

        if(t==='link'){o.aId=p.aId;o.bId=p.bId}
        S.objs.unshift(o);n++});
      /* звʼязки без обох кінців нічого не малюють — прибираємо одразу */
      S.objs=S.objs.filter(o=>o.type!=='link'||(byId(o.aId)&&byId(o.bId)))});
    st('затягнув '+n+' '+plural(n,'обʼєкт','обʼєкти','обʼєктів'))}catch(err){st('файл битий, не зайшло: '+err.message,0,'err')}e.target.value=''};
  r.readAsText(f)};

/* ═══════════ ГЕО, КЛАВІШІ, СЛУЖБОВЕ ═══════════ */
let myPos=null,meSrc=false;
function askGeo(auto){
  if(!navigator.geolocation){if(!auto)st('геолокації тут нема');return}
  if(!auto&&myPos){dropFit();map.flyTo({center:myPos,zoom:Math.max(map.getZoom(),14.5),duration:900});st('ти тут, я бачу');return}
  if(!auto)st('ловлю супутники…',1,'busy');
  navigator.geolocation.getCurrentPosition(pos=>{myPos=[pos.coords.longitude,pos.coords.latitude];
    if(!meSrc){map.addSource('me',{type:'geojson',data:EMPTY});map.addLayer({id:'l-me',type:'symbol',source:'me',layout:{'icon-image':glyphImg('⌖',themeCols().affirm),'icon-allow-overlap':true,'icon-size':1.1}});meSrc=true}
    map.getSource('me').setData({type:'FeatureCollection',features:[{type:'Feature',properties:{},geometry:{type:'Point',coordinates:myPos}}]});
    $('c-geo').classList.add('live');
    if(!auto){dropFit();map.flyTo({center:myPos,zoom:Math.max(map.getZoom(),14.5),duration:1200})}
    st(auto?'позицію взяв, ⌖ на мапі':'ти тут, я бачу')},
    ()=>{if(!auto)st('gps кобенится — дай дозвіл або став вручну',0,'err')},{enableHighAccuracy:true,timeout:10000,maximumAge:30000})}
$('c-geo').onclick=()=>askGeo(false);
$('c-undo').onclick=undo;$('c-redo').onclick=redo;
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'){if(e.key==='Escape')e.target.blur();return}
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo();return}
  if(e.key==='Escape'){if(linkFirst){linkFirst=null;S.sel=null;linkGhost(null);lbInfo();render();st('перший обʼєкт відпущено');return}
    if(S.draft||S.tool){cancelDraw();st('інструмент відпущено')}else if(document.querySelector('.panel.open'))dismiss();else if(S.sel){S.sel=null;render()}return}
  if(e.key==='Enter'&&S.draft){doneDraw();return}
  if(e.key==='Backspace'&&S.draft){e.preventDefault();$('dw-undo').click();return}
  if((e.key==='Delete'||e.key==='Backspace')&&S.sel&&!S.draft){const o=byId(S.sel);if(o&&confirm('Видалити «'+(o.name||TYPE[o.type])+'»?')){S.sel=null;mutate(()=>{S.objs=dropWithLinks(o.id)});st('здуло з мапи')}return}
  const KM={l:'line',p:'polygon',m:'marker',c:'circle',s:'sector',t:'text',r:'ruler',u:'unit',k:'link',
    д:'line',з:'polygon',ь:'marker',с:'circle',і:'sector',е:'text',к:'ruler',г:'unit',л:'link'};
  if(KM[k]&&!e.ctrlKey&&!e.metaKey){setTool(KM[k]);return}
  if(k==='j'||k==='о'){$('c-log').click();return}
  if(k==='g'||k==='п'){$('c-layers').click();return}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&booted)render()});
window.addEventListener('online',()=>{st('мережа є, тягну тайли');if(map)map.triggerRepaint()});
window.addEventListener('offline',()=>st('мережа впала — те, що є, працює далі',0,'err'));
window.addEventListener('error',e=>{try{logSrc('JS: '+(e.message||'')+' @'+(e.lineno||''))}catch(_){}});
window.addEventListener('unhandledrejection',e=>{try{logSrc('PROMISE: '+(e.reason&&e.reason.message||e.reason))}catch(_){}});
window.addEventListener('resize',()=>{if(map){map.resize();clampWorld()}});
/* ═══════════ ОБОЛОНКА ОШС ═══════════ */
function DOCK(){return window.matchMedia('(min-width:900px)').matches}
function syncDock(){if(DOCK()){scrim.classList.remove('on');document.body.classList.remove('pan')}barUI()}
function keysUI(){}
function clockUI(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  const e=$('tb-clock');if(e)e.textContent=p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds())+'Z'}
function netUI(){const on=navigator.onLine!==false;
  [$('tb-net'),$('sb-net')].forEach(e=>{if(!e)return;e.textContent='● '+(on?'online':'offline');e.classList.toggle('off',!on)})}
setInterval(clockUI,1000);clockUI();netUI();
window.addEventListener('online',netUI);window.addEventListener('offline',netUI);
window.addEventListener('resize',syncDock);
syncDock();keysUI();

/* тести чистої логіки (headless) */
window.__teren={map:()=>map,boot:()=>boot(),render:renderNow,clipPoly,dropWithLinks,symNorm,sidcOf,get lastStyle(){return lastStyle},startDraw,addPoint,doneDraw,openObj,openUnit,setTool,onUp:()=>onUp(),dist,bearing,dest,plen,parea,circlePoly,sectorPoly,sectorParams,pip,simplify,arrowParts,ring,mid,S:()=>S};

}
})();
