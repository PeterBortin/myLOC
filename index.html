let rulerCoords=null;
function spark(vals,w){const ok=vals.filter(v=>v!=null);if(!ok.length)return '└─ DEM ще не декодований — відкрий панель ще раз';
  const mn=Math.min(...ok),mx=Math.max(...ok),bars='▁▂▃▄▅▆▇█';let s='';
  const step=Math.max(1,Math.ceil(vals.length/w));for(let i=0;i<vals.length;i+=step){const v=vals[i];s+=v==null?' ':bars[Math.round((v-mn)/((mx-mn)||1)*7)]}
  return '┌─ '+Math.round(mx)+' м\n'+s+'\n└─ '+Math.round(mn)+' м · перепад '+Math.round(mx-mn)+' м'}
function openRuler(c){rulerCoords=c;const L=plen(c);
  const lines=['довжина ..... '+fLen(L),'азимут ...... '+fAz(bearing(c[0],c[c.length-1]))+' (прямий)','сегментів ... '+(c.length-1)];
  if(c.length>2)lines.push('площа ....... '+fAr(parea(c))+' (якби замкнути)');
  $('ru-metrics').textContent=lines.map((l,i,a)=>(i===a.length-1?'└─ ':'├─ ')+l).join('\n');
  $('ru-segs').textContent=c.slice(1).map((p,i)=>(i===c.length-2?'└─ ':'├─ ')+String(i+1).padStart(2,'0')+' '+fLen(dist(c[i],p)).padEnd(9)+' '+fAz(bearing(c[i],p))).join('\n');
  $('ru-profile').textContent='└─ декодую DEM…';openPanel('p-ruler');
  const pr0=profile(c,60);ensureDem(pr0.map(x=>pointAlong(c,x.d/(L||1)).p)).then(()=>{const pr=profile(c,60);
    let up=0,dn=0;for(let i=1;i<pr.length;i++){if(pr[i].h==null||pr[i-1].h==null)continue;const d=pr[i].h-pr[i-1].h;if(d>0)up+=d;else dn-=d}
    $('ru-profile').textContent=spark(pr.map(x=>x.h),60)+'\n   підйом +'+Math.round(up)+' м · спуск −'+Math.round(dn)+' м';
    const h0=pr[0].h,h1=pr[pr.length-1].h;if(h0!=null&&h1!=null)$('ru-metrics').textContent+='\n   висоти: '+Math.round(h0)+' → '+Math.round(h1)+' м'})}
$('ru-save').onclick=()=>{if(!rulerCoords)return;const stl=Object.assign({},lastStyle,{dash:'dash'});closePanels();
  openObj({id:uid(),n:S.seq++,type:'line',name:'вимір '+fLen(plen(rulerCoords)),note:'',groupId:null,coords:rulerCoords,visible:true,created:Date.now(),st:stl},true)};
$('ru-clear').onclick=()=>{rulerCoords=null;dismiss();setTool('ruler')};

/* ═══════════ ЕКСПОРТ / ІМПОРТ ═══════════ */
$('btn-export').onclick=()=>{if(!S.objs.length){st('нема чого експортувати');return}
  const fc={type:'FeatureCollection',teren:{v:2,groups:S.groups},features:S.objs.map(o=>{const g=shapeOf(o)||{type:'Point',coordinates:o.coords[0]};
    return {type:'Feature',properties:{teren:o.type,name:o.name,note:o.note,groupId:o.groupId,groupPath:gPath(o.groupId),visible:o.visible,created:o.created,style:o.st,taps:o.coords,tid:o.id,aId:o.aId,bId:o.bId},geometry:g}})};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(fc,null,1)],{type:'application/geo+json'}));
  a.download='teren-'+new Date().toISOString().slice(0,10)+'.geojson';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);st('geojson поїхав у завантаження')};
$('btn-import').onclick=()=>$('file-in').click();
$('file-in').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const fc=JSON.parse(r.result);let n=0;
    mutate(()=>{if(fc.teren&&Array.isArray(fc.teren.groups))fc.teren.groups.forEach(g=>{if(!grp(g.id))S.groups.push(g)});
      /* Multi-геометрії розкладаємо на частини: раніше вони мовчки зникали,
         а в терміналі писалось бадьоре «затягнув N обʼєктів» без згадки про
         пропущені. */
      let skip=0;
      const parts=gg=>{
        if(!gg)return [];
        if(gg.type==='Point')return [['marker',[gg.coordinates]]];
        if(gg.type==='MultiPoint')return gg.coordinates.map(q=>['marker',[q]]);
        if(gg.type==='LineString')return [['line',gg.coordinates]];
        if(gg.type==='MultiLineString')return gg.coordinates.map(q=>['line',q]);
        if(gg.type==='Polygon')return [['polygon',gg.coordinates[0].slice(0,-1)]];
        if(gg.type==='MultiPolygon')return gg.coordinates.map(q=>['polygon',q[0].slice(0,-1)]);
        if(gg.type==='GeometryCollection')return (gg.geometries||[]).reduce((a,x)=>a.concat(parts(x)),[]);
        return [];
      };
      (fc.features||[]).forEach(ft=>{const gg=ft.geometry,p=ft.properties||{};if(!gg)return;
        const seq=p.taps?[[p.teren,p.taps]]:parts(gg);
        if(!seq.length){skip++;return}
        seq.forEach(([tt,c])=>{
          const o={id:p.tid&&!byId(p.tid)?p.tid:uid(),n:S.seq++,type:p.teren||tt,
            name:p.name||'імпорт '+(n+1),note:p.note||'',
            groupId:grp(p.groupId)?p.groupId:null,coords:c||[],visible:p.visible!==false,
            created:p.created||Date.now(),st:Object.assign({},DEF_ST,p.style||{})};
          /* Міграція ТА САМА, що й для localStorage: без неї файл попередньої
             версії тихо псувався — полігон ставав лінією, стрілка втрачала
             наконечник, а танкова рота перетворювалась на піхоту. */
          migrate(o);
          if(!TYPE[o.type])o.type='line';
          if(o.type==='unit')o.st.sym=symNorm(o.st.sym);
          if(o.type==='link'){o.aId=p.aId;o.bId=p.bId}
          S.objs.unshift(o);n++});});
      /* звʼязки без обох кінців нічого не малюють — прибираємо одразу;
         так само й обʼєкти без придатних координат: рендер бере coords[0][1]
         і падає на першому ж такому записі */
      S.objs=S.objs.filter(o=>o.type!=='link'||(byId(o.aId)&&byId(o.bId)));
      const before=S.objs.length;
      S.objs=S.objs.filter(o=>Array.isArray(o.coords)&&o.coords.length&&
        o.coords.every(c=>Array.isArray(c)&&isFinite(c[0])&&isFinite(c[1])));
      skip+=before-S.objs.length;n-=before-S.objs.length});
    st('затягнув '+n+' '+plural(n,'обʼєкт','обʼєкти','обʼєктів')+
      (skip?' · '+skip+' не зрозумів':''))}catch(err){st('файл битий, не зайшло: '+err.message,0,'err')}e.target.value=''};
  r.readAsText(f)};

/* ── палуба цілей ──
   Один рядок на ціль: гліф, назва, дальність від вас, під ним — курс і
   швидкість. Сортовано за близькістю: у списку, який читають в укритті,
   порядок має відповідати тому, що важить. Без вашої позиції сортуємо за
   свіжістю — брехати про дальність гірше, ніж її не показати. */
function deckUI(){
  const box=$('deck');if(!box)return;
  const on=S.cfg.deck!==false&&!!airFeed&&!domeOn;
  box.classList.toggle('on',on);
  if(!on)return;
  const rows=[];
  if(airL&&airL.items)Object.keys(airL.items).forEach(id=>{
    if(id.indexOf('np:')!==0)return;
    const it=airL.items[id],m=it.meta||{};
    rows.push({id:id,g:PLAIN_G[m.kind]||'▲',col:(it.spec&&it.spec.col)||'#ff3b30',
      nm:(it.spec&&it.spec.uk)||m.title||'ціль',lon:it.lon,lat:it.lat,
      hdg:m.hdg,spd:m.speed,last:m.last||0});
  });
  plainList.forEach(t=>{
    const sp=(window.TERRAIN_SPECS&&TERRAIN_SPECS.forThreat)?(TERRAIN_SPECS.forThreat(t)||{}).spec||{}:{};
    rows.push({id:t.id,g:PLAIN_G[t.kind]||'?',col:sp.col||'#ff3b30',
      nm:sp.uk||t.title||'ціль',lon:t.lon,lat:t.lat,hdg:null,spd:t.speed,last:t.last||0});
  });
  rows.forEach(r=>{r.km=myPos?dist(myPos,[r.lon,r.lat]):null});
  rows.sort((a,b)=>(a.km==null||b.km==null)?(b.last-a.last):(a.km-b.km));
  $('dk-n').textContent=rows.length;
  $('dk-list').innerHTML=rows.slice(0,40).map(r=>
    '<div class="dk-r" data-ll="'+r.lon+','+r.lat+'">'+
    '<i style="color:'+safeCol(r.col)+'">'+r.g+'</i>'+
    '<b>'+esc(r.nm)+'</b>'+
    '<s>'+(r.km==null?'—':fLen(r.km))+'</s>'+
    '<em>'+(r.hdg==null?'курс невідомий':fAz(r.hdg))+
      (r.spd?' · '+Math.round(r.spd)+' км/год':'')+'</em></div>').join('')
    ||'<div class="dk-r"><em>у небі чисто</em></div>';
  $$('#dk-list .dk-r').forEach(el=>{
    if(!el.dataset.ll)return;
    el.onclick=()=>{const ll=el.dataset.ll.split(',').map(Number);
      if(isFinite(ll[0])){dropFit();map.easeTo({center:ll,zoom:Math.max(map.getZoom(),9),duration:700})}};
  });
}

/* ═══════════════════════ КУПОЛ ═══════════════════════
   Небо над вашою точкою. Цілі — ті самі, що на мапі: одна стрічка, один
   розбір, два способи дивитись. Мапа відповідає на «де вони», купол — на
   «з якого боку і як високо звідси».

   Чого купол НЕ знає: висоти. NEPTUN її не дає, і кут місця тут рахується
   з профілю типу — тобто це оцінка. Написано на екрані внизу, а не дрібним
   шрифтом у налаштуваннях: від кута місця залежить, куди людина підніме
   голову, і мовчазна вигадка тут дорожча за будь-яку іншу.

   Дозволи. Чотири, по одному дотику на кожен. Safari віддає вікно лише з
   свіжого жесту користувача, і DeviceOrientationEvent.requestPermission()
   мусить стояти ПЕРШИМ рядком обробника — будь-який await перед ним зʼїдає
   активацію, і вікно не приходить узагалі. Тому кроки не зливаються в один
   «дозволити все».                                                      */
let domeOn=false,domeFed=null,domeLookBound=false;
const D=()=>window.KostylDome;

/* ── чотири кроки дозволів ── */
const DA_STEPS=[
  {k:'cam', tile:'p-cam', label:'КАМЕРА', why:'небо в кадрі під куполом — щоб ціль лягала на справжнє небо, а не на порожнє тло',
   ok:p=>p.cam==='granted', ask:()=>D().startCamPerm().then(()=>'за кнопкою')},
  {k:'geo', tile:'p-geo', label:'ГЕОПОЗИЦІЯ', why:'без вашої точки купол порахувати нічого не може: азимут, кут місця й дальність — усе це «звідси»',
   /* дозвіл ≠ точка: навіть із granted її ще треба взяти, тому «уже надано»
      ставимо лише тоді, коли точка справді є */
   ok:()=>{const m=D()&&D().S&&D().S.me;return !!(m&&m.lat!=null)},
   ask:()=>D().startGeo().then(m=>'±'+Math.round(m&&m.acc||0)+' м')},
  {k:'ori', tile:'p-gyro', label:'ОРІЄНТАЦІЯ', why:'куди дивиться телефон — купол водять ним, і тільки ним',
   ok:()=>{try{return !!D().sensorLive()}catch(e){return false}}, ask:()=>D().requestMotionPermission().then(()=>D().startOrientation()).then(s=>String(s).slice(0,10))},
  {k:'mic', tile:'p-mic', label:'МІКРОФОН', why:'гул двигуна й затримка звуку: звук із 5 км іде 15 с, тож ціль уже не там, звідки чути',
   ok:p=>p.mic==='granted', ask:()=>D().startMic().then(()=>'слухає')}
];
let daPerms={cam:'unknown',mic:'unknown',geo:'unknown'},daBusy=false;
const DA_BY={};DA_STEPS.forEach(st=>DA_BY[st.k]=st);

function daTile(k,state,txt){
  const st=DA_BY[k];if(!st)return;
  const e=$(st.tile);if(!e)return;
  e.dataset.s=state;const v=e.querySelector('i');if(v)v.textContent=txt||'—';
}
function daState(k){const st=DA_BY[k],e=st&&$(st.tile);return e?e.dataset.s:'idle'}
function daUI(){
  let ok=0;DA_STEPS.forEach(st=>{if(daState(st.k)==='ok')ok++});
  $('da-step').textContent=ok+'/'+DA_STEPS.length;
  const go=$('da-go');go.disabled=daBusy;
  go.textContent=daBusy?'ПИТАЮ…':(ok>=DA_STEPS.length?'ДО КУПОЛА':'ДОЗВОЛИТИ ВСЕ');
  $('da-skip').hidden=daBusy;
}
/* Жоден крок не має права підвісити запуск: людина в укритті не чекатиме,
   поки браузер надумається. */
function daWait(pr,ms){
  return Promise.race([pr,new Promise((_,rj)=>setTimeout(()=>rj(new Error('не дочекався')),ms))]);
}
function daErr(e){return ((e&&e.message)||'ні').slice(0,18)}

/* ── усі давачі одним дотиком ──
   Чотири вікна поспіль людина закриває не читаючи — і потім дивується, чому
   купол сліпий. Тому один дотик піднімає все, що піднімається:

   1) орієнтація ПЕРШОЮ і синхронно. requestPermission на iOS мусить стояти
      найпершим рядком обробника: будь-який await перед ним зʼїдає жест, і
      Safari мовчки відмовляє — це та помилка, яку тут найлегше зробити;
   2) камера й мікрофон одним getUserMedia — одне вікно замість двох
      (startMediaAsk сам розпадається на два запити, якщо спільний не зайшов);
   3) точка — останньою: вона найдовша й нічого не блокує.

   Усі три йдуть з одного жесту й далі чекають паралельно. Що відмовили —
   лишається червоною плиткою, і її можна натиснути окремо, не перезапускаючи
   решту. */
function daAll(){
  if(daBusy)return;
  let oriPr;try{oriPr=D().requestMotionPermission()}catch(e){oriPr=Promise.reject(e)}
  let medPr;try{medPr=D().startMediaAsk()}catch(e){medPr=Promise.reject(e)}
  let geoPr;try{geoPr=D().startGeo()}catch(e){geoPr=Promise.reject(e)}
  daBusy=true;
  ['ori','cam','mic','geo'].forEach(k=>{if(daState(k)!=='ok')daTile(k,'wait','питаю…')});
  daUI();
  const jobs=[
    daWait(Promise.resolve(oriPr).then(()=>D().startOrientation()),12000)
      .then(v=>daTile('ori','ok',String(v).slice(0,10)))
      .catch(e=>daTile('ori','err',daErr(e))),
    daWait(Promise.resolve(medPr),12000)
      .then(o=>{daTile('cam',o.cam?'ok':'err',o.cam?'у кадрі':'ні');
                daTile('mic',o.mic?'ok':'err',o.mic?'слухає':'ні')})
      .catch(e=>{const m=daErr(e);daTile('cam','err',m);daTile('mic','err',m)}),
    daWait(Promise.resolve(geoPr),9000)
      .then(m=>daTile('geo','ok','±'+Math.round((m&&m.acc)||0)+' м'))
      .catch(e=>daTile('geo','err',daErr(e)))
  ];
  Promise.all(jobs).then(()=>{daBusy=false;daUI();
    try{localStorage.setItem('teren2.perms','1')}catch(e){}});
}
/* Одна плитка окремо: коли людина спершу відмовила, а потім передумала. */
function daOne(k){
  if(daBusy||daState(k)==='ok')return;
  const st=DA_BY[k];if(!st)return;
  let pr;try{pr=st.ask()}catch(e){pr=Promise.reject(e)}
  daTile(k,'wait','питаю…');
  daWait(Promise.resolve(pr),k==='geo'?9000:12000)
    .then(v=>daTile(k,'ok',v||'є'))
    .catch(e=>daTile(k,'err',daErr(e)))
    .then(daUI);
}
function daDone(){
  $('dome-ask').hidden=true;
  try{localStorage.setItem('teren2.perms','1')}catch(e){}
  domeRun();
}
/* Дозволи, які ОС уже дала, позначаємо одразу: питати вдруге про те, на що
   вже відповіли, — це вчити закривати вікна не читаючи. */
function daAuto(){
  DA_STEPS.forEach(st=>daTile(st.k,'idle','—'));
  daBusy=false;
  return D().permSnapshot().then(p=>{
    daPerms=p;
    DA_STEPS.forEach(st=>{if(st.ok(p))daTile(st.k,'ok','уже надано')});
    daUI();
  }).catch(()=>daUI());
}

/* ── сама сторінка ── */
function domeOpen(){
  if(!D()){st('купол не підвантажився',0,'err');return}
  closePanels();
  $('dome').hidden=false;domeOn=true;domeAimStop();domeSaidOpen=false;
  document.body.classList.add('domeon');
  if(airL)airL.setVisible(false);
  try{D().loadSet()}catch(e){}
  domeSize();
  /* Позицію купол бере ту саму, що й мапа: якщо ⌖ уже спіймано, другого
     запиту не потрібно. */
  if(myPos)D().S.me={lat:myPos[1],lon:myPos[0],alt:null,acc:null,ts:Date.now()};
  let asked=false;try{asked=localStorage.getItem('teren2.perms')==='1'}catch(e){}
  const needAsk=!asked&&('ontouchstart' in window||D().needsMotionPermission());
  if(needAsk){$('dome-ask').hidden=false;daAuto()}
  else{$('dome-ask').hidden=true;
       /* дозволи вже були — просто піднімаємо те, що дозволено */
       /* Механіка ЖУЙКИ: пробуємо всі чотири джерела, а якщо жодне не
          озвалось одразу — дотягуємо ще кілька секунд у фоні. На iPhone
          перша подія після дозволу іноді йде довше за півтори секунди. */
       D().startOrientation().catch(()=>D().oriKeepTrying(6));
       /* Відмова в геопозиції — звичайна відповідь, а не збій: try/catch
          навколо промісу її не ловить, і вона спливала необробленою. */
       Promise.resolve(D().startGeo()).catch(()=>{});
       domeRun()}
}
function domeRun(){
  D().on(m=>{logSrc('купол: '+m);st('купол спіткнувся — подробиці в журналі джерел',0,'err')});
  domeSize();
  if(!domeLookBound){domeBindLook();domeSetBind();domeLookBound=true}
  domeSensorUI();
  /* 3D — типовий режим; якщо WebGL не піднявся, купол тихо малюється в 2D
     і нічого не втрачає, крім глибини й кадрів */
  try{D().glSetOn(D().S.set.gl!==false,true)}catch(e){}
  /* Давач міг не піднятись із першої спроби — дотягуємо у фоні. Поки він
     мовчить, купол стоїть на півночі й каже про це; щойно давач озветься —
     забирає керування сам, без жодного дотику. */
  if(!D().sensorLive())try{D().oriKeepTrying(6)}catch(e){}
  D().start();
  domeFeed();
  if(!domeFed)domeFed=setInterval(domeFeed,1000);
  st('купол · небо над вашою точкою',1);
}
function domeClose(){
  if(!domeOn)return;
  domeOn=false;$('dome').hidden=true;$('dome-set').hidden=true;
  $('dome-set-b').classList.remove('on');
  document.body.classList.remove('domeon');
  if(airL)airL.setVisible(S.cfg.air3d!==false);
  if(domeFed){clearInterval(domeFed);domeFed=null}
  try{D().stop();D().stopCamera()}catch(e){}
  $('dome').classList.remove('cam');domeCardHide();
  try{map.resize()}catch(e){}
  /* Купол бачили — відтепер на мапі лишається його радіус і останній
     сектор огляду. Це не окраса: людина, глянувши на мапу, має бачити,
     яку частину неба вона щойно оглядала і докуди взагалі дістає купол. */
  domeSeenSet();
  try{const lk=D().look();if(lk&&lk.live)domeLook={az:lk.az,fov:lk.fov}}catch(e){}
  domeRingDraw();
  domeAimStart();
  st('назад на мапу');
}
function domeSize(){
  if(!D())return;
  ['gl','ov','ruler'].forEach(id=>{const c=$(id);if(c)D().sizeCanvas(c)});
  try{D().updateView()}catch(e){}
}
/* Цілі: беремо ЖИВИЙ список із того самого шару, що малює мапу — не другу
   копію стрічки. Кут місця рахується з висоти, а висота в нас із профілю
   типу, тож сюди вона йде як altShown і чесно підписана внизу екрана. */
/* Тривоги з мапи — куполу. Балістичний сигнал спирається САМЕ на це:
   без активної тривоги у ВАШІЙ області він мовчить. Два польові випадки
   ЖУЙКИ, коли він кричав на порожнє небо, були через його відсутність. */
function domeAlerts(){
  if(!D()||!airAL||!airAL.ready)return;
  let mine=false,nm='';
  const me=D().S.me;
  if(me&&me.lat!=null&&airAL.oblastOf){
    try{nm=airAL.oblastOf([me.lon,me.lat])||''}catch(e){}
    if(nm&&airAL.state&&airAL.state[nm])mine=true;
  }
  const st=airAL.state||{};
  D().alertsFromApp({mine:mine,oblast:nm,
    oblasts:Object.keys(st).length,
    raions:Object.keys(airAL.part||{}).length});
}
function domeFeed(){
  if(!domeOn||!D())return;
  /* ⌖ могли натиснути вже під куполом — підхоплюємо точку без перезапуску */
  if(myPos){const m=D().S.me;
    if(!m||m.lat!==myPos[1]||m.lon!==myPos[0])
      D().S.me={lat:myPos[1],lon:myPos[0],alt:null,acc:null,ts:Date.now()}}
  const out=[];
  if(airL&&airL.items){
    Object.keys(airL.items).forEach(id=>{
      if(id.indexOf('np:')!==0)return;
      const it=airL.items[id],m=it.meta||{};
      out.push({id:id,lat:it.lat,lon:it.lon,
        alt:it.alt||0,altLo:(it.spec&&it.spec.altMin)||0,altHi:(it.spec&&it.spec.altMax)||it.alt||0,
        typeId:it.key,typeName:(it.spec&&it.spec.uk)||m.title||'ціль',
        title:m.title||'',hdg:m.hdg==null?null:m.hdg,
        speedKmh:m.speed||(it.spec&&it.spec.speed)||0,
        lastSeen:m.last||Date.now(),known:true,
        loose:!!m.estimated,areaOnly:!!m.areaOnly,count:m.amount||1});
    });
  }
  /* цілі без курсу теж на куполі: вони так само в небі, просто без напрямку */
  plainList.forEach(t=>{
    const sp=(window.TERRAIN_SPECS&&TERRAIN_SPECS.forThreat)?(TERRAIN_SPECS.forThreat(t)||{}).spec||{}:{};
    out.push({id:t.id,lat:t.lat,lon:t.lon,
      alt:t.alt||sp.apo||1000,altLo:sp.altMin||0,altHi:sp.altMax||sp.apo||2000,
      typeId:'unknown',typeName:sp.uk||t.title||'ціль',title:t.title||'',
      hdg:null,speedKmh:t.speed||sp.speed||0,lastSeen:t.last||Date.now(),
      known:false,loose:true,areaOnly:!!t.areaOnly,count:t.amount||1});
  });
  D().setTargets(out);
  domeAlerts();
  const n=out.length;
  $('dome-n').textContent=n?(n+' '+plural(n,'ціль','цілі','цілей')+' у небі'):'у небі чисто';
  /* Без своєї точки купол порахувати нічого не може: і азимут, і кут місця,
     і дальність — усе це «звідси». Кажемо це просто, замість порожнього
     неба, у яке людина дивитиметься й гадатиме, чи все чисто. */
  const me=D().S.me;
  if(!me||me.lat==null){
    $('dome-n').textContent='без вашої позиції купол порахувати нічого не може';
    $('dome-sub').textContent='дозволь геопозицію — або постав ⌖ на мапі';
    return;
  }
  domeHead();
  domeSayOpen();
}
/* ── картка цілі ──
   Кожен рядок підписаний джерелом: що прийшло з NEPTUN, а що ми вивели
   самі. Висота й тип у фіді не приходять — вони з таблиці ТТХ, і картка
   каже це прямо, замість видавати оцінку за виміряне. */
function dcRow(k,v,cls){
  if(v==null||v==='')return '';
  return '<div class="dc-r'+(cls?' '+cls:'')+'"><u>'+k+'</u><b>'+v+'</b></div>';
}
function domeCard(it){
  const i=D().aimInfo(it);if(!i)return;
  $('dc-t').textContent=(i.title||'ЦІЛЬ').toUpperCase();
  const sec=n=>n<90?n+' с':Math.round(n/60)+' хв';
  let h='';
  h+=dcRow('напрямок', i.azText?(i.azText+' · '+i.dir):null);
  h+=dcRow('дальність', i.groundKm!=null?i.groundKm+' км':null);
  h+=dcRow('похила', i.slantKm!=null&&i.slantKm!==i.groundKm?i.slantKm+' км':null);
  h+=dcRow('кут місця', i.el!=null?i.el+'°':null);
  h+=dcRow('висота', i.altM!=null?i.altM+' м (ТТХ)':null);
  h+=dcRow('курс', i.hdg!=null?i.hdg+'°':'невідомий');
  h+=dcRow('швидкість', i.speedKmh?i.speedKmh+' км/год':null);
  h+=dcRow('зближення', i.closingKmh!=null?(i.closingKmh>0?i.closingKmh+' км/год':'віддаляється'):null);
  h+=dcRow('підліт', i.etaSec!=null?sec(i.etaSec):null, i.level>=2?'bad':'');
  h+=dcRow('пройде за', i.dcpaKm!=null?i.dcpaKm+' км':null);
  h+=dcRow('оцінка', i.threat, i.level>=3?'bad':i.level>=2?'warn':'');
  h+=dcRow('дані', i.ageSec!=null?i.ageSec+' с тому':null, i.ageSec>180?'warn':'');
  $('dc-body').innerHTML=h||'<div class="dc-r"><u>даних</u><b>немає</b></div>';
  const n=[];
  n.push(i.raw?'NEPTUN: «'+i.raw+'»':'NEPTUN: без опису');
  if(!i.known)n.push('тип не розпізнано — висота й швидкість орієнтовні');
  if(i.loose)n.push('позиція приблизна');
  if(i.beyondHorizon)n.push('за обрієм: на цій дальності видно з '+i.horizonKm+' км');
  $('dc-note').textContent=n.join(' · ');
  $('dome-card').hidden=false;
}
function domeCardHide(){const e=$('dome-card');if(e)e.hidden=true}

/* ── перша фраза купола ──
   Голос мовчав не тому, що зламаний: він говорить лише про цілі в радіусі
   купола, а коли в радіусі порожньо, говорити нема про що — і людина
   сприймає це як несправність. Тож купол відкривається вголос і сам каже,
   що бачить. Заразом це перевірка синтезу: якщо перша фраза не прозвучала,
   значить не прозвучить і тривога, і краще знати це зараз, а не потім.
   Фраза йде один раз на відкриття і тільки коли точка вже є — без неї
   рахувати радіус нема від чого. */
let domeSaidOpen=false;
function domeSayOpen(){
  if(domeSaidOpen||!D())return;
  domeSaidOpen=true;
  const km=Math.round(D().radiusKm());
  if(!D().voiceOn()){
    logSrc('купол: голос вимкнено — тривоги будуть тільки на екрані');
    $('dome-sub').textContent+=' · голос вимкнено';
    return;
  }
  let near=0;
  try{near=D().FEED.items.filter(i=>i.ground!=null&&!i.areaOnly).length}catch(e){}
  const txt=near
    ? 'Купол відкрито. В радіусі '+km+' кілометрів '+near+' '+plural(near,'ціль','цілі','цілей')+'.'
    : 'Купол відкрито. В радіусі '+km+' кілометрів чисто.';
  try{D().say(txt,{key:'domeopen',gapMs:0,force:true})}catch(e){}
  /* Синтез міг мовчки відмовити — тоді про це чесно пишемо в журнал джерел,
     замість вдавати, що тривога прозвучить. */
  setTimeout(()=>{
    let ok=false;try{ok=D().VOICE.n>0||D().VOICE.busy}catch(e){}
    if(!ok)logSrc('купол: синтез мови не озвався — тривоги будуть мовчазні');
  },2500);
}

/* ── ширина огляду ──
   Куполом ВЕДЕ ТІЛЬКИ ТЕЛЕФОН: гіроскоп, компас, камера. Тягнення пальцем
   тут немає взагалі — купол показує, де ціль відносно вас у справжньому
   світі, і небо, яке крутять окремо від телефона, це вже просто картинка.

   Пальцем лишається одне: ширина огляду, колесом або щипком. Це масштаб,
   а не напрямок — він нічого не повертає. */
let domePinch=null;
function domeBindLook(){
  const ov=$('ov');if(!ov)return;
  /* Тап по небу — картка цілі. Приціл каже вголос, картка каже текстом:
     у куполі людина часто без звуку, і мовчазний дубль для неї єдиний
     спосіб дізнатися те саме. Беремо ціль під пальцем, а коли під пальцем
     порожньо — ту, що в прицілі: промазати по ромбу завбільшки з ніготь
     легко, а намір при цьому зрозумілий. */
  let tapT=0,tapX=0,tapY=0;
  ov.addEventListener('pointerdown',e=>{tapT=Date.now();tapX=e.clientX;tapY=e.clientY});
  ov.addEventListener('pointerup',e=>{
    if(Date.now()-tapT>450)return;
    if(Math.hypot(e.clientX-tapX,e.clientY-tapY)>14)return;
    const r=ov.getBoundingClientRect();
    let it=null;
    try{it=D().aimNearPixel(e.clientX-r.left,e.clientY-r.top,46)||D().aimed()}catch(err){}
    if(it)domeCard(it);else domeCardHide();
  });
  ov.addEventListener('wheel',e=>{
    e.preventDefault();
    D().setFovDeg(D().fovDeg()*(e.deltaY>0?1.08:0.93));domeHead();
  },{passive:false});
  ov.addEventListener('touchstart',e=>{
    if(e.touches.length===2)domePinch={d:domeTouchD(e),f:D().fovDeg()};
  },{passive:true});
  ov.addEventListener('touchmove',e=>{
    if(domePinch&&e.touches.length===2){D().setFovDeg(domePinch.f*domePinch.d/domeTouchD(e));domeHead()}
  },{passive:true});
  ov.addEventListener('touchend',()=>{domePinch=null});
}
function domeTouchD(e){
  const a=e.touches[0],b=e.touches[1];
  return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1;
}
/* Шапка купола. Азимут без півночі — це не азимут, а відлік від невідомого
   нуля: казати «азимут 47°», коли компас мовчить, означає дати людині число,
   за яким вона повернеться не туди. */
function domeHead(){
  if(!domeOn||!D())return;
  const h=D().S.head||{},o=D().ORI_STATE();
  const azTxt=D().manual()?'купол нерухомий — давача орієнтації немає'
    :(o.north?'азимут '+Math.round(h.az||0)+'°':'азимут невідомий — компас мовчить');
  $('dome-sub').textContent=azTxt+' · висота '+Math.round(h.el||0)+'° · '+
    Math.round(D().fovDeg()*2)+'°'+(o.ok&&!D().manual()?' · '+(o.src||'давач'):'');
  domeSensorUI();
}
function domeSensorUI(){
  const b=$('dome-sens');if(!b)return;
  const o=D().ORI_STATE();
  b.classList.remove('hid');
  b.classList.toggle('on',o.ok&&!D().manual());
  b.title=o.ok?('давач веде: '+(o.src||'?')+(o.north?' · північ є':' · півночі немає'))
              :'давач мовчить — спробувати ще раз';
}

/* ── шари купола ──
   Живуть у налаштуваннях самого купола (KostylDome.S.set) і зберігаються
   його ж сховищем: це його механіки, і тримати їх копію в конфігурації
   мапи означало б двічі писати одну правду. */
function domeSetUI(){
  $$('#dome-set .ds-r').forEach(r=>{
    r.querySelector('.chk').classList.toggle('on',!!D().S.set[r.dataset.k]);
  });
}
function domeSetBind(){
  $$('#dome-set .ds-r').forEach(r=>{
    r.onclick=()=>{
      const k=r.dataset.k,v=!D().S.set[k];
      D().S.set[k]=v;D().saveSet();
      if(k==='gl')try{D().glSetOn(v,true)}catch(e){}
      if(k==='bg')try{D().bgSet(v)}catch(e){}
      if(k==='voice'&&v)try{D().voicePrime()}catch(e){}
      domeSetUI();
      st(v?'шар «'+r.querySelector('b').textContent+'» увімкнув':'шар «'+r.querySelector('b').textContent+'» прибрав');
    };
  });
}
$('dome-set-b').onclick=()=>{
  const box=$('dome-set');
  box.hidden=!box.hidden;
  if(!box.hidden){domeSetUI();$('dome-set-b').classList.add('on')}
  else $('dome-set-b').classList.remove('on');
};
$('dc-x').onclick=domeCardHide;
$('ds-x').onclick=()=>{$('dome-set').hidden=true;$('dome-set-b').classList.remove('on')};

/* ── кнопки ── */
$('da-go').onclick=()=>{
  let ok=0;DA_STEPS.forEach(st=>{if(daState(st.k)==='ok')ok++});
  if(ok>=DA_STEPS.length)daDone();else daAll();
};
$('da-skip').onclick=daDone;
DA_STEPS.forEach(st=>{const e=$(st.tile);if(e)e.onclick=()=>daOne(st.k)});
$('dome-x').onclick=domeClose;
$('dome-cam').onclick=()=>{
  const on=!$('dome').classList.contains('cam');
  if(on){D().startCamera().then(()=>{$('dome').classList.add('cam');$('dome-cam').classList.add('on')})
    .catch(e=>st('камера не пішла: '+(e&&e.message||''),0,'err'))}
  else{try{D().stopCamera()}catch(e){}$('dome').classList.remove('cam');$('dome-cam').classList.remove('on')}
};
/* Повтор мусить іти З ЖЕСТУ: Safari віддає дозвіл лише від свіжого дотику,
   і ще один запит «потім» не приходить узагалі. */
$('dome-sens').onclick=()=>{
  if(D().useSensor()){st('купол веде телефон');domeSensorUI();return}
  st('піднімаю давач орієнтації…',1,'busy');
  D().requestMotionPermission().then(()=>D().startOrientation())
    .then(src=>{D().useSensor();st('орієнтація піднялась: '+src);domeSensorUI()})
    .catch(e=>{D().oriKeepTrying(4);
      st('давач не озвався ('+((e&&e.message)||'?')+') — веду пальцем',0,'err');
      domeSensorUI()});
};
$('dk-x').onclick=()=>{$('deck').classList.toggle('min')};
$('b-dome').onclick=domeOpen;
$('c-dome').onclick=domeOpen;
addEventListener('resize',()=>{if(domeOn)domeSize()});

/* ═══════════ ГЕО, КЛАВІШІ, СЛУЖБОВЕ ═══════════ */
let myPos=null,meSrc=false;
/* Позицію беремо самі лише тоді, коли дозвіл уже стоїть «granted»: вікна не
   буде, а ⌖ зʼявиться на мапі одразу. Permissions API є не скрізь — де його
   нема, просто чекаємо на тап. */
function geoIfGranted(){
  if(!navigator.geolocation||!navigator.permissions||!navigator.permissions.query)return;
  try{navigator.permissions.query({name:'geolocation'}).then(p=>{
    if(p&&p.state==='granted')askGeo(true);
  }).catch(()=>{})}catch(e){}
}
function askGeo(auto){
  if(!navigator.geolocation){if(!auto)st('геолокації тут нема');return}
  if(!auto&&myPos){dropFit();map.flyTo({center:myPos,zoom:Math.max(map.getZoom(),14.5),duration:900});st('ти тут, я бачу');return}
  if(!auto)st('ловлю супутники…',1,'busy');
  navigator.geolocation.getCurrentPosition(pos=>{myPos=[pos.coords.longitude,pos.coords.latitude];
    if(!meSrc){map.addSource('me',{type:'geojson',data:EMPTY});map.addLayer({id:'l-me',type:'symbol',source:'me',layout:{'icon-image':glyphImg('⌖',themeCols().affirm),'icon-allow-overlap':true,'icon-size':1.1}});meSrc=true}
    map.getSource('me').setData({type:'FeatureCollection',features:[{type:'Feature',properties:{},geometry:{type:'Point',coordinates:myPos}}]});
    $('c-geo').classList.add('live');
    domeRingDraw();
    if(!auto){dropFit();map.flyTo({center:myPos,zoom:Math.max(map.getZoom(),14.5),duration:1200})}
    st(auto?'позицію взяв, ⌖ на мапі':'ти тут, я бачу')},
    ()=>{if(!auto)st('gps кобенится — дай дозвіл або став вручну',0,'err')},{enableHighAccuracy:true,timeout:10000,maximumAge:30000})}
/* ── маніфест без другого файлу ──
   Android ставить застосунок на екран лише коли є web app manifest, а він
   мусить бути окремим ресурсом того самого походження. Один файл цього не
   дозволяє — тому збираємо маніфест у Blob: blob-URL успадковує походження
   сторінки, і Chrome приймає його як звичайний. На file:// це не працює й

/* ── справжня висота вікна ──
   Чорна смуга під нижньою панеллю — це не відступ панелі, а різниця між
   висотою, яку нам дає CSS (100% від html), і висотою, яку людина бачить.
   У встановленому застосунку вони розходяться. Тому висоту міряємо самі й
   кладемо в --vh; visualViewport, де він є, знає її точніше за innerHeight
   (враховує клавіатуру й системні смуги). */
function fitVH(){
  const vv=window.visualViewport;
  /* Беремо НАЙБІЛЬШУ з трьох: три різні числа означають три різні уявлення
     браузера про вікно, і менше з них — це рівно та чорна смуга внизу.
     Клавіатура нас не хвилює: сторінка не скролиться, поля вводу живуть у
     шухлядах поверх неї. */
  const h=Math.round(Math.max(window.innerHeight||0,
    document.documentElement.clientHeight||0, (vv&&vv.height)||0));
  if(h>0)document.documentElement.style.setProperty('--vh',h+'px');
}
/* ── чим міряємо смугу ──
   Чорне поле під панеллю ми вже двічі лікували наосліп. Щоб не втретє —
   застосунок сам міряє все, від чого воно залежить, і кладе рядок у журнал
   джерел. Справжнє значення env(safe-area-inset-bottom) з CSS інакше не
   дістати: його читає лише розмітка, тож ставимо невидиму пробу. */
function safeInsetB(){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;left:-99px;bottom:0;width:1px;'+
    'height:env(safe-area-inset-bottom,0px);pointer-events:none;opacity:0';
  document.body.appendChild(d);
  const v=Math.round(d.getBoundingClientRect().height);
  d.remove();return v;
}
function barReport(){
  const bar=$('bar'),btn=bar&&bar.querySelector('.bbtn');
  if(!btn)return '';
  const rb=bar.getBoundingClientRect(),rk=btn.getBoundingClientRect();
  const vv=window.visualViewport;
  const pwa=matchMedia('(display-mode:standalone)').matches||navigator.standalone===true;
  return 'вікно '+Math.round(innerWidth)+'×'+Math.round(innerHeight)+
    ' · clientH '+document.documentElement.clientHeight+
    ' · vv '+(vv?Math.round(vv.height):'—')+
    ' · safe-b '+safeInsetB()+
    ' · панель '+Math.round(rb.height)+
    ' · під кнопками '+Math.round(rb.bottom-rk.bottom)+
    ' · під панеллю '+Math.round(innerHeight-rb.bottom)+
    (pwa?' · застосунок':' · вкладка');
}
fitVH();
addEventListener('resize',fitVH);
addEventListener('orientationchange',()=>setTimeout(fitVH,220));
if(window.visualViewport){visualViewport.addEventListener('resize',fitVH);
  visualViewport.addEventListener('scroll',fitVH)}

/* ── радіус купола на мапі ──
   Ледь помітне пунктирне коло — межа, докуди купол взагалі рахує небо
   (та сама FEED_RADIUS_KM, що й у ньому), і сектор — куди дивилися востаннє.
   Зʼявляється лише після першого відкриття купола: мальовати межу того,
   чого людина ще не бачила, — це шум. Без ⌖ нема й кола: радіус «звідси»
   без «звідси» не існує. */
let domeSeen=false,domeRingSrc=false,domeLook=null;
try{domeSeen=localStorage.getItem('teren2.domeseen')==='1'}catch(e){}
function domeSeenSet(){
  if(domeSeen)return;domeSeen=true;
  try{localStorage.setItem('teren2.domeseen','1')}catch(e){}
}
function domeRadiusKm(){
  try{const r=D()&&D().radiusKm();if(r>0)return r}catch(e){}
  return 120;
}
/* dest() рахує в метрах — радіус купола приходить у кілометрах. */
function ringPoly(c,km,n){
  const m=km*1000,pts=[];for(let i=0;i<=n;i++)pts.push(dest(c,i*360/n,m));
  return {type:'Polygon',coordinates:[pts]};
}
function sectorPoly(c,km,az,fov){
  const m=km*1000,half=Math.max(4,Math.min(120,fov/2)),pts=[c];
  const n=Math.max(8,Math.round(half/3));
  for(let i=0;i<=n;i++)pts.push(dest(c,az-half+i*(2*half)/n,m));
  pts.push(c);
  return {type:'Polygon',coordinates:[pts]};
}
function domeRingEnsure(){
  if(domeRingSrc||!map.getSource)return;
  map.addSource('domering',{type:'geojson',data:EMPTY});
  const c=themeCols();
  map.addLayer({id:'dr-sec',type:'fill',source:'domering',
    filter:['==',['get','k'],'sec'],
    paint:{'fill-color':c.affirm,'fill-opacity':0.07}});
  map.addLayer({id:'dr-secl',type:'line',source:'domering',
    filter:['==',['get','k'],'sec'],
    paint:{'line-color':c.affirm,'line-opacity':0.22,'line-width':1}});
  map.addLayer({id:'dr-rad',type:'line',source:'domering',
    filter:['==',['get','k'],'rad'],
    paint:{'line-color':c.affirm,'line-opacity':0.18,'line-width':1,
      'line-dasharray':[2,4]}});
  domeRingSrc=true;
  try{if(meSrc)map.moveLayer('l-me')}catch(e){}
}
/* ── сектор веде телефон і на мапі ──
   Давач ми не вимикаємо разом із куполом: людина виходить на мапу, далі
   тримає телефон у руці — і сектор має повертатися разом із ним, інакше він
   показує, куди вона дивилася хвилину тому. Кадру купола тут немає, тож
   зведення робимо самі, вісім разів на секунду, і перемальовуємо лише коли
   азимут справді поїхав. У фоні й без давача не крутимо нічого. */
let domeAimT=null;
function domeAimStop(){if(domeAimT){clearInterval(domeAimT);domeAimT=null}}
function domeAimStart(){
  domeAimStop();
  if(!D()||!domeSeen)return;
  let last=null,dead=0;
  domeAimT=setInterval(()=>{
    if(domeOn||document.hidden)return;
    let h;try{h=D().tickHead()}catch(e){return}
    /* Давач озивається не миттєво: на iPhone перша подія після дозволу
       інколи йде довше за секунду. Тому мовчання — ще не привід глушити
       годинник; глушимо, коли його немає вже пів хвилини. */
    if(!h||!h.live){ if(++dead>240)domeAimStop(); return }
    dead=0;
    if(last!=null&&Math.abs(((h.az-last+540)%360)-180)<1.5)return;
    last=h.az;domeLook={az:h.az,fov:h.fov};
    domeRingDraw();
  },125);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)domeAimStop();
  else if(domeSeen&&!domeOn)domeAimStart();
});
function domeRingDraw(){
  if(!map||!map.getSource)return;
  if(!domeSeen||!myPos){
    if(domeRingSrc)try{map.getSource('domering').setData(EMPTY)}catch(e){}
    return;
  }
  domeRingEnsure();
  const km=domeRadiusKm(),f=[
    {type:'Feature',properties:{k:'rad'},
     geometry:{type:'LineString',coordinates:ringPoly(myPos,km,128).coordinates[0]}}];
  /* Сектор — тільки поза куполом: усередині його малює сам купол, а на
     мапі він би показував напрямок, який зараз і так крутиться під рукою. */
  if(!domeOn&&domeLook)f.push({type:'Feature',properties:{k:'sec'},
    geometry:sectorPoly(myPos,km,domeLook.az,domeLook.fov)});
  try{map.getSource('domering').setData({type:'FeatureCollection',features:f})}catch(e){}
}
/* ── «Я ТУТ» ──
   Одна кнопка — одна зрозуміла дія: показати, де я і куди дивлюся. Тому
   разом із точкою піднімаємо й орієнтацію: сектор без неї намалювати нема
   з чого, а окрема кнопка «увімкнути сектор» була б ще одним питанням,
   на яке людина в укритті не має відповіді.

   requestPermission стоїть ПЕРШИМ рядком — до будь-якого await: на iOS
   жест витрачається на першому ж очікуванні. Відмовили в орієнтації —
   лишається коло радіуса й точка, і це теж корисно. */
function geoAim(){
  let ori=null;
  try{if(D()&&D().needsMotionPermission())ori=D().requestMotionPermission()}catch(e){}
  askGeo(false);
  domeSeenSet();
  if(!D())return;
  Promise.resolve(ori).catch(()=>null)
    .then(()=>D().startOrientation())
    .catch(()=>D().oriKeepTrying(6))
    .then(()=>{domeRingDraw();domeAimStart()})
    .catch(()=>{domeRingDraw()});
  setTimeout(()=>{domeRingDraw();domeAimStart()},1200);
}
$('c-geo').onclick=geoAim;

/* ═══════════ ПОВІТРЯНА ОБСТАНОВКА ═══════════
   Живі цілі NEPTUN 3d-моделями + тривоги по областях.
   Шар самодостатній: власна сцена THREE поверх мапи й окреме джерело
   для полігонів областей. Ані `objects`/`points`, ані feature-state
   малювання він не чіпає — тумблер гасить його цілком.

   Заливка областей лягає ПІД обʼєкти користувача (before:'o-fill'):
   накрити нею власне креслення було б гірше, ніж не показати тривогу. */
let airAL=null,airL=null,airFeed=null,airLast=null,airMiss=0;

function airBefore(){try{return map.getLayer('o-fill')?'o-fill':undefined}catch(e){return undefined}}

/* Який ендпоінт нас годує. Перехід на бідніший — не косметика: разом із
   ним зникають шлейфи, радіуси невизначеності й частина курсів, тобто мапа
   тихо стає менш точною. Кажемо про це вголос, і лише коли справді
   змінилось, щоб не засмічувати журнал щопів хвилини. */
let feedSrcWas=null;
function feedWhence(p){
  const t=p&&p.threats;if(!t||!t.from)return;
  if(t.from===feedSrcWas)return;
  feedSrcWas=t.from;
  if(t.from==='data')airLog('стрічка з /api/data — зі шлейфами й курсами');
  else airLog('/api/data замовк ('+(t.dataErr||'?')+') — іду на /api/v1/threats: без шлейфів');
}

/* ═══ ЦІЛІ БЕЗ КУРСУ ═══
   NEPTUN часто не дає напрямку — надто для КАБів, які з'являються одним
   спостереженням без швидкості. 3d-модель таку ціль показати не може: у
   неї є ніс, і той ніс завжди кудись дивиться. Тому такі цілі живуть на
   власному плоскому шарі: кільце, гліф типу, підпис — і коло
   невизначеності, якщо джерело сказало, наскільки позиція груба.
   Щойно курс з'явиться (з фіду, зі шлейфа чи з руху між опитуваннями),
   ціль піде на 3d-шар і стане моделлю. */
const PLAIN_G={drone_piston:'▲',drone_jet:'▲',drone_fpv:'▲',missile_cruise:'◆',
  missile_ballistic:'✦',bomb:'●',mig31k:'✈',unknown:'?'};
let plainSrc=false,plainList=[];
function plainEnsure(){
  if(plainSrc||!map||!map.getSource)return;
  try{
    map.addSource('airplain',{type:'geojson',data:EMPTY});
    map.addLayer({id:'ap-unc',type:'fill',source:'airplain',
      filter:['==',['get','k'],'unc'],
      paint:{'fill-color':['get','color'],'fill-opacity':.07}},airBefore());
    map.addLayer({id:'ap-uncl',type:'line',source:'airplain',
      filter:['==',['get','k'],'unc'],
      paint:{'line-color':['get','color'],'line-width':1,'line-opacity':.35,
        'line-dasharray':[2,3]}},airBefore());
    map.addLayer({id:'ap-pt',type:'symbol',source:'airplain',
      filter:['==',['get','k'],'pt'],
      layout:{'icon-image':['get','icon'],'icon-allow-overlap':true,
        'icon-size':['interpolate',['linear'],['zoom'],5,.62,9,.85,13,1],
        'text-field':['get','name'],'text-font':['literal',['Noto Sans Regular']],
        'text-size':10,'text-offset':[0,1.5],'text-anchor':'top',
        'text-allow-overlap':false,'text-optional':true},
      paint:{'text-color':['get','color'],'text-halo-color':'#000',
        'text-halo-width':1.4,'icon-opacity':['get','op']}});
    plainSrc=true;
  }catch(e){logSrc('шар цілей без курсу: '+e.message)}
}
function plainDraw(list){
  plainList=list||[];
  if(!plainList.length&&!plainSrc)return;
  plainEnsure();
  const src=map.getSource&&map.getSource('airplain');if(!src)return;
  const f=[];
  plainList.forEach(t=>{
    const sp=(window.TERRAIN_SPECS&&TERRAIN_SPECS.forThreat)
      ? (TERRAIN_SPECS.forThreat(t)||{}).spec||{} : {};
    const col=sp.col||'#ff3b30';
    const g=PLAIN_G[t.kind]||'?';
    /* Груба позиція й «спостерігачі мовчать» — різні речі, але обидві
       означають «менше довіри»: тьмянимо знак, а не ховаємо ціль. */
    const op=t.stale?.45:(t.estimated||t.areaOnly?.62:1);
    if(t.uncertKm>0.3){
      f.push({type:'Feature',properties:{k:'unc',color:col},
        geometry:{type:'Polygon',coordinates:[circlePoly([t.lon,t.lat],t.uncertKm)]}});
    }
    /* Спостерігачі часто кажуть, КУДИ ціль іде, не кажучи азимута. Це не
       курс, тож моделі з носом не буде — але слова в підпис ідуть: «у
       напрямку Полтавщини» людині в укритті важить більше за порожнечу. */
    let tw=null;
    try{tw=TERRAIN_SPECS.towardFromText((t.note||'')+' '+(t.title||''),[t.lon,t.lat])}catch(e){}
    const tail=tw?' · у напрямку '+tw.name:' · курс невідомий';
    f.push({type:'Feature',properties:{k:'pt',icon:plainImg(g,col),color:col,op:op,
      name:(sp.uk||t.title||'ціль')+(t.amount>1?' ×'+t.amount:'')+tail},
      geometry:{type:'Point',coordinates:[t.lon,t.lat]}});
  });
  try{src.setData({type:'FeatureCollection',features:f})}catch(e){}
}
function plainClear(){plainList=[];if(plainSrc&&map.getSource('airplain'))
  try{map.getSource('airplain').setData(EMPTY)}catch(e){}}

function airBoot(){
  if(!map)return;
  /* Спільний guard на обидва модулі глушив цілі, коли не доїхав alerts.js,
     і навпаки. Нижче airStart() спеціально вміє жити без кожного з них —
     тож і піднімати їх треба нарізно. */
  if(!airAL&&window.KostylAlerts){
    airAL=KostylAlerts.attach(map,{before:airBefore(),visible:S.cfg.airAl!==false,
      onChange:airRender,
      onError:e=>{airLog('межі областей не доїхали · '+(e&&e.message||''));airSum()}});
  }
  if(!airL&&window.THREE&&window.KostylLayer){
    airL=KostylLayer.attach(map,{minZoom:3,iconPx:34,
      visible:S.cfg.air3d!==false, trails:S.cfg.airTr!==false, before:airBefore()});
    if(airL&&airL.setFullTrail)airL.setFullTrail(!!S.cfg.airFull);
  }
}

function airStart(){
  airBoot();
  if(airFeed)return;
  /* Тривоги по областях THREE не потрібен — вони живуть на звичайних шарах
     мапи. Раніше відсутність 3d-шару тихо глушила ВЕСЬ фід разом із ними,
     і панель нескінченно писала «тягну стрічку…». */
  if(!airL&&!airAL){airLog('ані 3d-шар, ані шар тривог не піднялись');airSum();return}
  /* межі областей могли не доїхати — тоді тривог не буде взагалі, і про це
     треба сказати, а не показувати «тривог немає», як тихої ночі */
  if(airAL&&!airAL.ready&&airAL.load)airAL.load().catch(()=>{});
  if(!airL)airLog('THREE не доїхав — цілі без 3d-моделей, тривоги працюють');
  if(!airL){
    /* без 3d-шару ведемо самі лише тривоги: цілей не буде, але країна
       під тривогою — інформація, яку не можна втрачати через CDN */
    airFeed=KostylNeptun.start({everyS:30,alerts:true,
      onData:p=>{airLast=p;airMiss=0;
        if(airAL&&airAL.ready)airAL.update((p.alerts&&p.alerts.oblasts)||[],[],
          (p.alerts&&p.alerts.raions)||{},(p.alerts&&p.alerts.oblastSince)||{});
        airSum()},
      onAppError:e=>airLog('фід прийшов, але показ спіткнувся · '+(e&&e.message||'')),
      onError:(e,n)=>{airMiss=n;if(n===1)airLog('NEPTUN не відповів · '+(e&&e.message||''));airSum()}});
    airSum();return;
  }
  airFeed=airL.bindNeptun(null,{
    everyS:30,trails:S.cfg.airTr!==false,alertsLayer:airAL,
    onPlain:plainDraw,
    onData:p=>{airLast=p;airMiss=0;feedWhence(p);airSum();
      try{deckUI()}catch(e){}
      /* Раніше кожне опитування перезаписувало журнал на «└─ тихо», і
         повідомлення «межі областей не доїхали» зникало за секунди — збій
         виглядав як спокійна ніч. */
      if(!airAL||!airAL.ready)airRender([],airAL?airAL.log:[])},
    onAppError:e=>airLog('фід прийшов, але показ спіткнувся · '+(e&&e.message||'')),
    onError:(e,n)=>{airMiss=n;if(n===1)airLog('NEPTUN не відповів · '+(e&&e.message||''));airSum()}
  });
  airSum();
}
function airStop(){
  if(airFeed){airFeed.stop();airFeed=null}
  /* У штатному режимі заливку областей знімає bindNeptun.stop(). У резервному
     (без 3d-шару) фід — це голий KostylNeptun.start(), чий stop() гасить лише
     опитування: тривоги лишались намальованими назавжди, а панель писала
     «фід вимкнув». Показ не має пережити дані, які його породили. */
  if(airAL&&airAL.reset)airAL.reset();
  plainClear();
  airLast=null;airMiss=0;airSum();airRender([],airAL?airAL.log:[]);
  /* stop() всередині чистить увесь шар — разом із моделями ППО й пускових,
     які до фіду не мають жодного стосунку. Повертаємо їх одразу. */
  if(window.KostylSim)simModels();
}

/* зведення одним рядком: скільки цілей, скільки тривог, коли оновлено */
function airSum(){
  const e=$('air-sum');if(!e)return;
  if(S.cfg.air===false){e.textContent='фід вимкнув';e.classList.remove('live');return}
  /* «тягну стрічку» доречне рівно до першої відповіді. Якщо джерело
     мовчить, так і кажемо: мовчазний спінер гірший за чесний збій. */
  if(!airLast){
    e.textContent=airMiss?('NEPTUN мовчить · спроба '+airMiss):'тягну стрічку…';
    e.classList.remove('live');return}
  const objs=(airLast.threats&&airLast.threats.objs)||[];
  const al=airAL&&airAL.ready?airAL.list().length:0;
  const t=new Date(airLast.ts||Date.now());
  const p=n=>String(n).padStart(2,'0');
  /* Джерело могло замовкнути, а картинка лишалась «живою»: цілі тим часом
     числяться вперед і показуються як факт. Показ мусить старіти разом із
     даними — інакше він бреше саме тоді, коли це найдорожче. */
  const ageS=Math.max(0,(Date.now()-(airLast.ts||0))/1000);
  const stale=airMiss>0||ageS>75;
  e.textContent=objs.length+' '+plural(objs.length,'ціль','цілі','цілей')+' · '+
    al+' '+plural(al,'тривога','тривоги','тривог')+' · '+p(t.getHours())+':'+p(t.getMinutes())+
    (stale?' · дані '+(ageS<90?Math.round(ageS)+' с':Math.round(ageS/60)+' хв')+' тому':'');
  e.classList.toggle('live',!stale);
  e.classList.toggle('stale',stale);
  /* хвилини в списку тривог мають цокати між оновленнями фіду */
  if(airAL&&airAL.ready&&airRenderLast&&Date.now()-airRenderLast>25000)
    airRender(airAL.list(),airAL.log);
}
let airRenderLast=0;

/* звідки взявся рівень — підпис під областю. Джерела різні, і зливати їх
   в одне «не оголошено» не можна: «червоний · рівень не оголошено»
   суперечить сам собі. */
const AIR_BY={alert:'рівень не оголошено',forecast:'за прогнозом підходу',target:''};
const AIR_EV={on:'тривога',up:'рівень підвищено',down:'рівень знижено',off:'відбій'};

function airRender(list,log){
  const el=$('air-list');if(!el)return;
  airRenderLast=Date.now();
  list=list||[];
  el.innerHTML=list.length?list.map(a=>{
    const why=AIR_BY[a.by]||'';
    return '<div class="airrow" data-obl="'+esc(a.name)+'"><i style="background:'+a.col+'"></i>'+
      '<b>'+esc(a.name)+'<em>'+esc(a.level)+(why?' · '+esc(why):'')+'</em></b>'+
      '<s>'+a.mins+' хв</s></div>'}).join('')
    :'<div class="airsum">тривог немає</div>';
  el.querySelectorAll('[data-obl]').forEach(n=>n.onclick=()=>airCard(n.dataset.obl));
  const L=$('air-log');
  if(L){const rows=(log||[]).slice(0,8).map(e=>{
      const d=new Date(e.t),p=n=>String(n).padStart(2,'0');
      return p(d.getHours())+':'+p(d.getMinutes())+' '+(AIR_EV[e.kind]||e.kind)+' · '+e.name});
    L.textContent=rows.length?rows.map((r,i)=>(i===rows.length-1?'└─ ':'├─ ')+r).join('\n'):'└─ тихо'}
  airSum();
}

/* картка області — у термінал, бо вона про стан, а не про обʼєкт креслення */
function airCard(nm){

}

/* ═══════════ ВОДА ДЛЯ КОРАБЛІВ ═══════════
   Основа — вшита берегова лінія (KostylWater, ~400 м). Коли кораблем
   працюють, підтягуємо ще невидимий векторний шар води OpenFreeMap: він
   точний до порту, річки й водосховища, але знає лише те, що на екрані.
   Тож правило просте: точка на екрані й шар довантажився — віримо шару,
   інакше — береговій лінії. */
function waterProbe(){
  if(!map)return;
  try{
    if(!map.getSource('ofm'))map.addSource('ofm',{type:'vector',url:OFM});
    if(!map.getLayer('water-probe'))map.addLayer({id:'water-probe',type:'fill',source:'ofm',
      'source-layer':'water',paint:{'fill-color':'#000','fill-opacity':0}});
  }catch(e){}
}
function waterAt(p){
  if(map&&map.getLayer('water-probe')){
    try{
      const b=map.getBounds();
      if(b.contains(p)&&map.isSourceLoaded('ofm')){
        const px=map.project(p);
        /* Порожню відповідь шару не можна читати як «суша»: тайл без даних
           не відрізнити від тайла, що каже «тут берег». Тому шар може лише
           ДОДАТИ води (порт, річка, водосховище), а заборону лишаємо за
           вшитою береговою лінією. */
        if(map.queryRenderedFeatures([[px.x-1,px.y-1],[px.x+1,px.y+1]],{layers:['water-probe']}).length)return true;
      }
    }catch(e){}
  }
  return !!(window.KostylWater&&KostylWater.isSea(p));
}

/* ═══════════ ВИБІР ЗАСОБУ Й РАДІУСИ ПІД ЧАС РОЗСТАНОВКИ ═══════════ */

function pickGo(key){

     позицію збережено */

  closePanel($('p-pick'));

  const rr=kind==='pvo'?(KostylSim.sys(key)||{}).r:(TERRAIN_SPECS.SPEC[key]||{}).range;
  const sp=kind==='pvo'?KostylSim.sys(key)||{}:{};
  st(nm+' · радіус '+rr+' км — '+(kind!=='pvo'?'тап — точка пуску':
    sp.sea?'тап по воді, далі точки маршруту':sp.air?'тап — центр патрулювання':'тап по мапі'),1);
}

/* ── кола під час креслення ──
   ППО: коло ураження навколо точки.
   Пускова: залишок дальності від ОСТАННЬОЇ поставленої точки — він тане в міру
   того, як маршрут довшає. Так одразу видно, чи дотягне борт туди, куди ведеш,
   і не треба рахувати кілометри в голові. */
function draftRings(d,cc){
  const out=[];
  if(!cc.length)return out;
  const ring=(c,km,n)=>{const N=n||72,p=[];
    for(let i=0;i<=N;i++)p.push(KostylNeptun.dest(c[0],c[1],i/N*360,km));
    return {type:'Feature',properties:{rub:true},geometry:{type:'LineString',coordinates:p}}};
  if(d.type==='pvo'){
    const sp=KostylSim.sys(d.sys); if(!sp)return out;
    if(sp.air&&sp.orbR)out.push(ring(cc[0],sp.orbR,48));   // де літатиме
    if(sp.r)out.push(ring(cc[0],sp.r));
  } else if(d.type==='strike'){
    const sc=TERRAIN_SPECS.SPEC[d.wpn];
    if(sc&&sc.range){
      const placed=d.coords;
      const used=placed.length>1?KostylSim.pathLen(placed):0;
      const left=sc.range-used;
      if(left>0.5)out.push(ring(placed[placed.length-1],left));
    }
  }
  return out;
}

/* ═══════════════ СИМУЛЯЦІЯ: ППО, ПУСКОВІ, НАЛІТ ═══════════════
   ППО і пускові — звичайні обʼєкти S.objs, тож журнал, групи, відкат і
   збереження дістаються їм задарма. Рендер у них власний: колу досяжності

   Наліт рахується детерміновано наперед (KostylSim.buildRun), а відтворення
   просто дістає кадр за часом. Тому пауза, перемотка в обидва боки й ×300
   не потребують нічого, крім зміни числа simT. */
