    color: GL_COL.gridHot, transparent: true, opacity: 0.5
  })));

  // сторони світу підписами-спрайтами: у 3D вони самі повертаються до глядача
  const names = [[0, 'Пн'], [45, 'ПнСх'], [90, 'Сх'], [135, 'ПдСх'],
  [180, 'Пд'], [225, 'ПдЗх'], [270, 'Зх'], [315, 'ПнЗх']];
  for (const [az, nm] of names) {
    const s = glLabel(nm, az % 90 === 0 ? '#3ddc84' : '#5e7568', az % 90 === 0 ? 34 : 26);
    const p = glDir(az, 3);
    s.position.set(p[0], p[1], p[2]);
    g.add(s);
  }
  // підписи кілець лише на двох меридіанах і не вище 60°: біля зеніту кільця
  // сходяться, і четверо підписів там просто налазять один на одного
  for (let el = 15; el <= 60; el += 15) {
    for (const az of [0, 180]) {
      const s = glLabel(el + '°', '#5e7568', 22);
      const p = glDir(az, el);
      s.position.set(p[0], p[1], p[2]);
      g.add(s);
    }
  }
  return g;
}

/** Текстовий спрайт: малюємо текст у полотно і вішаємо як текстуру */
function glLabel(text, color, px) {
  const pad = 6, size = px || 26;
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  ctx.font = '600 ' + size + 'px ui-monospace,monospace';
  const w = Math.ceil(ctx.measureText(text).width) + pad * 2;
  const h = Math.ceil(size * 1.5);
  cv.width = w; cv.height = h;
  const c2 = cv.getContext('2d');
  c2.font = '600 ' + size + 'px ui-monospace,monospace';
  c2.textBaseline = 'middle';
  c2.fillStyle = color;
  c2.fillText(text, pad, h / 2);
  const tex = new THREE.CanvasTexture(cv);
  if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, opacity: 0.9, depthTest: false, depthWrite: false
  }));
  const k = GL.R * 0.0009;
  sp.scale.set(w * k, h * k, 1);
  return sp;
}

/* ---------- позначки цілей ---------- */

/**
 * Позначка цілі: ромб на сфері, пульсуюче кільце, промінь від цілі вниз
 * до горизонту (він показує кут місця краще за будь-яку цифру) і рисочка
 * на кільці горизонту під її азимутом — щоб було видно, з якого боку
 * ціль, навіть коли сама вона за кадром.
 */
function glMark(it) {
  const grp = new THREE.Group();
  const col = glItemColor(it);

  const dia = [];
  const r = GL.R * 0.03;
  const pts = [[0, r], [r, 0], [0, -r], [-r, 0], [0, r]];
  for (let i = 0; i < pts.length - 1; i++) {
    dia.push(pts[i][0], pts[i][1], 0, pts[i + 1][0], pts[i + 1][1], 0);
  }
  const dg = new THREE.BufferGeometry();
  dg.setAttribute('position', new THREE.Float32BufferAttribute(dia, 3));
  const body = new THREE.LineSegments(dg, new THREE.LineBasicMaterial({
    color: col, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending,
    depthTest: false
  }));
  grp.add(body);

  const ring = new THREE.Mesh(
    new THREE.RingGeometry(r * 1.3, r * 1.45, 24),
    new THREE.MeshBasicMaterial({
      color: col, transparent: true, opacity: 0.7,
      blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthTest: false
    })
  );
  grp.add(ring);

  const rayGeo = new THREE.BufferGeometry();
  rayGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(3 * 20), 3));
  const ray = new THREE.Line(rayGeo, new THREE.LineBasicMaterial({
    color: col, transparent: true, opacity: 0.3, depthTest: false
  }));

  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(3 * 64), 3));
  const trail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({
    color: col, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthTest: false
  }));

  const o = { grp, body, ring, ray, trail, col, n: 0 };
  GL.tg.add(grp); GL.tg.add(ray); GL.tg.add(trail);
  return o;
}

function glDropMark(o) {
  GL.tg.remove(o.grp); GL.tg.remove(o.ray); GL.tg.remove(o.trail);
  o.grp.traverse(x => { if (x.geometry) x.geometry.dispose(); if (x.material) x.material.dispose(); });
  o.ray.geometry.dispose(); o.trail.geometry.dispose();
}

function glUpdateMarks(items) {
  const seen = new Set();
  for (const it of items) {
    if (it.az == null) continue;
    seen.add(it.id);
    let o = GL.marks.get(it.id);
    if (!o) { o = glMark(it); GL.marks.set(it.id, o); }

    const p = glDir(it.az, it.el);
    o.grp.position.set(p[0], p[1], p[2]);
    // ромб і кільце завжди обличчям до спостерігача
    o.grp.quaternion.copy(GL.cam.quaternion);

    /* Непевний трек і в 3D — лише тьмяне мале кільце: без ромба, без
       променя до горизонту, без шлейфу й пульсу. Промені від десятка
       здогадів робили б із неба ялинку. */
    const loose = !!it.loose && (typeof feedLooseMode !== 'function' || feedLooseMode() !== 'all') && it.id !== S.aimFeedId;
    o.body.visible = !loose; o.ray.visible = !loose;
    if (loose) {
      o.ring.material.color.setHex(GL_COL.dim);
      o.ring.scale.set(0.6, 0.6, 1);
      o.ring.material.opacity = 0.3;
      o.trail.visible = false;
      continue;
    }
    const col = glItemColor(it);
    o.body.material.color.setHex(col);
    o.ring.material.color.setHex(col);
    o.ray.material.color.setHex(col);
    o.trail.material.color.setHex(col);

    // пульс: кільце дихає, цивільні борти не пульсують
    const ph = it.civil ? 0.5 : (now() % 1600) / 1600;
    const k = it.civil ? 1 : 1 + ph * 0.5;
    o.ring.scale.set(k, k, 1);
    o.ring.material.opacity = it.civil ? 0.5 : 0.7 * (1 - ph * 0.7);

    // промінь до горизонту по своєму меридіану
    const rp = o.ray.geometry.attributes.position.array;
    for (let i = 0; i < 20; i++) {
      const el = it.el * (1 - i / 19);
      const q = glDir(it.az, el);
      rp[i * 3] = q[0]; rp[i * 3 + 1] = q[1]; rp[i * 3 + 2] = q[2];
    }
    o.ray.geometry.attributes.position.needsUpdate = true;

    // пройдений шлях
    const pts = it.pts || (typeof histPts === 'function' ? histPts('m' + it.id) : null);
    const tp = o.trail.geometry.attributes.position.array;
    if (pts && pts.length > 1) {
      const tail = pts.slice(-64);
      for (let i = 0; i < 64; i++) {
        const src = tail[Math.min(i, tail.length - 1)];
        const q = glDir(src.a, src.e);
        tp[i * 3] = q[0]; tp[i * 3 + 1] = q[1]; tp[i * 3 + 2] = q[2];
      }
      o.trail.visible = true;
    } else o.trail.visible = false;
    o.trail.geometry.attributes.position.needsUpdate = true;
  }
  for (const [id, o] of GL.marks) {
    if (!seen.has(id)) { glDropMark(o); GL.marks.delete(id); }
  }
}

/* ---------- кадр ---------- */

/** Вертикальне поле зору, узгоджене з тим, що показує камера телефона */
function glFov() {
  if (MAN.on) return clamp(DOME_HALF.deg * 1.35, 24, 130);   // нерухомий купол — ширший огляд
  if (S.set.noCam) return 68;
  /* Фокусна камери задана в пікселях КАДРУ, а поле зору потрібне за
     вертикаллю ЕКРАНА. У портреті кадр лежить на боці, тому масштаб
     object-fit: cover переводить одне в інше. */
  const fScreen = (S.fpx || 1000) * (S.view.scale || 1);
  return clamp(2 * Math.atan2(S.view.ch / 2, fScreen) * NBK.R2D, 20, 110);
}

function glResize() {
  if (!GL.ok) return;
  const w = S.view.cw || innerWidth, h = S.view.ch || innerHeight;
  GL.r.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  GL.r.setSize(w, h, false);
  GL.cam.aspect = w / Math.max(h, 1);
  GL.cam.fov = GL.fovV = glFov();
  GL.cam.updateProjectionMatrix();
}

function glFrame(items) {
  if (!GL.on || !GL.ok) return;
  const f = glFov();
  if (Math.abs(f - GL.fovV) > 0.2) { GL.fovV = f; GL.cam.fov = f; GL.cam.updateProjectionMatrix(); }

  /* Осі камери three.js збігаються з осями ТЕЛЕФОНА, а полотно живе в осях
     ЕКРАНА. Поки телефон у портреті, це те саме — і саме тому перша версія
     працювала. Щойно людина повертає телефон у ландшафт, браузер повертає
     сторінку, а осі телефона лишаються на місці: 3D-купол виявлявся
     розвернутим на 90° відносно кадру й підписів. Тому доводимо орієнтацію
     до осей екрана обертанням навколо власної осі погляду. */
  const q = S.q || [0, 0, 0, 1];
  const sa = (S.head.screenAngle || 0) * NBK.D2R / 2;
  const camQ = NBK.quatMul(q, [0, 0, Math.sin(sa), Math.cos(sa)]);
  GL.cam.quaternion.set(camQ[0], camQ[1], camQ[2], camQ[3]);
  GL.cam.updateMatrixWorld();

  glUpdateMarks(items || []);
  GL.r.render(GL.scene, GL.cam);
  GL.frames++;
}

/* ---------- перемикання ---------- */

function glSetOn(on, quiet) {
  const c = $('#gl');
  if (on) {
    if (!glInit()) {
      /* Автоматичний старт без WebGL — не привід для тосту: 2D-купол уже
         працює, а причина стоїть у самоперевірці в Давачах. Перемикач же
         людина торкнулась сама — їй відповідаємо. */
      S.set.gl = false; saveSet();
      const sw = $('#sw-gl'); if (sw) sw.classList.remove('on');
      if (!quiet) toast(GL.fail || 'WebGL недоступний', 'warn', 4500);
      GL.on = false;
      if (c) c.hidden = true;
      return false;
    }
    GL.on = true;
    if (c) c.hidden = false;
    glResize();
    return true;
  }
  GL.on = false;
  if (c) c.hidden = true;
  return true;
}

function glReport() {
  return {
    on: GL.on, ok: GL.ok, fail: GL.fail,
    fov: GL.fovV, marks: GL.marks.size, frames: GL.frames,
    ctx: GL.ok && GL.r ? (GL.r.capabilities && GL.r.capabilities.isWebGL2 ? 'WebGL2' : 'WebGL1') : '—'
  };
}

/* ── 70_render.js ── */
/* ============================================================
   Візуалізація: оверлей, компасна лінійка, мінікарта, спектр
   ============================================================ */
/** Плавний перехід між двома кольорами — для прицілу, що червоніє */
function mixHex(a, b, k) {
  const rd = h => {
    h = (h || '').trim();
    if (h[0] === '#') {
      if (h.length === 4) return [parseInt(h[1] + h[1], 16), parseInt(h[2] + h[2], 16), parseInt(h[3] + h[3], 16)];
      return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    }
    const m = h.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
    return m ? [+m[1], +m[2], +m[3]] : [255, 255, 255];
  };
  const A = rd(a), B = rd(b), t = clamp(k, 0, 1);
  return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' +
    Math.round(A[1] + (B[1] - A[1]) * t) + ',' +
    Math.round(A[2] + (B[2] - A[2]) * t) + ')';
}

function cssVar(n, f) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  return v || f;
}
function sizeCanvas(c, cssW, cssH) {
  const dpr = Math.min(devicePixelRatio || 1, 2.5);
  const w = Math.round(cssW * dpr), h = Math.round(cssH * dpr);
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  return dpr;
}
function updateView() {
  const c = $('#ov'), r = c.getBoundingClientRect();
  const dpr = sizeCanvas(c, r.width, r.height);
  const vw = S.cam.w || 1280, vh = S.cam.h || 720;
  const scale = Math.max(r.width / vw, r.height / vh);
  /* hb — низ «робочого» купола. Зараз збігається з висотою сцени; лишається
     окремим числом, бо все, що тримається над палубою (підписи, стрілки за
     кадром, нотатки), рахує свій запас саме від нього. */
  S.view = {
    dpr, cw: r.width, ch: r.height, hb: r.height, scale,
    ox: (r.width - vw * scale) / 2, oy: (r.height - vh * scale) / 2
  };
}
const v2s = (x, y) => ({ x: S.view.ox + x * S.view.scale, y: S.view.oy + y * S.view.scale });
const s2v = (x, y) => ({ x: (x - S.view.ox) / S.view.scale, y: (y - S.view.oy) / S.view.scale });
const rightLimit = () => S.view.cw;

/**
 * Проєктор напрямку на екран. Дві різні задачі — дві різні проєкції:
 *
 *  з камерою — гномонічна, бо оверлей мусить точно лягати на зображення
 *              з об'єктива; поле вузьке, розтягу практично немає;
 *  без камери — азимутальна рівновіддалена: кутова відстань від осі лінійно
 *              переходить у радіус на екрані. Гномонічна на краю широкого
 *              купола розтягує радіально в рази (на 55° уже в півтора раза
 *              від лінійного, на 70° — утричі), і сітка почала б брехати:
 *              однакові 10° біля центра і біля краю займали б різну відстань.
 */
function makeProjector() {
  const R = NBK.quatToMatrix(S.q || [0, 0, 0, 1]);
  const SA = S.head.screenAngle || 0;

  /* Коли купол малює WebGL, підписи мусять лягати рівно на його геометрію.
     Тому 2D-проєктор переходить на ту саму перспективу, що й камера сцени:
     фокусна виводиться з її вертикального поля зору. Інакше мітка і ромб
     жили б у двох різних проєкціях і розповзалися б на краях. */
  if (GL.on && GL.ok) {
    const cx = S.view.cw / 2, cy = S.view.ch / 2;
    const f = (S.view.ch / 2) / Math.tan(GL.fovV * NBK.D2R / 2);
    return (az, el) => {
      const p = NBK.matAzElToPixel(R, az, el, f, SA);
      return { x: cx + p.x, y: cy + p.y, behind: p.behind, theta: p.theta };
    };
  }

  if (!S.set.noCam) {
    const F = S.fpx || 1000;
    return (az, el) => {
      const p = NBK.matAzElToPixel(R, az, el, F, SA);
      const v = v2s(p.x + S.cam.w / 2, p.y + S.cam.h / 2);
      return { x: v.x, y: v.y, behind: p.behind, theta: p.theta };
    };
  }
  const cx = S.view.cw / 2, cy = S.view.ch / 2;
  const rad = Math.min(S.view.cw, S.view.ch) * 0.46;
  const fEq = rad / (DOME_HALF.deg * NBK.D2R);
  return (az, el) => {
    const p = NBK.matAzElToPixelEq(R, az, el, fEq, SA);
    return { x: cx + p.x, y: cy + p.y, behind: p.behind, theta: p.theta };
  };
}
/* Половина кута купола. У ЖУЙЦІ було сталим: телефон водять рукою, і
   змінювати ще й масштаб нема чого. Тут купол крутять пальцем і дивляться
   з десктопа, тож огляд має вміти і звужуватись до цілі, і розкриватись на
   пів неба. */
var DOME_HALF = {deg:60};
const DOME_HALF_DEG = 60;

function drawOverlay() {
  const c = $('#ov'), g = c.getContext('2d'), d = S.view.dpr;
  g.setTransform(d, 0, 0, d, 0, 0);
  g.clearRect(0, 0, S.view.cw, S.view.ch);
  const acc = cssVar('--acc', '#3ddc84'), dim = cssVar('--dim', '#5e7568'),
    warn = cssVar('--warn', '#f5b83d'), bad = cssVar('--bad', '#ff5a4e');

  g.shadowColor = 'rgba(0,0,0,.75)'; g.shadowBlur = 4;

  const P = makeProjector();

  // сітку малює або WebGL, або 2D — але не обидва: інакше подвійні лінії
  if (!(GL.on && GL.ok)) drawDome(g, P, acc, dim, warn);

  /* Тлові шари: небо, слід сканування, слух, горизонт загрози, коридори.
     Йдуть одразу за сіткою і ПІД усім, що є ціллю: жоден із них не має
     права перекрити те, що справді летить. */
  drawLayersUnder(g, P);

  /* Центральний приціл. Коли в ньому ціль — він теж червоніє і стискається:
     підтвердження має бути там, куди й так дивиться око, а не збоку. */
  const cx = S.view.cw / 2, cy = S.view.ch / 2;
  {
    const onAim = !!(S.aimId || S.aimFeedId);
    S.aimVis = (S.aimVis || 0) + ((onAim ? 1 : 0) - (S.aimVis || 0)) * 0.22;
    const k = S.aimVis;
    const gapR = 5 - 1.6 * k, outR = 16 - 3.5 * k;
    g.save();
    g.globalAlpha = Math.max(S.targets.length ? .28 : .6, .28 + .72 * k);
    g.strokeStyle = k > .04 ? mixHex(acc, bad, k) : acc;
    g.lineWidth = 1 + k * 1.1;
    g.beginPath();
    g.moveTo(cx - outR, cy); g.lineTo(cx - gapR, cy);
    g.moveTo(cx + gapR, cy); g.lineTo(cx + outR, cy);
    g.moveTo(cx, cy - outR); g.lineTo(cx, cy - gapR);
    g.moveTo(cx, cy + gapR); g.lineTo(cx, cy + outR);
    g.stroke();
    if (k > .04) {
      g.globalAlpha = k * .5;
      g.beginPath(); g.arc(cx, cy, outR + 5, 0, 7); g.stroke();
    }
    g.restore();
  }

  /* кандидати */
  {
    g.save(); g.strokeStyle = warn; g.lineWidth = 1.2; g.setLineDash([3, 3]);
    g.font = '10px ui-monospace,monospace'; g.fillStyle = warn;
    for (const cd of S.cands) {
      const p = v2s(cd.x, cd.y);
      const w = Math.max(24, cd.w * S.view.scale + 14), h = Math.max(24, cd.h * S.view.scale + 14);
      g.globalAlpha = .35 + cd.score * .55;
      g.strokeRect(p.x - w / 2, p.y - h / 2, w, h);
      g.fillText(cd.omega.toFixed(1) + '°/с', p.x - w / 2, p.y - h / 2 - 5);
    }
    g.restore();
  }

  /* мережеві цілі — окремим шаром і ПІД оптичними, щоб виміряне
     завжди було зверху */
  drawFeed(g, P);
  drawEnded(g, P);

  /* цілі: ті, що потрапляють у поле зору — рамкою з тулбаром,
     ті, що за спиною чи збоку — стрілкою на межі екрана */
  for (const t of S.targets) {
    const pr = P(t.az, t.el);
    const onScreen = !pr.behind && pr.x > -60 && pr.y > -60 &&
      pr.x < S.view.cw + 60 && pr.y < S.view.ch + 60;
    if (onScreen) drawTargetBox(g, t, P, acc, warn, bad);
    else drawOffscreen(g, t, P, acc, warn, bad);
  }

  /* стан автокалібровки — щоб було видно, що система себе налаштовує */
  if (S.fovSrc !== 'авто') {
    g.save(); g.font = '11px ui-monospace,monospace'; g.fillStyle = warn; g.globalAlpha = .85;
    const c2 = DET.calib || {};
    g.fillText('калібрую оптику самостійно · зразків ' + (c2.n || 0) +
      /* Не в самий низ: там тепер кнопки, і рядок визирав між ними брудом.
         Тримаємо його над палубою, поруч із рештою заміток купола. */
      (c2.conf ? ' · збіжність ' + Math.round(c2.conf * 100) + '%' : ''), 10, S.view.hb - 170);
    g.restore();
  }

  /* Поверх усього: звукова затримка, вибухи, спектрограма, рядок неба —
     те, що не можна ховати за ціль. */
  drawLayersOver(g, P);
}

/* ---------- горизонт і купольна сітка ----------
   Горизонт малюється НЕ горизонтальною лінією: це коло el = 0°, спроєктоване
   точка за точкою через ту саму матрицю орієнтації, що й усе інше. Тому воно
   само нахиляється разом із телефоном, само повзе вгору-вниз і завжди лежить
   там, де справжній горизонт. Якщо лінія збігається з реальним краєм землі —
   орієнтація жива; якщо ні — видно одразу, без жодних цифр. */
function polyline(g, P, pts, close) {
  let started = false, drew = false;
  g.beginPath();
  for (const [az, el] of pts) {
    const p = P(az, el);
    if (p.behind || !isFinite(p.x) || Math.abs(p.x) > 1e5 || Math.abs(p.y) > 1e5) { started = false; continue; }
    if (!started) { g.moveTo(p.x, p.y); started = true; }
    else { g.lineTo(p.x, p.y); drew = true; }
  }
  if (close && started) g.closePath();
  if (drew) g.stroke();
  return drew;
}

function drawDome(g, P, acc, dim, warn) {
  const az0 = S.head.az, span = 120, step = 4;
  g.save();
  g.lineWidth = 1;

  /* земля — смуга нижче горизонту, щоб низ читався миттєво */
  const groundTop = [], groundBot = [];
  for (let d = -span; d <= span; d += step) {
    groundTop.push([az0 + d, 0]);
    groundBot.push([az0 + d, -18]);
  }
  g.globalAlpha = S.set.noCam ? .3 : .16; g.fillStyle = dim;
  g.beginPath();
  let ok = false;
  for (let i = 0; i < groundTop.length; i++) {
    const p = P(groundTop[i][0], groundTop[i][1]);
    if (p.behind) continue;
    ok ? g.lineTo(p.x, p.y) : (g.moveTo(p.x, p.y), ok = true);
  }
  for (let i = groundBot.length - 1; i >= 0; i--) {
    const p = P(groundBot[i][0], groundBot[i][1]);
    if (p.behind) continue;
    g.lineTo(p.x, p.y);
  }
  if (ok) { g.closePath(); g.fill(); }
  g.globalAlpha = 1;

  if (S.set.grid !== false) {
    /* меридіани через 30° азимута */
    const kBright = S.set.noCam ? 1.7 : 1;
    g.strokeStyle = dim; g.globalAlpha = .42 * kBright;
    for (let a = 0; a < 360; a += 30) {
      if (Math.abs(norm180(a - az0)) > 100) continue;
      const pts = [];
      for (let e = 0; e <= 86; e += 4) pts.push([a, e]);
      polyline(g, P, pts);
    }
    /* підпис азимута на кожному меридіані — щоб напрямок читався навіть тоді,
       коли горизонт із його сторонами світу пішов за нижній край екрана */
    g.font = '10px ui-monospace,monospace'; g.textAlign = 'center';
    for (let a = 0; a < 360; a += 30) {
      if (Math.abs(norm180(a - az0)) > 95) continue;
      for (const e of [12, 30, 48]) {
        const p = P(a, e);
        if (p.behind || p.y < 78 || p.y > S.view.hb - 155 || p.x < 16 || p.x > S.view.cw - 16) continue;
        const cardinal = a % 90 === 0;
        g.globalAlpha = cardinal ? .95 : .6;
        g.fillStyle = cardinal ? acc : dim;
        g.fillText(cardinal ? NBK.azName(a) : String(a).padStart(3, '0'), p.x, p.y - 4);
        break;
      }
    }
    g.textAlign = 'left';
    /* паралелі через 15° кута місця */
    g.strokeStyle = dim; g.globalAlpha = .34 * kBright;
    for (let e = 15; e <= 75; e += 15) {
      const pts = [];
      for (let d = -span; d <= span; d += step) pts.push([az0 + d, e]);
      polyline(g, P, pts);
    }
    /* підписи висотних кілець */
    g.globalAlpha = .55; g.fillStyle = dim;
    g.font = '10px ui-monospace,monospace'; g.textAlign = 'left';
    for (let e = 15; e <= 75; e += 15) {
      const p = P(az0 - 26, e);
      if (!p.behind && p.x > -40 && p.x < S.view.cw + 40 && p.y > 60 && p.y < S.view.hb - 150)
        g.fillText(e + '°', p.x, p.y - 3);
    }
    /* зеніт */
    const z = P(az0, 89.5);
    if (!z.behind && z.y > 40 && z.y < S.view.hb - 140) {
      g.globalAlpha = .5; g.strokeStyle = dim;
      g.beginPath(); g.arc(z.x, z.y, 9, 0, 7); g.stroke();
      g.beginPath(); g.moveTo(z.x - 14, z.y); g.lineTo(z.x - 11, z.y);
      g.moveTo(z.x + 11, z.y); g.lineTo(z.x + 14, z.y);
      g.moveTo(z.x, z.y - 14); g.lineTo(z.x, z.y - 11);
      g.moveTo(z.x, z.y + 11); g.lineTo(z.x, z.y + 14); g.stroke();
      g.globalAlpha = .7; g.fillStyle = dim; g.textAlign = 'center';
      g.fillText('зеніт', z.x, z.y + 24); g.textAlign = 'left';
    }
  }

  /* сам горизонт — окремо і яскравіше за сітку */
  const hor = [];
  for (let d = -span; d <= span; d += step) hor.push([az0 + d, 0]);
  g.globalAlpha = S.set.noCam ? 1 : .9; g.strokeStyle = acc;
  g.lineWidth = S.set.noCam ? 2 : 1.6;
  polyline(g, P, hor);
  g.lineWidth = 1;

  /* сторони світу на самому горизонті */
  g.font = '600 11px ui-monospace,monospace'; g.textAlign = 'center';
  for (let a = 0; a < 360; a += 45) {
    if (Math.abs(norm180(a - az0)) > 95) continue;
    const p = P(a, 0);
    if (p.behind) continue;
    const cardinal = a % 90 === 0;
    g.globalAlpha = cardinal ? 1 : .6;
    g.fillStyle = cardinal ? acc : dim;
    g.fillText(NBK.azName(a), p.x, p.y - 8);
    g.globalAlpha = .5;
    g.beginPath(); g.moveTo(p.x, p.y - 5); g.lineTo(p.x, p.y + 5); g.stroke();
  }
  g.textAlign = 'left';

  /* якщо півночі немає — сітка є, але сторони світу умовні */
  if (!S.head.absolute) {
    g.globalAlpha = .9; g.fillStyle = warn; g.font = '11px ui-monospace,monospace';
    g.fillText('північ не прив\u2019язана — азимути умовні', 10, S.view.hb - 152);
  }
  g.restore();
}

/** Далі за 100 км — приглушено: увага має лишатися на тому, що близько */
function feedDimK(it) { return it && it.ground > 100000 ? 0.45 : 1; }

/* ---------- мережеві цілі ----------
   Форма інша (ромб), колір інший, і завжди видно вік даних. Це не примха:
   позначку з мапи легко сплутати з тим, що бачить камера, а різниця між
   «я це бачу зараз» і «про це повідомили півхвилини тому» може коштувати
   дуже дорого. Тому їх неможливо переплутати навіть краєм ока. */
/**
 * Результат: збито / влучила / зникла.
 *
 * Кілька секунд на місці кінця стоїть перекреслена позначка з підписом. Це
 * не «ще одна ціль»: колір сірий, тривоги не дає, у приціл не береться, у
 * лічильник цілей не входить. Людина бачить, ЧИМ скінчилось, замість того
 * щоб гадати, куди поділась позначка.
 */
function drawEnded(g, P) {
  const list = (typeof FEED !== 'undefined' && FEED.ended) ? FEED.ended : [];
  if (!list.length) return;
  const nowMs = Date.now();
  const gone = cssVar('--dim', '#5e7568');
  g.save();
  g.font = '10px ui-monospace,monospace'; g.textBaseline = 'middle';
  for (const e of list) {
    if (e.az == null || e.el == null) continue;
    const p = P(e.az, e.el);
    if (p.behind) continue;
    const k = clamp(1 - (nowMs - e.flashT) / 4500, 0, 1);
    // згасає, але спершу коротко блимає — око встигає зачепитись
    const puls = 0.55 + 0.45 * Math.abs(Math.sin((nowMs - e.flashT) / 130));
    g.globalAlpha = k * puls;
    g.strokeStyle = gone; g.fillStyle = gone; g.lineWidth = 1.6;
    const r = 9;
    g.beginPath();
    g.moveTo(p.x - r, p.y - r); g.lineTo(p.x + r, p.y + r);
    g.moveTo(p.x + r, p.y - r); g.lineTo(p.x - r, p.y + r);
    g.stroke();
    g.globalAlpha = k * .85;
    g.textAlign = 'left';
    g.fillText(String(e.ended || 'зникла') + ' · ' + shortNm(e), p.x + r + 5, p.y);
  }
  g.restore();
}
const shortNm = e => String(e.typeName || e.title || 'ціль').split(/[/(]/)[0].trim();

function drawFeed(g, P) {
  const items = (typeof domeItems === 'function') ? domeItems() : FEED.items;
  const replay = typeof TL !== 'undefined' && !TL.live;
  if ((!FEED.on && !replay) || !items.length) return;
  const col = cssVar('--feed', '#5cc8ff');
  const past = cssVar('--dim', '#5e7568');
  const dim = past;
  const cw = S.view.cw, ch = S.view.ch;
  g.save();
  g.font = '10px ui-monospace,monospace';

  /* Непевні треки (одне джерело, приблизно чи домальовано, без повідомлень
     у стрічці) — окремий візуальний клас: тьмяне кільце, без підпису, без
     шлейфу, без стрілки за кадр. Око має йти до підтверджених. */
  const looseMode = (typeof feedLooseMode === 'function') ? feedLooseMode() : 'faint';
  const isLoose = it => !!it.loose && looseMode !== 'all' && it.id !== S.aimFeedId;
  const firm = items.filter(i => !isLoose(i));

  // спершу траєкторії — вони підкладка, мітки мають лягати поверх; колір — свій у кожної цілі
  const icol = it => (typeof feedColorCss === 'function') ? feedColorCss(it) : col;
  for (const it of firm) if (it.az != null) drawTrack(g, P, it, icol(it));

  // найближчі — найважливіші; на них і показуємо стрілки, коли вони за кадром
  const byNear = firm.slice().sort((a, b) => (a.ground || 1e9) - (b.ground || 1e9));
  const arrowSet = new Set(byNear.slice(0, 5).map(i => i.id));

  /* Черга підписів. Малювати кожен там, де стоїть позначка, не можна: при
     п'яти цілях у одному куті неба таблички лягають одна на одну і не
     читається жодна. Тому спершу збираємо, потім розсовуємо по вертикалі
     і ведемо до кожної тонкий поводок. Повну табличку отримують лише три
     найважливіші цілі — решта одну стрічку: назва і дальність. */
  const labels = [];
  const arrowSlots = {};
  const rank = firm.slice().sort((a, b) =>
    ((b.threat ? b.threat.level : 0) - (a.threat ? a.threat.level : 0)) ||
    ((a.ground || 1e9) - (b.ground || 1e9)));
  const fullSet = new Set(rank.filter(i => !i.civil).slice(0, 3).map(i => i.id));

  for (const it of items) {
    if (it.az == null) continue;
    const p = P(it.az, it.el);
    const fresh = clamp(1 - it.ageSec / 120, 0.18, 1) * feedDimK(it);
    const linked = S.targets.some(t => t.feedId === it.id);
    const onScreen = !p.behind && p.x > 10 && p.y > 96 && p.x < cw - 10 && p.y < S.view.hb - 150;

    if (!onScreen) {
      if (!arrowSet.has(it.id)) continue;
      drawFeedArrow(g, it, P, icol(it), fresh, arrowSlots);
      continue;
    }

    /* НЕПЕВНИЙ трек: тьмяне пунктирне кільце і крапка — «десь тут щось може
       бути», а не ціль. Підпису немає навмисно: підписи й робили з десятка
       домальовок «купу цілей». Тап у прицілі відкриває повну табличку з
       причиною, чому ми цьому не віримо. */
    if (isLoose(it)) {
      g.globalAlpha = fresh * .42; g.strokeStyle = dim; g.fillStyle = dim; g.lineWidth = 1;
      g.setLineDash([2, 3]);
      g.beginPath(); g.arc(p.x, p.y, 6.5, 0, 7); g.stroke();
      g.setLineDash([]);
      g.beginPath(); g.arc(p.x, p.y, 1.4, 0, 7); g.fill();
      g.globalAlpha = fresh;
      continue;
    }

    // Смуга невизначеності висоти. Висоту ми не знаємо — беремо діапазон
    // з довідника, і на 3 км від спостерігача це десятки градусів по куту
    // місця. Чесніше показати смугу, ніж малювати ромб там, де його немає.
    if (!it.altKnown && it.elLo != null && it.elHi != null && Math.abs(it.elHi - it.elLo) > 2) {
      const a = P(it.az, it.elLo), b = P(it.az, it.elHi);
      if (!a.behind && !b.behind) {
        g.globalAlpha = fresh * .3; g.strokeStyle = icol(it); g.lineWidth = 1;
        g.setLineDash([2, 4]);
        g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
        g.setLineDash([]);
        for (const q of [a, b]) {
          g.beginPath(); g.moveTo(q.x - 5, q.y); g.lineTo(q.x + 5, q.y); g.stroke();
        }
      }
    }

    /* «Лише район»: координата в даних — центроїд району, і точка там була б
       брехнею. Малюємо дугу-сектор при горизонті: у ТОМУ боці, десь у цих
       межах — це все, що ми чесно знаємо. */
    if (it.areaOnly) {
      const half = Math.max(8, Math.atan2(it.uncertaintyM || 15000, Math.max(it.ground, 1)) * NBK.R2D);
      g.globalAlpha = fresh * .8;
      g.strokeStyle = icol(it); g.lineWidth = 3; g.setLineDash([7, 6]);
      g.beginPath();
      let started = false;
      for (let a = -half; a <= half; a += 3) {
        const q = P(it.az + a, Math.max(it.el, 2));
        if (q.behind) { started = false; continue; }
        started ? g.lineTo(q.x, q.y) : g.moveTo(q.x, q.y);
        started = true;
      }
      g.stroke(); g.setLineDash([]);
      const lines = [
        'у районі: ' + shortType(it.title || it.typeName),
        NBK.fmtDist(it.ground) + ' до центру · ±' + Math.round(half) + '°',
        it.replay ? 'запис' : Math.round(it.ageSec) + ' с тому'
      ];
      labels.push({ it, p, r: 12, lines, fresh, col: icol(it), dimLast: true });
      continue;
    }

    g.globalAlpha = fresh;
    const calm = it.advisory || it.stale;
    const aimedF = it.id === S.aimFeedId;
    /* Колір — за типом і дальністю (feedColorKey): ракети помаранчеві, решта
       червоні/жовті/сині за відстанню. У прицілі — червоне кільце захоплення
       поверх, але сам ромб лишається свого кольору, щоб не плутати «близько» з «наведено». */
    g.strokeStyle = it.replay ? past : (calm ? cssVar('--dim', '#5e7568') : icol(it));
    g.fillStyle = g.strokeStyle;
    g.lineWidth = aimedF ? 2.4 : linked ? 2 : (it.confirms > 1 ? 1.8 : 1.3);
    g.setLineDash(linked || aimedF ? [] : [4, 3]);
    const r = aimedF ? 13 : 11;
    if (aimedF) {   // кільце захоплення — червоне, як у власної цілі
      const keep = g.strokeStyle;
      g.strokeStyle = cssVar('--bad', '#ff5a4e');
      g.globalAlpha = Math.min(1, fresh + .3) * .6;
      g.beginPath(); g.arc(p.x, p.y, r * 1.7, 0, 7); g.stroke();
      g.globalAlpha = Math.min(1, fresh + .3);
      g.strokeStyle = keep;
    }
    g.beginPath();
    if (it.civil) {
      // цивільний борт — коло, а не ромб: форму видно навіть краєм ока
      g.arc(p.x, p.y, r * 0.8, 0, 7);
    } else {
      g.moveTo(p.x, p.y - r); g.lineTo(p.x + r, p.y);
      g.lineTo(p.x, p.y + r); g.lineTo(p.x - r, p.y); g.closePath();
    }
    g.stroke();
    /* ГРОНА: кілька цілей одного сімейства з одного напрямку. Малюємо
       ромб-у-ромбі й число — щоб з першого погляду було видно, що це не
       одна ціль, і скільком їх насправді. Раніше вони стояли окремими
       ромбами і зливались у пляму. */
    const grpN = (it.cluster && it.cluster.length > 1) ? it.clusterN : (+it.count > 1 ? +it.count : 0);
    if (grpN > 1 && !it.replay) {
      g.setLineDash([]);
      g.globalAlpha = fresh * .8;
      g.beginPath();
      g.moveTo(p.x, p.y - r * .52); g.lineTo(p.x + r * .52, p.y);
      g.lineTo(p.x, p.y + r * .52); g.lineTo(p.x - r * .52, p.y); g.closePath();
      g.stroke();
      const badge = '×' + grpN;
      g.font = 'bold 10px ui-monospace,monospace';
      const w = g.measureText(badge).width + 7;
      g.globalAlpha = fresh;
      g.fillStyle = cssVar('--bg', '#070b09');
      g.fillRect(p.x + r - 2, p.y - r - 9, w, 13);
      g.strokeRect(p.x + r - 2, p.y - r - 9, w, 13);
      g.fillStyle = g.strokeStyle;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(badge, p.x + r - 2 + w / 2, p.y - r - 2.5);
      g.textAlign = 'left'; g.textBaseline = 'alphabetic';
      g.font = '10px ui-monospace,monospace';
    }
    // друге кільце — ціль підтверджена більш ніж одним джерелом
    if (it.confirms > 1 && !it.replay) {
      g.globalAlpha = fresh * .55; g.setLineDash([]);
      g.beginPath(); g.moveTo(p.x, p.y - r - 4); g.lineTo(p.x + r + 4, p.y);
      g.lineTo(p.x, p.y + r + 4); g.lineTo(p.x - r - 4, p.y); g.closePath();
      g.stroke(); g.globalAlpha = fresh;
    }
    // пульс — щоб мітка читалась як жива навіть коли вона майже не рухається
    if (!it.replay && !it.civil && !calm) {
      const ph = (now() % 1600) / 1600;
      g.globalAlpha = fresh * (1 - ph) * .5;
      g.setLineDash([]);
      g.beginPath(); g.arc(p.x, p.y, r + 3 + ph * 13, 0, 7); g.stroke();
      g.globalAlpha = fresh;
    }
    if (it.beyondHorizon) {
      g.globalAlpha = fresh * .8; g.setLineDash([]);
      g.beginPath(); g.moveTo(p.x - r, p.y + r); g.lineTo(p.x + r, p.y - r); g.stroke();
    }
    g.setLineDash([]);
    if (it.hdg != null) {
      const a = (it.hdg - S.head.az) * NBK.D2R;
      g.beginPath();
      g.moveTo(p.x, p.y);
      g.lineTo(p.x + Math.sin(a) * 20, p.y - Math.cos(a) * 6 - 14);
      g.stroke();
    }
    const head = shortType(it.title || it.typeName) + (grpN > 1 && !/×/.test(it.title || '') ? ' ×' + grpN : '') + ' · ' + NBK.fmtDist(it.ground);
    /* У прицілі — повна панель незалежно від рангу, і перший рядок після
       назви — ДАЛЬНІСТЬ ВІД МЕНЕ: з координат цілі та власної геопозиції,
       у кілометрах. Це саме те число, заради якого людина наводиться. */
    const lines = aimedF ? [
      shortType(it.title || it.typeName) + ' · У ПРИЦІЛІ',
      'від мене ' + (it.ground >= 1000 ? (it.ground / 1000).toFixed(1) + ' км' : Math.round(it.ground) + ' м') +
        ' · ' + NBK.fmtAz(it.az) + (it.approx || it.areaOnly ? ' · ≈' : ''),
      (it.speedKmh ? Math.round(it.speedKmh) + ' км/год' : 'швидкість невідома') +
        (it.hdg != null ? ' · курс ' + NBK.fmtAz(it.hdg) : '') +
        (it.closing > 1 ? ' · ↓' + Math.round(it.closing) + ' м/с на нас'
          : it.closing < -1 ? ' · ↑ відхід' : ''),
      (it.tcpa ? 'найближче через ' + Math.round(it.tcpa) + ' с' + (it.dcpa != null ? ' · ' + NBK.fmtDist(it.dcpa) : '') + ' · ' : '') +
        Math.round(it.ageSec) + ' с тому' + (it.sources && it.sources.length > 1 ? ' · ' + it.sources.length + ' джерела' : ''),
      'H ' + Math.round(it.alt) + ' м' + (it.altKnown ? '' : ' (припущ.)') +
        (it.fromText ? (it.conf >= 3 ? ' · з тексту ПС ЗСУ' : ' · з тексту каналу') : it.advisory ? ' · спостереження' : ''),
      /* Чому ми цьому віримо або не віримо — людина мусить бачити підставу,
         а не лише ромб: «дві карти згодні» і «лише домальовка курсу» — це
         різні речі, навіть коли стоять на одному місці. */
      it.replay ? 'запис' : it.loose ? 'НЕПЕВНА · ' + (it.trustWhy || 'одне джерело')
        : it.trustWhy ? 'підтверджена · ' + it.trustWhy : ''
    ].filter(Boolean) : fullSet.has(it.id) ? [
      shortType(it.title || it.typeName),
      NBK.fmtDist(it.ground) + (it.speedKmh ? ' · ' + Math.round(it.speedKmh) + ' км/год' : ''),
      it.replay ? 'запис · ' + hhmmss(new Date(TL.at)).slice(0, 5)
        : Math.round(it.ageSec) + ' с тому' +
        (it.sources && it.sources.length > 1 ? ' · ' + it.sources.length + ' джерела' : '') +
        (linked ? ' · звʼязано' : ''),
      it.beyondHorizon ? 'за горизонтом (' + Math.round(it.horizonKm) + ' км)'
        : 'H ' + Math.round(it.alt) + ' м' + (it.altKnown ? '' : ' (припущ.)') +
        (it.fromText ? (it.conf >= 3 ? ' · з тексту ПС ЗСУ' : ' · з тексту каналу')
          : it.advisory ? ' · спостереження' : it.stale ? ' · дані мовчать' : it.approx ? ' · ≈' : '')
    ] : [head];
    labels.push({ it, p, r, lines, fresh, col: g.strokeStyle, dimLast: lines.length > 1 });
  }

  drawLabels(g, labels, col, dim);
  g.restore();
}

/**
 * Розкладає підписи так, щоб вони не перекривались.
 *
 * Спершу кожен хоче стати навпроти своєї позначки. Далі один прохід
 * розслаблення: якщо табличка налазить на попередню — з'їжджає нижче;
 * якщо черга вилізла за низ екрана — усе піднімається назад. Поводок
 * від позначки до таблички лишає зв'язок очевидним навіть коли підпис
 * поїхав на пів екрана.
 */
function drawLabels(g, labels, col, dim) {
  if (!labels.length) return;
  const cw = S.view.cw, ch = S.view.ch;
  const TOP = 96, BOT = S.view.hb - 150, GAP = 4;
  g.font = '10px ui-monospace,monospace';

  for (const L of labels) {
    let w = 0;
    for (const l of L.lines) w = Math.max(w, g.measureText(l).width);
    L.w = w + 10;
    L.h = L.lines.length * 12 + 8;
    L.left = L.p.x + L.r + 8 + L.w <= cw - 6;
    L.x = L.left ? L.p.x + L.r + 8 : L.p.x - L.r - 8 - L.w;
    L.x = clamp(L.x, 4, Math.max(4, cw - L.w - 4));
    L.want = clamp(L.p.y - L.h / 2, TOP, Math.max(TOP, BOT - L.h));
    L.y = L.want;
  }

  // важливіші (з повною табличкою) займають місце першими
  labels.sort((a, b) => (b.lines.length - a.lines.length) || (a.want - b.want));
  const placed = [];
  for (const L of labels) {
    let y = L.want, guard = 0;
    while (guard++ < 40) {
      // повне перетинання прямокутників, а не «приблизно та сама колонка»:
      // інакше сусідній підпис формально не рахується накладеним, а на око лізе
      const hit = placed.find(q =>
        L.x < q.x + q.w + GAP && L.x + L.w + GAP > q.x &&
        y < q.y + q.h + GAP && y + L.h + GAP > q.y);
      if (!hit) break;
      y = hit.y + hit.h + GAP;
      if (y + L.h > BOT) { y = Math.max(TOP, hit.y - L.h - GAP); break; }
    }
    L.y = clamp(y, TOP, Math.max(TOP, BOT - L.h));
    placed.push(L);
  }

  for (const L of labels) {
    const f = L.fresh;
    // поводок: від краю позначки до таблички
    const ax = L.left ? L.x : L.x + L.w;
    const ay = L.y + L.h / 2;
    if (Math.abs(ay - L.p.y) > 6 || Math.abs(ax - L.p.x) > L.r + 14) {
      g.globalAlpha = f * .35; g.strokeStyle = L.col; g.lineWidth = 1;
      g.setLineDash([]);
      g.beginPath();
      g.moveTo(L.p.x + (L.left ? L.r : -L.r), L.p.y);
      g.lineTo(ax, ay); g.stroke();
    }
    g.globalAlpha = f * .85;
    g.fillStyle = 'rgba(6,12,9,.82)';
    g.fillRect(L.x, L.y, L.w, L.h);
    g.globalAlpha = f * .5; g.strokeStyle = L.col; g.lineWidth = 1;
    g.strokeRect(L.x, L.y, L.w, L.h);
    let ty = L.y + 13;
    for (let i = 0; i < L.lines.length; i++) {
      const last = L.dimLast && i === L.lines.length - 1;
      g.fillStyle = last ? dim : L.col;
      g.globalAlpha = last ? f * .6 : f;
      g.fillText(L.lines[i], L.x + 5, ty);
      ty += 12;
    }
  }
  g.globalAlpha = 1;
}

/**
 * Траєкторія цілі на куполі: пройдений шлях і прогноз.
 *
 * Минуле — суцільна лінія, що згасає з віддаленням у часі: свіжий відрізок
 * яскравий, хвіст майже прозорий, тож напрямок руху видно без стрілок.
 * Майбутнє — пунктир, що біжить: ціль летить приблизно так само, як летіла,
 * і за кілька секунд буде отам. Прогноз коротший за минуле навмисно —
 * далі трьох хвилин екстраполяція перестає бути чесною.
 */
/* Хвіст сліду і крок міток на ньому — в одному місці, бо вони пов'язані:
   вікно мусить ділитись на крок без залишку, інакше остання мітка не
   збігається з кінцем лінії. */
const TRACK_TAIL_MS = 12 * 60e3;
const TRACK_MARK_MIN = 3;
/**
 * Мітки на пройденому сліді. Для кожної круглої хвилини беремо РЕАЛЬНУ
 * точку треку, найближчу за часом, а не інтерполюємо: намальована мітка
 * має стояти там, де ціль справді була. Якщо запису поблизу немає (дані
 * мовчали), мітки просто немає — вигадувати позицію не можна.
 */
function trackMarks(tail, tNow) {
  const out = [];
  if (!tail || tail.length < 2) return out;
  const span = tNow - tail[0].t;
  for (let m = TRACK_MARK_MIN; m * 60e3 <= Math.min(span, TRACK_TAIL_MS); m += TRACK_MARK_MIN) {
    const want = tNow - m * 60e3;
    let best = null, bd = 45e3;               // допуск: пів кроку
    for (const p of tail) {
      const d = Math.abs(p.t - want);
      if (d < bd) { bd = d; best = p; }
    }
    if (best) out.push({ a: best.a, e: best.e, min: m });
  }
  return out;
}
function drawTrack(g, P, it, col) {
  const pts = it.pts || (typeof histPts === 'function' ? histPts('m' + it.id) : null);
  const tNow = (typeof tlTime === 'function') ? tlTime() : Date.now();
  g.save();
  g.setLineDash([]);
  if (pts && pts.length > 1) {
    const tail = pts.filter(p => p.t <= tNow && tNow - p.t < TRACK_TAIL_MS).slice(-40);
    for (let i = 1; i < tail.length; i++) {
      const a = P(tail[i - 1].a, tail[i - 1].e), b = P(tail[i].a, tail[i].e);
      if (a.behind || b.behind) continue;
      // згасання: і за віком точки, і за місцем у хвості
      /* Пройдений слід — СУЦІЛЬНА лінія, і вона мусить читатись. Нижня
         межа прозорості була 0.1: на темному небі це фактично невидимо,
         і траєкторія існувала лише в коді. Тепер найстаріший кінець
         блідий, але видимий, а свіжий — впевнений. */
      const age = clamp(1 - (tNow - tail[i].t) / TRACK_TAIL_MS, 0, 1);
      g.globalAlpha = 0.24 + 0.5 * age * (i / tail.length);
      g.strokeStyle = col; g.lineWidth = 1.2 + 1.4 * (i / tail.length);
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    }
    /* Мітки часу на пройденому: «−3хв» — ось тут воно було три хвилини
       тому. Без них суцільна лінія каже лише напрямок, а з ними видно й
       ШВИДКІСТЬ: рідкі мітки — летить швидко, густі — повзе. Крок 3 хв
       обрано під вікно хвоста у 12 хв: чотири мітки читаються, шість
       злипаються, дві нічого не кажуть. */
    /* Мітки, які злиплись, гірші за їх відсутність: повільна ціль за три
       хвилини проходить кілька пікселів, і три підписи лягають один на
       одного просто біля позначки. Тому мітка малюється лише там, де для
       неї є місце — і від самої цілі, і від попередньої мітки. */
    const here = P(it.az, it.el);
    let prev = null;
    for (const q of trackMarks(tail, tNow)) {
      const p = P(q.a, q.e); if (p.behind) continue;
      if (!here.behind && Math.hypot(p.x - here.x, p.y - here.y) < 30) continue;
      if (prev && Math.hypot(p.x - prev.x, p.y - prev.y) < 26) continue;
      prev = p;
      g.globalAlpha = .5; g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 1.2;
      g.beginPath(); g.arc(p.x, p.y, 2.6, 0, 7); g.stroke();
      g.globalAlpha = .34;
      g.font = '9px ui-monospace,monospace'; g.textAlign = 'right'; g.textBaseline = 'middle';
      g.fillText('−' + q.min + 'хв', p.x - 5, p.y);
      g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    }
  }
  // прогноз: беремо швидкість і курс, крутимо вперед по секундах
  const me = myPos();
  if (me && it.lat != null && it.speedKmh > 20 && it.hdg != null && !it.beyondHorizon) {
    const v = it.speedKmh / 3.6;
    const proj = [];
    for (let sec = 0; sec <= 180; sec += 15) {
      const d = NBK.destPoint(it.lat, it.lon, it.hdg, v * sec);
      const bd = NBK.gcBearingDist(me.lat, me.lon, d.lat, d.lon);
      proj.push({ a: bd.az, e: NBK.elevationTo(bd.dist, it.alt, me.alt || 0), sec });
    }
    const dashPhase = (now() / 60) % 14;
    g.setLineDash([7, 7]); g.lineDashOffset = -dashPhase;
    g.strokeStyle = col;
    for (let i = 1; i < proj.length; i++) {
      const a = P(proj[i - 1].a, proj[i - 1].e), b = P(proj[i].a, proj[i].e);
      if (a.behind || b.behind) continue;
      g.globalAlpha = 0.5 * (1 - proj[i].sec / 200);
      g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    }
    g.setLineDash([]); g.lineDashOffset = 0;
    // позначки часу підльоту — «за 60 с буде тут»
    g.font = '9px ui-monospace,monospace'; g.fillStyle = col;
    for (const q of proj) {
      if (q.sec === 0 || q.sec % 60) continue;
      const p = P(q.a, q.e); if (p.behind) continue;
      g.globalAlpha = .45;
      g.beginPath(); g.arc(p.x, p.y, 2.5, 0, 7); g.fill();
      g.fillText('+' + (q.sec / 60) + 'хв', p.x + 5, p.y + 3);
    }
  }
  g.restore();
}

/* Стрілка до мережевої цілі, яка зараз не в полі зору — без неї
   «крутитись навколо себе» безглуздо: не видно, куди повертатись. */
function drawFeedArrow(g, it, P, col, fresh, slots) {
  const cw = S.view.cw, ch = S.view.ch;
  // нижче лінійки азимута і вище смуги приладів — інакше стрілки лізуть на них
  const pad = 30, top = 150, bot = S.view.hb - 230;
  const p = P(it.az, it.el);
  let sx, sy, ang;
  const dAz = norm180(it.az - S.head.az);
  if (p.behind) {
    sx = dAz > 0 ? cw - pad : pad;
    sy = (top + bot) / 2;
    ang = dAz > 0 ? 0 : Math.PI;
  } else {
    sx = clamp(p.x, pad, cw - pad);
    sy = clamp(p.y, top, bot);
    ang = Math.atan2(p.y - ch / 2, p.x - cw / 2);
  }
  /* Кілька цілей за одним краєм кадру ставали в одну точку і підписи
     лягали один на один. Зайняті висоти на кожному боці пам'ятаємо і
     зсуваємо наступну стрілку на рядок нижче (чи вище, коли внизу тісно). */
  if (slots) {
    const side = sx > cw / 2 ? 'r' : 'l';
    const used = slots[side] || (slots[side] = []);
    let y = sy, tries = 0;
    while (used.some(u => Math.abs(u - y) < 22) && tries < 12) { y += 22; if (y > bot) y = sy - 22 * (tries + 1); tries++; }
    sy = clamp(y, top, bot); used.push(sy);
  }
  g.save();
  g.globalAlpha = fresh * .9;
  g.translate(sx, sy); g.rotate(ang);
  g.strokeStyle = col; g.lineWidth = 1.4;
  g.setLineDash([]);
  g.beginPath();
  g.moveTo(11, 0); g.lineTo(-6, -7); g.lineTo(-2, 0); g.lineTo(-6, 7); g.closePath();
  g.stroke();
  g.restore();

  g.save();
  g.globalAlpha = fresh * .9;
  g.fillStyle = col; g.font = '10px ui-monospace,monospace';
  // куди повертатись, показує сама стрілка; у підписі потрібні тип і дальність
  const lbl = shortType(it.title || it.typeName) + ' · ' + NBK.fmtDist(it.ground);
  g.textAlign = sx > cw / 2 ? 'right' : 'left';
  g.fillText(lbl, sx + (sx > cw / 2 ? -16 : 16), sy + 4);
  g.textAlign = 'left';
  g.restore();
}

function threatColor(t, acc, warn, bad) {
  if (!t.threat) return acc;
  return t.threat.level >= 3 ? bad : t.threat.level === 2 ? warn : acc;
}

/* Ціль малюється за своїм НАПРЯМКОМ, а не за пікселем у кадрі: вона живе
   на сфері навколо оператора. Тому вона на місці й тоді, коли камера вимкнена
   в укритті, і тоді, коли трекер на мить загубив пляму. */
function drawTargetBox(g, t, P, acc, warn, bad) {
  const active = t.id === S.activeId;
  const aimed = t.id === S.aimId;
  const pr = P(t.az, t.el);
  if (pr.behind) return;
  const p = { x: pr.x, y: pr.y };
  if (p.x < -80 || p.y < -80 || p.x > S.view.cw + 80 || p.y > S.view.ch + 80) return;
  const blob = Math.max(t.sizePx || 12, 10) * S.view.scale;
  /* Наведення показуємо не миганням, а РУХОМ: рамка плавно стискається до
     цілі. Стрибкова зміна на кадр читається як збій, а стиснення за чверть
     секунди читається як «взяв». */
  t.aimK = (t.aimK || 0) + ((aimed ? 1 : 0) - (t.aimK || 0)) * 0.22;
  if (t.aimK < 0.004) t.aimK = 0;
  const k = t.aimK;
  const b0 = clamp(blob * 1.9 + 26, 40, 170) / 2;
  const b = b0 * (1 - 0.22 * k);
  const col = aimed ? bad : t.lost > 6 ? warn : threatColor(t, acc, warn, bad);
  g.save();
  g.strokeStyle = col; g.lineWidth = 1.2 + (active ? 0.8 : 0) + k * 1.2; g.lineCap = 'round';
  g.globalAlpha = Math.min(1, (active ? 1 : .62) + k * .38);
  const L = b * (0.42 + 0.22 * k);
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => {
    g.beginPath();
    g.moveTo(p.x + sx * b - sx * L, p.y + sy * b);
    g.lineTo(p.x + sx * b, p.y + sy * b);
    g.lineTo(p.x + sx * b, p.y + sy * b - sy * L);
    g.stroke();
  });
  if (k > 0.02) {   // тонке кільце захоплення
    g.globalAlpha = k * .55; g.lineWidth = 1;
    g.beginPath(); g.arc(p.x, p.y, b * 1.28, 0, 7); g.stroke();
    g.globalAlpha = Math.min(1, (active ? 1 : .62) + k * .38); g.lineWidth = 1.2 + k * 1.2;
  }
  if (t.threat && t.threat.level >= 3) {
    const k = 0.5 + 0.5 * Math.sin(now() / 160);
    g.globalAlpha = .25 + .45 * k;
    g.strokeRect(p.x - b - 6, p.y - b - 6, 2 * b + 12, 2 * b + 12);
  }
  // промінь від горизонту до цілі — видно, у який бік і як високо
  g.globalAlpha = active ? .35 : .18; g.setLineDash([3, 5]);
  const foot = P(t.az, 0);
  if (!foot.behind) { g.beginPath(); g.moveTo(p.x, p.y + b); g.lineTo(foot.x, foot.y); g.stroke(); }
  g.setLineDash([]);
  g.globalAlpha = 1;
  g.fillStyle = t.conf > .5 ? col : warn;
  g.fillRect(p.x - b, p.y + b + 7, 2 * b * clamp(t.conf, 0, 1), 2);
  g.restore();

  drawTargetPanel(g, p, b, t, col, active, aimed);
}

/* Тулбар цілі: дальність, висота, швидкість, тип. Те, заради чого все й робиться. */
function drawTargetPanel(g, p, b, t, col, active, aimed) {
  const d = t.der || {};
  const rows = [];
  /* Жодне число не має шансу вийти на екран у вигляді «NaN» або «0%». Під
     тривогою людина читає ці цифри як факт, і зламане число гірше за
     відсутнє: відсутнє видно, що відсутнє, а NaN виглядає як показник. */
  const fin = v => typeof v === 'number' && isFinite(v);
  if (t.est && fin(t.est.r)) {
    rows.push(['Д', NBK.fmtDist(t.est.r) +
      (t.held ? ' (утрим.)' : fin(t.est.sigma) ? ' ±' + NBK.fmtDist(t.est.sigma) : '')]);
    // коридор показуємо лише коли він справді коридор, а не точка чи дичина
    if (t.band && fin(t.band.lo) && fin(t.band.hi) &&
      t.band.hi > t.band.lo * 1.02 && t.band.hi >= t.est.r * 0.5 && t.band.lo <= t.est.r * 2)
      rows.push(['', NBK.fmtDist(t.band.lo) + '–' + NBK.fmtDist(t.band.hi)]);
  } else rows.push(['Д', 'рахую…']);
  if (fin(d.alt)) rows.push(['H', Math.round(d.alt) + ' м']);
  if (fin(d.speed) && d.speed > 2 && fin(d.speedKmh))
    rows.push(['V', Math.round(d.speedKmh) + ' км/год ' + NBK.azName(d.heading)]);
  rows.push(['', NBK.fmtAz(t.az) + ' / ' + t.el.toFixed(0) + '°']);
  /* У прицілі — дальність ВІД МЕНЕ по координатах, якщо вони є: з
     мережевого треку, з яким ціль звʼязана, або з власної оцінки позиції.
     Це друге число поруч з оптичним «Д», і воно зазвичай точніше. */
  if (aimed) {
    const me = myPos();
    let gm = null, why = '';
    const f = t.feedId ? FEED.items.find(x => x.id === t.feedId) : null;
    if (f && fin(f.ground)) { gm = f.ground; why = 'з даних'; }
    else if (me && t.pos && fin(t.pos.lat) && fin(t.pos.lon)) {
      gm = NBK.bearingDist(me.lat, me.lon, t.pos.lat, t.pos.lon).dist; why = 'з оцінки';
    }
    if (gm != null) rows.push(['', 'від мене ' + (gm >= 1000 ? (gm / 1000).toFixed(1) + ' км' : Math.round(gm) + ' м') + ' · ' + why]);
  }
  /* Під прицілом показуємо ще й те, що має значення саме для людини під
     цією ціллю: чи вона зближується, коли буде найближче і як близько. */
  if (aimed && fin(d.speed) && d.speed > 2) {
    if (fin(d.closing) && Math.abs(d.closing) > 1) {
      rows.push([d.closing > 0 ? '↓' : '↑',
        Math.abs(d.closing).toFixed(0) + ' м/с ' + (d.closing > 0 ? 'на нас' : 'відхід')]);
    } else rows.push(['', 'іде траверзом']);
    if (fin(d.tcpa) && d.tcpa > 0 && fin(d.dcpa)) {
      rows.push(['CPA', NBK.fmtDist(d.dcpa) + ' через ' + Math.round(d.tcpa) + ' с']);
    }
  }
  if (t.typeName) rows.push(['', shortType(t.typeName) +
    (t.byMap ? ' · за мапою'
      : (fin(t.typeP) && t.typeP >= 0.01 ? ' ' + Math.round(t.typeP * 100) + '%' : '')) +
    (t.ambiguous && !t.byMap ? ' ?' : '')]);
  if (t.feedMismatch) rows.push(['!', 'трек мапи не сходиться']);
  if (t.threat && t.threat.level >= 2) rows.push(['!', t.threat.label]);

  g.save();
  g.font = '11px ui-monospace,monospace';
  let w = 0;
  for (const [k, v] of rows) w = Math.max(w, g.measureText((k ? k + ' ' : '') + v).width);
  const titleW = g.measureText(t.name + (aimed ? ' · У ПРИЦІЛІ' : '')).width + 10;
  w = Math.max(w, titleW) + 16;
  const h = 18 + rows.length * 13 + 6;
  let x = p.x + b + 10, y = p.y - h / 2;
  if (x + w > S.view.cw - 6) x = p.x - b - 10 - w;
  x = clamp(x, 4, Math.max(4, S.view.cw - w - 4));
  y = clamp(y, 62, Math.max(62, S.view.hb - h - 150));

  g.globalAlpha = aimed ? 1 : active ? .92 : .7;
  g.fillStyle = aimed ? 'rgba(20,6,5,.9)' : 'rgba(6,12,9,.82)';
  g.strokeStyle = col; g.lineWidth = aimed ? 1.6 : 1;
  const r = 7;
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r); g.closePath();
  g.fill(); g.stroke();
  // хвостик до рамки цілі
  g.globalAlpha = active ? .6 : .35;
  g.beginPath(); g.moveTo(x < p.x ? x + w : x, y + h / 2); g.lineTo(p.x, p.y); g.stroke();

  g.globalAlpha = 1;
  g.fillStyle = col; g.font = '700 11px ui-monospace,monospace';
  g.fillText(t.name, x + 8, y + 14);
  if (aimed) {
    const nw = g.measureText(t.name).width;
    g.font = '700 8.5px ui-monospace,monospace'; g.globalAlpha = .9;
    g.fillText('У ПРИЦІЛІ', x + 12 + nw, y + 14);
    g.globalAlpha = 1;
  }
  g.font = '11px ui-monospace,monospace';
  let ty = y + 27;
  for (const [k, v] of rows) {
    g.fillStyle = k === '!' ? col : cssVar('--txt', '#d6e6dc');
    g.globalAlpha = k ? 1 : .75;
    g.fillText((k ? k + ' ' : '') + v, x + 8, ty);
    ty += 13;
  }
  g.restore();
}

/** Стрілка до цілі, що вийшла з кадру */
function drawOffscreen(g, t, P, acc, warn, bad) {
  const cw = rightLimit(), ch = S.view.ch;
  const pad = 34, top = 96, bot = S.view.hb - 190;
  const p = P(t.az, t.el);
  let sx, sy, ang;
  if (p.behind) {
    // ціль позаду — кладемо стрілку внизу, з розворотом
    const dAz = norm180(t.az - S.head.az);
    sx = dAz > 0 ? cw - pad : pad;
    sy = (top + bot) / 2;
    ang = dAz > 0 ? 0 : Math.PI;
  } else {
    sx = clamp(p.x, pad, cw - pad);
    sy = clamp(p.y, top, bot);
    ang = Math.atan2(p.y - ch / 2, p.x - cw / 2);
  }
  const col = threatColor(t, acc, warn, bad);
  const fade = clamp(1 - t.coastMs / (HOLD_SEC * 1000), 0.25, 1);
  g.save();
  g.globalAlpha = fade;
  g.translate(sx, sy);
  g.rotate(ang);
  g.fillStyle = col;
  g.beginPath(); g.moveTo(13, 0); g.lineTo(-7, -8); g.lineTo(-3, 0); g.lineTo(-7, 8); g.closePath(); g.fill();
  g.restore();

  g.save(); g.globalAlpha = fade;
  g.font = '10px ui-monospace,monospace'; g.fillStyle = col;
  const dAz = norm180(t.az - S.head.az);
  const lbl = t.name + ' ' + (dAz >= 0 ? '+' : '') + dAz.toFixed(0) + '°' +
    (t.est ? ' ' + NBK.fmtDist(t.est.r) : '');
  g.textAlign = sx > cw / 2 ? 'right' : 'left';
  g.fillText(lbl, sx + (sx > cw / 2 ? -18 : 18), sy + 4);
  g.textAlign = 'left';
  g.restore();
}

/* ---------- компасна лінійка ---------- */
function drawRuler() {
  const c = $('#ruler'), r = c.getBoundingClientRect();
  if (!r.width) return;
  const d = sizeCanvas(c, r.width, r.height);
  const g = c.getContext('2d');
  g.setTransform(d, 0, 0, d, 0, 0);
  g.clearRect(0, 0, r.width, r.height);
  const span = 80, ppd = r.width / span, az = S.head.az;
  const acc = cssVar('--acc', '#3ddc84'), txt = cssVar('--txt2', '#8fa89a'),
    dim = cssVar('--dim', '#5e7568'), warn = cssVar('--warn', '#f5b83d'), bad = cssVar('--bad', '#ff5a4e');
  g.font = '600 12px ui-monospace,monospace';
  const center = NBK.fmtAz(az) + ' ' + NBK.azName(az);
  const cw = g.measureText(center).width + 12;
  g.font = '10px ui-monospace,monospace'; g.textAlign = 'center';
  const start = Math.floor((az - span / 2) / 5) * 5;
  for (let a = start; a <= az + span / 2; a += 5) {
    const x = r.width / 2 + norm180(a - az) * ppd;
    const A = norm360(a), major = A % 30 === 0;
    g.strokeStyle = major ? txt : dim; g.globalAlpha = major ? .9 : .45; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, r.height - 9); g.lineTo(x, r.height - (major ? 20 : 14)); g.stroke();
    if (major && Math.abs(x - r.width / 2) > cw / 2 + 14) {
      g.globalAlpha = 1; g.fillStyle = A % 90 === 0 ? acc : txt;
      g.fillText(A % 90 === 0 ? NBK.azName(A) : String(A).padStart(3, '0'), x, r.height - 24);
    }
  }
  g.globalAlpha = 1;
  g.font = '600 12px ui-monospace,monospace';
  g.fillStyle = 'rgba(6,12,9,.7)';
  g.fillRect(r.width / 2 - cw / 2, r.height - 34, cw, 16);
  g.fillStyle = acc; g.textAlign = 'center';
  g.fillText(center, r.width / 2, r.height - 22);

  /* мітки всіх цілей */
  for (const t of S.targets) {
    const x = r.width / 2 + norm180(t.az - az) * ppd;
    if (x < 0 || x > r.width) continue;
    const col = threatColor(t, acc, warn, bad);
    g.fillStyle = col; g.globalAlpha = t.id === S.activeId ? 1 : .6;
    g.beginPath();
    g.moveTo(x, r.height - 5); g.lineTo(x - 4, r.height); g.lineTo(x + 4, r.height); g.fill();
    if (t.id === S.activeId) {
      g.font = '9px ui-monospace,monospace'; g.textAlign = 'center';
      g.fillText(t.name, x, r.height - 8);
    }
  }
  g.globalAlpha = 1;
}

/* Круглий радар переїхав у 72_map.js і став мапою: та сама полярна
   сітка, але поверх справжньої місцевості. */

/* ── 71_layers.js ── */
/* ═══════════════════════════════════════════════════════════════════
   ШАРИ КУПОЛА: НЕБО, ВЛАСНІ ДАВАЧІ, ГОРИЗОНТ ЗАГРОЗИ

   Усе, що додано до купола понад цілі й сітку. Кожен шар — окремий
   перемикач, бо увага в укритті витратна: людина мусить мати змогу
   вимкнути будь-що, лишивши голе небо з цілями.

   Правила, за якими це малюється:
   · Плавність обертання священна. Жоден шар не рахує геометрію
     повторно — усе готове лежить у SKY / SCAN / ACOU / HEAT, а тут
     тільки лінії. Дуги по горизонту йдуть кроком 6°, тобто 30 точок
     на видиме вікно, не більше.
   · Дані і здогад малюються різним тоном. Те, що «на слух», ніколи не
     виглядає як те, що з даних: інша прозорість, інший пунктир, підпис
     «на слух» просто на дузі.
   · Нічого не блимає без причини. Єдина анімація тут — хвиля тривоги,
     і вона проходить один раз.
   ═══════════════════════════════════════════════════════════════════ */

const LAY_STEP = 6;              // крок дуг по азимуту, градуси
const LAY_SPAN = 108;            // піввікно азимутів, які взагалі можуть бути видимі
const WAVE_MS = 2600;            // скільки біжить хвиля тривоги
/* deckTop — верх нижнього блоку HUD, міряється раз на 380 мс у головному
   циклі. Живе тут, а не в S.view: updateView() перестворює S.view цілком. */
const LAY = { waveT: 0, waveAz: null, alertWas: false, deckTop: 0 };

/** Квадрати вздовж горизонту: заливка смуги від elLo до elHi у вікні азимутів */
function layBand(g, P, az0, elLo, elHi, paint) {
  for (let d = -LAY_SPAN; d < LAY_SPAN; d += LAY_STEP) {
    const a1 = az0 + d, a2 = az0 + d + LAY_STEP;
    const p1 = P(a1, elLo), p2 = P(a2, elLo), p3 = P(a2, elHi), p4 = P(a1, elHi);
    if (p1.behind || p2.behind || p3.behind || p4.behind) continue;
    if (!isFinite(p1.x) || !isFinite(p3.x)) continue;
    const c = paint(a1 + LAY_STEP / 2);
    if (!c) continue;
    g.fillStyle = c;
    g.beginPath();
    g.moveTo(p1.x, p1.y); g.lineTo(p2.x, p2.y); g.lineTo(p3.x, p3.y); g.lineTo(p4.x, p4.y);
    g.closePath(); g.fill();
  }
}

/** Дуга по колу сталої висоти між двома азимутами */
function layArc(g, P, azFrom, azTo, el) {
  const pts = [];
  for (let a = azFrom; a <= azTo + 0.01; a += Math.min(LAY_STEP, (azTo - azFrom) / 2 || LAY_STEP)) pts.push([a, el]);
  return polyline(g, P, pts);
}

/* ═════ НЕБО: СОНЦЕ, МІСЯЦЬ, ПОЛЯРНА, СУТІНКИ, МЕЖА ПІДСВІТКИ ═════ */

function drawSkyLayer(g, P) {
  if (!S.set.sky || !SKY.ok) return;
  const az0 = S.head.az;
  const warn = cssVar('--warn', '#f5b83d'), acc = cssVar('--acc', '#3ddc84'),
    dim = cssVar('--dim', '#5e7568'), txt = cssVar('--txt', '#d6e6dc');

  g.save();
  g.shadowBlur = 0;

  /* Заграва на горизонті з боку сонця: не прикраса, а відповідь на
     питання «скільки ще видно». Гасне разом зі справжньою загравою. */
  if (SKY.depr > 0 && SKY.depr < 14) {
    const k = Math.max(0, 1 - SKY.depr / 14);
    // три підсмуги замість однієї: заграва мусить гаснути вгору, а не стояти цеглиною
    for (const [lo, hi, w2] of [[0, 1.8, 1], [1.8, 3.8, 0.55], [3.8, 7, 0.22]]) {
      layBand(g, P, az0, lo, hi, a => {
        const off = Math.abs(NBK.norm180(a - SKY.sun.az));
        if (off > 95) return null;
        const w = Math.pow(Math.cos(off * Math.PI / 190), 3) * k * w2;
        return w < 0.02 ? null : 'rgba(255,150,60,' + (w * 0.16).toFixed(3) + ')';
      });
    }
  }

  /* Межа підсвітки. Нижче цієї висоти будь-яка ціль у межах радіуса даних
     уже в тіні Землі — дивитись туди очима марно. Вище — ціль освітлена
     сонцем і горить цяткою на темному небі. Це і є те вікно, у яке
     «шахед» видно найкраще за всю добу. */
  if (SKY.depr > 0 && SKY.litKm > 0 && SKY.litKm <= SKY_LIT_MAX_KM) {
    const R = (S.set.radiusKm || FEED_RADIUS_KM) * 1000;
    const elMin = NBK.elevationTo(R, SKY.litKm * 1000, 0);
    if (elMin > 0.3 && elMin < 60) {
      g.setLineDash([7, 6]); g.lineWidth = 1.1;
      g.strokeStyle = 'rgba(255,190,90,.42)';
      layArc(g, P, az0 - LAY_SPAN, az0 + LAY_SPAN, elMin);
      g.setLineDash([]);
      const lp = P(az0, elMin);
      if (!lp.behind && isFinite(lp.x)) {
        g.font = '10px ui-monospace,monospace';
        g.fillStyle = 'rgba(255,190,90,.75)';
        g.textAlign = 'center';
        g.fillText('вище — ціль ще освітлена сонцем · ' + SKY.litKm.toFixed(1) + ' км', lp.x, lp.y - 6);
        g.textAlign = 'left';
      }
    }
  }

  /* Конус засліплення: сектор, у якому очима не побачиш нічого. */
  if (SKY.sun.el > -1) {
    const sp = P(SKY.sun.az, Math.max(SKY.sun.el, 0));
    if (!sp.behind && isFinite(sp.x)) {
      const rad = Math.max(26, SKY_GLARE_DEG * (S.view.ch / 2) / Math.max(20, GL.fovV || 60));
      const grd = g.createRadialGradient(sp.x, sp.y, 2, sp.x, sp.y, rad);
      grd.addColorStop(0, 'rgba(255,200,90,.22)');
      grd.addColorStop(1, 'rgba(255,200,90,0)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(sp.x, sp.y, rad, 0, 7); g.fill();
      g.strokeStyle = 'rgba(255,205,105,.55)'; g.lineWidth = 1.4;
      g.beginPath(); g.arc(sp.x, sp.y, 9, 0, 7); g.stroke();
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        g.beginPath();
        g.moveTo(sp.x + Math.cos(a) * 12, sp.y + Math.sin(a) * 12);
        g.lineTo(sp.x + Math.cos(a) * 16, sp.y + Math.sin(a) * 16);
        g.stroke();
      }
      g.font = '10px ui-monospace,monospace'; g.fillStyle = 'rgba(255,205,105,.8)';
      g.textAlign = 'center';
      g.fillText(SKY.sun.el > 0 ? 'сонце · не дивись' : 'сонце щойно зайшло', sp.x, sp.y + 30);
      g.textAlign = 'left';
    }
  }

  /* Місяць: фаза намальована, а не написана — видно з одного погляду,
     скільки буде світла вночі. */
  if (SKY.moon.el > -2) {
    const mp = P(SKY.moon.az, Math.max(SKY.moon.el, 0));
    if (!mp.behind && isFinite(mp.x)) {
      const r = 9, k = SKY.moon.illum;
      g.save();
      g.translate(mp.x, mp.y);
      g.strokeStyle = 'rgba(200,225,245,.5)'; g.lineWidth = 1;
      g.beginPath(); g.arc(0, 0, r, 0, 7); g.stroke();
      // освітлена частина: коло плюс еліпс термінатора
      g.fillStyle = 'rgba(215,235,250,' + (0.28 + 0.5 * k).toFixed(2) + ')';
      g.beginPath();
      const side = SKY.moon.waxing ? 1 : -1;
      g.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, side < 0);
      g.ellipse(0, 0, r * Math.abs(1 - 2 * k), r, 0, Math.PI / 2, -Math.PI / 2, k > 0.5 ? side < 0 : side > 0);
      g.closePath(); g.fill();
      g.restore();
      g.font = '10px ui-monospace,monospace'; g.fillStyle = 'rgba(200,225,245,.7)';
      g.textAlign = 'center';
      g.fillText('місяць · ' + SKY.moon.phase + ' ' + Math.round(SKY.moon.illum * 100) + '%', mp.x, mp.y + 24);
      g.textAlign = 'left';
    }
  }

  /* Полярна — єдиний еталон півночі, який не гнеться від металу.
     Показуємо лише в темряві: удень її все одно не видно, а плутати
     людину зайвою міткою нема чого. */
  if (SKY.sun.el < -6) {
    const pp = P(SKY.polaris.az, SKY.polaris.el);
    if (!pp.behind && isFinite(pp.x)) {
      g.strokeStyle = acc; g.lineWidth = 1.1; g.globalAlpha = .85;
      g.beginPath(); g.arc(pp.x, pp.y, 6, 0, 7); g.stroke();
      g.beginPath();
      g.moveTo(pp.x - 11, pp.y); g.lineTo(pp.x - 7, pp.y);
      g.moveTo(pp.x + 7, pp.y); g.lineTo(pp.x + 11, pp.y);
      g.moveTo(pp.x, pp.y - 11); g.lineTo(pp.x, pp.y - 7);
      g.moveTo(pp.x, pp.y + 7); g.lineTo(pp.x, pp.y + 11);
      g.stroke();
      g.globalAlpha = 1;
      g.font = '10px ui-monospace,monospace'; g.fillStyle = acc;
      g.textAlign = 'center';
      g.fillText('Полярна — тут має бути північ', pp.x, pp.y - 16);
      g.textAlign = 'left';
    }
  }
  g.restore();
}

/* ═════ СЛІД СКАНУВАННЯ ═════ */
/**
 * Куди людина вже подивилась. Переглянуті сектори темні, недивлені —
 * підсвічені холодним. Це карта власної уваги: одразу видно, що півкола
 * ти не бачив жодного разу.
 */
function drawScanLayer(g, P) {
  if (!S.set.scan || !SCAN.any || !S.head.absolute) return;
  const az0 = S.head.az, nowMs = Date.now();
  const step = 360 / SCAN_BINS;
  g.save(); g.shadowBlur = 0;
  layBand(g, P, az0, 0.4, 3.2, a => {
    const cold = scanCold(amBin(a, SCAN_BINS), nowMs);
    return cold < 0.15 ? null : 'rgba(90,150,255,' + (cold * 0.16).toFixed(3) + ')';
  });
  g.restore();
}

/* ═════ АКУСТИЧНИЙ ГОРИЗОНТ ═════ */
/**
 * Полярна мапа гулу. Малюється навмисно інакше за дані: пунктирна дуга
 * над горизонтом і підпис «на слух» — щоб ніхто не сплутав здогад
 * мікрофона з треком.
 */
function drawAcouLayer(g, P) {
  if (!S.set.ear || ACOU.max < 0.35) return;
  const az0 = S.head.az;
  g.save(); g.shadowBlur = 0;
  layBand(g, P, az0, 3.6, 7.4, a => {
    const v = ACOU.bins[amBin(a, ACOU_BINS)] / ACOU.max;
    return v < 0.18 ? null : 'rgba(245,184,61,' + (v * 0.30).toFixed(3) + ')';
  });
  // найгучніший сектор підписуємо — це і є вся користь від шару
  let bi = 0;
  for (let i = 1; i < ACOU_BINS; i++) if (ACOU.bins[i] > ACOU.bins[bi]) bi = i;
  const bAz = bi * (360 / ACOU_BINS);
  if (Math.abs(NBK.norm180(bAz - az0)) < LAY_SPAN) {
    const p = P(bAz, 8.4);
    if (!p.behind && isFinite(p.x)) {
      g.font = '10px ui-monospace,monospace';
      g.fillStyle = 'rgba(245,184,61,.8)';
      g.textAlign = 'center';
      g.fillText('гучніше сюди · на слух', p.x, p.y);
      g.textAlign = 'left';
    }
  }
  g.restore();
}

/* ═════ ТЕПЛОВА КАРТА РУХУ ═════ */
function drawHeatLayer(g, P) {
  if (!S.set.heat || HEAT.max < 0.4) return;
  const az0 = S.head.az, aStep = 360 / HEAT_AZ, eStep = HEAT_EL_TOP / HEAT_EL;
  g.save(); g.shadowBlur = 0;
  for (let ei = 0; ei < HEAT_EL; ei++) {
    const e1 = ei * eStep, e2 = e1 + eStep;
    for (let d = -LAY_SPAN; d < LAY_SPAN; d += aStep) {
      const a1 = az0 + d, v = HEAT.cells[ei * HEAT_AZ + amBin(a1, HEAT_AZ)] / HEAT.max;
      if (v < 0.12) continue;
      const p1 = P(a1, e1), p2 = P(a1 + aStep, e1), p3 = P(a1 + aStep, e2), p4 = P(a1, e2);
      if (p1.behind || p2.behind || p3.behind || p4.behind) continue;
      g.fillStyle = 'rgba(93,200,255,' + (v * 0.13).toFixed(3) + ')';
      g.beginPath();
      g.moveTo(p1.x, p1.y); g.lineTo(p2.x, p2.y); g.lineTo(p3.x, p3.y); g.lineTo(p4.x, p4.y);
      g.closePath(); g.fill();
    }
  }
  g.restore();
}

/* ═════ ГОРИЗОНТ ЗАГРОЗИ ═════ */
/**
 * Найважливіший із нових шарів. Купол досі показував тільки те, що видно;
 * тепер він показує і те, що ЙДЕ — включно з цілями за горизонтом, яких
 * очима не побачиш ще кілька хвилин. Дуга на горизонті: товщина й колір —
 * скільки цілей із цього боку, підпис — за скільки найближча вийде з-за
 * обрію. Плюс тьмяний слід історичних коридорів під нею.
 */
function drawThreatRing(g, P) {
  if (!S.set.ring) return;
  const az0 = S.head.az;
  const items = (typeof FEED !== 'undefined' && FEED.items) ? FEED.items : [];
  const bins = new Float32Array(ACOU_BINS), soon = new Float32Array(ACOU_BINS);
  const colr = new Array(ACOU_BINS);
  soon.fill(Infinity);
  let any = false;
  for (const it of items) {
    if (!it || it.civil || !isFinite(it.az)) continue;
    const i = amBin(it.az, ACOU_BINS);
    const w = it.threat && it.threat.level ? it.threat.level : 1;
    bins[i] = Math.max(bins[i], w);
    colr[i] = feedColorHex(it);
    any = true;
    // за скільки вийде з-за обрію: скільки ще йти до своєї дальності видимості
    if (it.beyondHorizon && it.horizonKm > 0 && it.speedKmh > 5 && it.ground > it.horizonKm) {
      const mins = (it.ground - it.horizonKm) / it.speedKmh * 60;
      if (mins > 0 && mins < 90 && mins < soon[i]) soon[i] = mins;
    }
  }
  g.save(); g.shadowBlur = 0;

  // історичні коридори — під усім, найтьмяніше
  const cm = corrMax();
  if (S.set.ring && cm > 2) {
    layBand(g, P, az0, -1.6, -0.2, a => {
      const v = CORR.bins[amBin(a, ACOU_BINS)] / cm;
      return v < 0.2 ? null : 'rgba(150,170,190,' + (v * 0.16).toFixed(3) + ')';
    });
  }

  if (!any) { g.restore(); return; }
  const step = 360 / ACOU_BINS;
  for (let i = 0; i < ACOU_BINS; i++) {
    if (!bins[i]) continue;
    const a = i * step;
    if (Math.abs(NBK.norm180(a - az0)) > LAY_SPAN) continue;
    const lvl = bins[i];
    g.strokeStyle = colr[i] || cssVar('--feed', '#5cc8ff');
    g.lineWidth = 1.6 + lvl * 1.4;
    g.globalAlpha = .30 + lvl * .22;
    layArc(g, P, a - step / 2, a + step / 2, 0.7);
    g.globalAlpha = 1;
    if (isFinite(soon[i])) {
      const p = P(a, -1.8);
      if (!p.behind && isFinite(p.x)) {
        g.font = '10px ui-monospace,monospace';
        g.fillStyle = colr[i] || cssVar('--feed', '#5cc8ff');
        g.textAlign = 'center';
        g.fillText('з-за обрію ~' + (soon[i] < 1 ? '<1' : Math.round(soon[i])) + ' хв', p.x, p.y);
        g.textAlign = 'left';
      }
    }
  }

  /* Хвиля тривоги: коли в області вмикається тривога, горизонтом один раз
     пробігає хвиля з боку тієї області. Один раз — не миготіння. */
  const on = (typeof ALERTS !== 'undefined') && !!ALERTS.mine;
  if (on && !LAY.alertWas) {
    LAY.waveT = Date.now();
    // хвиля йде з боку найближчої живої цілі, а як таких немає — з півночі
    let near = null, nd = Infinity;
    for (const it of items) if (!it.civil && isFinite(it.az) && it.ground < nd) { nd = it.ground; near = it; }
    LAY.waveAz = near ? near.az : 0;
  }
  LAY.alertWas = on;
  const dt = Date.now() - LAY.waveT;
  if (LAY.waveT && dt < WAVE_MS) {
    const k = dt / WAVE_MS;
    const from = LAY.waveAz == null ? 0 : LAY.waveAz;
    const spread = k * 190;
    g.strokeStyle = cssVar('--bad', '#ff5a4e');
    g.lineWidth = 2.2; g.globalAlpha = (1 - k) * .7;
    for (const s of [-1, 1]) {
      const a = from + s * spread;
      if (Math.abs(NBK.norm180(a - az0)) > LAY_SPAN) continue;
      layArc(g, P, a - 7, a + 7, 0);
    }
    g.globalAlpha = 1;
  }
  g.restore();
}

/* ═════ ЗВУКОВА ЗАТРИМКА ═════ */
/**
 * Найбільше непорозуміння в полі: люди дивляться туди, звідки чують.
 * Звук іде 340 м/с, тож із 5 км він запізнюється на 15 секунд, і за цей
 * час ціль пройшла кілометр. Привид позаду цілі — це те місце, звідки
 * вийшов звук, який чути ЗАРАЗ; стрілка веде туди, де ціль тепер.
 */
function drawSoundGhosts(g, P) {
  if (!S.set.ear) return;
  const hum = (typeof EAR !== 'undefined') ? (EAR.hum || 0) : 0;
  if (hum < 0.25) return;
  const items = (typeof FEED !== 'undefined' && FEED.items) ? FEED.items : [];
  const c = NBK.soundSpeed(15);
  let drawn = 0;
  g.save(); g.shadowBlur = 0;
  for (const it of items) {
    if (drawn >= 2 || !it || it.civil || !(it.slant > 300) || it.slant > 20000) continue;
    if (!(it.speedKmh > 20) || !isFinite(it.hdg)) continue;
    const lag = it.slant / c;                       // скільки летів звук, секунди
    if (lag < 3) continue;
    const backM = it.speedKmh / 3.6 * lag;          // скільки ціль пройшла за цей час
    const me = myPos(); if (!me) break;
    const back = NBK.destPoint(it.lat, it.lon, (it.hdg + 180) % 360, backM);
    const bd = NBK.gcBearingDist(me.lat, me.lon, back.lat, back.lon);
    const bel = NBK.elevationTo(bd.dist, (it.alt || 0), 0);
    const p0 = P(bd.az, Math.max(bel, 0)), p1 = P(it.az, Math.max(it.el, 0));
    if (p0.behind || p1.behind || !isFinite(p0.x) || !isFinite(p1.x)) continue;
    g.strokeStyle = 'rgba(245,184,61,.55)'; g.lineWidth = 1;
    g.setLineDash([3, 4]);
    g.beginPath(); g.arc(p0.x, p0.y, 7, 0, 7); g.stroke();
    g.beginPath(); g.moveTo(p0.x, p0.y); g.lineTo(p1.x, p1.y); g.stroke();
    g.setLineDash([]);
    g.font = '10px ui-monospace,monospace'; g.fillStyle = 'rgba(245,184,61,.85)';
    g.textAlign = 'center';
    g.fillText('звук звідси · ' + Math.round(lag) + ' с тому', p0.x, p0.y - 11);
    g.textAlign = 'left';
    drawn++;
  }
  g.restore();
}

/* ═════ КОРИДОР ПРОЛЬОТУ І ТОЧКА НАЙБЛИЖЧОГО ПІДХОДУ ═════ */
/**
 * Числа CPA досі жили текстом на палубі. Тепер вони на небі: стрічка
 * прогнозу з зіркою в точці, де ціль підійде найближче, і підпис — за
 * скільки метрів і через скільки секунд.
 */
function drawCorridors(g, P) {
  if (!S.set.corr) return;
  const me = myPos(); if (!me) return;
  const items = (typeof FEED !== 'undefined' && FEED.items) ? FEED.items : [];
  g.save(); g.shadowBlur = 0;
  let n = 0;
  for (const it of items) {
    if (n >= 3 || !it || it.civil || it.loose) continue;
    if (!(it.tcpa > 0) || !(it.tcpa < 900) || !isFinite(it.dcpa)) continue;
    if (!(it.speedKmh > 20) || !isFinite(it.hdg)) continue;
    const fwd = NBK.destPoint(it.lat, it.lon, it.hdg, it.speedKmh / 3.6 * it.tcpa);
    const fd = NBK.gcBearingDist(me.lat, me.lon, fwd.lat, fwd.lon);
    const fel = NBK.elevationTo(fd.dist, it.alt || 0, 0);
    const p0 = P(it.az, Math.max(it.el, 0)), p1 = P(fd.bearing, Math.max(fel, 0));
    if (p0.behind || p1.behind || !isFinite(p0.x) || !isFinite(p1.x)) continue;
    const col = feedColorHex(it);
    g.strokeStyle = col; g.globalAlpha = .28; g.lineWidth = 5;
    g.beginPath(); g.moveTo(p0.x, p0.y); g.lineTo(p1.x, p1.y); g.stroke();
    g.globalAlpha = .85; g.lineWidth = 1.2;
    // зірка в точці найближчого підходу
    g.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 4;
      g.moveTo(p1.x - Math.cos(a) * 6, p1.y - Math.sin(a) * 6);
      g.lineTo(p1.x + Math.cos(a) * 6, p1.y + Math.sin(a) * 6);
    }
    g.stroke();
    g.font = '10px ui-monospace,monospace'; g.fillStyle = col;
    g.textAlign = 'center';
    g.fillText(NBK.fmtDist(it.dcpa) + ' через ' + Math.round(it.tcpa) + ' с', p1.x, p1.y + 17);
    g.textAlign = 'left';
    g.globalAlpha = 1;
    n++;
  }
  g.restore();
}

/* ═════ СПАЛАХ І ГРІМ ═════ */
function drawBangs(g, P) {
  if (!S.set.flash || !BANGS.length) return;
  const nowMs = Date.now();
  g.save(); g.shadowBlur = 0;
  for (const b of BANGS) {
    const age = (nowMs - b.t) / 1000;
    if (age > 300) continue;
    const p = P(b.az, Math.max(b.el, 0.5));
    if (p.behind || !isFinite(p.x)) continue;
    const a = Math.max(.25, 1 - age / 300);
    g.globalAlpha = a;
    g.strokeStyle = cssVar('--bad', '#ff5a4e'); g.lineWidth = 1.4;
    g.beginPath(); g.arc(p.x, p.y, 10, 0, 7); g.stroke();
    for (let i = 0; i < 6; i++) {
      const ang = i * Math.PI / 3;
      g.beginPath();
      g.moveTo(p.x + Math.cos(ang) * 12, p.y + Math.sin(ang) * 12);
      g.lineTo(p.x + Math.cos(ang) * 17, p.y + Math.sin(ang) * 17);
      g.stroke();
    }
    g.font = '10px ui-monospace,monospace'; g.fillStyle = cssVar('--bad', '#ff5a4e');
    g.textAlign = 'center';
    g.fillText('вибух ' + NBK.fmtDist(b.distM) + ' · спалах–грім ' + b.dtS.toFixed(1) + ' с', p.x, p.y + 30);
    g.textAlign = 'left';
    g.globalAlpha = 1;
  }
  g.restore();
}

/* ═════ ЛІНІЯ НАПАРНИКА ═════ */
/** Результат спільного фіксу досі був текстом. Тепер видно і саму базу. */
function drawPartner(g, P) {
  if (!S.set.corr) return;
  const me = myPos(); if (!me || typeof TRI === 'undefined') return;
  for (const it of (TRI.items || [])) {
    const inf = it && it.triInfo; if (!inf || !inf.mine) continue;
    const b = NBK.gcBearingDist(me.lat, me.lon, inf.mine.lat, inf.mine.lon);
    if (!(b.dist > 50)) continue;
    const p = P(b.az, 0.6);
    if (p.behind || !isFinite(p.x)) continue;
    g.save(); g.shadowBlur = 0;
    g.strokeStyle = cssVar('--acc', '#3ddc84'); g.globalAlpha = .6; g.lineWidth = 1.2;
    g.setLineDash([2, 3]);
    g.beginPath(); g.arc(p.x, p.y, 7, 0, 7); g.stroke();
    g.setLineDash([]);
    g.font = '10px ui-monospace,monospace'; g.fillStyle = cssVar('--acc', '#3ddc84');
    g.textAlign = 'center';
    g.fillText('напарник ' + NBK.fmtDist(b.dist), p.x, p.y + 20);
    g.textAlign = 'left';
    g.restore();
    break;
  }
}

/* ═════ СПЕКТРОГРАМА ═════ */
/**
 * Екранна панель, не купольна: частота не має азимута. Гребінь гармонік
 * поршневого двигуна виглядає як кілька рівновіддалених смуг — його видно
 * оком раніше, ніж набереться поріг для чіпа «гул».
 */
function drawSpectroPanel(g) {
  if (!S.set.ear || !SPECTRO.ready) return;
  const top = LAY.deckTop || S.view.hb || S.view.ch;
  const w = 118, h = 46, x = 10, y = top - h - 44;
  if (y < 120) return;
  g.save(); g.shadowBlur = 0;
  g.globalAlpha = .9;
  g.fillStyle = 'rgba(6,11,9,.72)';
  g.fillRect(x - 3, y - 3, w + 6, h + 16);
  g.strokeStyle = 'rgba(58,90,72,.7)'; g.lineWidth = 1;
  g.strokeRect(x - 3, y - 3, w + 6, h + 16);
  try { g.drawImage(SPECTRO.cv, x, y, w, h); } catch (e) { }
  g.font = '9px ui-monospace,monospace';
  g.fillStyle = cssVar('--dim', '#5e7568');
  const hz = (typeof EAR !== 'undefined' && S.audio && S.audio.harm && S.audio.harm.spacing) ? S.audio.harm.spacing : 0;
  g.fillText('40–2000 Гц · 30 с' + (hz >= 60 && hz <= 200 ? ' · крок ' + Math.round(hz) + ' Гц' : ''), x, y + h + 9);
  g.globalAlpha = 1;
  g.restore();
}

/* ═════ РЯДОК НЕБА ═════ */
/** Одне речення внизу купола: що зараз надворі і скільки цього лишилось. */
function drawSkyLine(g) {
  if (!S.set.sky || !SKY.ok) return;
  const parts = [SKY.phase];
  if (SKY.nextName && SKY.nextT) {
    const m = Math.round((SKY.nextT - Date.now()) / 60000);
    if (m >= 0 && m < 600) parts.push(SKY.nextName + ' за ' + (m < 1 ? '<1' : m) + ' хв');
  }
  if (SKY.depr > 0.05 && SKY.litKm > 0.05 && SKY.litKm <= SKY_LIT_MAX_KM)
    parts.push('підсвічено вище ' + SKY.litKm.toFixed(1) + ' км');
  if (SKY.moon.el > 0) parts.push('місяць ' + Math.round(SKY.moon.illum * 100) + '%');
  g.save(); g.shadowBlur = 0;
  g.font = '10px ui-monospace,monospace';
  g.fillStyle = cssVar('--dim', '#5e7568');
  g.globalAlpha = .9;
  // над спектрограмою, якщо вона є, інакше просто над нижнім блоком
  const top = LAY.deckTop || S.view.hb || S.view.ch;
  g.fillText(parts.join(' · '), 10, (S.set.ear && SPECTRO.ready ? top - 106 : top - 12));
  g.restore();
}
