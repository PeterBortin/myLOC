var SPEED = {drone_piston:165, drone_jet:450, missile_cruise:800, missile_ballistic:7500,
  bomb:750, drone_fpv:120, mig31k:900, unknown:300};

/* ───────────────────────── геометрія ───────────────────────── */
var R2 = Math.PI/180;

function km(a, b){
  var dLat = (b[1]-a[1])*R2, dLon = (b[0]-a[0])*R2;
  var s = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(a[1]*R2)*Math.cos(b[1]*R2)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 6371 * 2 * Math.asin(Math.min(1, Math.sqrt(s)));
}

/* точка за азимутом і відстанню (км) */
function dest(lon, lat, brg, d){
  var ang = d/6371, t = brg*R2, la = lat*R2, lo = lon*R2;
  var la2 = Math.asin(Math.sin(la)*Math.cos(ang) + Math.cos(la)*Math.sin(ang)*Math.cos(t));
  var lo2 = lo + Math.atan2(Math.sin(t)*Math.sin(ang)*Math.cos(la),
                            Math.cos(ang) - Math.sin(la)*Math.sin(la2));
  return [((lo2/R2 + 540) % 360) - 180, la2/R2];
}

function bearing(a, b){
  var y = Math.sin((b[0]-a[0])*R2)*Math.cos(b[1]*R2);
  var x = Math.cos(a[1]*R2)*Math.sin(b[1]*R2) -
          Math.sin(a[1]*R2)*Math.cos(b[1]*R2)*Math.cos((b[0]-a[0])*R2);
  return (Math.atan2(y, x)/R2 + 360) % 360;
}

/* ───────────────────────── мережа ───────────────────────── */
function getJSON(url){
  return fetch(url, {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('NEPTUN ' + r.status);
    return r.json();
  });
}

/* назва області у вигляді, яким користуються шари мапи */
function oblName(s){
  if(!s) return '';
  var n = String(s).trim().replace(/^м\.\s*/i,'').replace(/\s*область$/i,'').replace(/\s*обл\.?$/i,'');
  if(/^(ар\s*)?крим$/i.test(n) || /криму?$/i.test(n)) return 'АР Крим';
  if(/^київ$/i.test(n)) return 'Київ';
  if(/^севастополь/i.test(n)) return 'Севастополь';
  return n;
}

/* ───────────────────────── нормалізація ─────────────────────────
   Одна ціль з фіду → один запис сталої форми. Нічого не домислюємо:
   чого нема в API, те лишається null/0, а не вигаданим числом. */
/* Висоти в API немає — документація її не описує, і в жодній відповіді вона
   не траплялась. Але якщо зʼявиться під одним зі звичних імен, беремо ЇЇ,
   а не здогад із профілю польоту. Доти alt лишається null, і шар малює
   ціль на крейсерській висоті її типу. */
function altOf(t){
  var v = t.alt != null ? t.alt
        : t.altitude != null ? t.altitude
        : t.altM != null ? t.altM
        : t.altitudeM != null ? t.altitudeM
        : t.height != null ? t.height
        : t.flightLevel != null ? t.flightLevel * 30.48    // FL → м
        : null;
  if(v == null) return null;
  v = +v;
  return isFinite(v) && v >= 0 && v < 200000 ? v : null;
}

function norm(t, t0){
  var kind = KIND[t.type] || 'unknown';
  var v = t.velocity || {};
  var hdg = (t.heading != null ? t.heading : v.bearingDeg);
  var last = Date.parse(t.updatedAt || '') || t0;
  var first = Date.parse(t.confirmedAt || '') || last;
  return {
    id:'np:' + t.id, kind:kind, subkind:t.type || kind,
    amount:Math.max(1, t.count || 1),
    title:t.title || TITLE[t.type] || 'Ціль',
    status:(t.status === 'active' ? 'active' : 'lost'),
    lat:t.lat, lon:t.lon, alt:altOf(t), hdg:(hdg == null ? 0 : hdg),
    speed:v.speedKmh || SPEED[kind] || 300,
    city:t.locality || t.district || t.region || '',
    region:t.region || '', district:t.district || '',
    first:first, last:last, t0:t0,
    trail:[],
    conf:t.confidenceLevel || '',
    advisory:!!t.advisory, areaOnly:!!t.areaOnly,
    uncertKm:t.uncertaintyKm || 0,
    note:t.explanationShort || ''
  };
}

/* ───────────────────────── запити ───────────────────────── */

/* areaOnly:true — точки НЕМАЄ, названо лише область. Такі записи не малюємо
   як ціль (це була б вигадана позиція) — вони йдуть у підсвітку області. */
function threats(){
  return getJSON(NEP + '/api/v1/threats').then(function(j){
    var t0 = Date.now(), objs = [], areas = [];
    (j.threats || []).forEach(function(t){
      if(!isFinite(t.lat) || !isFinite(t.lon)) return;
      var o = norm(t, t0);
      (o.areaOnly ? areas : objs).push(o);
    });
    return {objs:objs, areas:areas,
      serverTime:Date.parse(j.serverTime || '') || t0, ts:t0};
  });
}

/* ⚠ Районна тривога — це НЕ тривога в усій області. Підняти її до області
   (як робив delta⁹) означає залити пів країни там, де накрито один район:
   у типову ніч майже кожна область має бодай один район під тривогою.
   Тому oblasts[] і raions[] лишаються РІЗНИМИ речами, а шар малює їх по-різному. */
function alerts(){
  return getJSON(NEP + '/api/v1/alerts').then(function(j){
    var obl = {}, raions = {}, list = [];
    (j.oblasts || []).forEach(function(o){
      var n = oblName(o.name || o.oblast || o.key);
      if(n) obl[n] = Date.parse(o.since || '') || 0;
      list.push({t:o.name || n, sub:'вся область',
        since:Date.parse(o.since || '') || 0, lvl:'oblast'});
    });
    (j.raions || []).forEach(function(o){
      var n = oblName(o.oblast || '');
      if(n) (raions[n] = raions[n] || []).push({
        name:o.name || '', since:Date.parse(o.since || '') || 0});
      list.push({t:o.name || '', sub:o.oblast || '',
        since:Date.parse(o.since || '') || 0, lvl:'raion'});
    });
    list.sort(function(a,b){ return (b.since||0) - (a.since||0); });
    return {oblasts:Object.keys(obl), oblastSince:obl, raions:raions,
      list:list, ts:Date.now()};
  });
}

function messages(){
  return getJSON(NEP + '/api/v1/messages').then(function(j){
    return (j.messages || []).map(function(m){
      return {chan:m.channel || '', text:m.text || '', t:Date.parse(m.date || '') || 0};
    });
  });
}

/* ───────────────────────── числення шляху ─────────────────────────
   Фід оновлюється раз на десятки секунд, а мапа малює 60 разів на секунду.
   Між оновленнями позицію числимо самі: курс + швидкість + минулий час.
   Стеля — 30 хв: далі «протягувати» ціль означало б її вигадати. */
function posAt(rec, now){
  if(!rec || rec.status !== 'active' || !rec.speed) return [rec.lon, rec.lat];
  var dt = Math.max(0, Math.min(1800, (now - (rec.last || now)) / 1000));
  if(dt < 1) return [rec.lon, rec.lat];
  return dest(rec.lon, rec.lat, rec.hdg || 0, rec.speed * dt / 3600);
}

/* чи запис ще свіжий (за умовчанням 12 хв) */
function fresh(rec, maxMin){
  return (Date.now() - (rec.last || 0)) < (maxMin || 12) * 60000;
}

/* ───────────────────────── опитування ─────────────────────────
   start() тримає цикл і сам тлумачить збої: одна невдача — не привід
   гасити стрічку, тому інтервал росте до 4× і повертається на місце,
   щойно джерело відповіло. */
function start(opts){
  opts = opts || {};
  var everyMs = (opts.everyS || 30) * 1000;
  var onData = opts.onData || function(){};
  var onErr = opts.onError || function(){};
  var withAlerts = opts.alerts !== false;
  var timer = null, stopped = false, miss = 0;

  function tick(){
    var jobs = [threats()];
    if(withAlerts) jobs.push(alerts().catch(function(){ return null; }));
    Promise.all(jobs).then(function(r){
      miss = 0;
      onData({threats:r[0], alerts:r[1] || null, ts:Date.now()});
    }).catch(function(e){
      miss++;
      onErr(e, miss);
    }).then(function(){
      if(stopped) return;
      var back = Math.min(4, 1 + miss * 0.5);
      timer = setTimeout(tick, everyMs * back);
    });
  }

  tick();
  return {
    stop:function(){ stopped = true; if(timer) clearTimeout(timer); },
    now:function(){ if(timer) clearTimeout(timer); if(!stopped) tick(); }
  };
}

/* ───────────────────────── атрибуція ─────────────────────────
   Умова використання API: посилання на NEPTUN має бути видиме поруч
   із даними. Ось готовий вузол — покласти в кут мапи або в підвал панелі. */
function credit(){
  var a = document.createElement('a');
  a.href = 'https://neptun.in.ua/';
  a.target = '_blank';
  a.rel = 'noopener';
  a.className = 'neptun-credit';
  a.textContent = 'дані · NEPTUN';
  return a;
}

window.TerenNeptun = {
  NEP:NEP, KIND:KIND, TITLE:TITLE, SPEED:SPEED,
  threats:threats, alerts:alerts, messages:messages,
  norm:norm, altOf:altOf, posAt:posAt, fresh:fresh, oblName:oblName,
  km:km, dest:dest, bearing:bearing,
  start:start, credit:credit
};
})();
</script>
<script>
/* ТЕРЕН · ЕФЕКТИ — вибухи, шлейфи, факели, ударні хвилі
   ────────────────────────────────────────────────────────────────────────────
   Логіка знята з myFPV (createExplosion, createTracer), але переписана під мапу:
   у грі вибух живе в метрах поруч із камерою, тут — у метрах на мапі, звідки
   на нього дивляться з кілометрів. Тому все параметризовано радіусом у метрах,
   а не «великий/малий», і кожен ефект сам себе прибирає.

   Геометрії й матеріали шаряться між усіма ефектами (пул), тож серія прильотів
   не плодить сотні алокацій.

   Залежність одна: THREE. Сцену дає шар мапи.
   Експорт: window.TerenFX — new TerenFX(scene)
*/
(function(){
'use strict';

/* спільна геометрія: створюється раз на сторінку */
var G = null;
function geo(){
  if(G) return G;
  G = {
    ball:   new THREE.SphereGeometry(1, 12, 10),
    shard:  new THREE.TetrahedronGeometry(1),
    cube:   new THREE.BoxGeometry(1, 1, 1),
    ring:   new THREE.RingGeometry(0.86, 1, 48),
    puff:   new THREE.SphereGeometry(1, 8, 6)
  };
  return G;
}

var MATS = {};
function mat(color, opacity, side){
  var k = color + '|' + opacity + '|' + (side || 0);
  if(!MATS[k]) MATS[k] = new THREE.MeshBasicMaterial({
    color:color, transparent:true, opacity:opacity,
    depthWrite:false, side:side || THREE.FrontSide
  });
  return MATS[k];
}

function lineMat(color, opacity){
  var k = 'L' + color + '|' + opacity;
  if(!MATS[k]) MATS[k] = new THREE.LineBasicMaterial({
    color:color, transparent:true, opacity:opacity, depthWrite:false
  });
  return MATS[k];
}

/* ═══════════════════════════════════════════════════════════════════
   TerenFX — менеджер ефектів однієї сцени
   ═══════════════════════════════════════════════════════════════════ */
function TerenFX(scene, opts){
  this.scene = scene;
  this.o = opts || {};
  this.live = [];            // активні частинки
  this.trails = [];          // шлейфи, прив'язані до об'єктів
  this.cap = this.o.cap || 600;
  geo();
}

/* ─────────────────── ВИБУХ ───────────────────
   at     THREE.Vector3 — точка в сцені (метри)
   r      радіус вогняної кулі в метрах: КАБ ~60, «Іскандер» ~150, Shahed ~35
   opts   {col, shards, smoke, ring, life}                                   */
TerenFX.prototype.boom = function(at, r, opts){
  opts = opts || {};
  r = r || 60;
  var col = opts.col == null ? 0xff5a00 : opts.col;
  var life = opts.life || 1;
  var s = this.scene, L = this.live;
  var room = this.cap - L.length;
  if(room < 12) this.trim(40);

  /* Два спалахи: біле ядро й помаранчева оболонка. На мапі приліт мусить
     читатися, навіть коли на нього глянули через секунду — тому вогонь
     живе довше, ніж у грі, де камера завжди поруч. */
  [[r * 0.55, 0xfff4cc, 0.95, 0.5 * life],
   [r * 1.00, col,      0.60, 0.95 * life]].forEach(function(p){
    var m = new THREE.Mesh(G.ball, mat(p[1], p[2]));
    m.position.copy(at); m.scale.setScalar(p[0] * 0.35);
    s.add(m);
    L.push({m:m, t:0, life:p[3], kind:'flash', r:p[0]});
  });

  /* ударна хвиля: кільце по землі */
  if(opts.ring !== false){
    var ring = new THREE.Mesh(G.ring, mat(0xffffff, 0.7, THREE.DoubleSide));
    ring.position.copy(at); ring.position.y = Math.max(1, at.y * 0.05);
    ring.rotation.x = -Math.PI / 2;
    ring.scale.setScalar(r * 0.3);
    s.add(ring);
    L.push({m:ring, t:0, life:1.5 * life, kind:'ring', r:r * 3.2});
  }

  /* уламки */
  var n = opts.shards == null ? 26 : opts.shards;
  var cols = [col, 0xff2200, 0xffaa00, 0xff6a00, 0xffffff];
  for(var i = 0; i < n; i++){
    if(L.length > this.cap) break;
    var p = new THREE.Mesh(i % 2 ? G.shard : G.cube, mat(cols[i % 5], 1));
    p.position.copy(at);
    p.scale.setScalar(r * 0.035);
    var v = new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.9, Math.random() - 0.5)
      .normalize().multiplyScalar(r * (0.5 + Math.random() * 1.6));
    s.add(p);
    L.push({m:p, v:v, t:0, life:(0.8 + Math.random() * 1.4) * life, kind:'shard', g:r * 1.2});
  }

  /* дим: підіймається й росте */
  var sm = opts.smoke == null ? 9 : opts.smoke;
  for(var j = 0; j < sm; j++){
    if(L.length > this.cap) break;
    var q = new THREE.Mesh(G.puff, mat(0x2a2a28, 0.42));
    q.position.copy(at).add(new THREE.Vector3(
      (Math.random() - 0.5) * r * 0.7, Math.random() * r * 0.3, (Math.random() - 0.5) * r * 0.7));
    q.scale.setScalar(r * (0.18 + Math.random() * 0.3));
    s.add(q);
    L.push({m:q, v:new THREE.Vector3((Math.random() - 0.5) * r * 0.25,
        r * (0.35 + Math.random() * 0.4), (Math.random() - 0.5) * r * 0.25),
      t:0, life:(2.2 + Math.random()) * life, kind:'smoke', grow:r * 0.012});
  }
  return this;
};

/* ─────────────────── ПЕРЕХОПЛЕННЯ ───────────────────
   Збиття виглядає інакше за приліт: коротка біла спалах-квітка без диму
   й без кільця по землі — воно ж у повітрі.                               */
TerenFX.prototype.intercept = function(at, r){
  return this.boom(at, r || 45, {col:0xbfe4ff, shards:14, smoke:0, ring:false, life:0.7});
};

/* ─────────────────── ФАКЕЛ ДВИГУНА ───────────────────
   Повертає об'єкт, який чіпляється до моделі (в її локальні координати).
   pulse(dt) — мерехтіння; сам себе не прибирає, живе з носієм.            */
TerenFX.prototype.flame = function(color, len, rad){
  var g = new THREE.Group();
  /* Ніс моделі дивиться в +Z, отже факел іде строго в −Z і НЕ вилазить
     поперед сопла: ядро й хвіст зміщені назад на свою півдовжину. */
  var core = new THREE.Mesh(G.ball, mat(0xfff4d0, 0.8));
  core.scale.set(rad * 0.62, rad * 0.62, len * 0.22);
  core.position.z = -len * 0.20;

  var tail = new THREE.Mesh(G.ball, mat(color == null ? 0xff9c3c : color, 0.34));
  tail.scale.set(rad * 0.9, rad * 0.9, len * 0.42);
  tail.position.z = -len * 0.46;

  g.add(core); g.add(tail);
  g.userData.pulse = function(t){
    var k = 0.8 + Math.sin(t * 31) * 0.12 + Math.random() * 0.1;
    core.scale.set(rad * 0.62 * k, rad * 0.62 * k, len * 0.22 * k);
    tail.scale.set(rad * 0.9 * k, rad * 0.9 * k, len * 0.42 * k);
    tail.position.z = -len * 0.46 * k;
  };
  return g;
};

/* ─────────────────── ШЛЕЙФ ───────────────────
   Слід за бортом: лінія з точок, що тане з хвоста.
   Оновлюється push(pos) на кожному кадрі руху.                            */
function Trail(scene, color, max, width){
  this.scene = scene;
  this.max = max || 90;
  this.pts = [];
  this.geo = new THREE.BufferGeometry();
  this.pos = new Float32Array(this.max * 3);
  this.alpha = new Float32Array(this.max);
  this.geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
  this.line = new THREE.Line(this.geo, lineMat(color == null ? 0xff6a00 : color, 0.55));
  this.line.frustumCulled = false;
  scene.add(this.line);
  this.width = width || 1;
}
Trail.prototype.push = function(v){
  var p = this.pts;
  if(p.length && p[p.length - 1].distanceToSquared(v) < 1) return;
  p.push(v.clone());
  if(p.length > this.max) p.shift();
  for(var i = 0; i < p.length; i++){
    this.pos[i * 3] = p[i].x; this.pos[i * 3 + 1] = p[i].y; this.pos[i * 3 + 2] = p[i].z;
  }
  this.geo.setDrawRange(0, p.length);
  this.geo.attributes.position.needsUpdate = true;
  this.geo.computeBoundingSphere();
};
Trail.prototype.clear = function(){ this.pts.length = 0; this.geo.setDrawRange(0, 0); };
Trail.prototype.dispose = function(){ this.scene.remove(this.line); this.geo.dispose(); };

TerenFX.prototype.trail = function(color, max, width){
  var t = new Trail(this.scene, color, max, width);
  this.trails.push(t);
  return t;
};

/* ─────────────────── ТРАСЕР ───────────────────
   Коротка світна риска від точки до точки — вогонь ППО, кулемет.          */
TerenFX.prototype.tracer = function(from, to, color, speed){
  var g = new THREE.BufferGeometry();
  var len = from.distanceTo(to);
  var dir = to.clone().sub(from).normalize();
  var seg = Math.min(len * 0.12, 400);
  var arr = new Float32Array(6);
  g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  var line = new THREE.Line(g, lineMat(color == null ? 0xffd166 : color, 0.9));
  line.frustumCulled = false;
  this.scene.add(line);
  this.live.push({m:line, t:0, life:len / (speed || 1400), kind:'tracer',
    from:from.clone(), dir:dir, seg:seg, len:len, sp:speed || 1400, arr:arr, geo:g});
  return this;
};

/* ─────────────────── ПОЗНАЧКА ПРИЛЬОТУ ───────────────────
   Тьмяне кільце, що лишається на місці удару на кілька хвилин.            */
TerenFX.prototype.scar = function(at, r, secs){
  var m = new THREE.Mesh(G.ring, mat(0xff3b30, 0.5, THREE.DoubleSide));
  m.position.copy(at); m.position.y = Math.max(1, at.y);
  m.rotation.x = -Math.PI / 2;
  m.scale.setScalar(r || 120);
  this.scene.add(m);
  this.live.push({m:m, t:0, life:secs || 180, kind:'scar'});
  return this;
};

/* ─────────────────── КАДР ───────────────────
   dt у секундах. Повертає true, поки є що малювати — шар мапи за цим
   вирішує, чи просити наступний кадр.                                     */
TerenFX.prototype.step = function(dt){
  dt = Math.min(0.1, dt || 0.016);
  var L = this.live, s = this.scene;
  for(var i = L.length - 1; i >= 0; i--){
    var p = L[i];
    p.t += dt;
    var f = p.t / p.life;                       // 0..1 прожитого
    if(f >= 1){
      s.remove(p.m);
      if(p.geo) p.geo.dispose();
      L.splice(i, 1);
      continue;
    }
    switch(p.kind){
      case 'flash':
        p.m.scale.setScalar(p.r * (0.35 + f * 0.9));
        p.m.material = mat(p.m.material.color.getHex(), (1 - f) * 0.9);
        break;
      case 'ring':
        p.m.scale.setScalar(p.r * (0.1 + f * 0.9));
        p.m.material = mat(0xffffff, (1 - f) * 0.7, THREE.DoubleSide);
        break;
      case 'shard':
        p.m.position.addScaledVector(p.v, dt);
        p.v.y -= p.g * dt * 2.2;
        p.m.rotation.x += dt * 5; p.m.rotation.z += dt * 4;
        p.m.material = mat(p.m.material.color.getHex(), 1 - f);
        break;
      case 'smoke':
        p.m.position.addScaledVector(p.v, dt);
        p.v.multiplyScalar(0.985);
        p.m.scale.multiplyScalar(1 + p.grow * dt * 22);
        p.m.material = mat(0x2a2a28, (1 - f) * 0.42);
        break;
      case 'tracer':
        var d0 = Math.min(p.len, p.sp * p.t);
        var d1 = Math.max(0, d0 - p.seg);
        p.arr[0] = p.from.x + p.dir.x * d1; p.arr[1] = p.from.y + p.dir.y * d1; p.arr[2] = p.from.z + p.dir.z * d1;
        p.arr[3] = p.from.x + p.dir.x * d0; p.arr[4] = p.from.y + p.dir.y * d0; p.arr[5] = p.from.z + p.dir.z * d0;
        p.geo.attributes.position.needsUpdate = true;
        break;
      case 'scar':
        p.m.material = mat(0xff3b30, 0.5 * (1 - f) * (1 - f), THREE.DoubleSide);
        break;
    }
  }
  return L.length > 0;
};

/* скільки зараз частинок */
TerenFX.prototype.count = function(){ return this.live.length; };

/* м'який кап: прибрати найстаріші, коли серія прильотів забила пул */
TerenFX.prototype.trim = function(n){
  var L = this.live;
  for(var i = 0; i < n && L.length; i++){
    var p = L.shift();
    this.scene.remove(p.m);
    if(p.geo) p.geo.dispose();
  }
};

TerenFX.prototype.clear = function(){
  this.trim(this.live.length);
  this.trails.forEach(function(t){ t.dispose(); });
  this.trails.length = 0;
};

window.TerenFX = TerenFX;
})();
</script>
<script>
/* ТЕРЕН · 3D-ШАР — моделі myFPV на мапі MapLibre
   ────────────────────────────────────────────────────────────────────────────
   Один custom layer з власною сценою THREE поверх мапи. Кожна ціль — модель
   з window.MODELS у справжніх метрах, поставлена в (lon, lat, alt).

   Точність позиції. Меркатор розтягує метр із широтою, тому «один масштаб на
   всю сцену» ставив би ціль під Одесою за кілометри від правди. Тут інакше:
   позиція кожного об'єкта рахується через ЙОГО власну меркаторну координату,
   а вже потім переводиться в одиниці сцени. Лишається тільки різниця в
   РОЗМІРІ моделі (≈2 % на кожні 2° широти) — її гасимо множником cos.

   Порядок осей. У мапи z — вгору, у THREE — y. Сцена повернута на 90° по X,
   тож моделі лишаються такими, якими їх зліпили в myFPV: ніс у +Z, y — вгору.

   Залежності: THREE (r128), maplibregl, models.js, specs.js; fx.js — опційно.
   Експорт: window.TerenLayer
*/
(function(){
'use strict';

var EARTH = 40075016.686;                     // екватор, м


/* ═══════════════════════ ПРОЙДЕНИЙ ШЛЯХ ═══════════════════════
   Слід живе в ГЕОКООРДИНАТАХ і малюється звичайним шаром мапи, а не лінією
   в сцені THREE. Причин дві. По-перше, сцена переїжджає разом із початком
   координат, і сценовий слід на кожному далекому пані перетворювався на
   пряму через пів екрану. По-друге, MapLibre вміє біжучий пунктир, а гола
   THREE.Line — ні: анімований штрих тут доводиться крутити через dasharray.

   Фази взяті ті самі, що й у «мурашках» ТЕРЕНа, щоб слід рухався в одному
   ритмі з рештою анімацій застосунку. */
var ANTS = [[0,4,3],[0.5,4,2.5],[1,4,2],[1.5,4,1.5],[2,4,1],[2.5,4,0.5],[3,4,0],
  [0,0.5,3,3.5],[0,1,3,3],[0,1.5,3,2.5],[0,2,3,2],[0,2.5,3,1.5],[0,3,3,1],[0,3.5,3,0.5]];

function Track(map, opts){
  opts = opts || {};
  this.map = map;
  this.id = opts.id || 'teren-track';
  this.tracks = {};                  // id → {c:[[lon,lat],…], color}
  this.max = opts.max || 160;        // точок на слід
  this.minKm = opts.minKm || 0.2;    // поріг, щоб не плодити точки на місці
  this.phase = 0;
  this.dirty = false;
  this.timer = null;
  this.on = opts.visible !== false;
}

Track.prototype.ensure = function(before){
  var map = this.map, id = this.id;
  if(map.getSource(id)) return;
  map.addSource(id, {type:'geojson', data:{type:'FeatureCollection', features:[]}});
  map.addLayer({id:id + '-line', type:'line', source:id,
    layout:{'line-cap':'round', 'line-join':'round',
      visibility:this.on ? 'visible' : 'none'},
    paint:{
      'line-color':['get','color'],
      'line-width':['interpolate',['linear'],['zoom'], 4, 1.1, 10, 1.8, 15, 2.6],
      'line-opacity':0.42,
      'line-dasharray':[0,4,3]
    }}, before);
};

Track.prototype.push = function(id, ll, color){
  var t = this.tracks[id];
  if(!t){ t = this.tracks[id] = {c:[], color:color || '#ff3b30'}; }
  var c = t.c, last = c[c.length - 1];
  if(last){
    var dx = (ll[0] - last[0]) * Math.cos(ll[1] * Math.PI / 180) * 111.32;
    var dy = (ll[1] - last[1]) * 110.57;
    if(dx * dx + dy * dy < this.minKm * this.minKm) return;
  }
  c.push([ll[0], ll[1]]);
  if(c.length > this.max) c.shift();
  this.dirty = true;
  this.run();
};

Track.prototype.drop = function(id){
  if(!this.tracks[id]) return;
  delete this.tracks[id];
  this.dirty = true;
  this.flush();
};

Track.prototype.clear = function(){
  this.tracks = {};
  this.dirty = true;
  this.flush();
};

Track.prototype.flush = function(){
  var src = this.map.getSource(this.id);
  if(!src) return;
  var f = [];
  for(var k in this.tracks){
    var t = this.tracks[k];
    if(t.c.length < 2) continue;
    f.push({type:'Feature', properties:{color:t.color},
      geometry:{type:'LineString', coordinates:t.c}});
  }
  try { src.setData({type:'FeatureCollection', features:f}); } catch(e){}
  this.dirty = false;
};

/* Один таймер на всі сліди: і зсув пунктиру, і злив накопичених точок.
   setData на кожному русі цілі коштував би дорожче за саму анімацію. */
Track.prototype.run = function(){
  if(this.timer) return;
  var self = this;
  this.timer = setInterval(function(){
    var any = false;
    for(var k in self.tracks){ any = true; break; }
    if(!any){ clearInterval(self.timer); self.timer = null; return; }
    if(self.dirty) self.flush();
    if(document.hidden || !self.on) return;
    self.phase = (self.phase + 1) % ANTS.length;
    try { self.map.setPaintProperty(self.id + '-line', 'line-dasharray', ANTS[self.phase]); }
    catch(e){}
  }, 66);
};

Track.prototype.setVisible = function(v){
  this.on = !!v;
  try { this.map.setLayoutProperty(this.id + '-line', 'visibility', v ? 'visible' : 'none'); }
  catch(e){}
};

/* ═══════════════════════ ШАР ═══════════════════════ */
function TerenLayer(opts){
  opts = opts || {};
  this.id = opts.id || 'teren-3d';
  this.type = 'custom';
  this.renderingMode = '3d';
  this.slot = opts.slot;

  this.map = null;
  this.scene = null;
  this.camera = null;
  this.renderer = null;
  this.fx = null;

  this.items = {};                            // id → {group, lon, lat, alt, ...}
  this.origin = null;                         // {x, y, z, scale, lat}
  this.lastT = 0;
  this.spin = 0;                              // фаза для пропелерів і факелів
  this.visible = opts.visible !== false;
  this.minZoom = opts.minZoom == null ? 3 : opts.minZoom;
  /* Shahed завдовжки 3.5 м на z10 — це соті пікселя. Тому модель тягнеться
     до сталого екранного розміру iconPx, поки зум не підійде настільки, що
     справжні метри вже більші — далі йде чесний масштаб 1:1. */
  this.stretch = opts.stretch !== false;
  this.iconPx = opts.iconPx || 38;
  this.stretchMax = opts.stretchMax || 4000;
  this.onPick = opts.onPick || null;
  this.trailsOn = opts.trails !== false;
  this.o = opts;
  this._z = -1;
}

/* ─────────────── життєвий цикл MapLibre ─────────────── */
TerenLayer.prototype.onAdd = function(map, gl){
  this.map = map;
  this.camera = new THREE.Camera();
  this.scene = new THREE.Scene();
  this.root = new THREE.Group();
  this.scene.add(this.root);

  this.renderer = new THREE.WebGLRenderer({
    canvas: map.getCanvas(), context: gl, antialias: true
  });
  this.renderer.autoClear = false;

  if(window.TerenFX) this.fx = new window.TerenFX(this.root);
  this.track = new Track(map, {visible:this.trailsOn, id:this.id + '-track'});
  this.track.ensure(this.o.before);
  this.setOrigin(map.getCenter());
  this.lastT = performance.now();
};

TerenLayer.prototype.onRemove = function(){
  if(this.fx) this.fx.clear();
  this.root && this.root.clear && this.root.clear();
  this.items = {};
};

/* Початок координат сцени. Тримаємо його біля центру екрана: що ближче
   об'єкти до нього, то менша похибка розміру. Перезадається на moveend. */
TerenLayer.prototype.setOrigin = function(ll){
  var mc = maplibregl.MercatorCoordinate.fromLngLat(ll, 0);
  this.origin = {
    x: mc.x, y: mc.y, z: mc.z,
    scale: mc.meterInMercatorCoordinateUnits(),
    lat: ll.lat != null ? ll.lat : ll[1]
  };
  /* Слід переїзду не боїться — він у геокоординатах на окремому шарі мапи.
     Переставляємо лише те, що справді живе в сцені. */
  for(var k in this.items) this.place(this.items[k]);
};

/* lon/lat/alt → координати сцени (метри від origin) */
TerenLayer.prototype.toScene = function(lon, lat, alt){
  var o = this.origin;
  var mc = maplibregl.MercatorCoordinate.fromLngLat([lon, lat], alt || 0);
  return new THREE.Vector3(
    (mc.x - o.x) / o.scale,
    (mc.z - o.z) / o.scale,            // висота → y сцени
    (mc.y - o.y) / o.scale
  );
};

/* зворотне: сцена → lon/lat */
TerenLayer.prototype.toLngLat = function(v){
  var o = this.origin;
  return new maplibregl.MercatorCoordinate(
    o.x + v.x * o.scale, o.y + v.z * o.scale, o.z + v.y * o.scale
  ).toLngLat();
};

/* ─────────────── об'єкти ───────────────
   add({id, key, lon, lat, alt, hdg, color, scale, plat, meta})
     key   ключ у TERRAIN_SPECS.SPEC (борт) або .PLAT (носій/техніка)
     hdg   курс, °; 0 — на північ
     alt   висота, м; якщо не задано — беремо з профілю польоту (fr)
     fr    частка пройденого шляху 0..1 — для автовисоти                */
TerenLayer.prototype.add = function(d){
  var S = window.TERRAIN_SPECS, M = window.MODELS;
  if(!S || !M) return null;
  var spec = S.SPEC[d.key] || S.PLAT[d.key];
  if(!spec){ return null; }

  var f = M[spec.mdl];
  if(typeof f !== 'function') return null;

  var col = d.color != null ? d.color : hex(spec.col || '#ff3b30');
  var built = OPTS_ARG[spec.mdl] ? f({color: col})
            : spec.mdl === 'car'  ? f(d.body || 'sedan', col)
            : f(col);
  if(!built || !built.group) return null;
  var g = built.group;

  /* модель зроблена в своїх метрах; тягнемо до довжини прототипу */
  var box = new THREE.Box3().setFromObject(g);
  var own = box.getSize(new THREE.Vector3()).z || 1;
  var k = (spec.len || own) / own;
  g.scale.setScalar(k * (d.scale || 1));

  var wrap = new THREE.Group();
  wrap.add(g);
  this.root.add(wrap);

  var it = {
    id: d.id, key: d.key, spec: spec, group: wrap, model: g, parts: built.parts || {},
    lon: d.lon, lat: d.lat, alt: d.alt, fr: d.fr, hdg: d.hdg || 0,
    baseScale: k * (d.scale || 1), meta: d.meta || null,
    trail: null
  };
  it.col = typeof spec.col === 'string' ? spec.col : '#ff3b30';
  it.wantTrail = !!d.trail;
  /* Стійка висоти: тонка вертикаль від точки на землі до самої цілі.
     Без неї ціль на 12 км висоти при нахиленій камері висить казна-де
     відносно свого ґрунтового положення, і мапа бреше про те, ДЕ вона. */
  it.stalk = new THREE.Line(
    new THREE.BufferGeometry().setAttribute('position',
      new THREE.BufferAttribute(new Float32Array(6), 3)),
    new THREE.LineBasicMaterial({color:hex(it.col), transparent:true,
      opacity:0.3, depthWrite:false}));
  it.stalk.frustumCulled = false;
  it.stalk.visible = false;
  this.root.add(it.stalk);
  /* Факел для всього, що з двигуном і летить. Довжина — в ОДИНИЦЯХ МОДЕЛІ
     (вузол сопла всередині неї), тож беремо власний габарит, а не spec.len,
     інакше нормалізація k помножила б факел удруге. */
  if(this.fx && spec.cat && spec.cat !== 'artillery' && built.parts && built.parts.nozzle){
    var fl = this.fx.flame(hex(flameOf(spec)), own * 0.5, own * 0.075);
    built.parts.nozzle.add(fl);
    it.flame = fl;
  }
  this.items[d.id] = it;
  this.place(it);
  this.repaint();
  return it;
};

/* оновити позицію/курс наявного об'єкта */
TerenLayer.prototype.move = function(id, d){
  var it = this.items[id];
  if(!it) return null;
  if(d.lon != null) it.lon = d.lon;
  if(d.lat != null) it.lat = d.lat;
  if(d.alt != null) it.alt = d.alt;
  if(d.fr != null) it.fr = d.fr;
  if(d.hdg != null) it.hdg = d.hdg;
  this.place(it);
  this.repaint();
  return it;
};

TerenLayer.prototype.remove = function(id){
  var it = this.items[id];
  if(!it) return;
  if(this.track) this.track.drop(id);
  if(it.stalk){ this.root.remove(it.stalk); it.stalk.geometry.dispose(); }
  this.root.remove(it.group);
  delete this.items[id];
  this.repaint();
};

TerenLayer.prototype.clear = function(){
  for(var k in this.items) this.remove(k);
  if(this.track) this.track.clear();
};

/* поставити об'єкт у сцену за його lon/lat/alt/курсом */
TerenLayer.prototype.place = function(it){
  var S = window.TERRAIN_SPECS;
  /* Висота: спершу та, що прийшла з фіду (це справжні дані), і лише якщо її
     немає — крейсерська з профілю типу. Здогад ніколи не перекриває факт. */
  var alt = it.alt;
  if(alt == null && it.fr != null && S) alt = S.altAt(it.spec, it.fr);
  if(alt == null) alt = 0;
  it.altShown = alt;
  var v = this.toScene(it.lon, it.lat, alt);
  it.group.position.copy(v);
  /* курс: 0° — північ (−z у сцені), далі за годинниковою */
  it.group.rotation.set(0, -it.hdg * Math.PI / 180, 0);
  /* компенсація меркатора за широтою: метр там ≠ метр в origin */
  var corr = Math.cos(this.origin.lat * Math.PI / 180) /
             Math.cos(it.lat * Math.PI / 180);
  it.corr = corr;
  it.model.scale.setScalar(it.baseScale * corr * this.stretchFor(it.spec.len));

  /* стійка: від землі під ціллю до самої цілі */
  if(it.stalk){
    if(alt > 150){
      var g = this.toScene(it.lon, it.lat, 0);
      var a = it.stalk.geometry.attributes.position.array;
      a[0] = g.x; a[1] = g.y; a[2] = g.z;
      a[3] = v.x; a[4] = v.y; a[5] = v.z;
      it.stalk.geometry.attributes.position.needsUpdate = true;
      it.stalk.geometry.computeBoundingSphere();
      it.stalk.visible = true;
    } else it.stalk.visible = false;
  }

  if(it.wantTrail && this.track) this.track.push(it.id, [it.lon, it.lat], it.col);
};

/* метрів на піксель у центрі екрана (тайли 512 px) */
TerenLayer.prototype.mPerPx = function(){
  if(!this.map) return 1;
  var lat = this.map.getCenter().lat;
  return 78271.517 * Math.cos(lat * Math.PI / 180) / Math.pow(2, this.map.getZoom());
};

/* Множник розміру для моделі завдовжки len метрів: тягнемо до iconPx пікселів,
   але ніколи не зменшуємо нижче справжніх метрів — щойно зум підійшов
   достатньо близько, борт стає рівно таким, який він є. */
TerenLayer.prototype.stretchFor = function(len){
  if(!this.stretch || !this.map || !len) return 1;
  var want = this.iconPx * this.mPerPx() / len;
  return Math.max(1, Math.min(this.stretchMax, want));
};

/* перерахувати розміри після зміни зуму */
TerenLayer.prototype.restretch = function(){
  for(var k in this.items){
    var it = this.items[k];
    it.model.scale.setScalar(it.baseScale * (it.corr || 1) * this.stretchFor(it.spec.len));
  }
};

/* ─────────────── ефекти ─────────────── */

/* Радіус ефекту в метрах сцени. Вибух у 90 м на z8 — менш ніж піксель, тому
   тримаємо нижню межу в пікселях; щойно справжні метри більші — беремо їх. */
TerenLayer.prototype.fxR = function(r, minPx){
  return Math.max(r, (minPx || 26) * this.mPerPx());
};

/* приліт у точку: вогняна куля + слід на землі */
TerenLayer.prototype.boom = function(lon, lat, r, opts){
  if(!this.fx) return;
  var v = this.toScene(lon, lat, (opts && opts.alt) || 0);
  var R = this.fxR(r || 80, 26);
  this.fx.boom(v, R, opts);
  if(!opts || opts.scar !== false) this.fx.scar(v, R * 1.6, 120);
  this.repaint();
};

/* збиття в повітрі */
TerenLayer.prototype.intercept = function(lon, lat, alt, r){
  if(!this.fx) return;
  this.fx.intercept(this.toScene(lon, lat, alt || 0), this.fxR(r || 45, 18));
  this.repaint();
};

/* черга ППО: від позиції до цілі */
TerenLayer.prototype.tracer = function(from, to, color){
  if(!this.fx) return;
  var a = this.toScene(from[0], from[1], from[2] || 0);
  var b = this.toScene(to[0], to[1], to[2] || 0);
  this.fx.tracer(a, b, color, Math.max(1400, a.distanceTo(b) / 1.1));
  this.repaint();
};

/* ─────────────── малювання ─────────────── */
TerenLayer.prototype.render = function(gl, args){
  if(!this.visible) return;
  var map = this.map;
  if(map.getZoom() < this.minZoom) return;

  var now = performance.now();
  var dt = Math.min(0.1, (now - this.lastT) / 1000);
  this.lastT = now;
  this.spin += dt;

  /* зум поїхав — перетягуємо моделі до екранного розміру */
  var z = map.getZoom();
  if(Math.abs(z - this._z) > 0.01){ this._z = z; this.restretch(); }

  /* анімовані частини: пропелери, ротори, факели */
  var busy = false;
  for(var k in this.items){
    var it = this.items[k];
    var p = it.parts;
    if(p && p.props) { p.props.forEach(function(pr){ pr.rotation.z += dt * 46; }); busy = true; }
    if(p && p.rotors){ p.rotors.forEach(function(r){
      r.rotation.y += dt * 24 * (r.userData && r.userData.dir ? r.userData.dir : 1); }); busy = true; }
    if(p && p.tail)  { p.tail.rotation.x += dt * 30; busy = true; }
    if(it.flame && it.flame.userData.pulse){ it.flame.userData.pulse(this.spin); busy = true; }
  }
  if(this.fx && this.fx.step(dt)) busy = true;

  /* камера: проєкція мапи × перенос у початок сцени × поворот осей */
  var o = this.origin;
  var m = new THREE.Matrix4().fromArray(
    args && args.defaultProjectionData ? args.defaultProjectionData.mainMatrix : args);
  var t = new THREE.Matrix4()
    .makeTranslation(o.x, o.y, o.z)
    .multiply(new THREE.Matrix4().makeScale(o.scale, -o.scale, o.scale))
    .multiply(new THREE.Matrix4().makeRotationX(Math.PI / 2));
  this.camera.projectionMatrix = m.multiply(t);

  this.renderer.resetState();
  this.renderer.render(this.scene, this.camera);
  if(busy) map.triggerRepaint();
};

TerenLayer.prototype.repaint = function(){
  if(this.map) this.map.triggerRepaint();
};

TerenLayer.prototype.setVisible = function(v){
  this.visible = !!v;
  if(this.track) this.track.setVisible(!!v && this.trailsOn);
  this.repaint();
};

/* слід окремим тумблером від самих моделей */
TerenLayer.prototype.setTrails = function(v){
  this.trailsOn = !!v;
  if(this.track) this.track.setVisible(this.visible && this.trailsOn);
};

/* ═══════════════════════ ПІДКЛЮЧЕННЯ ═══════════════════════
   TerenLayer.attach(map, opts) — створює шар, чіпляє на мапу й
   перезадає початок координат, коли камера поїхала далеко.       */
TerenLayer.attach = function(map, opts){
  var L = new TerenLayer(opts);
  function add(){
    if(!map.getLayer(L.id)) map.addLayer(L);
  }
  if(map.isStyleLoaded()) add(); else map.once('load', add);

  map.on('moveend', function(){
    if(!L.origin) return;
    var c = map.getCenter();
    var d = Math.abs(c.lat - L.origin.lat);
    if(d > 1.2) L.setOrigin(c);        // > ~130 км по широті — переставляємо
  });
  return L;
};

/* ═══════════════════════ NEPTUN → МАПА ═══════════════════════
   Міст між стрічкою цілей і шаром: що з'явилось — додається, що зникло —
   прибирається, решта пересувається числення шляху між оновленнями.      */
TerenLayer.prototype.bindNeptun = function(feed, opts){
  opts = opts || {};
  var self = this, S = window.TERRAIN_SPECS, N = window.TerenNeptun;
  var seen = {}, src = {};
  var raf = null, last = null, fcTimer = null;

  function apply(pack){
    var objs = (pack.threats && pack.threats.objs) || [];
    var live = {};

    /* тривоги по областях ідуть із того самого опитування: окремий поллінг
       тільки дублював би запити й розсинхронізовував рівень із цілями */
    if(opts.alertsLayer && opts.alertsLayer.ready){
      opts.alertsLayer.update((pack.alerts && pack.alerts.oblasts) || [], objs,
        (pack.alerts && pack.alerts.raions) || {});
    }
    objs.forEach(function(t){
      if(opts.filter && !opts.filter(t)) return;
      live[t.id] = 1;
      src[t.id] = t;
      var info = S.forThreat(t);
      if(!seen[t.id]){
        /* alt із фіду, якщо він її колись дасть; доти fr=0.5 ставить ціль
           на крейсерську висоту її типу — це здогад, і він підписаний. */
        self.add({id:t.id, key:info.key, lon:t.lon, lat:t.lat,
          alt:t.alt != null ? t.alt : null, fr:t.alt != null ? null : 0.5,
          hdg:t.hdg, trail:opts.trails !== false, meta:t});
        seen[t.id] = 1;
      }
    });
    Object.keys(seen).forEach(function(id){
      if(live[id]) return;
      /* ціль зникла зі стрічки: втрачена або дійшла — прибираємо */
      if(opts.onLost) opts.onLost(src[id]);
      self.remove(id); delete seen[id]; delete src[id];
    });
    if(opts.onData) opts.onData(pack);
    tick();
  }

  /* між оновленнями фіду тягнемо цілі самі */
  function tick(){
    if(raf) cancelAnimationFrame(raf);
    var now = Date.now();
    Object.keys(seen).forEach(function(id){
      var t = src[id]; if(!t) return;
      var p = N.posAt(t, now);
      self.move(id, {lon:p[0], lat:p[1], hdg:t.hdg,
        alt:t.alt != null ? t.alt : undefined});
    });
    raf = requestAnimationFrame(tick);
  }

  var poll = N.start({
    everyS: opts.everyS || 30,
    alerts: opts.alerts !== false,
    onData: function(p){ last = p; apply(p); },
    onError: opts.onError || function(){}
  });

  /* Цілі рухаються між оновленнями фіду, отже коридор прогнозу застаріває
     швидше за самі дані. Перераховуємо його окремо й рідше за кадри:
     point-in-polygon по 27 полігонах — не те, що варто робити 60 разів
     на секунду. */
  if(opts.alertsLayer){
    fcTimer = setInterval(function(){
      if(!last || !opts.alertsLayer.ready) return;
      var objs = Object.keys(src).map(function(k){ return src[k]; });
      opts.alertsLayer.update((last.alerts && last.alerts.oblasts) || [], objs,
        (last.alerts && last.alerts.raions) || {});
    }, (opts.forecastEveryS || 15) * 1000);
  }

  return {
    stop:function(){
      poll.stop();
      if(raf) cancelAnimationFrame(raf);
      if(fcTimer) clearInterval(fcTimer);
      if(opts.alertsLayer) opts.alertsLayer.reset();
      self.clear();
    },
    now:poll.now,
    targets:function(){ return src; },
    pack:function(){ return last; }
  };
};

/* ─────────────── дрібниці ─────────────── */

/* Фабрики в MODELS двох форм: одні беруть об'єкт опцій, інші голий колір.
   Вгадувати по f.length ненадійно — тримаємо явний перелік. */
var OPTS_ARG = {
  quad:1, wing:1, pylon:1,
  su34:1, su35:1, mig31:1, mi8:1, mi24:1, ka52:1
};

function hex(c){
  if(typeof c === 'number') return c;
  return parseInt(String(c).replace('#', ''), 16);
}
/* колір факела за категорією: гіперзвук світить блакитним плазмовим */
function flameOf(spec){
  if(spec.cat === 'hyper') return 0xbfe4ff;
  if(spec.cat === 'ballistic') return 0xfff0a8;
  if(spec.cat === 'drone') return 0xffb347;
  return 0xff9c3c;
}

window.TerenLayer = TerenLayer;
window.TerenLayer.Track = Track;
})();
</script>
<script>
/* ТЕРЕН · ТРИВОГИ — підсвітка областей у реальному часі
   ────────────────────────────────────────────────────────────────────────────
   Механіка з delta⁹ (oblast-alert-fill / clear-fill / line + feature-state),
   доповнена рівнями загрози з постанови КМУ №1092 від 4 вересня 2026.

   ⚠ Звідки береться рівень. NEPTUN /api/v1/alerts НЕ віддає жовтий/червоний —
     там лише перелік областей і районів із полем since, а відбій це зникнення
     запису зі списку. Тому рівень ми ВИВОДИМО самі, з типів цілей над областю:

       тільки uav / recon                   → жовтий   (загроза БпЛА)
       missile / ballistic / kab / mig31k    → червоний (ракетна небезпека)
       офіційна тривога, цілей не видно      → жовтий, помічений як «не визначено»
       накрито лише окремі райони            → приглушена заливка, «частково»

     Це наша оцінка, не офіційний статус, і картка області це прямо каже.
     Офіційний рівень у машинному вигляді дає лише alerts.in.ua — з токеном
     і через власний проксі (CORS немає). Коли такий проксі з'явиться,
     сюди досить дописати setOfficial(map) і він перекриє оцінку.

   ⚠ Відбій. Окрему сирену відбою постановою скасовано, тож «відбій» тут —
     це зникнення області зі списку: зелений спалах по полігону й рядок у
     журналі. Іншого сигналу не буде, і вигадувати його не можна.

   Геометрія: geoBoundaries UKR ADM1 (27 полігонів). Назви там англійські,
   тож українські імена з фіду зводяться до полігонів не по рядку, а
   point-in-polygon по відомих центроїдах — рядкове зіставлення тут ламке.

   Експорт: window.TerenAlerts
*/
(function(){
'use strict';

var GEO_URL = 'https://media.githubusercontent.com/media/wmgeolab/geoBoundaries' +
  '/9469f09/releaseData/gbOpen/UKR/ADM1/geoBoundaries-UKR-ADM1_simplified.geojson';

/* Центроїди областей з відомими українськими назвами. Кожен падає всередину
   рівно одного полігона ADM1 — так і будується мапінг укр ↔ shapeName. */
var OBLASTS = [
  {n:'Хмельницька',       ll:[26.99, 49.42]}, {n:'Вінницька',        ll:[28.47, 49.23]},
  {n:'Рівненська',        ll:[26.25, 50.62]}, {n:'Волинська',        ll:[25.33, 50.75]},
  {n:'Дніпропетровська',  ll:[35.05, 48.46]}, {n:'Житомирська',      ll:[28.66, 50.25]},
  {n:'Закарпатська',      ll:[22.29, 48.62]}, {n:'Запорізька',       ll:[35.14, 47.84]},
  {n:'Івано-Франківська', ll:[24.71, 48.92]}, {n:'Київська',         ll:[30.05, 50.05]},
  {n:'Кіровоградська',    ll:[32.26, 48.51]}, {n:'Луганська',        ll:[39.31, 48.57]},
  {n:'Миколаївська',      ll:[31.99, 46.98]}, {n:'Одеська',          ll:[30.72, 46.48]},
  {n:'Полтавська',        ll:[34.55, 49.59]}, {n:'Сумська',          ll:[34.80, 50.91]},
  {n:'Тернопільська',     ll:[25.59, 49.55]}, {n:'Харківська',       ll:[36.23, 49.99]},
  {n:'Херсонська',        ll:[32.62, 46.64]}, {n:'Черкаська',        ll:[32.06, 49.44]},
  {n:'Чернігівська',      ll:[31.29, 51.50]}, {n:'Чернівецька',      ll:[25.94, 48.29]},
  {n:'Львівська',         ll:[24.03, 49.84]}, {n:'Донецька',         ll:[37.80, 48.02]},
  {n:'АР Крим',           ll:[34.10, 44.95]}, {n:'Севастополь',      ll:[33.53, 44.60]},
  {n:'Київ',              ll:[30.52, 50.45]}
];

/* тип цілі з NEPTUN → який рівень він тягне за собою */
var RED  = {missile:1, ballistic:1, kab:1, mig31k:1};
var AMBER = {uav:1, recon:1, unknown:1};

var LVL_UK = {1:'жовтий · загроза БпЛА', 2:'червоний · ракетна небезпека'};
var LVL_COL = {1:'#ffb02e', 2:'#ff3b30'};

/* ═══════════════════════ геометрія ═══════════════════════ */

function ringHas(pt, ring){
  var x = pt[0], y = pt[1], inside = false;
  for(var i = 0, j = ring.length - 1; i < ring.length; j = i++){
    var xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if(((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function ringsHave(pt, rings){
  if(!rings || !rings.length) return false;
  var inside = ringHas(pt, rings[0]);
  for(var i = 1; i < rings.length; i++) if(ringHas(pt, rings[i])) inside = !inside;  // діри
  return inside;
}
function geomHas(pt, g){
  if(!g) return false;
  var polys = g.type === 'Polygon' ? [g.coordinates]
            : g.type === 'MultiPolygon' ? g.coordinates : [];
  for(var i = 0; i < polys.length; i++) if(ringsHave(pt, polys[i])) return true;
  return false;
}
function bboxOf(g){
  var b = [180, 90, -180, -90];
  var polys = g.type === 'Polygon' ? [g.coordinates]
            : g.type === 'MultiPolygon' ? g.coordinates : [];
  polys.forEach(function(rings){
    rings.forEach(function(r){
      r.forEach(function(p){
        if(p[0] < b[0]) b[0] = p[0]; if(p[1] < b[1]) b[1] = p[1];
        if(p[0] > b[2]) b[2] = p[0]; if(p[1] > b[3]) b[3] = p[1];
      });
    });
  });
  return b;
}

/* ═══════════════════════ КОНТРОЛЕР ═══════════════════════ */

function Alerts(map, opts){
  opts = opts || {};
  this.map = map;
  this.o = opts;
  this.srcId = opts.srcId || 'ua-oblasts';
  this.url = opts.url || GEO_URL;
  this.geo = null;
  this.feats = [];                 // [{name, shape, geom, bbox}]
  this.byName = {};                // укр назва → shapeName
  this.state = {};                 // укр назва → {lvl, since, by, kinds}
  this.part = {};                  // укр назва → {lvl, raions[]} — накрито лише районами
  this.clearing = {};              // укр назва → час початку зеленого спалаху
  this.raf = null;
  this.ready = false;
  this.visible = opts.visible !== false;
  this.forecastMin = opts.forecastMin == null ? 10 : opts.forecastMin;
  this.onChange = opts.onChange || null;
  this.log = [];                   // журнал: {t, name, lvl, kind:'on'|'off'|'up'}
}

Alerts.prototype.load = function(){
  var self = this;
  if(this._loading) return this._loading;
  this._loading = fetch(this.url, {cache:'force-cache'})
    .then(function(r){ if(!r.ok) throw new Error('geoBoundaries ' + r.status); return r.json(); })
    .then(function(gj){ self.apply(gj); return self; });
  return this._loading;
};

/* прийняти геометрію, звести назви, поставити шари */
Alerts.prototype.apply = function(gj){
  var self = this;
  this.geo = gj;
  this.feats = (gj.features || []).map(function(f){
    return {shape:(f.properties && f.properties.shapeName) || '', geom:f.geometry,
      bbox:bboxOf(f.geometry), name:null};
  });

  /* мапінг укр ↔ shapeName по центроїдах, не по рядку */
  var miss = [];
  OBLASTS.forEach(function(o){
    var hit = null;
    for(var i = 0; i < self.feats.length; i++){
      var f = self.feats[i], b = f.bbox;
      if(o.ll[0] < b[0] || o.ll[0] > b[2] || o.ll[1] < b[1] || o.ll[1] > b[3]) continue;
      if(geomHas(o.ll, f.geom)){ hit = f; break; }
    }
    if(hit){ hit.name = o.n; self.byName[o.n] = hit.shape; }
    else miss.push(o.n);
  });
  this.unmapped = miss;

  this.addLayers();
  this.ready = true;
  return miss;
};

Alerts.prototype.addLayers = function(){
  var map = this.map, id = this.srcId;
  if(map.getSource(id)) return;
  map.addSource(id, {type:'geojson', data:this.geo, promoteId:'shapeName'});

  var vis = this.visible ? 'visible' : 'none';
  var before = this.o.before;

  /* прогноз: куди ціль тільки входить. Окремий шар і слабша заливка —
     щоб на око не плутати з оголошеною тривогою. */
  map.addLayer({id:id + '-fc-fill', type:'fill', source:id, layout:{visibility:vis},
    paint:{
      'fill-color':['case',
        ['==', ['feature-state','fc'], 2], LVL_COL[2],
        ['==', ['feature-state','fc'], 1], LVL_COL[1], 'rgba(0,0,0,0)'],
      'fill-opacity':['case', ['>', ['coalesce',['feature-state','fc'],0], 0], 0.07, 0]
    }}, before);

  /* Три ступені насиченості, і це не косметика: залита на повну область
     означає «тривога в усій області», приглушена — «накрито лише окремі
     райони». Малювати їх однаково = брехати про масштаб. */
  map.addLayer({id:id + '-fill', type:'fill', source:id, layout:{visibility:vis},
    paint:{
      'fill-color':['case',
        ['==', ['feature-state','lvl'], 2], LVL_COL[2],
        ['==', ['feature-state','lvl'], 1], LVL_COL[1],
        ['==', ['feature-state','part'], 2], LVL_COL[2],
        ['==', ['feature-state','part'], 1], LVL_COL[1], 'rgba(0,0,0,0)'],
      'fill-opacity':['case',
        ['==', ['feature-state','lvl'], 2], 0.22,
        ['==', ['feature-state','lvl'], 1], 0.17,
        ['>', ['coalesce',['feature-state','part'],0], 0], 0.07, 0]
    }}, before);

  /* відбій: зелений спалах, що згасає */
  map.addLayer({id:id + '-clear', type:'fill', source:id, layout:{visibility:vis},
    paint:{'fill-color':'#3fe08a',
      'fill-opacity':['coalesce', ['feature-state','clr'], 0]}}, before);

  map.addLayer({id:id + '-line', type:'line', source:id, layout:{visibility:vis},
    paint:{
      'line-color':['case',
        ['==', ['feature-state','lvl'], 2], LVL_COL[2],
        ['==', ['feature-state','lvl'], 1], LVL_COL[1],
        ['==', ['feature-state','part'], 2], LVL_COL[2],
        ['==', ['feature-state','part'], 1], LVL_COL[1],
        ['>', ['coalesce',['feature-state','fc'],0], 0], '#6d7f76', '#44554d'],
      'line-width':['case',
        ['>', ['coalesce',['feature-state','lvl'],0], 0], 1.8,
        ['>', ['coalesce',['feature-state','part'],0], 0], 0.9, 0.5],
      /* line-dasharray не приймає feature-state — вираз тут мовчки відкидає
         ВЕСЬ шар, і контуру просто немає. Тому пунктир не чіпаємо, а
         прогноз від оголошеної тривоги відрізняємо товщиною й прозорістю. */
      'line-opacity':['case',
        ['>', ['coalesce',['feature-state','lvl'],0], 0], 0.9,
        ['>', ['coalesce',['feature-state','part'],0], 0], 0.5,
        ['>', ['coalesce',['feature-state','fc'],0], 0], 0.45, 0.16]
    }}, before);
};

/* ─────────────── яка це область ─────────────── */
Alerts.prototype.oblastOf = function(ll){
  for(var i = 0; i < this.feats.length; i++){
    var f = this.feats[i], b = f.bbox;
    if(ll[0] < b[0] || ll[0] > b[2] || ll[1] < b[1] || ll[1] > b[3]) continue;
    if(geomHas(ll, f.geom)) return f.name || f.shape;
  }
  return null;
};

/* ─────────────── головне: звести стан ───────────────
   alertNames  офіційний перелік областей із NEPTUN /alerts
   targets     активні цілі (нормалізовані записи фіду)                    */
Alerts.prototype.update = function(alertNames, targets, raionsBy){
  if(!this.ready) return;
  var self = this, N = window.TerenNeptun;
  var now = Date.now();
  var next = {}, part = {};

  /* 1. тривога в УСІЙ області — рівень поки невідомий */
  (alertNames || []).forEach(function(n){
    if(!self.byName[n]) return;
    next[n] = {lvl:1, by:'alert', kinds:{}, est:true};
  });

  /* 1б. накрито лише окремі райони. Геометрія в нас по областях, тож
     показуємо це приглушеною заливкою й підписом «частково», а не
     повноцінною тривогою: інакше одна Одещина світилась би так само,
     як накрита цілком Харківщина. */
  var rb = raionsBy || {};
  Object.keys(rb).forEach(function(n){
    if(!self.byName[n] || next[n]) return;
    part[n] = {lvl:1, raions:rb[n] || []};
  });

  /* 2. цілі: піднімають рівень там, де вони зараз */
  var fc = {};
  (targets || []).forEach(function(t){
    if(!t || t.status !== 'active') return;
    var ll;
    try { ll = N && N.posAt ? N.posAt(t, now) : [t.lon, t.lat]; } catch(e){ ll = [t.lon, t.lat]; }
    if(!isFinite(ll[0]) || !isFinite(ll[1])) ll = [t.lon, t.lat];

    var sub = t.subkind || 'unknown';
    var lvl = RED[sub] ? 2 : AMBER[sub] ? 1 : 1;

    var nm = self.oblastOf(ll);
    if(nm && self.byName[nm]){
      /* ціль фізично над областю — це вже не «частково десь у районах» */
      if(part[nm]) delete part[nm];
      var e = next[nm] || (next[nm] = {lvl:0, by:'target', kinds:{}, est:true});
      if(lvl > e.lvl){ e.lvl = lvl; }
      e.by = 'target'; e.est = false;          // ціль видно — рівень уже не здогад
      e.kinds[sub] = (e.kinds[sub] || 0) + (t.amount || 1);
    }

    /* 3. коридор прогнозу: куди ціль увійде за forecastMin хвилин */
    if(!self.forecastMin || !N || !N.dest) return;
    var km = Math.max(20, (t.speed || 300) * (self.forecastMin / 60));
    for(var f = 0.34; f <= 1.001; f += 0.33){
      var p;
      try { p = N.dest(ll[0], ll[1], t.hdg || 0, km * f); } catch(e2){ continue; }
      var n2 = self.oblastOf(p);
      if(!n2 || !self.byName[n2]) continue;
      var e2 = next[n2];
      if(!e2){ fc[n2] = Math.max(fc[n2] || 0, lvl); continue; }
      /* Область уже під тривогою, але рівень ніхто не оголошував, а сюди
         за 10 хв заходить щось важче — піднімаємо. Саме так Київ стає
         червоним, коли КР ще над Київською: чекати, поки вона долетить
         до межі міста, і показувати доти жовтий — гірше за помилку. */
      if(e2.est && lvl > e2.lvl){ e2.lvl = lvl; e2.by = 'forecast'; }
    }
  });

  this.commit(next, fc, part, now);
};

/* застосувати різницю до мапи й журналу */
Alerts.prototype.commit = function(next, fc, part, now){
  var self = this, map = this.map, id = this.srcId;
  var prev = this.state;
  var changed = false;

  function fs(nm, st){
    var sid = self.byName[nm];
    if(!sid) return;
    try { map.setFeatureState({source:id, id:sid}, st); } catch(e){}
  }

  /* нові й змінені */
  Object.keys(next).forEach(function(nm){
    var n = next[nm], p = prev[nm];
    n.since = p ? p.since : now;
    if(!p){
      fs(nm, {lvl:n.lvl, clr:0, fc:0, part:0});
      self.push('on', nm, n.lvl);
      changed = true;
    } else if(p.lvl !== n.lvl){
      fs(nm, {lvl:n.lvl});
      self.push(n.lvl > p.lvl ? 'up' : 'down', nm, n.lvl);
      changed = true;
    }
  });

  /* відбій: зникло зі списку */
  Object.keys(prev).forEach(function(nm){
    if(next[nm]) return;
    fs(nm, {lvl:0});
    self.startClear(nm);
    self.push('off', nm, 0);
    changed = true;
  });

  /* часткові: тихо, без журналу — район під тривогою це не подія масштабу
     області, і засмічувати нею стрічку подій означало б її знецінити */
  var pp = this.part || {};
  Object.keys(part).forEach(function(nm){
    if(!pp[nm] || pp[nm].lvl !== part[nm].lvl) fs(nm, {part:part[nm].lvl});
    part[nm].since = pp[nm] ? pp[nm].since : now;
  });
  Object.keys(pp).forEach(function(nm){ if(!part[nm]) fs(nm, {part:0}); });
  this.part = part;

  /* прогнозний коридор */
  var pf = this._fc || {};
  Object.keys(fc).forEach(function(nm){ if(pf[nm] !== fc[nm]) fs(nm, {fc:fc[nm]}); });
  Object.keys(pf).forEach(function(nm){ if(!fc[nm]) fs(nm, {fc:0}); });
  this._fc = fc;

  this.state = next;
  if(changed && this.onChange) this.onChange(this.list(), this.log);
};

/* журнал подій — у ТЕРЕНі його видно в ЖУРНАЛІ */
Alerts.prototype.push = function(kind, name, lvl){
  this.log.unshift({t:Date.now(), name:name, lvl:lvl, kind:kind});
  if(this.log.length > 200) this.log.length = 200;
};

/* ─────────────── зелений спалах відбою ───────────────
   Окремої сирени відбою більше немає, тож спалах по полігону плюс рядок
   у журналі — це і є весь сигнал. Півтори секунди, далі згасає. */
Alerts.prototype.startClear = function(nm){
  this.clearing[nm] = performance.now();
  /* ставимо пік одразу, не чекаючи першого rAF — інакше між зняттям
     тривоги й початком згасання проскакує темний кадр */
  try { this.map.setFeatureState({source:this.srcId, id:this.byName[nm]}, {clr:0.32}); } catch(e){}
  if(!this.raf) this.tickClear();
};

Alerts.prototype.tickClear = function(){
  var self = this, map = this.map, id = this.srcId;
  var names = Object.keys(this.clearing);
  if(!names.length){ this.raf = null; return; }
  var now = performance.now();
  names.forEach(function(nm){
    var a = 0.32 * (1 - (now - self.clearing[nm]) / 1500);
    var sid = self.byName[nm];
    try {
      if(a <= 0){ map.setFeatureState({source:id, id:sid}, {clr:0}); delete self.clearing[nm]; }
      else map.setFeatureState({source:id, id:sid}, {clr:a});
    } catch(e){ delete self.clearing[nm]; }
  });
  this.raf = requestAnimationFrame(function(){ self.tickClear(); });
};

/* ─────────────── для панелі ─────────────── */

/* активні тривоги, найсвіжіші зверху */
Alerts.prototype.list = function(){
  var s = this.state, p = this.part || {}, out = [];
  for(var nm in s){
    var e = s[nm];
    out.push({
      name:nm, lvl:e.lvl, level:LVL_UK[e.lvl] || '—', col:LVL_COL[e.lvl] || '#7d8f87',
      since:e.since, mins:Math.round((Date.now() - e.since) / 60000),
      by:e.by, est:e.est, partial:false,
      kinds:Object.keys(e.kinds || {}).map(function(k){
        return {type:k, n:e.kinds[k],
          uk:(window.TERRAIN_SPECS && window.TERRAIN_SPECS.NEPTUN_TITLE[k]) || k};
      })
    });
  }
  for(var nm2 in p){
    var q = p[nm2], n = (q.raions || []).length;
    out.push({
      name:nm2, lvl:q.lvl, level:'частково · ' + n + (n === 1 ? ' район' : ' р-нів'),
      col:LVL_COL[q.lvl] || '#7d8f87',
      since:q.since || Date.now(), mins:Math.round((Date.now() - (q.since || Date.now())) / 60000),
      by:'raion', est:true, partial:true, raions:q.raions || [], kinds:[]
    });
  }
  /* повні тривоги завжди вище часткових: вони про більшу територію */
  out.sort(function(a, b){
    return (a.partial - b.partial) || (b.lvl - a.lvl) || (b.since - a.since); });
  return out;
};

/* картка області для панелі — з чесним підписом, звідки взявся рівень */
Alerts.prototype.card = function(nm){
  var e = this.state[nm];
  if(!e){
    var q = (this.part || {})[nm];
    if(q){
      var names = (q.raions || []).map(function(r){ return r.name; }).filter(Boolean);
      return {title:nm, lvl:q.lvl, col:LVL_COL[q.lvl], rows:[
        ['Стан', 'тривога не в усій області'],
        ['Райони', names.length ? names.join(', ') : (q.raions || []).length + ' р-нів'],
        ['Джерело', 'NEPTUN дає перелік районів; рівень по них не оголошено']
      ]};
    }
    return {title:nm, lvl:0, rows:[['Стан', 'тривоги немає']]};
  }
  var rows = [
    ['Рівень', LVL_UK[e.lvl]],
    ['Триває', e.mins != null ? e.mins + ' хв' : Math.round((Date.now() - e.since) / 60000) + ' хв']
  ];
  var ks = Object.keys(e.kinds || {});
  if(ks.length){
    rows.push(['Над областю', ks.map(function(k){
      var uk = (window.TERRAIN_SPECS && window.TERRAIN_SPECS.NEPTUN_TITLE[k]) || k;
      return uk + ' ×' + e.kinds[k];
    }).join(', ')]);
  }
  rows.push(['Джерело',
    e.by === 'forecast' ? 'офіційна тривога NEPTUN; рівень підвищено за прогнозом підходу цілі (оцінка)'
    : e.est ? 'офіційна тривога NEPTUN; рівень не оголошено — показано мінімальний'
    : 'рівень визначено за типами цілей над областю (оцінка, не офіційний статус)']);
  return {title:nm, lvl:e.lvl, col:LVL_COL[e.lvl], rows:rows};
};

Alerts.prototype.setVisible = function(v){
  this.visible = !!v;
  var map = this.map, id = this.srcId;
  [id + '-fc-fill', id + '-fill', id + '-clear', id + '-line'].forEach(function(l){
    try { map.setLayoutProperty(l, 'visibility', v ? 'visible' : 'none'); } catch(e){}
  });
};

/* усе погасити (наприклад, коли фід вимкнули) */
Alerts.prototype.reset = function(){
  this.commit({}, {}, {}, Date.now());
};

/* ═══════════════════════ ПІДКЛЮЧЕННЯ ═══════════════════════ */
function attach(map, opts){
  var a = new Alerts(map, opts);
  function go(){ a.load().catch(function(e){ if(opts && opts.onError) opts.onError(e); }); }
  if(map.isStyleLoaded()) go(); else map.once('load', go);
  return a;
}

window.TerenAlerts = {
  attach:attach, Alerts:Alerts, OBLASTS:OBLASTS,
  GEO_URL:GEO_URL, LVL_UK:LVL_UK, LVL_COL:LVL_COL, RED:RED, AMBER:AMBER,
  oblastOf:function(a, ll){ return a.oblastOf(ll); }
};
})();
</script>

let started = false;
const deadline = Date.now() + 20000;
const el = id => document.getElementById(id);

class TerenApp extends HTMLElement {
  connectedCallback(){
    if (this._mounted) return;
    this._mounted = true;
    this.innerHTML = MARKUP;
    started = false;
    requestAnimationFrame(boot);
  }
}
if (!customElements.get('teren-app')) customElements.define('teren-app', TerenApp);

function ready(){ return el('map') && el('st-txt') && el('file-in') && el('p-ruler') }
function boot(){
  if (started) return;
  if (!ready()) { requestAnimationFrame(boot); return }
  if (!window.maplibregl) {
    if (Date.now() < deadline) { setTimeout(boot, 120); return }
    el('st-txt').textContent = 'рушій мапи не завантажився — нема мережі або переглядач ріже скрипти. тапни, щоб перезавантажити';
    el('led').className = 'led err';
    el('term').onclick = function(){ location.reload() };
    return
  }
  started = true;
  try { start() } catch (e) {
    el('st-txt').textContent = 'старт спіткнувся: ' + e.message;
    el('led').className = 'led err';
    console.error(e)
  }
}

/* ─── геодезія ─── */
const R=6371008.8,rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI;
function dist(a,b){const dl=rad(b[1]-a[1]),dg=rad(b[0]-a[0]);
  const h=Math.sin(dl/2)**2+Math.cos(rad(a[1]))*Math.cos(rad(b[1]))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function bearing(a,b){const y=Math.sin(rad(b[0]-a[0]))*Math.cos(rad(b[1]));
  const x=Math.cos(rad(a[1]))*Math.sin(rad(b[1]))-Math.sin(rad(a[1]))*Math.cos(rad(b[1]))*Math.cos(rad(b[0]-a[0]));
  return (deg(Math.atan2(y,x))+360)%360}
function dest(p,brg,d){const dr=d/R,b=rad(brg),la=rad(p[1]),lo=rad(p[0]);
  const la2=Math.asin(Math.sin(la)*Math.cos(dr)+Math.cos(la)*Math.sin(dr)*Math.cos(b));
  const lo2=lo+Math.atan2(Math.sin(b)*Math.sin(dr)*Math.cos(la),Math.cos(dr)-Math.sin(la)*Math.sin(la2));
  return [deg(lo2),deg(la2)]}
function plen(c){let s=0;for(let i=1;i<c.length;i++)s+=dist(c[i-1],c[i]);return s}
function parea(c){if(c.length<3)return 0;let s=0;for(let i=0,l=c.length;i<l;i++){const a=c[i],b=c[(i+1)%l];
  s+=rad(b[0]-a[0])*(2+Math.sin(rad(a[1]))+Math.sin(rad(b[1])))}return Math.abs(s*R*R/2)}
const mid=c=>{let x=0,y=0;c.forEach(p=>{x+=p[0];y+=p[1]});return [x/c.length,y/c.length]};
const ring=c=>{const r=c.slice();if(r.length&&(r[0][0]!==r[r.length-1][0]||r[0][1]!==r[r.length-1][1]))r.push(r[0]);return r};
function circlePoly(c,r,n){n=n||72;const o=[];for(let i=0;i<n;i++)o.push(dest(c,i*360/n,r));return ring(o)}
function sectorPoly(c,r,az,w){const n=Math.max(8,Math.round(w/4)),o=[c];for(let i=0;i<=n;i++)o.push(dest(c,az-w/2+w*i/n,r));return ring(o)}
/* сектор із трьох тапів: центр, край (азимут+радіус), точка ширини */
function sectorParams(c){const r=dist(c[0],c[1]),az=bearing(c[0],c[1]);let w=60;
  if(c[2]){let d=Math.abs(((bearing(c[0],c[2])-az)+540)%360-180);w=clamp(d*2,4,358)}return{r,az,w}}
function pip(pt,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
  if((yi>pt[1])!==(yj>pt[1])&&pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi)inside=!inside}return inside}
function bboxOf(c){let x0=180,y0=90,x1=-180,y1=-90;c.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])});return [x0,y0,x1,y1]}
const fLen=m=>m<1000?Math.round(m)+' м':(m/1000).toFixed(m<10000?2:1)+' км';
const fAr=m=>m<1e4?Math.round(m)+' м²':m<1e6?(m/1e4).toFixed(2)+' га':(m/1e6).toFixed(2)+' км²';
const fLL=p=>p[1].toFixed(5)+', '+p[0].toFixed(5);
const fAz=a=>String(Math.round(a)).padStart(3,'0')+'°';
const pct=v=>Math.round(v*100)+'%';
function plural(n,a,b,c){n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c}
function pointAlong(c,f){const L=plen(c);if(!L)return{p:c[0],b:0};let d=L*f,i=1;
  while(i<c.length){const s=dist(c[i-1],c[i]);if(d<=s){const br=bearing(c[i-1],c[i]);return{p:dest(c[i-1],br,d),b:br}}d-=s;i++}
  return{p:c[c.length-1],b:bearing(c[c.length-2]||c[0],c[c.length-1])}}
/* Дуглас–Пекер у градусах (для пензля, крок 2) */
function simplify(pts,eps){if(pts.length<3)return pts;let dmax=0,idx=0;const a=pts[0],b=pts[pts.length-1];
  for(let i=1;i<pts.length-1;i++){const d=segDist(pts[i],a,b);if(d>dmax){dmax=d;idx=i}}
  if(dmax>eps){return simplify(pts.slice(0,idx+1),eps).slice(0,-1).concat(simplify(pts.slice(idx),eps))}return [a,b]}
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];const l2=dx*dx+dy*dy;if(!l2)return Math.hypot(p[0]-a[0],p[1]-a[1]);
  let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l2;t=clamp(t,0,1);return Math.hypot(p[0]-(a[0]+t*dx),p[1]-(a[1]+t*dy))}

let stT=null,holdUntil=0,inIdle=false;

  const e=$('st-txt');e.innerHTML='<span>'+esc(msg)+'</span>';e.classList.toggle('k',!!keep);

  const led=$('led');led.className='led'+(mode==='busy'?' busy':mode==='err'?' err':'');
  clearTimeout(stT);if(!keep)stT=setTimeout(idle,3200);
}

/* зона стала полігоном зі штрихуванням, стрілка й олівець — лінією з налаштуваннями */
function migrate(o){
  if(o.type==='zone'){o.type='polygon';o.st.hatch=true}
  else if(o.type==='arrow'){o.type='line';if(!o.st.arrowType||o.st.arrowType==='none')o.st.arrowType='classic'}
  else if(o.type==='pencil'){o.type='line';if(!o.st.brush)o.st.brush='pencil'}
  if(o.type==='line'&&o.st.arrowType==='plain')o.st.arrowType='none';
  if(o.type==='unit')o.st.sym=symNorm(o.st.sym);
  return o}
let saveT=null;

/* ─── групи ─── */
const grp=id=>S.groups.find(g=>g.id===id);

function gPath(id){const a=[];let g=grp(id),n=0;while(g&&n++<20){a.unshift(g.name);g=grp(g.parent)}return a.length?'/ '+a.join(' / '):'/ без групи'}
function gVis(id){let g=grp(id),n=0;while(g&&n++<20){if(!g.visible)return false;g=grp(g.parent)}return true}
function isDesc(id,of){let g=grp(id),n=0;while(g&&n++<20){if(g.parent===of)return true;g=grp(g.parent)}return false}

/* ═══════════ РЕЛЬЄФ · dem:// з ланцюжком резервів (з delta⁹) ═══════════ */
const DEM_SRC=[
  {id:'reearth',url:'https://terrain.reearth.land/terrarium/elevation/{z}/{x}/{y}.png',max:15},
  {id:'aws',url:'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png',max:15},
  {id:'openzenith',url:'https://openzenith.cyopsys.com/api/dem-tile/{z}/{x}/{y}',max:12}];
const demRaw={},demGrid={};let demOk=0,demFail=0,demWho='';
const tkey=(z,x,y)=>z+'/'+x+'/'+y;
function fetchTO(url,ms,sig){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);
  if(sig){try{sig.addEventListener('abort',()=>ctl.abort())}catch(e){}}
  return fetch(url,{signal:ctl.signal,mode:'cors'}).then(r=>{clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer()}).catch(e=>{clearTimeout(t);throw e})}
function fetchDem(z,x,y,sig){const k=tkey(z,x,y);if(demRaw[k])return demRaw[k];
  const chain=DEM_SRC.reduce((prev,s)=>prev.catch(()=>{if(z>s.max)throw new Error('zoom');
    return fetchTO(s.url.replace('{z}',z).replace('{x}',x).replace('{y}',y),7000,sig).then(b=>{if(!demOk){demOk=1;demWho=s.id;logSrc('рельєф пішов з '+s.id);onDemReady()}return b})}),Promise.reject(new Error('init')));
  demRaw[k]=chain;chain.catch(()=>{if(demRaw[k]===chain)delete demRaw[k];demFail++});return chain}
try{maplibregl.addProtocol('dem',(params,ac)=>{const m=/dem:\/\/(\d+)\/(\d+)\/(\d+)/.exec(params.url);
  if(!m)return Promise.reject(new Error('bad dem url'));return fetchDem(+m[1],+m[2],+m[3],ac&&ac.signal).then(b=>({data:b}))});}catch(e){}
const mxT=(l,z)=>(l+180)/360*Math.pow(2,z);
const myT=(l,z)=>{const s=Math.sin(rad(l));return (.5-Math.log((1+s)/(1-s))/(4*Math.PI))*Math.pow(2,z)};
function decodeDem(z,x,y){const k=tkey(z,x,y);if(demGrid[k]!==undefined)return Promise.resolve(demGrid[k]);
  return fetchDem(z,x,y).then(buf=>createImageBitmap(new Blob([buf]))).then(bmp=>{
    const cv=document.createElement('canvas');cv.width=cv.height=256;const ctx=cv.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(bmp,0,0,256,256);const d=ctx.getImageData(0,0,256,256).data,g=new Float32Array(65536);
    for(let i=0,j=0;i<65536;i++,j+=4){const e=d[j]*256+d[j+1]+d[j+2]/256-32768;g[i]=e<=-32000?NaN:e}
    try{bmp.close&&bmp.close()}catch(e){}demGrid[k]=g;return g}).catch(()=>{demGrid[k]=null;return null})}
const DEMZ=12;
function elevAt(p){const fx=mxT(p[0],DEMZ),fy=myT(p[1],DEMZ),tx=Math.floor(fx),ty=Math.floor(fy);
  const g=demGrid[tkey(DEMZ,tx,ty)];if(!g)return null;
  const px=(fx-tx)*256,py=(fy-ty)*256,x0=clamp(Math.floor(px),0,255),y0=clamp(Math.floor(py),0,255),x1=Math.min(255,x0+1),y1=Math.min(255,y0+1);
  const dx=px-x0,dy=py-y0,at=(ix,iy)=>{const v=g[iy*256+ix];return isNaN(v)?0:v};
  return (at(x0,y0)*(1-dx)+at(x1,y0)*dx)*(1-dy)+(at(x0,y1)*(1-dx)+at(x1,y1)*dx)*dy}
/* гарантуємо тайли DEM під набором точок, далі elevAt працює синхронно */
function ensureDem(pts){const keys={};pts.forEach(p=>{keys[tkey(DEMZ,Math.floor(mxT(p[0],DEMZ)),Math.floor(myT(p[1],DEMZ)))]=1});
  return Promise.all(Object.keys(keys).map(k=>{const a=k.split('/');return decodeDem(+a[0],+a[1],+a[2])}))}
function heightAt(p){let h=null;try{h=map.queryTerrainElevation({lng:p[0],lat:p[1]})}catch(e){}if(h==null||!isFinite(h))h=elevAt(p);return h}
function profile(c,n){n=n||48;const L=plen(c),out=[];for(let i=0;i<=n;i++){const pa=pointAlong(c,i/n);out.push({d:L*i/n,h:elevAt(pa.p)})}return out}

/* ═══════════ ГЕОМЕТРІЯ СТРІЛОК ═══════════ */
/* метрів на екранний піксель — щоб наконечник тримав сталий розмір на будь-якому зумі */
/* MapLibre малює тайлами по 512 px, звідси +1 у степені */
function mPerPx(lat,z){return 156543.03392*Math.cos(rad(lat))/Math.pow(2,z+1)}
function headLen(c,s){
  const z=map?map.getZoom():12,tip=c[c.length-1],seg=dist(c[c.length-2],tip);
  const px=(11+(s.width||3)*2.3)*(s.head||1);
  /* лише верхня межа: інакше на довгій лінії голова роздувалась до кілометрів */
  return Math.min(mPerPx(tip[1],z)*px,seg*.9,plen(c)*.5)}
function arrowParts(c,s){
  const out=[],t=s.arrowType||'none';if(t==='none'||t==='plain'||c.length<2)return out;
  const tip=c[c.length-1],prev=c[c.length-2],brg=bearing(prev,tip),seg=dist(prev,tip);
  const L=headLen(c,s);
  const head=(tp,b,len)=>{const back=dest(tp,b+180,len);return [tp,dest(back,b-90,len*.45),dest(back,b+90,len*.45),tp]};
  if(t==='classic'||t==='double'||t==='wedge'||t==='thrust')out.push({g:{type:'Polygon',coordinates:[head(tip,brg,L*(t==='thrust'?1.25:1))]},fill:1});
  if(t==='double'){const b2=bearing(c[1],c[0]);out.push({g:{type:'Polygon',coordinates:[head(c[0],b2,L)]},fill:1})}
  if(t==='open'){out.push({g:{type:'LineString',coordinates:[dest(tip,brg+180+34,L),tip,dest(tip,brg+180-34,L)]},fill:0})}
  if(t==='bar')out.push({g:{type:'LineString',coordinates:[dest(tip,brg-90,L*.55),dest(tip,brg+90,L*.55)]},fill:0});
  if(t==='wedge'||t==='thrust'){const body=c.slice(0,-1).concat([dest(tip,brg+180,L*(t==='thrust'?1.25:1))]);
    const W=L*(t==='thrust'?.5:.32),n=body.length,l=[],r=[];
    body.forEach((p,i)=>{const b=i<n-1?bearing(p,body[i+1]):bearing(body[i-1],p);const w=W*(0.12+0.88*(i/(n-1||1)));l.push(dest(p,b-90,w));r.push(dest(p,b+90,w))});
    out.push({g:{type:'Polygon',coordinates:[l.concat(r.reverse()).concat([l[0]])]},fill:1})}

/* ═══════════ ОБʼЄКТ → ГЕОМЕТРІЯ ═══════════ */
function linkEnds(o){const a=byId(o.aId),b=byId(o.bId);return (a&&b)?[a,b]:null}
function shapeOf(o){/* контур для ліній/заливок; null для точкових */
  const c=o.coords;
  if(o.type==='link'){const e=linkEnds(o);return e?{type:'LineString',coordinates:[anchorOf(e[0]),anchorOf(e[1])]}:null}
  if(o.type==='polygon')return c.length>2?{type:'Polygon',coordinates:[ring(c)]}:null;
  if(o.type==='line')return c.length>1?{type:'LineString',coordinates:c}:null;
  if(o.type==='circle')return c.length>1?{type:'Polygon',coordinates:[circlePoly(c[0],dist(c[0],c[1]))]}:null;
  if(o.type==='sector'){if(c.length<2)return null;const p=sectorParams(c);return {type:'Polygon',coordinates:[sectorPoly(c[0],p.r,p.az,p.w)]}}
  return null}
function anchorOf(o){const c=o.coords;
  if(o.type==='link'){const e=linkEnds(o);if(!e)return [0,0];const a=anchorOf(e[0]),b=anchorOf(e[1]);return [(a[0]+b[0])/2,(a[1]+b[1])/2]}
  if(o.type==='marker'||o.type==='text'||o.type==='unit'||o.type==='circle'||o.type==='sector')return c[0];
  if(o.type==='polygon')return mid(c);return c[Math.floor(c.length/2)]}
function metricsOf(o){const c=o.coords,t=o.type,L=[];
  if(t==='unit'){const sy=symNorm(o.st.sym);
    L.push('символ ...... '+symLabel(sy));
    L.push('належність .. '+AFF_LBL[sy.aff]);
    if(sy.hq)L.push('роль ........ штаб / КП');
    if(sy.mob&&sy.mob!=='none')L.push('рухомість ... '+MOB_LBL[sy.mob]);
    if(sy.status==='planned')L.push('стан ........ очікуваний');
    if(sy.higher)L.push('вище ........ '+sy.higher);
    L.push('SIDC ........ '+sidcOf(sy))}
  if(t==='link'){const e=linkEnds(o);const lt=LINKT[o.st.linkType]||LINKT.subord;
    L.push('тип ......... '+lt[0]);
    L.push('від ......... '+(e?(e[0].name||TYPE[e[0].type]):'— загубився'));
    L.push('до .......... '+(e?(e[1].name||TYPE[e[1].type]):'— загубився'));
    if(e){const g=shapeOf(o);if(g)L.push('відстань .... '+fLen(plen(g.coordinates))+' · '+fAz(bearing(g.coordinates[0],g.coordinates[1])))}
    return L}
  if(t==='polygon'){L.push('площа ....... '+fAr(parea(c)));L.push('периметр .... '+fLen(plen(ring(c))))}
  if(t==='line'){L.push('довжина ..... '+fLen(plen(c)));L.push('азимут ...... '+fAz(bearing(c[0],c[c.length-1])))}
  if(t==='circle'&&c[1]){const r=dist(c[0],c[1]);L.push('радіус ...... '+fLen(r));L.push('площа ....... '+fAr(Math.PI*r*r))}
  if(t==='sector'&&c[1]){const p=sectorParams(c);L.push('радіус ...... '+fLen(p.r));L.push('азимут ...... '+fAz(p.az));L.push('ширина ...... '+Math.round(p.w)+'°')}
  if(t==='marker'||t==='text'||t==='unit'){const h=heightAt(c[0]);if(h!=null)L.push('висота ...... '+Math.round(h)+' м')}
  if(['line','polygon'].includes(t))L.push('вершин ...... '+c.length);

function clipPoly(subject,clipRaw){
  if(!subject||subject.length<3||!clipRaw||clipRaw.length<3)return null;
  let subj=subject.slice();
  if(subj.length>1){const a=subj[0],b=subj[subj.length-1];if(a[0]===b[0]&&a[1]===b[1])subj=subj.slice(0,-1)}
  let clip=clipRaw.slice();{const a=clip[0],b=clip[clip.length-1];if(a[0]===b[0]&&a[1]===b[1])clip=clip.slice(0,-1)}
  if(signedArea(clip)<0)clip=clip.slice().reverse();
  const inside=(p,a,b)=>(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0])>=-1e-12;
  const inter=(s,e,a,b)=>{const dcx=b[0]-a[0],dcy=b[1]-a[1],dsx=e[0]-s[0],dsy=e[1]-s[1];
    const den=dcx*dsy-dcy*dsx;if(Math.abs(den)<1e-15)return [e[0],e[1]];
    const t=(dcy*(s[0]-a[0])-dcx*(s[1]-a[1]))/den;return [s[0]+t*dsx,s[1]+t*dsy]};
  let out=subj;
  for(let c=0;c<clip.length;c++){
    const a=clip[c],b=clip[(c+1)%clip.length],input=out;out=[];const m=input.length;if(!m)break;
    for(let i=0;i<m;i++){const cur=input[i],prev=input[(i+m-1)%m];
      const ci=inside(cur,a,b),pi=inside(prev,a,b);
      if(ci){if(!pi)out.push(inter(prev,cur,a,b));out.push(cur)}else if(pi)out.push(inter(prev,cur,a,b))}}
  return out.length>=3?out:null}

function probeOne(tpl,z,x,y,ms){return new Promise(res=>{const t0=Date.now(),im=new Image();let done=0;const fin=ok=>{if(done)return;done=1;res(ok?Math.max(1,Date.now()-t0):0)};

let rulerCoords=null;
function spark(vals,w){const ok=vals.filter(v=>v!=null);if(!ok.length)return '└─ DEM ще не декодований — відкрий панель ще раз';
  const mn=Math.min(...ok),mx=Math.max(...ok),bars='▁▂▃▄▅▆▇█';let s='';
  const step=Math.max(1,Math.ceil(vals.length/w));for(let i=0;i<vals.length;i+=step){const v=vals[i];s+=v==null?' ':bars[Math.round((v-mn)/((mx-mn)||1)*7)]}
  return '┌─ '+Math.round(mx)+' м\n'+s+'\n└─ '+Math.round(mn)+' м · перепад '+Math.round(mx-mn)+' м'}
function openRuler(c){rulerCoords=c;const L=plen(c);
  const lines=['довжина ..... '+fLen(L),'азимут ...... '+fAz(bearing(c[0],c[c.length-1]))+' (прямий)','сегментів ... '+(c.length-1)];
  if(c.length>2)lines.push('площа ....... '+fAr(parea(c))+' (якби замкнути)');
  $('ru-metrics').textContent=lines.map((l,i,a)=>(i===a.length-1?'└─ ':'├─ ')+l).join('\n');
  $('ru-segs').textContent=c.slice(1).map((p,i)=>(i===c.length-2?'└─ ':'├─ ')+String(i+1).padStart(2,'0')+' '+fLen(dist(c[i],p)).padEnd(9)+' '+fAz(bearing(c[i],p))).join('\n');
  $('ru-profile').textContent='└─ декодую DEM…';openPanel('p-ruler');
  const pr0=profile(c,60);ensureDem(pr0.map(x=>pointAlong(c,x.d/(L||1)).p)).then(()=>{const pr=profile(c,60);
    let up=0,dn=0;for(let i=1;i<pr.length;i++){if(pr[i].h==null||pr[i-1].h==null)continue;const d=pr[i].h-pr[i-1].h;if(d>0)up+=d;else dn-=d}
    $('ru-profile').textContent=spark(pr.map(x=>x.h),60)+'\n   підйом +'+Math.round(up)+' м · спуск −'+Math.round(dn)+' м';
    const h0=pr[0].h,h1=pr[pr.length-1].h;if(h0!=null&&h1!=null)$('ru-metrics').textContent+='\n   висоти: '+Math.round(h0)+' → '+Math.round(h1)+' м'})}
