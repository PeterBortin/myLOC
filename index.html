/* консоль крила КР: складається вздовж корпусу, розкривається після старту */
function mslWingBaked(kind){
  return cache('mw_'+kind,function(){
    const D=MSLD[kind], R=D.dia/2, L=D.len, r=new Rig();
    const span=kind==='x101'?L*.20:kind==='iskK'?L*.24:L*.25;   // реальний розмах: «Калібр» 3.1 м, Х-101 3.0 м
    const ch0=kind==='x101'?.95:.78, ch1=ch0*.55;
    r.add(plate([[0,-ch0/2],[span,-ch1/2+span*.16],[span,ch1/2+span*.16],[0,ch0/2]],.07),T(0,0,0));  // стріловидність: кромка дивиться на ніс
    return r.bake();
  });
}
function makeAGM(kind,color){
  const D=MSLD[kind]||MSLD.agm, col=color==null?D.col:color;
  const g=new THREE.Group(), parts={wings:[],kind:kind,def:D};
  g.add(build(mslBodyBaked(kind),col,1,0x0d1210,.85));
  if(D.prof==='cruise'&&kind!=='x59'&&kind!=='agm'){    // складене крило: консоль лягає ВЗДОВЖ борту назад
    const wb=mslWingBaked(kind);
    const R=D.dia/2;
    for(let s=-1;s<=1;s+=2){
      const pv=new THREE.Group();
      pv.position.set(0,0,kind==='x101'?-D.len*.06:D.len*.02);
      const w=build(wb,col,.95,0x0d1210,.8);
      w.scale.x=s;
      pv.add(w);
      pv.rotation.y=s>0?-1.46:1.46;                    // складене: консоль відведена назад уздовж фюзеляжу
      g.add(pv);parts.wings.push({pv:pv,side:s});
    }
  }
  if(D.prof==='hyper'){                                 // плазмовий кокон
    const gl=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),
      new THREE.MeshBasicMaterial({color:D.flame,transparent:true,opacity:.20,depthWrite:false}));
    gl.scale.set(D.dia*.85,D.dia*.85,D.len*.42);
    gl.position.z=D.len*.10;
    g.add(gl);parts.glow=gl;
  }
  const nz=new THREE.Object3D();nz.position.z=-D.len*.5;
  g.add(nz);parts.nozzle=nz;parts.flameCol=D.flame;parts.len=D.len;
  return {group:g,parts:parts};
}
/* розкриття крила: t 0..1 */
function agmDeploy(parts,t){
  if(!parts||!parts.wings)return;
  const k=Math.max(0,Math.min(1,t));
  for(const w of parts.wings)w.pv.rotation.y=(w.side>0?-1.46:1.46)*(1-k);
}

/* ───────────────────────── КОРАБЛІ ─────────────────────────
   У паку myFPV кораблів не було, тож корабельне ППО їхало б по морю
   вантажівкою. Два каркаси в тому ж стилі (ребра + тіньова заливка):
   патрульний катер типу Island (33,5 м) і корвет типу Ada — «Гетьман
   Іван Мазепа» (99,5 м). Ніс у +Z, ватерлінія на y = 0.             */
function hullPts(L,b){
  /* план корпусу: у plate() контур [x, y] лягає як (x, 0, −y) */
  return [[-.88*b,L/2],[.88*b,L/2],[b,.05*L],[.82*b,-.24*L],[.35*b,-.44*L],[0,-L/2],
          [-.35*b,-.44*L],[-.82*b,-.24*L],[-b,.05*L]];
}
function islandBaked(){
  return cache('shipIsland',function(){
    const r=new Rig(), L=33.5, b=3.2;
    const hull=plate(hullPts(L,b),3.2);hull.translate(0,.6,0);r.add(hull);
    r.add(plate(hullPts(L*.96,b*.94),.12),T(0,2.26,0),1,true);            // палуба
    r.add(new THREE.BoxGeometry(4.6,2.6,10.5),T(0,3.5,-1.5));             // надбудова
    r.add(new THREE.BoxGeometry(4.2,1.5,4.2),T(0,5.5,.9));                // рубка
    r.add(new THREE.CylinderGeometry(.16,.22,7.5,8),T(0,9.9,-.6),CYL);    // щогла
    r.add(new THREE.BoxGeometry(3.2,.14,.14),T(0,11.6,-.6));              // рея
    r.add(new THREE.CylinderGeometry(.75,.9,.9,12),T(0,2.7,9.2),CYL);     // лафет Mk38
    r.add(new THREE.CylinderGeometry(.09,.09,2.6,8),T(0,3.2,10.6,Math.PI/2,0,0),CYL);
    return r.bake();
  });
}
function adaBaked(){
  return cache('shipAda',function(){
    const r=new Rig(), L=99.5, b=7.2;
    const hull=plate(hullPts(L,b),7.4);hull.translate(0,1.2,0);r.add(hull);
    r.add(plate(hullPts(L*.97,b*.95),.2),T(0,4.95,0),1,true);             // палуба
    r.add(new THREE.BoxGeometry(11.5,7.5,36),T(0,8.7,1));                 // надбудова
    r.add(new THREE.BoxGeometry(9.5,3.2,11),T(0,13.9,10));                // місток
    /* щогла-піраміда з радарними гранями */
    const m=new THREE.CylinderGeometry(2.2,4.4,11,4);m.rotateY(Math.PI/4);
    r.add(m,T(0,21,6),1);
    r.add(new THREE.CylinderGeometry(.3,.3,5,8),T(0,29,6),CYL);
    r.add(new THREE.CylinderGeometry(2.4,2.8,2.6,14),T(0,6.2,30),CYL);    // башта 76 мм
    r.add(new THREE.CylinderGeometry(.22,.22,5.5,8),T(0,6.6,33.5,Math.PI/2,0,0),CYL);
    r.add(new THREE.BoxGeometry(2.6,2.4,3.2),T(0,13.7,-14));              // RAM
    r.add(new THREE.BoxGeometry(4,4,5),T(0,9.5,-12),1,true);              // ангар
    r.add(new THREE.BoxGeometry(12,.2,22),T(0,5.1,-36),1,true);           // вертолітний майданчик
    return r.bake();
  });
}
function makeShip(kind,color){
  const col=color==null?0x64ff8f:color;

   Кирилиця й JS: \b і \w матчать лише [A-Za-z0-9_], тож жоден шаблон із
   ними по-українськи не спрацює. Тому текст нормалізуємо й обрамлюємо
   пробілами, а межі слова пишемо явними класами. */

function padName(s){
  return ' ' + String(s || '').toLowerCase()
    .replace(/[ʼ'`’]/g, "'").replace(/ё/g, 'е').replace(/[—–]/g, '-')
    .replace(/\s+/g, ' ').trim() + ' ';
}

/* назва в тексті → ключ у SPEC. Порядок важить: вужче раніше за ширше,
   інакше «герань» зʼїсть «герань-5». */
var ALIAS = [
  ['geran5',   /гера[нm][ьъ]?[\s-]*5|geran[\s-]*5|герань[\s-]*п'ять/],
  ['geran4',   /гера[нm][ьъ]?[\s-]*4|geran[\s-]*4/],
  ['geran3',   /гера[нm][ьъ]?[\s-]*3|geran[\s-]*3/],
  ['geran2',   /гера[нm][ьъ]?[\s-]*2|geran[\s-]*2|шахед[\s-]*136|shahed[\s-]*136/],
  ['geran1',   /гера[нm][ьъ]?[\s-]*1(?![0-9])|шахед[\s-]*131|shahed[\s-]*131/],
  ['shahed238',/шахед[\s-]*238|shahed[\s-]*238|герань[\s-]*238/],
  ['gerbera',  /гербер|gerbera|приманк/],
  ['lancet',   /ланцет|lancet/],
  ['orlan',    /орлан|orlan/],
  ['supercam', /supercam|суперкам/],
  ['zala',     /zala|зала /],
  ['lutyi',    /лютий/],
  ['bober',    /бобер/],
  ['fp1',      /fp-?1|fire ?point/],
  ['flamingo', /фламінго|flamingo|fp-?5/],
  ['kinzhal',  /кинджал|кинжал|kinzhal|х-47|x-47/],
  ['zircon',   /циркон|zircon|3м22|3m22/],
  ['oreshnik', /орешник|орєшник/],
  ['iskm',     /іскандер[\s-]*м|искандер[\s-]*м|9м723|iskander[\s-]*m/],
  ['iskk',     /іскандер[\s-]*к|искандер[\s-]*к|9м728|9м729/],
  ['kn23',     /kn-?23|кн-?23/],
  ['tochka',   /точка[\s-]*у|точка-у/],
  ['x22',      /х-22|x-22|буря/],
  ['x69',      /х-69|x-69/],
  ['x59',      /х-59|x-59/],
  ['kh101',    /х-101|x-101|х101/],
  ['kh55',     /х-55|x-55/],
  ['kalibr',   /калібр|калибр|kalibr|3м14|3m14/],
  ['oniks',    /онікс|оникс|oniks|p-800|п-800/],
  ['banderol', /бандероль|с8000|s8000/],
  ['kab',      /каб[\s-]*\d|умпк|фаб[\s-]*\d|керован[аиі] авіабомб/],
  ['neptunL',  /довг(ий|ого) нептун|r-?360/],
  ['storm',    /storm ?shadow|scalp|шторм ?шедоу/],
  ['atacms',   /atacms|атакамс/],
  ['himars',   /himars|хаймарс|gmlrs/],
  ['smerch',   /смерч|торнадо-с/],
  ['uragan',   /ураган/],
  ['grad',     /град|торнадо-г/]
];

/* знайти борт за текстом; null — у тексті нічого впізнаваного */
function matchText(txt){
  if(!txt) return null;
  var p = padName(txt);
  for(var i = 0; i < ALIAS.length; i++) if(ALIAS[i][1].test(p)) return ALIAS[i][0];
  return null;
}

/* ── курс із опису ──
   Фід часто лишає heading порожнім, зате в тексті пише «курсом на захід»
   або «у напрямку Полтавщини». Це не здогад, а прочитані дані —
   але позначені окремо, щоб було видно, звідки вони. */
var COMPASS = [
  [/п[іи]вн[іи]чно[\s-]*сх[іи]дн|на п[іи]вн[іи]чний сх[іи]д/, 45],
  [/п[іи]вн[іи]чно[\s-]*з[аа]х[іи]дн|на п[іи]вн[іи]чний зах[іи]д/, 315],
  [/п[іи]вденно[\s-]*сх[іи]дн|на п[іи]вденний сх[іи]д/, 135],
  [/п[іи]вденно[\s-]*зах[іи]дн|на п[іи]вденний зах[іи]д/, 225],
  [/на п[іи]вн[іи]ч|курс(ом)? п[іи]вн[іи]ч|п[іи]вн[іи]чн(ий|ому) напрям/, 0],
  [/на сх[іи]д|курс(ом)? сх[іи]д|сх[іи]дн(ий|ому) напрям/, 90],
  [/на п[іи]вдень|курс(ом)? п[іи]вдень|п[іи]вденн(ий|ому) напрям/, 180],
  [/на зах[іи]д|курс(ом)? зах[іи]д|зах[іи]дн(ий|ому) напрям/, 270]
];

/* ── КУРС З ОПИСУ ────────────────────────────────────────────────────
   Тільки ЯВНО НАЗВАНИЙ курс: «курсом на південний захід», «західний
   напрямок». Це твердження спостерігача про напрямок руху, і за ним
   модель має право стати носом.

   Назва області в тексті курсом НЕ Є. Раніше hdgFromText падав на
   placeBearing, і будь-яка згадка області давала азимут на її центроїд.
   У багатшому ендпоінті заголовок цілі — це і є назва області («Сумська
   обл.»), тож КОЖНА ціль діставала курс сама на себе: КАБи над Сумщиною
   дивились на центр Сумщини, тобто в нікуди. Саме це й було видно на
   мапі поруч із NEPTUN. */
function hdgFromText(txt){
  if(!txt) return null;
  var p = padName(txt);
  for(var i = 0; i < COMPASS.length; i++) if(COMPASS[i][0].test(p)) return COMPASS[i][1];
  return null;
}

/* ── «У НАПРЯМКУ X» ──────────────────────────────────────────────────
   Названа спостерігачем ціль руху. Це не курс: між «йде на Полтавщину» і
   «летить азимутом 250°» різниця в тому, що перше — намір, прочитаний із
   тексту, а друге — вимір. Тому воно йде В ПІДПИС, а не в кут моделі.

   Дві умови, без яких воно перетворюється на шум:
   · має бути привід руху («на», «у напрямку», «курсом на», «в бік») —
     сама назва області це просто місце, де ціль зараз;
   · від цілі до центроїда має бути щонайменше 60 км — інакше «на
     Сумщину» для цілі, яка вже над Сумщиною, дає випадковий азимут. */
var TOWARD = /(?:у|в)\s+напрямку|курс(?:ом)?\s+на|прямує|рухається|летить|іде|йде|в\s*бік|у\s*бік|на\s/;
function towardFromText(txt, from){
  var A = window.KostylAlerts, N = window.KostylNeptun;
  if(!A || !A.OBLASTS || !from || !N || !N.bearing || !N.km) return null;
  var p = padName(txt || '');
  if(!TOWARD.test(p)) return null;
  for(var i = 0; i < A.OBLASTS.length; i++){
    var o = A.OBLASTS[i], rs = nameRoots(o.n);
    for(var j = 0; j < rs.length; j++){
      var re = new RegExp('[\\s(«"\'-]' + rs[j].replace(/[-\s]/g, '[-\\s]?'));
      if(re.test(p)){
        if(N.km(from, o.ll) < 60) return null;     // ціль уже там
        return {name:o.n, brg:Math.round(N.bearing(from, o.ll))};
      }
    }
  }
  return null;
}

/* ── висота з опису ──
   «на висоті 2000 м», «2,5 км» — якщо написано, беремо написане. */
function altFromText(txt){
  if(!txt) return null;
  var p = padName(txt);
  /* Кінець слова тут не \b, а явний клас: «м» не входить у \w, тож \b
     після неї ніколи не спрацює — та сама пастка, від якої застерігає
     коментар вище, і я в неї вже влучив. */
  var m = p.match(/висот[іиаєу][^0-9]{0,12}([0-9]+(?:[.,][0-9]+)?)\s*(км|m|м)(?![а-яіїєґa-z])/);
  if(!m) m = p.match(/([0-9]+(?:[.,][0-9]+)?)\s*(км|м)\s*висот/);
  if(!m) return null;
  var v = parseFloat(m[1].replace(',', '.'));
  if(!isFinite(v)) return null;
  if(m[2] === 'км') v *= 1000;
  return v >= 0 && v < 200000 ? v : null;
}

/* ── ТТХ для цілі з фіду ──────────────────────────────────────────
   t — нормалізований запис (feeds/neptun). Повертає {key, spec, title}. */
function forThreat(t){
  var sub = t && (t.subkind || t.type) || 'unknown';
  /* Спершу конкретика з тексту: «Герань-5» у title має перемагати
     загальний uav, інакше на мапі шість різних бортів виглядатимуть
     одним трикутником із однаковими ТТХ. */
  var key = matchText((t && t.title) || '') ||
            matchText((t && t.note) || '') ||
            NEPTUN_MAP[sub] || 'shahed';
  if(!SPEC[key]) key = NEPTUN_MAP[sub] || 'shahed';
  return {key:key, spec:SPEC[key], named:!!matchText((t && t.title) || ''),
    title:(t && t.title) || NEPTUN_TITLE[sub] || SPEC[key].uk};
}

/* ═══════════════════════ ПРОФІЛЬ ПОЛЬОТУ ═══════════════════════
   Фази рахуються в КІЛОМЕТРАХ, а не у відсотках шляху. Старе «набір за
   перші 6 % маршруту» давало абсурд в обидва боки: на маршруті 1500 км
   шахед набирав висоту 90 км, а на 40-кілометровому — півтора кілометра
   висоти за 2 км дистанції, як ракета. Реальний борт набирає і знижується
   з певним кутом, незалежно від того, куди летить.

   Повітряний пуск (Ту-95, Су-34, МіГ-31К) стартує з висоти носія: Х-101
   спершу ЗНИЖУЄТЬСЯ до маршової, КАБ планує вниз увесь шлях, «Кинджал»
   іде по квазібалістиці вже з 15 км.                                    */
var CARRIER_ALT = {air:9000, mig:15000, sea:0, coast:0, ground:0};
function startAlt(spec){ return (spec && CARRIER_ALT[spec.plat]) || 0; }
function smooth01(x){ x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

/* Межі фаз у кілометрах — одне місце для профілю висоти й для підписів
   фаз у рушії, щоб «пікірування» в хронології почалось там, де воно
   справді почалось на мапі. */
function phaseKm(spec, total, a0){
  if(a0 == null) a0 = startAlt(spec);
  var cruise = spec.apo || spec.altMin || 500, drone = spec.cat === 'drone';
  /* перехід від висоти пуску до маршової: дрон набирає ~6°, наземна КР
     після стартового прискорювача ~11°, авіаційна знижується ~8° */
  var slope = a0 > cruise ? 0.14 : drone ? 0.10 : 0.20;
  /* пікірування: шахед падає круто з кількох кілометрів, КР — з гірки */
  return {climbKm:Math.min(total * 0.35, Math.abs(cruise - a0) / 1000 / slope),
          termKm:Math.min(total * 0.3, drone ? Math.max(2, cruise / 1000 * 2.2) : 4),
          descent:a0 > cruise};
}

/* Висота борту на відстані d км від точки пуску, маршрут total км.
   a0 — висота в момент пуску (носій); якщо не задано — за платформою. */
function altProfile(spec, d, total, a0){
  if(!spec) return 0;
  total = Math.max(0.1, total || 0.1);
  d = Math.max(0, Math.min(total, d || 0));
  if(a0 == null) a0 = startAlt(spec);
  var p = d / total;

  /* балістика й квазібалістика: апогей залежить від дальності пострілу —
     «Іскандер» на 120 км не лізе на 50 км, він іде десь на 25–30 */
  if(spec.profile === 'arc'){
    var apo = Math.max(spec.altMin || 0, Math.min(spec.apo, total * 1000 * 0.22));
    var arc = apo * Math.pow(Math.max(0, Math.sin(Math.PI * p)), 0.72);
    var carry = a0 * Math.pow(Math.max(0, 1 - p / 0.12), 2);
    return Math.max(0, arc + carry);
  }

  /* КАБ і подібні — планування від точки скидання до цілі */
  if(spec.glide) return Math.max(0, a0 * Math.pow(1 - p, 1.15));

  var cruise = spec.apo || spec.altMin || 500;
  var ph = phaseKm(spec, total, a0), climbKm = ph.climbKm, termKm = ph.termKm;

  if(d < climbKm) return a0 + (cruise - a0) * smooth01(d / climbKm);
  var toGo = total - d;
  /* маршова ділянка: легке «дихання» висоти, як у борту, що обходить
     рельєф — детерміноване, тож однаковий маршрут дає однаковий профіль.
     Рахуємо від КІНЦЯ набору: від абсолютного d у точці переходу висота
     стрибала на сотні метрів (а з підсиленням вертикалі — на кілометри). */
  var x = d - climbKm;
  var cr = cruise * (1 + 0.07 * Math.sin(x / 6.3) + 0.03 * Math.sin(x / 2.1));
  if(toGo > termKm) return cr;
  var u = 1 - toGo / termKm;
  return Math.max(0, cr * (1 - u * u));
}

/* Сумісність зі старим викликом «частка шляху → висота» (живий фід, коли
   відомо лише fr): беремо типову дальність підльоту 300 км. */
function altAt(spec, fr){
  if(!spec) return 0;
  var T = Math.min(spec.range || 300, 300);
  return altProfile(spec, Math.max(0, Math.min(1, fr)) * T, T);
}

/* Швидкість на відстані d: після пуску борт розганяється (катапульта,
   стартовий прискорювач, відділення від носія), КР на пікіруванні
   трохи прискорюється. Балістичний розгін — окремо, у рушії. */
function speedProfile(spec, d, total){
  if(!spec) return 0;
  var v = spec.speed || 300;
  if(spec.glide) return v;
  var acc = spec.cat === 'drone' ? 3 : 6;
  var k = 0.45 + 0.55 * smooth01(d / acc);
  if(spec.cat === 'cruise' && total - d < 4) k *= 1.08;
  return v * k;
}

/* скільки летіти від точки до точки, хв */
function etaMin(spec, km){
  if(!spec || !spec.speed) return null;
  return km / spec.speed * 60;
}

/* людською мовою: «Shahed-136/131 · 185 км/год · БЧ ~50 кг» */
function label(key){
  var s = SPEC[key]; if(!s) return '';
  return s.uk + ' · ' + s.speed + ' км/год · ' + s.wh;
}

var PLATUK = {ground:'наземний пуск', air:'з літака', sea:'з корабля',
  coast:'береговий комплекс', mig:'з МіГ-31К'};
var PROFUK = {low:'маловисотний', arc:'балістична дуга'};

/* ── картка ТТХ для панелі: готові пари «назва → значення» ──
   key  борт зі SPEC або носій із PLAT
   t    опційно: запис цілі з фіду — тоді додаються живі поля           */
function card(key, t){
  var s = SPEC[key];
  if(!s){
    var p = PLAT[key];
    if(!p) return null;
    return {title:p.uk, cat:p.cat, col:'#ff3b30', rows:[
      ['Роль', p.role], ['Довжина', p.len.toFixed(1) + ' м']
    ]};
  }
  var rows = [
    ['Клас',      CATUK[s.cat] || s.cat],
    ['Швидкість', s.speed + ' км/год'],
    ['Дальність', s.range + ' км'],
    ['Висота',    s.altMin + '–' + s.altMax + ' м'],
    ['Профіль',   (PROFUK[s.profile] || s.profile) +
                  (s.profile === 'arc' ? ', апогей ' + fmtKm(s.apo) : '')],
    ['Пуск',      PLATUK[s.plat] || s.plat],
    ['БЧ',        s.wh],
    ['Довжина',   s.len.toFixed(2) + ' м']
  ];
  if(s.decoy) rows.push(['Особливо', 'приманка — БЧ немає']);
  else if(!s.strike) rows.push(['Особливо', 'розвідник, не ударний']);
  if(s.cheap) rows.push(['Ресурс', 'масовий дешевий засіб']);

  if(t){
    if(t.amount > 1)  rows.unshift(['Кількість', t.amount + ' од.']);
    if(t.city)        rows.push(['Район', t.city]);
    var HSRC = {feed:'', track:' (виміряно)', text:' (з опису)'};
    var ASRC = {feed:'', text:' (з опису)', spec:' (крейсерська з профілю)'};
    if(t.hdg != null) rows.push(['Курс', Math.round(t.hdg) + '°' + (HSRC[t.hdgSrc] || '')]);
    else rows.push(['Курс', 'невідомий — ціль не протягуємо']);
    if(t.altShown != null) rows.push(['Висота',
      fmtKm(Math.round(t.altShown)) + (ASRC[t.altSrc] || '')]);
    if(t.speed)       rows.push(['Фактична', Math.round(t.speed) + ' км/год']);
    if(t.conf)        rows.push(['Достовірність', t.conf]);
    if(t.uncertKm)    rows.push(['Похибка', '±' + t.uncertKm + ' км']);
    if(t.note)        rows.push(['Примітка', t.note]);
    if(t.last)        rows.push(['Оновлено', ago(t.last)]);
  }
  return {title:(t && t.title) || s.uk, cat:s.cat, col:s.col, rows:rows};
}

function fmtKm(m){
  return m >= 1000 ? (m / 1000).toFixed(m >= 10000 ? 0 : 1) + ' км' : m + ' м';
}

function ago(ts){
  var s = Math.max(0, (Date.now() - ts) / 1000);
  if(s < 60) return Math.round(s) + ' с тому';
  if(s < 3600) return Math.round(s / 60) + ' хв тому';
  return Math.round(s / 3600) + ' год тому';
}

window.TERRAIN_SPECS = {
  SPEC:SPEC, PLAT:PLAT, NEPTUN_MAP:NEPTUN_MAP, NEPTUN_TITLE:NEPTUN_TITLE,
  CATUK:CATUK, CATCOL:CATCOL,
  forThreat:forThreat, altAt:altAt, etaMin:etaMin, label:label, card:card,
  altProfile:altProfile, speedProfile:speedProfile, startAlt:startAlt, CARRIER_ALT:CARRIER_ALT, phaseKm:phaseKm,
  matchText:matchText, hdgFromText:hdgFromText, towardFromText:towardFromText,
  altFromText:altFromText, ALIAS:ALIAS,
  fmtKm:fmtKm, ago:ago,
  keys:function(cat){ return Object.keys(SPEC).filter(function(k){ return !cat || SPEC[k].cat===cat; }); }
};
})();
</script>
<script>
/* КОСТИЛ · NEPTUN — живі повітряні цілі й тривоги
   ────────────────────────────────────────────────────────────────────────────
   Знято з delta⁹ / RADAR-UA (js/feeds.js), лишено ОДНЕ джерело — NEPTUN.
   Ані mapa.ua, ані «Київ Цифровий» сюди не тягнуться: без них немає зведення
   джерел (merge), тож і колізій позицій теж немає — що прийшло, те й малюємо.

     https://neptun.in.ua/developers   CORS *, без ключа, GET
       /api/data          живі цілі, БАГАТША схема: шлейф пройдених позицій,
                          курс (course_bearing), радіус невизначеності,
                          числова достовірність, стан треку
       /api/v1/threats    той самий перелік, задокументований і бідніший
       /api/v1/alerts     офіційні тривоги: області + райони
       /api/v1/messages   стрічка Telegram-каналів

     Беремо /api/data першим, бо без шлейфа й курсу ціль без velocity
     доводилось малювати «кудись», а це на мапі читається як факт.
     Задокументований v1 лишається запасним: якщо багатший ендпоінт
     зламають без попередження, стрічка не впаде, лише збідніє.

   ⚠ Умова використання NEPTUN: видиме посилання на джерело поруч із даними.
     Готовий елемент — KostylNeptun.credit().

   Експорт: window.KostylNeptun
*/
(function(){
'use strict';

var NEP = 'https://neptun.in.ua';

/* клас цілі з фіду → внутрішній вид. Ключі збігаються з TERRAIN_SPECS.NEPTUN_MAP */
var KIND = {uav:'drone_piston', recon:'drone_piston', missile:'missile_cruise',
  ballistic:'missile_ballistic', kab:'bomb', mig31k:'mig31k', unknown:'unknown'};
var TITLE = {uav:'Shahed / БпЛА', recon:'Розвідувальний БпЛА', missile:'Крилата ракета',
  ballistic:'Балістична ракета', kab:'КАБ / УМПК', mig31k:'МіГ-31К у повітрі',
  unknown:'Невідома ціль'};
/* запасна швидкість, коли фід її не дав */
var SPEED = {drone_piston:165, drone_jet:450, missile_cruise:800, missile_ballistic:7500,
  bomb:750, drone_fpv:120, mig31k:900, unknown:300};

/* ───────────────────────── геометрія ───────────────────────── */
var R2 = Math.PI/180;

function km(a, b){
  var dLat = (b[1]-a[1])*R2, dLon = (b[0]-a[0])*R2;
  var s = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(a[1]*R2)*Math.cos(b[1]*R2)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 6371 * 2 * Math.asin(Math.min(1, Math.sqrt(s)));
}

/* точка за азимутом і відстанню (км) */
function dest(lon, lat, brg, d){
  var ang = d/6371, t = brg*R2, la = lat*R2, lo = lon*R2;
  var la2 = Math.asin(Math.sin(la)*Math.cos(ang) + Math.cos(la)*Math.sin(ang)*Math.cos(t));
  var lo2 = lo + Math.atan2(Math.sin(t)*Math.sin(ang)*Math.cos(la),
                            Math.cos(ang) - Math.sin(la)*Math.sin(la2));
  return [((lo2/R2 + 540) % 360) - 180, la2/R2];
}

function bearing(a, b){
  var y = Math.sin((b[0]-a[0])*R2)*Math.cos(b[1]*R2);
  var x = Math.cos(a[1]*R2)*Math.sin(b[1]*R2) -
          Math.sin(a[1]*R2)*Math.cos(b[1]*R2)*Math.cos((b[0]-a[0])*R2);
  return (Math.atan2(y, x)/R2 + 360) % 360;
}

/* ───────────────────────── мережа ───────────────────────── */
function getJSON(url){
  return fetch(url, {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('NEPTUN ' + r.status);
    return r.json();
  });
}

/* назва області у вигляді, яким користуються шари мапи */
function oblName(s){
  if(!s) return '';
  var n = String(s).trim().replace(/^м\.\s*/i,'').replace(/\s*область$/i,'').replace(/\s*обл\.?$/i,'');
  if(/^(ар\s*)?крим$/i.test(n) || /криму?$/i.test(n)) return 'АР Крим';
  if(/^київ$/i.test(n)) return 'Київ';
  if(/^севастополь/i.test(n)) return 'Севастополь';
  return n;
}

/* ───────────────────────── нормалізація ─────────────────────────
   Одна ціль з фіду → один запис сталої форми. Нічого не домислюємо:
   чого нема в API, те лишається null/0, а не вигаданим числом. */
/* Висоти в API немає — документація її не описує, і в жодній відповіді вона
   не траплялась. Але якщо зʼявиться під одним зі звичних імен, беремо ЇЇ,
   а не здогад із профілю польоту. Доти alt лишається null, і шар малює
   ціль на крейсерській висоті її типу. */
function altOf(t){
  var v = t.alt != null ? t.alt
        : t.altitude != null ? t.altitude
        : t.altM != null ? t.altM
        : t.altitudeM != null ? t.altitudeM
        : t.height != null ? t.height
        : t.flightLevel != null ? t.flightLevel * 30.48    // FL → м
        : null;
  if(v == null) return null;
  v = +v;
  return isFinite(v) && v >= 0 && v < 200000 ? v : null;
}

function norm(t, t0){
  var kind = KIND[t.type] || 'unknown';
  var v = t.velocity || {};
  var hdg = (t.heading != null ? t.heading : v.bearingDeg);
  var last = Date.parse(t.updatedAt || '') || t0;
  var first = Date.parse(t.confirmedAt || '') || last;
  return {
    id:'np:' + t.id, kind:kind, subkind:t.type || kind,
    amount:Math.max(1, t.count || 1),
    title:t.title || TITLE[t.type] || 'Ціль',
    status:(t.status === 'active' ? 'active' : 'lost'),
    /* Курс, якого немає, лишається null, а не нулем: нуль — це «на північ»,
       і числення шляху повело б ціль туди, куди вона не летить. */
    lat:t.lat, lon:t.lon, alt:altOf(t),
    hdg:(hdg == null ? null : +hdg), hdgSrc:(hdg == null ? null : 'feed'),
    speed:v.speedKmh || SPEED[kind] || 300,
    city:t.locality || t.district || t.region || '',
    region:t.region || '', district:t.district || '',
    first:first, last:last, t0:t0,
    trail:[],
    conf:t.confidenceLevel || '',
    advisory:!!t.advisory, areaOnly:!!t.areaOnly,
    uncertKm:t.uncertaintyKm || 0,
    srcCount:+t.sourceCount || (Array.isArray(t.sources) ? t.sources.length : 0) || 1,
    estimated:t.positionQuality === 'approx',
    stale:t.status === 'stale',
    spdKnown:!!(v.speedKmh),
    note:t.explanationShort || '',
    from:'v1'
  };
}

/* Клас цілі з багатшого ендпоінта. Поле threat_type грубе, тому текст
   повідомлення уточнює його: без цього КАБ і балістика зливались у «БпЛА». */
var DKIND = {shahed:'uav', uav:'uav', drone:'uav', recon:'recon', missile:'missile',
  cruise:'missile', ballistic:'ballistic', ballist:'ballistic', kab:'kab',
  bomb:'kab', mig31k:'mig31k', aviation:'mig31k', unknown:'unknown'};
var DTEXT = [
  [/баліст|іскандер|искандер|кинджал|кинжал/i, 'ballistic'],
  [/авіабомб|каб[\s-]?\d|кераб|умпк/i, 'kab'],
  [/крилат|калібр|х-101|x-101|kh-101|х-59|х-69/i, 'missile'],
  [/розвід|орлан|zala|зала|суперкам|елерон/i, 'recon'],
  [/шахед|shahed|герань|мопед|гербер|gerbera/i, 'uav']
];

/* Шлейф пройдених позицій. Джерело віддає {lat,lng} або [lat,lng] — наводимо
   до нашого [lon,lat] і відкидаємо сміття: одна нечислова пара зіпсувала б
   і курс, і намальовану лінію. */
function dTrail(a){
  if(!Array.isArray(a)) return [];
  var out = [];
  for(var i = 0; i < a.length; i++){
    var q = a[i], la, lo;
    if(Array.isArray(q)){ la = +q[0]; lo = +q[1]; }
    else if(q && typeof q === 'object'){
      la = +q.lat; lo = +(q.lng != null ? q.lng : q.lon);
    } else continue;
    if(isFinite(la) && isFinite(lo) && Math.abs(la) <= 90 && Math.abs(lo) <= 180)
      out.push([lo, la]);
  }
  return out;
}

function normData(o, t0){
  var lat = +o.lat, lon = +(o.lng != null ? o.lng : o.lon);
  if(!isFinite(lat) || !isFinite(lon)) return null;

  var type = DKIND[String(o.threat_type || '').toLowerCase()] || null;
  var txt = [o.text, o.place, o.region].filter(Boolean).join(' ');
  for(var i = 0; i < DTEXT.length; i++)
    if(DTEXT[i][0].test(txt)){ type = DTEXT[i][1]; break; }   // текст точніший за грубий тип
  if(!type) type = 'unknown';

  var kind = KIND[type] || 'unknown';
  var trail = dTrail(o.positions);

  /* Курс: спершу те, що сказало джерело; якщо мовчить — рахуємо з двох
     останніх точок шлейфа. Це ВИМІР, а не здогад: дві справжні позиції. */
  var hdg = null, hsrc = null;
  var b = o.course_bearing != null ? +o.course_bearing
        : (o.ticker_bearing != null ? +o.ticker_bearing : null);
  if(b != null && isFinite(b)){ hdg = ((b % 360) + 360) % 360; hsrc = 'feed'; }
  else if(trail.length >= 2){
    var p1 = trail[trail.length - 1], p0 = trail[trail.length - 2];
    if(km(p0, p1) > 0.5){ hdg = bearing(p0, p1); hsrc = 'trail'; }
  }

  var t = o.date ? Date.parse(o.date)
        : (o.last_observation_epoch ? +o.last_observation_epoch * 1000 : t0);
  if(!isFinite(t)) t = t0;

  /* Стан треку в багатшій схемі має власні назви. Без цієї перевірки збиті
     й погашені цілі висіли на мапі, поки джерело їх згадувало. */
  var st = String(o.status || o.track_state || '').toLowerCase();
  var dead = /destroy|eliminat|shot|down|hit|impact|arriv|lost|resolv|closed|expired|gone/.test(st)
          || o.is_destroyed === true || o.shot_down === true;

  /* placement_mode !== 'point' означає, що координата — центроїд району, а
     не позиція цілі. Малювати там ціль — вигадувати позицію. */
  var areaOnly = o.placement_mode != null && o.placement_mode !== 'point';

  var cf = o.confidence_0_100 != null ? +o.confidence_0_100
         : (o.confidence != null ? +o.confidence * 100 : null);

  return {
    id:'np:' + (o.track_id || o.id || lat.toFixed(3) + lon.toFixed(3)),
    kind:kind, subkind:type,
    amount:Math.max(1, +o.count || 1),
    title:o.place || o.region || TITLE[type] || 'Ціль',
    status:dead ? 'lost' : 'active',
    lat:lat, lon:lon, alt:altOf(o),
    hdg:hdg, hdgSrc:hsrc,
    speed:+(o.speed_kmh || o.computed_speed_kmh || 0) || SPEED[kind] || 300,
    spdKnown:!!(+(o.speed_kmh || o.computed_speed_kmh || 0)),
    city:o.place || o.region || '', region:o.region || '', district:o.district || '',
    first:t, last:t, t0:t0,
    trail:trail,
    conf:cf == null ? '' : (cf >= 70 ? 'high' : cf >= 40 ? 'medium' : 'low'),
    advisory:false, areaOnly:areaOnly,
    uncertKm:+(o.uncertainty_radius_km || o.display_uncertainty_km) || 0,
    srcCount:+(o.source_count || o.sources_count || o.n_sources || 0) ||
             (Array.isArray(o.sources) ? o.sources.length : 0) || 1,
    estimated:!!o.is_estimated,
    stale:String(o.track_state || '') === 'stale',
    note:String(o.text || '').slice(0, 120),
    from:'data'
  };
}

/* ───────────────────────── запити ───────────────────────── */

/* areaOnly:true — точки НЕМАЄ, названо лише область. Такі записи не малюємо
   як ціль (це була б вигадана позиція) — вони йдуть у підсвітку області. */
function pack(rows, t0, srv, from){
  var objs = [], areas = [];
  rows.forEach(function(o){ if(o) (o.areaOnly ? areas : objs).push(o); });
  return {objs:objs, areas:areas, from:from,
    serverTime:srv || t0, ts:t0};
}

/* Який ендпоінт відповідає зараз. Перемикаємось самі й кажемо про це в лог
   джерел: мовчазна деградація на біднішу схему — це найгірший вид збою,
   бо на мапі вона виглядає як «просто менше даних». */


function fromData(){
  return getJSON(NEP + '/api/data').then(function(j){
    var rows = Array.isArray(j && j.tracks) ? j.tracks
             : (Array.isArray(j) ? j : null);
    if(!rows) throw new Error('/api/data: не бачу tracks[]');
    var t0 = Date.now();
    return pack(rows.map(function(o){ return normData(o, t0); }), t0,
      Date.parse(j.serverTime || j.generated_at || '') || 0, 'data');
  });
}

function fromV1(){
  return getJSON(NEP + '/api/v1/threats').then(function(j){
    var t0 = Date.now();
    return pack((j.threats || []).map(function(t){
      if(!isFinite(t.lat) || !isFinite(t.lon)) return null;
      return norm(t, t0);
    }), t0, Date.parse(j.serverTime || '') || 0, 'v1');
  });
}

function threats(){
  return fromData().catch(function(e){
    /* Багатший ендпоінт недокументований — його можуть зламати мовчки.
       Падаємо на задокументований v1, а не на порожню мапу. */
    return fromV1().then(function(p){ p.dataErr = e && e.message || 'data ?'; return p; });
  });
}

/* ⚠ Районна тривога — це НЕ тривога в усій області. Підняти її до області
   (як робив delta⁹) означає залити пів країни там, де накрито один район:
   у типову ніч майже кожна область має бодай один район під тривогою.
   Тому oblasts[] і raions[] лишаються РІЗНИМИ речами, а шар малює їх по-різному. */
function alerts(){
  return getJSON(NEP + '/api/v1/alerts').then(function(j){
    var obl = {}, raions = {}, list = [];
    /* Форму відповіді ми ніколи не бачили живою. Приймаємо і обʼєкти, і
       голі рядки: інакше одна зміна на боці NEPTUN тихо дала б нуль тривог
       замість помилки, а мовчазна порожня мапа тут — найгірший зі збоїв. */
    (j.oblasts || []).forEach(function(o){
      if(typeof o === 'string') o = {name:o};
      var n = oblName(o.name || o.oblast || o.key);
      if(n) obl[n] = Date.parse(o.since || '') || 0;
      list.push({t:o.name || n, sub:'вся область',
        since:Date.parse(o.since || '') || 0, lvl:'oblast'});
    });
    (j.raions || []).forEach(function(o){
      if(typeof o === 'string') o = {name:o};
      var n = oblName(o.oblast || '');
      if(n) (raions[n] = raions[n] || []).push({
        name:o.name || '', since:Date.parse(o.since || '') || 0});
      list.push({t:o.name || '', sub:o.oblast || '',
        since:Date.parse(o.since || '') || 0, lvl:'raion'});
    });
    list.sort(function(a,b){ return (b.since||0) - (a.since||0); });
    return {oblasts:Object.keys(obl), oblastSince:obl, raions:raions,
      list:list, ts:Date.now()};
  });
}

function messages(){
  return getJSON(NEP + '/api/v1/messages').then(function(j){
    return (j.messages || []).map(function(m){
      return {chan:m.channel || '', text:m.text || '', t:Date.parse(m.date || '') || 0};
    });
  });
}

/* ───────────────────────── числення шляху ─────────────────────────
   Фід оновлюється раз на десятки секунд, а мапа малює 60 разів на секунду.
   Між оновленнями позицію числимо самі: курс + швидкість + минулий час.
   Стеля — 30 хв: далі «протягувати» ціль означало б її вигадати. */
function posAt(rec, now){
  if(!rec) return null;
  if(rec.status !== 'active' || !rec.speed || rec.hdg == null)
    return [rec.lon, rec.lat];
  var dt = Math.max(0, Math.min(1800, (now - (rec.last || now)) / 1000));
  if(dt < 1) return [rec.lon, rec.lat];
  return dest(rec.lon, rec.lat, rec.hdg || 0, rec.speed * dt / 3600);
}

/* чи запис ще свіжий (за умовчанням 12 хв) */
function fresh(rec, maxMin){
  return (Date.now() - (rec.last || 0)) < (maxMin || 12) * 60000;
}

/* ───────────────────────── опитування ─────────────────────────
   start() тримає цикл і сам тлумачить збої: одна невдача — не привід
   гасити стрічку, тому інтервал росте до 4× і повертається на місце,
   щойно джерело відповіло. */
function start(opts){
  opts = opts || {};
  var everyMs = (opts.everyS || 30) * 1000;
  var onData = opts.onData || function(){};
  var onErr = opts.onError || function(){};
  var withAlerts = opts.alerts !== false;
  var timer = null, stopped = false, miss = 0, busy = false;

  function tick(){
    busy = true;
    var jobs = [threats()];
    if(withAlerts) jobs.push(alerts().catch(function(){ return null; }));
    Promise.all(jobs).then(function(r){
      /* Відповідь могла прийти вже після stop(): опитувача більше немає, і
         намальовані нею тривоги не зніме ніхто — вони залипали назавжди. */
      if(stopped) return;
      miss = 0;
      try { onData({threats:r[0], alerts:r[1] || null, ts:Date.now()}); }
      catch(err){ if(opts.onAppError) opts.onAppError(err); else throw err; }
    }).catch(function(e){
      if(stopped) return;
      miss++;
      onErr(e, miss);
    }).then(function(){
      busy = false;
      if(stopped) return;
      var back = Math.min(4, 1 + miss * 0.5);
      timer = setTimeout(tick, everyMs * back);
    });
  }

  tick();
  return {
    stop:function(){ stopped = true; if(timer) clearTimeout(timer); timer = null; },
    /* Поки запит у польоті, timer уже спрацював і clearTimeout нічого не
       дає — кожен now() плодив ще один ланцюг, який переживав stop(). */
    now:function(){ if(busy || stopped) return; if(timer) clearTimeout(timer); tick(); }
  };
}

/* ───────────────────────── атрибуція ─────────────────────────
   Умова використання API: посилання на NEPTUN має бути видиме поруч
   із даними. Ось готовий вузол — покласти в кут мапи або в підвал панелі. */
function credit(){
  var a = document.createElement('a');
  a.href = 'https://neptun.in.ua/';
  a.target = '_blank';
  a.rel = 'noopener';
  a.className = 'neptun-credit';
  a.textContent = 'дані · NEPTUN';
  return a;
}

window.KostylNeptun = {
  NEP:NEP, KIND:KIND, TITLE:TITLE, SPEED:SPEED,
  threats:threats, alerts:alerts, messages:messages,
  norm:norm, altOf:altOf, posAt:posAt, fresh:fresh, oblName:oblName,
  km:km, dest:dest, bearing:bearing,
  start:start, credit:credit
};
})();
</script>
<script>
/* КОСТИЛ · ЕФЕКТИ — вибухи, шлейфи, факели, ударні хвилі
   ────────────────────────────────────────────────────────────────────────────
   Логіка знята з myFPV (createExplosion, createTracer), але переписана під мапу:
   у грі вибух живе в метрах поруч із камерою, тут — у метрах на мапі, звідки
   на нього дивляться з кілометрів. Тому все параметризовано радіусом у метрах,
   а не «великий/малий», і кожен ефект сам себе прибирає.

   Геометрії й матеріали шаряться між усіма ефектами (пул), тож серія прильотів
   не плодить сотні алокацій.

   Залежність одна: THREE. Сцену дає шар мапи.
   Експорт: window.KostylFX — new KostylFX(scene)
*/
(function(){
'use strict';

/* спільна геометрія: створюється раз на сторінку */
var G = null;
function geo(){
  if(G) return G;
  G = {
    ball:   new THREE.SphereGeometry(1, 12, 10),
    shard:  new THREE.TetrahedronGeometry(1),
    cube:   new THREE.BoxGeometry(1, 1, 1),
    ring:   new THREE.RingGeometry(0.86, 1, 48),
    puff:   new THREE.SphereGeometry(1, 8, 6)
  };
  return G;
}

var MATS = {};
/* Матеріал зі спільного пулу — для СТАЛОЇ прозорості. Для згасання ніколи
   не беремо звідси: ключ із неперервним float дав би новий матеріал на кожну
   частинку на кожному кадрі, і пул ріс би до сотень тисяч записів, ніколи не
   звільняючись. Згасання робиться правкою .opacity у власному матеріалі
   частинки — див. own() і step(). */
function mat(color, opacity, side){
  var k = color + '|' + opacity + '|' + (side || 0);
  if(!MATS[k]) MATS[k] = new THREE.MeshBasicMaterial({
    color:color, transparent:true, opacity:opacity,
    depthWrite:false, side:side || THREE.FrontSide
  });
  return MATS[k];
}

/* Власний матеріал частинки: його можна гасити й звільняти, не чіпаючи пул.
   Позначка __own — єдиний надійний спосіб відрізнити його від спільного:
   охоронець по MATS[__k] був мертвий, бо __k ніде не проставлявся, і
   dispose() прилітав у матеріал із пулу, яким далі малювались трасери. */
function own(color, opacity, side){
  var m = new THREE.MeshBasicMaterial({color:color, transparent:true,
    opacity:opacity, depthWrite:false, side:side || THREE.FrontSide});
  m.__own = 1;
  return m;
}
function ownLine(color, opacity){
  var m = new THREE.LineBasicMaterial({color:color, transparent:true,
    opacity:opacity, depthWrite:false});
  m.__own = 1;
  return m;
}
/* звільняємо тільки те, що справді наше */
function freeMat(m){ if(m && m.__own && m.dispose) m.dispose(); }

function lineMat(color, opacity){
  var k = 'L' + color + '|' + opacity;
  if(!MATS[k]) MATS[k] = new THREE.LineBasicMaterial({
    color:color, transparent:true, opacity:opacity, depthWrite:false
  });
  return MATS[k];
}

/* ═══════════════════════════════════════════════════════════════════
   KostylFX — менеджер ефектів однієї сцени
   ═══════════════════════════════════════════════════════════════════ */
function KostylFX(scene, opts){
  this.scene = scene;
  this.o = opts || {};
  this.live = [];            // активні частинки
  this.trails = [];          // шлейфи, прив'язані до об'єктів
  this.cap = this.o.cap || 600;
  geo();
}

/* ─────────────────── ВИБУХ ───────────────────
   at     THREE.Vector3 — точка в сцені (метри)
   r      радіус вогняної кулі в метрах: КАБ ~60, «Іскандер» ~150, Shahed ~35
   opts   {col, shards, smoke, ring, life}                                   */
KostylFX.prototype.boom = function(at, r, opts){
  opts = opts || {};
  r = r || 60;
  var col = opts.col == null ? 0xff5a00 : opts.col;
  var life = opts.life || 1;
  var s = this.scene, L = this.live;
  var room = this.cap - L.length;
  if(room < 12) this.trim(40);

  /* Два спалахи: біле ядро й помаранчева оболонка. На мапі приліт мусить
     читатися, навіть коли на нього глянули через секунду — тому вогонь
     живе довше, ніж у грі, де камера завжди поруч. */
  [[r * 0.55, 0xfff4cc, 0.95, 0.5 * life],
   [r * 1.00, col,      0.60, 0.95 * life]].forEach(function(p){
    var m = new THREE.Mesh(G.ball, own(p[1], p[2]));
    m.position.copy(at); m.scale.setScalar(p[0] * 0.35);
    s.add(m);
    L.push({m:m, t:0, life:p[3], kind:'flash', r:p[0]});
  });

  /* ударна хвиля: кільце по землі */
  if(opts.ring !== false){
    var ring = new THREE.Mesh(G.ring, own(0xffffff, 0.7, THREE.DoubleSide));
    /* кільце — по землі під вибухом; із рельєфом земля не на нулі */
    ring.position.copy(at);
    ring.position.y = opts.groundY != null ? opts.groundY + 1 : Math.max(1, at.y * 0.05);
    ring.rotation.x = -Math.PI / 2;
    ring.scale.setScalar(r * 0.3);
    s.add(ring);
    L.push({m:ring, t:0, life:1.5 * life, kind:'ring', r:r * 3.2});
  }

  /* уламки */
  var n = opts.shards == null ? 26 : opts.shards;
  var cols = [col, 0xff2200, 0xffaa00, 0xff6a00, 0xffffff];
  for(var i = 0; i < n; i++){
    if(L.length > this.cap) break;
    var p = new THREE.Mesh(i % 2 ? G.shard : G.cube, own(cols[i % 5], 1));
    p.position.copy(at);
    p.scale.setScalar(r * 0.035);
    var v = new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.9, Math.random() - 0.5)
      .normalize().multiplyScalar(r * (0.5 + Math.random() * 1.6));
    s.add(p);
    L.push({m:p, v:v, t:0, life:(0.8 + Math.random() * 1.4) * life, kind:'shard', g:r * 1.2});
  }

  /* дим: підіймається й росте */
  var sm = opts.smoke == null ? 9 : opts.smoke;
  for(var j = 0; j < sm; j++){
    if(L.length > this.cap) break;
    var q = new THREE.Mesh(G.puff, own(0x2a2a28, 0.42));
    q.position.copy(at).add(new THREE.Vector3(
      (Math.random() - 0.5) * r * 0.7, Math.random() * r * 0.3, (Math.random() - 0.5) * r * 0.7));
    q.scale.setScalar(r * (0.18 + Math.random() * 0.3));
    s.add(q);
    L.push({m:q, v:new THREE.Vector3((Math.random() - 0.5) * r * 0.25,
        r * (0.35 + Math.random() * 0.4), (Math.random() - 0.5) * r * 0.25),
      t:0, life:(2.2 + Math.random()) * life, kind:'smoke', grow:r * 0.012});
  }
  return this;
};

/* ─────────────────── ПЕРЕХОПЛЕННЯ ───────────────────
   Збиття виглядає інакше за приліт: коротка біла спалах-квітка без диму
   й без кільця по землі — воно ж у повітрі.                               */
KostylFX.prototype.intercept = function(at, r){
  return this.boom(at, r || 45, {col:0xbfe4ff, shards:14, smoke:0, ring:false, life:0.7});
};

/* ─────────────────── ФАКЕЛ ДВИГУНА ───────────────────
   Повертає об'єкт, який чіпляється до моделі (в її локальні координати).
   pulse(dt) — мерехтіння; сам себе не прибирає, живе з носієм.            */
KostylFX.prototype.flame = function(color, len, rad){
  var g = new THREE.Group();
  /* Ніс моделі дивиться в +Z, отже факел іде строго в −Z і НЕ вилазить
     поперед сопла: ядро й хвіст зміщені назад на свою півдовжину. */
  var core = new THREE.Mesh(G.ball, mat(0xfff4d0, 0.8));
  core.scale.set(rad * 0.62, rad * 0.62, len * 0.22);
  core.position.z = -len * 0.20;

  var tail = new THREE.Mesh(G.ball, mat(color == null ? 0xff9c3c : color, 0.34));
  tail.scale.set(rad * 0.9, rad * 0.9, len * 0.42);
  tail.position.z = -len * 0.46;

  g.add(core); g.add(tail);
  g.userData.pulse = function(t){
    var k = 0.8 + Math.sin(t * 31) * 0.12 + Math.random() * 0.1;
    core.scale.set(rad * 0.62 * k, rad * 0.62 * k, len * 0.22 * k);
    tail.scale.set(rad * 0.9 * k, rad * 0.9 * k, len * 0.42 * k);
    tail.position.z = -len * 0.46 * k;
  };
  return g;
};

/* ─────────────────── ШЛЕЙФ ───────────────────
   Слід за бортом: лінія з точок, що тане з хвоста.
   Оновлюється push(pos) на кожному кадрі руху.                            */
function Trail(scene, color, max, width){
  this.scene = scene;
  this.max = max || 90;
  this.pts = [];
  this.geo = new THREE.BufferGeometry();
  this.pos = new Float32Array(this.max * 3);
  this.alpha = new Float32Array(this.max);
  this.geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
  this.line = new THREE.Line(this.geo, lineMat(color == null ? 0xff6a00 : color, 0.55));
  this.line.frustumCulled = false;
  scene.add(this.line);
  this.width = width || 1;
}
Trail.prototype.push = function(v){
  var p = this.pts;
  if(p.length && p[p.length - 1].distanceToSquared(v) < 1) return;
  p.push(v.clone());
  if(p.length > this.max) p.shift();
  for(var i = 0; i < p.length; i++){
    this.pos[i * 3] = p[i].x; this.pos[i * 3 + 1] = p[i].y; this.pos[i * 3 + 2] = p[i].z;
  }
  this.geo.setDrawRange(0, p.length);
  this.geo.attributes.position.needsUpdate = true;
  this.geo.computeBoundingSphere();
};
Trail.prototype.clear = function(){ this.pts.length = 0; this.geo.setDrawRange(0, 0); };
Trail.prototype.dispose = function(){ this.scene.remove(this.line); this.geo.dispose(); };

KostylFX.prototype.trail = function(color, max, width){
  var t = new Trail(this.scene, color, max, width);
  this.trails.push(t);
  return t;
};

/* ─────────────────── ТРАСЕР ───────────────────
   Коротка світна риска від точки до точки — вогонь ППО, кулемет.          */
KostylFX.prototype.tracer = function(from, to, color, speed){
  var g = new THREE.BufferGeometry();
  var len = from.distanceTo(to);
  var dir = to.clone().sub(from).normalize();
  var seg = Math.min(len * 0.12, 400);
  var arr = new Float32Array(6);
  g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  var line = new THREE.Line(g, lineMat(color == null ? 0xffd166 : color, 0.9));
  line.frustumCulled = false;
  this.scene.add(line);
  this.live.push({m:line, t:0, life:len / (speed || 1400), kind:'tracer',
    from:from.clone(), dir:dir, seg:seg, len:len, sp:speed || 1400, arr:arr, geo:g});
  return this;
};

/* ─────────────────── ПОЗНАЧКА ПРИЛЬОТУ ───────────────────
   Тьмяне кільце, що лишається на місці удару на кілька хвилин.            */
KostylFX.prototype.scar = function(at, r, secs){
  var m = new THREE.Mesh(G.ring, own(0xff3b30, 0.5, THREE.DoubleSide));
  m.position.copy(at); m.position.y = Math.max(1, at.y);
  m.rotation.x = -Math.PI / 2;
  m.scale.setScalar(r || 120);
  this.scene.add(m);
  this.live.push({m:m, t:0, life:secs || 180, kind:'scar'});
  return this;
};

/* ─────────────────── КАДР ───────────────────
   dt у секундах. Повертає true, поки є що малювати — шар мапи за цим
   вирішує, чи просити наступний кадр.                                     */
KostylFX.prototype.step = function(dt){
  dt = Math.min(0.1, dt || 0.016);
  var L = this.live, s = this.scene;
  for(var i = L.length - 1; i >= 0; i--){
    var p = L[i];
    p.t += dt;
    var f = p.t / p.life;                       // 0..1 прожитого
    if(f >= 1){
      s.remove(p.m);
      if(p.geo) p.geo.dispose();
      freeMat(p.m.material);
      L.splice(i, 1);
      continue;
    }
    switch(p.kind){
      case 'flash':
        p.m.scale.setScalar(p.r * (0.35 + f * 0.9));
        p.m.material.opacity = (1 - f) * 0.9;
        break;
      case 'ring':
        p.m.scale.setScalar(p.r * (0.1 + f * 0.9));
        p.m.material.opacity = (1 - f) * 0.7;
        break;
      case 'shard':
        p.m.position.addScaledVector(p.v, dt);
        p.v.y -= p.g * dt * 2.2;
        p.m.rotation.x += dt * 5; p.m.rotation.z += dt * 4;
        p.m.material.opacity = 1 - f;
        break;
      case 'smoke':
        p.m.position.addScaledVector(p.v, dt);
        p.v.multiplyScalar(0.985);
        p.m.scale.multiplyScalar(1 + p.grow * dt * 22);
        p.m.material.opacity = (1 - f) * 0.42;
        break;
      case 'tracer':
        var d0 = Math.min(p.len, p.sp * p.t);
        var d1 = Math.max(0, d0 - p.seg);
        p.arr[0] = p.from.x + p.dir.x * d1; p.arr[1] = p.from.y + p.dir.y * d1; p.arr[2] = p.from.z + p.dir.z * d1;
        p.arr[3] = p.from.x + p.dir.x * d0; p.arr[4] = p.from.y + p.dir.y * d0; p.arr[5] = p.from.z + p.dir.z * d0;
        p.geo.attributes.position.needsUpdate = true;
        break;
      case 'scar':
        p.m.material.opacity = 0.5 * (1 - f) * (1 - f);
        break;
    }
  }
  return L.length > 0;
};

/* скільки зараз частинок */
KostylFX.prototype.count = function(){ return this.live.length; };

/* м'який кап: прибрати найстаріші, коли серія прильотів забила пул */
KostylFX.prototype.trim = function(n){
  var L = this.live;
  for(var i = 0; i < n && L.length; i++){
    var p = L.shift();
    this.scene.remove(p.m);
    if(p.geo) p.geo.dispose();
    freeMat(p.m.material);
  }
};

KostylFX.prototype.clear = function(){
  this.trim(this.live.length);
  this.trails.forEach(function(t){ t.dispose(); });
  this.trails.length = 0;
};

window.KostylFX = KostylFX;
})();
</script>
<script>
/* КОСТИЛ · 3D-ШАР — моделі myFPV на мапі MapLibre
   ────────────────────────────────────────────────────────────────────────────
   Один custom layer з власною сценою THREE поверх мапи. Кожна ціль — модель
   з window.MODELS у справжніх метрах, поставлена в (lon, lat, alt).

   Точність позиції. Меркатор розтягує метр із широтою, тому «один масштаб на
   всю сцену» ставив би ціль під Одесою за кілометри від правди. Тут інакше:
   позиція кожного об'єкта рахується через ЙОГО власну меркаторну координату,
   а вже потім переводиться в одиниці сцени. Лишається тільки різниця в
   РОЗМІРІ моделі (≈2 % на кожні 2° широти) — її гасимо множником cos.

   Порядок осей. У мапи z — вгору, у THREE — y. Сцена повернута на 90° по X,
   тож моделі лишаються такими, якими їх зліпили в myFPV: ніс у +Z, y — вгору.

   Залежності: THREE (r128), maplibregl, models.js, specs.js; fx.js — опційно.
   Експорт: window.KostylLayer
*/
(function(){
'use strict';

var EARTH = 40075016.686;                     // екватор, м


/* ═══════════════════════ ПРОЙДЕНИЙ ШЛЯХ ═══════════════════════
   Слід живе в ГЕОКООРДИНАТАХ і малюється звичайним шаром мапи, а не лінією
   в сцені THREE. Причин дві. По-перше, сцена переїжджає разом із початком
   координат, і сценовий слід на кожному далекому пані перетворювався на
   пряму через пів екрану. По-друге, MapLibre вміє біжучий пунктир, а гола
   THREE.Line — ні: анімований штрих тут доводиться крутити через dasharray.

   Фази взяті ті самі, що й у «мурашках» КОСТИЛА, щоб слід рухався в одному
   ритмі з рештою анімацій застосунку. */
var ANTS = [[0,4,3],[0.5,4,2.5],[1,4,2],[1.5,4,1.5],[2,4,1],[2.5,4,0.5],[3,4,0],
  [0,0.5,3,3.5],[0,1,3,3],[0,1.5,3,2.5],[0,2,3,2],[0,2.5,3,1.5],[0,3,3,1],[0,3.5,3,0.5]];

function Track(map, opts){
  opts = opts || {};
  this.map = map;
  this.id = opts.id || 'teren-track';
  this.tracks = {};                  // id → {c:[[lon,lat],…], color}
  this.max = opts.max || 160;        // точок на слід
  this.minKm = opts.minKm || 0.2;    // поріг, щоб не плодити точки на місці
  this.phase = 0;
  this.dirty = false;
  this.timer = null;
  this.on = opts.visible !== false;
}

Track.prototype.ensure = function(before){
  var map = this.map, id = this.id;
  if(map.getSource(id)) return;
  map.addSource(id, {type:'geojson', data:{type:'FeatureCollection', features:[]}});
  map.addLayer({id:id + '-line', type:'line', source:id,
    layout:{'line-cap':'round', 'line-join':'round',
      visibility:this.on ? 'visible' : 'none'},
    paint:{
      'line-color':['get','color'],
      'line-width':['interpolate',['linear'],['zoom'], 4, 1.1, 10, 1.8, 15, 2.6],
      'line-opacity':0.42,
      'line-dasharray':[0,4,3]
    }}, before);
};

Track.prototype.push = function(id, ll, color){
  var t = this.tracks[id];
  if(!t){ t = this.tracks[id] = {c:[], color:color || '#ff3b30'}; }
  var c = t.c, last = c[c.length - 1];
  if(last){
    var dx = (ll[0] - last[0]) * Math.cos(ll[1] * Math.PI / 180) * 111.32;
    var dy = (ll[1] - last[1]) * 110.57;
    if(dx * dx + dy * dy < this.minKm * this.minKm) return;
  }
  c.push([ll[0], ll[1]]);
  if(c.length > this.max) c.shift();
  this.dirty = true;
  this.run();
};

Track.prototype.drop = function(id){
  if(!this.tracks[id]) return;
  delete this.tracks[id];
  this.dirty = true;
  this.flush();
};

Track.prototype.clear = function(){
  this.tracks = {};
  this.dirty = true;
  this.flush();
};

Track.prototype.flush = function(){
  var src = this.map.getSource(this.id);
  if(!src) return;
  var f = [];
  for(var k in this.tracks){
    var t = this.tracks[k];
    if(t.c.length < 2) continue;
    f.push({type:'Feature', properties:{color:t.color},
      geometry:{type:'LineString', coordinates:t.c}});
  }
  try { src.setData({type:'FeatureCollection', features:f}); } catch(e){}
  this.dirty = false;
};

/* Один таймер на всі сліди: і зсув пунктиру, і злив накопичених точок.
   setData на кожному русі цілі коштував би дорожче за саму анімацію. */
Track.prototype.run = function(){
  if(this.timer) return;
  var self = this;
  this.timer = setInterval(function(){
    var any = false;
    for(var k in self.tracks){ any = true; break; }
    if(!any){ clearInterval(self.timer); self.timer = null; return; }
    if(self.dirty) self.flush();
    if(document.hidden || !self.on) return;
    /* Кожен зсув пунктиру — це повна перемальовка мапи. Поки жоден слід не
       потрапляє у вікно, марширувати нема перед ким: пропускаємо й даємо
       мапі стати на idle. */
    if(!self.inView()) return;
    self.phase = (self.phase + 1) % ANTS.length;
    try { self.map.setPaintProperty(self.id + '-line', 'line-dasharray', ANTS[self.phase]); }
    catch(e){}
  }, 100);
};

/* Чи видно бодай один слід. Перевіряємо кінець сліду (голову цілі) — саме
   там пунктир і читається; рахунок кешуємо на 400 мс. */
Track.prototype.inView = function(){
  var now = Date.now();
  if(now - (this._vAt || 0) < 400) return this._v !== false;
  this._vAt = now;
  var b = null;
  try { b = this.map.getBounds(); } catch(e){}
  if(!b){ this._v = true; return true; }
  var w = b.getEast() - b.getWest(), h = b.getNorth() - b.getSouth();
  var x0 = b.getWest() - w * 0.25, x1 = b.getEast() + w * 0.25;
  var y0 = b.getSouth() - h * 0.25, y1 = b.getNorth() + h * 0.25;
  this._v = false;
  for(var k in this.tracks){
    var c = this.tracks[k].c, p = c[c.length - 1];
    if(!p) continue;
    if(p[0] >= x0 && p[0] <= x1 && p[1] >= y0 && p[1] <= y1){ this._v = true; break; }
  }
  return this._v;
};

Track.prototype.setVisible = function(v){
  this.on = !!v;
  try { this.map.setLayoutProperty(this.id + '-line', 'visibility', v ? 'visible' : 'none'); }
  catch(e){}
};

/* ═══════════════════════ ШАР ═══════════════════════ */
function KostylLayer(opts){
  opts = opts || {};
  this.id = opts.id || 'teren-3d';
  this.type = 'custom';
  this.renderingMode = '3d';
  this.slot = opts.slot;

  this.map = null;
  this.scene = null;
  this.camera = null;
  this.renderer = null;
  this.fx = null;

  this.items = {};                            // id → {group, lon, lat, alt, ...}
  this.origin = null;                         // {x, y, z, scale, lat}
  this.lastT = 0;
  this.spin = 0;                              // фаза для пропелерів і факелів
  this.visible = opts.visible !== false;
  this.minZoom = opts.minZoom == null ? 0 : opts.minZoom;
  /* Shahed завдовжки 3.5 м на z10 — це соті пікселя. Тому модель тягнеться
     до сталого екранного розміру iconPx, поки зум не підійде настільки, що
     справжні метри вже більші — далі йде чесний масштаб 1:1. */
  this.stretch = opts.stretch !== false;
  this.iconPx = opts.iconPx || 38;
  /* Стеля розтягування була 4000 — на зумі 4–5 десятиметрова модель
     упиралась у неї й тануло до 2–3 пікселів, тобто просто зникала. Тепер
     модель тримає iconPx на будь-якому зумі. */
  this.stretchMax = opts.stretchMax || 1e7;
  /* Підсилення вертикалі. 2 км висоти на зумі 7 — це кілька пікселів,
     і будь-яка ціль виглядає «по землі». Тож при віддаленні вертикаль
     плавно підсилюємо (×1 з зуму ~11 і до vexMax на рівні країни).
     У картках і хронології висоти завжди справжні — це лише показ. */
  this.vexMax = opts.vexMax || 18;
  this.vexOn = opts.vex !== false;
  this._gnd = {}; this._gndN = 0;
  this.onPick = opts.onPick || null;
  this.trailsOn = opts.trails !== false;
  this.o = opts;
  this._z = -1;
  /* Пропелери, ротори й факели крутились на КОЖНОМУ кадрі: render() просив
     triggerRepaint(), той викликав render() — і мапа малювалась 60 разів на
     секунду, поки на ній є бодай один дрон. З рельєфом і драпіруванням це
     означало постійну повну перемальовку сітки висот. Тепер оберти йдуть по
     таймеру: 20 Гц на пласкій мапі, 12 Гц із рельєфом — на око те саме, а
     повних кадрів у 3–5 разів менше. Якщо жодної анімованої моделі немає у
     вікні, таймер не заводиться взагалі і мапа нарешті стає на idle. */
  this.animHz = opts.animHz || 20;
  this.animHzTerrain = opts.animHzTerrain || 12;
  this._animT = null;      // таймер наступного оберту
  this._animAt = 0;        // час останнього оберту
  this._visAt = 0;         // коли востаннє рахували видимість
  this._visAny = true;     // чи є анімована модель у вікні
  /* матриці камери — одні й ті самі обʼєкти на всі кадри */
  this._m = null; this._t = null; this._sc = null; this._rx = null;
}

/* Чи крутиться щось У ВІКНІ. Рахуємо не частіше ніж раз на 300 мс: список
   цілей міняється повільніше за кадри, а getBounds() на кожній моделі щокадру
   коштував би дорожче за саму анімацію. */
KostylLayer.prototype._animVisible = function(now){
  if(now - this._visAt < 300) return this._visAny;
  this._visAt = now;
  var any = false, b = null;
  try { b = this.map.getBounds(); } catch(e){}
  if(!b){ this._visAny = true; return true; }
  /* запас у чверть вікна: модель на краю ще видно, і «моргання» на межі
     нам ні до чого */
  var w = b.getEast() - b.getWest(), h = b.getNorth() - b.getSouth();
  var x0 = b.getWest() - w * 0.25, x1 = b.getEast() + w * 0.25;
  var y0 = b.getSouth() - h * 0.25, y1 = b.getNorth() + h * 0.25;
  for(var k in this.items){
    var it = this.items[k], p = it.parts;
    var spins = (p && (p.props || p.rotors || p.tail)) || (it.flame && it.flame.userData.pulse);
    if(!spins) continue;
    if(it.lon >= x0 && it.lon <= x1 && it.lat >= y0 && it.lat <= y1){ any = true; break; }
  }
  this._visAny = any;
  return any;
};

/* Наступний оберт — таймером, а не наступним кадром. */
KostylLayer.prototype._pulse = function(){
  if(this._animT || !this.map) return;
  var self = this, hz = this.animHz;
  try { if(this.map.getTerrain()) hz = this.animHzTerrain; } catch(e){}
  this._animT = setTimeout(function(){
    self._animT = null;
    if(document.hidden) return;      // у фоні не крутимо нічого
    self.repaint();
  }, Math.max(16, 1000 / hz));
};

/* ─────────────── життєвий цикл MapLibre ─────────────── */
KostylLayer.prototype.onAdd = function(map, gl){
  this.map = map;
  this.camera = new THREE.Camera();
  this.scene = new THREE.Scene();
  this.root = new THREE.Group();
  this.scene.add(this.root);

  this.renderer = new THREE.WebGLRenderer({
    canvas: map.getCanvas(), context: gl, antialias: true
  });
  this.renderer.autoClear = false;

  if(window.KostylFX) this.fx = new window.KostylFX(this.root);
  /* Стиль може перезібратись, і тоді onAdd приходить удруге. Новий Track із
     тим самим id бився б за одне джерело зі старим: той кожні 66 мс писав би
     назад свої старі сліди й смикав пунктир у протифазі. Тому Track один
     на весь час життя шару. */
  if(!this.track) this.track = new Track(map, {visible:this.trailsOn, id:this.id + '-track'});
  this.track.map = map;
  this.track.ensure(this.o.before);
  this.setOrigin(map.getCenter());
  this.lastT = performance.now();
};

/* Перезбирання стилю забирає шар із мапи. bindNeptun тримає власний реєстр
   seen у замиканні — без скидання він думає, що цілі вже додані, і після
   повернення шару малює лише move() по неіснуючих обʼєктах. */
KostylLayer.prototype.onRemove = function(){
  if(this.onReattach) this.onReattach();
  if(this.fx) this.fx.clear();
  if(this.track && this.track.timer){ clearInterval(this.track.timer); this.track.timer = null; }
  this.root && this.root.clear && this.root.clear();
  this.items = {};
  this.root = null;                 // сцена пішла разом із шаром
};

/* Початок координат сцени. Тримаємо його біля центру екрана: що ближче
   об'єкти до нього, то менша похибка розміру. Перезадається на moveend. */
KostylLayer.prototype.setOrigin = function(ll){
  var mc = maplibregl.MercatorCoordinate.fromLngLat(ll, 0);
  this.origin = {
    x: mc.x, y: mc.y, z: mc.z,
    scale: mc.meterInMercatorCoordinateUnits(),
    lat: ll.lat != null ? ll.lat : ll[1]
  };
  /* Слід переїзду не боїться — він у геокоординатах на окремому шарі мапи.
     Переставляємо лише те, що справді живе в сцені. */
  for(var k in this.items) this.place(this.items[k]);
};

/* lon/lat/alt → координати сцени (метри від origin) */
KostylLayer.prototype.toScene = function(lon, lat, alt){
  var o = this.origin;
  var mc = maplibregl.MercatorCoordinate.fromLngLat([lon, lat], alt || 0);
  return new THREE.Vector3(
    (mc.x - o.x) / o.scale,
    (mc.z - o.z) / o.scale,            // висота → y сцени
    (mc.y - o.y) / o.scale
  );
};

/* Висота рельєфу під точкою, м — уже з перебільшенням рельєфу мапи
   (так її і малює MapLibre). Без цього наземні моделі стояли б на рівні
   моря, тобто ПІД поверхнею, і рельєф їх просто ховав. */
KostylLayer.prototype.groundAt = function(lon, lat){
  var map = this.map;
  if(!map || !map.getTerrain || !map.getTerrain()) return 0;
  var k = lon.toFixed(3) + ',' + lat.toFixed(3), c = this._gnd[k], now = performance.now();
  if(c && now - c.t < 2500) return c.v;
  var v = 0;
  try { v = map.queryTerrainElevation([lon, lat]) || 0; } catch(e){ v = 0; }
  /* DEM terrarium несе й батиметрію: дно Чорного моря — до −2200 м, і
     MapLibre малює підкладку саме по ньому. Тож від'ємні висоти — справжні,
     і корабель має стояти на тій самій поверхні, що й намальоване море.
     Відкидаємо лише явне сміття битого тайла (−10 000 м і нижче). */
  var ex = 1;
  try { ex = (map.getTerrain() || {}).exaggeration || 1; } catch(e){}
  if(!isFinite(v) || v < -9000 * ex) v = 0;
  if(++this._gndN > 6000){ this._gnd = {}; this._gndN = 0; }
  this._gnd[k] = {v:v, t:now};
  return v;
};
/* ДЕМО ховає справжні борти зі стрічки, не чіпаючи все інше. Прапорець живе
   в шарі, а не в застосунку, бо цілі приходять із фіду між кадрами: інакше
   кожна нова ціль зʼявлялась би поверх демо, поки хтось не сховає її вручну.
   isFeed(id) вирішує, що саме «зі стрічки» — шар про назви id не знає. */
KostylLayer.prototype.setFeedHidden = function(v, isFeed){
  this.feedHidden = !!v;
  if(isFeed) this.isFeed = isFeed;
  var f = this.isFeed || function(){ return false; };
  for(var k in this.items){
    var it = this.items[k];
    if(it.group) it.group.visible = !(this.feedHidden && f(k));
  }
  /* Слід — один спільний шар на всі борти, тож ховати його цілком не можна:
     разом зі справжніми зникли б і сліди нальоту. Прибираємо саме доріжки
     схованих цілей. */
  if(this.track){
    for(var j in this.track.tracks) if(this.feedHidden && f(j)) delete this.track.tracks[j];
    this.track.dirty = true;
    if(this.track.flush) this.track.flush();
  }
  this.repaint();
};
KostylLayer.prototype.vex = function(){
  if(!this.vexOn || !this.map) return 1;
  var z = this.map.getZoom();
  return Math.max(1, Math.min(this.vexMax, Math.pow(2, (11 - z) * 0.85)));
};
/* висота показу: земля + справжня висота × підсилення */
KostylLayer.prototype.zOf = function(lon, lat, alt){
  return this.groundAt(lon, lat) + (alt || 0) * this.vex();
};
/* зміна зуму чи рельєфу — переставляємо все, що живе в сцені */
KostylLayer.prototype.replaceAll = function(){
  for(var k in this.items) this.place(this.items[k]);
  this.repaint();
};

/* зворотне: сцена → lon/lat */
KostylLayer.prototype.toLngLat = function(v){
  var o = this.origin;
  return new maplibregl.MercatorCoordinate(
    o.x + v.x * o.scale, o.y + v.z * o.scale, o.z + v.y * o.scale
  ).toLngLat();
};

/* ─────────────── об'єкти ───────────────
   add({id, key, lon, lat, alt, hdg, color, scale, plat, meta})
     key   ключ у TERRAIN_SPECS.SPEC (борт) або .PLAT (носій/техніка)
     hdg   курс, °; 0 — на північ
     alt   висота, м; якщо не задано — беремо з профілю польоту (fr)
     fr    частка пройденого шляху 0..1 — для автовисоти                */
KostylLayer.prototype.add = function(d){
  var S = window.TERRAIN_SPECS, M = window.MODELS;
  if(!S || !M) return null;
  /* Сцена зʼявляється в onAdd, коли MapLibre справді додала шар. До того
     (або після перезбирання стилю) класти в неї нічого: мовчки відмовляємо,
     бо падати посеред кадру симуляції гірше, ніж пропустити одну ціль. */
  if(!this.root) return null;
  var spec = S.SPEC[d.key] || S.PLAT[d.key];
  if(!spec){ return null; }

  var f = M[spec.mdl];
  if(typeof f !== 'function') return null;

  var col = d.color != null ? d.color : hex(spec.col || '#ff3b30');
  var built = OPTS_ARG[spec.mdl] ? f({color: col})
            : spec.mdl === 'car'  ? f(d.body || 'sedan', col)
            : f(col);
  if(!built || !built.group) return null;
  var g = built.group;

  /* модель зроблена в своїх метрах; тягнемо до довжини прототипу */
  var box = new THREE.Box3().setFromObject(g);
  var own = box.getSize(new THREE.Vector3()).z || 1;
  var k = (spec.len || own) / own;
  g.scale.setScalar(k * (d.scale || 1));

  var wrap = new THREE.Group();
  wrap.add(g);
  this.root.add(wrap);

  var it = {
    id: d.id, key: d.key, spec: spec, group: wrap, model: g, parts: built.parts || {},
    lon: d.lon, lat: d.lat, alt: d.alt, fr: d.fr, hdg: d.hdg || 0,
    pitch: d.pitch || 0, roll: d.roll || 0, tilt: d.tilt || 0,
    baseScale: k * (d.scale || 1), meta: d.meta || null,
    trail: null
  };
  it.col = typeof spec.col === 'string' ? spec.col : '#ff3b30';
  it.wantTrail = !!d.trail;
  /* Джерело віддало СПРАВЖНІЙ пройдений шлях — кладемо його одразу, замість
     того щоб малювати слід із нуля від моменту, коли ми вперше побачили
     ціль. Це різниця між «звідки вона летить» і «відколи ми дивимось». */
  if(it.wantTrail && this.track && d.path && d.path.length > 1){
    for(var pi = 0; pi < d.path.length; pi++)
      this.track.push(d.id, d.path[pi], it.col);
  }
  /* Стійка висоти: тонка вертикаль від точки на землі до самої цілі.
     Без неї ціль на 12 км висоти при нахиленій камері висить казна-де
     відносно свого ґрунтового положення, і мапа бреше про те, ДЕ вона. */
  var stalkGeo = new THREE.BufferGeometry().setAttribute('position',
    new THREE.BufferAttribute(new Float32Array(6), 3));
  stalkGeo.__teren = 1;
  it.stalk = new THREE.Line(stalkGeo,
    new THREE.LineBasicMaterial({color:hex(it.col), transparent:true,
      opacity:0.3, depthWrite:false}));
  it.stalk.frustumCulled = false;
  it.stalk.visible = false;
  this.root.add(it.stalk);
  /* Факел для всього, що з двигуном і летить. Довжина — в ОДИНИЦЯХ МОДЕЛІ
     (вузол сопла всередині неї), тож беремо власний габарит, а не spec.len,
     інакше нормалізація k помножила б факел удруге. */
  if(this.fx && spec.cat && spec.cat !== 'artillery' && built.parts && built.parts.nozzle){
    var fl = this.fx.flame(hex(flameOf(spec)), own * 0.5, own * 0.075);
    built.parts.nozzle.add(fl);
    it.flame = fl;
  }
  this.items[d.id] = it;
  /* ціль прийшла зі стрічки, поки ми в ДЕМО — одразу ховаємо, щоб вона не
     блимнула на чистій мапі між кадрами */
  if(this.feedHidden && this.isFeed && this.isFeed(d.id) && it.group) it.group.visible = false;
  this.place(it);
  this.repaint();
  return it;
};

/* оновити позицію/курс наявного об'єкта */
KostylLayer.prototype.move = function(id, d){
  if(!this.root) return null;
  var it = this.items[id];
  if(!it) return null;
  if(d.lon != null) it.lon = d.lon;
  if(d.lat != null) it.lat = d.lat;
  if(d.alt != null) it.alt = d.alt;
  if(d.fr != null) it.fr = d.fr;
  if(d.hdg != null) it.hdg = d.hdg;
  if(d.pitch != null) it.pitch = d.pitch;
  if(d.roll != null) it.roll = d.roll;
  if(d.tilt != null) it.tilt = d.tilt;
  this.place(it);
  this.repaint();
  return it;
};

KostylLayer.prototype.remove = function(id){
  if(!this.root) return;
  var it = this.items[id];
  if(!it) return;
  if(this.track) this.track.drop(id);
  if(it.stalk){ this.root.remove(it.stalk); it.stalk.geometry.dispose();
    if(it.stalk.material && it.stalk.material.dispose) it.stalk.material.dispose(); }
  /* Кожен add() будує модель наново, а THREE не звільняє GPU-буфери по GC.
     Без явного dispose нічне чергування з живим фідом за кілька годин
     набирає тисячі покинутих VBO — і контекст WebGL помирає. Геометрії з
     кешу MODELS шаряться між інстансами, тож чіпаємо лише небазові. */
  it.group.traverse(function(n){
    if(n.geometry && n.geometry.__teren) n.geometry.dispose();
  });
  this.root.remove(it.group);
  delete this.items[id];
  this.repaint();
};

KostylLayer.prototype.clear = function(){
  for(var k in this.items) this.remove(k);
  if(this.track) this.track.clear();
};

/* поставити об'єкт у сцену за його lon/lat/alt/курсом */
KostylLayer.prototype.place = function(it){
  var S = window.TERRAIN_SPECS;
  /* Висота: спершу та, що прийшла з фіду (це справжні дані), і лише якщо її
     немає — крейсерська з профілю типу. Здогад ніколи не перекриває факт. */
  var alt = it.alt;
  if(alt == null && it.fr != null && S) alt = S.altAt(it.spec, it.fr);
  if(alt == null) alt = 0;
  it.altShown = alt;
  var g0 = this.groundAt(it.lon, it.lat);
  var v = this.toScene(it.lon, it.lat, g0 + alt * this.vex());
  it.group.position.copy(v);
  /* Розворот носом уперед. Сцена повернута на 90° по X, тож +Z у ній дивиться
     на ПІВДЕНЬ (меркаторний y росте вниз), а ніс моделі — у +Z. Отже при
     нульовому куті борт стояв би хвостом на північ, тобто рівно навпаки.
     Поворот навколо Y на θ веде ніс у (sin θ, 0, cos θ), і щоб курс 0°
     дивився на північ (0,0,−1), а 90° — на схід (1,0,0), треба θ = π − курс.
     Стара формула −курс давала і зсув на 180°, і обернений бік обертання. */
  /* Тангаж і крен. Порядок YXZ: спершу крен навколо поздовжньої осі
     моделі, потім тангаж навколо поперечної, наостанок курс. Ніс угору —
     це поворот навколо X на ВІД'ЄМНИЙ кут (+Z іде в +Y), правий крен —
     на додатний навколо Z (лівим крилом у моделі є +X).
     Тангаж траєкторії показуємо з тим самим підсиленням, що й висоту:
     шахед на наборі 6° при вертикалі ×18 візуально лізе під 60°, і ніс
     мусить дивитись туди ж, куди йде слід, інакше борт летить «боком».
     tilt — поза тіла (вертоліт із опущеним носом) і не підсилюється. */
  var R = Math.PI / 180;
  var gam = Math.max(-89, Math.min(89, it.pitch || 0)) * R;
  var shown = Math.atan(Math.tan(gam) * this.vex()) + (it.tilt || 0) * R;
  it.group.rotation.set(-shown, Math.PI - it.hdg * R, (it.roll || 0) * R, 'YXZ');
  /* компенсація меркатора за широтою: метр там ≠ метр в origin */
  var corr = Math.cos(this.origin.lat * Math.PI / 180) /
             Math.cos(it.lat * Math.PI / 180);
  it.corr = corr;
  it.model.scale.setScalar(it.baseScale * corr * this.stretchFor(it.spec.len));

  /* стійка: від землі під ціллю до самої цілі */
  if(it.stalk){
    if(alt > 150){
      var g = this.toScene(it.lon, it.lat, g0);
      var a = it.stalk.geometry.attributes.position.array;
      a[0] = g.x; a[1] = g.y; a[2] = g.z;
      a[3] = v.x; a[4] = v.y; a[5] = v.z;
      it.stalk.geometry.attributes.position.needsUpdate = true;
      it.stalk.geometry.computeBoundingSphere();
      it.stalk.visible = true;
    } else it.stalk.visible = false;
  }

  /* слід ховається разом із самою моделлю: у ДЕМО справжні борти невидимі,
     і їхні пунктири на чистій мапі виглядали б як цілі нальоту */
  if(it.wantTrail && this.track &&
     !(this.feedHidden && this.isFeed && this.isFeed(it.id)))
    this.track.push(it.id, [it.lon, it.lat], it.col);
};

/* метрів на піксель у центрі екрана (тайли 512 px) */
KostylLayer.prototype.mPerPx = function(){
  if(!this.map) return 1;
  var lat = this.map.getCenter().lat;
  return 78271.517 * Math.cos(lat * Math.PI / 180) / Math.pow(2, this.map.getZoom());
};

/* Множник розміру для моделі завдовжки len метрів: тягнемо до iconPx пікселів,
   але ніколи не зменшуємо нижче справжніх метрів — щойно зум підійшов
   достатньо близько, борт стає рівно таким, який він є. */
/* Екранний розмір моделі за зумом: ~iconPx зблизька і ~55 % від нього на
   рівні країни. Сталі 34 px на зумі 5 означали, що десяток бортів
   закривав пів мапи країни. */
KostylLayer.prototype.pxNow = function(){
  if(!this.map) return this.iconPx;
  var z = this.map.getZoom();
  var k = Math.max(0.55, Math.min(1, 0.55 + 0.45 * (z - 5) / 4));
  return this.iconPx * k;
};
KostylLayer.prototype.stretchFor = function(len){
  if(!this.stretch || !this.map || !len) return 1;
  var want = this.pxNow() * this.mPerPx() / len;
  return Math.max(1, Math.min(this.stretchMax, want));
};

/* перерахувати розміри після зміни зуму */
KostylLayer.prototype.restretch = function(){
  for(var k in this.items){
    var it = this.items[k];
    it.model.scale.setScalar(it.baseScale * (it.corr || 1) * this.stretchFor(it.spec.len));
  }
};

/* ─────────────── ефекти ─────────────── */

/* Радіус ефекту в метрах сцени. Вибух у 90 м на z8 — менш ніж піксель, тому
   тримаємо нижню межу в пікселях; щойно справжні метри більші — беремо їх. */
KostylLayer.prototype.fxR = function(r, minPx){
  return Math.max(r, (minPx || 26) * this.mPerPx());
};

/* приліт у точку: вогняна куля + слід на землі */
KostylLayer.prototype.boom = function(lon, lat, r, opts){
  if(!this.fx) return;
  var g0 = this.groundAt(lon, lat);
  var v = this.toScene(lon, lat, g0 + ((opts && opts.alt) || 0) * this.vex());
  var R = this.fxR(r || 80, 26);
  opts = opts || {};
  opts.groundY = this.toScene(lon, lat, g0).y;
  this.fx.boom(v, R, opts);
  if(!opts || opts.scar !== false) this.fx.scar(v, R * 1.6, 120);
  this.repaint();
};

/* збиття в повітрі */
KostylLayer.prototype.intercept = function(lon, lat, alt, r){
  if(!this.fx) return;
  this.fx.intercept(this.toScene(lon, lat, this.zOf(lon, lat, alt || 0)), this.fxR(r || 45, 18));
  this.repaint();
};

/* черга ППО: від позиції до цілі */
KostylLayer.prototype.tracer = function(from, to, color){
  if(!this.fx) return;
  var a = this.toScene(from[0], from[1], this.zOf(from[0], from[1], from[2] || 0));
  var b = this.toScene(to[0], to[1], this.zOf(to[0], to[1], to[2] || 0));
  this.fx.tracer(a, b, color, Math.max(1400, a.distanceTo(b) / 1.1));
  this.repaint();
};

/* ─────────────── малювання ─────────────── */
KostylLayer.prototype.render = function(gl, args){
  if(!this.visible) return;
  var map = this.map;
  if(map.getZoom() < this.minZoom) return;

  var now = performance.now();
  var dt = Math.min(0.1, (now - this.lastT) / 1000);
  this.lastT = now;
  this.spin += dt;

  /* зум поїхав — перетягуємо моделі до екранного розміру.
     Поріг був 0.01, тобто під час будь-якого плавного зуму replaceAll()
     переставляв УСІ моделі щокадру. Великий стрибок обробляємо одразу,
     дрібний — раз на 120 мс: на око те саме, роботи набагато менше. */
  var z = map.getZoom(), self = this;
  if(Math.abs(z - this._z) > 0.35){
    if(this._zT){ clearTimeout(this._zT); this._zT = null; }
    this._z = z; this.replaceAll();
  } else if(Math.abs(z - this._z) > 0.01 && !this._zT){
    this._zT = setTimeout(function(){
      self._zT = null;
      if(!self.map) return;
      self._z = self.map.getZoom(); self.replaceAll();
    }, 120);
  }

  /* Анімовані частини. Крутимо не щокадру, а по таймеру — і тільки якщо
     анімована модель узагалі є у вікні. Ефекти (вибухи, факели пусків)
     живуть лічені секунди й лишаються на повній частоті. */
  var spinDue = now - this._animAt >= (1000 / this.animHz) - 4;
  var wantSpin = false;
  if(spinDue && this._animVisible(now)){
    var adt = Math.min(0.2, (now - this._animAt) / 1000);
    this._animAt = now;
    for(var k in this.items){
      var it = this.items[k];
      var p = it.parts;
      if(p && p.props) { p.props.forEach(function(pr){ pr.rotation.z += adt * 46; }); wantSpin = true; }
      if(p && p.rotors){ p.rotors.forEach(function(r){
        r.rotation.y += adt * 24 * (r.userData && r.userData.dir ? r.userData.dir : 1); }); wantSpin = true; }
      if(p && p.tail)  { p.tail.rotation.x += adt * 30; wantSpin = true; }
      if(it.flame && it.flame.userData.pulse){ it.flame.userData.pulse(this.spin); wantSpin = true; }
    }
  } else if(this._visAny){
    wantSpin = true;                 // у вікні є що крутити — просто ще не час
  }
  var fxBusy = !!(this.fx && this.fx.step(dt));

  /* камера: проєкція мапи × перенос у початок сцени × поворот осей.
     Матриці — сталі обʼєкти: чотири нові Matrix4 на кожен кадр давали
     помітний сміттєзбирач на телефоні при живому фіді. */
  var o = this.origin;
  if(!this._m){ this._m = new THREE.Matrix4(); this._t = new THREE.Matrix4();
    this._sc = new THREE.Matrix4(); this._rx = new THREE.Matrix4(); }
  this._m.fromArray(args && args.defaultProjectionData ? args.defaultProjectionData.mainMatrix : args);
  this._t.makeTranslation(o.x, o.y, o.z);
  this._sc.makeScale(o.scale, -o.scale, o.scale);
  this._rx.makeRotationX(Math.PI / 2);
  this._t.multiply(this._sc).multiply(this._rx);
  this.camera.projectionMatrix = this._m.multiply(this._t);

  this.renderer.resetState();
  this.renderer.render(this.scene, this.camera);
  /* Ефекти — наступним кадром, оберти — наступним тактом таймера.
     Якщо немає ні того, ні того, мапа спокійно йде на idle. */
  if(fxBusy) map.triggerRepaint();
  else if(wantSpin) this._pulse();
};

KostylLayer.prototype.repaint = function(){
  /* Невидимий шар не має просити кадрів. Поки відкритий купол, мапа накрита
     цілком, а числення шляху далі смикало triggerRepaint пʼять разів на
     секунду — тобто телефон малював мапу, якої ніхто не бачить. */
  if(!this.visible) return;
  if(this.map) this.map.triggerRepaint();
};

KostylLayer.prototype.setVisible = function(v){
  this.visible = !!v;
  if(this.track) this.track.setVisible(!!v && this.trailsOn);
  this.repaint();
};

/* слід окремим тумблером від самих моделей */
KostylLayer.prototype.setTrails = function(v){
  this.trailsOn = !!v;
  if(this.track) this.track.setVisible(this.visible && this.trailsOn);
};

/* ПОВНИЙ МАРШРУТ. Звичайний слід — останні 160 точок і не частіше ніж що
   200 м: цього досить, щоб побачити, звідки ціль підходить, і не досить,
   щоб побачити весь її шлях за годину польоту. З увімкненим повним
   маршрутом слід не обрізається взагалі — від першої точки, яку ми (або
   джерело у своєму шлейфі) побачили, і до зараз.

   Чому це не типово: шахед за дві години дає під тисячу точок на ціль, а
   на мапі їх може бути півсотні. Лінія при цьому лишається лінією, але
   setData на кожному оновленні стає помітно дорожчим. */
KostylLayer.prototype.setFullTrail = function(v){
  this.fullTrail = !!v;
  if(!this.track) return;
  this.track.max = this.fullTrail ? 100000 : (this.o.max || 160);
  /* Дрібніший поріг: на повному маршруті важить форма, а не економія. */
  this.track.minKm = this.fullTrail ? 0.08 : 0.2;
};

/* ═══════════════════════ ПІДКЛЮЧЕННЯ ═══════════════════════
   KostylLayer.attach(map, opts) — створює шар, чіпляє на мапу й
   перезадає початок координат, коли камера поїхала далеко.       */
KostylLayer.attach = function(map, opts){
  var L = new KostylLayer(opts);
  /* Чекати на `load` не можна: подія одноразова, і якщо на момент виклику
     вона вже відбулась, а стиль ще не був готовий, обробник не спрацює
     ніколи — шар тихо не додається, а сцени просто немає. Тому пробуємо
     одразу й далі на кожному styledata, який приходить і після
     перезбирання стилю (зміна підкладки забирає власні шари з собою). */
  function add(){
    if(map.getLayer(L.id)) return true;
    try { map.addLayer(L); return true; } catch(e){ return false; }
  }
  /* Ані `load`, ані isStyleLoaded() тут не годяться як умова: перша подія
     одноразова й могла вже минути, а друга встигає стати true БЕЗ жодного
     наступного styledata — і тоді шар не додається ніколи. Тому просто
     пробуємо, поки не вийде, з обмеженою кількістю спроб. */
  if(!add()){
    var n = 0, t = setInterval(function(){ if(add() || ++n > 80) clearInterval(t); }, 120);
  }
  map.on('styledata', function(){ add(); });
  /* рельєф довантажився або змінилось його перебільшення: кеш висот
     застарів, і моделі треба поставити на нову поверхню */
  var gT = null;
  function regrnd(){ if(gT) clearTimeout(gT);
    gT = setTimeout(function(){ L._gnd = {}; L._gndN = 0; if(L.root) L.replaceAll(); }, 350); }
  map.on('terrain', regrnd);
  /* Не 'idle': у MapLibre 5 він приходить після кожного тихого кадру, а
     replaceAll сам просить кадр — виходила вічна петля перемальовування.
     Слухаємо саме довантаження тайлів рельєфу. */
  map.on('sourcedata', function(e){
    if(e && e.tile && (e.sourceId === 'dem' || e.sourceId === 'demhs') && map.getTerrain && map.getTerrain()) regrnd();
  });
